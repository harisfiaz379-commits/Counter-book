<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0F5C57">
<title>Counter Book</title>
<style>
  :root{
    --page:#F3F6F7; --header:#0F5C57; --headerSub:#CFE9E5;
    --primary:#0F5C57; --primarySoft:#E4F1EF;
    --text:#1B2430; --muted:#7C8A99; --faint:#A9B4BE;
    --border:#E2E8F0; --card:#FFFFFF;
    --success:#0E9F6E; --successSoft:#E5F8F1;
    --danger:#DC3B2C; --dangerSoft:#FCEAE8;
    --warning:#B4650A; --warningSoft:#FDF3E3;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;background:var(--page);color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;}
  #app{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;}
  header{background:var(--header);color:#fff;padding:18px 16px 14px;position:sticky;top:0;z-index:30;
    box-shadow:0 1px 3px rgba(0,0,0,.15);display:flex;justify-content:space-between;align-items:flex-start;}
  header h1{margin:0;font-size:18px;font-weight:700;}
  header p{margin:2px 0 0;font-size:12px;color:var(--headerSub);}
  #fullscreenBtn{background:rgba(255,255,255,.18);color:#fff;border:none;border-radius:8px;
    padding:6px 10px;font-size:11px;font-weight:600;cursor:pointer;}
  #banner{font-size:12px;padding:8px 16px;background:var(--warningSoft);color:var(--warning);
    border-bottom:1px solid #F0DCB0;display:none;align-items:center;gap:6px;}
  main{flex:1;padding:14px 12px 100px;max-width:560px;margin:0 auto;width:100%;}
  nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--border);
    display:flex;justify-content:space-around;padding:6px 4px calc(6px + env(safe-area-inset-bottom));z-index:30;}
  nav button{background:none;border:none;display:flex;flex-direction:column;align-items:center;gap:2px;
    padding:6px 10px;border-radius:8px;color:var(--faint);font-size:10px;font-weight:500;cursor:pointer;position:relative;}
  nav button.active{color:var(--primary);font-weight:700;}
  nav button .icon{font-size:20px;line-height:1;}
  nav button .badge{position:absolute;top:0;right:2px;background:var(--danger);color:#fff;font-size:9px;
    font-weight:700;border-radius:999px;min-width:14px;height:14px;display:flex;align-items:center;justify-content:center;padding:0 3px;}
  .card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:14px;
    box-shadow:0 1px 2px rgba(0,0,0,.04);margin-bottom:12px;}
  .card.primary{background:var(--primary);color:#fff;border:none;}
  label.field-label{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.02em;color:var(--muted);display:block;margin-bottom:4px;}
  input,textarea,select{width:100%;border:1px solid var(--border);border-radius:8px;padding:10px 12px;
    font-size:16px;font-family:inherit;color:var(--text);background:#fff;}
  input:focus,textarea:focus,select:focus{outline:2px solid var(--primary);outline-offset:-1px;}
  textarea{resize:none;}
  .row{display:flex;justify-content:space-between;align-items:center;}
  .row .val{font-weight:600;}
  .row.big .lab{font-size:14px;}
  .row.big .val{font-size:20px;font-weight:700;}
  .btn{border:none;border-radius:10px;padding:11px 16px;font-size:14px;font-weight:600;cursor:pointer;}
  .btn-primary{background:var(--primary);color:#fff;}
  .btn-success{background:var(--success);color:#fff;}
  .btn-danger{background:var(--danger);color:#fff;}
  .btn-outline{background:none;border:1px solid var(--border);color:var(--muted);}
  .btn-dashed{background:none;border:2px dashed var(--primary);color:var(--primary);width:100%;padding:12px;
    border-radius:12px;display:flex;align-items:center;justify-content:center;gap:6px;font-weight:700;}
  .btn:disabled{opacity:.4;cursor:default;}
  .pill-badge{font-size:11px;font-weight:700;padding:4px 8px;border-radius:999px;}
  .small{font-size:12px;color:var(--muted);}
  .faint{color:var(--faint);}
  .mt2{margin-top:8px;}.mt3{margin-top:12px;}.mb2{margin-bottom:8px;}
  .flex{display:flex;}.gap2{gap:8px;}.gap1{gap:4px;}.flex1{flex:1;}
  .search-wrap{position:relative;}
  .search-icon{position:absolute;left:10px;top:12px;color:var(--faint);pointer-events:none;}
  .search-wrap input{padding-left:32px;}
  .dropdown{position:absolute;z-index:20;margin-top:4px;width:100%;background:#fff;border:1px solid var(--border);
    border-radius:8px;max-height:220px;overflow-y:auto;box-shadow:0 6px 20px rgba(0,0,0,.12);}
  .dropdown button{width:100%;text-align:left;padding:10px 12px;border:none;background:none;border-bottom:1px solid var(--border);
    display:flex;justify-content:space-between;align-items:center;cursor:pointer;}
  .dropdown button:last-child{border-bottom:none;}
  .item-row{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--border);}
  .item-row:last-child{border-bottom:none;}
  .modal-overlay{position:fixed;inset:0;background:rgba(15,23,30,.45);z-index:50;display:flex;
    align-items:flex-end;justify-content:center;}
  .modal{background:#fff;border-radius:16px 16px 0 0;width:100%;max-width:480px;max-height:85vh;
    display:flex;flex-direction:column;box-shadow:0 8px 30px rgba(0,0,0,.2);}
  .modal-head{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border-bottom:1px solid var(--border);}
  .modal-body{margin:12px 16px;padding:12px;background:var(--page);border:1px solid var(--border);border-radius:8px;
    font-size:12px;font-family:ui-monospace,monospace;white-space:pre-wrap;overflow-y:auto;color:var(--text);}
  .modal-actions{display:flex;gap:8px;padding:14px 16px;}
  .hidden{display:none !important;}
  #toast{position:fixed;bottom:78px;left:50%;transform:translateX(-50%);background:#1B2430;color:#fff;
    padding:10px 18px;border-radius:999px;font-size:13px;font-weight:600;z-index:60;box-shadow:0 4px 16px rgba(0,0,0,.25);}
  a.silent{color:inherit;text-decoration:none;}
  ::placeholder{color:var(--faint);}
  #invFab{position:fixed;right:16px;bottom:calc(70px + env(safe-area-inset-bottom));width:54px;height:54px;border-radius:50%;
    background:var(--primary);color:#fff;border:none;font-size:26px;line-height:1;cursor:pointer;
    box-shadow:0 4px 14px rgba(0,0,0,.25);z-index:35;display:flex;align-items:center;justify-content:center;}
  .expiry-tag{font-size:11px;font-weight:700;padding:3px 7px;border-radius:6px;display:inline-block;}
</style>
</head>
<body>
<div id="app">
  <header>
    <div>
      <h1>Counter Book</h1>
      <p>Dispensing &amp; billing</p>
    </div>
    <div class="flex gap2">
      <button id="backupBtn" onclick="toggleBackupModal()" style="background:rgba(255,255,255,.18);color:#fff;border:none;border-radius:8px;padding:6px 10px;font-size:11px;font-weight:600;cursor:pointer;">💾 Backup</button>
      <button id="fullscreenBtn" onclick="toggleFullscreen()">⛶ Full screen</button>
    </div>
  </header>
  <div id="banner"></div>
  <main id="main"></main>
  <nav id="nav"></nav>
  <button id="invFab" class="hidden" onclick="toggleInvForm()" title="Add medicine">+</button>
</div>
<div id="shareModalRoot"></div>
<div id="confirmModalRoot"></div>
<div id="invFormModalRoot"></div>
<div id="backupModalRoot"></div>
<div id="toast" class="hidden"></div>
<input type="file" id="backupFileInput" accept="application/json" class="hidden" onchange="onBackupFileSelected(event)">

<script>
/* ===================== STATE ===================== */
const CURRENCY = "Rs ";
let inventory = [];
let transactions = [];
let notes = [];
let profiles = [];
let currentProfileId = null;
let tab = "bill";
let saveError = "";
let shareText = null;

/* transient (not persisted) UI state */
let bill = { patient:"", fee:"", items:[], query:"", pills:"", selectedMedId:null, qtyMode:"total", daysMode:"perMed", perDay:"", days:"", globalDays:"", extras:[], extraAmount:"" };
let inv = { query:"", showForm:false, form:{name:"",formula:"",mg:"",mrp:"",pillsPerBox:"",lowStockAt:"10"},
            restockId:null, restockBoxes:"", restockExpiry:"", editId:null,
            editForm:{name:"",formula:"",mg:"",mrp:"",pillsPerBox:"",lowStockAt:"",stockPills:""} };
let backupUi = { open:false };
let rec = { selectedDay:null, expandedId:null, searchQuery:"", editingId:null };
let recEdit = { patient:"", fee:"", items:[], query:"", pills:"", selectedMedId:null };
let notesUi = { openId:null, draftTitle:"", draftBody:"", addingProfile:false, newProfileName:"", searchQuery:"" };

/* ===================== HELPERS ===================== */
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
function money(n){ const v=Number(n)||0; return v.toFixed(2).replace(/\.00$/,""); }
function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function fmtDateTime(ts){
  const d=new Date(ts);
  return d.toLocaleDateString(undefined,{day:"2-digit",month:"short"})+", "+d.toLocaleTimeString(undefined,{hour:"2-digit",minute:"2-digit"});
}
function sameDay(ts,ref){ return new Date(ts).toDateString()===new Date(ref).toDateString(); }

/* ===================== PERSISTENCE (localStorage) ===================== */
/* Inventory and transactions are shared — every person using this device sees the same data.
   Notes are kept separate per profile, so each person's notepad stays private to them. */
function loadAll(){
  try{ inventory = JSON.parse(localStorage.getItem("clinic_inventory")||"[]"); }catch(e){ inventory=[]; }
  // Migrate medicines saved before batch/expiry tracking existed: fold their existing
  // stock into one "no expiry recorded" batch so nothing is lost.
  inventory.forEach(m=>{
    if(!Array.isArray(m.batches)){
      m.batches = (m.stockPills>0) ? [{ id:uid(), boxes:null, pillsRemaining:m.stockPills, expiryDate:null, addedAt:Date.now(), disposed:false }] : [];
    }
    recomputeStock(m);
  });
  try{ transactions = JSON.parse(localStorage.getItem("clinic_transactions")||"[]"); }catch(e){ transactions=[]; }
  try{ profiles = JSON.parse(localStorage.getItem("clinic_profiles")||"[]"); }catch(e){ profiles=[]; }

  // Migrate an old single shared notepad (from before profiles existed) into its own profile,
  // so nobody's existing notes get lost.
  if(profiles.length===0){
    let legacy = null;
    try{ legacy = JSON.parse(localStorage.getItem("clinic_notes")||"null"); }catch(e){ legacy=null; }
    if(legacy && Array.isArray(legacy) && legacy.length){
      profiles = [{ id:"legacy", name:"Notes" }];
      localStorage.setItem("clinic_profiles", JSON.stringify(profiles));
      localStorage.setItem("clinic_notes_legacy", JSON.stringify(legacy));
    }
  }

  currentProfileId = localStorage.getItem("clinic_current_profile") || (profiles[0] ? profiles[0].id : null);
  loadNotesForCurrentProfile();
}
function saveInventory(){
  try{ localStorage.setItem("clinic_inventory", JSON.stringify(inventory)); saveError=""; }
  catch(e){ saveError="That change may not have saved. Storage might be full."; }
}
function saveTransactions(){
  try{ localStorage.setItem("clinic_transactions", JSON.stringify(transactions)); saveError=""; }
  catch(e){ saveError="That bill may not have saved. Storage might be full."; }
}
function loadNotesForCurrentProfile(){
  if(!currentProfileId){ notes=[]; return; }
  try{ notes = JSON.parse(localStorage.getItem("clinic_notes_"+currentProfileId)||"[]"); }catch(e){ notes=[]; }
}
function saveNotes(){
  if(!currentProfileId) return;
  try{ localStorage.setItem("clinic_notes_"+currentProfileId, JSON.stringify(notes)); saveError=""; }
  catch(e){ saveError="That note may not have saved. Storage might be full."; }
}
function saveProfiles(){
  try{ localStorage.setItem("clinic_profiles", JSON.stringify(profiles)); }catch(e){}
}

/* ===================== BATCHES / EXPIRY (FEFO) ===================== */
/* Every restock creates its own "batch" with its own expiry date. When medicine is
   sold, pills are drawn from the batch with the nearest expiry date first (FEFO —
   first-expiry-first-out). m.stockPills is always kept as the sum of active batches. */
function activeBatches(m){ return (m.batches||[]).filter(b=>!b.disposed && b.pillsRemaining>0); }
function recomputeStock(m){ m.stockPills = activeBatches(m).reduce((s,b)=>s+b.pillsRemaining,0); }
function fefoOrder(m){
  return activeBatches(m).slice().sort((a,b)=>{
    const ea = a.expiryDate ? new Date(a.expiryDate).getTime() : Infinity;
    const eb = b.expiryDate ? new Date(b.expiryDate).getTime() : Infinity;
    if(ea!==eb) return ea-eb;
    return (a.addedAt||0)-(b.addedAt||0);
  });
}
function deductStock(m, pills){
  let remaining = pills;
  for(const b of fefoOrder(m)){
    if(remaining<=0) break;
    const take = Math.min(b.pillsRemaining, remaining);
    b.pillsRemaining -= take;
    remaining -= take;
  }
  recomputeStock(m);
}
function returnStock(m, pills){
  // Used when an old bill is edited/undone — put pills back into the batch nearest
  // to expiry (the one most likely to have been sold from), or a fresh undated batch.
  const batches = fefoOrder(m);
  if(batches.length){ batches[0].pillsRemaining += pills; }
  else {
    m.batches = m.batches||[];
    m.batches.push({ id:uid(), boxes:null, pillsRemaining:pills, expiryDate:null, addedAt:Date.now(), disposed:false });
  }
  recomputeStock(m);
}
function adjustStockTo(m, newTotal){
  // Used for manual stock correction in Edit (e.g. accounting for loss/damage).
  const current = activeBatches(m).reduce((s,b)=>s+b.pillsRemaining,0);
  const diff = newTotal - current;
  if(diff<0) deductStock(m, -diff);
  else if(diff>0){
    m.batches = m.batches||[];
    m.batches.push({ id:uid(), boxes:null, pillsRemaining:diff, expiryDate:null, addedAt:Date.now(), disposed:false });
    recomputeStock(m);
  }
}
function daysUntil(dateStr){
  if(!dateStr) return null;
  const today = new Date(); today.setHours(0,0,0,0);
  const exp = new Date(dateStr+"T00:00:00");
  return Math.round((exp-today)/86400000);
}
function expiringBatches(){
  const out = [];
  inventory.forEach(m=>{
    activeBatches(m).forEach(b=>{
      if(b.expiryDate){
        const d = daysUntil(b.expiryDate);
        if(d!==null && d<=10) out.push({ med:m, batch:b, daysLeft:d });
      }
    });
  });
  return out.sort((a,b)=>a.daysLeft-b.daysLeft);
}
function onBatchExpiryChange(medId, batchId, val){
  const m = inventory.find(x=>x.id===medId);
  if(m){ const b=(m.batches||[]).find(x=>x.id===batchId); if(b) b.expiryDate = val || null; }
  saveInventory();
  render();
}
function disposeBatch(medId, batchId){
  askConfirm("Mark this batch as disposed? It'll be removed from stock and cleared from expiry alerts.", ()=>{
    const m = inventory.find(x=>x.id===medId);
    if(m){
      const b = (m.batches||[]).find(x=>x.id===batchId);
      if(b){ b.disposed=true; b.pillsRemaining=0; recomputeStock(m); }
    }
    saveInventory();
    render();
  });
}
function batchExpiryLabel(daysLeft){
  if(daysLeft<0) return `Expired ${Math.abs(daysLeft)}d ago`;
  if(daysLeft===0) return "Expires today";
  return `${daysLeft}d left`;
}

/* ===================== RENDER (with focus preservation) ===================== */
function render(){
  const active = document.activeElement;
  const id = active && active.id;
  const selStart = active && typeof active.selectionStart==="number" ? active.selectionStart : null;
  const selEnd = active && typeof active.selectionEnd==="number" ? active.selectionEnd : null;

  renderBanner();
  renderNav();
  if(tab==="bill") renderBill();
  else if(tab==="inventory") renderInventory();
  else if(tab==="records") renderRecords();
  else if(tab==="stock") renderStock();
  else if(tab==="notes") renderNotes();
  renderShareModal();
  renderConfirmModal();
  renderInvFormModal();
  renderBackupModal();

  const fab = document.getElementById("invFab");
  if(fab){ fab.className = (tab==="inventory" && !inv.showForm) ? "" : "hidden"; }

  if(id){
    const el = document.getElementById(id);
    if(el){
      el.focus();
      if(selStart!=null && el.setSelectionRange){ try{ el.setSelectionRange(selStart, selEnd); }catch(e){} }
    }
  }
}

function renderBanner(){
  const b = document.getElementById("banner");
  if(saveError){ b.style.display="flex"; b.textContent="⚠ "+saveError; }
  else { b.style.display="none"; b.textContent=""; }
}

function lowStockList(){ return inventory.filter(m=>!m.noWarn && m.stockPills <= (m.lowStockAt ?? 0)); }

function renderNav(){
  const tabs = [
    {id:"bill",label:"New Bill",icon:"📄"},
    {id:"inventory",label:"Medicines",icon:"💊"},
    {id:"records",label:"Records",icon:"🕒"},
    {id:"stock",label:"Low Stock",icon:"⚠️",badge:lowStockList().length+expiringBatches().length},
    {id:"notes",label:"Notepad",icon:"📝"},
  ];
  document.getElementById("nav").innerHTML = tabs.map(t=>`
    <button class="${tab===t.id?'active':''}" onclick="setTab('${t.id}')">
      <span class="icon">${t.icon}</span>
      <span>${t.label}</span>
      ${t.badge?`<span class="badge">${t.badge}</span>`:""}
    </button>`).join("");
}

function setTab(t){ tab=t; render(); }

/* ===================== SHARE MODAL ===================== */
function openShare(text){ shareText=text; render(); }
function closeShare(){ shareText=null; render(); }
function shareWhatsApp(){ window.open("https://wa.me/?text="+encodeURIComponent(shareText),"_blank"); }
function copyShare(){
  navigator.clipboard.writeText(shareText).then(()=>{
    const btn = document.getElementById("copyBtnLabel");
    if(btn){ btn.textContent="Copied ✓"; setTimeout(()=>{ if(document.getElementById("copyBtnLabel")) document.getElementById("copyBtnLabel").textContent="Copy text"; },1500); }
  }).catch(()=>{});
}
function renderShareModal(){
  const root = document.getElementById("shareModalRoot");
  if(shareText===null){ root.innerHTML=""; return; }
  root.innerHTML = `
    <div class="modal-overlay" onclick="if(event.target===this) closeShare()">
      <div class="modal">
        <div class="modal-head">
          <strong>Share</strong>
          <button class="btn-outline" style="border:none;font-size:18px;padding:4px 8px;" onclick="closeShare()">✕</button>
        </div>
        <div class="modal-body">${esc(shareText)}</div>
        <div class="modal-actions">
          <button class="btn btn-outline flex1" onclick="copyShare()"><span id="copyBtnLabel">Copy text</span></button>
          <button class="btn btn-success flex1" onclick="shareWhatsApp()">Share to WhatsApp</button>
        </div>
      </div>
    </div>`;
}

/* ===================== CONFIRM MODAL ===================== */
/* Some in-app browsers / WebViews silently block window.confirm() (it returns
   false with no dialog shown), which made delete buttons look broken.
   This custom modal replaces confirm() everywhere so it always works. */
let confirmState = null; // { message, onYes }
function askConfirm(message, onYes){ confirmState = { message, onYes }; renderConfirmModal(); }
function cancelConfirm(){ confirmState = null; renderConfirmModal(); }
function proceedConfirm(){
  const fn = confirmState && confirmState.onYes;
  confirmState = null;
  renderConfirmModal();
  if(fn) fn();
}
function renderConfirmModal(){
  const root = document.getElementById("confirmModalRoot");
  if(!root) return;
  if(!confirmState){ root.innerHTML=""; return; }
  root.innerHTML = `
    <div class="modal-overlay" onclick="if(event.target===this) cancelConfirm()">
      <div class="modal">
        <div class="modal-head"><strong>Please confirm</strong></div>
        <div class="modal-body">${esc(confirmState.message)}</div>
        <div class="modal-actions">
          <button class="btn btn-outline flex1" onclick="cancelConfirm()">Cancel</button>
          <button class="btn flex1" style="background:var(--danger);color:#fff;" onclick="proceedConfirm()">Delete</button>
        </div>
      </div>
    </div>`;
}

/* ===================== NEW BILL TAB ===================== */
function billMedTotal(){ return bill.items.reduce((s,it)=>s+it.subtotal,0); }
function billExtrasTotal(){ return bill.extras.reduce((s,it)=>s+it.amount,0); }
function billGrandTotal(){ return billMedTotal() + billExtrasTotal() + (Number(bill.fee)||0); }
function onExtraAmount(v){ bill.extraAmount=v; render(); }
function addExtraItem(){
  const amount = Number(bill.extraAmount);
  if(!amount || amount<=0) return;
  bill.extras.push({ id:uid(), amount });
  bill.extraAmount="";
  render();
}
function removeExtraItem(idx){ bill.extras.splice(idx,1); render(); }

function onBillPatient(v){ bill.patient=v; }
function onBillFee(v){ bill.fee=v; render(); }
function onBillQuery(v){ bill.query=v; bill.selectedMedId=null; render(); }
function onBillPills(v){ bill.pills=v; render(); }
function onBillPerDay(v){ bill.perDay=v; render(); }
function onBillDays(v){ bill.days=v; render(); }
function setBillQtyMode(mode){ bill.qtyMode=mode; render(); }
function setBillDaysMode(mode){ bill.daysMode=mode; render(); }
function onGlobalDays(v){
  bill.globalDays = v;
  const days = Number(v)||0;
  bill.items.forEach(it=>{
    if(it.linkedToGlobalDays){
      it.pills = (it.perDay||0)*days;
      it.subtotal = it.pricePerPill*it.pills;
      it.note = days>0 ? `${it.perDay}/day × ${days}d` : `${it.perDay}/day × (set days below)`;
    }
  });
  render();
}
function billComputedPills(){
  if(bill.qtyMode==="dose"){
    const perDay = Number(bill.perDay);
    if(!perDay || perDay<=0) return 0;
    const days = bill.daysMode==="same" ? (Number(bill.globalDays)||0) : Number(bill.days);
    if(!days || days<=0) return 0;
    return perDay*days;
  }
  return Number(bill.pills) || 0;
}
function canAddBillItem(){
  if(!bill.selectedMedId) return false;
  if(bill.qtyMode==="total") return Number(bill.pills)>0;
  const perDay = Number(bill.perDay);
  if(!perDay || perDay<=0) return false;
  if(bill.daysMode==="same") return true; // days can be set later, applies to whole list
  const days = Number(bill.days);
  return !!(days && days>0);
}
function pickBillMed(id){ bill.selectedMedId=id; const m=inventory.find(x=>x.id===id); bill.query=m?m.name:""; render(); }

function addBillItem(){
  const med = inventory.find(m=>m.id===bill.selectedMedId);
  if(!med || !canAddBillItem()) return;
  const pricePerPill = med.mrpPerBox/med.pillsPerBox;
  if(bill.qtyMode==="total"){
    const pills = Number(bill.pills)||0;
    bill.items.push({medId:med.id, name:med.name, pills, pricePerPill, subtotal:pricePerPill*pills, note:"", perDay:null, linkedToGlobalDays:false});
  } else if(bill.daysMode==="same"){
    const perDay = Number(bill.perDay)||0;
    const days = Number(bill.globalDays)||0;
    const pills = perDay*days;
    const note = days>0 ? `${perDay}/day × ${days}d` : `${perDay}/day × (set days below)`;
    bill.items.push({medId:med.id, name:med.name, pills, pricePerPill, subtotal:pricePerPill*pills, note, perDay, linkedToGlobalDays:true});
  } else {
    const perDay = Number(bill.perDay)||0;
    const days = Number(bill.days)||0;
    const pills = perDay*days;
    const note = `${perDay}/day × ${days}d`;
    bill.items.push({medId:med.id, name:med.name, pills, pricePerPill, subtotal:pricePerPill*pills, note, perDay, linkedToGlobalDays:false});
  }
  bill.selectedMedId=null; bill.query=""; bill.pills=""; bill.perDay=""; bill.days="";
  render();
}
function removeBillItem(idx){ bill.items.splice(idx,1); render(); }
function editBillItem(idx){
  const it = bill.items[idx];
  if(!it) return;
  bill.items.splice(idx,1);
  bill.selectedMedId = it.medId;
  const m = inventory.find(x=>x.id===it.medId);
  bill.query = m ? m.name : it.name;
  bill.qtyMode = "total";
  bill.pills = String(it.pills);
  bill.perDay = ""; bill.days = "";
  render();
  const el = document.getElementById("billPillsInput");
  if(el){ el.focus(); el.select(); }
}
function pendingBillSubtotal(){
  const med = inventory.find(m=>m.id===bill.selectedMedId);
  const pills = billComputedPills();
  if(!med || !pills || pills<=0) return 0;
  return (med.mrpPerBox/med.pillsPerBox)*pills;
}

function canCompleteBill(){ return bill.patient.trim() && (bill.items.length>0 || Number(bill.fee)>0 || bill.extras.length>0) && bill.items.every(it=>it.pills>0); }

/* ===================== TOAST ===================== */
let toastTimer = null;
function showToast(msg){
  const el = document.getElementById("toast");
  el.textContent = msg;
  el.classList.remove("hidden");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>{ el.classList.add("hidden"); }, 1800);
}

function completeBill(){
  if(!canCompleteBill()) return;
  bill.items.forEach(it=>{
    const med = inventory.find(m=>m.id===it.medId);
    if(med) deductStock(med, it.pills);
  });
  saveInventory();
  const tx = { id:uid(), timestamp:Date.now(), patientName:bill.patient.trim(),
    doctorFee:Number(bill.fee)||0, items:bill.items, medTotal:billMedTotal(),
    extras:bill.extras, extrasTotal:billExtrasTotal(), grandTotal:billGrandTotal() };
  transactions.unshift(tx);
  saveTransactions();
  bill = { patient:"", fee:"", items:[], query:"", pills:"", selectedMedId:null, qtyMode:"total", daysMode:"perMed", perDay:"", days:"", globalDays:"", extras:[], extraAmount:"" };
  render();
  showToast("✓ Bill saved — find it anytime in Records");
}

function buildBillText(tx){
  const lines = [`🏥 Patient Bill`, `Patient: ${tx.patientName}`, `Date: ${fmtDateTime(tx.timestamp)}`, ``];
  if(tx.items.length){
    lines.push(`Medicines:`);
    tx.items.forEach((it,i)=> lines.push(`${i+1}. ${it.name} — ${it.pills} pills${it.note?` (${it.note})`:""} — ${CURRENCY}${money(it.subtotal)}`));
    lines.push(``);
  }
  if(tx.extras && tx.extras.length){
    lines.push(`Other charges:`);
    tx.extras.forEach((ex,i)=> lines.push(`${i+1}. Other charge — ${CURRENCY}${money(ex.amount)}`));
    lines.push(``);
  }
  lines.push(`Medicine total: ${CURRENCY}${money(tx.medTotal)}`);
  lines.push(`Doctor fee: ${CURRENCY}${money(tx.doctorFee)}`);
  lines.push(`--------------------------`);
  lines.push(`Grand total: ${CURRENCY}${money(tx.grandTotal)}`);
  return lines.join("\n");
}

function addMedicine(){

  if(!f.name.trim()||!f.mrp||!f.pillsPerBox) return;
  inventory.push({ id:uid(), name:f.name.trim(), formula:f.formula.trim(), mg:f.mg.trim(),
    mrpPerBox:Number(f.mrp), pillsPerBox:Number(f.pillsPerBox), stockPills:0, lowStockAt:Number(f.lowStockAt)||0, batches:[] });
  saveInventory();
  inv.showForm=false;

    inventory = inventory.filter(m=>m.id!==id);

function toggleRestock(id){ inv.editId=null; inv.restockId = inv.restockId===id?null:id; inv.restockBoxes=""; inv.restockExpiry=""; render(); }
function onRestockBoxes(v){ inv.restockBoxes=v; }
function onRestockExpiry(v){ inv.restockExpiry=v; }
function doRestock(id){
  const boxes = Number(inv.restockBoxes);
  if(!boxes||boxes<=0) return;
  const m = inventory.find(x=>x.id===id);
  if(m){
    m.batches = m.batches||[];
    m.batches.push({ id:uid(), boxes, pillsRemaining: boxes*m.pillsPerBox, expiryDate: inv.restockExpiry||null, addedAt:Date.now(), disposed:false });
    recomputeStock(m);
  }
  saveInventory();
  inv.restockId=null; inv.restockBoxes=""; inv.restockExpiry="";
  render();
}
function openEdit(id){
  inv.restockId=null;
  inv.editId = inv.editId===id?null:id;
  const m = inventory.find(x=>x.id===id);
  if(m){ inv.editForm = { name:m.name, formula:m.formula||"", mg:m.mg||"", mrp:String(m.mrpPerBox),
    pillsPerBox:String(m.pillsPerBox), lowStockAt:String(m.lowStockAt??0), stockPills:String(m.stockPills), noWarn:!!m.noWarn }; }
  render();
}
function onEditForm(field,v){ inv.editForm[field]=v; }

  const f = inv.editForm;
  if(!f.name.trim()||!f.mrp||!f.pillsPerBox||f.stockPills==="") return;
  const m = inventory.find(x=>x.id===id);
  if(m){
    m.name=f.name.trim(); m.formula=f.formula.trim(); m.mg=f.mg.trim();
    m.mrpPerBox=Number(f.mrp); m.pillsPerBox=Number(f.pillsPerBox);
    m.lowStockAt=Number(f.lowStockAt)||0;
    adjustStockTo(m, Math.max(0,Number(f.stockPills)));

  render();
}

/* ===================== RECORDS TAB ===================== */
function dayOptions(){
  const map = new Map();
  map.set(new Date().toDateString(), Date.now());
  transactions.forEach(t=>{ const k=new Date(t.timestamp).toDateString(); if(!map.has(k)) map.set(k,t.timestamp); });
  return Array.from(map.entries()).sort((a,b)=>b[1]-a[1]).map(([key,ts])=>({
    key, label: sameDay(ts,Date.now())?"Today":new Date(ts).toLocaleDateString(undefined,{day:"2-digit",month:"short",year:"numeric"})
  }));
}
function onDaySelect(v){ rec.selectedDay=v; rec.expandedId=null; render(); }
function toggleExpand(id){ rec.expandedId = rec.expandedId===id?null:id; rec.editingId=null; render(); }
function onRecordsSearch(v){ rec.searchQuery=v; rec.expandedId=null; rec.editingId=null; render(); }
function txDateSearchString(ts){
  const d = new Date(ts);
  return (d.toDateString()+" "+d.toLocaleDateString(undefined,{day:"2-digit",month:"short",year:"numeric"})+" "+d.toLocaleDateString()).toLowerCase();
}
function txMatchesQuery(t,q){
  if(!q) return true;
  return t.patientName.toLowerCase().includes(q) || txDateSearchString(t.timestamp).includes(q);
}
function shareDay(){
  const opts = dayOptions();
  const activeKey = rec.selectedDay || opts[0].key;
  const dayLabel = opts.find(d=>d.key===activeKey)?.label||"";
  const dayTx = transactions.filter(t=>new Date(t.timestamp).toDateString()===activeKey);
  const dayTotal = dayTx.reduce((s,t)=>s+t.grandTotal,0);
  const lines = [`📋 Patients attended — ${dayLabel}`, ``];
  dayTx.slice().reverse().forEach((t,i)=> lines.push(`${i+1}. ${t.patientName} — ${CURRENCY}${money(t.grandTotal)}`));
  lines.push(``, `Total (${dayTx.length} patients): ${CURRENCY}${money(dayTotal)}`);
  openShare(lines.join("\n"));
}
function deleteTx(id){
  askConfirm("Delete this bill record?", ()=>{
    transactions = transactions.filter(t=>t.id!==id);
    saveTransactions(); render();
  });
}

/* ---- editing an existing bill ---- */
function openEditTx(id){
  const t = transactions.find(x=>x.id===id);
  if(!t) return;
  recEdit = { txId:id, patient:t.patientName, fee:String(t.doctorFee), items:t.items.map(it=>({...it})), query:"", pills:"", selectedMedId:null, extras:t.extras?t.extras.map(ex=>({...ex})):[], extrasTotal:t.extrasTotal||0 };
  rec.editingId = id;
  rec.expandedId = null;
  render();
}
function cancelEditTx(){ rec.editingId=null; render(); }
function onEditTxPatient(v){ recEdit.patient=v; }
function onEditTxFee(v){ recEdit.fee=v; render(); }
function onEditTxQuery(v){ recEdit.query=v; recEdit.selectedMedId=null; render(); }
function onEditTxPills(v){ recEdit.pills=v; render(); }
function pickEditTxMed(id){ recEdit.selectedMedId=id; const m=inventory.find(x=>x.id===id); recEdit.query=m?m.name:""; render(); }
function addEditTxItem(){
  const med = inventory.find(m=>m.id===recEdit.selectedMedId);
  const pills = Number(recEdit.pills);
  if(!med || !pills || pills<=0) return;
  const pricePerPill = med.mrpPerBox/med.pillsPerBox;
  recEdit.items.push({medId:med.id, name:med.name, pills, pricePerPill, subtotal:pricePerPill*pills});
  recEdit.selectedMedId=null; recEdit.query=""; recEdit.pills="";
  render();
}
function removeEditTxItem(idx){ recEdit.items.splice(idx,1); render(); }
function editTxMedTotal(){ return recEdit.items.reduce((s,it)=>s+it.subtotal,0); }
function editTxGrandTotal(){ return editTxMedTotal() + (Number(recEdit.fee)||0) + (recEdit.extrasTotal||0); }
function saveEditTx(){
  const t = transactions.find(x=>x.id===recEdit.txId);
  if(!t || !recEdit.patient.trim()) return;
  // give back stock for the old items, then deduct stock for the new items
  t.items.forEach(oldIt=>{
    const med = inventory.find(m=>m.id===oldIt.medId);
    if(med) returnStock(med, oldIt.pills);
  });
  recEdit.items.forEach(newIt=>{
    const med = inventory.find(m=>m.id===newIt.medId);
    if(med) deductStock(med, newIt.pills);
  });
  saveInventory();
  t.patientName = recEdit.patient.trim();
  t.doctorFee = Number(recEdit.fee)||0;
  t.items = recEdit.items;
  t.medTotal = editTxMedTotal();
  t.extras = recEdit.extras||[];
  t.extrasTotal = recEdit.extrasTotal||0;
  t.grandTotal = editTxGrandTotal();
  saveTransactions();
  rec.editingId = null;
  render();
  showToast("✓ Bill updated");
}

function shareLowStock(){
  const list = lowStockList();
  const lines = [`⚠️ Out of stock / low stock`, `As of ${fmtDateTime(Date.now())}`, ``];
  list.forEach((m,i)=>{
    const strength = [m.formula,m.mg].filter(Boolean).join(" · ");
    lines.push(`${i+1}. ${m.name}${strength?` (${strength})`:""} — ${m.stockPills} pills left`);
  });
  openShare(lines.join("\n"));
}
function toggleWarnBack(id){
  const m = inventory.find(x=>x.id===id);
  if(m) m.noWarn = false;
  saveInventory();
  render();
}
function dismissLowStock(id){
  const m = inventory.find(x=>x.id===id);
  if(m) m.noWarn = true;
  saveInventory();
  render();
}
function renderStock(){
  const list = lowStockList();
  const hidden = inventory.filter(m=>m.noWarn && m.stockPills <= (m.lowStockAt ?? 0));

  const hiddenHtml = hidden.length ? `
    <p class="small" style="font-weight:700;color:var(--warning);margin:${list.length?"18px":"0"} 0 8px;">
      ⚠ These are actually low too, but their warning is turned off
    </p>
    ${hidden.map(m=>`
      <div class="card" style="border-color:#F0DCB0;">
        <div class="row">
          <div>
            <p style="font-weight:700;font-size:14px;margin:0;">${esc(m.name)}</p>
            ${(m.formula||m.mg)?`<p class="small" style="color:var(--primary);margin:2px 0 0;">${esc(m.formula)}${m.formula&&m.mg?' · ':''}${esc(m.mg)}</p>`:""}
            <p class="small faint" style="margin:2px 0 0;">${m.stockPills} pills left</p>
          </div>
          <button class="btn btn-outline" style="padding:6px 12px;font-size:12px;" onclick="toggleWarnBack('${m.id}')">Turn warning back on</button>
        </div>
      </div>`).join("")}` : "";

  const expiring = expiringBatches();
  const expiringHtml = expiring.length ? `
    <p class="small" style="font-weight:700;color:var(--danger);margin:${list.length||hidden.length?"18px":"0"} 0 8px;">
      ⏳ Expiring within 10 days
    </p>
    ${expiring.map(({med:m,batch:b,daysLeft})=>`
      <div class="card" style="border-color:#F3C6BE;">
        <div class="row">
          <div>
            <p style="font-weight:700;font-size:14px;margin:0;">${esc(m.name)}</p>
            ${(m.formula||m.mg)?`<p class="small" style="color:var(--primary);margin:2px 0 0;">${esc(m.formula)}${m.formula&&m.mg?' · ':''}${esc(m.mg)}</p>`:""}
            <p class="small" style="margin:2px 0 0;color:var(--danger);font-weight:700;">${b.pillsRemaining} pills · ${batchExpiryLabel(daysLeft)}</p>
          </div>
          <button class="btn btn-outline" style="padding:6px 12px;font-size:12px;white-space:nowrap;" onclick="disposeBatch('${m.id}','${b.id}')">Medicine disposed</button>
        </div>
      </div>`).join("")}` : "";

  if(list.length===0 && hidden.length===0 && expiring.length===0){
    document.getElementById("main").innerHTML = `<p class="small faint" style="text-align:center;padding:40px 0;">All medicines are sufficiently stocked and nothing is expiring soon. 👍</p>`;
    return;
  }

  document.getElementById("main").innerHTML = `
    ${list.length ? `<button class="btn btn-danger" style="width:100%;padding:12px;margin-bottom:12px;" onclick="shareLowStock()">📤 Share low-stock list</button>` : ""}
    ${list.map(m=>`
      <div class="card" style="border-color:#F3C6BE;">
        <div class="row">
          <div>
            <p style="font-weight:700;font-size:14px;margin:0;">${esc(m.name)}</p>
            ${(m.formula||m.mg)?`<p class="small" style="color:var(--primary);margin:2px 0 0;">${esc(m.formula)}${m.formula&&m.mg?' · ':''}${esc(m.mg)}</p>`:""}
            <span style="font-size:12px;font-weight:700;color:var(--danger);">${m.stockPills} pills left</span>
          </div>
          <button class="btn btn-outline" style="padding:6px 12px;font-size:12px;white-space:nowrap;" onclick="dismissLowStock('${m.id}')">We'll buy it later</button>
        </div>
      </div>`).join("")}
    ${hiddenHtml}
    ${expiringHtml}
  `;
}

function switchProfile(id){

function addProfile(){
  const name = notesUi.newProfileName.trim();

  const p = { id:uid(), name };
  profiles.push(p);
  saveProfiles();
  notesUi.addingProfile = false;
  switchProfile(p.id);
}
function deleteProfile(id){
  const p = profiles.find(x=>x.id===id);
  if(!p) return;
  askConfirm(`Remove "${p.name}" and delete all of their notes? This cannot be undone.`, ()=>{
    profiles = profiles.filter(x=>x.id!==id);
    saveProfiles();
    try{ localStorage.removeItem("clinic_notes_"+id); }catch(e){}
    if(currentProfileId===id){
      currentProfileId = profiles[0] ? profiles[0].id : null;
      if(currentProfileId) localStorage.setItem("clinic_current_profile", currentProfileId);
      else localStorage.removeItem("clinic_current_profile");
      loadNotesForCurrentProfile();
    }
    notesUi.openId=null;
    render();
  });
}
function onNotesSearch(v){ notesUi.searchQuery=v; render(); }
function openNewNote(){ notesUi.openId="new"; notesUi.draftTitle=""; notesUi.draftBody=""; render(); }
function openExistingNote(id){
  const n = notes.find(x=>x.id===id);
  notesUi.openId=id; notesUi.draftTitle=n?n.title:""; notesUi.draftBody=n?n.body:"";
  render();
}
function onNoteTitle(v){ notesUi.draftTitle=v; }
function onNoteBody(v){ notesUi.draftBody=v; }
function backFromNote(){ saveDraftNote(); }
function saveDraftNote(){
  if(!notesUi.draftTitle.trim() && !notesUi.draftBody.trim()){ notesUi.openId=null; render(); return; }
  const title = notesUi.draftTitle.trim() || "Untitled note";
  if(notesUi.openId==="new"){
    notes.unshift({ id:uid(), title, body:notesUi.draftBody, updatedAt:Date.now() });
  } else {
    const n = notes.find(x=>x.id===notesUi.openId);
    if(n){ n.title=title; n.body=notesUi.draftBody; n.updatedAt=Date.now(); }
  }
  saveNotes();
  notesUi.openId=null;
  render();
}
function deleteNote(id){
  askConfirm("Delete this note?", ()=>{
    notes = notes.filter(n=>n.id!==id);
    saveNotes();
    if(notesUi.openId===id) notesUi.openId=null;
    render();
  });
}
function shareNote(id){
  let title, body;
  if(id==="draft"){ title=notesUi.draftTitle||"Untitled note"; body=notesUi.draftBody; }
  else { const n=notes.find(x=>x.id===id); title=n.title; body=n.body; }
  openShare(`📝 ${title}\n\n${body}`);
}

function renderNotes(){
  if(profiles.length===0){
    document.getElementById("main").innerHTML = `
      <div class="card" style="text-align:center;">
        <p style="font-weight:700;margin:0 0 6px;">Who's writing notes?</p>
        <p class="small faint" style="margin:0 0 12px;">Each person gets their own private notepad on this device.</p>
        <input autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" data-lpignore="true" id="firstProfileName" value="${esc(notesUi.newProfileName)}" oninput="onNewProfileName(this.value)" placeholder="Your name" class="mb2">
        <button class="btn btn-primary" style="width:100%;" onclick="addProfile()">Start my notepad</button>
      </div>`;
    return;
  }

  const profileSwitcher = `
    <div class="card" style="padding:10px 14px;">
      <label class="field-label" style="margin-bottom:6px;">Notepad for</label>
      <div class="flex gap2" style="align-items:center;">
        <select id="profileSelect" onchange="switchProfile(this.value)" style="flex:1;">
          ${profiles.map(p=>`<option value="${p.id}" ${p.id===currentProfileId?"selected":""}>${esc(p.name)}</option>`).join("")}
        </select>
        <button class="btn btn-outline" style="padding:10px 12px;white-space:nowrap;" onclick="toggleAddProfile()">${notesUi.addingProfile?"✕":"+ Add"}</button>
        <button class="btn btn-outline" style="padding:10px 12px;color:var(--danger);" onclick="deleteProfile('${currentProfileId}')" title="Remove this person">🗑</button>
      </div>
      ${notesUi.addingProfile ? `
        <div class="flex gap2 mt2">
          <input autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" data-lpignore="true" id="newProfileNameInput" value="${esc(notesUi.newProfileName)}" oninput="onNewProfileName(this.value)" placeholder="New person's name" class="flex1">
          <button class="btn btn-primary" onclick="addProfile()">Add</button>
        </div>` : ""}
    </div>`;

  if(notesUi.openId!==null){
    const isNew = notesUi.openId==="new";
    document.getElementById("main").innerHTML = profileSwitcher + `
      <button onclick="backFromNote()" style="background:none;border:none;color:var(--primary);font-weight:600;font-size:14px;cursor:pointer;padding:0;margin-bottom:12px;">← Back</button>
      <input autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" data-lpignore="true" id="noteTitleInput" value="${esc(notesUi.draftTitle)}" oninput="onNoteTitle(this.value)" placeholder="Note title" style="font-weight:700;" class="mb2">
      <textarea autocomplete="off" autocorrect="off" spellcheck="false" data-lpignore="true" id="noteBodyInput" oninput="onNoteBody(this.value)" placeholder="Write here — supplier calls, reminders, things to order, notes for the next shift…" style="min-height:40vh;">${esc(notesUi.draftBody)}</textarea>
      <div class="flex gap2 mt3">
        <button class="btn btn-primary flex1" onclick="saveDraftNote()">Save note</button>
        ${!isNew?`<button class="btn btn-success" onclick="shareNote('${notesUi.openId}')">📤 Share</button>`:""}
      </div>
      ${!isNew?`<button class="btn" style="width:100%;background:none;color:var(--danger);margin-top:8px;" onclick="deleteNote('${notesUi.openId}')">🗑 Delete note</button>`:""}
    `;
    return;
  }

  const sorted = notes
    .filter(n=>{
      const q = notesUi.searchQuery.trim().toLowerCase();
      if(!q) return true;
      return n.title.toLowerCase().includes(q) || n.body.toLowerCase().includes(q);
    })
    .sort((a,b)=>b.updatedAt-a.updatedAt);
  document.getElementById("main").innerHTML = profileSwitcher + `
    <button class="btn-dashed mb2" onclick="openNewNote()">+ New note</button>
    <div class="search-wrap mb2">
      <span class="search-icon">🔍</span>
      <input autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" data-lpignore="true" id="notesSearchInput" value="${esc(notesUi.searchQuery)}" oninput="onNotesSearch(this.value)" placeholder="Search notes by topic or text…">
    </div>

    ${sorted.length===0?`<p class="small faint" style="text-align:center;padding:24px 0;">${notesUi.searchQuery.trim()?`No notes match "${esc(notesUi.searchQuery)}".`:"No notes yet — jot down reminders, supplier calls, or things to order."}</p>`:""}
    ${sorted.map(n=>`
      <div class="card">
        <button onclick="openExistingNote('${n.id}')" style="width:100%;text-align:left;background:none;border:none;padding:0;cursor:pointer;">
          <p style="font-weight:700;font-size:14px;margin:0;">${esc(n.title)}</p>
          ${n.body?`<p class="small" style="color:var(--muted);margin:4px 0 0;">${esc(n.body.slice(0,120))}${n.body.length>120?"…":""}</p>`:""}
          <p style="font-size:11px;color:var(--faint);margin:6px 0 0;">${fmtDateTime(n.updatedAt)}</p>
        </button>
        <div class="flex gap2 mt2">
          <button class="btn btn-success flex1" style="padding:6px;font-size:12px;" onclick="shareNote('${n.id}')">📤 Share</button>
          <button class="btn btn-outline" style="padding:6px 12px;" onclick="deleteNote('${n.id}')">🗑</button>
        </div>
      </div>`).join("")}
    <p class="small faint" style="text-align:center;">Only ${esc(profiles.find(p=>p.id===currentProfileId)?.name||"you")} can see these notes. Medicines, bills, and records are shared with everyone on this device.</p>
  `;
}

/* ===================== BACKUP & RESTORE ===================== */
/* Everything in this app already lives in the phone's storage (localStorage), which
   survives closing the app/browser and restarting the phone. The real risk is someone
   clearing browser/site data, or reinstalling the browser — that does wipe it. Export
   makes a real file in your phone's Downloads/Files app, completely outside the
   browser, so you always have a copy to restore from no matter what happens to it. */
function toggleBackupModal(){ backupUi.open = !backupUi.open; render(); }
function collectAllNotes(){
  const out = {};
  profiles.forEach(p=>{
    try{ out[p.id] = JSON.parse(localStorage.getItem("clinic_notes_"+p.id)||"[]"); }catch(e){ out[p.id]=[]; }
  });
  return out;
}
function exportBackup(){
  const payload = {
    version: 1,
    exportedAt: Date.now(),
    inventory, transactions, profiles,
    notesByProfile: collectAllNotes()
  };
  const stamp = new Date().toISOString().slice(0,10);
  const filename = `counter-book-backup-${stamp}.json`;
  const json = JSON.stringify(payload,null,2);
  /* Inside the Android app, hand the file to the native bridge, which saves it
     to the phone's Downloads folder (blob: downloads don't work in a WebView). */
  if(window.AndroidBridge && typeof window.AndroidBridge.saveBackup === "function"){
    window.AndroidBridge.saveBackup(json, filename);
    showToast("✓ Backup saved to Downloads");
    return;
  }
  const blob = new Blob([json], {type:"application/json"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(url), 2000);
  showToast("✓ Backup file downloaded");
}
function triggerImportPicker(){ document.getElementById("backupFileInput").click(); }
function onBackupFileSelected(evt){
  const file = evt.target.files && evt.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = ()=>{
    let data;
    try{ data = JSON.parse(reader.result); }catch(e){ showToast("⚠ That file isn't a valid backup"); evt.target.value=""; return; }
    if(!data || !Array.isArray(data.inventory) || !Array.isArray(data.transactions)){
      showToast("⚠ That file isn't a valid backup"); evt.target.value=""; return;
    }
    askConfirm("Restore this backup? It will replace all current medicines, bills, and notes on this device.", ()=>{
      inventory = data.inventory || [];
      inventory.forEach(m=>{
        if(!Array.isArray(m.batches)){
          m.batches = (m.stockPills>0) ? [{ id:uid(), boxes:null, pillsRemaining:m.stockPills, expiryDate:null, addedAt:Date.now(), disposed:false }] : [];
        }
        recomputeStock(m);
      });
      transactions = data.transactions || [];
      profiles = data.profiles || [];
      saveInventory(); saveTransactions(); saveProfiles();
      const notesByProfile = data.notesByProfile || {};
      profiles.forEach(p=>{
        try{ localStorage.setItem("clinic_notes_"+p.id, JSON.stringify(notesByProfile[p.id]||[])); }catch(e){}
      });
      currentProfileId = profiles[0] ? profiles[0].id : null;
      if(currentProfileId) localStorage.setItem("clinic_current_profile", currentProfileId);
      loadNotesForCurrentProfile();
      backupUi.open = false;
      evt.target.value = "";
      render();
      showToast("✓ Backup restored");
    });
  };
  reader.readAsText(file);
}
function renderBackupModal(){
  const root = document.getElementById("backupModalRoot");
  if(!root) return;
  if(!backupUi.open){ root.innerHTML=""; return; }
  root.innerHTML = `
    <div class="modal-overlay" onclick="if(event.target===this) toggleBackupModal()">
      <div class="modal">
        <div class="modal-head">
          <strong>Backup &amp; Restore</strong>
          <button class="btn-outline" style="border:none;font-size:18px;padding:4px 8px;" onclick="toggleBackupModal()">✕</button>
        </div>
        <div style="padding:14px 16px;">
          <p class="small" style="margin:0 0 12px;">Your data is already saved on this phone and survives closing the app or restarting your phone. The only real risk is clearing browser/site data. Download a backup file now and then, and keep it somewhere safe (Google Drive, email to yourself, etc.) so you can always restore it.</p>
          <button class="btn btn-primary" style="width:100%;margin-bottom:10px;" onclick="exportBackup()">⬇ Download backup file</button>
          <button class="btn btn-outline" style="width:100%;" onclick="triggerImportPicker()">⬆ Restore from backup file</button>
        </div>
      </div>
    </div>`;
}

/* ===================== FULLSCREEN ===================== */
function toggleFullscreen(){
  if(!document.fullscreenElement){
    document.documentElement.requestFullscreen?.().catch(()=>{});
  } else {
    document.exitFullscreen?.();
  }
}

/* ===================== INIT ===================== */
loadAll();
render();
</script>
