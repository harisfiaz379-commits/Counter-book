const aiNz = x=>String(x||"").toLowerCase().replace(/[^a-z0-9]/g,"");
function aiLearned(){
  try{ const v=JSON.parse(localStorage.getItem(bk(AI_LEARN_KEY))||"{}"); return {map:v.map||{}, examples:Array.isArray(v.examples)?v.examples:[]}; }
  catch(e){ return {map:{},examples:[]}; }
}
// Gemini itself can't be re-trained from here, so the app keeps its own memory: every time you pick a
// different medicine than the one suggested, "what was read" -> "real medicine" is saved and used
// (1) to pre-select that medicine next time and (2) as examples inside the prompt sent to Gemini.
function aiLearn(r, med){
  const words=(r.tokens||[]).filter(t=>!/^\d+(\.\d+)?$/.test(t)), key=aiNz(words[0]);
  if(!key || !med) return;
  const L=aiLearned(); L.map[key]=med.id;
  L.examples=[{k:key,read:words[0],name:med.name}].concat(L.examples.filter(e=>e.k!==key)).slice(0,30);
  try{ localStorage.setItem(bk(AI_LEARN_KEY),JSON.stringify(L)); }catch(e){}
}
function aiPromptExtras(){
  const names=[...new Set(inventory.filter(m=>!m.deleted).map(m=>String(m.name||"").trim()).filter(Boolean))].slice(0,400).map(n=>n.slice(0,40)).join("; ");
  const ex=aiLearned().examples.slice(0,20).map(e=>'"'+e.read+'" = '+e.name).join("; ");
  return (names?"\nThe clinic stocks these medicines: "+names+". If a handwritten name looks like one of them, write the stocked name exactly; otherwise write it as seen.":"")
       + (ex?"\nCorrections made earlier by the pharmacist (what the handwriting looked like = the real medicine): "+ex+".":"");
}
function aiFindMeds(tokens){
  if(!tokens.length) return [];
  const q = tokens.join(" ");
  const nums = tokens.filter(t=>/^\d+(\.\d+)?$/.test(t));
  const words = tokens.filter(t=>!/^\d+(\.\d+)?$/.test(t));
  const out = [], loose = [];
  inventory.filter(m=>!m.deleted).forEach(m=>{
    let score = 0;
    if(medicineMatchesQuery(m,q)) score = 1;
    else if(words.length){
      const nz = x=>String(x||"").toLowerCase().replace(/[^a-z0-9]/g,"");
      const nm = nz(m.name), first = nz((m.name||"").split(/[\s-]+/)[0]);
      const w1 = nz(words[0]), w2 = nz(words.slice(0,2).join(""));
      const sim = Math.max(aiSim(w1,nm), aiSim(w1,first), aiSim(w2,nm)); // ignores hyphens/spaces; forgives handwriting misreads
      if(sim>=0.72) score = 0.6 + sim*0.3; else if(sim>0) loose.push({m, score:sim*0.5});
    }
    if(!score) return;
    if(nums.length && extractNumbers(m.mg).some(n=>nums.includes(n))) score += 0.05;
    if(words.length && (m.name||"").toLowerCase().startsWith(words[0])) score += 0.05;
    out.push({m, score});
  });
  // never "no match": top up with the closest-looking medicines even when they're weak matches
  if(out.length<3) loose.sort((a,b)=>b.score-a.score).slice(0,5).forEach(x=>{ if(!out.some(o=>o.m.id===x.m.id)) out.push(x); });
  out.sort((a,b)=>b.score-a.score || (b.m.stockPills||0)-(a.m.stockPills||0));
  const list = out.slice(0,8).map(x=>x.m);
  const lid = aiLearned().map[aiNz(words[0])], lm = lid && inventory.find(x=>x.id===lid && !x.deleted);
  if(lm) return [lm].concat(list.filter(x=>x.id!==lm.id)).slice(0,8);
  return list;
}
function aiParseText(text){
  text = String(text||"");
  const pm = text.match(/^\s*patient\s*:\s*(.+)$/im);
  // The patient name found on the page is only REMEMBERED here (aiUi.patientName). It is put on the bill when you tap
  // "Add to bill" (see aiConfirmAdd) — reading a photo must never change the live bill, because you may cancel.
  aiUi.patientName = (pm && pm[1].trim()) ? pm[1].trim().replace(/\s+/g," ").slice(0,60) : "";
  const dm = text.match(/^\s*days\s*:\s*(\d+)/im);
  const dt = text.match(/^\s*days_text\s*:\s*(.+)$/im);
  aiUi.daysNote = dm ? (dm[1]+" days"+(dt?" (read as “"+dt[1].trim()+"”)":"")) : "";
  const defaultDays = dm ? +dm[1] : 0;
  return text.split(/\n|;/).map(l=>l.trim()).filter(l=>l.length>1 && !/^(patient|days|days_text)\s*:/i.test(l)).map(l=>{
    const r = aiParseLine(l);
    if(defaultDays && !r.days && !r.qty) r.days = defaultDays; // total days written once for the whole prescription
    const cands = aiFindMeds(r.tokens);
    r.cands = cands.map(m=>({id:m.id, name:m.name, mg:m.mg||"", category:m.category||m.specialCategory||"", stock:m.stockPills||0}));
    r.medId = cands.length ? cands[0].id : "";
    return r;
  });
}
// Which number decides how much is billed when BOTH "Per day x Days" and a typed "Total" are filled in:
// whichever one was changed LAST. Typing a Total means "bill exactly this"; changing Per day or Days goes back
// to Per day x Days. A line that was only read (nothing typed yet) keeps using Per day x Days, as before.
function aiRowByDose(r){
  const dd = (r.perDay>0 && r.days>0);
  if(!dd) return false;
  return !(r.lead==="qty" && r.qty>0);
}
function aiRowPills(r){
  if(aiRowByDose(r)) return r.perDay*r.days;
  return r.qty>0 ? r.qty : 0;
}

function aiReadText(){
  const rows = aiParseText(aiUi.text);
  if(!rows.length){ aiUi.error="Type or paste at least one medicine first."; render(); return; }
  aiUi.error=""; aiUi.rows=rows; render();

function aiMedDetail(m){ return [m.mg,m.category||m.specialCategory].filter(Boolean).join(" · "); }
function aiPickItemHtml(i,m){
  const n=m.stockPills||0;
  return `<button type="button" class="ai-pitem" onclick="aiChoose(${i},'${m.id}')"><span style="flex:1;min-width:0;"><b>${esc(m.name)}</b><br><span class="small faint">${esc(aiMedDetail(m))}</span></span><span class="ai-badge ${n>0?"":"zero"}">${n} left</span></button>`;
}
function aiPickListHtml(i,q){
  const r=aiUi.rows[i], live=inventory.filter(m=>!m.deleted);
  let h=`<button type="button" class="ai-pitem" onclick="aiChoose(${i},'')"><span style="flex:1;color:var(--faint);">— Skip this line —</span></button>`;
  const nq=aiNz(q);
  if(nq){
    const hits=live.filter(m=>aiNz(m.name+" "+(m.formula||"")).includes(nq)).sort((a,b)=>String(a.name).localeCompare(String(b.name))).slice(0,50);
    return h+(hits.length?hits.map(m=>aiPickItemHtml(i,m)).join(""):`<p class="small faint" style="padding:12px 4px;">Nothing matches “${esc(q)}”.</p>`);
  }
  const ids=new Set(), close=(r.cands||[]).map(c=>live.find(m=>m.id===c.id)).filter(Boolean);
  close.forEach(m=>ids.add(m.id));
  if(close.length) h+=`<div class="ai-sec">Closest matches</div>`+close.map(m=>aiPickItemHtml(i,m)).join("");
  const rest=live.filter(m=>!ids.has(m.id)).sort((a,b)=>String(a.name).localeCompare(String(b.name)));
  h+=`<div class="ai-sec">All medicines — type above to search</div>`+rest.slice(0,40).map(m=>aiPickItemHtml(i,m)).join("");
  if(rest.length>40) h+=`<p class="small faint" style="padding:8px 4px;">+${rest.length-40} more — use the search box.</p>`;
  return h;
}

function aiSetAllDays(){
  const el=document.getElementById("aiAllDays"), d=Math.max(0,Math.floor(Number(el&&el.value)||0));
  if(!d || !aiUi.rows) return;
  aiUi.rows.forEach(r=>{ r.days=d; });
  aiUi.daysNote=d+" days (set by you)";
  renderOverlays();
}
function aiRowMed(i,id){ aiUi.rows[i].medId=id; aiRowInfo(i); }
function aiRowSet(i,field,v){
  const r=aiUi.rows[i]; r[field]=Number(v)||0;
  r.lead = (field==="qty" && r.qty>0) ? "qty" : "dose";   // the number you touched last decides (see aiRowByDose)
  aiRowInfo(i);
}
function aiRowInfo(i){
  const r=aiUi.rows[i], el=document.getElementById("aiInfo"+i);
  if(el){
    const med=inventory.find(x=>x.id===r.medId), pills=aiRowPills(r);
    let t = !r.medId ? "Skipped" : pills>0 ? `= ${pills} to bill` : "Fill per day + days, or total";
    if(med && pills>(med.stockPills||0)) t += ` · ⚠ only ${med.stockPills||0} in stock`;
    if(r.assumed && r.medId) t += ` · ${r.assumed}`;
    // Both filled in and they disagree: say which one is being used, so nothing is silently ignored.
    if(r.medId && r.perDay>0 && r.days>0 && r.qty>0 && r.perDay*r.days!==r.qty){
      t += aiRowByDose(r) ? ` · Total ${r.qty} ignored (Per day × Days used) — clear Per day or Days to use it`
                          : ` · Per day × Days (${r.perDay*r.days}) ignored — Total used`;
    }
    el.textContent=t;
    el.style.color = (!r.medId || pills<=0) ? "var(--faint)" : "var(--primary)";
  }
  const btn=document.getElementById("aiAddBtn");
  if(btn){ const n=aiUi.rows.filter(x=>x.medId && aiRowPills(x)>0).length; btn.textContent = n?`Add ${n} to bill`:"Nothing to add yet"; btn.disabled=!n; }
}
function aiConfirmAdd(){
  let added=0;
  (aiUi.rows||[]).forEach(r=>{
    const med=inventory.find(x=>x.id===r.medId && !x.deleted), pills=aiRowPills(r);
    if(med && r.medId!==((r.cands&&r.cands[0])?r.cands[0].id:"")) aiLearn(r, med);
    if(!med || !(pills>0)) return;
    const lc=lineCalc(med, pills, billPendingSkip(med.id)), pricePerPill=lc.pricePerPill, byDose=aiRowByDose(r);
    if(med.specialCategory){
      const base=lc.subtotal;
      bill.items.push({medId:med.id, name:med.name, pills, pricePerPill, subtotal:base, note:"", perDay:null, linkedToGlobalDays:false,
        special:true, specialCategory:med.specialCategory||"", baseSubtotal:base, baseNote:"", appliedFee:0, feeMode:null});
    } else {
      bill.items.push({medId:med.id, name:med.name, pills, pricePerPill, subtotal:lc.subtotal,
        note: byDose?`${r.perDay}/day × ${r.days}d`:"", perDay: byDose?r.perDay:null, linkedToGlobalDays:false});
    }
    added++;
  });
  if(bill.applyingFeeMode==='whole') recomputeWholeApplyingFee();
  if(added && aiUi.patientName && !String(bill.patient||"").trim()) bill.patient = aiUi.patientName;   // only now, and only if the bill still has no name
  aiUi.patientName = "";
  aiUi.open=false; aiUi.rows=null; aiUi.text="";
  if(added && typeof tab!=="undefined" && tab!=="bill") setTab("bill"); else render();
  showToast(added ? `✓ ${added} medicine${added>1?"s":""} added — check them below` : "Nothing was added");
}

function aiPickPhoto(mode){
  aiUi.mode = (mode==="print"||mode==="box") ? mode : "hand";
  if(aiUi.mode==="hand" && !aiGeminiKey()){ aiUi.error="Handwriting needs a one-time setup — open “Handwriting setup” below and paste your free Gemini key."; aiUi.setupOpen=true; renderOverlays(); return; }
  if(aiUi.mode==="box"){ takePhoto(file=>aiHandleFile(file)); return; }
  // Add bill (offline "print" reader or online "hand" reader): up to 3 photos, each read the moment it is captured.
  const session = createBillSession(aiUi.mode);
  takePhoto(files=>finishBillSession(session, files), 3, {
    hint: "Take up to 3 photos — e.g. each page of the prescription",
    onReady: ()=>session.start(), onShot: f=>session.addPhoto(f), onCancel: ()=>session.dispose()
  });
  session.start();   // side by side with the camera: up to 3 readers start now
}
function aiResizeImage(file, maxSide){
  return new Promise((resolve,reject)=>{
    const img=new Image(), u=URL.createObjectURL(file);
    img.onload=()=>{
      URL.revokeObjectURL(u);
      const k=Math.min(1, maxSide/Math.max(img.width,img.height)), c=document.createElement("canvas");
      c.width=Math.round(img.width*k); c.height=Math.round(img.height*k);
      c.getContext("2d").drawImage(img,0,0,c.width,c.height);
      resolve(c.toDataURL("image/jpeg",0.85).split(",")[1]);
    };
    img.onerror=()=>{ URL.revokeObjectURL(u); reject(new Error("Couldn't read that photo")); };
    img.src=u;
  });
}
// ---- offline-friendly handwriting: photos taken without internet wait in a queue ----
const AI_QUEUE_KEY="clinic_ai_queue", AI_READY_KEY="clinic_ai_ready";
let aiQueueBusy=false;
function aiList(k){ try{ const v=JSON.parse(localStorage.getItem(bk(k))||"[]"); return Array.isArray(v)?v:[]; }catch(e){ return []; } }
function aiSetList(k,v){ try{ localStorage.setItem(bk(k),JSON.stringify(v)); return true; }catch(e){ return false; } }
async function aiReadImage(image, customPrompt){
  const imgs=Array.isArray(image)?image:[image];
  // Google retires Gemini models often (gemini-2.5-flash now answers 404), so try a short list of
  // current Flash models in turn and remember the one that works. A model typed in the setup box goes first.
  const remembered=(localStorage.getItem("clinic_gemini_ok_model")||"").trim();
  const custom=(localStorage.getItem(AI_MODEL_KEY)||"").trim();
  const candidates=[custom,remembered,AI_DEFAULT_MODEL,"gemini-flash-latest","gemini-3-flash-preview","gemini-3.1-flash-lite-preview"]
    .filter((m,i,arr)=>m && arr.indexOf(m)===i);
  const prompt=customPrompt||"You are reading a handwritten medical prescription photo (it may mix English and Urdu). Output plain text only, in this exact layout:\nPATIENT: <patient name if written, else leave this line out>\nDAYS: <total number of days if a duration is written anywhere on the page, usually in the left margin and often circled; a digit next to دن means that many days (e.g. 7دن = 7); weeks: ایک ہفتہ=7, دو ہفتے=14; only use 30 if a month is clearly written; leave this line out if unsure>\nDAYS_TEXT: <copy exactly what the duration note looks like, e.g. 7دن>\nthen ONE line per medicine: the name exactly as written, strength if written, then the dose pattern as digits like 1-0-1 (morning-noon-night). Convert Urdu/Arabic digits ۰۱۲۳۴۵۶۷۸۹ to 0-9, and write patterns written with + , or . as 1-0-1. If a medicine has its own number of days, add it as 5 days after the pattern. Do not include timing words (before/after meals), headings, doctor details or commentary. If a word is unclear, give your best guess."+aiPromptExtras();
  const statuses=[];
  const wait=ms=>new Promise(r=>setTimeout(r,ms));
  let tries=0;
  for(const model of candidates){
    for(let attempt=0; attempt<2; attempt++){
      if(++tries>6) break;
      const ctl=new AbortController(), timer=setTimeout(()=>ctl.abort(),45000);
      let res=null;
      try{
        res=await fetch("https://generativelanguage.googleapis.com/v1beta/models/"+encodeURIComponent(model)+":generateContent?key="+encodeURIComponent(aiGeminiKey()),
          {method:"POST",headers:{"Content-Type":"application/json"},signal:ctl.signal,
           body:JSON.stringify({contents:[{parts:[{text:prompt}].concat(imgs.map(d=>({inline_data:{mime_type:"image/jpeg",data:d}})))}]})});
      }catch(e){
        if(e && e.name==="AbortError"){ statuses.push("slow"); continue; }   // too slow: try again / next model
        throw e;                                                             // real network failure -> photo gets queued
      } finally{ clearTimeout(timer); }
      if(res.ok){
        const data=await res.json();
        const parts=(data&&data.candidates&&data.candidates[0]&&data.candidates[0].content&&data.candidates[0].content.parts)||[];
        const text=parts.map(x=>x.text||"").join("\n").trim();
        if(!text) throw new Error("Nothing readable came back — try a clearer, closer photo");
        try{ localStorage.setItem("clinic_gemini_ok_model",model); }catch(e){}
        return text;
      }
      statuses.push(res.status);
      if([500,502,503,504].includes(res.status)){ await wait(1500*(attempt+1)); continue; } // Google busy: retry, then next model
      if(![400,403,404,429].includes(res.status)) throw new Error("The reader answered with an error ("+res.status+")");
      break; // this model isn't usable for the key — next model
    }
  }
  if(statuses.some(x=>[500,502,503,504].includes(x)||x==="slow")) throw new Error("Google's reader is busy or slow right now — wait a minute and try again (the app already retried)");
  if(statuses.includes(429)) throw new Error("Free limit reached for now — try again a little later");
  if(statuses.every(x=>x===400)) throw new Error("Google didn't accept the key — check “Handwriting setup”");
  throw new Error("None of the Gemini models I tried is available to your free key right now ("+statuses.join(", ")+")");
}
function aiQueuePhoto(image){
  const q=aiList(AI_QUEUE_KEY);
  if(q.length>=5){ aiUi.error="5 photos are already waiting — connect to the internet first."; return; }
  q.push(image);
  if(!aiSetList(AI_QUEUE_KEY,q)){ aiUi.error="Not enough space to save the photo — try again with internet."; return; }
  aiUi.error="";
  showToast("📥 Photo saved — it will be read when internet returns");
}
async function aiProcessQueue(){
  if(aiQueueBusy || !navigator.onLine || !aiGeminiKey()) return;
  let q=aiList(AI_QUEUE_KEY); if(!q.length) return;
  aiQueueBusy=true; let done=0;
  try{
    while(q.length){
      const text=await aiReadImage(q[0]);
      const ready=aiList(AI_READY_KEY); ready.push(text); aiSetList(AI_READY_KEY,ready);
      q.shift(); aiSetList(AI_QUEUE_KEY,q); done++;
    }
  }catch(e){ /* stays queued; retried on the next connection */ }
  aiQueueBusy=false;
  if(done){ showToast("📖 "+done+" saved photo"+(done>1?"s":"")+" read — open ✨ Quick add"); if(aiUi.open && !aiUi.rows) render(); }
}
function aiLoadReady(){
  const ready=aiList(AI_READY_KEY); if(!ready.length) return;
  aiUi.text=(aiUi.text?aiUi.text+"\n":"")+ready.join("\n");
  aiSetList(AI_READY_KEY,[]);
  aiUi.rows=aiParseText(aiUi.text); if(!aiUi.rows.length) aiUi.rows=null;
  renderOverlays();
}
window.addEventListener("online",()=>{ aiProcessQueue(); });
setTimeout(aiProcessQueue,6000);
// ---- printed text: Tesseract OCR runs on the phone (first use downloads ~15 MB, then works offline) ----
// ===== Keyboard closed with the Back / hide key while the typing box keeps its focus =====
// Android closes the keyboard on Back but leaves the box "focused", and tells the page nothing (no blur, and the Back press itself is
// swallowed by the keyboard, so the popstate handler never sees it). Everything that follows focus then stays stuck in "typing" mode:
// the recent-searches list stays open. The one thing that DOES change is the visible height — it
// shrinks when the keyboard comes up and grows back when it goes — so: once the height has been seen shrinking while a box is focused,
// and it later returns to (about) its normal size with that box still focused, the keyboard is gone and the box is released.
// A plain tap on empty page space also releases it (that is also what people expect from tapping away from a text box).
(function(){
  const vv = window.visualViewport || null;
  const typing = el => !!el && (el.tagName==="TEXTAREA" || el.isContentEditable || (el.tagName==="INPUT" && !/^(checkbox|radio|button|submit|range|file|color|reset|image)$/i.test(el.type||"text")));
  const visH = ()=>Math.min(window.innerHeight||0, vv ? (vv.height||0) : (window.innerHeight||0));
  const base = {p:0,l:0};                       // biggest visible height seen per orientation = "no keyboard"
  const orientKey = ()=>(window.innerHeight>=window.innerWidth)?"p":"l";
  let sawKb = false, timer = 0;
  function release(a){ sawKb = false; try{ a.blur(); }catch(e){} }
  function tick(){
    const a = document.activeElement;
    if(!typing(a)){ sawKb = false; if(timer){ clearInterval(timer); timer = 0; } return; }
    const k = orientKey(), cur = visH(); if(!(cur>0)) return;
    if(cur > base[k]) base[k] = cur;
    const gap = base[k] - cur;
    if(gap > Math.max(120, base[k]*0.14)) sawKb = true;          // the keyboard has come up
    else if(sawKb && gap < 60) release(a);                        // ...and it has gone again, but the box still has focus
  }
  function watch(){ tick(); if(!timer) timer = setInterval(tick, 150); }
  document.addEventListener("focusin", ()=>{ const k = orientKey(), cur = visH(); if(cur > base[k]) base[k] = cur; watch(); });
  window.addEventListener("resize", ()=>{ if(typing(document.activeElement)) watch(); });
  if(vv) vv.addEventListener("resize", ()=>{ if(typing(document.activeElement)) watch(); });
  window.addEventListener("orientationchange", ()=>{ base.p = base.l = 0; sawKb = false; });
  document.addEventListener("click", e=>{
    const a = document.activeElement; if(!typing(a)) return;
    const t = e.target; if(!t || !t.closest) return;
    if(t.closest("input,textarea,select,button,a,label,summary,[onclick],[role='button'],[contenteditable],.recent-box,.modal-overlay")) return;
    release(a);
  }, true);
})();

// ===== Keep the typing box inside a pop-up menu visible ABOVE the on-screen keyboard =====
// Many phones (and the App Inventor web viewer) do not shrink the page when the keyboard opens, so a pop-up menu that sits at
// the bottom of the screen ends up behind the keyboard. While a typing box inside a menu is focused we lift the menu by the
// keyboard's height (measured when the phone reports it, otherwise ~42% of the screen) and scroll the box into view.
(function(){
  const root = document.documentElement, body = document.body, vv = window.visualViewport;
  const isTyping = el => !!el && (el.tagName==="TEXTAREA" || (el.tagName==="INPUT" && !/^(checkbox|radio|button|submit|range|file|color|reset|image)$/i.test(el.type||"text")));
  const inMenu = el => !!(el && el.closest && el.closest(".modal-overlay"));
  let base = window.innerHeight, raf = 0;
  function release(){ body.classList.remove("kb-lift","kb-vv"); root.style.setProperty("--kb","0px"); }
  // Glue the pop-up to the visible area above the keyboard. The browser may PAN that area when a box is tapped (it does so differently
  // for every box), so this is re-run on every pan ("scroll") and every resize of the visible area, not only on resize.
  function syncVV(){
    if(!vv || !body.classList.contains("kb-vv")) return;
    root.style.setProperty("--vvTop", vv.offsetTop+"px");
    root.style.setProperty("--vvH", vv.height+"px");
  }
  function syncSoon(){ if(raf) return; raf = requestAnimationFrame(()=>{ raf = 0; syncVV(); }); }
  function apply(){
    base = Math.max(base, window.innerHeight);
    const a = document.activeElement;
    if(!(isTyping(a) && inMenu(a))){ release(); return; }
    if(window.innerHeight < base*0.85){ release(); return; }          // the page itself already shrank: the menu already sits above the keyboard
    const covered = vv ? window.innerHeight - vv.height : 0;
    if(vv && covered>120){
      body.classList.remove("kb-lift"); body.classList.add("kb-vv"); root.style.setProperty("--kb","0px"); syncVV();
    } else {

(function(){

  const fab=document.getElementById("invFab"); if(!fab) return;
  const KEY="clinic_fab_pos"; let lastW=innerWidth;
  function place(L,T){
    const w=fab.offsetWidth||54, h=fab.offsetHeight||54;
    L=Math.min(Math.max(0,L),innerWidth-w); T=Math.min(Math.max(0,T),innerHeight-h);
    fab.dataset.moved="1"; fab.style.right="auto"; fab.style.bottom="auto"; fab.style.left=L+"px"; fab.style.top=T+"px";
    return {x:L/innerWidth,y:T/innerHeight};
  }

  const isLocked=()=>{ try{ return localStorage.getItem(LOCK)==="1"; }catch(e){ return false; } };
  // The spot is remembered across app restarts ONLY while locked from Settings; otherwise it goes back to the default next time.
  function load(){ if(!isLocked()) return; try{ const p=JSON.parse(localStorage.getItem(KEY)||"null"); if(p&&typeof p.x==="number") place(p.x*innerWidth,p.y*innerHeight); }catch(e){} }

    } else {
      try{

  window.addEventListener("resize",()=>{ if(innerWidth!==lastW){ lastW=innerWidth; load(); } });

  },{passive:true});

/* ===================== STORAGE & HEALTH (read-only) =====================
   Measures how full the cloud document and the phone's storage are, how fast saving is on this phone,
   and checks the data for inconsistencies. It only READS — nothing is changed or deleted by it. */
const CLOUD_DOC_LIMIT = 1048576; // Firestore's hard limit per document (1 MiB)
function _hBytes(v){ try{ const t=JSON.stringify(v); return (typeof TextEncoder!=="undefined") ? new TextEncoder().encode(t).length : t.length; }catch(e){ return 0; } }
function _hKB(b){ return (b/1024).toLocaleString("en-US",{minimumFractionDigits:1,maximumFractionDigits:1})+" KB"; }
function _hTime(fn){ const t0=performance.now(); try{ fn(); }catch(e){} return Math.max(0.1, performance.now()-t0).toFixed(1)+" ms"; }
function cloudPayloadStats(){
  const mine = cloudTxFor(0);
  const payload = sanitizeForFirestore(activeBranchId==="main" ? buildCloudPayload(mine) : buildBranchPayload(mine));
  const trimmedCount = trimInventoryForCloud.lastRemoved||0;
  const fullBytes = _hBytes(sanitizeForFirestore(buildFullStatePayload()));
  const total = _hBytes(payload), parts = [];
  Object.keys(payload).forEach(k=>parts.push([k,_hBytes(payload[k])]));
  parts.sort((a,b)=>b[1]-a[1]);
  const nTx = (transactions||[]).length, txBytes = _hBytes(transactions);
  const since = Date.now()-30*86400000, recent = (transactions||[]).filter(t=>(t.timestamp||0)>=since).length;
  const perDay = recent/30, perBill = nTx ? txBytes/nTx : 0;
  const extraDocs = billDocs.length;
  // Until the 70% mark is reached the document is the one that will spill; afterwards bills continue in extra documents by themselves,
  // so the figure that matters is the part that can NOT spill (stock, staff, settings).
  const room = Math.max(0, CLOUD_SPILL_AT-total);
  const daysToExtra = (!extraDocs && perDay>0 && perBill>0) ? Math.floor(room/(perDay*perBill)) : null;
  const nonSpill = jsonBytes(sanitizeForFirestore(activeBranchId==="main" ? buildCloudPayload([]) : buildBranchPayload([])));
  return { total, saved: Math.max(0, fullBytes-total), trimmedCount, pct: total/CLOUD_DOC_LIMIT*100, parts, nTx, perDay, perBill, extraDocs, daysToExtra, nonSpill, nonSpillPct: nonSpill/CLOUD_DOC_LIMIT*100,
           extraAdded: Number(localStorage.getItem("clinic_cloud_extra_added")||0) };
}
function dataIntegrityIssues(){
  const out = [], meds = (inventory||[]).filter(m=>!m.deleted);
  const gt = {};
  meds.forEach(m=>{
    const label = m.name+(m.mg?" "+m.mg:"");
    const sum = (m.batches||[]).filter(b=>!b.disposed && b.pillsRemaining>0).reduce((s,b)=>s+b.pillsRemaining,0);
    if(Number(m.stockPills)!==sum) out.push(`Stock mismatch — ${label}: shows ${m.stockPills}, batches add up to ${sum}`);
    if(!(Number(m.stockPills)>=0)) out.push(`Invalid stock — ${label}: ${m.stockPills}`);
    if(!(Number(m.mrpPerBox)>0)) out.push(`No valid price — ${label}`);
    if(!(Number(m.pillsPerBox)>0)) out.push(`No valid medicine-per-box — ${label}`);
    (m.batches||[]).forEach(b=>{ if(!b.disposed && b.pillsRemaining<0) out.push(`Negative batch quantity — ${label}`); });
    if(m.gtin){ (gt[m.gtin]=gt[m.gtin]||[]).push(label); }
  });
  Object.keys(gt).forEach(g=>{ if(gt[g].length>1) out.push(`Same barcode on ${gt[g].length} medicines: ${gt[g].join(" / ")}`); });
  const seen = {};
  meds.forEach(m=>{
    const k=[m.name,m.category||m.specialCategory,m.formula,m.mg,m.mrpPerBox,m.pillsPerBox].map(x=>String(x==null?"":x).trim().toLowerCase()).join("|");
    (seen[k]=seen[k]||[]).push(m);
  });
  Object.keys(seen).forEach(k=>{ if(seen[k].length>1) out.push(`Exact duplicate medicine: ${seen[k][0].name} (${seen[k].length} copies)`); });
  const now=Date.now();
  let badTx=0, future=0;
  (transactions||[]).forEach(t=>{ if(!t || !(t.timestamp>0) || !isFinite(Number(t.grandTotal))) badTx++; else if(t.timestamp>now+86400000) future++; });
  if(badTx) out.push(`${badTx} bill(s) with a missing date or total`);
  if(future) out.push(`${future} bill(s) dated in the future (check the phone's clock)`);
  return out;
}
// ---- The Storage & health page (Settings › Tools & health). Read-only: it only measures, nothing is changed. ----
let healthUi = { open:false, data:null };
function _hMs(fn){ const t0=performance.now(); try{ fn(); }catch(e){} return Math.max(0.1, performance.now()-t0); }
function _hMsText(v){ return (v>=100 ? Math.round(v) : v.toFixed(1))+" ms"; }
function healthCollect(){
  const st = cloudPayloadStats();
  let tot=0; const keys=[];
  try{ for(let i=0;i<localStorage.length;i++){ const k=localStorage.key(i); if(!k) continue; const b=(k.length+String(localStorage.getItem(k)||"").length)*2; tot+=b; keys.push([k,b]); } }catch(e){}
  keys.sort((a,b)=>b[1]-a[1]);
  const meds=(inventory||[]).filter(m=>!m.deleted), nb=meds.reduce((s,m)=>s+(m.batches||[]).length,0);
  const yearAgo=Date.now()-365*86400000, old=(transactions||[]).filter(t=>(t.timestamp||0)<yearAgo).length;
  const speeds={ meds:_hMs(()=>JSON.stringify(inventory)), bills:_hMs(()=>JSON.stringify(transactions)), cloud:_hMs(()=>sanitizeForFirestore(buildCloudPayload())) };
  let lastBackup=0; try{ lastBackup=Number(localStorage.getItem("clinic_last_backup")||0); }catch(e){}
  return { st, tot, keys, nMeds:meds.length, nb, old, speeds, issues:dataIntegrityIssues(), bootMs:window.__bootMs||0, lastBackup, at:Date.now() };
}
function healthAgo(ts){

}

// The overall verdict + each part's level ("ok" | "warn" | "bad")
function healthLevels(h){

  const sync = (typeof syncStatus!=="undefined") ? syncStatus : "offline";
  const L = {

    nonSpill: st.nonSpillPct>=80 ? "bad" : st.nonSpillPct>=60 ? "warn" : "ok",
    phone: phonePct>=85 ? "bad" : phonePct>=60 ? "warn" : "ok",
    issues: h.issues.length>=10 ? "bad" : h.issues.length ? "warn" : "ok",
    speed: worstMs>=1000 ? "bad" : worstMs>=300 ? "warn" : "ok",
    backup: (h.lastBackup && Date.now()-h.lastBackup<=7*86400000) ? "ok" : "warn",

  if(L.phone!=="ok") reasons.push(`Phone storage ${phonePct.toFixed(0)}% full`);

  const vals=[L.nonSpill,L.phone,L.issues,L.speed,L.backup,L.sync];

}
function _hCol(l){ return l==="bad" ? ["var(--danger)","var(--dangerSoft)"] : l==="warn" ? ["var(--warning)","var(--warningSoft)"] : ["var(--success)","var(--successSoft)"]; }

    const left=Math.min(Math.max(8, r.left+r.width/2-mw/2), innerWidth-mw-8);

// How sharp a picture is (variance of a Laplacian on a 320 px copy). High = crisp text, low = blur.
function imgSharpness(src){

async function takeSharpPhoto(c0, v, imgCap){

/* ===================== DIAGNOSTICS (Admin only) ===================== */
// One master switch (Settings > Diagnostics). OFF = nothing is recorded and nothing runs in the
// background. ON = errors, sync events, network calls (no keys/addresses with secrets), slow screens
// and app-bridge commands are kept in a log, and the panel can run live health checks.
const DIAG_KEY="clinic_diag_on", DIAG_LOG_KEY="clinic_diag_log";
let diagUi={open:false,snap:null,checks:null,busy:false};
let diagLogBuf=[], diagLastRender=0;
const diagOn=()=>localStorage.getItem(DIAG_KEY)==="1";
function diagLog(type,msg){
  if(!diagOn()) return;
  diagLogBuf.push({t:Date.now(),type,msg:String(msg).slice(0,300)});
  if(diagLogBuf.length>150) diagLogBuf.shift();
  clearTimeout(diagLog._t);
  diagLog._t=setTimeout(()=>{ try{ localStorage.setItem(DIAG_LOG_KEY,JSON.stringify(diagLogBuf.slice(-100))); }catch(e){} },1500);
}
(function(){
  try{ const v=JSON.parse(localStorage.getItem(DIAG_LOG_KEY)||"[]"); diagLogBuf=Array.isArray(v)?v:[]; }catch(e){}
  window.addEventListener("error",e=>diagLog("error",(e.message||"error")+" @"+String(e.filename||"").split("/").pop()+":"+e.lineno));
  window.addEventListener("unhandledrejection",e=>diagLog("error","promise: "+((e.reason&&e.reason.message)||e.reason)));
  window.addEventListener("online",()=>diagLog("net","back online"));
  window.addEventListener("offline",()=>diagLog("net","went offline"));
  const _render=window.render;
  if(typeof _render==="function") window.render=function(){ const t0=performance.now(); const r=_render.apply(this,arguments); const dt=performance.now()-t0; diagLastRender=Math.round(dt); if(dt>200) diagLog("slow","render() took "+Math.round(dt)+" ms on "+tab); return r; };
  const _fetch=window.fetch.bind(window);
  window.fetch=function(u,o){
    if(!diagOn()) return _fetch(u,o);
    const t0=performance.now(), name=String((u&&u.url)||u).replace(/[?#].*$/,"").replace(/^https?:\/\//,"").slice(0,60); // query (keys) is never logged
    return _fetch(u,o).then(r=>{ diagLog(r.ok?"net":"error","fetch "+name+" -> "+r.status+" ("+Math.round(performance.now()-t0)+" ms)"); return r; },
                            e=>{ diagLog("error","fetch "+name+" failed: "+(e&&e.message)); throw e; });
  };
})();
function diagWrapBridge(){
  try{
    const A=window.AppInventor;
    if(A && !A.__diagWrapped && typeof A.setWebViewString==="function"){
      const f=A.setWebViewString.bind(A);
      A.setWebViewString=function(m){ diagLog("bridge","to app: "+String(m).slice(0,24).replace(/[\r\n]/g," ")); return f(m); };
      A.__diagWrapped=true;
    }
  }catch(e){}
}
setTimeout(diagWrapBridge,3000);
function openDiag(){ if(!can("diagnostics")) return; diagUi.open=true; diagUi.snap=null; diagUi.checks=null; diagWrapBridge(); renderOverlays(); if(diagOn()) diagRefresh(); }
function closeDiag(){ diagUi.open=false; renderOverlays(); }
function diagToggle(on){
  try{ localStorage.setItem(DIAG_KEY,on?"1":"0"); }catch(e){}
  if(on){ diagWrapBridge(); diagLog("info","Diagnostics turned ON"); diagRefresh(); }
  else { diagLogBuf=[]; try{ localStorage.removeItem(DIAG_LOG_KEY); }catch(e){} diagUi.snap=null; diagUi.checks=null; renderOverlays(); }
}
function diagClear(){ diagLogBuf=[]; try{ localStorage.removeItem(DIAG_LOG_KEY); }catch(e){} renderOverlays(); }
async function diagSnapshot(){
  const s={}, est=estimatedCloudDataSize();
  s["Time"]=new Date().toLocaleString();
  s["Network"]=navigator.onLine?"online":"offline";
  s["Cloud sync"]=syncStatus+(lastSyncError?" · "+lastSyncError:"");
  s["Firebase"]=fbDb?"started":"NOT started";
  s["Cloud document"]=est!=null?formatBytes(est)+" = "+(est/1048576*100).toFixed(0)+"% of the 1 MB Firestore limit":"unknown";
  s["Medicine safety net"]=(_vaultInfo.ok?"working":"NOT working on this phone")+" · "+(_vaultInfo.snaps||0)+" safety copies"+(_vaultInfo.lastT?" (newest "+fmtDateTime(_vaultInfo.lastT)+")":"")+" · "+inventory.filter(m=>m&&m.deleted).length+" deleted (restorable) · "+(_vaultInfo.recovered||0)+" put back automatically this session"+(window.__lsHydrationFailed?" · PHONE STORAGE UNREADABLE":"")+(window.__lsPersistFailed?" · a storage write failed earlier":"");
  s["Data"]=inventory.filter(m=>!m.deleted).length+" medicines · "+transactions.filter(t=>!t.deleted).length+" bills · "+profiles.filter(p=>!p.deleted).length+" users";
  try{ const e=await navigator.storage.estimate(); s["Phone storage"]=formatBytes(e.usage)+" used of "+formatBytes(e.quota); }catch(x){ s["Phone storage"]="n/a"; }
  s["Offline mode"]=navigator.serviceWorker?(navigator.serviceWorker.controller?"service worker active":"not controlling this page yet"):"not supported";
  try{ s["App version"]=(await caches.keys()).join(", ")||"none"; }catch(x){ s["App version"]="n/a"; }
  try{ s["Camera permission"]=(await navigator.permissions.query({name:"camera"})).state; }catch(x){ s["Camera permission"]="unknown"; }
  s["AI reader"]=(aiGeminiKey()?"Gemini key saved":"no key")+" · "+aiList(AI_QUEUE_KEY).length+" photo(s) waiting";
  s["Screen"]=innerWidth+"x"+innerHeight+" @"+devicePixelRatio+"x";
  s["Memory"]=performance.memory?Math.round(performance.memory.usedJSHeapSize/1048576)+" MB JS heap":"n/a";
  const nav=performance.getEntriesByType("navigation")[0];
  if(nav) s["Load time"]=Math.round(nav.domContentLoadedEventEnd)+" ms to ready · "+Math.round(nav.loadEventEnd)+" ms fully loaded";
  s["Last screen draw"]=diagLastRender+" ms";
  return s;
}
async function diagRunChecks(){
  const out=[], add=(n,ok,d)=>out.push({n,ok,d:d||""});
  let t=performance.now();
  try{ await fetch("https://www.gstatic.com/generate_204",{mode:"no-cors",cache:"no-store"}); add("Internet",true,Math.round(performance.now()-t)+" ms"); }catch(e){ add("Internet",false,"not reachable"); }
  if(fbDb){ t=performance.now(); try{ await withTimeout(cloudDocRef().get({source:"server"}),8000); add("Cloud database",true,Math.round(performance.now()-t)+" ms"); }catch(e){ add("Cloud database",false,formatSyncError(e)); } }
  else add("Cloud database",false,"Firebase not started");
  try{ localStorage.setItem("__diag","1"); localStorage.removeItem("__diag"); add("Saving on the phone",true); }catch(e){ add("Saving on the phone",false,e.message); }
  add("Camera",!!(navigator.mediaDevices&&navigator.mediaDevices.getUserMedia),"");
  add("Offline mode",!!(navigator.serviceWorker&&navigator.serviceWorker.controller),"");
  const pct=(estimatedCloudDataSize()||0)/1048576*100; add("Cloud document size",pct<70,pct.toFixed(0)+"% of the 1 MB limit");
  diagLog("check",out.map(o=>(o.ok?"ok ":"FAIL ")+o.n).join("; "));
  return out;
}
async function diagRefresh(){ diagUi.busy=true; renderOverlays(); diagUi.snap=await diagSnapshot(); diagUi.busy=false; renderOverlays(); }
async function diagChecksNow(){ diagUi.busy=true; renderOverlays(); diagUi.checks=await diagRunChecks(); diagUi.snap=await diagSnapshot(); diagUi.busy=false; renderOverlays(); }

}

/* ===================== MEDICINE RETURNS (inside the New Bill screen) =====================
   A return is its own entry in Records (a "Return" tag, negative amounts): it lowers that day's / month's totals and the
   medicines go back into stock. It is NOT counted as a bill or a patient. You can return and sell in the same visit:
   the returned lines and the new medicines are on the same screen, and Complete saves a return entry + a sale entry.
   Within RETURN_FREE_DAYS of the bill: full refund. Later: you choose the % to deduct (No deduction, a quick %, or typed). */
var RETURN_FREE_DAYS = 3;
var RETURN_CUT_CHIPS = [10,20,30,50];
var retUi = { active:false, name:"", txId:"", qty:{}, pct:null };
function isReturnTx(t){ return !!(t && t.kind==="return"); }
// Which bill line a return belongs to: matched by the line's stable id (lid/srcLid) when both sides
// have one, which survives the bill being edited and its lines reordered afterwards. Bills saved
// before this id existed (and any return recorded against them) fall back to matching by raw array
// position, exactly as before — same limitation they always had, nothing new breaks for old data.
function retDoneQty(txId, idx, lid){
  return q6(visibleTransactions().filter(t=>isReturnTx(t) && t.refOf===txId)
    .reduce((a,t)=>a+(t.items||[]).filter(i=> (lid!=null && i.srcLid!=null) ? i.srcLid===lid : i.srcIdx===idx).reduce((s2,i)=>s2+Math.abs(Number(i.pills)||0),0),0));
}
function retLine(t,i){
  const it=t.items[i], sold=Math.abs(Number(it.pills)||0), left=Math.max(0,q6(sold-retDoneQty(t.id,i,it.lid)));
  const ratio=(t.medTotal||0)>0 ? ((t.medTotal-(t.medsDiscount||0))/t.medTotal) : 1;   // what was really paid after the bill's medicine discount
  const gross=it.subtotal!=null ? Number(it.subtotal) : (Number(it.pricePerPill)||0)*sold;
  return { it, sold, left, per: sold>0 ? gross/sold*ratio : 0 };
}
function retBill(){ return retUi && retUi.txId ? transactions.find(x=>x.id===retUi.txId && !x.deleted) : null; }
function retTotals(){
  const t=retBill(); if(!retUi || !retUi.active || !t) return {V:0,D:0,refund:0,n:0,days:0,within:true,need:false};
  let V=0,n=0;
  (t.items||[]).forEach((it,i)=>{ const l=retLine(t,i), q=Math.min(l.left, Math.max(0,Number(retUi.qty[i])||0)); if(q>0){ V=r2(V+r2(l.per*q)); n++; } });
  const days=(Date.now()-t.timestamp)/86400000, within=days<=RETURN_FREE_DAYS;
  const pct=within?0:(retUi.pct==null?0:retUi.pct), D=r2(V*pct/100);
  return { V, D, refund:r2(V-D), n, days, within, need:false };   // no forced choice any more: "No deduction" is the default, tap a % only if you want to deduct
}
function retPending(){ return !!(retUi && retUi.active && retTotals().n>0); }
function retBlocked(){ if(!retUi || !retUi.active) return false; const T=retTotals(); return T.n>0 && T.need; }
function retReset(){ retUi={ active:false, name:"", txId:"", qty:{}, pct:null }; }
function retFill(){ const t=retBill(); retUi.qty={}; if(t) (t.items||[]).forEach((it,i)=>{ retUi.qty[i]=retLine(t,i).left; }); }   // starts as "everything they bought"
function retStart(name){
  const list=patientTxList(name);
  if(!list.length){ showToast("No earlier bill found for this patient"); return; }
  retUi={ active:true, name:name, txId:list[0].id, qty:{}, pct:null }; retFill(); render();
  setTimeout(()=>{ const el=document.getElementById("retCard"); if(el && el.scrollIntoView) el.scrollIntoView({behavior:"smooth",block:"start"}); },60);
}
function retCancel(){ retReset(); render(); }
function retPickBill(id){ retUi.txId=id; retUi.pct=null; retFill(); render(); }
function retQty(i,d){ const t=retBill(); if(!t) return; const l=retLine(t,i); retUi.qty[i]=Math.max(0,Math.min(l.left,q6((Number(retUi.qty[i])||0)+d))); render(); }
function retQtySet(i,v){ const t=retBill(); if(!t) return; const l=retLine(t,i); retUi.qty[i]=Math.max(0,Math.min(l.left,Number(String(v).replace(/[^0-9.]/g,""))||0)); render(); }
function retAll(){ retFill(); render(); }
function retNone(){ retUi.qty={}; render(); }
function retPct(v){ retUi.pct=(v===null||v==="")?null:Math.max(0,Math.min(100,Number(String(v).replace(/[^0-9.]/g,""))||0)); render(); }
function retPctTyped(v){ retUi.pct=(v===""?null:Math.max(0,Math.min(100,Number(String(v).replace(/[^0-9.]/g,""))||0))); retRefresh(); }
function retSummaryHtml(){
  const T=retTotals(), t=retBill(); if(!t) return "";
  let h=`<div class="row"><span>Medicines returned (${T.n})</span><strong>${CURRENCY}${money(T.V)}</strong></div>`;
  if(T.within) h+=`<p class="small" style="margin:6px 0 0;color:var(--success);">Within ${RETURN_FREE_DAYS} days of the bill \u2014 full refund.</p>`;

// Expiry check for a medicine being returned: returns {d: days left (negative = already expired), date, exact} when it is
// expired or expires within 10 days, else null. Bills made from now on remember the expiry of the batch that was sold ("exact");
// for older bills it looks at the nearest-expiry stock still on the shelf, which is the batch returned pills are added to.
function retExpiryInfo(it){
  let date = it && it.exp, exact = !!date;
  if(!date){
    const m = inventory.find(x=>x.id===(it&&it.medId) && !x.deleted); if(!m) return null;
    let best = null;
    activeBatches(m).forEach(b=>{ if(b.expiryDate && (!best || b.expiryDate<best)) best = b.expiryDate; });
    date = best;
  }
  if(!date) return null;
  const d = daysUntil(date);
  if(d===null || d>10) return null;
  return { d, date, exact };
}

// ── Native app (APK) update check ───────────────────────────────────────────
// This file's own HTML/JS content already self-updates on its own (see sw.js's
// network-first strategy) — nobody needs to do anything when only this file changes.
// But a change on the App Inventor project side itself (a new extension, a Screen
// property, etc.) needs a real new APK, and Android can't silently self-install that
// the way the web content updates — someone still has to tap to install it. This
// compares a small version.json (hosted in the same GitHub folder as this file)
// against the number the App Inventor project reports for itself, and shows a small
// dismissible banner with a direct download link when they differ, so people find out
// automatically instead of everyone having to remember to go ask.
//
// Wiring required on the App Inventor side (one-time), two parts:
//
// Part 1 — reporting the installed version — in Screen1.Initialize, BEFORE navigating
// the WebViewer to this app's URL (this app already has a Screen1.Initialize block that
// sets ScreenOrientation and the HideBars colors — just add one more line to it):
//   set WebViewer1.WebViewString to "1"
// — using whatever version number matches this build. Bump that text (and rebuild)
// every time you publish a new APK, and bump version.json's apkVersion to match on
// GitHub at the same time.
//
// Part 2 — actually opening the download — App Inventor's built-in WebViewer is
// documented to silently do nothing when a link to a downloadable file (like an .apk)
// is tapped inside it; it has no download handling at all. So tapping the banner's
// button below doesn't navigate anywhere itself — it sends "OPEN_URL:" + the link back
// through WebViewString, using the exact same outbound-command pattern this app already
// uses for EXPORT:, SHARE_TEXT:, SELECT_PRINTER, etc. Add ONE more branch to the very
// end of the existing WebViewer1.WebViewStringChange chain (no Clock/timer needed —
// that event already fires whenever JS sets WebViewString):
//   else if [1] starts at text [get value] piece "OPEN_URL:"
//   then set ActivityStarter1.Action to "android.intent.action.VIEW"
//        set ActivityStarter1.DataUri to (segment text [get value] start 10
//                                          length (length[get value] - 9))
//        call ActivityStarter1.StartActivity
// Requires one new non-visible component: ActivityStarter (Connectivity drawer). That
// opens the phone's normal browser (Chrome) with the APK link, which downloads it
// properly and shows the usual "Open" notification → Android's real install prompt.
// That opens the phone's normal browser (Chrome) with the APK link, which downloads
// it properly and shows the usual "Open" notification → Android's real install prompt.
function checkForAppUpdate(){
  try{
    if(typeof AppInventor === "undefined" || typeof AppInventor.getWebViewString !== "function") return;
    var installedVersion = AppInventor.getWebViewString();
    if(!installedVersion || String(installedVersion).indexOf(":")>-1) return; // not set yet, or the page's own last command (e.g. THEME_COLOR:...) is in there — nothing to compare against
    fetch("version.json?_=" + Date.now(), {cache:"no-store"})
      .then(function(r){ return r.ok ? r.json() : null; })
      .then(function(data){
        if(!data || !data.apkVersion || !data.apkUrl) return;
        if(String(data.apkVersion) === String(installedVersion)) return; // already current
        showAppUpdateBanner(data.apkUrl);
      })
      .catch(function(){}); // offline, or version.json not deployed yet — fail silent, not fatal
  }catch(e){}
}

function showAppUpdateBanner(apkUrl){
  if(document.getElementById("appUpdateBanner")) return; // don't stack duplicates
  var b = document.createElement("div");
  b.id = "appUpdateBanner";
  b.style.cssText = "position:fixed;left:0;right:0;top:var(--header-h);z-index:55;background:#B4650A;color:#fff;"+
    "padding:10px 14px;font-size:13px;display:flex;align-items:center;justify-content:center;gap:12px;flex-wrap:wrap;"+
    "box-shadow:0 2px 6px rgba(0,0,0,.2);";

    'style="background:#fff;color:#B4650A;font-weight:700;border:none;border-radius:6px;padding:5px 12px;cursor:pointer;font-size:13px;">Upload offline data then download new app</button>'+

// Installing a new APK is a real reinstall from Android's point of view, and someone could be
// tapping this while offline work (a bill, a restock) hasn't reached the server yet — so this
// always uploads first (reusing the exact same "Upload offline data" flow as the sync menu,
// progress bar and toast included) and the download link only opens once that upload has
// actually confirmed everything reached the server. If it couldn't (no connection, etc.),
// manualPushToCloud()'s own toast already says so — the banner is left in place so they can
// just tap the same button again once they're back online, rather than risking a reinstall
// before today's bills/stock changes are actually saved anywhere but this device.
async function uploadThenDownloadAppUpdate(apkUrl, btn){
  const label = btn ? btn.textContent : null;
  if(btn){ btn.disabled = true; btn.textContent = "Uploading…"; }
  let allSynced = false;
  try{
    allSynced = (await manualPushToCloud()) === true;
  }catch(e){
    showToast("⚠ Upload didn't finish — tap again");
    return;
  } finally {
    if(btn){ btn.disabled = false; btn.textContent = label; }
  }
  // Same moment the "synced" / "already synced" message was shown, so that message can never be followed by nothing happening.
  if(allSynced || syncStatus === "synced" || (!hasPendingSync() && navigator.onLine!==false)) downloadAppUpdate(apkUrl);
}
function downloadAppUpdate(apkUrl){
  // If the phone's browser doesn't open within a few seconds (the page is still on screen), show the link so it can be
  // copied / shared into Chrome by hand - the update can never get stuck on a button that does nothing.
  let left = (document.visibilityState === "hidden");
  const onVis = ()=>{ if(document.visibilityState === "hidden") left = true; };
  document.addEventListener("visibilitychange", onVis);
  setTimeout(()=>{
    document.removeEventListener("visibilitychange", onVis);
    if(!left && document.visibilityState === "visible"){ showToast("Couldn't open the browser by itself — copy the link and open it in Chrome"); openShare(apkUrl); }
  }, 4000);
  showToast("Opening the download page…");
  try{
    if(typeof AppInventor !== "undefined" && typeof AppInventor.setWebViewString === "function"){
      // Prefixed to match the app's existing command pattern (EXPORT:, SHARE_TEXT:, etc.) —
      // the App Inventor side has one dispatch table in WebViewer1.WebViewStringChange, and a
      // bare URL wouldn't match any of its existing branches. See the OPEN_URL: branch added
      // there, which hands this off to ActivityStarter to open in the real browser (Chrome),
      // since the WebViewer component itself can't download files.
      // A "#" part is never sent to the server, so the download is unchanged, but it makes every command different:
      // sending the exact same text twice (a second tap after coming back without installing) could be ignored.
      AppInventor.setWebViewString("OPEN_URL:" + apkUrl + (apkUrl.indexOf("#")<0 ? "#" : "&") + "t=" + Date.now());
      return;
    }
  }catch(e){}
  window.open(apkUrl, "_blank"); // fallback when just testing this page in a normal browser
}

    let rows = "";
    Array.prototype.forEach.call(s.children, ch=>{
      if(ch.tagName==="OPTGROUP"){
        rows += `<div class="ss-group">${esc(ch.label)}</div>`;
        Array.prototype.forEach.call(ch.children, o=>{ if(o.tagName==="OPTION" && !o.hidden) rows += row(o); });
      } else if(ch.tagName==="OPTION" && !ch.hidden){ rows += row(ch); }
    });
    sheet = document.createElement("div");
    sheet.id = "selSheet";
    sheet.innerHTML = `<div class="ss-panel"><div class="ss-list">${rows}</div></div>`;
    sheet.addEventListener("click", e=>{
      const b = e.target.closest ? e.target.closest(".ss-row") : null;
      if(b){ if(!b.disabled) pick(Number(b.getAttribute("data-i"))); return; }
      if(e.target === sheet) closeSheet();                      // tap outside the list
    });
    document.body.appendChild(sheet);
    const on = sheet.querySelector(".ss-row.on");
    if(on && on.scrollIntoView){ try{ on.scrollIntoView({block:"center"}); }catch(e){} }
  }
  // Stop Android's own (white) list from opening, then show ours when the tap completes.
  document.addEventListener("mousedown", e=>{
    const s = e.target && e.target.closest ? e.target.closest("select") : null;
    if(isDark() && usable(s)) e.preventDefault();
  }, true);
  document.addEventListener("click", e=>{
    const s = e.target && e.target.closest ? e.target.closest("select") : null;
    if(isDark() && usable(s)){ e.preventDefault(); e.stopPropagation(); open(s); }
  }, true);
  // Back button while the list is open closes just the list (see the popstate handler near the top of this script).
  window.__selSheetClose = function(){ if(!sheet) return false; closeSheet(); return true; };
})();
// ===== Tab bar pinned from the TOP (App Inventor app only) =====
// Anchoring the bar to the bottom edge makes it ride up with the page when the on-screen keyboard shrinks the web view.
// Pinned from the TOP at a fixed distance it simply stays where it was: the keyboard covers it / it falls below the
// shrunken page, and when the keyboard closes it is exactly at the bottom again. Until a position has been measured the bar
// stays pinned to the bottom as before.
// The distance is MEASURED once (the bar's real position while it is bottom-pinned, with no keyboard up) and remembered on
// this device. It is measured again only when the page genuinely changes size without a keyboard: a new device / rotation /
// display size, a system bar appearing or disappearing, split-screen. Normal browsers are left completely alone.
(function(){
  if(typeof AppInventor === "undefined") return;
  const root = document.documentElement, nav = document.getElementById("nav"), bar = document.getElementById("navSafeBar");
  if(!nav) return;
  const KEY = "cb_navpin_v1";
  const typing = el=>!!el && (el.tagName==="TEXTAREA" || el.isContentEditable || (el.tagName==="INPUT" && !/^(checkbox|radio|button|submit|range|file|color|reset|image)$/i.test(el.type||"text")));
  const portrait = ()=>{ try{ return window.matchMedia("(orientation: portrait)").matches; }catch(e){ return window.innerHeight >= window.innerWidth; } };
  let rec = null;
  try{ const j = JSON.parse(localStorage.getItem(KEY) || "null"); if(j && j.top>0 && j.h>0 && j.w>0 && j.nh>0) rec = j; }catch(e){}

  function apply(){
    if(!rec) return;
    root.style.setProperty("--nav-top", rec.top + "px");
    root.style.setProperty("--safe-top", rec.safeTop + "px");
    root.classList.add("nav-top-pin");
  }
  // Reads where the bar really is: briefly puts it back to bottom-pinned, measures, and restores - all before anything is painted.
  function measure(){
    if(!portrait() || !nav.querySelector("button")) return null;      // not the real bar yet (login screen / still drawing)
    const had = root.classList.contains("nav-top-pin");
    root.classList.remove("nav-top-pin");
    void nav.offsetHeight;
    const r = nav.getBoundingClientRect(), b = bar ? bar.getBoundingClientRect() : null;
    const out = (r.height > 40 && r.top > 0 && r.bottom <= window.innerHeight + 1)
      ? { top: Math.round(r.top*100)/100, safeTop: Math.round((b ? b.top : window.innerHeight)*100)/100, nh: Math.round(r.height*100)/100, h: window.innerHeight, w: window.innerWidth }
      : null;
    if(had) root.classList.add("nav-top-pin");
    return out;
  }
  function remeasure(){
    const m = measure(); if(!m) return;
    rec = m; apply();
    try{ localStorage.setItem(KEY, JSON.stringify(rec)); }catch(e){}
  }

  let lastH = window.innerHeight, lastW = window.innerWidth, changedAt = Date.now(), lastTypingAt = 0;
  function tick(){
    const now = Date.now(), h = window.innerHeight, w = window.innerWidth;
    if(h !== lastH || w !== lastW){ lastH = h; lastW = w; changedAt = now; }
    if(typing(document.activeElement)) lastTypingAt = now;
    if(document.visibilityState === "hidden" || !portrait() || !nav.offsetHeight) return;
    const stable = now - changedAt, quiet = now - lastTypingAt;
    let need = false;
    if(!rec){ need = stable >= 700 && quiet >= 1200; }                                   // first time on this device
    else if(Math.abs(w - rec.w) > 2){ need = stable >= 700; }                            // different width: new device / display size
    else if(h > rec.h + 2){ need = stable >= 350; }                                      // page got taller: keyboard closed, or a bar hid
    else if(rec.h - h > 2){                                                              // page got shorter...
      const big = Math.max(100, rec.h * 0.12);                                           // ...a keyboard is always at least this tall
      need = (rec.h - h < big) ? stable >= 400 : (stable >= 2500 && quiet >= 2500);      // small = a system bar came back; big & staying = split-screen etc. (never while typing)
    }
    else if(Math.abs(nav.offsetHeight - rec.nh) > 2){ need = stable >= 700 && quiet >= 1200; }   // the bar itself changed size
    if(need) remeasure();
  }
  apply();
  window.addEventListener("resize", ()=>{ lastH = window.innerHeight; lastW = window.innerWidth; changedAt = Date.now(); });
  setInterval(tick, 300);
})();
</script>
<script>
// Registers the service worker (sw.js, same folder) so the app is cached on first load and
// works fully offline afterward — needed once the app is loaded from a real URL (GitHub Pages)
// instead of a local file, since that's what fixed localStorage but on its own would otherwise
// require internet on every open.
//
// updateViaCache:'none' is the actual fix for "I have to clear the app's cache to see updates".
// sw.js already correctly calls skipWaiting()/clients.claim() — but neither of those can run if
// the browser never notices sw.js changed in the first place. GitHub Pages serves sw.js with an
// HTTP Cache-Control header, and by default the browser is allowed to reuse ITS OWN cached copy
// of that file (a completely different cache from anything this app's service worker manages)
// for a while after you push a new version — so the update check silently compares the new
// version against a stale copy of the old one and finds no difference. updateViaCache:'none'
// tells the browser to never use that HTTP cache for sw.js itself and always fetch it fresh,
// so a real edit is always seen right away.
if("serviceWorker" in navigator){
  window.addEventListener("load", ()=>{
    navigator.serviceWorker.register("sw.js", {updateViaCache:"none"}).then((reg)=>{
      // A brand-new service worker version can finish installing while the app is already open
      // (most likely: the app was left running/backgrounded rather than freshly opened) — skip-
      // Waiting()/clients.claim() mean it's ready and in control immediately, but the JS already
      // running in memory is still the OLD code until an actual page reload happens. Rather than
      // silently reloading out from under someone mid-bill, show the same small dismissible
      // banner style already used for native APK updates, so it's their choice when to apply it.
      function showWebUpdateBanner(){
        if(document.getElementById("webUpdateBanner")) return;
        var b = document.createElement("div");
        b.id = "webUpdateBanner";
        b.style.cssText = "position:fixed;left:0;right:0;top:var(--header-h);z-index:55;background:var(--primary);color:#fff;"+
          "padding:10px 14px;font-size:13px;display:flex;align-items:center;justify-content:center;gap:12px;flex-wrap:wrap;"+
          "box-shadow:0 2px 6px rgba(0,0,0,.2);";
        b.innerHTML = '<span>An updated version of the app is ready.</span>'+
          '<button type="button" style="background:#fff;color:var(--primary);font-weight:700;border:none;border-radius:6px;padding:5px 12px;cursor:pointer;font-size:13px;">Refresh now</button>'+
          '<button type="button" aria-label="Dismiss" style="background:none;border:none;color:#fff;opacity:.8;font-size:16px;cursor:pointer;padding:0 4px;line-height:1;">✕</button>';
        b.querySelector("button").onclick = ()=>window.location.reload();
        b.querySelectorAll("button")[1].onclick = ()=>b.remove();
        document.body.appendChild(b);
      }
      function watchInstalling(sw){
        if(!sw) return;
        sw.addEventListener("statechange", ()=>{
          // "installed" while a controller already exists means this is an UPDATE to an
          // already-running app, not the very first install on a brand-new device — only the
          // update case should ever prompt anyone to refresh.
          if(sw.state==="installed" && navigator.serviceWorker.controller) showWebUpdateBanner();
        });
      }
      watchInstalling(reg.installing);
      reg.addEventListener("updatefound", ()=>watchInstalling(reg.installing));
      // Explicitly re-check for updates whenever the app is resumed from the background — on a
      // phone the app is usually resumed rather than freshly loaded, so leaving update checks to
      // only happen "on load" means a long-running session could sit on stale code for days.
      document.addEventListener("visibilitychange", ()=>{
        if(document.visibilityState==="visible") reg.update().catch(()=>{});
      });
    }).catch((err)=>{ console.warn("SW register failed:", err); });
  });
}
</script>
