<!DOCTYPE html>
<html lang="en">
<head>
<script>
// This WebView (confirmed via on-device testing) leaves window.localStorage present but set
// to null, while sessionStorage/indexedDB both work fine — so every localStorage.getItem/
// setItem call in the app below would throw. Replacing window.localStorage with a shim backed
// by IndexedDB fixes this WITHOUT touching any of the app's own code (which just keeps calling
// localStorage.getItem/setItem exactly as before). IndexedDB itself is async, so on startup we
// hydrate an in-memory copy first — window.__localStorageReady resolves once that's done, and
// the app's own boot sequence (bottom of the file) waits on it before calling loadAll().
(function(){
  // Only step in if real localStorage is actually broken here — everywhere else (a normal
  // browser, a different device where it works fine) must keep using the real thing untouched,
  // so existing data already saved there is never hidden behind an empty shim.
  var realLocalStorageWorks = false;
  try{
    localStorage.setItem("__ls_probe__", "1");
    realLocalStorageWorks = (localStorage.getItem("__ls_probe__") === "1");
    localStorage.removeItem("__ls_probe__");
  }catch(e){ realLocalStorageWorks = false; }
  if(realLocalStorageWorks){ window.__localStorageReady = Promise.resolve(); return; }

  var DB_NAME = "localStorageShim", STORE = "kv";
  var memory = {};
  var dbPromise = null;
  function openDb(){
    if(dbPromise) return dbPromise;
    dbPromise = new Promise(function(resolve, reject){
      var req = indexedDB.open(DB_NAME, 1);
      req.onupgradeneeded = function(){ req.result.createObjectStore(STORE); };
      req.onsuccess = function(){ resolve(req.result); };
      req.onerror = function(){ reject(req.error); };
    });
    return dbPromise;
  }
  function hydrate(){
    return openDb().then(function(db){
      return new Promise(function(resolve, reject){
        var tx = db.transaction(STORE, "readonly");
        var req = tx.objectStore(STORE).openCursor();
        req.onsuccess = function(e){
          var cursor = e.target.result;
          if(cursor){ memory[cursor.key] = cursor.value; cursor.continue(); }
          else resolve();
        };
        req.onerror = function(){ reject(req.error); };
      });
    });
  }
  function persist(key, value){
    openDb().then(function(db){
      var store = db.transaction(STORE, "readwrite").objectStore(STORE);
      if(value === null) store.delete(key); else store.put(value, key);
    }).catch(function(){});
  }
  var shim = {
    getItem: function(key){ return Object.prototype.hasOwnProperty.call(memory, key) ? memory[key] : null; },
    setItem: function(key, value){ value = String(value); memory[key] = value; persist(key, value); },
    removeItem: function(key){ delete memory[key]; persist(key, null); },
    key: function(i){ return Object.keys(memory)[i] || null; },
    clear: function(){ memory = {}; openDb().then(function(db){ db.transaction(STORE,"readwrite").objectStore(STORE).clear(); }).catch(function(){}); }
  };
  Object.defineProperty(shim, "length", { get: function(){ return Object.keys(memory).length; } });
  function install(){
    try{ Object.defineProperty(window, "localStorage", { value: shim, configurable: true }); }
    catch(e){ window.localStorage = shim; }
  }
  window.__localStorageReady = hydrate().then(install).catch(install);
})();
</script>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">

<title>Counter Book</title>
<style>
  :root{
    --page:#F3F6F7; --header:#0F5C57; --headerSub:#CFE9E5;
    --primary:#0F5C57; --primarySoft:#E4F1EF;
    --text:#1B2430; --muted:#7C8A99; --faint:#A9B4BE;
    --border:#E2E8F0; --card:#FFFFFF;
    --success:#0E9F6E; --successSoft:#E5F8F1;
    --danger:#DC3B2C; --dangerSoft:#FCEAE8;
    --warning:#B4650A; --warningSoft:#FDF3E3;
    --header-h:90px; /* fallback before JS measures the real header height (syncHeaderOffset) */
  }
  *{box-sizing:border-box;
    /* Android WebViews (and mobile browsers generally) paint a translucent highlight over
       whatever was just tapped, as default visual feedback — with no styling for it here it
       falls back to a solid blue-ish box that can visibly linger/overlap when tapping several
       nav buttons in quick succession. Turning it off here doesn't remove tap feedback
       entirely: buttons still get their own :active/.active styling elsewhere in this file.
       rgba(0,0,0,0) rather than the `transparent` keyword — some Chromium/WebView versions
       have a known quirk where `transparent` doesn't fully suppress this specific property. */
    -webkit-tap-highlight-color:rgba(0,0,0,0);-webkit-touch-callout:none;}
  /* Text-selection highlight + caret, tinted to the app's green theme instead of the
     device/WebView's default accent (which shows up pink on some devices). Modern Chromium/
     WebView also tints the drag-selection handles to match ::selection in most versions, though
     that part is ultimately up to the WebView and can't be fully guaranteed from CSS alone. */
  ::selection{ background:var(--primary); color:#fff; }
  input, textarea{ caret-color:var(--primary); accent-color:var(--primary); }
  html,body{margin:0;padding:0;height:100%;background:var(--page);color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;overflow:hidden;}
  /* #app is pinned to exactly one viewport height and scrolls INTERNALLY (overflow-y:auto)
     instead of letting the outer document grow to the full height of the tallest tab's
     content (Records archive, a long Stock list, etc). Some Android WebViews — including the
     one this app runs in via App Inventor's WebViewer — have a hard limit on how tall a single
     composited/rendered surface can be; once the document's total height exceeds it, everything
     past that point renders blank white while scrolling back up (already-painted content) looks
     fine. Capping the scroll container to one viewport height keeps the painted surface a fixed,
     safe size no matter how long any tab's content gets. */
  #app{height:100vh;height:100dvh;display:flex;flex-direction:column;overflow-x:hidden;
    overflow-y:auto;-webkit-overflow-scrolling:touch;}
  .header-actions{top:14px;}
  header{background:var(--header);color:#fff;padding:18px 16px 14px;position:fixed;top:0;left:0;right:0;width:100%;z-index:30;
    box-shadow:0 1px 3px rgba(0,0,0,.15);display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:8px;
    transform:translateZ(0);-webkit-transform:translateZ(0);backface-visibility:hidden;-webkit-backface-visibility:hidden;}
  header h1{margin:0;font-size:18px;font-weight:700;}
  header p{margin:2px 0 0;font-size:12px;color:var(--headerSub);}
  @keyframes uploadSlide{0%{left:-30%;}100%{left:100%;}}
  #banner{font-size:12px;padding:8px 16px;background:var(--warningSoft);color:var(--warning);
    border-bottom:1px solid #F0DCB0;display:none;align-items:center;gap:6px;}
  main{flex:1;padding:14px 12px 100px;max-width:560px;margin:0 auto;width:100%;}
  nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--border);
    display:flex;justify-content:space-around;padding:6px 4px;z-index:30;
    transform:translateZ(0);-webkit-transform:translateZ(0);backface-visibility:hidden;-webkit-backface-visibility:hidden;}
  /* Paints the system nav bar's safe-area strip white in portrait, independent of whether the
     native HideBars extension's SetNavBarColour call actually takes effect - on Android 15+
     that native API is a documented no-op once the app is forced into edge-to-edge, and that
     switch doesn't reverse after the first rotation. env(safe-area-inset-bottom) reflects the
     real reserved height regardless, so the page paints it directly instead of depending on
     the OS honoring a color the app asked for. Hidden entirely in landscape per the "nothing
     at the bottom in landscape" requirement. Matches nav's own background above. */
  #navSafeBar{position:fixed;left:0;right:0;bottom:0;height:env(safe-area-inset-bottom);
    background:var(--card);z-index:29;}
  @media (orientation:landscape){ #navSafeBar{display:none;} }
  nav button{background:none;border:none;display:flex;flex-direction:column;align-items:center;gap:2px;
    padding:6px 10px;border-radius:8px;color:var(--muted);font-size:10px;font-weight:500;cursor:pointer;position:relative;
    -webkit-tap-highlight-color:rgba(0,0,0,0);}
  nav button.active{color:var(--primary);font-weight:700;}
  nav button .icon{font-size:20px;line-height:1;}
  nav button .badge{position:absolute;top:0;right:2px;background:var(--danger);color:#fff;font-size:9px;
    font-weight:700;border-radius:999px;min-width:14px;height:14px;display:flex;align-items:center;justify-content:center;padding:0 3px;}
  .card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:14px;
    box-shadow:0 1px 2px rgba(0,0,0,.04);margin-bottom:12px;}
  .card.primary{background:var(--primary);color:#fff;border:none;}
  label.field-label{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.02em;color:var(--muted);display:block;margin-bottom:4px;}
  input,textarea,select{width:100%;border:1px solid var(--border);border-radius:8px;padding:10px 12px;
    font-size:16px;font-family:inherit;color:var(--text);background:#fff;}
  input:focus,textarea:focus,select:focus{outline:2px solid var(--primary);outline-offset:-1px;}
  /* Every <select> in the app gets the SAME chevron, drawn ourselves instead of relying on the
     WebView's native dropdown arrow (which rendered inconsistently/looked out of place — see
     dropdown-styling fix). -webkit-appearance/appearance:none strips the native arrow everywhere
     (including inside .cat-picker's borderless variant below); the arrow itself is an inline SVG
     so it needs no network request and can't fail to load offline. */
  select{
    -webkit-appearance:none; -moz-appearance:none; appearance:none;
    background-image:url("data:image/svg+xml;charset=UTF-8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%237C8A99' stroke-width='2.5' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpolyline points='6 9 12 15 18 9'%3E%3C/polyline%3E%3C/svg%3E");
    background-repeat:no-repeat; background-position:right 10px center; background-size:18px;
    padding-right:34px;
  }
  textarea{resize:none;}
  /* Same chevron glyph as the select rule above, for non-<select> "looks like a dropdown"
     controls (the date-picker trigger buttons) so every dropdown-like control in the app is
     visually identical instead of mixing this SVG chevron with a plain "▾" text character,
     which rendered chunkier/misaligned compared to the select's arrow. */
  .chev{display:inline-block;width:16px;height:16px;flex-shrink:0;
    background-image:url("data:image/svg+xml;charset=UTF-8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%237C8A99' stroke-width='2.5' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpolyline points='6 9 12 15 18 9'%3E%3C/polyline%3E%3C/svg%3E");
    background-repeat:no-repeat;background-position:center;background-size:contain;}
  .row{display:flex;justify-content:space-between;align-items:center;}
  .row .val{font-weight:600;}
  .row.big .lab{font-size:14px;}
  .row.big .val{font-size:20px;font-weight:700;}
  .btn{border:none;border-radius:10px;padding:11px 16px;font-size:14px;font-weight:600;cursor:pointer;}
  .btn-primary{background:var(--primary);color:#fff;}
  .btn-success{background:var(--success);color:#fff;}
  .btn-danger{background:var(--danger);color:#fff;}
  .btn-outline{background:none;border:1px solid var(--border);color:var(--muted);}
  .btn-dashed{background:none;border:2px dashed var(--primary);color:var(--primary);width:100%;padding:12px;
    border-radius:12px;display:flex;align-items:center;justify-content:center;gap:6px;font-weight:700;}
  .btn:disabled{opacity:.4;cursor:default;}
  .pill-badge{font-size:11px;font-weight:700;padding:4px 8px;border-radius:999px;}
  .small{font-size:12px;color:var(--muted);}
  .faint{color:var(--faint);}
  .mt2{margin-top:8px;}.mt3{margin-top:12px;}.mb2{margin-bottom:8px;}
  .flex{display:flex;}.gap2{gap:8px;}.gap1{gap:4px;}.flex1{flex:1;}
  .search-wrap{position:relative;}
  .search-icon{position:absolute;left:10px;top:12px;color:var(--faint);pointer-events:none;}
  .search-wrap input{padding-left:32px;}
  .dropdown{position:absolute;z-index:20;margin-top:4px;width:100%;background:#fff;border:1px solid var(--border);
    border-radius:8px;max-height:220px;overflow-y:auto;box-shadow:0 6px 20px rgba(0,0,0,.12);}
  .dropdown button{width:100%;text-align:left;padding:10px 12px;border:none;background:none;border-bottom:1px solid var(--border);
    display:flex;justify-content:space-between;align-items:center;cursor:pointer;}
  .dropdown button:last-child{border-bottom:none;}
  .item-row{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--border);}
  .item-row:last-child{border-bottom:none;}
  .modal-overlay{position:fixed;inset:0;background:rgba(15,23,30,.45);z-index:50;display:flex;
    align-items:flex-end;justify-content:center;}
  /* The confirm dialog can be triggered from inside another already-open modal (category
     editor, inventory form, backup panel, etc.). All modal overlays share the same z-index
     and stack by DOM order, and #confirmModalRoot happens to sit earlier in the markup than
     those — so without this, the confirm dialog rendered BEHIND the still-open modal and was
     invisible and unclickable. Confirm dialogs are always meant to be the topmost thing on
     screen, so they get a dedicated higher z-index instead of relying on DOM order. */
  #confirmModalRoot .modal-overlay{z-index:60;}
  .priv-list{border:1px solid var(--border);border-radius:12px;overflow:hidden;background:#fff;}
  .priv-row{display:flex;align-items:center;gap:12px;padding:12px 14px;font-size:14px;font-weight:600;border-bottom:1px solid var(--border);cursor:pointer;margin:0;text-align:left;}
  .priv-row:last-child{border-bottom:none;}
  .priv-row input[type=checkbox]{width:22px;height:22px;min-width:22px;flex:none;margin:0;padding:0;accent-color:var(--primary);}
  .priv-row span{flex:1;text-align:left;}
  .formula-sug{border:1px solid var(--border);border-radius:10px;background:#fff;margin:-2px 0 8px;overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,.08);}
  .formula-sug-item{display:flex;justify-content:space-between;align-items:center;gap:8px;width:100%;text-align:left;background:#fff;border:none;border-bottom:1px solid var(--border);padding:10px 12px;font-size:14px;color:var(--text,#1B2430);cursor:pointer;}
  .formula-sug-item:last-child{border-bottom:none;}
  .formula-sug-item:active{background:var(--page);}
  #copyMenuRoot .modal-overlay{z-index:55;align-items:center;padding:16px;}
  #copyMenuRoot .copy-pop{background:#fff;border-radius:16px;width:100%;max-width:320px;padding:16px;box-shadow:0 8px 30px rgba(0,0,0,.25);}
  .modal{background:#fff;border-radius:16px 16px 0 0;width:100%;max-width:480px;max-height:85vh;
    display:flex;flex-direction:column;box-shadow:0 8px 30px rgba(0,0,0,.2);}
  .modal-head{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border-bottom:1px solid var(--border);}
  .modal-body{margin:12px 16px;padding:12px;background:var(--page);border:1px solid var(--border);border-radius:8px;
    font-size:12px;font-family:ui-monospace,monospace;white-space:pre-wrap;overflow-y:auto;color:var(--text);}
  .modal-actions{display:flex;gap:8px;padding:14px 16px;}
  .hidden{display:none !important;}
  #toast{position:fixed;bottom:78px;left:50%;transform:translateX(-50%);background:#1B2430;color:#fff;
    padding:10px 18px;border-radius:999px;font-size:13px;font-weight:600;z-index:60;box-shadow:0 4px 16px rgba(0,0,0,.25);}
  #toast.tappable{cursor:pointer;text-decoration:underline;text-underline-offset:3px;}
  a.silent{color:inherit;text-decoration:none;}
  ::placeholder{color:var(--faint);}
  #invFab{position:fixed;right:16px;bottom:calc(70px + env(safe-area-inset-bottom));width:54px;height:54px;border-radius:50%;
    transform:translateZ(0);-webkit-transform:translateZ(0);backface-visibility:hidden;-webkit-backface-visibility:hidden;
    background:var(--primary);color:#fff;border:none;font-size:26px;line-height:1;cursor:pointer;
    box-shadow:0 4px 14px rgba(0,0,0,.25);z-index:35;display:flex;align-items:center;justify-content:center;}
  /* Landscape: nav becomes a left sidebar (icon+label stacked, top-to-bottom) running from
     the bottom of the header down to the bottom of the screen — like a desktop app's side
     nav — instead of staying a bottom bar stretched edge-to-edge, which wastes a lot of the
     screen's limited landscape height and puts the tabs far from the thumb on a wide phone.
     Only the layout/position changes here; every button's markup, icon, active/badge styling
     stays exactly the same as the portrait bottom-bar version. */
  @media (orientation:landscape){
    nav{
      top:var(--header-h); bottom:0; left:0; right:auto;
      width:68px; flex-direction:column; justify-content:flex-start; align-items:stretch;
      gap:2px; overflow-y:auto;
      border-top:none; border-right:1px solid var(--border);
      padding:10px calc(4px + env(safe-area-inset-left)) calc(10px + env(safe-area-inset-bottom));
    }
    nav button{ padding:10px 4px; }
    main{ padding-left:calc(68px + 12px + env(safe-area-inset-left)); padding-bottom:14px; }
    #invFab{ bottom:calc(16px + env(safe-area-inset-bottom)); right:calc(16px + env(safe-area-inset-right)); }
    /* The stacked title/subtitle/sync-row/user-badge layout (4 full-width lines) was designed
       for a tall portrait screen and ate up nearly a third of a landscape phone's much
       shorter height. In landscape: drop the subtitle entirely (least essential line), shrink
       the title, and lay everything else out as one wrapping inline row instead of stacked
       block lines, so the header collapses down to roughly its title's own height. */
    header{padding:8px 16px 6px;}
    header h1{font-size:15px;}
    header .header-sub{display:none;}
    header .header-info{display:flex;flex-wrap:wrap;align-items:center;column-gap:12px;row-gap:2px;padding-right:calc(150px + env(safe-area-inset-right));}
    header .header-sync-row{margin-top:0;}
    #currentUserBadge{margin-top:0;}
    header .header-actions{top:50%;transform:translateY(-50%);right:calc(16px + env(safe-area-inset-right));}
    #refreshBtn, #headerMenuBtn{padding:4px 8px;font-size:10px;}
  }
  .expiry-tag{font-size:11px;font-weight:700;padding:3px 7px;border-radius:6px;display:inline-block;}
  .icon-del-btn{background:none;border:none;color:var(--faint);cursor:pointer;font-size:16px;}
  .modal-x{border:none;font-size:18px;padding:4px 8px;}
  .item-title{font-weight:700;font-size:14px;margin:0;}
  .divider-top{border-top:1px solid var(--border);padding-top:10px;}
  .divider-top8{border-top:1px solid var(--border);padding-top:8px;}
  /* Category dropdown + "Edit" button, merged into one visual box (New medicine form and the
     inline per-medicine Edit form). Plain <input>/<select> elements get a full outline all the
     way around themselves on focus (see the shared input:focus rule above); a bare <select>
     inside this merged box would only outline itself, leaving the "Edit" button half of the
     box looking untouched and the whole thing visually inconsistent with every other field.
     Using :focus-within on the wrapping box instead makes the WHOLE pill glow together,
     matching how every other field responds when focused. */
  .cat-picker{display:flex;align-items:stretch;border:1px solid var(--border);border-radius:8px;overflow:hidden;}
  .cat-picker:focus-within{outline:2px solid var(--primary);outline-offset:-1px;}
  .cat-picker select{flex:1;min-width:0;border:none;border-radius:0;outline:none;padding:10px 34px 10px 12px;font-size:16px;font-family:inherit;color:var(--text);background-color:#fff;}
  .cat-picker button{flex:0 0 auto;border:none;border-left:1px solid var(--border);background:var(--page);
    color:var(--muted);font-size:12px;font-weight:600;padding:0 14px;cursor:pointer;}
  /* No CSS-based portrait fix here anymore. A rotation-compensation trick (counter-rotating
     <html> -90deg on landscape) was tried and removed — it rendered broken/skewed in the actual
     App-Inventor-wrapped WebView this build targets (the WebView's own viewport handling doesn't
     agree with what the trick assumes), which is arguably worse than doing nothing. A plain web
     page fundamentally cannot force this reliably across every WebView implementation — the only
     fix that's actually guaranteed for this build is native: Screen1 › ScreenOrientation ›
     "Portrait" in the App Inventor project itself (Android then refuses to rotate the Activity
     at all, unconditionally, regardless of the device's own auto-rotate toggle). That requires
     rebuilding and reinstalling the app — a Designer change alone doesn't retroactively fix an
     already-installed APK. */
  @keyframes aispin{to{transform:rotate(360deg);}}
  .ai-spin{width:38px;height:38px;border:4px solid #cfe3df;border-top-color:var(--primary);border-radius:50%;animation:aispin .8s linear infinite;margin:0 auto 12px;}
  .ai-pickbtn,.ai-pitem{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:10px 12px;border:1px solid var(--border);border-radius:12px;background:#fff;color:inherit;cursor:pointer;margin-bottom:8px;}
  .ai-pitem{border:none;border-bottom:1px solid var(--border);border-radius:0;margin:0;padding:11px 4px;}
  .ai-pickbtn .ai-pn,.ai-pitem b{font-size:14px;font-weight:700;}
  .ai-badge{flex-shrink:0;font-size:11px;font-weight:700;padding:3px 9px;border-radius:999px;background:var(--primarySoft);color:var(--primary);}
  .ai-badge.zero{background:var(--dangerSoft);color:var(--danger);}
  .ai-sec{font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--faint);margin:12px 0 2px;}
  body.kb-open nav, body.kb-open #navSafeBar, body.kb-typing nav, body.kb-typing #navSafeBar{display:none !important;}
  #datePickerModalRoot .modal-overlay{z-index:70;}
  #invFab{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;}
  #invStickyBar{box-shadow:0 6px 8px -6px rgba(15,23,30,.22);}
  #invStickyBar .search-wrap input{background:#fff !important;border:1px solid #CBD5E1 !important;box-shadow:0 2px 6px rgba(15,23,30,.10);}
  #invStickyBar .pill-badge{box-shadow:0 1px 3px rgba(15,23,30,.20);border:1px solid rgba(15,23,30,.07) !important;}
  body.kb-open #invFab:not([data-moved]){bottom:16px !important;}
  #invCardsList > div{content-visibility:auto;contain-intrinsic-size:auto 300px;}
  #invStickyBar{position:sticky;top:0;z-index:25;background:var(--page);margin:0 -12px 4px;padding:8px 12px 2px;transition:transform .22s ease;will-change:transform;}
  #invStickyBar.hide{transform:translateY(-115%);}
  .recent-box{position:fixed;z-index:80;background:#fff;border:1px solid var(--border);border-radius:12px;box-shadow:0 6px 20px rgba(0,0,0,.14);overflow:hidden;}

    for(let i=0;i<str.length;i++){ h = (h*31 + str.charCodeAt(i))|0; }
    return "fb:"+h;
  }
}
function genRecoveryCode(){
  const chars = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789"; // no ambiguous 0/O, 1/I/L
  const getRand = (typeof crypto!=="undefined" && crypto.getRandomValues) ? ()=>{ const a=new Uint32Array(1); crypto.getRandomValues(a); return a[0]; } : ()=>Math.floor(Math.random()*4294967296);
  let out = "";
  for(let i=0;i<10;i++){
    out += chars[getRand()%chars.length];
    if(i===3||i===7) out += "-";
  }
  return out; // e.g. "7F3K-9QX2-RT"
}
// Thousands separators for everything shown on screen: 1234567.5 -> 1,234,567.5
// NUM_GROUP_FROM_LEFT = true -> commas after every 3 digits counting from the LEFT (555,558,85).
// Set it to false to go back to the usual way, counting from the right (55,555,885).
const NUM_GROUP_FROM_LEFT = false;
function commaInt(str){
  const t=String(str);
  return NUM_GROUP_FROM_LEFT ? t.replace(/(\d{3})(?=\d)/g,"$1,") : t.replace(/\B(?=(\d{3})+(?!\d))/g,",");
}
// All money is kept to whole paisa so that what is shown, what is saved and what every report adds up
// can never drift apart by floating-point dust (e.g. 12.333333 x 7).
function r2(n){ return Math.round(((Number(n)||0)+Number.EPSILON)*100)/100; }
function money(n){
  const v=Number(n)||0, t=v.toFixed(2).replace(/\.00$/,""), neg=t.charAt(0)==="-", parts=t.replace("-","").split(".");
  return (neg?"-":"")+commaInt(parts[0])+(parts[1]?"."+parts[1]:"");
}
function fmtInt(n){
  const v=Number(n); if(!isFinite(v)) return String(n==null?"":n);
  const t=String(Math.round(Math.abs(v)*100)/100), parts=t.split(".");
  return (v<0?"-":"")+commaInt(parts[0])+(parts[1]?"."+parts[1]:"");
}
// Free-text strengths like "200000 IU": put commas in any run of 4+ digits (display only).
function fmtBig(t){ return String(t==null?"":t).replace(/\d{4,}/g, d=>commaInt(d)); }
// Compact strength for the Frequently-sold chips: mg is implied ("8"), gram -> "g", IU -> "I".
function shortStrength(mg){
  let t=String(mg||"").trim();
  t=t.replace(/(\d)\s*(?:mg|milligrams?)\b/gi,"$1")
     .replace(/(\d)\s*(?:grams?|gms?|g)\b/gi,"$1g")
     .replace(/(\d)\s*i\.?u\.?(?![a-z])/gi,"$1I")
     .replace(/\s+/g," ").trim();
  return fmtBig(t);
}
// For medicine MRP / per-pill price display only: caps the shown text to its first 8
// characters. Storage and every calculation still use the full number untouched — this only
// shortens what's printed on screen.
function mrpDisplay(n){ return money(n); }
function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function fmtDateTime(ts){
  const d=new Date(ts);
  return d.toLocaleDateString(undefined,{day:"2-digit",month:"short"})+", "+d.toLocaleTimeString(undefined,{hour:"2-digit",minute:"2-digit"});
}
function sameDay(ts,ref){ return new Date(ts).toDateString()===new Date(ref).toDateString(); }
function monthKeyOf(ts){ const d=new Date(ts); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0"); }
function monthLabelOf(ts){ return new Date(ts).toLocaleDateString(undefined,{month:"long",year:"numeric"}); }

   Notes are kept separate per profile, so each person's notepad stays private to them. */
function loadAll(){
  try{ inventory = JSON.parse(localStorage.getItem("clinic_inventory")||"[]"); }catch(e){ inventory=[]; }
  // Migrate medicines saved before batch/expiry tracking existed: fold their existing
  // stock into one "no expiry recorded" batch so nothing is lost.
  inventory.forEach(m=>{
    if(!Array.isArray(m.batches)){
      m.batches = (m.stockPills>0) ? [{ id:uid(), boxes:null, pillsRemaining:m.stockPills, expiryDate:null, addedAt:Date.now(), disposed:false }] : [];
    }
    recomputeStock(m);
  });
  try{ transactions = JSON.parse(localStorage.getItem("clinic_transactions")||"[]"); }catch(e){ transactions=[]; }
  try{ monthAdjustments = JSON.parse(localStorage.getItem("clinic_month_adjustments")||"{}"); }catch(e){ monthAdjustments={}; }
  try{ profiles = JSON.parse(localStorage.getItem("clinic_profiles")||"[]"); }catch(e){ profiles=[]; }
  try{ testPrices = JSON.parse(localStorage.getItem("clinic_test_prices")||"{}"); }catch(e){ testPrices={}; }
  try{ defaultDoctorFee = Number(localStorage.getItem("clinic_default_doctor_fee"))||0; }catch(e){ defaultDoctorFee=0; }
  try{ defaultDoctorFeeUpdatedAt = Number(localStorage.getItem("clinic_default_doctor_fee_updated_at"))||0; }catch(e){ defaultDoctorFeeUpdatedAt=0; }
  try{ defaultDoctorName = localStorage.getItem("clinic_default_doctor_name") || ""; }catch(e){ defaultDoctorName=""; }
  try{ defaultDoctorNameUpdatedAt = Number(localStorage.getItem("clinic_default_doctor_name_updated_at"))||0; }catch(e){ defaultDoctorNameUpdatedAt=0; }
  try{
    const savedMode = JSON.parse(localStorage.getItem("clinic_bill_mode_prefs")||"null");
    if(savedMode && (savedMode.qtyMode==="total"||savedMode.qtyMode==="dose")) billModePrefs.qtyMode = savedMode.qtyMode;
    if(savedMode && (savedMode.daysMode==="perMed"||savedMode.daysMode==="same")) billModePrefs.daysMode = savedMode.daysMode;
  }catch(e){}
  try{ customTests = JSON.parse(localStorage.getItem("clinic_custom_tests")||"[]"); }catch(e){ customTests=[]; }
  try{ testNameOverrides = JSON.parse(localStorage.getItem("clinic_test_name_overrides")||"{}"); }catch(e){ testNameOverrides={}; }
  try{ hiddenBuiltInTestIds = JSON.parse(localStorage.getItem("clinic_hidden_tests")||"[]"); }catch(e){ hiddenBuiltInTestIds=[]; }
  try{ testSettingsUpdatedAt = Number(localStorage.getItem("clinic_test_settings_updated_at"))||0; }catch(e){ testSettingsUpdatedAt=0; }
  try{ testItemUpdatedAt = JSON.parse(localStorage.getItem("clinic_test_item_updated_at")||"{}"); }catch(e){ testItemUpdatedAt={}; }
  // One-time backfill: devices that used the Tests feature before per-test-id timestamps
  // existed have real test data but no per-id time to merge it by, which would make it
  // always lose to another device's newer per-id edits even if it was set up first. Seed
  // every id this device currently has non-default data for with the old bundle time, so
  // it competes fairly from here on.
  if(Object.keys(testItemUpdatedAt).length===0 && testSettingsUpdatedAt>0){
    customTests.forEach(t=>{ testItemUpdatedAt[t.id]=testSettingsUpdatedAt; });
    hiddenBuiltInTestIds.forEach(id=>{ testItemUpdatedAt[id]=testSettingsUpdatedAt; });
    Object.keys(testNameOverrides).forEach(id=>{ testItemUpdatedAt[id]=testSettingsUpdatedAt; });
    Object.keys(testPrices).forEach(id=>{ testItemUpdatedAt[id]=testSettingsUpdatedAt; });
    try{ localStorage.setItem("clinic_test_item_updated_at", JSON.stringify(testItemUpdatedAt)); }catch(e){}
  }
  try{
    categoriesUpdatedAt = Number(localStorage.getItem("clinic_categories_updated_at"))||0;
    const savedCats = JSON.parse(localStorage.getItem("clinic_med_categories")||"null");
    // An empty list is only trusted once categories have actually been edited/synced
    // (categoriesUpdatedAt>0) — otherwise it's just "nothing saved yet" and defaults apply.
    if(Array.isArray(savedCats) && (savedCats.length || categoriesUpdatedAt>0)) MED_CATEGORIES = savedCats;
  }catch(e){}
  try{
    const savedSpecialCats = JSON.parse(localStorage.getItem("clinic_special_categories")||"null");
    if(Array.isArray(savedSpecialCats) && (savedSpecialCats.length || categoriesUpdatedAt>0)) SPECIAL_CATEGORIES = savedSpecialCats;
    // Device that already had custom categories saved locally from before category sync
    // existed: give them a tiny non-zero timestamp so they get uploaded on the next sync
    // (cloud has none yet) but any real edit made anywhere afterwards still wins over them.
    const savedCatsAgain = JSON.parse(localStorage.getItem("clinic_med_categories")||"null");
    if(categoriesUpdatedAt===0 && ((Array.isArray(savedCatsAgain)&&savedCatsAgain.length) || (Array.isArray(savedSpecialCats)&&savedSpecialCats.length))){
      categoriesUpdatedAt = 1;
      try{ localStorage.setItem("clinic_categories_updated_at","1"); }catch(e){}
    }
  }catch(e){}

  // Migrate an old single shared notepad (from before profiles existed) into its own profile,
  // so nobody's existing notes get lost.
  if(profiles.length===0){
    let legacy = null;
    try{ legacy = JSON.parse(localStorage.getItem("clinic_notes")||"null"); }catch(e){ legacy=null; }
    if(legacy && Array.isArray(legacy) && legacy.length){
      profiles = [{ id:"legacy", name:"Notes" }];
      localStorage.setItem("clinic_profiles", JSON.stringify(profiles));
      localStorage.setItem("clinic_notes_legacy", JSON.stringify(legacy));
    }
  }

  try{ activityLog = JSON.parse(localStorage.getItem("clinic_activity_log")||"{}"); }catch(e){ activityLog={}; }
  try{ historyRequests = JSON.parse(localStorage.getItem("clinic_history_requests")||"{}"); }catch(e){ historyRequests={}; }
  try{ historyResponses = JSON.parse(localStorage.getItem("clinic_history_responses")||"{}"); }catch(e){ historyResponses={}; }
  try{ adminReceivedHistory = JSON.parse(localStorage.getItem("clinic_admin_history")||"{}"); }catch(e){ adminReceivedHistory={}; }
  try{ historyProcessedRequestIds = JSON.parse(localStorage.getItem("clinic_history_processed")||"{}"); }catch(e){ historyProcessedRequestIds={}; }
  purgeOldActivityLogs();

  currentProfileId = localStorage.getItem("clinic_current_profile") || null;
  if(currentProfileId && !visibleProfiles().some(p=>p.id===currentProfileId)){
    currentProfileId = null;
  }
  // Login state persists across app restarts until "Switch User" is tapped — but only counts
  // if currentProfileId is actually still valid (e.g. not true right after that profile was deleted).
  try{ sessionAuthed = localStorage.getItem("clinic_session_authed")==="1" && !!currentProfileId; }catch(e){ sessionAuthed=false; }
  loadNotesForCurrentProfile();
}

/* ===================== PER-USER ACTIVITY HISTORY ===================== */
// One call per real add/edit/delete a non-admin user makes. Grouped by that user's profile id
// and by calendar day (cheap to store, cheap to purge a whole day at once once it's stale).
// Device-local only — this data never enters buildFullStatePayload, so it never rides the
// normal cloud sync and no other device or account can see it, ever. The admin's own actions
// are deliberately never logged here.
function logActivity(action, summary){
  if(!currentProfileId || currentRole()==="admin") return;
  const day = localDateStr();   // the clinic's own calendar day (was UTC, which is wrong between midnight and 5 am)
  if(!activityLog[currentProfileId]) activityLog[currentProfileId] = {};
  if(!activityLog[currentProfileId][day]) activityLog[currentProfileId][day] = [];
  activityLog[currentProfileId][day].push({ t:Date.now(), a:String(action), s:String(summary||"").slice(0,100) });
  saveActivityLog();
}
// Drops any day older than 60 days, for every profile this device has ever logged. "YYYY-MM-DD"
// strings sort/compare correctly as plain text, so this needs no date parsing at all.
function purgeOldActivityLogs(){
  const cutoffDay = localDateStr(Date.now() - 60*24*60*60*1000);
  let changed = false;
  Object.keys(activityLog).forEach(pid=>{
    Object.keys(activityLog[pid]).forEach(day=>{
      if(day < cutoffDay){ delete activityLog[pid][day]; changed = true; }
    });
    if(Object.keys(activityLog[pid]).length===0) delete activityLog[pid];
  });
  if(changed) saveActivityLog();
}
// Admin-side: ask whichever device holds a given user's activity log to send a copy for a
// date range (leave from/to blank for "everything currently kept"). This only ever writes a
// few bytes of metadata to the cloud — never the log itself.
function requestUserHistory(profileId, fromDate, toDate){
  if(!fbDb){ showToast("Cloud sync isn't set up on this device"); return; }
  const id = uid();
  historyRequests[id] = { profileId, from: fromDate||null, to: toDate||null, requestedAt: Date.now(), requestedBy: currentProfileId };
  saveHistoryRequests();
  schedulePushToCloud();
  showToast("Requested — will appear here once that device is online");
  render();
}
// Runs after every cloud merge. Two small, independent jobs — cheap since historyRequests/
// historyResponses only ever hold a handful of entries at a time, and neither one ever reads
// or writes any other field (inventory, bills, notes, profiles, settings are untouched here):
// 1) If THIS device happens to hold the activity log for a profile someone is asking about,
//    answer once (guarded by historyProcessedRequestIds so our own echoed-back write can't
//    make us answer the same request forever).
// 2) If THIS device is the admin who made a request and the answer has now arrived, copy it
//    into this admin's own local-only store. The request/response pair is deliberately left on
//    the shared cloud document at this point — the only thing this feature ever deletes from
//    the cloud is that same pair, and only once a full 24h has passed since it was made or
//    answered (further below), whether or not the admin has already collected it. Nothing else
//    this app stores in the cloud is ever removed by this feature.
function processHistorySync(){
  let cloudChanged = false;
  const now = Date.now();

  Object.entries(historyRequests).forEach(([id, req])=>{
    if(!req || !req.profileId) return;
    if(historyResponses[id] || historyProcessedRequestIds[id]) return;
    const myLog = activityLog[req.profileId];
    if(!myLog) return; // this device has never held that profile's activity log
    const entries = [];
    Object.keys(myLog).forEach(day=>{
      if((!req.from || day>=req.from) && (!req.to || day<=req.to)){
        myLog[day].forEach(e=>entries.push({ d:day, t:e.t, a:e.a, s:e.s }));
      }
    });
    historyResponses[id] = { profileId:req.profileId, entries, respondedAt:now };
    historyProcessedRequestIds[id] = true;
    saveHistoryResponses(); saveHistoryProcessedIds();
    cloudChanged = true;
  });

  if(currentProfileId && currentRole()==="admin"){
    Object.entries(historyResponses).forEach(([id, resp])=>{
      const req = historyRequests[id];
      if(!req || req.requestedBy !== currentProfileId) return;
      if(!adminReceivedHistory[resp.profileId]) adminReceivedHistory[resp.profileId] = { entries:[], receivedAt:0 };
      const bucket = adminReceivedHistory[resp.profileId];
      const seen = new Set(bucket.entries.map(e=>e.d+"|"+e.t+"|"+e.a+"|"+e.s));
      (resp.entries||[]).forEach(e=>{
        const key = e.d+"|"+e.t+"|"+e.a+"|"+e.s;
        if(!seen.has(key)){ bucket.entries.push(e); seen.add(key); }
      });
      bucket.receivedAt = now;
      saveAdminReceivedHistory();
      // Deliberately NOT deleted here. The admin has their copy now, but the shared cloud
      // document isn't touched yet — the only thing ever removed from it is this same
      // request/response pair, and only once a full day has actually passed (below). Nothing
      // else this app stores in the cloud is ever deleted by this feature.
    });
  }

  // The ONLY deletions this feature ever performs against the shared cloud document: a
  // request/response pair, and only once a full 24h has passed since it was made/answered.
  // Nothing else — inventory, bills, notes, profiles, settings — is ever touched here.
  Object.entries(historyRequests).forEach(([id, req])=>{
    if(now - (req.requestedAt||0) > 24*60*60*1000){ delete historyRequests[id]; delete historyResponses[id]; cloudChanged = true; }
  });
  Object.entries(historyResponses).forEach(([id, resp])=>{
    if(now - (resp.respondedAt||0) > 24*60*60*1000){ delete historyResponses[id]; delete historyRequests[id]; cloudChanged = true; }
  });

  if(cloudChanged){ saveHistoryRequests(); saveHistoryResponses(); schedulePushToCloud(); }
}

/* ===================== BATCHES / EXPIRY (FEFO) ===================== */
/* Every restock creates its own "batch" with its own expiry date. When medicine is
   sold, pills are drawn from the batch with the nearest expiry date first (FEFO —
   first-expiry-first-out). m.stockPills is always kept as the sum of active batches. */
function activeBatches(m){ return (m.batches||[]).filter(b=>!b.disposed && b.pillsRemaining>0); }
// q6: rounds away tiny floating-point leftovers (e.g. 0.30000000000000004) from half-tablet doses
function q6(n){ return Math.round((Number(n)||0)*1e6)/1e6; }
function recomputeStock(m){ m.stockPills = q6(activeBatches(m).reduce((s,b)=>s+b.pillsRemaining,0)); }
function fefoOrder(m, precomputedBatches){
  return (precomputedBatches || activeBatches(m)).slice().sort((a,b)=>{
    const ea = a.expiryDate ? new Date(a.expiryDate).getTime() : Infinity;
    const eb = b.expiryDate ? new Date(b.expiryDate).getTime() : Infinity;
    if(ea!==eb) return ea-eb;
    return (a.addedAt||0)-(b.addedAt||0);
  });
}
/* ---- Batch-level pricing (MRP can change per restock, FEFO-style) ----
   Each batch may carry its own mrpPerBox (set at restock time). If a batch has no
   mrpPerBox recorded (left blank at restock, or an old batch from before this existed),
   it falls back to the medicine's current mrpPerBox — i.e. "use the older/current price". */
// SWITCH: false = every medicine is sold at its latest price (the medicine's own MRP / pills per box),
// whatever batch the tablets come from. Set to true to bring back per-batch prices (the batch MRPs
// entered at restock are still stored, so nothing is lost by leaving this off).
const USE_BATCH_PRICES = false;
function batchPricePerPill(m, b){
  const mrp = (USE_BATCH_PRICES && b && b.mrpPerBox!=null && b.mrpPerBox>0) ? b.mrpPerBox : m.mrpPerBox;
  return (Number(mrp)||0) / (Number(m.pillsPerBox)||1);
}
// Price for `pills` taken in the same order stock is deducted (nearest expiry first), each batch at its own
// price. `skip` = pills of this medicine already on the bill, so a second line continues after the first.
function priceForPills(m, pills, skip){
  pills = Number(pills)||0; if(pills<=0) return 0;
  const ppb = Number(m.pillsPerBox)||1;
  const segs = [];                                    // [pills taken from this batch, that batch's MRP per box]
  let toSkip = Number(skip)||0, remaining = pills;
  for(const b of fefoOrder(m)){
    let avail = Number(b.pillsRemaining)||0;
    if(toSkip>0){ const sk = Math.min(avail,toSkip); avail -= sk; toSkip -= sk; }
    if(avail<=0) continue;
    if(remaining<=0) break;
    const take = Math.min(avail, remaining);
    const mrp = (USE_BATCH_PRICES && b && b.mrpPerBox!=null && b.mrpPerBox>0) ? b.mrpPerBox : m.mrpPerBox;
    segs.push([take, Number(mrp)||0]); remaining -= take;
  }
  if(remaining>0) segs.push([remaining, Number(m.mrpPerBox)||0]); // beyond recorded stock: base price
  return exactLineTotal(segs, ppb);
}
// Adds up (pills x box price / pills-per-box) without floating-point drift. When pill counts are whole
// numbers and prices have at most 2 decimals (the normal case) the maths is done in whole paisas and
// rounded half-up once, so a total like 16.885 can never turn into 16.88 by accident.
function exactLineTotal(segs, ppb){
  const exactOk = Number.isInteger(ppb) && ppb>0 && segs.every(([t,mrp])=> Number.isInteger(t) && Math.abs(mrp*100-Math.round(mrp*100))<1e-6);
  if(exactOk){
    let num = 0; segs.forEach(([t,mrp])=>{ num += t*Math.round(mrp*100); });   // = total paisas x pills-per-box
    if(Number.isSafeInteger(2*num+ppb)) return Math.floor((2*num+ppb)/(2*ppb))/100;
  }
  let total = 0; segs.forEach(([t,mrp])=>{ total += t*(mrp/ppb); });
  return r2(total);
}
function lineCalc(m, pills, skip){
  const subtotal = priceForPills(m, pills, skip);
  return { pricePerPill: (Number(pills)>0) ? subtotal/Number(pills) : nextBatchUnitPrice(m), subtotal };
}
// Re-prices every line of the current bill from scratch, in order, following exactly the same
// batch order stock will be deducted in. Run after any line is removed/edited or days change, so a
// line can never keep a price that assumed another line (now gone) was taken first.
function repriceBillItems(){
  const taken = {};
  bill.items.forEach(it=>{
    const med = inventory.find(m=>m.id===it.medId);
    const skip = taken[it.medId]||0;
    taken[it.medId] = skip + (Number(it.pills)||0);
    if(!med) return;                                   // medicine was deleted: keep the saved price
    const lc = lineCalc(med, it.pills, skip);
    it.pricePerPill = lc.pricePerPill;
    if(it.special){ it.baseSubtotal = lc.subtotal; it.subtotal = r2(lc.subtotal + (Number(it.appliedFee)||0)); }
    else it.subtotal = lc.subtotal;
  });
}
function billPendingSkip(medId){ return bill.items.filter(x=>x.medId===medId).reduce((s,x)=>s+(Number(x.pills)||0),0); }
function nextBatchUnitPrice(m){
  // The price that will actually be charged for the next pill sold, following the same
  // FEFO order stock is drawn from — so billing price always matches the batch being dispensed.
  const order = fefoOrder(m);
  if(order.length) return batchPricePerPill(m, order[0]);
  return (Number(m.mrpPerBox)||0) / (Number(m.pillsPerBox)||1);
}
// Overselling is allowed (stock may exist on the shelf without being entered in the app): stock simply
// stops at 0. Returns how many pills were REALLY taken out of stock, so a later delete/edit of the bill
// gives back only that much and never creates phantom stock.
function deductStock(m, pills){
  let remaining = Number(pills)||0, taken = 0;
  for(const b of fefoOrder(m)){
    if(remaining<=0) break;
    const take = Math.min(b.pillsRemaining, remaining);
    b.pillsRemaining = q6(b.pillsRemaining - take);
    remaining = q6(remaining - take);
    taken = q6(taken + take);
    b.updatedAt = Date.now();
  }
  recomputeStock(m);
  return taken;
}
// How many pills of a saved bill line were actually deducted from stock (older bills: the full quantity).
function stockBack(it){ return (it && it.ded!=null) ? (Number(it.ded)||0) : (Number(it && it.pills)||0); }
function returnStock(m, pills){
  // Used when an old bill is edited/undone — put pills back into the batch nearest
  // to expiry (the one most likely to have been sold from), or a fresh undated batch.
  pills = Number(pills)||0; if(pills<=0) return;
  const batches = fefoOrder(m);
  if(batches.length){ batches[0].pillsRemaining = q6(batches[0].pillsRemaining + pills); batches[0].updatedAt = Date.now(); }
  else {
    m.batches = m.batches||[];
    m.batches.push({ id:uid(), boxes:null, pillsRemaining:pills, originalPills:pills, expiryDate:null, addedAt:Date.now(), updatedAt:Date.now(), disposed:false });
  }
  recomputeStock(m);
}
function adjustStockTo(m, newTotal){
  // Used for manual stock correction in Edit (e.g. accounting for loss/damage).
  const current = activeBatches(m).reduce((s,b)=>s+b.pillsRemaining,0);
  const diff = newTotal - current;
  if(diff<0) deductStock(m, -diff);
  else if(diff>0){
    m.batches = m.batches||[];
    m.batches.push({ id:uid(), boxes:null, pillsRemaining:diff, originalPills:diff, expiryDate:null, addedAt:Date.now(), updatedAt:Date.now(), disposed:false });
    recomputeStock(m);
  }
}
function daysUntil(dateStr){
  if(!dateStr) return null;
  const today = new Date(); today.setHours(0,0,0,0);
  const exp = new Date(dateStr+"T00:00:00");
  return Math.round((exp-today)/86400000);
}
/* Displays a stored "YYYY-MM-DD" expiry date as the shorter "DD-MM-YY". Used only for display —
   the underlying stored value stays full "YYYY-MM-DD" for date-picker/date-math purposes. The
   batch row is narrow (min-width:0 button squeezed between the pill count, price, expiry-tag
   badge, and dispose icon), so the full date used to get ellipsis-truncated down to just "20…"
   (the first two digits of the year, not useful). DD-MM-YY is short enough to usually fit whole,
   and even when it still truncates, what's cut off is the least useful end (the year's first two
   digits) rather than the day/month/last-two-digits that actually distinguish one expiry from another.*/
function fmtExpiryShort(dateStr){
  if(!dateStr) return "";
  const parts = dateStr.split("-");
  if(parts.length!==3) return dateStr;
  const [y,m,d] = parts;
  return `${d}-${m}-${y.slice(-2)}`;
}
function expiringBatches(){
  if(_expiringBatchesCache !== null) return _expiringBatchesCache;
  const out = [];
  inventory.forEach(m=>{
    if(m.deleted) return;
    activeBatches(m).forEach(b=>{
      if(b.expiryDate){
        const d = daysUntil(b.expiryDate);
        if(d!==null && d<=10) out.push({ med:m, batch:b, daysLeft:d });
      }
    });
  });
  out.sort((a,b)=>a.daysLeft-b.daysLeft);
  _expiringBatchesCache = out;
  return out;
}
function onBatchExpiryChange(medId, batchId, val){
  const m = inventory.find(x=>x.id===medId);
  if(m){ const b=(m.batches||[]).find(x=>x.id===batchId); if(b){ b.expiryDate = val || null; b.updatedAt = Date.now(); } }
  saveInventory();
  render();
}
function disposeBatch(medId, batchId){
  askConfirm("Mark this batch as disposed? It'll be removed from stock and cleared from expiry alerts.", ()=>{
    const m = inventory.find(x=>x.id===medId);
    if(m){
      const b = (m.batches||[]).find(x=>x.id===batchId);
      if(b){ b.disposed=true; b.pillsRemaining=0; b.updatedAt=Date.now(); recomputeStock(m); }
    }
    if(m) logActivity("dispose", m.name);
    saveInventory();
    render();
  });
}
function batchExpiryLabel(daysLeft){
  if(daysLeft<0) return `Expired ${Math.abs(daysLeft)}d ago`;
  if(daysLeft===0) return "Expires today";
  return `${daysLeft}d left`;
}

/* ---- Custom date picker (in-theme replacement for native <input type="date">) ---- */
function ymd(y, m, d){ return y+"-"+String(m+1).padStart(2,"0")+"-"+String(d).padStart(2,"0"); }
// Opening/navigating/picking a day only ever changes what's inside #datePickerModalRoot —
// nothing else on screen depends on datePickerUi. Calling the full render() (which rebuilds
// the entire active tab — bill/inventory/records/etc — from scratch) for every month-flip or
// day-tap was the actual cause of the picker feeling far slower than the native one; calling
// renderDatePickerModal() directly instead keeps every interaction to a single small
// innerHTML write, same as before v-date-picker.
function openDatePicker(currentValue, kind, args){
  const base = currentValue ? new Date(currentValue+"T00:00:00") : new Date();
  try{ window.getSelection().removeAllRanges(); }catch(_){}
  document.body.classList.add("dp-open");
  datePickerUi = { open:true, viewYear: base.getFullYear(), viewMonth: base.getMonth(), selected: currentValue||"", targetKind: kind, targetArgs: args||null };
  renderDatePickerModal();
  syncMenuHistory(); // cheap (no DOM rebuild) — keeps the back button aware this opened, without the full render() this function deliberately skips
}
function closeDatePicker(){ document.body.classList.remove("dp-open"); datePickerUi.open=false; renderDatePickerModal(); syncMenuHistory(); }
function datePickerPrevMonth(){
  datePickerUi.viewMonth--;
  if(datePickerUi.viewMonth<0){ datePickerUi.viewMonth=11; datePickerUi.viewYear--; }
  refreshDatePickerBody();
}
function datePickerNextMonth(){
  datePickerUi.viewMonth++;
  if(datePickerUi.viewMonth>11){ datePickerUi.viewMonth=0; datePickerUi.viewYear++; }
  refreshDatePickerBody();
}
function pickDatePickerDay(d){
  datePickerUi.selected = ymd(datePickerUi.viewYear, datePickerUi.viewMonth, d);
  refreshDatePickerBody();
}
// Confirm/Clear are the only two actions whose result is visible OUTSIDE the modal (the
// "Select expiry date"/"Set expiry date" button text on the page behind it), so — and only
// these two — still need the real full render() once the modal itself is closed.
function applyDatePickerResult(value){
  const kind = datePickerUi.targetKind, args = datePickerUi.targetArgs;
  document.body.classList.remove("dp-open");
  datePickerUi.open = false;
  document.body.classList.remove("dp-open");
  if(kind==="report"){ toolsUi.date = value||""; renderDatePickerModal(); renderOverlays(); syncMenuHistory(); }
  else if(kind==="restock"){ inv.restockExpiry = value; render(); }
  else if(kind==="batch" && args){ onBatchExpiryChange(args.medId, args.batchId, value); }
  else { render(); }
}
function confirmDatePicker(){ applyDatePickerResult(datePickerUi.selected); }
function clearDatePicker(){ applyDatePickerResult(""); }
function datePickerView(){
  const MONTH_NAMES = ["January","February","March","April","May","June","July","August","September","October","November","December"];
  const { viewYear, viewMonth, selected } = datePickerUi;
  const first = new Date(viewYear, viewMonth, 1);
  const startDow = first.getDay();
  const numDays = new Date(viewYear, viewMonth+1, 0).getDate();
  const todayStr = ymd(new Date().getFullYear(), new Date().getMonth(), new Date().getDate());
  let cells = "";
  for(let i=0;i<startDow;i++) cells += `<div></div>`;
  for(let d=1; d<=numDays; d++){
    const dateStr = ymd(viewYear, viewMonth, d);
    const isSel = dateStr===selected;
    const isToday = dateStr===todayStr;
    const style = isSel
      ? "background:var(--primary);color:#fff;font-weight:700;"
      : isToday
        ? "background:var(--primarySoft);color:var(--primary);font-weight:700;"
        : "background:none;color:var(--text);";
    cells += `<button type="button" onclick="pickDatePickerDay(${d})" style="${style}border:none;border-radius:999px;width:34px;height:34px;font-size:13px;cursor:pointer;">${d}</button>`;
  }
  // Always pad to a fixed 6 rows (42 cells) regardless of how many weeks this particular month
  // actually spans — without this, months with only 4-5 visible rows made the whole modal
  // visibly shrink/grow as you flipped between months, which read as janky/broken.
  const totalCellsSoFar = startDow + numDays;
  const trailing = 42 - totalCellsSoFar;
  for(let i=0;i<trailing;i++) cells += `<div></div>`;
  const headerLabel = selected ? new Date(selected+"T00:00:00").toLocaleDateString(undefined,{weekday:"short", month:"short", day:"numeric"}) : "No date set";
  return { cells, headerLabel, viewYear, monthLabel: MONTH_NAMES[viewMonth]+" "+viewYear };
}
function renderDatePickerModal(){
  const root = document.getElementById("datePickerModalRoot");
  if(!root) return;
  if(!datePickerUi.open){ root.innerHTML=""; return; }

/* Coalesces render() calls into once-per-frame. Several input handlers below
   call this instead of render() directly: calling render() synchronously on
   every keystroke destroys and recreates the focused <input> element (since
   render rebuilds innerHTML from scratch), which resets the DOM node's
   identity mid-keystroke. On mobile that interrupts the OS keyboard's native
   "hold backspace to repeat-delete" gesture, making a held backspace remove
   only one character instead of continuously deleting. Batching multiple
   rapid keystrokes (as happens during a held key) into a single render per
   animation frame keeps the input's identity stable long enough for that
   native repeat behavior to keep working, while still updating on-screen
   totals/dropdowns live as the person types. */
let renderScheduled = false;
function scheduleRender(){
  if(renderScheduled) return;

}
// The Records/Inventory search boxes, and the New Bill / special-medicine / edit-bill medicine
// search boxes, used to funnel every keystroke through scheduleRender()/render() like any other
// input, just with an extra trailing-debounce variant (scheduleQueryRender, since removed, which
// called the scheduleSearchRender() below for deletions) for deletions. That was only ever a
// mitigation, not a fix: render() rebuilds a whole tab's innerHTML, which — even with the "swap
// the original node back" trick below — MOMENTARILY DETACHES the focused input from the document
// while the new HTML is being inserted, before the old node is swapped back in. Browsers treat a
// focused element becoming detached as an implicit blur, which silently aborts whatever the
// Android keyboard's IME was mid-composing (composition state lives on the node's live DOM
// attachment, not just the node object) — even though the exact same node comes back a moment
// later. A fast render cadence (scheduleRender's ~16ms) kept the loss down to about one character
// per interruption, imperceptible for ordinary inputs; a search box's heavier
// re-filter-the-whole-list render made that interruption land more often, and the 220ms debounce
// tried for deletions gave Gboard's predictive/batched composition far longer to build up a whole
// in-flight word before the hit, losing several characters at once during fast typing instead of
// at most one.
// The actual fix: these search boxes now never call render() (or scheduleRender) while the
// person is typing at all. Each one's oninput handler updates its own state and then writes
// straight into a small, dedicated results container sitting next to the input (e.g.
// #billQueryDropdown, #invListContainer, #recordsBody, #notesEmptyMsg/#notesList,
// #editTxDropdown-<id>) via a plain el.innerHTML = ... call. The input element itself is never
// part of that innerHTML, so it's never destroyed or detached, so there's nothing for the IME to
// get silently interrupted by — no debounce needed, at any typing speed. A full render() still
// happens for anything else that changes the page (selecting a match, adding an item, switching
// tabs, cloud sync, etc.), which is fine since those aren't mid-keystroke events. See
// onBillQuery/refreshBillQueryDropdown, onInvQuery/renderInvList, onRecordsSearch/
// renderRecordsBody, onEditTxQuery/refreshEditTxDropdown, and onNotesSearch/renderNotesListBody.
// Still used below by applyRemoteSnapshot() — an incoming cloud-sync update is a full render()
// triggered by a BACKGROUND event, unrelated to whatever the person happens to be typing into at
// that moment (possibly a plain, non-search input the fix above doesn't cover). Trailing-debounce
// it the same way a search box's own typing used to be debounced, so it waits for typing to
// pause first instead of landing mid-keystroke.
let searchRenderTimer = null;
function scheduleSearchRender(){
  if(searchRenderTimer) clearTimeout(searchRenderTimer);

/* ===================== BACK BUTTON → CLOSE MENUS, THEN STEP BACK THROUGH TABS =====================
   Pressing the hardware back button:
   1) while any menu, dropdown, or edit/restock panel is open (adding/editing/restocking a
      medicine, editing a bill or doctor fee, a discount box, the test-price editor, receipt
      settings, category editor, the date picker, editing a user, the header settings dropdown,
      Printer Settings, Manage Users, Backup & Restore, the Share popup, an expanded record/day
      breakdown, etc.) — closes just that one layer, leaving everything else as it was;
   2) once nothing like that is open — steps back to whichever tab (New Bill/Inventory/Records/
      Warnings/Notepad) was open right before the current one, same as a browser's own back
      button would for pages you'd visited, one tab-switch at a time.
   This relies on the WebView host relaying the hardware back button as a normal browser "back"
   navigation (the standard way an App Inventor WebViewer app exposes it to the page); if it
   instead always exits the app directly, this can't intercept it and nothing changes on our end.
   How it works: navStack holds one "resolver" function per outstanding history entry, in the
   exact order things happened — switching tabs and opening a menu each push their own resolver
   (a tab switch's resolver flips back to the tab it came from; a menu's closes the top-most open
   one). A real back press pops the most recent resolver and runs it, so layers unwind in reverse
   chronological order regardless of whether they're menus or tab switches. If closing a menu
   reveals another one still open underneath (e.g. the date picker sitting on top of the restock
   form), the next render notices and pushes a fresh entry for it, so a second back press closes
   that one too, same as before.
   Deliberately NOT done: calling history.back() ourselves to "clean up" a pushed entry when a
   menu instead closes normally (Save/Cancel/X/tapping its own toggle) or a tab is switched via
   the nav bar. That was tried first and caused exactly the failure mode of "back stops
   responding to everything" — history.back() is asynchronous, and pairing it with a same-tick
   pushState can leave the browser's real back-stack and this script's idea of it out of sync in
   a way that then swallows a real, later back press. Instead, a leftover entry (e.g. from
   tapping a tab directly instead of using back to get there) is simply consumed harmlessly by
   the next real back press — closeTopMenu() is a safe no-op when nothing is open, and stepping
   to "the previous tab" one extra time is harmless — so at worst one extra back press is needed
   here and there, never a stuck or broken back button. */
let navStack = []; // one resolver per outstanding pushed history entry, oldest first
let wasMenuOpen = false; // menu-open state as of the last render(), for edge-detecting new opens
// "Press back again to exit" — standard Android double-back pattern, for once there's truly
// nothing of ours left to close (no menu open, no tab to step back to). This only reads
// navStack.length and doesn't touch pushState/popState itself, deliberately, given the fragile
// history above — it just watches for two real back presses in a row that both find nothing to
// do, and asks the native app to close on the second one. window.AppInventor.setWebViewString
// is the same bridge already used for print/export/update elsewhere in this file — closing the
// app itself isn't something a web page can do on its own, so this needs one small matching
// block on the App Inventor side: when Screen1.BackPressed, if WebViewer1.WebViewString =
// "EXIT_APP" then close the application (and clear WebViewString after, same as other signals);
// the else branch should unconditionally call WebViewer1.GoBack() every other time.
//
// Why a permanent "floor" entry is pushed below, and re-pushed every time it's consumed:
// WebViewer1.GoBack() (like history.back() generally) is a silent no-op once there's truly
// nothing left in the WebView's own navigation history — no navigation happens and, critically,
// no popstate event fires. Since the double-back-to-exit logic below lives entirely inside the
// popstate handler, without a floor entry the very first "nothing left to close" back press
// would do nothing at all — GoBack() would silently no-op and this logic would never even run.
// Pushing one extra, otherwise-meaningless history entry once at load, and immediately replacing
// it every time it's the one consumed, guarantees GoBack() always has something to consume and
// always fires popstate — so this logic reliably sees every single back press, forever. It's
// deliberately NOT pushed via pushNav()/navStack — it isn't a menu/tab to close, just plumbing.
// Why a big pre-loaded buffer of "floor" entries, pushed once at load, rather than replacing
// one entry reactively each time it's consumed: WebViewer1.GoBack() (like history.back()
// generally) silently no-ops once there's truly nothing left in the WebView's own navigation
// history — no navigation happens and no popstate event fires. Since the double-back-to-exit
// logic below lives entirely inside the popstate handler, without spare entries the very first
// "nothing left to close" back press would never reach it at all. A single entry replenished
// reactively (push a new one the instant the old one is consumed) had a real race: if back was
// pressed again very fast, the second GoBack() could reach the WebView before the JS's own
// replacement push had settled, finding nothing to consume. Front-loading hundreds of spare
// entries instead means there's always one immediately ready — nothing needs to happen in
// between presses, no matter how fast they come. 500 is enormously more than anyone pressing
// back-with-nothing-open could realistically exhaust in one session (each one is used up only
// by an "empty" back press specifically, not by normal menu/tab navigation), and a fresh set is
// pushed every time the app is actually reopened anyway. Deliberately NOT pushed via
// pushNav()/navStack — these aren't real menus/tabs, just plumbing to keep GoBack() functional.
for(let i=0;i<500;i++) history.pushState({ floor:true }, "", location.href);
let lastEmptyBackAt = 0;
function pushNav(resolver){

}
window.addEventListener("popstate", function(){

    // toast shows up on the second back press, the JS side is 100% working correctly and the
    // remaining problem is purely on the native App Inventor side. If it does NOT show up, the
    // problem is still here in the browser-history/timing logic above, not in App Inventor.
    showToast("Signaling app to close…");

  // specific fix for that), which clamps scrollTop down, and the browser does not restore it

  renderConfirmModal();
  renderInvFormModal();

  renderAiModal();
  renderMonthBreakdownModal();
  renderCategoryModal();
  renderManageUsersModal();
  renderHistoryModal();

function renderNav(){
  const tabs = [
    {id:"bill",label:"New Bill",icon:"📄"},
    {id:"inventory",label:"Inventory",icon:"💊"},
    {id:"records",label:"Records",icon:"🕒"},
    {id:"stock",label:"Warnings",icon:"⚠️",badge:lowStockList().length+expiringBatches().length},
    {id:"notes",label:"Notepad",icon:"📝"},
  ];
  const hs=document.querySelector(".header-sub"); if(hs) hs.textContent=greetingText();
  document.getElementById("nav").innerHTML = tabs.map(t=>`
    <button class="${tab===t.id?'active':''}" onclick="setTab('${t.id}')">
      <span class="icon">${NAV_SVG[t.id]||t.icon}</span>
      <span>${t.label}</span>
      ${t.badge?`<span class="badge">${t.badge}</span>`:""}
    </button>`).join("");
}

function setTab(t){
  if(t===tab){ render(); return; }
  const prevTab = tab;
  pushNav(()=>{ tab=prevTab; render(); });
  // A tap-a-pill filter is meant as a quick, temporary lens on the tab you're currently
  // looking at — clearing it on the way out means coming back to Inventory/Warnings later
  // (including via the back button) always starts fresh instead of silently still narrowed
  // to whatever pill was tapped last time.
  if(prevTab==="inventory") inv.statFilter=null;
  if(prevTab==="stock") warnUi.filter=null;
  tab=t;
  render();
}

function openShare(text){ shareText=text; render(); }
function closeShare(){ shareText=null; render(); }
function shareWhatsApp(){ window.open("https://wa.me/?text="+encodeURIComponent(shareText),"_blank"); }
// Lets the user pick ANY installed app (not just WhatsApp) via the native Android share
// sheet. Inside the App Inventor app, that's done through Sharing1.ShareMessage on the
// native side (Blocks picks this up on WebViewStringChange, prefix "SHARE_TEXT:"). In a
// normal browser, the Web Share API (navigator.share) gives the same native picker; if
// neither is available, fall back to the old WhatsApp-only link so nothing breaks.
function shareToAnyApp(){
  if(window.AppInventor && typeof window.AppInventor.setWebViewString === "function"){
    window.AppInventor.setWebViewString("SHARE_TEXT:" + shareText);
    return;
  }
  if(navigator.share){
    navigator.share({text: shareText}).catch(()=>{});
    return;
  }
  shareWhatsApp();
}
function copyShare(){
  navigator.clipboard.writeText(shareText).then(()=>{
    const btn = document.getElementById("copyBtnLabel");
    if(btn){ btn.textContent="Copied ✓"; setTimeout(()=>{ if(document.getElementById("copyBtnLabel")) document.getElementById("copyBtnLabel").textContent="Copy text"; },1500); }
  }).catch(()=>{});
}
function renderShareModal(){
  const root = document.getElementById("shareModalRoot");
  if(shareText===null){ root.innerHTML=""; return; }
  root.innerHTML = `
    <div class="modal-overlay" onclick="if(event.target===this) closeShare()">
      <div class="modal">
        <div class="modal-head">
          <strong>Share</strong>
          <button class="modal-x" onclick="closeShare()">✕</button>
        </div>
        <div class="modal-body">${esc(shareText)}</div>
        <div class="modal-actions">
          <button class="btn btn-outline flex1" onclick="copyShare()"><span id="copyBtnLabel">Copy text</span></button>
          <button class="btn btn-success flex1" onclick="shareToAnyApp()">📤 Share…</button>
        </div>
      </div>
    </div>`;
}

/* ===================== CONFIRM MODAL ===================== */
/* Some in-app browsers / WebViews silently block window.confirm() (it returns
   false with no dialog shown), which made delete buttons look broken.
   This custom modal replaces confirm() everywhere so it always works. */
let confirmState = null; // { message, onYes, confirmLabel }
function askConfirm(message, onYes, confirmLabel, altLabel, onAlt){ confirmState = { message, onYes, confirmLabel, altLabel, onAlt }; renderConfirmModal(); }
function cancelConfirm(){ confirmState = null; renderConfirmModal(); }
function proceedConfirm(){
  const fn = confirmState && confirmState.onYes;
  confirmState = null;
  renderConfirmModal();
  if(fn) fn();
}
function proceedConfirmAlt(){
  const fn = confirmState && confirmState.onAlt;
  confirmState = null;
  renderConfirmModal();
  if(fn) fn();
}
function renderConfirmModal(){
  const root = document.getElementById("confirmModalRoot");
  if(!root) return;
  if(!confirmState){ root.innerHTML=""; return; }
  root.innerHTML = `
    <div class="modal-overlay" onclick="if(event.target===this) cancelConfirm()">
      <div class="modal">
        <div class="modal-head"><strong>Please confirm</strong></div>
        <div class="modal-body">${esc(confirmState.message)}</div>
        ${confirmState.altLabel ? `<div class="modal-actions" style="flex-direction:column;">
          <button class="btn btn-primary" onclick="proceedConfirm()">${esc(confirmState.confirmLabel || "OK")}</button>
          <button class="btn btn-outline" onclick="proceedConfirmAlt()">${esc(confirmState.altLabel)}</button>
          <button class="btn btn-outline" onclick="cancelConfirm()">Cancel</button>
        </div>` : `<div class="modal-actions">
          <button class="btn btn-outline flex1" onclick="cancelConfirm()">Cancel</button>
          <button class="btn flex1" style="background:var(--danger);color:#fff;" onclick="proceedConfirm()">${esc(confirmState.confirmLabel || "Delete")}</button>
        </div>`}
      </div>
    </div>`;
}

function billMedTotal(){ return r2(bill.items.reduce((s,it)=>s+(Number(it.subtotal)||0),0)); }
function billMedDiscount(){ return r2(Math.min(Math.max(Number(bill.medsDiscount)||0,0), billMedTotal())); }
function billMedNet(){ return r2(billMedTotal() - billMedDiscount()); }
function billExtrasTotal(){ return r2(bill.extras.reduce((s,it)=>s+(Number(it.amount)||0),0)); }
function billTestsGross(){ return r2(bill.tests.reduce((s,t)=>s+(Number(t.amount)||0),0)); }
function billTestsDiscount(){ return r2(Math.min(Math.max(Number(bill.testsDiscount)||0,0), billTestsGross())); }
function billTestsTotal(){ return r2(billTestsGross() - billTestsDiscount()); }
function billFeeGross(){ return r2(Math.max(Number(bill.fee)||0,0)); }
function billFeeDiscount(){ return r2(Math.min(Math.max(Number(bill.feeDiscount)||0,0), billFeeGross())); }
function billFeeNet(){ return r2(billFeeGross() - billFeeDiscount()); }
function billFeeContribution(){ return bill.feeIncluded ? billFeeNet() : 0; }
function billGrandTotal(){ return r2(billMedNet() + billExtrasTotal() + billTestsTotal() + billFeeContribution()); }

function addNewCustomTest(){
  const name = newTestNameDraft.trim();
  if(!name) return;
  const id = uid();
  customTests.push({ id, name });
  saveCustomTests();
  const price = Number(newTestPriceDraft)||0;
  // Save the price right away instead of only staging it in the draft — previously the price
  // only became permanent when the separate "Save" button below was tapped, so a test added
  // and then left (panel closed, tab switched) without that extra tap kept its name but lost
  // its price, showing 0 the next time the Edit panel opened.
  if(price>0) testPrices[id]=price; else delete testPrices[id];
  saveTestPrices();
  testPriceDraft[id] = price>0 ? String(price) : "";
  testNameDraft[id] = name;
  newTestNameDraft = ""; newTestPriceDraft = "";
  touchTestItem(id);
  render();
  showToast("✓ Test added");
}
function removeCustomTest(id){
  const builtIn = isBuiltInTestId(id);
  askConfirm(builtIn
    ? "Remove this test from your list? It will no longer be available to add to bills. (You can't fully delete a built-in test, but this hides it from your list the same way.)"
    : "Remove this test from your list? It will no longer be available to add to bills.", ()=>{
    if(builtIn){
      if(!hiddenBuiltInTestIds.includes(id)) hiddenBuiltInTestIds.push(id);
      saveHiddenBuiltInTests();
    } else {
      customTests = customTests.filter(t=>t.id!==id);
      saveCustomTests();
    }
    delete testPrices[id];
    delete testPriceDraft[id];
    delete testNameDraft[id];
    delete testNameOverrides[id];
    saveTestPrices();
    saveTestNameOverrides();
    touchTestItem(id);
    render();
  });
}
function saveAllTestPrices(){
  const builtIn = {}; TEST_CATALOG.forEach(t=>builtIn[t.id]=t.name);
  const touchedIds = [];
  allTests().forEach(t=>{
    const val = Number(testPriceDraft[t.id])||0;
    const prevPrice = testPrices[t.id];
    const newPrice = val>0 ? val : undefined;
    if(newPrice!==prevPrice){
      if(val>0) testPrices[t.id]=val; else delete testPrices[t.id];
      touchedIds.push(t.id);
    }
    const nameVal = (testNameDraft[t.id]||"").trim();
    if(!nameVal) return; // never allow a blank name to wipe a test's name
    const custom = customTests.find(ct=>ct.id===t.id);
    if(custom){
      if(custom.name!==nameVal){ custom.name = nameVal; touchedIds.push(t.id); }
    } else if(builtIn[t.id] !== undefined){
      const prevOverride = testNameOverrides[t.id];
      const newOverride = (nameVal !== builtIn[t.id]) ? nameVal : undefined;
      if(newOverride!==prevOverride){
        if(newOverride!=null) testNameOverrides[t.id] = newOverride; else delete testNameOverrides[t.id];
        touchedIds.push(t.id);
      }
    }
  });
  saveTestPrices();
  saveCustomTests();
  saveTestNameOverrides();
  // Only bump the ids that actually changed — so tests nobody touched in this edit keep
  // their existing (possibly newer) per-id time from wherever they were last really edited.
  new Set(touchedIds).forEach(id=>touchTestItem(id));
  if(touchedIds.length) logActivity("test_edit", `${touchedIds.length} test(s) updated`);
  testPriceEditorOpen = false;
  render();
  showToast("✓ Tests saved");
}

function onGlobalDays(v){
  bill.globalDays = v;
  const days = Number(v)||0;
  bill.items.forEach(it=>{
    if(it.linkedToGlobalDays){
      it.pills = (it.perDay||0)*days;
      it.note = days>0 ? `${it.perDay}/day × ${days}d` : `${it.perDay}/day × (set days below)`;
    }
  });
  repriceBillItems();   // new quantity => price it batch by batch and round to 2 decimals
  scheduleRender();
}
function billComputedPills(){
  if(bill.qtyMode==="dose"){
    const perDay = Number(bill.perDay);
    if(!perDay || perDay<=0) return 0;
    const days = bill.daysMode==="same" ? (Number(bill.globalDays)||0) : Number(bill.days);
    if(!days || days<=0) return 0;
    return perDay*days;
  }
  return Number(bill.pills) || 0;
}
function canAddBillItem(){
  if(!bill.selectedMedId) return false;
  if(bill.qtyMode==="total") return Number(bill.pills)>0;
  const perDay = Number(bill.perDay);
  if(!perDay || perDay<=0) return false;
  if(bill.daysMode==="same") return true; // days can be set later, applies to whole list
  const days = Number(bill.days);
  return !!(days && days>0);
}
function pickBillMed(id){ bill.selectedMedId=id; const m=inventory.find(x=>x.id===id); bill.query=m?m.name:""; render(); }

function addBillItem(){
  const med = inventory.find(m=>m.id===bill.selectedMedId);
  if(!med || !canAddBillItem()) return;
  const pricePerPill = nextBatchUnitPrice(med);
  if(bill.qtyMode==="total"){
    const pills = Number(bill.pills)||0;
    bill.items.push({medId:med.id, name:med.name, pills, ...lineCalc(med,pills,billPendingSkip(med.id)), note:"", perDay:null, linkedToGlobalDays:false});
  } else if(bill.daysMode==="same"){
    const perDay = Number(bill.perDay)||0;
    const days = Number(bill.globalDays)||0;
    const pills = perDay*days;
    const note = days>0 ? `${perDay}/day × ${days}d` : `${perDay}/day × (set days below)`;
    bill.items.push({medId:med.id, name:med.name, pills, ...lineCalc(med,pills,billPendingSkip(med.id)), note, perDay, linkedToGlobalDays:true});
  } else {
    const perDay = Number(bill.perDay)||0;
    const days = Number(bill.days)||0;
    const pills = perDay*days;
    const note = `${perDay}/day × ${days}d`;
    bill.items.push({medId:med.id, name:med.name, pills, ...lineCalc(med,pills,billPendingSkip(med.id)), note, perDay, linkedToGlobalDays:false});
  }
  bill.selectedMedId=null; bill.query=""; bill.pills=""; bill.perDay=""; bill.days="";
  render();
}
function removeBillItem(idx){
  bill.items.splice(idx,1);
  repriceBillItems();
  if(bill.applyingFeeMode==='whole') recomputeWholeApplyingFee(); // the removed item may have held the whole-bill fee, or been the "last" one it should move to
  render();
}
function editBillItem(idx){
  const it = bill.items[idx];
  if(!it) return;
  bill.items.splice(idx,1);
  repriceBillItems();
  if(it.special){
    // Route special-medicine items back through the special add flow (not the normal one)
    // so re-adding them keeps their specialCategory/applying-fee handling intact.
    bill.selectedSpecialMedId = it.medId;
    const sm = inventory.find(x=>x.id===it.medId);
    bill.specialQuery = sm ? sm.name : it.name;
    bill.specialPills = String(it.pills);
    bill.applyingFeeDraft = (bill.applyingFeeMode==='perItem' && it.appliedFee) ? String(it.appliedFee) : "";
    if(bill.applyingFeeMode==='whole') recomputeWholeApplyingFee();
    render();
    const el = document.getElementById("billSpecialPillsInput");
    if(el){ el.focus(); el.select(); }
    return;
  }
  bill.selectedMedId = it.medId;
  const m = inventory.find(x=>x.id===it.medId);
  bill.query = m ? m.name : it.name;
  bill.qtyMode = "total";
  bill.pills = String(it.pills);
  bill.perDay = ""; bill.days = "";
  render();
  const el = document.getElementById("billPillsInput");
  if(el){ el.focus(); el.select(); }
}
function pendingBillSubtotal(){

  const pills = billComputedPills();
  if(!med || !pills || pills<=0) return 0;
  return priceForPills(med, pills, billPendingSkip(med.id));
}

  const med = inventory.find(m=>m.id===bill.selectedSpecialMedId);

  const fee = bill.applyingFeeMode==='perItem' ? (Number(bill.applyingFeeDraft)||0) : 0;
  return r2(priceForPills(med, pills, billPendingSkip(med.id)) + fee);
}

   renderBill and the state comment in newBillState() ---- */
