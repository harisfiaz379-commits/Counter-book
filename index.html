<script>
// TEMPORARY DIAGNOSTIC — actively tests which storage APIs actually work in this WebView,
// since the same "localStorage is null" error happened on BOTH file:// and https://, which
// rules out the opaque-origin theory and points to something else (WebView settings, device
// privacy settings, etc). Uses a blocking alert() so results are guaranteed visible BEFORE the
// app's own script runs (and possibly crashes) — DOM-injection would have been at risk of
// being covered up by the crash's own full-screen error overlay.
(function(){
  function testStorage(name, fn){
    try{
      const v = fn();
      return name + ': OK (' + (typeof v) + ')';
    }catch(e){
      return name + ': FAILED — ' + e.name + ': ' + e.message;
    }
  }
  const results = [];
  results.push(testStorage('window.localStorage exists', ()=>typeof window.localStorage));
  results.push(testStorage('localStorage.setItem/getItem', ()=>{ localStorage.setItem('__t','1'); const v=localStorage.getItem('__t'); localStorage.removeItem('__t'); return v; }));
  results.push(testStorage('window.sessionStorage exists', ()=>typeof window.sessionStorage));
  results.push(testStorage('sessionStorage.setItem/getItem', ()=>{ sessionStorage.setItem('__t','1'); const v=sessionStorage.getItem('__t'); sessionStorage.removeItem('__t'); return v; }));
  results.push(testStorage('window.indexedDB exists', ()=>typeof window.indexedDB));
  results.push(testStorage('document.cookie writable', ()=>{ document.cookie='__t=1'; return document.cookie; }));
  results.push('User-Agent: ' + navigator.userAgent);
  results.push('Location: ' + window.location.href);
  alert('STORAGE PROBE RESULTS:\n\n' + results.join('\n'));
})();
function showJsError(label, msg, line, col, stack){
  var el = document.createElement('div');
  el.style.cssText = 'position:fixed;top:0;left:0;right:0;bottom:0;background:#fff;color:#900;padding:16px;font-family:monospace;font-size:13px;white-space:pre-wrap;overflow:auto;z-index:99999;';
  el.textContent = label + ':\n\n' + msg + (line?('\n\nLine: '+line+', Col: '+col):'') + '\n\n' + (stack || '(no stack available)');
  document.body.appendChild(el);
}
window.onerror = function(msg, url, line, col, error){
  showJsError('JS ERROR CAUGHT', msg, line, col, error && error.stack);
  return false;
};
window.addEventListener('unhandledrejection', function(event){
  showJsError('UNHANDLED PROMISE REJECTION', event.reason && event.reason.message ? event.reason.message : String(event.reason), null, null, event.reason && event.reason.stack);
});
</script>

<meta charset="UTF-8">

<title>Counter Book</title>
<style>
  :root{
    --page:#F3F6F7; --header:#0F5C57; --headerSub:#CFE9E5;
    --primary:#0F5C57; --primarySoft:#E4F1EF;
    --text:#1B2430; --muted:#7C8A99; --faint:#A9B4BE;
    --border:#E2E8F0; --card:#FFFFFF;
    --success:#0E9F6E; --successSoft:#E5F8F1;
    --danger:#DC3B2C; --dangerSoft:#FCEAE8;
    --warning:#B4650A; --warningSoft:#FDF3E3;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;background:var(--page);color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;}
  #app{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;}
  header{background:var(--header);color:#fff;padding:18px 16px 14px;position:sticky;top:0;z-index:30;
    box-shadow:0 1px 3px rgba(0,0,0,.15);display:flex;justify-content:space-between;align-items:flex-start;}
  header h1{margin:0;font-size:18px;font-weight:700;}
  header p{margin:2px 0 0;font-size:12px;color:var(--headerSub);}
  #fullscreenBtn{background:rgba(255,255,255,.18);color:#fff;border:none;border-radius:8px;
    padding:6px 10px;font-size:11px;font-weight:600;cursor:pointer;}
  #banner{font-size:12px;padding:8px 16px;background:var(--warningSoft);color:var(--warning);
    border-bottom:1px solid #F0DCB0;display:none;align-items:center;gap:6px;}
  main{flex:1;padding:14px 12px 100px;max-width:560px;margin:0 auto;width:100%;}
  nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--border);
    display:flex;justify-content:space-around;padding:6px 4px calc(6px + env(safe-area-inset-bottom));z-index:30;}
  nav button{background:none;border:none;display:flex;flex-direction:column;align-items:center;gap:2px;
    padding:6px 10px;border-radius:8px;color:var(--faint);font-size:10px;font-weight:500;cursor:pointer;position:relative;}
  nav button.active{color:var(--primary);font-weight:700;}
  nav button .icon{font-size:20px;line-height:1;}
  nav button .badge{position:absolute;top:0;right:2px;background:var(--danger);color:#fff;font-size:9px;
    font-weight:700;border-radius:999px;min-width:14px;height:14px;display:flex;align-items:center;justify-content:center;padding:0 3px;}
  .card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:14px;
    box-shadow:0 1px 2px rgba(0,0,0,.04);margin-bottom:12px;}
  .card.primary{background:var(--primary);color:#fff;border:none;}
  label.field-label{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.02em;color:var(--muted);display:block;margin-bottom:4px;}
  input,textarea,select{width:100%;border:1px solid var(--border);border-radius:8px;padding:10px 12px;
    font-size:16px;font-family:inherit;color:var(--text);background:#fff;}
  input:focus,textarea:focus,select:focus{outline:2px solid var(--primary);outline-offset:-1px;}
  textarea{resize:none;}
  .row{display:flex;justify-content:space-between;align-items:center;}
  .row .val{font-weight:600;}
  .row.big .lab{font-size:14px;}
  .row.big .val{font-size:20px;font-weight:700;}
  .btn{border:none;border-radius:10px;padding:11px 16px;font-size:14px;font-weight:600;cursor:pointer;}
  .btn-primary{background:var(--primary);color:#fff;}
  .btn-success{background:var(--success);color:#fff;}
  .btn-danger{background:var(--danger);color:#fff;}
  .btn-outline{background:none;border:1px solid var(--border);color:var(--muted);}
  .btn-dashed{background:none;border:2px dashed var(--primary);color:var(--primary);width:100%;padding:12px;
    border-radius:12px;display:flex;align-items:center;justify-content:center;gap:6px;font-weight:700;}
  .btn:disabled{opacity:.4;cursor:default;}
  .pill-badge{font-size:11px;font-weight:700;padding:4px 8px;border-radius:999px;}
  .small{font-size:12px;color:var(--muted);}
  .faint{color:var(--faint);}
  .mt2{margin-top:8px;}.mt3{margin-top:12px;}.mb2{margin-bottom:8px;}
  .flex{display:flex;}.gap2{gap:8px;}.gap1{gap:4px;}.flex1{flex:1;}
  .search-wrap{position:relative;}
  .search-icon{position:absolute;left:10px;top:12px;color:var(--faint);pointer-events:none;}
  .search-wrap input{padding-left:32px;}
  .dropdown{position:absolute;z-index:20;margin-top:4px;width:100%;background:#fff;border:1px solid var(--border);
    border-radius:8px;max-height:220px;overflow-y:auto;box-shadow:0 6px 20px rgba(0,0,0,.12);}
  .dropdown button{width:100%;text-align:left;padding:10px 12px;border:none;background:none;border-bottom:1px solid var(--border);
    display:flex;justify-content:space-between;align-items:center;cursor:pointer;}
  .dropdown button:last-child{border-bottom:none;}
  .item-row{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--border);}
  .item-row:last-child{border-bottom:none;}
  .modal-overlay{position:fixed;inset:0;background:rgba(15,23,30,.45);z-index:50;display:flex;
    align-items:flex-end;justify-content:center;}
  /* The confirm dialog can be triggered from inside another already-open modal (category
     editor, inventory form, backup panel, etc.). All modal overlays share the same z-index
     and stack by DOM order, and #confirmModalRoot happens to sit earlier in the markup than
     those — so without this, the confirm dialog rendered BEHIND the still-open modal and was
     invisible and unclickable. Confirm dialogs are always meant to be the topmost thing on
     screen, so they get a dedicated higher z-index instead of relying on DOM order. */
  #confirmModalRoot .modal-overlay{z-index:60;}
  .modal{background:#fff;border-radius:16px 16px 0 0;width:100%;max-width:480px;max-height:85vh;
    display:flex;flex-direction:column;box-shadow:0 8px 30px rgba(0,0,0,.2);}
  .modal-head{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border-bottom:1px solid var(--border);}
  .modal-body{margin:12px 16px;padding:12px;background:var(--page);border:1px solid var(--border);border-radius:8px;
    font-size:12px;font-family:ui-monospace,monospace;white-space:pre-wrap;overflow-y:auto;color:var(--text);}
  .modal-actions{display:flex;gap:8px;padding:14px 16px;}
  .hidden{display:none !important;}
  #toast{position:fixed;bottom:78px;left:50%;transform:translateX(-50%);background:#1B2430;color:#fff;
    padding:10px 18px;border-radius:999px;font-size:13px;font-weight:600;z-index:60;box-shadow:0 4px 16px rgba(0,0,0,.25);}
  a.silent{color:inherit;text-decoration:none;}
  ::placeholder{color:var(--faint);}
  #invFab{position:fixed;right:16px;bottom:calc(70px + env(safe-area-inset-bottom));width:54px;height:54px;border-radius:50%;
    background:var(--primary);color:#fff;border:none;font-size:26px;line-height:1;cursor:pointer;
    box-shadow:0 4px 14px rgba(0,0,0,.25);z-index:35;display:flex;align-items:center;justify-content:center;}
  .expiry-tag{font-size:11px;font-weight:700;padding:3px 7px;border-radius:6px;display:inline-block;}
  .icon-del-btn{background:none;border:none;color:var(--faint);cursor:pointer;font-size:16px;}
  .modal-x{border:none;font-size:18px;padding:4px 8px;}
  .item-title{font-weight:700;font-size:14px;margin:0;}
  .divider-top{border-top:1px solid var(--border);padding-top:10px;}
  .divider-top8{border-top:1px solid var(--border);padding-top:8px;}
  /* Category dropdown + "Edit" button, merged into one visual box (New medicine form and the
     inline per-medicine Edit form). Plain <input>/<select> elements get a full outline all the
     way around themselves on focus (see the shared input:focus rule above); a bare <select>
     inside this merged box would only outline itself, leaving the "Edit" button half of the
     box looking untouched and the whole thing visually inconsistent with every other field.
     Using :focus-within on the wrapping box instead makes the WHOLE pill glow together,
     matching how every other field responds when focused. */
  .cat-picker{display:flex;border:1px solid var(--border);border-radius:8px;overflow:hidden;}
  .cat-picker:focus-within{outline:2px solid var(--primary);outline-offset:-1px;}
  .cat-picker select{flex:1;min-width:0;border:none;border-radius:0;outline:none;}
  .cat-picker button{flex:0 0 auto;border:none;border-left:1px solid var(--border);background:var(--page);
    color:var(--muted);font-size:12px;font-weight:600;padding:0 10px;cursor:pointer;}
</style>

<script>
/* ===================== STATE ===================== */
const CURRENCY = "Rs ";
// Repeated on nearly every text input below to stop mobile keyboards/password managers
// from auto-capitalizing, autocorrecting, or offering to save clinic/patient data.
const NOAC = 'autocomplete="off" autocorrect="off" spellcheck="false" data-lpignore="true"';
let inventory = [];
let transactions = [];
let monthAdjustments = {}; // { "YYYY-MM": {doctorFee, medTotal, testsTotal, othersTotal, updatedAt} } — manual corrections, not tied to any bill
let notes = [];
let profiles = [];
let currentProfileId = null;
let tab = "bill";
let saveError = "";
let shareText = null;
let testPrices = {}; // { testId: permanentAmount } — set via the "Edit" panel, synced across devices
let defaultDoctorFee = 0; // permanent default for the doctor visit fee — synced across devices (see defaultDoctorFeeUpdatedAt/mergeDefaultDoctorFee)
let defaultDoctorFeeUpdatedAt = 0; // timestamp of the last real edit, used for last-write-wins merging across devices
let customTests = []; // [{id,name}] — tests added by the user beyond the built-in TEST_CATALOG, synced across devices
let testNameOverrides = {}; // { testId: renamedName } — user-renamed built-in TEST_CATALOG entries, synced across devices
let hiddenBuiltInTestIds = []; // ids of built-in TEST_CATALOG entries the user removed from their list — kept out of allTests(), synced across devices
// Per-test-id edit timestamp: { testId: ms }. Each test's own name/price/hidden-state/
// existence is merged individually against this per-id time (see mergeTestSettings) —
// so editing/adding ONE test on this device can never silently overwrite a DIFFERENT
// test another device added or priced. testSettingsUpdatedAt below is kept only as a
// legacy "something in the catalog changed" marker for older backup files.
let testItemUpdatedAt = {};
let testSettingsUpdatedAt = 0;
let testPriceEditorOpen = false; // transient: is the "Edit" panel open in the Tests card
let testPriceDraft = {}; // transient: in-progress edits while that panel is open
let testNameDraft = {}; // transient: in-progress name edits while that panel is open
let newTestNameDraft = ""; // transient: name input for adding a new test in the Edit panel
let newTestPriceDraft = ""; // transient: price input for adding a new test in the Edit panel

/* transient (not persisted) UI state */
function newBillState(){
  return { patient:"", fee: defaultDoctorFee?String(defaultDoctorFee):"", items:[], query:"", pills:"", selectedMedId:null, qtyMode:"total", daysMode:"perMed", perDay:"", days:"", globalDays:"", extras:[], extraAmount:"",
    tests:[], selectedTestIds:[], testsDiscount:"", feeDiscount:"", feeEditing:false, testsMenuOpen:false, feeIncluded:false,
    // Special-category medicines: a second, separate search/add flow (see specialMatches()
    // in renderBill) for medicines flagged with a specialCategory, which are deliberately
    // excluded from the normal medicine search above. applyingFeeMode is per-bill: "perItem"
    // charges an optional fee on each special medicine as it's added; "whole" charges one
    // fee for the whole bill, folded onto the last special medicine added (see
    // addSpecialBillItem/recomputeWholeApplyingFee). Neither fee is ever typed as a saved
    // default — always typed fresh — and neither shows as its own line in the bill; both are
    // baked directly into the relevant item's subtotal.
    specialQuery:"", selectedSpecialMedId:null, specialPills:"", applyingFeeMode:"perItem", applyingFeeDraft:"", wholeApplyingFee:"" };
}
let bill = newBillState();
let inv = { query:"", showForm:false, form:{name:"",category:"",formula:"",mg:"",mrp:"",pillsPerBox:"",lowStockAt:"10"},
            restockId:null, restockBoxes:"", restockExpiry:"", restockMrp:"", editId:null,
            editForm:{name:"",formula:"",mg:"",mrp:"",pillsPerBox:"",lowStockAt:"",stockPills:""} };
let backupUi = { open:false };
let rec = { expandedId:null, searchQuery:"", editingId:null, expandedMonth:null, expandedYear:null, showMonthBreakdown:false, editingMonthBreakdown:false, breakdownDraft:{doctorFee:"",medTotal:"",testsTotal:"",othersTotal:""}, expandedDayBreakdown:null };
let recEdit = { patient:"", fee:"", items:[], query:"", pills:"", selectedMedId:null };
let notesUi = { openId:null, draftTitle:"", draftBody:"", addingProfile:false, newProfileName:"", searchQuery:"" };

/* ===================== HELPERS ===================== */
let MED_CATEGORIES = ["Tablet","Capsule","Injection","Sachet","Syrup","Drip","Drops"]; // user-editable via the category manager (add/rename/delete) — see catUi below
let catUi = { open:false, renameDrafts:{}, newCategoryDraft:"" }; // transient: in-progress edits while the category-manager modal is open
// Special category: a SECOND, independent tag per medicine (e.g. Controlled/Cold-chain/
// High-value), separate from the regular Category above. Its only purpose is to flag a
// medicine as hidden from the normal New Bill medicine search — see specialMatches() in
// renderBill — and searchable instead through its own dedicated search box there. Managed
// the same way as MED_CATEGORIES (own editor modal, add/rename/delete, rename cascades to
// every medicine set to the old name) but kept as a completely separate list.
let SPECIAL_CATEGORIES = ["Controlled","Cold-chain","High-value"]; // user-editable via specialCatUi below
let specialCatUi = { open:false, renameDrafts:{}, newCategoryDraft:"" }; // transient: in-progress edits while the special-category-manager modal is open
const TEST_CATALOG = [
  {id:"cbc", name:"CBC"},
  {id:"bloodGroup", name:"Blood group identification"},
  {id:"lft", name:"LFT"},
  {id:"tsh", name:"TSH"},
  {id:"t3", name:"T3"},
  {id:"t4", name:"T4"},
  {id:"rft", name:"RFT"},
  {id:"urineCE", name:"Urine C/E"},
  {id:"flp", name:"FLP"},
  {id:"sCreatinine", name:"S.creatinine"},
  {id:"hba1c", name:"HbA1c"},
  {id:"ecg", name:"ECG"}
];
function isBuiltInTestId(id){ return TEST_CATALOG.some(t=>t.id===id); }
function allTests(){
  return TEST_CATALOG
    .filter(t=>!hiddenBuiltInTestIds.includes(t.id))
    .map(t=>({ id:t.id, name: testNameOverrides[t.id]||t.name }))
    .concat(customTests);
}
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
function money(n){ const v=Number(n)||0; return v.toFixed(2).replace(/\.00$/,""); }
function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function fmtDateTime(ts){
  const d=new Date(ts);
  return d.toLocaleDateString(undefined,{day:"2-digit",month:"short"})+", "+d.toLocaleTimeString(undefined,{hour:"2-digit",minute:"2-digit"});
}
function sameDay(ts,ref){ return new Date(ts).toDateString()===new Date(ref).toDateString(); }
function monthKeyOf(ts){ const d=new Date(ts); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0"); }
function monthLabelOf(ts){ return new Date(ts).toLocaleDateString(undefined,{month:"long",year:"numeric"}); }

/* ===================== PERSISTENCE (localStorage) ===================== */
/* Inventory and transactions are shared — every person using this device sees the same data.
   Notes are kept separate per profile, so each person's notepad stays private to them. */
function loadAll(){
  try{ inventory = JSON.parse(localStorage.getItem("clinic_inventory")||"[]"); }catch(e){ inventory=[]; }
  // Migrate medicines saved before batch/expiry tracking existed: fold their existing
  // stock into one "no expiry recorded" batch so nothing is lost.
  inventory.forEach(m=>{
    if(!Array.isArray(m.batches)){
      m.batches = (m.stockPills>0) ? [{ id:uid(), boxes:null, pillsRemaining:m.stockPills, expiryDate:null, addedAt:Date.now(), disposed:false }] : [];
    }
    recomputeStock(m);
  });
  try{ transactions = JSON.parse(localStorage.getItem("clinic_transactions")||"[]"); }catch(e){ transactions=[]; }
  try{ monthAdjustments = JSON.parse(localStorage.getItem("clinic_month_adjustments")||"{}"); }catch(e){ monthAdjustments={}; }
  try{ profiles = JSON.parse(localStorage.getItem("clinic_profiles")||"[]"); }catch(e){ profiles=[]; }
  try{ testPrices = JSON.parse(localStorage.getItem("clinic_test_prices")||"{}"); }catch(e){ testPrices={}; }
  try{ defaultDoctorFee = Number(localStorage.getItem("clinic_default_doctor_fee"))||0; }catch(e){ defaultDoctorFee=0; }
  try{ defaultDoctorFeeUpdatedAt = Number(localStorage.getItem("clinic_default_doctor_fee_updated_at"))||0; }catch(e){ defaultDoctorFeeUpdatedAt=0; }
  try{ customTests = JSON.parse(localStorage.getItem("clinic_custom_tests")||"[]"); }catch(e){ customTests=[]; }
  try{ testNameOverrides = JSON.parse(localStorage.getItem("clinic_test_name_overrides")||"{}"); }catch(e){ testNameOverrides={}; }
  try{ hiddenBuiltInTestIds = JSON.parse(localStorage.getItem("clinic_hidden_tests")||"[]"); }catch(e){ hiddenBuiltInTestIds=[]; }
  try{ testSettingsUpdatedAt = Number(localStorage.getItem("clinic_test_settings_updated_at"))||0; }catch(e){ testSettingsUpdatedAt=0; }
  try{ testItemUpdatedAt = JSON.parse(localStorage.getItem("clinic_test_item_updated_at")||"{}"); }catch(e){ testItemUpdatedAt={}; }
  // One-time backfill: devices that used the Tests feature before per-test-id timestamps
  // existed have real test data but no per-id time to merge it by, which would make it
  // always lose to another device's newer per-id edits even if it was set up first. Seed
  // every id this device currently has non-default data for with the old bundle time, so
  // it competes fairly from here on.
  if(Object.keys(testItemUpdatedAt).length===0 && testSettingsUpdatedAt>0){
    customTests.forEach(t=>{ testItemUpdatedAt[t.id]=testSettingsUpdatedAt; });
    hiddenBuiltInTestIds.forEach(id=>{ testItemUpdatedAt[id]=testSettingsUpdatedAt; });
    Object.keys(testNameOverrides).forEach(id=>{ testItemUpdatedAt[id]=testSettingsUpdatedAt; });
    Object.keys(testPrices).forEach(id=>{ testItemUpdatedAt[id]=testSettingsUpdatedAt; });
    try{ localStorage.setItem("clinic_test_item_updated_at", JSON.stringify(testItemUpdatedAt)); }catch(e){}
  }
  try{
    const savedCats = JSON.parse(localStorage.getItem("clinic_med_categories")||"null");
    if(Array.isArray(savedCats) && savedCats.length) MED_CATEGORIES = savedCats;
  }catch(e){}
  try{
    const savedSpecialCats = JSON.parse(localStorage.getItem("clinic_special_categories")||"null");
    if(Array.isArray(savedSpecialCats) && savedSpecialCats.length) SPECIAL_CATEGORIES = savedSpecialCats;
  }catch(e){}

  // Migrate an old single shared notepad (from before profiles existed) into its own profile,
  // so nobody's existing notes get lost.
  if(profiles.length===0){
    let legacy = null;
    try{ legacy = JSON.parse(localStorage.getItem("clinic_notes")||"null"); }catch(e){ legacy=null; }
    if(legacy && Array.isArray(legacy) && legacy.length){
      profiles = [{ id:"legacy", name:"Notes" }];
      localStorage.setItem("clinic_profiles", JSON.stringify(profiles));
      localStorage.setItem("clinic_notes_legacy", JSON.stringify(legacy));
    }
  }

/* ===================== BATCHES / EXPIRY (FEFO) ===================== */
/* Every restock creates its own "batch" with its own expiry date. When medicine is
   sold, pills are drawn from the batch with the nearest expiry date first (FEFO —
   first-expiry-first-out). m.stockPills is always kept as the sum of active batches. */
function activeBatches(m){ return (m.batches||[]).filter(b=>!b.disposed && b.pillsRemaining>0); }
function recomputeStock(m){ m.stockPills = activeBatches(m).reduce((s,b)=>s+b.pillsRemaining,0); }function fefoOrder(m){
  return activeBatches(m).slice().sort((a,b)=>{
    const ea = a.expiryDate ? new Date(a.expiryDate).getTime() : Infinity;
    const eb = b.expiryDate ? new Date(b.expiryDate).getTime() : Infinity;
    if(ea!==eb) return ea-eb;
    return (a.addedAt||0)-(b.addedAt||0);
  });
}
/* ---- Batch-level pricing (MRP can change per restock, FEFO-style) ----
   Each batch may carry its own mrpPerBox (set at restock time). If a batch has no
   mrpPerBox recorded (left blank at restock, or an old batch from before this existed),
   it falls back to the medicine's current mrpPerBox — i.e. "use the older/current price". */
function batchPricePerPill(m, b){
  const mrp = (b && b.mrpPerBox!=null && b.mrpPerBox>0) ? b.mrpPerBox : m.mrpPerBox;
  return (Number(mrp)||0) / (Number(m.pillsPerBox)||1);
}
function nextBatchUnitPrice(m){
  // The price that will actually be charged for the next pill sold, following the same
  // FEFO order stock is drawn from — so billing price always matches the batch being dispensed.
  const order = fefoOrder(m);
  if(order.length) return batchPricePerPill(m, order[0]);
  return (Number(m.mrpPerBox)||0) / (Number(m.pillsPerBox)||1);
}
function deductStock(m, pills){
  let remaining = pills;
  for(const b of fefoOrder(m)){
    if(remaining<=0) break;
    const take = Math.min(b.pillsRemaining, remaining);
    b.pillsRemaining -= take;
    remaining -= take;
    b.updatedAt = Date.now();
  }
  recomputeStock(m);
}
function returnStock(m, pills){
  // Used when an old bill is edited/undone — put pills back into the batch nearest
  // to expiry (the one most likely to have been sold from), or a fresh undated batch.
  const batches = fefoOrder(m);
  if(batches.length){ batches[0].pillsRemaining += pills; batches[0].updatedAt = Date.now(); }
  else {
    m.batches = m.batches||[];
    m.batches.push({ id:uid(), boxes:null, pillsRemaining:pills, originalPills:pills, expiryDate:null, addedAt:Date.now(), updatedAt:Date.now(), disposed:false });
  }
  recomputeStock(m);
}
function adjustStockTo(m, newTotal){
  // Used for manual stock correction in Edit (e.g. accounting for loss/damage).
  const current = activeBatches(m).reduce((s,b)=>s+b.pillsRemaining,0);
  const diff = newTotal - current;
  if(diff<0) deductStock(m, -diff);
  else if(diff>0){
    m.batches = m.batches||[];
    m.batches.push({ id:uid(), boxes:null, pillsRemaining:diff, originalPills:diff, expiryDate:null, addedAt:Date.now(), updatedAt:Date.now(), disposed:false });
    recomputeStock(m);
  }
}
function daysUntil(dateStr){
  if(!dateStr) return null;
  const today = new Date(); today.setHours(0,0,0,0);
  const exp = new Date(dateStr+"T00:00:00");
  return Math.round((exp-today)/86400000);
}
function expiringBatches(){
  const out = [];
  inventory.forEach(m=>{
    if(m.deleted) return;
    activeBatches(m).forEach(b=>{
      if(b.expiryDate){
        const d = daysUntil(b.expiryDate);
        if(d!==null && d<=10) out.push({ med:m, batch:b, daysLeft:d });
      }
    });
  });
  return out.sort((a,b)=>a.daysLeft-b.daysLeft);
}
function onBatchExpiryChange(medId, batchId, val){
  const m = inventory.find(x=>x.id===medId);
  if(m){ const b=(m.batches||[]).find(x=>x.id===batchId); if(b){ b.expiryDate = val || null; b.updatedAt = Date.now(); } }
  saveInventory();
  render();
}
function disposeBatch(medId, batchId){
  askConfirm("Mark this batch as disposed? It'll be removed from stock and cleared from expiry alerts.", ()=>{
    const m = inventory.find(x=>x.id===medId);
    if(m){
      const b = (m.batches||[]).find(x=>x.id===batchId);
      if(b){ b.disposed=true; b.pillsRemaining=0; b.updatedAt=Date.now(); recomputeStock(m); }
    }
    saveInventory();
    render();
  });
}
function batchExpiryLabel(daysLeft){
  if(daysLeft<0) return `Expired ${Math.abs(daysLeft)}d ago`;
  if(daysLeft===0) return "Expires today";
  return `${daysLeft}d left`;
}

/* Coalesces render() calls into once-per-frame. Several input handlers below
   call this instead of render() directly: calling render() synchronously on
   every keystroke destroys and recreates the focused <input> element (since
   render rebuilds innerHTML from scratch), which resets the DOM node's
   identity mid-keystroke. On mobile that interrupts the OS keyboard's native
   "hold backspace to repeat-delete" gesture, making a held backspace remove
   only one character instead of continuously deleting. Batching multiple
   rapid keystrokes (as happens during a held key) into a single render per
   animation frame keeps the input's identity stable long enough for that
   native repeat behavior to keep working, while still updating on-screen
   totals/dropdowns live as the person types. */
let renderScheduled = false;
function scheduleRender(){
  if(renderScheduled) return;
  renderScheduled = true;
  requestAnimationFrame(()=>{ renderScheduled = false; render(); });
}
/* ===================== RENDER (with focus preservation) ===================== */
function render(){
  const active = document.activeElement;
  const id = active && active.id;
  const selStart = active && typeof active.selectionStart==="number" ? active.selectionStart : null;
  const selEnd = active && typeof active.selectionEnd==="number" ? active.selectionEnd : null;

  renderBanner();
  renderNav();
  renderCloudSizeBadge();
  if(tab==="bill") renderBill();
  else if(tab==="inventory") renderInventory();
  else if(tab==="records") renderRecords();
  else if(tab==="stock") renderStock();
  else if(tab==="notes") renderNotes();
  renderShareModal();
  renderConfirmModal();
  renderInvFormModal();
  renderBackupModal();
  renderMonthBreakdownModal();
  renderCategoryModal();

  const fab = document.getElementById("invFab");
  if(fab){ fab.className = (tab==="inventory" && !inv.showForm) ? "" : "hidden"; }

  if(id){
    const el = document.getElementById(id);
    if(el){
      el.focus();
      if(selStart!=null && el.setSelectionRange){ try{ el.setSelectionRange(selStart, selEnd); }catch(e){} }
    }
  }
}

/* ===================== CONFIRM MODAL ===================== */
/* Some in-app browsers / WebViews silently block window.confirm() (it returns
   false with no dialog shown), which made delete buttons look broken.
   This custom modal replaces confirm() everywhere so it always works. */
let confirmState = null; // { message, onYes }
function askConfirm(message, onYes){ confirmState = { message, onYes }; renderConfirmModal(); }
function cancelConfirm(){ confirmState = null; renderConfirmModal(); }
function proceedConfirm(){
  const fn = confirmState && confirmState.onYes;
  confirmState = null;
  renderConfirmModal();
  if(fn) fn();
}
function renderConfirmModal(){
  const root = document.getElementById("confirmModalRoot");
  if(!root) return;
  if(!confirmState){ root.innerHTML=""; return; }
  root.innerHTML = `
    <div class="modal-overlay" onclick="if(event.target===this) cancelConfirm()">
      <div class="modal">
        <div class="modal-head"><strong>Please confirm</strong></div>
        <div class="modal-body">${esc(confirmState.message)}</div>
        <div class="modal-actions">
          <button class="btn btn-outline flex1" onclick="cancelConfirm()">Cancel</button>
          <button class="btn flex1" style="background:var(--danger);color:#fff;" onclick="proceedConfirm()">Delete</button>
        </div>
      </div>
    </div>`;
}

function billMedTotal(){ return bill.items.reduce((s,it)=>s+it.subtotal,0); }

function billTestsGross(){ return bill.tests.reduce((s,t)=>s+t.amount,0); }
function billTestsDiscount(){ return Math.min(Number(bill.testsDiscount)||0, billTestsGross()); }
function billTestsTotal(){ return billTestsGross() - billTestsDiscount(); }
function billFeeGross(){ return Number(bill.fee)||0; }
function billFeeDiscount(){ return Math.min(Number(bill.feeDiscount)||0, billFeeGross()); }
function billFeeNet(){ return billFeeGross() - billFeeDiscount(); }
function billFeeContribution(){ return bill.feeIncluded ? billFeeNet() : 0; }
function billGrandTotal(){ return billMedTotal() + billExtrasTotal() + billTestsTotal() + billFeeContribution(); }

function addSelectedBillTests(){

    : "Remove this test from your list? It will no longer be available to add to bills.", ()=>{

      saveHiddenBuiltInTests();

function saveAllTestPrices(){
  const builtIn = {}; TEST_CATALOG.forEach(t=>builtIn[t.id]=t.name);
  const touchedIds = [];
  allTests().forEach(t=>{
    const val = Number(testPriceDraft[t.id])||0;
    const prevPrice = testPrices[t.id];
    const newPrice = val>0 ? val : undefined;
    if(newPrice!==prevPrice){
      if(val>0) testPrices[t.id]=val; else delete testPrices[t.id];
      touchedIds.push(t.id);
    }
    const nameVal = (testNameDraft[t.id]||"").trim();
    if(!nameVal) return; // never allow a blank name to wipe a test's name
    const custom = customTests.find(ct=>ct.id===t.id);
    if(custom){
      if(custom.name!==nameVal){ custom.name = nameVal; touchedIds.push(t.id); }
    } else if(builtIn[t.id] !== undefined){
      const prevOverride = testNameOverrides[t.id];
      const newOverride = (nameVal !== builtIn[t.id]) ? nameVal : undefined;
      if(newOverride!==prevOverride){
        if(newOverride!=null) testNameOverrides[t.id] = newOverride; else delete testNameOverrides[t.id];
        touchedIds.push(t.id);
      }
    }
  });
  saveTestPrices();
  saveCustomTests();
  saveTestNameOverrides();
  // Only bump the ids that actually changed — so tests nobody touched in this edit keep
  // their existing (possibly newer) per-id time from wherever they were last really edited.
  new Set(touchedIds).forEach(id=>touchTestItem(id));
  testPriceEditorOpen = false;
  render();
  showToast("✓ Tests saved");
}

function billComputedPills(){
  if(bill.qtyMode==="dose"){
    const perDay = Number(bill.perDay);
    if(!perDay || perDay<=0) return 0;
    const days = bill.daysMode==="same" ? (Number(bill.globalDays)||0) : Number(bill.days);
    if(!days || days<=0) return 0;
    return perDay*days;
  }
  return Number(bill.pills) || 0;
}
function canAddBillItem(){
  if(!bill.selectedMedId) return false;
  if(bill.qtyMode==="total") return Number(bill.pills)>0;
  const perDay = Number(bill.perDay);
  if(!perDay || perDay<=0) return false;
  if(bill.daysMode==="same") return true; // days can be set later, applies to whole list
  const days = Number(bill.days);
  return !!(days && days>0);
}

function addBillItem(){
  const med = inventory.find(m=>m.id===bill.selectedMedId);
  if(!med || !canAddBillItem()) return;
  const pricePerPill = nextBatchUnitPrice(med);
  if(bill.qtyMode==="total"){
    const pills = Number(bill.pills)||0;
    bill.items.push({medId:med.id, name:med.name, pills, pricePerPill, subtotal:pricePerPill*pills, note:"", perDay:null, linkedToGlobalDays:false});
  } else if(bill.daysMode==="same"){
    const perDay = Number(bill.perDay)||0;
    const days = Number(bill.globalDays)||0;
    const pills = perDay*days;
    const note = days>0 ? `${perDay}/day × ${days}d` : `${perDay}/day × (set days below)`;
    bill.items.push({medId:med.id, name:med.name, pills, pricePerPill, subtotal:pricePerPill*pills, note, perDay, linkedToGlobalDays:true});
  } else {
    const perDay = Number(bill.perDay)||0;
    const days = Number(bill.days)||0;
    const pills = perDay*days;
    const note = `${perDay}/day × ${days}d`;
    bill.items.push({medId:med.id, name:med.name, pills, pricePerPill, subtotal:pricePerPill*pills, note, perDay, linkedToGlobalDays:false});

}

  bill.applyingFeeMode = mode;

  render();

function onWholeApplyingFee(v){ bill.wholeApplyingFee=v; recomputeWholeApplyingFee(); scheduleRender(); }
// The single whole-bill applying fee always lives on whichever special item was added most
// recently — never as its own line. Re-run this after any add/remove of a special item, or
// whenever the whole-bill fee amount itself changes, so it always tracks the current "last"
// special item instead of staying stuck on one that may have since been removed.
function recomputeWholeApplyingFee(){
  const specials = bill.items.filter(it=>it.special);
  specials.forEach(it=>{
    if(it.feeMode==='whole'){
      it.appliedFee = 0;
      it.subtotal = it.baseSubtotal;
      it.note = it.baseNote||"";
      it.feeMode = null;
    }
  });
  if(bill.applyingFeeMode==='whole' && specials.length){
    const fee = Number(bill.wholeApplyingFee)||0;
    const last = specials[specials.length-1];
    last.feeMode = 'whole';
    last.appliedFee = fee;
    last.subtotal = last.baseSubtotal + fee;
    last.note = fee>0 ? `${last.baseNote?last.baseNote+" · ":""}+applying fee ${CURRENCY}${money(fee)}` : (last.baseNote||"");
  }
}
function addSpecialBillItem(){
  const med = inventory.find(m=>m.id===bill.selectedSpecialMedId);
  if(!med || !canAddSpecialBillItem()) return;
  const pills = billComputedSpecialPills();
  const pricePerPill = nextBatchUnitPrice(med);
  const baseSubtotal = pricePerPill*pills;
  const item = { medId:med.id, name:med.name, pills, pricePerPill, subtotal:baseSubtotal, note:"", perDay:null, linkedToGlobalDays:false,
    special:true, specialCategory:med.specialCategory||"", baseSubtotal, baseNote:"", appliedFee:0, feeMode:null };
  if(bill.applyingFeeMode==='perItem'){
    const fee = Number(bill.applyingFeeDraft)||0;
    item.feeMode = 'perItem';
    item.appliedFee = fee;
    item.subtotal = baseSubtotal + fee;
    item.note = fee>0 ? `+applying fee ${CURRENCY}${money(fee)}` : "";
  }
  bill.items.push(item);
  bill.selectedSpecialMedId=null; bill.specialQuery=""; bill.specialPills=""; bill.applyingFeeDraft="";
  if(bill.applyingFeeMode==='whole') recomputeWholeApplyingFee();
  render();
}

function buildBillText(tx){
  const lines = [`🏥 Patient Bill`, `Patient: ${tx.patientName}`, `Date: ${fmtDateTime(tx.timestamp)}`, ``];
  if(tx.items.length){
    lines.push(`Medicines:`);
    tx.items.forEach((it,i)=> lines.push(`${i+1}. ${it.name} — ${it.pills} medicine${it.note?` (${it.note})`:""} — ${CURRENCY}${money(it.subtotal)}`));
    lines.push(``);
  }
  if(tx.tests && tx.tests.length){
    lines.push(`Tests:`);
    tx.tests.forEach((t,i)=> lines.push(`${i+1}. ${t.name} — ${CURRENCY}${money(t.amount)}`));
    if(tx.testsDiscount) lines.push(`Tests discount: -${CURRENCY}${money(tx.testsDiscount)}`);
    lines.push(``);
  }
  if(tx.extras && tx.extras.length){
    lines.push(`Other charges:`);
    tx.extras.forEach((ex,i)=> lines.push(`${i+1}. Other charge — ${CURRENCY}${money(ex.amount)}`));
    lines.push(``);
  }
  lines.push(`Medicine total: ${CURRENCY}${money(tx.medTotal)}`);
  if(tx.tests && tx.tests.length) lines.push(`Tests total: ${CURRENCY}${money((tx.testsTotal||0)-(tx.testsDiscount||0))}`);
  lines.push(`Doctor fee: ${CURRENCY}${money((tx.doctorFee||0)-(tx.feeDiscount||0))}`);
  if(tx.feeDiscount) lines.push(`Doctor fee discount: -${CURRENCY}${money(tx.feeDiscount)}`);
  lines.push(`--------------------------`);
  lines.push(`Grand total: ${CURRENCY}${money(tx.grandTotal)}`);
  return lines.join("\n");
}

          <label class="field-label" style="margin-bottom:4px;">Doctor visit fee (${CURRENCY.trim()})</label>

          ${bill.applyingFeeMode==='whole' ? `
            <div class="mt2">
              <label class="field-label">Applying fee for the whole bill (${CURRENCY.trim()})</label>
              <input ${NOAC} id="billWholeApplyingFeeInput" type="text" inputmode="decimal" value="${esc(bill.wholeApplyingFee)}" oninput="onWholeApplyingFee(this.value)" placeholder="0">

          <div class="mt2">
            <label class="field-label">Medicine / units to give</label>
            <input ${NOAC} id="billSpecialPillsInput" type="text" inputmode="numeric" value="${esc(bill.specialPills)}" oninput="onBillSpecialPills(this.value)" placeholder="e.g. 1">
          </div>
          ${bill.applyingFeeMode==='perItem' ? `
            <div class="mt2">
              <label class="field-label">Applying fee for this medicine (${CURRENCY.trim()}, optional)</label>
              <input ${NOAC} id="billApplyingFeeDraftInput" type="text" inputmode="decimal" value="${esc(bill.applyingFeeDraft)}" oninput="onApplyingFeeDraft(this.value)" placeholder="0">
            </div>
          ` : ""}
          ${billComputedSpecialPills()>0 ? `<p class="small mt2" style="margin-bottom:0;">${CURRENCY}${money(nextBatchUnitPrice(selSpecialMed))} / medicine → subtotal ${CURRENCY}${money(nextBatchUnitPrice(selSpecialMed)*billComputedSpecialPills())}</p>` : ""}
          <button class="btn btn-primary mt2" style="width:100%;" ${!canAddSpecialBillItem()?"disabled":""} onclick="addSpecialBillItem()">+ Add special medicine</button>
        ` : ""}
      </div>

      ${selMed ? `
        <div class="flex gap2 mt3">
          <button class="btn ${bill.qtyMode==='total'?'btn-primary':'btn-outline'}" style="flex:1;padding:8px;font-size:12px;" onclick="setBillQtyMode('total')">Total medicine</button>
          <button class="btn ${bill.qtyMode==='dose'?'btn-primary':'btn-outline'}" style="flex:1;padding:8px;font-size:12px;" onclick="setBillQtyMode('dose')">Per day × days</button>
        </div>
        ${bill.qtyMode==='total' ? `
          <div class="flex gap2 mt2" style="align-items:flex-end;">
            <div class="flex1">
              <label class="field-label">Medicine / tablets to give</label>
              <input ${NOAC} id="billPillsInput" type="text" inputmode="numeric" value="${esc(bill.pills)}" oninput="onBillPills(this.value)" placeholder="e.g. 10">
            </div>
            <button class="btn btn-primary" ${!billComputedPills()?"disabled":""} onclick="addBillItem()">+ Add</button>
          </div>

            <button class="btn ${bill.daysMode==='same'?'btn-primary':'btn-outline'}" style="flex:1;padding:6px;font-size:11px;" onclick="setBillDaysMode('same')">Same days for whole bill</button>
          </div>
          <div class="flex gap2 mt2" style="align-items:flex-end;">
            <div class="flex1">
              <label class="field-label">Medicine per day</label>
              <input ${NOAC} id="billPerDayInput" type="text" inputmode="numeric" value="${esc(bill.perDay)}" oninput="onBillPerDay(this.value)" placeholder="e.g. 2">
            </div>
            ${bill.daysMode==='perMed' ? `
              <div class="flex1">
                <label class="field-label">Number of days</label>
                <input ${NOAC} id="billDaysInput" type="text" inputmode="numeric" value="${esc(bill.days)}" oninput="onBillDays(this.value)" placeholder="e.g. 5">
              </div>
            ` : ""}
            <button class="btn btn-primary" ${!canAddBillItem()?"disabled":""} onclick="addBillItem()">+ Add</button>
          </div>
          ${bill.daysMode==='same' && !Number(bill.globalDays) ? `<p class="small mt2">Days not set yet — you can add medicines now and set the days once, any time. Medicine/price fill in for all of them as soon as you do.</p>` : ""}
          ${billComputedPills()>0 ? `<p class="small mt2">= ${billComputedPills()} medicine total</p>` : ""}
        `}
        ${billComputedPills()>0 ? `<p class="small mt2">${CURRENCY}${money(nextBatchUnitPrice(selMed))} / medicine → subtotal ${CURRENCY}${money(nextBatchUnitPrice(selMed)*billComputedPills())}</p>` : ""}
      ` : ""}
    </div>

    ${itemsHtml}

    ${bill.items.some(it=>it.linkedToGlobalDays) ? `
      <div class="card" style="border:1px solid var(--primarySoft);">
        <p class="small" style="margin-bottom:6px;">${bill.items.some(it=>it.linkedToGlobalDays && it.pills<=0) ? "Set the days for this bill to fill in medicine &amp; price for the medicines waiting on it." : "Days for this bill — change it anytime and every linked medicine recalculates."}</p>
        <label class="field-label">Days (applies to every linked medicine)</label>
        <input ${NOAC} id="billGlobalDaysInput2" type="text" inputmode="numeric" value="${esc(bill.globalDays)}" oninput="onGlobalDays(this.value)" placeholder="e.g. 5">
      </div>
    ` : ""}

    ${testsHtml}

    <div class="card">
      <h3 class="mb2" style="font-size:14px;font-weight:700;">Others (dressing, transport, etc.)</h3>
      <div class="flex gap2" style="align-items:flex-end;">
        <div class="flex1">
          <label class="field-label">Amount</label>
          <input ${NOAC} id="billExtraAmountInput" type="text" inputmode="decimal" value="${esc(bill.extraAmount)}" oninput="onExtraAmount(this.value)" placeholder="0">
        </div>
        <button class="btn btn-primary" ${!(Number(bill.extraAmount)>0)?"disabled":""} onclick="addExtraItem()">+ Add</button>
      </div>
      ${bill.extras.length ? bill.extras.map((ex,idx)=>`
        <div class="item-row">
          <div style="font-size:14px;font-weight:600;">Other charge ${idx+1}</div>
          <div class="flex gap2" style="align-items:center;">
            <span style="font-weight:700;font-size:14px;">${CURRENCY}${money(ex.amount)}</span>
            <button onclick="removeExtraItem(${idx})" class="icon-del-btn">🗑</button>
          </div>
        </div>`).join("") : ""}
    </div>

    <div class="card primary">
      <div class="row"><span class="lab">Medicine total</span><span class="val">${CURRENCY}${money(billMedTotal()+pendingBillSubtotal()+pendingSpecialBillSubtotal())}</span></div>
      ${billExtrasTotal()>0?`<div class="row mt2"><span class="lab">Others</span><span class="val">${CURRENCY}${money(billExtrasTotal())}</span></div>`:""}
      ${bill.tests.length?`<div class="row mt2"><span class="lab">Tests</span><span class="val">${CURRENCY}${money(billTestsGross())}</span></div>`:""}
      ${billTestsDiscount()>0?`<div class="row mt2"><span class="lab">Tests discount</span><span class="val">-${CURRENCY}${money(billTestsDiscount())}</span></div>`:""}
      <div class="row mt2"><span class="lab">Doctor fee</span><span class="val">${CURRENCY}${money(bill.feeIncluded?billFeeGross():0)}</span></div>
      ${bill.feeIncluded && billFeeDiscount()>0?`<div class="row mt2"><span class="lab">Doctor fee discount</span><span class="val">-${CURRENCY}${money(billFeeDiscount())}</span></div>`:""}
      <div class="mt2" style="border-top:1px solid rgba(255,255,255,.25);padding-top:8px;">
        <div class="row big"><span class="lab">Grand total</span><span class="val">${CURRENCY}${money(billGrandTotal()+pendingBillSubtotal()+pendingSpecialBillSubtotal())}</span></div>
      </div>
      ${pendingBillSubtotal()>0?`<p class="small mt2" style="color:var(--headerSub);">Includes ${esc(selMed?selMed.name:"")} — not added yet, tap + Add below</p>`:""}
      ${pendingSpecialBillSubtotal()>0?`<p class="small mt2" style="color:var(--headerSub);">Includes ${esc(selSpecialMed?selSpecialMed.name:"")} — not added yet, tap + Add special medicine below</p>`:""}
    </div>

    <button class="btn btn-success" style="width:100%;padding:14px;font-size:15px;" ${!canCompleteBill()?"disabled":""} onclick="completeBill()">
      Complete bill &amp; get receipt
    </button>
  `;
}

/* ===================== INVENTORY TAB ===================== */
function onInvQuery(v){ inv.query=v; scheduleRender(); }
function searchInvByFormula(formula){
  inv.query = formula || "";
  render();
  const el = document.getElementById("invQueryInput");
  if(el){ el.focus(); }
}
function searchBillByFormula(formula){
  bill.query = formula || "";
  bill.selectedMedId = null;
  render();
  const el = document.getElementById("billQueryInput");
  if(el){ el.focus(); }
}
function onInvForm(field,v){ inv.form[field]=v; }
// The merged picker is one <select> covering both lists (see mergedCategoryOptionsHtml), so
// picking a value has to decide which of the two underlying fields it belongs to — a medicine
// can only be in ONE of the two right now, so the other is always cleared alongside it.
function onInvCategoryPicked(v){
  if(SPECIAL_CATEGORIES.includes(v)){ inv.form.category=""; inv.form.specialCategory=v; }
  else { inv.form.category=v; inv.form.specialCategory=""; }
}
function toggleInvForm(){ inv.showForm=!inv.showForm; if(inv.showForm){ inv.form={name:"",category:"",specialCategory:"",formula:"",mg:"",mrp:"",pillsPerBox:"",lowStockAt:"10"}; } render(); }
function addMedicine(){
  const f = inv.form;
  if(!f.name.trim()||!f.mrp||!f.pillsPerBox) return;
  inventory.push({ id:uid(), name:f.name.trim(), category:f.category||"", specialCategory:f.specialCategory||"", formula:f.formula.trim(), mg:f.mg.trim(),
    mrpPerBox:Number(f.mrp), pillsPerBox:Number(f.pillsPerBox), stockPills:0, lowStockAt:Number(f.lowStockAt)||0, batches:[],
    updatedAt:Date.now(), deleted:false });
  saveInventory();
  inv.showForm=false;
  render();
}
function deleteMedicine(id){
  askConfirm("Delete this medicine from inventory?", ()=>{
    // Soft-delete (keep the record, flag it) rather than removing it outright: this lets the
    // deletion itself sync to other devices via updatedAt like any other edit. Removing it
    // outright would just cause it to reappear once another device's data came back in.
    const m = inventory.find(x=>x.id===id);
    if(m){ m.deleted = true; m.updatedAt = Date.now(); }
    saveInventory(); render();
  });
}
function toggleRestock(id){ inv.editId=null; inv.restockId = inv.restockId===id?null:id; inv.restockBoxes=""; inv.restockExpiry=""; inv.restockMrp=""; render(); }
function onRestockBoxes(v){ inv.restockBoxes=v; }
function onRestockExpiry(v){ inv.restockExpiry=v; }
function onRestockMrp(v){ inv.restockMrp=v; }
function doRestock(id){
  const boxes = Number(inv.restockBoxes);
  if(!boxes||boxes<=0) return;
  const m = inventory.find(x=>x.id===id);
  if(m){
    const mrpVal = (inv.restockMrp!=="" && Number(inv.restockMrp)>0) ? Number(inv.restockMrp) : null;
    m.batches = m.batches||[];
    m.batches.push({ id:uid(), boxes, pillsRemaining: boxes*m.pillsPerBox, mrpPerBox: mrpVal, expiryDate: inv.restockExpiry||null, addedAt:Date.now(), updatedAt:Date.now(), disposed:false });
    if(mrpVal!=null){ m.mrpPerBox = mrpVal; m.updatedAt = Date.now(); } // new MRP becomes the current default going forward
    recomputeStock(m);
  }
  saveInventory();
  inv.restockId=null; inv.restockBoxes=""; inv.restockExpiry=""; inv.restockMrp="";
  render();
}
function openEdit(id){
  inv.restockId=null;
  inv.editId = inv.editId===id?null:id;
  const m = inventory.find(x=>x.id===id);
  if(m){ inv.editForm = { name:m.name, category:m.category||"", specialCategory:m.specialCategory||"", formula:m.formula||"", mg:m.mg||"", mrp:String(m.mrpPerBox),
    pillsPerBox:String(m.pillsPerBox), lowStockAt:String(m.lowStockAt??0), stockPills:String(m.stockPills), noWarn:!!m.noWarn }; }
  render();
}
function onEditForm(field,v){ inv.editForm[field]=v; }
function onEditCategoryPicked(v){
  if(SPECIAL_CATEGORIES.includes(v)){ inv.editForm.category=""; inv.editForm.specialCategory=v; }
  else { inv.editForm.category=v; inv.editForm.specialCategory=""; }
}
function saveEdit(id){
  const f = inv.editForm;
  if(!f.name.trim()||!f.mrp||!f.pillsPerBox||f.stockPills==="") return;
  const m = inventory.find(x=>x.id===id);
  if(m){
    m.name=f.name.trim(); m.category=f.category||""; m.specialCategory=f.specialCategory||""; m.formula=f.formula.trim(); m.mg=f.mg.trim();
    m.mrpPerBox=Number(f.mrp); m.pillsPerBox=Number(f.pillsPerBox);
    m.lowStockAt=Number(f.lowStockAt)||0;
    m.updatedAt=Date.now();
    adjustStockTo(m, Math.max(0,Number(f.stockPills)));
  }
  saveInventory();
  inv.editId=null;
  render();
}

function renderInventory(){
  const q = inv.query.toLowerCase();
  const filtered = inventory.filter(m=>!m.deleted && (m.name.toLowerCase().includes(q)||(m.formula||"").toLowerCase().includes(q)));

  const cards = filtered.map(m=>{
    const pricePerPill = nextBatchUnitPrice(m);
    const low = !m.noWarn && m.stockPills <= (m.lowStockAt??0);
    let extra = "";
    if(inv.restockId===m.id){
      extra = `
        <div class="mt2 divider-top8">
          <div class="flex gap2" style="align-items:flex-end;">
            <div class="flex1">
              <label class="small">Boxes/strips received</label>
              <input ${NOAC} id="restockInput-${m.id}" type="text" inputmode="numeric" value="${esc(inv.restockBoxes)}" oninput="onRestockBoxes(this.value)" placeholder="e.g. 5">
            </div>
            <button class="btn btn-primary" onclick="doRestock('${m.id}')">Add</button>
          </div>
          <label class="small mt2" style="display:block;">Expiry date for this batch (optional)</label>
          <input id="restockExpiry-${m.id}" type="date" value="${esc(inv.restockExpiry)}" oninput="onRestockExpiry(this.value)">
          <label class="small mt2" style="display:block;">New MRP per box for this batch (optional — leave blank to keep using ${CURRENCY}${money(m.mrpPerBox)})</label>
          <input ${NOAC} id="restockMrp-${m.id}" type="text" inputmode="decimal" value="${esc(inv.restockMrp)}" oninput="onRestockMrp(this.value)" placeholder="e.g. ${m.mrpPerBox}">
        </div>`;
    }
    if(inv.editId===m.id){
      const f = inv.editForm;
      extra = `
        <div class="mt2 divider-top8">
          <div class="flex gap2 mb2">
            <input ${NOAC} id="editName-${m.id}" value="${esc(f.name)}" oninput="onEditForm('name',this.value)" placeholder="Medicine name" class="flex1">
            <div class="cat-picker" style="flex:0 0 165px;">
              <select id="editCategory-${m.id}" onchange="onEditCategoryPicked(this.value)">
                <option value="" ${!f.category && !f.specialCategory?"selected":""}>Category</option>
                ${mergedCategoryOptionsHtml(f.specialCategory||f.category)}
              </select>
              <button type="button" title="Add, rename, or delete categories" onclick="openCategoryEditor()">Edit</button>
            </div>
          </div>
          <div class="flex gap2 mb2">
            <input ${NOAC} id="editFormula-${m.id}" value="${esc(f.formula)}" oninput="onEditForm('formula',this.value)" placeholder="Formula / composition">
            <input ${NOAC} id="editMg-${m.id}" value="${esc(f.mg)}" oninput="onEditForm('mg',this.value)" placeholder="Strength (mg)">
          </div>
          <div class="flex gap2 mb2">
            <input ${NOAC} id="editMrp-${m.id}" type="text" inputmode="decimal" value="${esc(f.mrp)}" oninput="onEditForm('mrp',this.value)" placeholder="MRP per box">
            <input ${NOAC} id="editPpb-${m.id}" type="text" inputmode="numeric" value="${esc(f.pillsPerBox)}" oninput="onEditForm('pillsPerBox',this.value)" placeholder="Medicine per box">
          </div>
          <label class="small" style="color:var(--danger);">Current stock (medicine) — correct for expired, damaged, or missing medicine</label>
          <input ${NOAC} id="editStock-${m.id}" type="text" inputmode="numeric" value="${esc(f.stockPills)}" oninput="onEditForm('stockPills',this.value)" style="border-color:var(--danger);" class="mb2">
          <label class="small">Warn me when stock falls to (medicine)</label>
          <input ${NOAC} id="editLow-${m.id}" type="text" inputmode="numeric" value="${esc(f.lowStockAt)}" oninput="onEditForm('lowStockAt',this.value)" class="mb2">
          <div class="flex gap2 mt2">
            <button class="btn btn-outline flex1" onclick="openEdit('${m.id}')">Cancel</button>
            <button class="btn btn-primary flex1" onclick="saveEdit('${m.id}')">Save changes</button>
          </div>
        </div>`;
    }
    return `
      <div class="card">
        <div class="flex" style="justify-content:space-between;align-items:flex-start;">
          <div>
            <p class="item-title">${esc(m.name)}${m.category?` <span class="pill-badge" style="background:var(--primarySoft);color:var(--primary);font-size:10px;vertical-align:middle;">${esc(m.category)}</span>`:""}${m.specialCategory?` <span class="pill-badge" style="background:var(--warningSoft);color:var(--warning);font-size:10px;vertical-align:middle;">${esc(m.specialCategory)}</span>`:""}</p>
            ${(m.formula||m.mg)?`<p class="small" style="color:var(--primary);margin:2px 0 0;">${esc(m.formula)}${m.formula&&m.mg?' · ':''}${esc(m.mg)}</p>`:""}
            <p class="small faint" style="margin:2px 0 0;">${CURRENCY}${money(m.mrpPerBox)} / box · ${m.pillsPerBox} medicine · ${CURRENCY}${money(pricePerPill)}/medicine</p>
            <p class="small faint" style="margin:2px 0 0;">Warns at ${m.lowStockAt ?? 0} medicine${m.noWarn?" (warnings off)":""}</p>

function visibleTransactions(){ return transactions.filter(t=>!t.deleted); }
function dayOptions(){
  const map = new Map();
  map.set(new Date().toDateString(), Date.now());
  const curMK = monthKeyOf(Date.now());
  visibleTransactions().forEach(t=>{
    if(monthKeyOf(t.timestamp)!==curMK) return; // older months are shown in the month/year folders below instead
    const k=new Date(t.timestamp).toDateString(); if(!map.has(k)) map.set(k,t.timestamp);
  });
  return Array.from(map.entries()).sort((a,b)=>b[1]-a[1]).map(([key,ts])=>({
    key, label: sameDay(ts,Date.now())?"Today":new Date(ts).toLocaleDateString(undefined,{day:"2-digit",month:"short",year:"numeric"})
  }));
}
function currentMonthTx(){ const curMK = monthKeyOf(Date.now()); return visibleTransactions().filter(t=>monthKeyOf(t.timestamp)===curMK); }
/* Manual correction: a number added on top of what's calculated from bills for a given
   month, kept separate from any single bill so it can never distort stock or a patient's
   record. Positive adds, negative subtracts. Defaults to 0 (no correction). */
function getMonthAdjustment(mk){
  const a = monthAdjustments[mk];
  return { doctorFee:(a&&a.doctorFee)||0, medTotal:(a&&a.medTotal)||0, testsTotal:(a&&a.testsTotal)||0, othersTotal:(a&&a.othersTotal)||0, updatedAt:(a&&a.updatedAt)||0 };
}
function monthAdjustedTotals(mk, tx){
  const computed = {
    medTotal: tx.reduce((s,t)=>s+(t.medTotal||0),0),
    feeTotal: tx.reduce((s,t)=>s+(t.doctorFee||0),0),
    testsTotal: tx.reduce((s,t)=>s+((t.testsTotal||0)-(t.testsDiscount||0)),0),
    extrasTotal: tx.reduce((s,t)=>s+(t.extrasTotal||0),0)
  };
  const adj = getMonthAdjustment(mk);
  const medTotal = computed.medTotal + adj.medTotal;
  const feeTotal = computed.feeTotal + adj.doctorFee;
  const testsTotal = computed.testsTotal + adj.testsTotal;
  const extrasTotal = computed.extrasTotal + adj.othersTotal;
  return { medTotal, feeTotal, testsTotal, extrasTotal, grandTotal: medTotal+feeTotal+testsTotal+extrasTotal, adj };
}
/* Same medicine/fee/tests/others split as monthAdjustedTotals(), but for a single day's
   transactions and with no manual correction applied — corrections are month-level only. */
function dayTotals(tx){
  const medTotal = tx.reduce((s,t)=>s+(t.medTotal||0),0);
  const feeTotal = tx.reduce((s,t)=>s+(t.doctorFee||0),0);
  const testsTotal = tx.reduce((s,t)=>s+((t.testsTotal||0)-(t.testsDiscount||0)),0);
  const extrasTotal = tx.reduce((s,t)=>s+(t.extrasTotal||0),0);
  return { medTotal, feeTotal, testsTotal, extrasTotal, grandTotal: medTotal+feeTotal+testsTotal+extrasTotal };
}

function renderRecordArchive(){
  const curMK = monthKeyOf(Date.now());
  const curYear = new Date().getFullYear();
  const others = visibleTransactions().filter(t=>monthKeyOf(t.timestamp)!==curMK);
  if(!others.length) return "";

  const byMonth = new Map();
  others.forEach(t=>{
    const mk = monthKeyOf(t.timestamp);
    if(!byMonth.has(mk)) byMonth.set(mk, { year:new Date(t.timestamp).getFullYear(), label:monthLabelOf(t.timestamp), tx:[] });
    byMonth.get(mk).tx.push(t);
  });
  const monthEntries = Array.from(byMonth.entries()).sort((a,b)=>b[0].localeCompare(a[0]));

  function monthFolder(mk, g){
    const open = rec.expandedMonth===mk;
    const total = g.tx.reduce((s,t)=>s+t.grandTotal,0);
    const sorted = g.tx.slice().sort((a,b)=>b.timestamp-a.timestamp);
    return `
      <div class="card" style="padding:0;overflow:hidden;">
        <button onclick="toggleMonthFolder('${mk}')" style="width:100%;background:none;border:none;padding:14px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;">
          <div style="text-align:left;">
            <p class="item-title">📅 ${esc(g.label)}</p>

            <span style="font-weight:700;font-size:14px;">${CURRENCY}${money(total)}</span>
            <span class="faint">${open?"▲":"▼"}</span>
          </div>
        </button>
        ${open?`<div style="padding:0 14px 14px;">${sorted.map(renderTxCard).join("")}</div>`:""}
      </div>`;
  }

  const curYearMonths = monthEntries.filter(([mk,g])=>g.year===curYear);
  const pastYearsMap = new Map();
  monthEntries.filter(([mk,g])=>g.year!==curYear).forEach(([mk,g])=>{
    if(!pastYearsMap.has(g.year)) pastYearsMap.set(g.year, []);
    pastYearsMap.get(g.year).push([mk,g]);
  });
  const pastYears = Array.from(pastYearsMap.entries()).sort((a,b)=>b[0]-a[0]);

  const curYearHtml = curYearMonths.map(([mk,g])=>monthFolder(mk,g)).join("");

  const pastYearsHtml = pastYears.map(([year,months])=>{
    const openY = rec.expandedYear===String(year);
    const yTotal = months.reduce((s,[mk,g])=>s+g.tx.reduce((s2,t)=>s2+t.grandTotal,0),0);
    const yCount = months.reduce((s,[mk,g])=>s+g.tx.length,0);
    return `
      <div class="card" style="padding:0;overflow:hidden;">
        <button onclick="toggleYearFolder('${year}')" style="width:100%;background:none;border:none;padding:14px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;">
          <div style="text-align:left;">

            <span style="font-weight:700;font-size:14px;">${CURRENCY}${money(yTotal)}</span>
            <span class="faint">${openY?"▲":"▼"}</span>
          </div>
        </button>
        ${openY?`<div style="padding:0 14px 14px;">${months.map(([mk,g])=>monthFolder(mk,g)).join("")}</div>`:""}
      </div>`;
  }).join("");

  return `
    <p class="small faint" style="font-weight:700;margin:18px 0 8px;">Earlier records</p>
    ${curYearHtml}
    ${pastYearsHtml}
  `;
}

function addEditTxItem(){
  const med = inventory.find(m=>m.id===recEdit.selectedMedId);
  const pills = Number(recEdit.pills);
  if(!med || !pills || pills<=0) return;
  const pricePerPill = nextBatchUnitPrice(med);
  recEdit.items.push({medId:med.id, name:med.name, pills, pricePerPill, subtotal:pricePerPill*pills});
  recEdit.selectedMedId=null; recEdit.query=""; recEdit.pills="";

function editTxGrandTotal(){ return editTxMedTotal() + (Number(recEdit.fee)||0) - (recEdit.feeDiscount||0) + (recEdit.extrasTotal||0) + (recEdit.testsTotal||0) - (recEdit.testsDiscount||0); }
function saveEditTx(){
  const t = transactions.find(x=>x.id===recEdit.txId);
  if(!t || !recEdit.patient.trim()) return;
  // give back stock for the old items, then deduct stock for the new items
  t.items.forEach(oldIt=>{
    const med = inventory.find(m=>m.id===oldIt.medId);
    if(med) returnStock(med, oldIt.pills);
  });
  recEdit.items.forEach(newIt=>{
    const med = inventory.find(m=>m.id===newIt.medId);
    if(med) deductStock(med, newIt.pills);
  });
  saveInventory();
  t.patientName = recEdit.patient.trim();
  t.doctorFee = Number(recEdit.fee)||0;
  t.items = recEdit.items;
  t.medTotal = editTxMedTotal();
  t.extras = recEdit.extras||[];
  t.extrasTotal = recEdit.extrasTotal||0;
  t.tests = recEdit.tests||[];
  t.testsTotal = recEdit.testsTotal||0;
  t.testsDiscount = recEdit.testsDiscount||0;
  t.feeDiscount = recEdit.feeDiscount||0;
  t.grandTotal = editTxGrandTotal();
  t.updatedAt = Date.now();
  saveTransactions();
  rec.editingId = null;
  render();
  showToast("✓ Bill updated");
}

function renderRecords(){
  if(visibleTransactions().length===0){
    document.getElementById("main").innerHTML = `<p class="small faint" style="text-align:center;padding:40px 0;">No bills recorded yet.</p>`;
    return;
  }

  const searchBar = `
    <div class="search-wrap mb2">
      <span class="search-icon">🔍</span>
      <input ${NOAC} id="recordsSearchInput" value="${esc(rec.searchQuery)}" oninput="onRecordsSearch(this.value)" placeholder="Search by patient name or date…">
    </div>`;

  const q = rec.searchQuery.trim().toLowerCase();
  if(q){
    const matched = visibleTransactions().filter(t=>txMatchesQuery(t,q)).sort((a,b)=>b.timestamp-a.timestamp);
    document.getElementById("main").innerHTML = searchBar +
      (matched.length===0
        ? `<p class="small faint" style="text-align:center;padding:32px 0;">No bills match "${esc(rec.searchQuery)}".</p>`
        : `<p class="small faint mb2">${matched.length} result${matched.length===1?"":"s"}</p>` + matched.map(renderTxCard).join(""));
    return;
  }

  const opts = dayOptions();

  const mTx = currentMonthTx();
  const mTotal = monthAdjustedTotals(monthKeyOf(Date.now()), mTx).grandTotal;
  const monthStat = `
    <button onclick="toggleMonthBreakdown()" class="card" style="background:var(--primarySoft);border:none;width:100%;text-align:left;cursor:pointer;padding:14px;">
      <div class="row">
        <span class="small" style="font-weight:700;color:var(--primary);">Total sales this month</span>
        <span style="font-weight:700;font-size:16px;color:var(--primary);">${CURRENCY}${money(mTotal)}</span>
      </div>
      <p class="small faint" style="margin:2px 0 0;">${mTx.length} bill${mTx.length===1?"":"s"} this month · tap for breakdown</p>
    </button>`;

  // Every day in the current month that has bills (plus today, even if empty) is shown
  // stacked here in one continuous list — most recent first — instead of behind a picker,
  // so previous days' records are visible without needing to select them from a dropdown.
  const daysHtml = opts.map(d=>{
    const dayTx = visibleTransactions().filter(t=>new Date(t.timestamp).toDateString()===d.key);
    const dayTotal = dayTx.reduce((s,t)=>s+t.grandTotal,0);
    const divideOpen = rec.expandedDayBreakdown===d.key;
    const dt = divideOpen ? dayTotals(dayTx) : null;
    return `
      <div class="card primary">
        <p style="font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.03em;color:var(--headerSub);margin:0 0 8px;">Single record — ${d.label}</p>
        ${dayTx.length===0 ? `<p style="color:var(--headerSub);font-size:14px;">No patients recorded for this day.</p>` :
          dayTx.slice().reverse().map((t,i)=>`
            <div class="row" style="margin-bottom:6px;font-size:14px;">
              <span>${i+1}. ${esc(t.patientName)}</span><span style="font-weight:700;">${CURRENCY}${money(t.grandTotal)}</span>
            </div>`).join("")
        }
        <div class="mt2" style="border-top:1px solid rgba(255,255,255,.3);padding-top:8px;">
          <div class="row big"><span>Total · ${dayTx.length} patients</span><span>${CURRENCY}${money(dayTotal)}</span></div>
        </div>
        ${dayTx.length>0?`
        <button onclick="toggleDayBreakdown('${d.key}')" class="flex gap1" style="width:100%;background:none;border:none;color:#fff;opacity:.9;padding:8px 0 0;margin:0;cursor:pointer;font-size:12px;font-weight:600;align-items:center;justify-content:center;">
          Sales divide
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="transform:rotate(${divideOpen?180:0}deg);transition:transform .15s;"><polyline points="6 9 12 15 18 9"></polyline></svg>
        </button>` : ""}
        ${divideOpen ? `
        <div class="mt2" style="border-top:1px solid rgba(255,255,255,.3);padding-top:8px;">
          <div class="row" style="font-size:13px;padding:4px 0;"><span>💊 Medicine</span><span style="font-weight:700;">${CURRENCY}${money(dt.medTotal)}</span></div>
          <div class="row" style="font-size:13px;padding:4px 0;"><span>🧪 Tests</span><span style="font-weight:700;">${CURRENCY}${money(dt.testsTotal)}</span></div>
          <div class="row" style="font-size:13px;padding:4px 0;"><span>🩺 Doctor fee</span><span style="font-weight:700;">${CURRENCY}${money(dt.feeTotal)}</span></div>
          <div class="row" style="font-size:13px;padding:4px 0;"><span>📋 Others</span><span style="font-weight:700;">${CURRENCY}${money(dt.extrasTotal)}</span></div>
        </div>` : ""}
        ${dayTx.length>0?`<button class="btn mt3" style="width:100%;background:rgba(255,255,255,.18);color:#fff;" onclick="shareDay('${d.key}')">📤 Share this day's record</button>`:""}
      </div>
      ${dayTx.map(renderTxCard).join("")}
    `;
  }).join("");

  document.getElementById("main").innerHTML = searchBar + monthStat + daysHtml + renderRecordArchive();
}

function shareLowStock(){
  const list = lowStockList();
  const lines = [`⚠️ Out of stock / low stock`, `As of ${fmtDateTime(Date.now())}`, ``];
  list.forEach((m,i)=>{
    const strength = [m.formula,m.mg].filter(Boolean).join(" · ");
    lines.push(`${i+1}. ${m.name}${strength?` (${strength})`:""} — ${m.stockPills} medicine left`);
  });
  openShare(lines.join("\n"));
}
function toggleWarnBack(id){
  const m = inventory.find(x=>x.id===id);
  if(m){ m.noWarn = false; m.updatedAt = Date.now(); }
  saveInventory();
  render();
}
function dismissLowStock(id){
  const m = inventory.find(x=>x.id===id);
  if(m){ m.noWarn = true; m.updatedAt = Date.now(); }
  saveInventory();
  render();
}
function renderStock(){
  const list = lowStockList();
  const hidden = inventory.filter(m=>!m.deleted && m.noWarn && m.stockPills <= (m.lowStockAt ?? 0));

  const hiddenHtml = hidden.length ? `
    <p class="small" style="font-weight:700;color:var(--warning);margin:${list.length?"18px":"0"} 0 8px;">
      ⚠ These are actually low too, but their warning is turned off
    </p>
    ${hidden.map(m=>`
      <div class="card" style="border-color:#F0DCB0;">
        <div class="row">
          <div>
            <p class="item-title">${esc(m.name)}</p>
            ${(m.formula||m.mg)?`<p class="small" style="color:var(--primary);margin:2px 0 0;">${esc(m.formula)}${m.formula&&m.mg?' · ':''}${esc(m.mg)}</p>`:""}
            <p class="small faint" style="margin:2px 0 0;">${m.stockPills} medicine left</p>
          </div>
          <button class="btn btn-outline" style="padding:6px 12px;font-size:12px;" onclick="toggleWarnBack('${m.id}')">Turn warning back on</button>
        </div>
      </div>`).join("")}` : "";

  const expiring = expiringBatches();
  const expiringHtml = expiring.length ? `
    <p class="small" style="font-weight:700;color:var(--danger);margin:${list.length||hidden.length?"18px":"0"} 0 8px;">
      ⏳ Expiring within 10 days
    </p>
    ${expiring.map(({med:m,batch:b,daysLeft})=>`
      <div class="card" style="border-color:#F3C6BE;">
        <div class="row">
          <div>
            <p class="item-title">${esc(m.name)}</p>
            ${(m.formula||m.mg)?`<p class="small" style="color:var(--primary);margin:2px 0 0;">${esc(m.formula)}${m.formula&&m.mg?' · ':''}${esc(m.mg)}</p>`:""}
            <p class="small" style="margin:2px 0 0;color:var(--danger);font-weight:700;">${b.pillsRemaining} medicine · ${batchExpiryLabel(daysLeft)}</p>
          </div>
          <button class="btn btn-outline" style="padding:6px 12px;font-size:12px;white-space:nowrap;" onclick="disposeBatch('${m.id}','${b.id}')">Medicine disposed</button>
        </div>
      </div>`).join("")}` : "";

  if(list.length===0 && hidden.length===0 && expiring.length===0){
    document.getElementById("main").innerHTML = `<p class="small faint" style="text-align:center;padding:40px 0;">All medicines are sufficiently stocked and nothing is expiring soon. 👍</p>`;
    return;
  }

  document.getElementById("main").innerHTML = `
    ${list.length ? `<button class="btn btn-danger" style="width:100%;padding:12px;margin-bottom:12px;" onclick="shareLowStock()">📤 Share low-stock list</button>` : ""}
    ${list.map(m=>`
      <div class="card" style="border-color:#F3C6BE;">
        <div class="row">
          <div>
            <p class="item-title">${esc(m.name)}</p>
            ${(m.formula||m.mg)?`<p class="small" style="color:var(--primary);margin:2px 0 0;">${esc(m.formula)}${m.formula&&m.mg?' · ':''}${esc(m.mg)}</p>`:""}
            <span style="font-size:12px;font-weight:700;color:var(--danger);">${m.stockPills} medicine left</span>
          </div>
          <button class="btn btn-outline" style="padding:6px 12px;font-size:12px;white-space:nowrap;" onclick="dismissLowStock('${m.id}')">We'll buy it later</button>
        </div>
      </div>`).join("")}
    ${hiddenHtml}
    ${expiringHtml}
  `;
}

/* ===================== NOTEPAD TAB (multiple notes, one notepad per profile) ===================== */
function switchProfile(id){
  currentProfileId = id;
  localStorage.setItem("clinic_current_profile", id);
  loadNotesForCurrentProfile();
  notesUi.openId=null;
  render();
}
function toggleAddProfile(){
  notesUi.addingProfile = !notesUi.addingProfile;
  notesUi.newProfileName = "";
  render();
}
function visibleProfiles(){ return profiles.filter(p=>!p.deleted); }
function onNewProfileName(v){ notesUi.newProfileName=v; }
function addProfile(){
  const name = notesUi.newProfileName.trim();
  if(!name) return;
  const p = { id:uid(), name, updatedAt:Date.now() };
  profiles.push(p);
  saveProfiles();
  notesUi.addingProfile = false;
  switchProfile(p.id);
}
function deleteProfile(id){
  const p = profiles.find(x=>x.id===id);
  if(!p) return;
  askConfirm(`Remove "${p.name}" and delete all of their notes? This cannot be undone.`, ()=>{
    // Soft-delete (tombstone) so the removal itself can sync to other devices, same as
    // medicines/bills/notes — otherwise it just reappears once another device's data syncs back.
    p.deleted = true; p.updatedAt = Date.now();
    saveProfiles();
    try{ localStorage.removeItem("clinic_notes_"+id); }catch(e){}
    if(currentProfileId===id){
      const remaining = visibleProfiles();
      currentProfileId = remaining[0] ? remaining[0].id : null;
      if(currentProfileId) localStorage.setItem("clinic_current_profile", currentProfileId);
      else localStorage.removeItem("clinic_current_profile");
      loadNotesForCurrentProfile();
    }
    notesUi.openId=null;
    render();
  });
}
function onNotesSearch(v){ notesUi.searchQuery=v; scheduleRender(); }
function openNewNote(){ notesUi.openId="new"; notesUi.draftTitle=""; notesUi.draftBody=""; render(); }
function openExistingNote(id){
  const n = notes.find(x=>x.id===id);
  notesUi.openId=id; notesUi.draftTitle=n?n.title:""; notesUi.draftBody=n?n.body:"";
  render();
}
function onNoteTitle(v){ notesUi.draftTitle=v; }
function onNoteBody(v){ notesUi.draftBody=v; }
function backFromNote(){ saveDraftNote(); }
function saveDraftNote(){
  if(!notesUi.draftTitle.trim() && !notesUi.draftBody.trim()){ notesUi.openId=null; render(); return; }
  const title = notesUi.draftTitle.trim() || "Untitled note";
  if(notesUi.openId==="new"){
    notes.unshift({ id:uid(), title, body:notesUi.draftBody, updatedAt:Date.now() });
  } else {
    const n = notes.find(x=>x.id===notesUi.openId);
    if(n){ n.title=title; n.body=notesUi.draftBody; n.updatedAt=Date.now(); }
  }
  saveNotes();
  notesUi.openId=null;
  render();
}
function deleteNote(id){
  askConfirm("Delete this note?", ()=>{
    const n = notes.find(x=>x.id===id);
    if(n){ n.deleted = true; n.updatedAt = Date.now(); }
    saveNotes();
    if(notesUi.openId===id) notesUi.openId=null;
    render();
  });
}
function shareNote(id){
  let title, body;
  if(id==="draft"){ title=notesUi.draftTitle||"Untitled note"; body=notesUi.draftBody; }
  else { const n=notes.find(x=>x.id===id); title=n.title; body=n.body; }
  openShare(`📝 ${title}\n\n${body}`);
}

function renderNotes(){
  if(visibleProfiles().length===0){
    document.getElementById("main").innerHTML = `
      <div class="card" style="text-align:center;">
        <p style="font-weight:700;margin:0 0 6px;">Who's writing notes?</p>
        <p class="small faint" style="margin:0 0 12px;">Each person gets their own private notepad on this device.</p>
        <input ${NOAC} id="firstProfileName" value="${esc(notesUi.newProfileName)}" oninput="onNewProfileName(this.value)" placeholder="Your name" class="mb2">

  const profileSwitcher = `

        </select>
