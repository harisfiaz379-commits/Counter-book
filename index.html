function removeEditTxItem(idx){ recEdit.items.splice(idx,1); clampEditDiscounts(); render(); }
function editTxMedTotal(){ return r2(recEdit.items.reduce((s,it)=>s+(Number(it.subtotal)||0),0)); }
function clampEditDiscounts(){
  recEdit.medsDiscount  = r2(Math.min(Math.max(Number(recEdit.medsDiscount)||0,0), editTxMedTotal()));
  recEdit.feeDiscount   = r2(Math.min(Math.max(Number(recEdit.feeDiscount)||0,0), Math.max(Number(recEdit.fee)||0,0)));
  recEdit.testsDiscount = r2(Math.min(Math.max(Number(recEdit.testsDiscount)||0,0), Number(recEdit.testsTotal)||0));
}
function editTxGrandTotal(){ clampEditDiscounts(); return r2(editTxMedTotal() - recEdit.medsDiscount + Math.max(Number(recEdit.fee)||0,0) - recEdit.feeDiscount + (Number(recEdit.extrasTotal)||0) + (Number(recEdit.testsTotal)||0) - recEdit.testsDiscount); }
function editTxApplyStock(t, items){
  // Lines that stay on the bill are LEFT EXACTLY AS THEY WERE (their stock, the batches they came from and their
  // expiry are not touched — before, every line was handed back and sold again, which could move pills between
  // batches and, on a bill with a partial return, lose the returned pills from stock). Only lines you REMOVED give
  // their stock back (into the batch they came from) and only lines you ADDED are taken out of stock.
  const keptIdx = new Set(items.filter(x=>!x._new && x._oi!=null).map(x=>x._oi));
  t.items.forEach((oldIt,idx)=>{
    if(keptIdx.has(idx)) return;
    const med = inventory.find(m=>m.id===oldIt.medId);
    if(med){
      const alreadyRet = retDoneQty(t.id,idx,oldIt.lid);
      const owed = q6(Math.max(0, stockBack(oldIt) - alreadyRet));
      if(owed>0) returnStockToBatches(med, oldIt.dedBatches, owed, alreadyRet);
    }
  });
  items.forEach(newIt=>{
    if(!newIt._new) return;
    const med = inventory.find(m=>m.id===newIt.medId);
    if(med){ newIt.ded = deductStock(med, newIt.pills); if(lastDeductExpiry) newIt.exp = lastDeductExpiry; else delete newIt.exp; newIt.dedBatches = lastDeductBatches; }
  });
}
function saveEditTx(){
  const t = transactions.find(x=>x.id===recEdit.txId);
  if(!t || !recEdit.patient.trim()) return;
  // Give back stock for the old items, then deduct stock for the new items. Only give back what's
  // still actually out — i.e. what was sold minus whatever was already returned on this bill before
  // this edit — the same accounting deleteTx() uses. Otherwise editing a bill that had a partial
  // return (sell 20, return 5, then edit) would hand back the full 20 instead of the remaining 15,
  // creating phantom stock.
  editTxApplyStock(t, recEdit.items);
  saveInventory();
  t.patientName = recEdit.patient.trim();
  clampEditDiscounts();
  t.doctorFee = r2(Math.max(Number(recEdit.fee)||0,0));
  t.items = recEdit.items.map(it=>{ const c={...it}; delete c._new; delete c._oi; if(c.lid==null) c.lid = uid(); return c; });   // any newly-added line gets its own stable id too
  t.medTotal = editTxMedTotal();
  t.medsDiscount = recEdit.medsDiscount||0;
  t.extras = recEdit.extras||[];
  t.extrasTotal = recEdit.extrasTotal||0;
  t.tests = recEdit.tests||[];
  t.testsTotal = recEdit.testsTotal||0;
  t.testsDiscount = recEdit.testsDiscount||0;
  t.feeDiscount = recEdit.feeDiscount||0;
  t.grandTotal = editTxGrandTotal();
  t.updatedAt = Date.now();
  logActivity("bill_edit", t.patientName||"Bill");
  saveTransactions();
  rec.editingId = null;
  render();
  showToast("✓ Bill updated");
}

// speed. (An expanded/editing tx card's own nested search box, when open, is handled separately
// by refreshEditTxDropdown() so that typing there doesn't rebuild this whole body either.)
function renderRecordsBody(){
  const container = document.getElementById("recordsBody");
  if(!container) return;

  _retIdx = null;   // returns are re-indexed on every redraw so the bill<->return links are never stale
  if(rec.histOn && rec.histBill){

// Shared by the low-stock / hidden-warning / expiring lists below — same instant-first-batch,
// background-chunk-the-rest approach used for Inventory, so Warnings stays fast if the number
// of flagged medicines ever grows large too (currently each of these three lists is normally
// a small subset of the full medicine count, but nothing stops that from changing over time).
function fillListProgressively(containerId, items, buildRow, myToken){
  const el = document.getElementById(containerId);
  if(!el) return;
  const FIRST_BATCH = 15, CHUNK_SIZE = 30;
  el.innerHTML = items.slice(0, FIRST_BATCH).map(buildRow).join("");
  if(items.length <= FIRST_BATCH) return;
  let idx = FIRST_BATCH;
  const appendNextChunk = ()=>{
    if(myToken !== _warnRenderToken) return; // superseded — tab changed or data edited since
    const listEl = document.getElementById(containerId);
    if(!listEl) return;
    const chunk = items.slice(idx, idx+CHUNK_SIZE);
    listEl.insertAdjacentHTML("beforeend", chunk.map(buildRow).join(""));
    idx += CHUNK_SIZE;
    if(idx < items.length) requestAnimationFrame(appendNextChunk);
  };
  requestAnimationFrame(appendNextChunk);
}
// Tapping a summary pill narrows the page below to just that one group; tapping the same pill
// again clears the filter back to showing everything. A discrete click, not continuous typing,
// so redoing the whole tab via renderStock() (rather than only a results container) is fine —
// the pills themselves need their active/inactive styling refreshed too.
function toggleWarnFilter(kind){
  warnUi.filter = (warnUi.filter===kind) ? null : kind;

}
// Search box of the Warnings tab. The box lives OUTSIDE the lists that are redrawn, so typing never loses focus.
function warnMatch(m){
  const q = String(warnUi.q||"").trim().toLowerCase(); if(!q) return true;
  const hay = (String(m.name||"")+" "+String(m.formula||"")+" "+String(m.category||"")+" "+String(m.mg||"")).toLowerCase();
  return q.split(/\s+/).every(w=>hay.includes(w));
}
let _warnSearchTimer = null;
function onWarnSearch(v){ warnUi.q = v; clearTimeout(_warnSearchTimer); _warnSearchTimer = setTimeout(()=>{ if(tab==="stock") renderStock(); }, 120); }
function setWarnMain(bodyHtml){
  const main = document.getElementById("main"), body = document.getElementById("warnBody");
  if(body && document.getElementById("warnSearchInput") && main.contains(body)){ body.innerHTML = bodyHtml; return; }
  main.innerHTML = `<div class="search-wrap mb2"><span class="search-icon">🔍</span>
      <input ${NOAC} id="warnSearchInput" value="${esc(warnUi.q||"")}" oninput="onWarnSearch(this.value)" placeholder="Search warnings (medicine, formula)…"></div>
    <div id="warnBody">${bodyHtml}</div>`;
}
function renderStock(){
  const myToken = ++_warnRenderToken;

  const q = String(warnUi.q||"").trim();

      ${expiredItems.length ? pillBtn(filter==='expired', '--dangerSoft', '--danger', `⏳ ${expiredItems.length} expired`, 'expired') : ""}
      ${expiringSoonItems.length ? pillBtn(filter==='expiringSoon', '--warningSoft', '--warning', `⏳ ${expiringSoonItems.length} expiring soon`, 'expiringSoon') : ""}

    ${filter ? `<p class="small faint mb2">Filtered · <button type="button" onclick="toggleWarnFilter('${filter}')" style="background:none;border:none;color:var(--primary);font-weight:700;cursor:pointer;padding:0;font-size:inherit;">Show all</button></p>` : ""}
  `;

  const showLowStock = !filter || filter==='lowStock';
  const showHidden = showLowStock;
  const expiringToShow = filter==='expired' ? expiredItems : filter==='expiringSoon' ? expiringSoonItems : ((filter==='lowStock'||filter==='expiring2m') ? [] : expiringAll);
  const exp2ToShow = (!filter || filter==='expiring2m') ? exp2 : [];
  const expiringHeadingText = filter==='expired' ? "⏳ Expired" : filter==='expiringSoon' ? "⏳ Expiring soon (within 10 days)" : "⏳ Expiring within 10 days";

  const listToShow = showLowStock ? list : [];
  const hiddenToShow = showHidden ? hidden : [];

  if(listToShow.length===0 && hiddenToShow.length===0 && expiringToShow.length===0 && exp2ToShow.length===0){
    setWarnMain(`${summaryHtml}
      <p class="small faint" style="text-align:center;padding:32px 0;">${q ? `Nothing matches “${esc(q)}”.` : "Nothing in this group right now. 👍"}</p>`);
    return;
  }

  const hiddenHeadingHtml = hiddenToShow.length ? `
    <p class="small" style="font-weight:700;color:var(--warning);margin:${listToShow.length?"18px":"0"} 0 8px;">
      ⚠ These are actually low too, but their warning is turned off
    </p>
    <div id="warnHiddenList"></div>` : "";

  const expiringHeadingHtml = expiringToShow.length ? `
    <p class="small" style="font-weight:700;color:var(--danger);margin:${listToShow.length||hiddenToShow.length?"18px":"0"} 0 8px;">
      ${expiringHeadingText}

/* ===================== BRANCHES ===================== */
// Every branch has its OWN stock, bills and records (own storage keys on the phone, own cloud document).
// Shared by all branches: staff accounts, the branch list, tests/prices, categories, notes.
// Everything that existed before branches is the "main" branch and stays exactly where it was.
function visibleBranches(){
  const list = (branches||[]).filter(b=>!b.deleted);
  if(!list.some(b=>b.id==="main")) list.unshift({ id:"main", name:"Main branch" });
  return list;
}
function branchName(id){
  id = id || "main";
  const b = (branches||[]).find(x=>x.id===id);
  if(b) return b.name;
  return id==="main" ? "Main branch" : "Branch";
}
function profileBranch(p){ return (p && p.branchId) || "main"; }
function myBranchId(){ return profileBranch(profiles.find(x=>x.id===currentProfileId)); }
function branchTagHtml(p){ return (visibleBranches().length>1 && p && p.role!=="admin") ? ` · 🏢 ${esc(branchName(profileBranch(p)))}` : ""; }
// Who may manage whom: Admin → everyone. Branch Manager → doctors/receptionists/semi-admins of THEIR OWN branch only.
function canManageProfile(p){
  const role = currentRole();
  if(role==="admin") return true;
  if(role==="branchmanager") return !!p && p.id!==currentProfileId && profileBranch(p)===myBranchId() && p.role!=="admin" && p.role!=="branchmanager";
  return false;
}
function roleChoices(forNew){
  if(currentRole()==="branchmanager") return ["doctor","receptionist"];
  return forNew ? ["branchmanager","semiadmin","doctor","receptionist"] : ["admin","branchmanager","semiadmin","doctor","receptionist"];
}
function manageableProfiles(){ return visibleProfiles().filter(p=>currentRole()==="admin" || canManageProfile(p)); }

// Switch which branch's stock/bills this phone shows (Admin can go anywhere; staff are placed in their own branch automatically).
async function switchBranch(id){
  if(branchSwitching || id===activeBranchId) return false;
  branchSwitching = true;
  try{
    for(let i=0; i<40 && pushInFlight; i++) await new Promise(r=>setTimeout(r,250));   // let an upload that is already running finish first
    try{   // make sure what is on screen is in THIS branch's own storage keys (no cloud push is scheduled for it)
      localStorage.setItem(bk("clinic_inventory"), JSON.stringify(inventory));
      localStorage.setItem(bk("clinic_transactions"), JSON.stringify(transactions));
      localStorage.setItem(bk("clinic_month_adjustments"), JSON.stringify(monthAdjustments));
      localStorage.setItem(bk("clinic_bill_docs"), JSON.stringify(billDocs));
    }catch(e){}
    stopExtraListeners();
    if(snapshotUnsubscribe){ try{ snapshotUnsubscribe(); }catch(e){} snapshotUnsubscribe = null; }
    if(branchUnsubscribe){ try{ branchUnsubscribe(); }catch(e){} branchUnsubscribe = null; }
    clearTimeout(syncDebounceTimer);
    activeBranchId = id;
    try{ localStorage.setItem("clinic_active_branch", id); }catch(e){}
    try{ inventory = JSON.parse(localStorage.getItem(bk("clinic_inventory"))||"[]"); }catch(e){ inventory=[]; }
    try{ transactions = JSON.parse(localStorage.getItem(bk("clinic_transactions"))||"[]"); }catch(e){ transactions=[]; }
    try{ monthAdjustments = JSON.parse(localStorage.getItem(bk("clinic_month_adjustments"))||"{}"); }catch(e){ monthAdjustments={}; }
    try{ billDocs = mergeBillDocs(JSON.parse(localStorage.getItem(bk("clinic_bill_docs"))||"[]"), []); }catch(e){ billDocs=[]; }
    _lowStockCache = null; _expiringBatchesCache = null; _expiring2mCache = null; _fsIndex = null; _visibleTxCache = null;
    _invSort = null;   // Arrange choice is remembered per branch: reload it for the branch we just entered
    _invListLoadedFor = null;
    try{ activityLog = JSON.parse(localStorage.getItem(bk("clinic_activity_log"))||"{}"); }catch(e){ activityLog = {}; }
    // anything open that points at the other branch's medicines/bills is closed
    toolsUi.open = false; toolsUi.counts = {}; toolsUi.q = ""; toolsUi.histName = "";
    aiUi = { open:false, text:"", rows:null, busy:false, error:"", setupOpen:false, patientName:"" };
    xferUi = { medId:"", toId:"", boxes:"", pills:"", busy:false, manual:false, bq:{} };
    cardsUi = { toId:"", busy:false, q:"", sel:{} };
    try{ if(typeof renderOverlays==="function") renderOverlays(); }catch(e){}
    try{ xferApplyOutboxLocal(); }catch(e){}
    // fresh screens: nothing from the other branch (open bill, search, expanded cards) may carry over
    bill = newBillState(); retReset();
    rec.expandedId = null; rec.editingId = null; rec.histOn = false; rec.histBill = ""; rec.searchQuery = "";
    inv.editId = null; inv.restockId = null; inv.showForm = false; inv.query = "";
    warnUi.filter = null; warnUi.q = "";
    syncStatus = "syncing"; renderSyncBadge();
    startCloudSync();
    if(tab==="inventory"){ try{ renderInventory(); }catch(e){} }   // rebuild the whole Inventory header (ovals + Arrange + search) for the new branch
    render();
    return true;
  } finally { branchSwitching = false; }
}
// Staff always work in their own branch; the Admin may be anywhere. Runs after login, at start-up and
// whenever the shared data changes (e.g. someone was just moved to another branch).
function enforceBranchForCurrentUser(){
  if(!currentProfileId || !sessionAuthed || branchSwitching) return;
  const me = profiles.find(x=>x.id===currentProfileId); if(!me || me.deleted) return;
  if(me.role==="admin"){
    const cur = (branches||[]).find(x=>x.id===activeBranchId);
    if(activeBranchId!=="main" && cur && cur.deleted) switchBranch("main");     // the branch they were viewing was removed
    return;
  }
  const want = profileBranch(me), wb = (branches||[]).find(x=>x.id===want);
  const target = (wb && wb.deleted) ? "main" : want;
  if(target!==activeBranchId){
    switchBranch(target).then(ok=>{ if(ok) showToast(`🏢 You are now in "${branchName(target)}"`); });
  }
}

function transferStaff(pid, toId){

(function(){
  let timer = null, longFired = false, lastTap = 0, singleTimer = null;
  const pillOf = e => (e.target && e.target.closest) ? e.target.closest("[data-branchpill]") : null;
  document.addEventListener("pointerdown", e=>{
    if(!pillOf(e)) return;
    longFired = false; clearTimeout(timer);
    timer = setTimeout(()=>{ longFired = true; clearTimeout(singleTimer); lastTap = 0; try{ navigator.vibrate && navigator.vibrate(15); }catch(_){} openBranchSheet(); }, 450);
  }, true);
  document.addEventListener("pointerup", e=>{
    clearTimeout(timer);
    if(!pillOf(e)) return;
    if(longFired){ longFired = false; return; }
    const now = Date.now();
    if(now-lastTap < 320){ clearTimeout(singleTimer); lastTap = 0; branchPillDouble(); }
    else { lastTap = now; clearTimeout(singleTimer); singleTimer = setTimeout(()=>{ lastTap = 0; branchPillSingle(); }, 330); }
  }, true);
  document.addEventListener("pointercancel", ()=>clearTimeout(timer), true);
  document.addEventListener("contextmenu", e=>{ if(pillOf(e)) e.preventDefault(); }, true);   // no text-selection / context menu on a long press
})();

// The 3 gated actions: Printer Settings + Receipt setup are Admin-only by default; the Monthly
// Total Sales summary is hidden from Receptionist by default. Semi-Admin gets none of these
// unless the Admin explicitly ticks them on for that person (stored per-profile in
// `privileges`); Manage Users is never available to Semi-Admin no matter what's ticked — that's
// checked first, before any role branching, so it can never be granted. Everything else (New
// Bill, Records view/edit, daily/individual sales, Inventory view+edit, Backup, Notepad) stays
// open to every role.
function can(action){
  const role = currentRole();
  // Manage Users is Admin-only outright — Semi-Admins never get it, whatever is ticked.
  if(action==="manageUsers") return role==="admin";
  if(action==="manageBranches") return role==="admin";
  if(action==="manageStaff") return role==="admin" || role==="branchmanager";   // Branch Manager: only their own branch's staff (see canManageProfile)
  if(role==="admin") return true;
  if(role==="branchmanager"){
    // Runs one branch: everything a Semi-Admin with every privilege can do, except the company-wide
    // medicine categories and Diagnostics, which stay with the Admin.
    if(action==="manageCategories" || action==="diagnostics") return false;
    return true;
  }
  if(role==="semiadmin"){
    const p = profiles.find(x=>x.id===currentProfileId);
    const priv = (p && p.privileges) || {};
    // Categories are Admin by default; a Semi-Admin only gets them if that privilege was ticked.
    if(action==="manageCategories") return !!priv.editCategories;
    if(action==="printer") return !!priv.printer;
    if(action==="receiptSetup") return !!priv.receiptSetup;
    if(action==="monthlyTotal") return !!priv.monthlyTotal;
    if(action==="diagnostics") return !!priv.diagnostics;
    return true;
  }
  if(action==="manageCategories") return false;
  if(action==="printer") return false;
  if(action==="receiptSetup") return false;
  if(action==="monthlyTotal") return role==="doctor";
  if(action==="diagnostics") return false;
  return true;
}

/*PINGUARD-BEGIN*/
// Wrong-PIN lockout. 5 wrong PINs on one account lock PIN checks for that account for 30 s; every further wrong PIN doubles
// the wait (60 s, 2 min ... up to 15 min). It is remembered on the phone (so closing the app does not reset it) and a correct
// PIN clears it. While locked even the right PIN is refused. This stops someone sitting with the phone from trying
// PINs one after another; it cannot protect data that is read straight from the cloud database (see Firestore rules, #5).
function _pinFails(){ try{ return JSON.parse(localStorage.getItem("clinic_pin_fails")||"{}"); }catch(e){ return {}; } }
function _pinFailsSave(o){ try{ localStorage.setItem("clinic_pin_fails", JSON.stringify(o)); }catch(e){} }
function pinLockLeft(id){ const r=_pinFails()[id]; return (r && r.until>Date.now()) ? Math.ceil((r.until-Date.now())/1000) : 0; }
function pinWaitText(sec){ return sec>=90 ? Math.ceil(sec/60)+" minutes" : sec+" seconds"; }
// returns { ok:true } or { ok:false, locked:seconds (0 = just a wrong PIN) }
function pinCheck(id, entered, actual){
  const left = pinLockLeft(id); if(left) return { ok:false, locked:left };
  if(String(actual||"") === String(entered||"")){
    const all=_pinFails(); if(all[id]){ delete all[id]; _pinFailsSave(all); }
    return { ok:true };
  }
  const all=_pinFails(), r=all[id]||{ n:0, until:0 }; r.n++;
  if(r.n>=5) r.until = Date.now() + Math.min(900, 30*Math.pow(2, r.n-5))*1000;
  all[id]=r; _pinFailsSave(all);
  return { ok:false, locked:pinLockLeft(id) };
}
/*PINGUARD-END*/
function submitLogin(){
  const p = profiles.find(x=>x.id===loginUi.pickedId);
  if(!p){ loginUi.error="Pick your name first"; render(); return; }
  const _chk = pinCheck(p.id, loginUi.pin, p.pin);
  if(!_chk.ok){
    loginUi.error = _chk.locked ? `Too many wrong PINs. Try again in ${pinWaitText(_chk.locked)}.` : "Wrong PIN — try again";
    loginUi.pin=""; render(); return;
  }
  activateProfile(p.id);

}

   (not can(), which just reflects whoever last logged in on this device — not proof that an
   Admin is present right now) so this can't be used to add unauthorized accounts. ---- */
function openAddUserFromLogin(){
  const admins = visibleProfiles().filter(p=>p.role==="admin");
  if(!admins.length){ showToast("No Admin account exists yet"); return; }
  addUserLoginUi = { open:true, adminId:admins[0].id, adminPin:"", step:"form", error:"", newName:"", newRole:"receptionist", newPin:"", newPrivileges:{printer:false,receiptSetup:false,monthlyTotal:false, editCategories:false, diagnostics:false} };

function onAddUserLoginPin(v){ addUserLoginUi.newPin=v.replace(/[^0-9]/g,"").slice(0,6); }
// Sends an access request: no Admin PIN needed. It is saved as a pending profile that syncs to the Admin,
// who approves (and picks the role) from Manage Users. Nothing can be used to log in until then.
function submitAddUserFromLogin(){
  const name = addUserLoginUi.newName.trim();
  const pin = addUserLoginUi.newPin.trim();
  if(!name){ showToast("Enter your name first"); return; }
  if(pin.length<4){ showToast("Choose a PIN with at least 4 digits"); return; }
  const clash = profiles.find(x=>!x.deleted && String(x.name||"").trim().toLowerCase()===name.toLowerCase());
  if(clash){
    addUserLoginUi.error = clash.pending ? "A request for this name is already waiting for approval." : "That name is already taken — pick another or log in.";
    render();
    return;
  }
  profiles.push({ id:uid(), name, role:"receptionist", pin, branchId:activeBranchId, pending:true, updatedAt:Date.now() });
  saveProfiles();
  addUserLoginUi = { open:true, adminId:"", adminPin:"", step:"sent", error:"", newName:name, newRole:"receptionist", newPin:"", newPrivileges:{printer:false,receiptSetup:false,monthlyTotal:false, editCategories:false, diagnostics:false} };

}

function onNewUserPrivilegeToggle(key){ manageUi.newPrivileges[key] = !manageUi.newPrivileges[key]; render(); }
function addUserProfile(){
  if(!can("manageStaff")) return;
  const name = manageUi.newName.trim();
  const pin = manageUi.newPin.trim();
  if(!name){ showToast("Enter a name first"); return; }
  if(pin.length<4){ showToast("Choose a PIN with at least 4 digits"); return; }
  // New accounts can never be created as Admin (only one Admin can exist, transferred via
  // the "make Admin" flow on an existing account) — defensive fallback if role is ever admin.
  const role = manageUi.newRole==="admin" ? "receptionist" : manageUi.newRole;
  if(!roleChoices(true).includes(role)){ showToast("You can't create that kind of account"); return; }
  // A Branch Manager's new staff always join THEIR branch; the Admin chooses (default: the branch on screen).
  const branchId = currentRole()==="branchmanager" ? myBranchId() : (manageUi.newBranch || activeBranchId);
  if(role==="semiadmin"){
    // Granting Semi-Admin (and whichever privileges are ticked) needs the Admin's own PIN to
    // confirm, same as any other sensitive permission change — the account isn't created yet.
    openPrivilegeConfirm("add", { name, role, pin, branchId, privileges: { ...manageUi.newPrivileges } });
    return;
  }
  const p = { id:uid(), name, role, pin, branchId, updatedAt:Date.now() };
  profiles.push(p);
  saveProfiles();
  manageUi.addingUser=false; manageUi.newBranch="";
  showToast(`✓ ${name} added`);

function startEditUser(id){
  const p = profiles.find(x=>x.id===id);
  if(!p || !canManageProfile(p)) return;
  manageUi.editingId = id;
  manageUi.editRole = p.role;
  manageUi.editPin = p.pin || "";
  manageUi.editPrivileges = Object.assign({printer:false, receiptSetup:false, monthlyTotal:false, editCategories:false, diagnostics:false}, p.privileges||{});
  render();
}
function cancelEditUser(){ manageUi.editingId=null; render(); }
function onEditUserRole(v){ manageUi.editRole=v; render(); }

function onEditUserPrivilegeToggle(key){ manageUi.editPrivileges[key] = !manageUi.editPrivileges[key]; render(); }
function saveEditUser(){
  if(!can("manageStaff")) return;
  const p = profiles.find(x=>x.id===manageUi.editingId);
  if(!p || !canManageProfile(p)) return;
  if(!roleChoices(false).includes(manageUi.editRole)){ showToast("You can't give that role"); return; }
  if(manageUi.editPin.trim().length<4){ showToast("PIN must be at least 4 digits"); return; }
  if(p.role==="admin" && manageUi.editRole!=="admin" && visibleProfiles().filter(x=>x.role==="admin").length<=1){
    showToast("Can't demote the only Admin account");
    return;
  }
  if(p.role!=="admin" && manageUi.editRole==="admin"){
    // Making someone else Admin is a transfer, not a simple edit: only one Admin can exist at a
    // time, so this hands off Admin status rather than adding a second one — and it can only be
    // done using the current Admin's own PIN, confirmed in a separate step below.
    openAdminTransferConfirm(p.id, manageUi.editPin.trim());
    return;
  }
  if(manageUi.editRole==="semiadmin"){
    // Setting or updating Semi-Admin privileges always needs the Admin's own PIN to confirm.
    openPrivilegeConfirm("edit", { id:p.id, role:"semiadmin", pin:manageUi.editPin.trim(), privileges: { ...manageUi.editPrivileges } });
    return;
  }
  p.role = manageUi.editRole;
  p.pin = manageUi.editPin.trim();
  if(p.privileges) delete p.privileges; // no longer Semi-Admin, drop stale privilege flags
  p.updatedAt = Date.now();
  saveProfiles();
  manageUi.editingId=null;
  showToast("✓ Updated");
  render();
}

   privileges, always needs the Admin's own PIN re-entered here before it's actually saved.

   Admin-only regardless of what's stored, so it can never leak to a Semi-Admin account. ---- */
let privilegeConfirmUi = { open:false, mode:"", pending:null, actorPin:"", error:"" };
function openPrivilegeConfirm(mode, pending){
  manageUi.editingId = null;
  privilegeConfirmUi = { open:true, mode, pending, actorPin:"", error:"" };

function confirmPrivilegeSave(){
  const actor = profiles.find(x=>x.id===currentProfileId);
  const _chk = actor ? pinCheck(actor.id, privilegeConfirmUi.actorPin, actor.pin) : { ok:false, locked:0 };
  if(!_chk.ok){
    privilegeConfirmUi.error = _chk.locked ? `Too many wrong PINs. Try again in ${pinWaitText(_chk.locked)}.` : "Incorrect PIN";
    render();
    return;
  }
  const d = privilegeConfirmUi.pending;
  if(privilegeConfirmUi.mode==="add"){
    const p = { id:uid(), name:d.name, role:d.role, pin:d.pin, privileges:d.privileges, branchId:d.branchId||"main", updatedAt:Date.now() };
    profiles.push(p);
    saveProfiles();
    manageUi.addingUser=false;
    showToast(`✓ ${d.name} added`);
  } else if(privilegeConfirmUi.mode==="edit"){
    const p = profiles.find(x=>x.id===d.id);
    if(p){
      p.role = d.role;
      p.pin = d.pin;
      p.privileges = d.privileges;
      p.updatedAt = Date.now();
      saveProfiles();
    }
    showToast("✓ Updated");
  }
  privilegeConfirmUi = { open:false, mode:"", pending:null, actorPin:"", error:"" };
  render();
}

/* ---- Admin transfer: making someone else Admin requires the CURRENT Admin's own PIN, and
   immediately strips Admin status from whoever approves it (only one Admin can exist at a time).
   The ex-Admin is then forced (via postTransferChoiceUi, a non-dismissible modal) to pick
   Doctor/Receptionist or delete their own account before they can do anything else. ---- */
let adminTransferUi = { open:false, targetId:"", targetNewPin:"", actorPin:"", error:"" };
function openAdminTransferConfirm(targetId, targetNewPin){
  manageUi.editingId = null;
  adminTransferUi = { open:true, targetId, targetNewPin, actorPin:"", error:"" };
  render();
}
function closeAdminTransferConfirm(){ adminTransferUi.open=false; render(); }
function onAdminTransferPin(v){ adminTransferUi.actorPin = v.replace(/[^0-9]/g,"").slice(0,6); adminTransferUi.error=""; }
function confirmAdminTransfer(){
  const actor = profiles.find(x=>x.id===currentProfileId);
  const target = profiles.find(x=>x.id===adminTransferUi.targetId);
  if(!actor || !target){ closeAdminTransferConfirm(); return; }
  const _chk = pinCheck(actor.id, adminTransferUi.actorPin, actor.pin);
  if(!_chk.ok){
    adminTransferUi.error = _chk.locked ? `Too many wrong PINs. Try again in ${pinWaitText(_chk.locked)}.` : "Incorrect PIN";
    render();
    return;
  }
  if(adminTransferUi.targetNewPin && adminTransferUi.targetNewPin.length>=4){
    target.pin = adminTransferUi.targetNewPin;
  }
  target.role = "admin";
  target.updatedAt = Date.now();
  saveProfiles();
  adminTransferUi.open = false;
  postTransferChoiceUi = { open:true, actorId:actor.id };
  showToast(`✓ ${target.name} is now Admin`);
  render();
}

function deleteProfile(id){
  if(!can("manageStaff")) return;
  const p = profiles.find(x=>x.id===id);
  if(!p || !canManageProfile(p)) return;
  if(p.role==="admin" && visibleProfiles().filter(x=>x.role==="admin").length<=1){
    showToast("Can't remove the only Admin account");
    return;
  }
  askConfirm(`Remove "${p.name}"? They will no longer be able to log in, and their private notes will be deleted. This cannot be undone.`, ()=>{
    // Soft-delete (tombstone) so the removal itself can sync to other devices, same as
    // medicines/bills/notes — otherwise it just reappears once another device's data syncs back.
    p.deleted = true; p.updatedAt = Math.max(Date.now(), (p.updatedAt||0)+1);

    }
    manageUi.editingId=null;
    render();
  });
}

// Fills #notesEmptyMsg + #notesList from the current notesUi.searchQuery, without ever
// touching #notesSearchInput itself. Called once by renderNotes() on a full render, and
// directly by onNotesSearch() on every keystroke — since it never rebuilds the input node,
// it's safe to call on every keystroke with no debounce, at any typing speed.
function renderNotesListBody(){
  const myToken = ++_notesRenderToken;
  const sorted = notes
    .filter(n=>{
      if(n.deleted) return false;
      const q = notesUi.searchQuery.trim().toLowerCase();
      if(!q) return true;
      return n.title.toLowerCase().includes(q) || n.body.toLowerCase().includes(q);
    })
    .sort((a,b)=>b.updatedAt-a.updatedAt);

  const emptyEl = document.getElementById("notesEmptyMsg");
  if(emptyEl) emptyEl.innerHTML = sorted.length===0?`<p class="small faint" style="text-align:center;padding:24px 0;">${notesUi.searchQuery.trim()?`No notes match "${esc(notesUi.searchQuery)}".`:"No notes yet — jot down reminders, supplier calls, or things to order."}</p>`:"";

  // Same instant-first-batch, background-chunk-the-rest approach as Inventory/Warnings —
  // future-proofing against notes piling up over years the same way bills and medicines can.
  const FIRST_BATCH = 15, CHUNK_SIZE = 30;
  const listEl = document.getElementById("notesList");
  if(listEl) listEl.innerHTML = sorted.slice(0, FIRST_BATCH).map(buildNoteCard).join("");
  if(sorted.length > FIRST_BATCH){
    let idx = FIRST_BATCH;
    const appendNextChunk = ()=>{
      if(myToken !== _notesRenderToken) return;
      const el = document.getElementById("notesList");
      if(!el) return;
      const chunk = sorted.slice(idx, idx+CHUNK_SIZE);
      el.insertAdjacentHTML("beforeend", chunk.map(buildNoteCard).join(""));
      idx += CHUNK_SIZE;
      if(idx < sorted.length) requestAnimationFrame(appendNextChunk);
    };
    requestAnimationFrame(appendNextChunk);
  }
}

/* ===================== BACKUP & RESTORE ===================== */
/* Everything in this app already lives in the phone's storage (localStorage), which
   survives closing the app/browser and restarting the phone. The real risk is someone
   clearing browser/site data, or reinstalling the browser — that does wipe it. Export
   makes a real file in your phone's Downloads/Files app, completely outside the
   browser, so you always have a copy to restore from no matter what happens to it. */
function mergeById(localArr, incomingArr){
  const map = new Map();
  (localArr||[]).forEach(x=>map.set(x.id,x));
  (incomingArr||[]).forEach(x=>{ if(!map.has(x.id)) map.set(x.id,x); });
  return Array.from(map.values());
}
function mergeInventory(localInv, incomingInv){
  const result = (localInv||[]).map(m=>({...m, batches:(m.batches||[]).slice()}));
  // Two values "agree" if either side is blank (so older records missing a field can still
  // reconcile normally — this function already fills a blank field in from whichever side has
  // it, right below) or they're the same once trimmed/lowercased.
  const agrees = (a,b)=>{ a=String(a||"").trim().toLowerCase(); b=String(b||"").trim().toLowerCase(); return !a || !b || a===b; };
  const sameText = (a,b)=> String(a||"").trim().toLowerCase() === String(b||"").trim().toLowerCase();
  const samePack = (a,b)=> (Number(a)||0) === (Number(b)||0);
  (incomingInv||[]).forEach(im=>{
    let match = result.find(m=>m.id===im.id);
    // Same id is the only sure match. A name-only fallback used to be enough to treat two
    // DIFFERENT products — different strength, dosage form or category, but sharing a name — as
    // the same medicine, silently merging their stock together. Now the fallback also requires
    // strength/category/formula to not actively DISAGREE between the two records. Strength and box size are what
    // really tell two products apart (500 mg vs 250 mg, a pack of 10 vs 20), so for those two a blank on ONE side
    // and a value on the other is NOT treated as agreeing — at worst that leaves a visible duplicate to tidy up,
    // never two different products silently merged into one stock count. Both blank still agrees (nothing to compare).
    if(!match) match = result.find(m=>
      m.name.trim().toLowerCase()===im.name.trim().toLowerCase() &&
      sameText(m.mg, im.mg) && samePack(m.pillsPerBox, im.pillsPerBox) &&
      agrees(m.category, im.category) && agrees(m.formula, im.formula));
    if(match){
      match.batches = mergeById(match.batches, im.batches);
      match.category = match.category || im.category || "";
      match.specialCategory = match.specialCategory || im.specialCategory || "";
      match.formula = match.formula || im.formula || "";
      match.mg = match.mg || im.mg || "";
      match.gtin = match.gtin || im.gtin || "";
      match.deleted = match.deleted || im.deleted;
      recomputeStock(match);
    } else {
      const copy = {...im, batches:(im.batches||[]).slice()};
      recomputeStock(copy);
      result.push(copy);
    }
  });
  return result;
}
/* ---- LIVE-SYNC-ONLY reconciliation ----
   mergeInventory (above) is deliberately additive/never-overwrite: it's built for the offline
   backup file, which combines two phones that may have been apart for weeks, so it must never
   let one side's file silently clobber real edits the other side made. Live cloud sync is a
   different problem — it's the same shared dataset, seconds apart, and a sale/restock/edit on
   one phone MUST overwrite the stale copy on the other. So for the cloud path we reconcile by
   "whoever touched it most recently wins", using the updatedAt timestamps stamped on every
   medicine-level edit and every batch-level stock change. */
function reconcileBatchesForSync(localBatches, remoteBatches){
  const remoteMap = new Map((remoteBatches||[]).map(b=>[b.id,b]));
  const seen = new Set();
  const result = (localBatches||[]).map(lb=>{
    seen.add(lb.id);
    const rb = remoteMap.get(lb.id);
    if(!rb) return lb; // batch only exists locally (e.g. restocked here) — keep it
    return mergeBatchPair(lb, rb); // quantity = both phones' changes combined; other details from the newer copy
  });
  (remoteBatches||[]).forEach(rb=>{
    if(!seen.has(rb.id)) result.push({...rb}); // batch only exists remotely — add it
  });
  return result;
}
function pickNewerMedicine(a,b){
  // Scalar fields (name/price/etc.) come from whichever side edited most recently.
  // Batches (actual stock) are reconciled independently and separately above, so a restock
  // never gets lost just because the OTHER device happens to "win" on the scalar fields.
  const aT = a.updatedAt||0, bT = b.updatedAt||0;
  const base = aT>=bT ? a : b;
  return {
    id: a.id, name: base.name, category: base.category||"", specialCategory: base.specialCategory||"", formula: base.formula||"", mg: base.mg||"",
    mrpPerBox: base.mrpPerBox, pillsPerBox: base.pillsPerBox, gtin: base.gtin||"",
    lowStockAt: base.lowStockAt, noWarn: !!base.noWarn, sTag: !!base.sTag, deleted: !!base.deleted,
    deletedBy: base.deleted ? (base.deletedBy||"") : undefined, deletedAt: base.deleted ? (base.deletedAt||0) : undefined,
    createdAt: a.createdAt || b.createdAt || undefined,     // was dropped by every sync merge, so "when added" was lost
    updatedAt: Math.max(aT,bT),
    batches: reconcileBatchesForSync(a.batches, b.batches)
  };
}
function reconcileInventoryForSync(localInv, remoteInv){
  const remoteMap = new Map((remoteInv||[]).map(m=>[m.id,m]));
  const seen = new Set();
  const result = (localInv||[]).map(lm=>{
    seen.add(lm.id);
    const rm = remoteMap.get(lm.id);
    return rm ? pickNewerMedicine(lm, rm) : lm;
  });
  (remoteInv||[]).forEach(rm=>{
    if(!seen.has(rm.id)) result.push({...rm, batches:(rm.batches||[]).slice()});
  });
  result.forEach(recomputeStock);
  return result;
}
// Last-write-wins merge by id, for the LIVE cloud path only (bills, notes, profiles). Unlike
// mergeById (additive-only — used by the offline backup file, see below), this actually lets a
// newer edit or a soft-delete tombstone on one device overwrite the stale copy on another,
// instead of the always-newer local/remote scan just re-adding whatever the other side still has.
function mergeByIdForSync(localArr, incomingArr){
  const incomingMap = new Map((incomingArr||[]).map(x=>[x.id,x]));
  const seen = new Set();
  const result = (localArr||[]).map(l=>{
    seen.add(l.id);
    const r = incomingMap.get(l.id);
    if(!r) return l;
    const lt = l.updatedAt||l.timestamp||0, rt = r.updatedAt||r.timestamp||0;
    if(rt===lt) return (r.deleted && !l.deleted) ? r : l;   // same timestamp: a deletion wins, so a removed item can't come back
    return rt>lt ? r : l;
  });
  (incomingArr||[]).forEach(r=>{ if(!seen.has(r.id)) result.push(r); });
  return result;
}
// Monthly correction totals are a plain {month: {...}} object, not an id-keyed array, so they
// get their own merge: per month key, keep whichever side's correction was saved most recently.
// Simple scalar setting, same last-write-wins shape as everything else here: whichever side
// touched it more recently wins outright — no need for per-field merging like the test
// catalog has, since it's a single number, not a list of independent items.
function mergeDefaultDoctorFee(data){
  const incomingTs = data.defaultDoctorFeeUpdatedAt || 0;
  if(incomingTs > defaultDoctorFeeUpdatedAt){
    defaultDoctorFee = data.defaultDoctorFee || 0;
    defaultDoctorFeeUpdatedAt = incomingTs;
    saveDefaultDoctorFeeStorage();
    saveDefaultDoctorFeeUpdatedAt();
    // bill.fee is copied from defaultDoctorFee only once, at the moment a New Bill screen is
    // created (see newBillState()) — usually before sync has even had a chance to run, since
    // that happens at app startup. So defaultDoctorFee itself merging correctly isn't enough:
    // the already-displayed fee field has no way to react to a value that arrives later and
    // would otherwise keep showing a stale number forever, until the user happened to start a
    // brand new bill or edit the fee by hand. Refresh it now — but ONLY when the current bill
    // is still completely untouched (no patient, no items/tests/extras, not mid-edit), so a
    // bill the user has actually started is never silently changed under them.
    if(typeof bill!=="undefined" && bill && !bill.patient.trim() && bill.items.length===0 && bill.extras.length===0 && bill.tests.length===0 && !bill.feeEditing){
      bill.fee = defaultDoctorFee ? String(defaultDoctorFee) : "";
    }
  }
}
// Both category lists travel together as one unit: whichever device edited them most recently
// wins outright. (Whole-list rather than per-item merging is what lets a DELETE propagate —
// a union merge would just bring a deleted category back from the other device.)
function mergeCategories(data){
  const incomingTs = data.categoriesUpdatedAt || 0;
  if(incomingTs > categoriesUpdatedAt && Array.isArray(data.medCategories) && Array.isArray(data.specialCategories)){
    MED_CATEGORIES = data.medCategories.slice();
    SPECIAL_CATEGORIES = data.specialCategories.slice();
    categoriesUpdatedAt = incomingTs;
    saveMedCategoriesStorage();
    saveSpecialCategoriesStorage();
    try{ localStorage.setItem("clinic_categories_updated_at", String(categoriesUpdatedAt)); }catch(e){}
  }
}
// The admin-request/answer handshake for per-user history: tiny, so merged per-id, last-write-
// wins, exactly like mergeMonthAdjustments — never the bulk activityLog, only this metadata.
function mergeHistorySync(data){
  const mergedReq = {...historyRequests};
  Object.entries(data.historyRequests||{}).forEach(([id,r])=>{
    const cur = mergedReq[id];
    if(!cur || (r.requestedAt||0) > (cur.requestedAt||0)) mergedReq[id] = r;
  });
  historyRequests = mergedReq;

  const mergedResp = {...historyResponses};
  Object.entries(data.historyResponses||{}).forEach(([id,r])=>{
    const cur = mergedResp[id];
    if(!cur || (r.respondedAt||0) > (cur.respondedAt||0)) mergedResp[id] = r;
  });
  historyResponses = mergedResp;

  saveHistoryRequests(); saveHistoryResponses();
}
function mergeDefaultDoctorName(data){
  const incomingTs = data.defaultDoctorNameUpdatedAt || 0;
  if(incomingTs > defaultDoctorNameUpdatedAt){
    const oldDefault = defaultDoctorName;
    defaultDoctorName = data.defaultDoctorName || "";
    defaultDoctorNameUpdatedAt = incomingTs;
    saveDefaultDoctorNameStorage();
    saveDefaultDoctorNameUpdatedAt();
    // Same reasoning as mergeDefaultDoctorFee, but comparing against the OLD default rather than
    // requiring an exact "" — a bill created before this sync arrived is already pre-filled with
    // whatever the default WAS at that moment, not blank, so requiring "" here meant a bill
    // already open when a newer default name arrived from another device just kept showing the
    // stale name until a brand new bill was started. Comparing against oldDefault instead means
    // "still exactly what the (old) default put there, never touched by the user" refreshes too.
    if(typeof bill!=="undefined" && bill && !bill.patient.trim() && bill.items.length===0 && bill.extras.length===0 && bill.tests.length===0 && bill.remarks===oldDefault){
      bill.remarks = defaultDoctorName || "";
    }
  }
}
function mergeMonthAdjustments(localAdj, incomingAdj){
  const result = {...(localAdj||{})};
  Object.entries(incomingAdj||{}).forEach(([mk,ia])=>{
    const la = result[mk];
    if(!la || (ia.updatedAt||0) > (la.updatedAt||0)) result[mk] = ia;
  });
  return result;
}
// Test catalog & pricing (custom tests, renamed/hidden built-ins, and prices) is synced, one
// test at a time, by that test's own testItemUpdatedAt entry — NOT as one all-or-nothing
// bundle. The old version compared a single shared timestamp for the whole catalog, so if
// Phone A added "Uric Acid" (bumping the shared time) while Phone B had, at any point, made
// its OWN unrelated test edit with a later timestamp, B's next sync would completely
// overwrite the catalog with its own version — silently discarding Uric Acid and anything
// else A had added or priced, and vice-versa. Comparing per test id instead means each
// test's own history decides its own outcome, so two devices' different additions/prices
// combine instead of one wiping out the other.
function mergeTestSettings(data){
  const incomingItemTs = data.testItemUpdatedAt || {};
  // Old backup files / not-yet-updated devices have no per-id times at all — for those,
  // fall back to their whole-bundle time as a stand-in per-id time for every id they have
  // data for, so merging against them still behaves sensibly.
  const incomingBundleTs = data.testSettingsUpdatedAt || 0;
  const incomingCustomById = {}; (data.customTests||[]).forEach(t=>{ incomingCustomById[t.id]=t; });
  const localCustomById = {}; customTests.forEach(t=>{ localCustomById[t.id]=t; });
  const incomingNameOverrides = data.testNameOverrides || {};
  const incomingHiddenSet = new Set(data.hiddenBuiltInTestIds || []);
  const localHiddenSet = new Set(hiddenBuiltInTestIds);
  const incomingPrices = data.testPrices || {};

  const ids = new Set([
    ...TEST_CATALOG.map(t=>t.id),
    ...customTests.map(t=>t.id),
    ...(data.customTests||[]).map(t=>t.id)
  ]);

  const mergedCustomById = {};
  const mergedNameOverrides = {};
  const mergedHidden = [];
  const mergedPrices = {};
  const mergedItemTs = {...testItemUpdatedAt};

  ids.forEach(id=>{
    const localTs = testItemUpdatedAt[id] || 0;
    const hasIncomingData = incomingCustomById[id]!=null || incomingNameOverrides[id]!=null || incomingHiddenSet.has(id) || incomingPrices[id]!=null;
    const inTs = incomingItemTs[id] || (hasIncomingData ? incomingBundleTs : 0);
    const incomingWins = inTs > localTs;
    mergedItemTs[id] = incomingWins ? inTs : localTs;

    const winningCustom = incomingWins ? incomingCustomById[id] : localCustomById[id];
    if(winningCustom) mergedCustomById[id] = winningCustom;

    const winningOverride = incomingWins ? incomingNameOverrides[id] : testNameOverrides[id];
    if(winningOverride!=null) mergedNameOverrides[id] = winningOverride;

    const winningHidden = incomingWins ? incomingHiddenSet.has(id) : localHiddenSet.has(id);
    if(winningHidden) mergedHidden.push(id);

    const winningPrice = incomingWins ? incomingPrices[id] : testPrices[id];
    if(winningPrice!=null) mergedPrices[id] = winningPrice;
  });

  customTests = Object.values(mergedCustomById);
  testNameOverrides = mergedNameOverrides;
  hiddenBuiltInTestIds = mergedHidden;
  testPrices = mergedPrices;
  testItemUpdatedAt = mergedItemTs;
  testSettingsUpdatedAt = Math.max(testSettingsUpdatedAt, incomingBundleTs); // legacy marker only

  saveCustomTests(); saveTestNameOverrides(); saveHiddenBuiltInTests(); saveTestPrices(); saveTestSettingsUpdatedAt(); saveTestItemUpdatedAt();
}

function mergeDataInto(data, inventoryMergeFn, live, scope){
  // scope: "full" = everything (original behaviour) · "shared" = staff, branch list, tests, categories, notes only
  //        · "branch" = only THIS branch's stock, bills and monthly corrections
  scope = scope || "full";
  const doBranchData = scope!=="shared", doShared = scope!=="branch";

  if(doBranchData){
    inventory = inventoryMergeFn(inventory, data.inventory);
    if(live){
      transactions = mergeByIdForSync(transactions, data.transactions);
    } else {
      transactions = mergeById(transactions, data.transactions);
    }
    transactions.sort((a,b)=>b.timestamp-a.timestamp);
    // Monthly corrections: keyed by month, not an array of records — for each month, whichever
    // side touched it most recently wins. Safe either way since it's just an override number,
    // never a quantity that could be double-counted or lost.
    monthAdjustments = mergeMonthAdjustments(monthAdjustments, data.monthAdjustments);
    billDocs = mergeBillDocs(billDocs, data.billDocs);     // which extra bill documents exist (see "Cloud storage that does not run out")
  }

  if(doShared){
    if(live){
      profiles = mergeByIdForSync(profiles, data.profiles);
    } else {
      const profResult = (profiles||[]).slice();
      (data.profiles||[]).forEach(ip=>{
        let match = profResult.find(p=>p.id===ip.id);
        if(!match) match = profResult.find(p=>p.name.trim().toLowerCase()===ip.name.trim().toLowerCase());
        if(!match) profResult.push(ip);
      });
      profiles = profResult;
    }
    branches = live ? mergeByIdForSync(branches, data.branches) : mergeById(branches, data.branches);

    const incomingNotes = data.notesByProfile || {};
    profiles.forEach(p=>{
      let localNotes;
      try{ localNotes = JSON.parse(localStorage.getItem("clinic_notes_"+p.id)||"[]"); }catch(e){ localNotes=[]; }
      const merged = live ? mergeByIdForSync(localNotes, incomingNotes[p.id]) : mergeById(localNotes, incomingNotes[p.id]);
      merged.sort((a,b)=>(b.updatedAt||0)-(a.updatedAt||0));
      try{ localStorage.setItem("clinic_notes_"+p.id, JSON.stringify(merged)); }catch(e){}
    });
    mergeTestSettings(data);
    mergeDefaultDoctorFee(data);
    mergeDefaultDoctorName(data);
    mergeCategories(data);
    mergeHistorySync(data);
  }

  if(doBranchData){ saveInventory(); saveTransactions(); saveMonthAdjustments(); saveBillDocs(); }
  if(doShared){
    saveProfiles(); saveBranches();
    if(currentProfileId && !visibleProfiles().some(p=>p.id===currentProfileId)){
      // The logged-in profile was deleted (e.g. by an admin on another device) — force a re-login
      // rather than silently auto-picking a different profile, since that would bypass the PIN gate.
      currentProfileId = null;
      sessionAuthed = false;
      try{ localStorage.setItem("clinic_session_authed", "0"); }catch(e){}
    }
    loadNotesForCurrentProfile();
    setTimeout(enforceBranchForCurrentUser, 0);   // someone may just have been moved to another branch
  }
}
// Offline backup file import — unchanged, additive/never-overwrite merge. Two phones may have
// been apart for weeks, so this must never let one side's file silently delete or clobber
// something real the other side entered independently.
function mergeBackupInto(data){ mergeDataInto(data, mergeInventory, false, "full"); }
// Live Firestore sync — last-write-wins for inventory, bills, notes, and profiles, so an edit,
// restock, sale, warning toggle, or DELETE made on one phone correctly propagates to the other
// instead of being silently ignored (or the deleted item quietly reappearing a second later).
function mergeCloudSnapshotInto(data, scope){ mergeDataInto(data, reconcileInventoryForSync, true, scope||"full"); }

/* ---- Smaller cloud copy (dead-weight clean-up) ----
   Only the copy SENT to the cloud is trimmed — the data on every phone is left exactly as it is.
   A batch is left out of the cloud copy only when ALL of these are true: it is used up (0 left) or
   marked disposed, AND it has a timestamp, AND that timestamp is more than a year old. Such a batch
   no longer affects stock, prices or warnings. Phones that already have it keep it (batches merge by id,
   so nothing is deleted anywhere); a brand-new phone just won't download year-old used-up batches. */
const CLOUD_TRIM_BATCH_AGE_MS = 365*24*60*60*1000;
/* ===================== Cloud storage that does not run out ("extra documents") =====================
   Firestore refuses any document bigger than 1 MiB. Bills are the only part that grows without limit, so: while the main
   document (for a branch: that branch's document) is below about 70% full NOTHING changes. Once it reaches that, NEW bills
   are saved in a second document ("…__x1"), then a third ("…__x2") and so on. Bills already saved never move; a bill stays in
   the document it started in, so editing / returning / deleting an old bill updates that same document. Every phone listens to
   all of them and still sees ONE list of bills. Stock, staff and settings stay in the main document. */
const CLOUD_SPILL_AT = Math.round(1048576*0.70);          // a document this full stops receiving NEW bills
const CLOUD_NONSPILL_WARN_AT = Math.round(1048576*0.80);  // the part that cannot spill over (stock, staff, settings) → warn the Admin
let billDocs = [];                 // numbers of the extra bill documents of the branch on screen (1, 2, 3…); the main document is 0
const extraUnsubs = {};            // live listeners on the extra documents, keyed "branch:number"
function utf8Len(str){ try{ return new TextEncoder().encode(str).length; }catch(e){ return unescape(encodeURIComponent(str)).length; } }
function jsonBytes(o){ return utf8Len(JSON.stringify(o)); }
function saveBillDocs(){ try{ localStorage.setItem(bk("clinic_bill_docs"), JSON.stringify(billDocs)); }catch(e){} }
function mergeBillDocs(a, b){
  const set = new Set();
  (a||[]).concat(b||[]).forEach(n=>{ n = Number(n); if(n>=1) set.add(n); });
  return Array.from(set).sort((x,y)=>x-y);
}
function baseDocName(br){ br = br||activeBranchId; return br==="main" ? "state" : "branch_"+br; }
function baseDocRef(br){ br = br||activeBranchId; return br==="main" ? cloudDocRef() : branchDocRef(br); }
function extraDocRef(n, br){ return fbDb.collection("sync").doc(baseDocName(br)+"__x"+n); }
function tagTxs(arr, n){ return (arr||[]).map(t=>{ const c = {...t}; if(n>0) c._d = n; else delete c._d; return c; }); }
function mergeExtraDocTxs(n, data){
  if(!data) return;
  transactions = mergeByIdForSync(transactions, tagTxs(data.transactions, n));
  transactions.sort((a,b)=>b.timestamp-a.timestamp);
}
function saveTransactionsQuiet(){
  try{ localStorage.setItem(bk("clinic_transactions"), JSON.stringify(transactions)); }catch(e){}
  _visibleTxCache = null;
}
// If the cloud's security rules do not allow documents named like "state__x1", starting an extra document makes the WHOLE save
// fail. So when that happens (permission-denied while creating a new extra document) the phone remembers it for 6 hours and
// saves the old way instead — every bill in the main document, which works until that document is really full — rather than
// stopping all syncing. (Fix: allow documents of the "sync" collection in the Firestore rules.)
function spillBlocked(){ try{ return Date.now() < Number(localStorage.getItem("clinic_spill_blocked")||0); }catch(e){ return false; } }
function cloudTxFor(n){ return (transactions||[]).filter(t=>(t._d||0)===n); }   // bills that live in document n (0 = main)

// Decides which cloud document every bill belongs in. remoteTx = {documentNumber: bills as read from that document}, existing = the
// extra documents that exist. Bills already in the cloud keep their document; only bills that are in NO document yet (new ones, or
// made while offline) are placed — into the newest document, and into the next one as soon as that would pass the 70% mark.
function planBillDocs(remoteTx, existing, sizeBase, sizeExtra){
  const where = new Map();
  Object.keys(remoteTx).forEach(k=>(remoteTx[k]||[]).forEach(t=>where.set(t.id, Number(k))));
  const parts = {}, unwritten = [];
  (transactions||[]).forEach(t=>{
    if(where.has(t.id)){ const n = where.get(t.id); if(n>0) t._d = n; else delete t._d; (parts[n] = parts[n]||[]).push(t); }
    else unwritten.push(t);
  });
  const newest = Math.max(0, ...existing);
  const spillLimit = spillBlocked() ? Number.MAX_SAFE_INTEGER : CLOUD_SPILL_AT;   // see spillBlocked()
  let w = newest;
  let size = w===0 ? sizeBase(parts[0]||[]) : sizeExtra(w, parts[w]||[]);
  const newDocs = new Set();
  unwritten.sort((a,b)=>(a.timestamp||0)-(b.timestamp||0)).forEach(t=>{
    const b = utf8Len(JSON.stringify(t)) + 2;
    if(size + b > spillLimit){ w++; size = sizeExtra(w, []); }
    if(w>0) t._d = w; else delete t._d;
    (parts[w] = parts[w]||[]).push(t); size += b;
    if(w>newest) newDocs.add(w);
  });
  return { parts, newDocs: Array.from(newDocs).sort((x,y)=>x-y), newest };
}
// Inside ONE Firestore transaction: read the base document and every extra document, merge them into this phone, then work out where each bill goes.
async function cloudSyncDataDocs(t, br, baseSnap, scope, guard, stillHere, buildBase){
  const remoteTx = { 0: [] }, existing = [], readSet = new Set(), remoteVer = {};
  const note = (n, arr)=>{ remoteTx[n] = arr||[]; const m = new Map(); (arr||[]).forEach(x=>m.set(x.id, x.updatedAt||x.timestamp||0)); remoteVer[n] = m; };
  if(baseSnap.exists){
    const d = baseSnap.data(); note(0, d.transactions);
    suppressPush = true; try{ mergeCloudSnapshotInto(d, scope); } finally { suppressPush = false; }
  } else note(0, []);
  const readExtra = async n=>{
    if(readSet.has(n)) return; readSet.add(n);
    const s2 = await t.get(extraDocRef(n, br)); stillHere(); guard.check();
    if(s2.exists){
      const d = s2.data(); existing.push(n); note(n, d.transactions);
      suppressPush = true; try{ mergeExtraDocTxs(n, d); } finally { suppressPush = false; }
    }
  };
  for(const n of mergeBillDocs(billDocs, [])) await readExtra(n);
  const sizeBase = txs => jsonBytes(sanitizeForFirestore(buildBase(txs, [])));
  const sizeExtra = (n, txs) => jsonBytes({ syncCode:SYNC_CODE, part:n, branchId:br, transactions:txs, updatedAt:Date.now() });
  let plan;
  for(let round=0; round<8; round++){
    plan = planBillDocs(remoteTx, existing, sizeBase, sizeExtra);
    // a document we are about to create is READ first, so if another phone just created it we notice (and the transaction retries) instead of overwriting it
    const unread = plan.newDocs.filter(n=>!readSet.has(n));
    if(!unread.length) break;
    for(const n of unread) await readExtra(n);
  }
  return { plan, existing, remoteVer };
}
// Writes (inside the same transaction): the base document always (as before), and only those extra documents that are new or changed.
function cloudWriteDataDocs(t, br, ctx, buildBase){
  const all = new Set(ctx.existing); ctx.plan.newDocs.forEach(n=>all.add(n));
  const list = Array.from(all).sort((x,y)=>x-y);
  t.set(baseDocRef(br), sanitizeForFirestore(buildBase(ctx.plan.parts[0]||[], list)));
  list.forEach(n=>{
    const txs = ctx.plan.parts[n]||[], rv = ctx.remoteVer[n] || new Map();
    const changed = ctx.plan.newDocs.indexOf(n)>=0 || txs.some(x=>!rv.has(x.id) || (x.updatedAt||x.timestamp||0) > rv.get(x.id));
    if(changed) t.set(extraDocRef(n, br), sanitizeForFirestore({ syncCode:SYNC_CODE, part:n, branchId:br, transactions:txs, updatedAt:Date.now() }));
  });
  return list;
}
function cloudAfterCommit(ctx, list, br){
  if(br!==activeBranchId) return;
  billDocs = mergeBillDocs(billDocs, list); saveBillDocs();
  saveTransactionsQuiet();                     // remember which document each bill lives in
  if(ctx.plan.newDocs.length){
    try{ localStorage.setItem("clinic_cloud_extra_added", String(Date.now())); }catch(e){}
    showToast("☁ Cloud storage: extra document added");
    if(typeof diagLog==="function") diagLog("cloud", "extra bill document(s) added: "+ctx.plan.newDocs.join(", "));
  }
  syncExtraListeners();
  cloudCheckNonSpill();
}
// The only part that cannot spill over is stock + staff + settings: tell the Admin (at most every 12 hours) if it passes 80% of a document.
let _cloudNonSpillBytes = 0;
function cloudCheckNonSpill(){
  try{
    const p = activeBranchId==="main" ? buildCloudPayload([]) : buildBranchPayload([]);
    _cloudNonSpillBytes = jsonBytes(sanitizeForFirestore(p));
    if(_cloudNonSpillBytes>=CLOUD_NONSPILL_WARN_AT){
      const last = Number(localStorage.getItem("clinic_cloud_nonspill_warn")||0);
      if(Date.now()-last > 12*3600*1000){
        localStorage.setItem("clinic_cloud_nonspill_warn", String(Date.now()));
        showToast(`⚠ Cloud: stock, staff and settings use ${Math.round(_cloudNonSpillBytes/1048576*100)}% of a document — open Settings › Storage & health`);
      }
    }
  }catch(e){}
}
function stopExtraListeners(){ Object.keys(extraUnsubs).forEach(k=>{ try{ extraUnsubs[k](); }catch(e){} delete extraUnsubs[k]; }); }
// Listen to every extra document of this branch (new phones and newly created documents are picked up automatically).
function syncExtraListeners(){
  if(!fbDb) return;
  const br = activeBranchId;
  mergeBillDocs(billDocs, []).forEach(n=>{
    const key = br+":"+n; if(extraUnsubs[key]) return;
    try{
      extraUnsubs[key] = extraDocRef(n, br).onSnapshot(snap=>{
        if(br!==activeBranchId || !snap.exists) return;
        suppressPush = true; try{ mergeExtraDocTxs(n, snap.data()); saveTransactions(); } finally { suppressPush = false; }
        scheduleSearchRender();
      }, err=>{ delete extraUnsubs[key]; setSyncError(err); });
    }catch(e){}
  });
}
async function fetchExtraDocsOnce(){
  if(!fbDb) return;
  const br = activeBranchId;
  for(const n of mergeBillDocs(billDocs, [])){
    try{
      const s2 = await withTimeout(extraDocRef(n, br).get(), 10000);
      if(s2.exists && br===activeBranchId){ suppressPush = true; try{ mergeExtraDocTxs(n, s2.data()); saveTransactions(); } finally { suppressPush = false; } }
    }catch(e){}
  }
  scheduleSearchRender();
}
function buildMainBase(txs, list){ const p = buildCloudPayload(txs); p.billDocs = list; return p; }
function buildBranchBase(txs, list){ const p = buildBranchPayload(txs); p.billDocs = list; return p; }

function trimInventoryForCloud(inv){
  const cutoff = Date.now()-CLOUD_TRIM_BATCH_AGE_MS; let removed = 0;
  const out = (inv||[]).map(m=>{
    const bs = m && m.batches; if(!bs || !bs.length) return m;
    const keep = bs.filter(b=>{
      const t = (b.updatedAt||b.addedAt||0);
      const deadAndOld = (b.disposed || !(b.pillsRemaining>0)) && t>0 && t<cutoff;
      if(deadAndOld) removed++;
      return !deadAndOld;
    });
    return keep.length===bs.length ? m : {...m, batches:keep};
  });
  trimInventoryForCloud.lastRemoved = removed;
  return out;
}
function buildCloudPayload(txs){
  const p = buildFullStatePayload();
  p.inventory = trimInventoryForCloud(p.inventory);
  if(txs) p.transactions = txs;      // only the bills that belong in THIS document (see planBillDocs)
  return p;
}
function buildFullStatePayload(){
  return {
    syncCode: SYNC_CODE,
    inventory, transactions, profiles, monthAdjustments, branches, branchId: activeBranchId, billDocs,
    notesByProfile: collectAllNotes(),
    customTests, testNameOverrides, hiddenBuiltInTestIds, testPrices, testSettingsUpdatedAt, testItemUpdatedAt,
    defaultDoctorFee, defaultDoctorFeeUpdatedAt,
    defaultDoctorName, defaultDoctorNameUpdatedAt,
    medCategories: MED_CATEGORIES, specialCategories: SPECIAL_CATEGORIES, categoriesUpdatedAt,
    historyRequests, historyResponses,
    updatedAt: Date.now()
  };
}
// Branch devices never write their stock/bills into the shared "state" document (that one holds the MAIN branch's
// data) — they send only the shared part there, and their own stock/bills to their own document.
function buildSharedPayload(){
  const p = buildFullStatePayload();
  delete p.inventory; delete p.transactions; delete p.monthAdjustments; delete p.branchId; delete p.billDocs;
  return p;
}
function buildBranchPayload(txs){
  return { syncCode: SYNC_CODE, branchId: activeBranchId, inventory: trimInventoryForCloud(inventory), transactions: txs || transactions, monthAdjustments, billDocs, updatedAt: Date.now() };
}
function syncScope(){ return activeBranchId==="main" ? "full" : "shared"; }
function branchDocRef(id){ return fbDb.collection("sync").doc("branch_"+(id||activeBranchId)); }
function renderSyncBadge(){
  const el = document.getElementById("syncBadge");
  if(!el) return;
  const map = { syncing:"☁ Syncing…", synced:"☁ Synced", cached:"☁ Offline (cached)", offline:"☁ Offline", error:"☁ Sync error" };
  el.textContent = map[syncStatus] || "";
  el.style.opacity = (syncStatus==="synced" || syncStatus==="syncing") ? ".85" : ".6";
}
function renderCloudSizeBadge(){
  const el = document.getElementById("cloudSizeBadge");
  if(!el) return;
  const bytes = estimatedCloudDataSize();
  el.textContent = (bytes!=null && fbDb) ? `(${formatBytes(bytes)}${billDocs.length?` + ${billDocs.length} extra doc${billDocs.length===1?"":"s"}`:""})` : "";
}
function formatSyncError(e){
  if(!e) return "Unknown error";
  const code = e.code ? `[${e.code}] ` : "";
  const msg = e.message || String(e);
  return code + msg;
}
function setSyncError(e){
  const msg = formatSyncError(e);
  if(typeof diagLog==="function") diagLog("sync", msg);
  // "unavailable" / "client is offline" just means the phone can't reach the server right now. The
  // header badge already says "Offline" and everything is kept on the phone and uploaded later, so
  // no warning banner for that. Real problems (permissions, quota, bad data...) still show.
  if((e && e.code==="unavailable") || /client is offline|failed to get document because|network error|timed out/i.test(msg) || navigator.onLine===false) return;
  lastSyncError = msg;
  renderSyncBanner();
}
function clearSyncError(){
  if(!lastSyncError) return;
  lastSyncError = null;
  renderSyncBanner();
}
function dismissSyncError(){ lastSyncError = null; renderSyncBanner(); }
function copySyncError(){
  if(!lastSyncError) return;
  const text = lastSyncError;
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(()=>showToast("✓ Error copied")).catch(()=>showToast(text));
  } else { showToast(text); }
}
function renderSyncBanner(){
  const el = document.getElementById("banner");
  if(!el) return;
  if(!lastSyncError){ el.style.display="none"; el.innerHTML=""; return; }
  el.style.display="flex";
  el.innerHTML = `
    <span style="flex:1;word-break:break-word;">⚠ Cloud sync problem: ${esc(lastSyncError)}</span>
    <button onclick="copySyncError()" style="background:none;border:1px solid currentColor;border-radius:6px;padding:2px 8px;font-size:11px;font-weight:700;color:inherit;cursor:pointer;">Copy</button>
    <button onclick="dismissSyncError()" style="background:none;border:none;color:inherit;font-weight:700;cursor:pointer;font-size:14px;">✕</button>`;
}
function applyRemoteSnapshot(data, scope){
  if(!data) return;
  suppressPush = true;
  mergeCloudSnapshotInto(data, scope || syncScope());
  suppressPush = false;
  if(scope!=="branch") processHistorySync();
  if(scope!=="shared") syncExtraListeners();     // the list of extra bill documents may just have changed
  // Routed through the same trailing-debounce used for search boxes so a background sync event
  // can never land mid-keystroke in any search box on any tab.
  scheduleSearchRender();
}
// ── Background auto-upload of offline changes ───────────────────────────────
// Every genuine local edit sets a persistent "changes waiting to upload" flag (survives closing
// the app / restarting the phone). The flag is cleared only after a push that started after the
// LAST edit succeeds. Anything that hints connectivity may be back — the browser's online event,
// the connection changing, the app coming back to the foreground, a 15s timer, or app start —
// calls trySyncNow(), which uploads if the flag is set (or the last sync wasn't "synced").
// A web page can't run while the app is fully closed; this covers everything short of that.
const PENDING_SYNC_KEY = "clinic_pending_sync";
let pendingSeq = 0;
function markPendingSync(){
  pendingSeq++;
  try{ localStorage.setItem(bk(PENDING_SYNC_KEY), String(Date.now())); }catch(e){}
}
function hasPendingSync(){
  try{ return !!localStorage.getItem(bk(PENDING_SYNC_KEY)); }catch(e){ return pendingSeq>0; }
}
function clearPendingSyncIf(seqAtStart){
  if(seqAtStart!==pendingSeq) return; // a newer edit arrived mid-push — keep the flag
  try{ localStorage.removeItem(bk(PENDING_SYNC_KEY)); }catch(e){}
}
// If the app was opened with no internet, the Firebase scripts (loaded from the web) may not
// have loaded and fbDb stays null. This loads/initialises them as soon as we're online again.
let _fbLoading = false;
function ensureFirebase(){
  if(fbDb || _fbLoading) return;
  if(navigator.onLine===false) return;
  const init = function(){
    try{
      if(typeof firebase==="undefined") return false;
      if(!firebase.apps || !firebase.apps.length) firebase.initializeApp(firebaseConfig);
      fbDb = firebase.firestore();
      startCloudSync();
      setTimeout(trySyncNow, 2000);
      return true;
    }catch(e){ console.error("Firebase late init failed", e); return false; }
  };
  if(typeof firebase!=="undefined"){ init(); return; }
  _fbLoading = true;
  const load = function(src, cb){
    const el = document.createElement("script");
    el.src = src; el.onload = cb; el.onerror = function(){ _fbLoading=false; };
    document.head.appendChild(el);
  };
  load("https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js", function(){
    load("https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js", function(){
      _fbLoading = false; init();
    });
  });
}
function trySyncNow(){
  if(!fbDb){ ensureFirebase(); return; }
  if(pushInFlight) return;
  if(hasPendingSync() || (syncStatus!=="synced" && syncStatus!=="syncing")) pushToCloud();
}
function schedulePushToCloud(urgent){
  if(suppressPush) return;
  markPendingSync();
  if(!fbDb){ ensureFirebase(); return; }
  clearTimeout(syncDebounceTimer);
  syncDebounceTimer = setTimeout(pushToCloud, urgent ? 250 : 1200);
}
// Wraps a Firestore promise so a genuinely dead connection resolves to "Offline" within 10s
// instead of hanging forever — Firestore's own promises don't reject when offline, they just
// never resolve, which is exactly what forced a manual refresh to recover before.
function withTimeout(promise, ms){
  return Promise.race([
    promise,
    new Promise((_,reject)=>setTimeout(()=>reject(new Error("timed out")), ms))
  ]);
}
// withTimeout() above only stops US from waiting on a Firestore promise — Promise.race can't
// actually cancel it, so a "timed out" write keeps running for real in the background and can
// still commit later, after the caller has already told the user it failed and possibly started
// a brand-new attempt on the same document. An abandon guard lets a still-running transaction
// callback notice, at its next checkpoint, that the attempt it belongs to has been given up on,
// and bail out (throwing aborts a Firestore transaction cleanly — nothing commits) instead of
// silently writing or re-merging cloud data after the fact. See runGuardedTx() below for the
// call pattern this pairs with.
function makeAbandonGuard(){
  const g = { abandoned:false };
  g.check = ()=>{ if(g.abandoned) throw Object.assign(new Error("abandoned (timed out)"), {__abandoned:true}); };
  return g;
}
// Runs a Firestore transaction with an abandon guard wired in: build(guard) must start and return
// the fbDb.runTransaction(...) promise, calling guard.check() at safe checkpoints inside its
// callback (before it starts, after each await, and right before any t.set/t.update). If the
// transaction doesn't finish within ms, this still throws "timed out" to the caller exactly like
// withTimeout() did before — the only change is that guard.abandoned becomes true first, so if
// the real transaction is still running, its next guard.check() throws and nothing it does from
// that point commits.
async function runGuardedTx(build, ms){
  const guard = makeAbandonGuard();
  const promise = build(guard);
  promise.catch(()=>{});   // nothing else is left awaiting this if it's the one that times out
  try{ await withTimeout(promise, ms); }
  catch(e){ guard.abandoned = true; throw e; }
}
// Firestore rejects any field whose value is literally `undefined` (unlike `null`, which is
// fine) and rejects the ENTIRE write the moment it finds one, however deeply buried. The bugs
// above (missing category/formula/mg on older medicine records) were one way that could sneak
// in — this is a safety net so no other undiscovered case can silently break every sync again.
// A JSON round-trip is a simple, thorough way to strip these out anywhere in the structure:
// it drops undefined object properties and turns undefined array entries into null, both of
// which Firestore accepts fine.
function sanitizeForFirestore(obj){ return JSON.parse(JSON.stringify(obj)); }
// Manual "Upload offline data" menu action — forces an immediate push right now instead of
// waiting for the normal 1.2s debounce or the next edit, for someone who was working offline
// and wants to confirm everything (bills, inventory, warnings, etc.) has reached the server.
function showUploadProgress(){
  const el = document.getElementById("uploadProgressBar");
  if(el) el.classList.remove("hidden");
  syncHeaderOffset();
}
function hideUploadProgress(){
  const el = document.getElementById("uploadProgressBar");
  if(el) el.classList.add("hidden");
  syncHeaderOffset();
}
async function manualPushToCloud(){
  if(!fbDb){ showToast("Cloud sync isn't set up on this device"); return; }
  clearTimeout(syncDebounceTimer);
  showToast("⬆ Uploading…");
  showUploadProgress();
  let allSynced = false;   // true exactly when the toast below says "synced" / "already synced" (used by the update button)
  try{
    await pushToCloud();
    // If a push was already running when this was tapped, pushToCloud() above just queued a
    // follow-up and returned immediately rather than actually finishing — wait for that queued
    // one too, so the toast reflects the real end result instead of firing too early.
    while(pushQueuedAgain || pushInFlight){ await new Promise(r=>setTimeout(r,200)); }
    if(syncStatus==="synced"){ allSynced = true; showToast("✓ Uploaded — everything is synced"); }
    else if(!hasPendingSync() && navigator.onLine!==false){ allSynced = true; showToast("✓ Nothing left to upload — everything is already synced"); }   // the check timed out but no unsent changes exist
    else showToast("⚠ Couldn't reach the server" + (lastSyncError ? " ("+String(lastSyncError).slice(0,80)+")" : "") + " — try again");
  } finally {
    hideUploadProgress();
  }
  return allSynced;
}
async function pushToCloud(){
  if(!fbDb) return;
  if(pushInFlight){
    // Another push is already running — just remember to run one more right after it finishes,
    // so whatever changed most recently still gets sent, without two pushes racing each other.
    pushQueuedAgain = true;
    return;
  }
  pushInFlight = true;
  const br = activeBranchId;                       // the branch this push belongs to
  const abort = { __branchSwitch:true };           // thrown if the phone moved to another branch mid-push (nothing is written then)
  const stillHere = ()=>{ if(br!==activeBranchId) throw abort; };
  const seqAtStart = pendingSeq;
  const wasSynced = (syncStatus === "synced");
  if(!wasSynced){ syncStatus = "syncing"; renderSyncBadge(); }
  let ctx = null, listOut = null;
  try{
    // Each save is ONE all-or-nothing step (read the cloud copy, combine it with this phone's, write it back). If another
    // phone saves in between, Firestore re-runs this step with the fresh copy — so two phones saving at the same moment can
    // no longer overwrite each other's bills.
    if(br==="main"){
      await runGuardedTx((guard)=>fbDb.runTransaction(async t=>{
        guard.check();
        const snap = await t.get(cloudDocRef());
        stillHere(); guard.check();
        const c = await cloudSyncDataDocs(t, br, snap, "full", guard, stillHere, buildMainBase);
        guard.check();
        const l = cloudWriteDataDocs(t, br, c, buildMainBase);
        ctx = c; listOut = l;
      }), 40000);
      stillHere(); processHistorySync();
    } else {
      // Branch phone: its own stock/bills live in their own document, the shared part is MERGED into "state"
      // (merge:true) so the main branch's stock/bills stored there are never touched.
      await runGuardedTx((guard)=>fbDb.runTransaction(async t=>{
        guard.check();
        const snap = await t.get(cloudDocRef());
        stillHere(); guard.check();
        if(snap.exists){ suppressPush=true; try{ mergeCloudSnapshotInto(snap.data(), "shared"); } finally { suppressPush=false; } }
        guard.check();
        t.set(cloudDocRef(), sanitizeForFirestore(buildSharedPayload()), { merge:true });
      }), 40000);
      stillHere(); processHistorySync();
      await runGuardedTx((guard)=>fbDb.runTransaction(async t=>{
        guard.check();
        const bsnap = await t.get(branchDocRef(br));
        stillHere(); guard.check();
        const c = await cloudSyncDataDocs(t, br, bsnap, "branch", guard, stillHere, buildBranchBase);
        guard.check();
        const l = cloudWriteDataDocs(t, br, c, buildBranchBase);
        ctx = c; listOut = l;
      }), 40000);
    }
    stillHere();
    if(ctx) cloudAfterCommit(ctx, listOut, br);
    stillHere();
    syncStatus = "synced";
    clearPendingSyncIf(seqAtStart);
    clearSyncError();
  }catch(e){
    if(e && e.__branchSwitch){ suppressPush=false; pushInFlight=false; return; }
    if(ctx && ctx.plan && ctx.plan.newDocs.length && !spillBlocked() && e && (e.code==="permission-denied" || /insufficient permissions/i.test(String(e.message||"")))){
      // The save needed a NEW extra document and the cloud rules refuse it: don't stop syncing — try again right away the old way.
      try{ localStorage.setItem("clinic_spill_blocked", String(Date.now()+6*3600*1000)); }catch(_){}
