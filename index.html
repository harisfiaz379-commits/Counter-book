// ── Native app (APK) update check ───────────────────────────────────────────
// This file's own HTML/JS content already self-updates on its own (see sw.js's
// network-first strategy) — nobody needs to do anything when only this file changes.
// But a change on the App Inventor project side itself (a new extension, a Screen
// property, etc.) needs a real new APK, and Android can't silently self-install that
// the way the web content updates — someone still has to tap to install it. This
// compares a small version.json (hosted in the same GitHub folder as this file)
// against the number the App Inventor project reports for itself, and shows a small
// dismissible banner with a direct download link when they differ, so people find out
// automatically instead of everyone having to remember to go ask.
//
// Wiring required on the App Inventor side (one-time), two parts:
//
// Part 1 — reporting the installed version — in Screen1.Initialize, BEFORE navigating
// the WebViewer to this app's URL (this app already has a Screen1.Initialize block that
// sets ScreenOrientation and the HideBars colors — just add one more line to it):
//   set WebViewer1.WebViewString to "1"
// — using whatever version number matches this build. Bump that text (and rebuild)
// every time you publish a new APK, and bump version.json's apkVersion to match on
// GitHub at the same time.
//
// Part 2 — actually opening the download — App Inventor's built-in WebViewer is
// documented to silently do nothing when a link to a downloadable file (like an .apk)
// is tapped inside it; it has no download handling at all. So tapping the banner's
// button below doesn't navigate anywhere itself — it sends "OPEN_URL:" + the link back
// through WebViewString, using the exact same outbound-command pattern this app already
// uses for EXPORT:, SHARE_TEXT:, SELECT_PRINTER, etc. Add ONE more branch to the very
// end of the existing WebViewer1.WebViewStringChange chain (no Clock/timer needed —
// that event already fires whenever JS sets WebViewString):
//   else if [1] starts at text [get value] piece "OPEN_URL:"
//   then set ActivityStarter1.Action to "android.intent.action.VIEW"
//        set ActivityStarter1.DataUri to (segment text [get value] start 10
//                                          length (length[get value] - 9))
//        call ActivityStarter1.StartActivity
// Requires one new non-visible component: ActivityStarter (Connectivity drawer). That
// opens the phone's normal browser (Chrome) with the APK link, which downloads it
// properly and shows the usual "Open" notification → Android's real install prompt.
// That opens the phone's normal browser (Chrome) with the APK link, which downloads
// it properly and shows the usual "Open" notification → Android's real install prompt.
function checkForAppUpdate(){
  try{
    if(typeof AppInventor === "undefined" || typeof AppInventor.getWebViewString !== "function") return;
    var installedVersion = AppInventor.getWebViewString();
    if(!installedVersion) return; // App Inventor side hasn't set this yet — nothing to compare against
    fetch("version.json?_=" + Date.now(), {cache:"no-store"})
      .then(function(r){ return r.ok ? r.json() : null; })
      .then(function(data){
        if(!data || !data.apkVersion || !data.apkUrl) return;
        if(String(data.apkVersion) === String(installedVersion)) return; // already current
        showAppUpdateBanner(data.apkUrl);
      })
      .catch(function(){}); // offline, or version.json not deployed yet — fail silent, not fatal
  }catch(e){}
}

function showAppUpdateBanner(apkUrl){
  if(document.getElementById("appUpdateBanner")) return; // don't stack duplicates
  var b = document.createElement("div");
  b.id = "appUpdateBanner";
  b.style.cssText = "position:fixed;left:0;right:0;top:var(--header-h);z-index:55;background:#B4650A;color:#fff;"+
    "padding:10px 14px;font-size:13px;display:flex;align-items:center;justify-content:center;gap:12px;flex-wrap:wrap;"+
    "box-shadow:0 2px 6px rgba(0,0,0,.2);";
  b.innerHTML = '<span>A new app version is available.</span>'+
    '<button type="button" onclick="uploadThenDownloadAppUpdate(\''+esc(apkUrl).replace(/'/g,"\\'")+'\', this)" '+
    'style="background:#fff;color:#B4650A;font-weight:700;border:none;border-radius:6px;padding:5px 12px;cursor:pointer;font-size:13px;">Upload offline data then download new app</button>'+
    '<button type="button" aria-label="Dismiss" style="background:none;border:none;color:#fff;opacity:.8;font-size:16px;'+
    'cursor:pointer;padding:0 4px;line-height:1;" onclick="this.parentElement.remove()">✕</button>';
  document.body.appendChild(b);
}

// Installing a new APK is a real reinstall from Android's point of view, and someone could be
// tapping this while offline work (a bill, a restock) hasn't reached the server yet — so this
// always uploads first (reusing the exact same "Upload offline data" flow as the sync menu,
// progress bar and toast included) and the download link only opens once that upload has
// actually confirmed everything reached the server. If it couldn't (no connection, etc.),
// manualPushToCloud()'s own toast already says so — the banner is left in place so they can
// just tap the same button again once they're back online, rather than risking a reinstall
// before today's bills/stock changes are actually saved anywhere but this device.
async function uploadThenDownloadAppUpdate(apkUrl, btn){
  const label = btn ? btn.textContent : null;
  if(btn){ btn.disabled = true; btn.textContent = "Uploading…"; }
  try{
    await manualPushToCloud();
  } finally {
    if(btn){ btn.disabled = false; btn.textContent = label; }
  }
  if(syncStatus === "synced") downloadAppUpdate(apkUrl);
}
function downloadAppUpdate(apkUrl){
  try{
    if(typeof AppInventor !== "undefined" && typeof AppInventor.setWebViewString === "function"){
      // Prefixed to match the app's existing command pattern (EXPORT:, SHARE_TEXT:, etc.) —
      // the App Inventor side has one dispatch table in WebViewer1.WebViewStringChange, and a
      // bare URL wouldn't match any of its existing branches. See the OPEN_URL: branch added
      // there, which hands this off to ActivityStarter to open in the real browser (Chrome),
      // since the WebViewer component itself can't download files.
      AppInventor.setWebViewString("OPEN_URL:" + apkUrl);
      return;
    }
  }catch(e){}
  window.open(apkUrl, "_blank"); // fallback when just testing this page in a normal browser
}
</script>
<script>
// Registers the service worker (sw.js, same folder) so the app is cached on first load and
// works fully offline afterward — needed once the app is loaded from a real URL (GitHub Pages)
// instead of a local file, since that's what fixed localStorage but on its own would otherwise
// require internet on every open.
//
// updateViaCache:'none' is the actual fix for "I have to clear the app's cache to see updates".
// sw.js already correctly calls skipWaiting()/clients.claim() — but neither of those can run if
// the browser never notices sw.js changed in the first place. GitHub Pages serves sw.js with an
// HTTP Cache-Control header, and by default the browser is allowed to reuse ITS OWN cached copy
// of that file (a completely different cache from anything this app's service worker manages)
// for a while after you push a new version — so the update check silently compares the new
// version against a stale copy of the old one and finds no difference. updateViaCache:'none'
// tells the browser to never use that HTTP cache for sw.js itself and always fetch it fresh,
// so a real edit is always seen right away.
if("serviceWorker" in navigator){
  window.addEventListener("load", ()=>{
    navigator.serviceWorker.register("sw.js", {updateViaCache:"none"}).then((reg)=>{
      // A brand-new service worker version can finish installing while the app is already open
      // (most likely: the app was left running/backgrounded rather than freshly opened) — skip-
      // Waiting()/clients.claim() mean it's ready and in control immediately, but the JS already
      // running in memory is still the OLD code until an actual page reload happens. Rather than
      // silently reloading out from under someone mid-bill, show the same small dismissible
      // banner style already used for native APK updates, so it's their choice when to apply it.
      function showWebUpdateBanner(){
        if(document.getElementById("webUpdateBanner")) return;
        var b = document.createElement("div");
        b.id = "webUpdateBanner";
        b.style.cssText = "position:fixed;left:0;right:0;top:var(--header-h);z-index:55;background:var(--primary);color:#fff;"+
          "padding:10px 14px;font-size:13px;display:flex;align-items:center;justify-content:center;gap:12px;flex-wrap:wrap;"+
          "box-shadow:0 2px 6px rgba(0,0,0,.2);";
        b.innerHTML = '<span>An updated version of the app is ready.</span>'+
          '<button type="button" style="background:#fff;color:var(--primary);font-weight:700;border:none;border-radius:6px;padding:5px 12px;cursor:pointer;font-size:13px;">Refresh now</button>'+
          '<button type="button" aria-label="Dismiss" style="background:none;border:none;color:#fff;opacity:.8;font-size:16px;cursor:pointer;padding:0 4px;line-height:1;">✕</button>';
        b.querySelector("button").onclick = ()=>window.location.reload();
        b.querySelectorAll("button")[1].onclick = ()=>b.remove();
        document.body.appendChild(b);
      }
      function watchInstalling(sw){
        if(!sw) return;
        sw.addEventListener("statechange", ()=>{
          // "installed" while a controller already exists means this is an UPDATE to an
          // already-running app, not the very first install on a brand-new device — only the
          // update case should ever prompt anyone to refresh.
          if(sw.state==="installed" && navigator.serviceWorker.controller) showWebUpdateBanner();
        });
      }
      watchInstalling(reg.installing);
      reg.addEventListener("updatefound", ()=>watchInstalling(reg.installing));
      // Explicitly re-check for updates whenever the app is resumed from the background — on a
      // phone the app is usually resumed rather than freshly loaded, so leaving update checks to
      // only happen "on load" means a long-running session could sit on stale code for days.
      document.addEventListener("visibilitychange", ()=>{
        if(document.visibilityState==="visible") reg.update().catch(()=>{});
      });
    }).catch((err)=>{ console.warn("SW register failed:", err); });
  });
}
</script>
