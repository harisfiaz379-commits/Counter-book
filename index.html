// ======================= Transfer medicine to another branch =======================
// Long-press a medicine card on the Inventory tab, drag it anywhere on screen and drop it on the branch name oval in the
// header. A menu then lists the other branches and asks for the quantity (boxes + loose pills).
// The stock leaves this branch at once; the transfer is saved as a small "xfer_..." record in the cloud and the receiving
// branch claims it exactly once (a database transaction) the next time any phone in that branch is online.
let xferUi = { medId:"", toId:"", boxes:"", pills:"", busy:false, manual:false, bq:{} };
let _xferDrag = null, _xferSuppressClickUntil = 0, transferUnsub = null;
const _xferClaiming = {};
function canTransferStock(){ const r = currentRole(); return !!sessionAuthed && (r==="admin" || r==="branchmanager") && visibleBranches().length>1; }
function xferTargets(){ return visibleBranches().filter(b=>b.id!==activeBranchId); }
// Identifies a medicine for cross-branch transfer. Used to be just name+strength+category, so two
// genuinely different products sharing a name and strength (a tablet vs a syrup of the same drug,
// or two different pack sizes) could be treated as "the same medicine" and merged into one entry
// at the destination branch. Formula (dosage form) and pack size are now part of the identity too —
// the price (mrpPerBox) deliberately isn't, since the same medicine can legitimately be priced
// differently at different branches, and that's not a reason to treat it as a different product.
function xferKey(m){ return [m.name, m.mg, m.category, m.formula, m.pillsPerBox].map(x=>String(x||"").trim().toLowerCase()).join("|"); }
function xferStockText(m){
  const ppb = Number(m.pillsPerBox)||0, st = Number(m.stockPills)||0;
  if(ppb>1 && st>=ppb){ const bx = Math.floor(st/ppb), rem = q6(st - bx*ppb); return `${bx} box${bx===1?"":"es"}${rem>0?` + ${fmtInt(rem)} pill${rem===1?"":"s"}`:""} (${fmtInt(st)} in all)`; }
  return `${fmtInt(st)} ${ppb>1?"pill"+(st===1?"":"s"):"piece"+(st===1?"":"s")}`;
}
function xferBatchQty(b, ppb){
  const q = xferUi.bq[b.id] || {};
  const bx = Number(String(q.boxes||"").replace(",","."))||0, pl = Number(String(q.pills||"").replace(",","."))||0;
  return q6((ppb>1 ? bx*ppb : bx) + pl);
}
function xferTotalPills(){
  const m = inventory.find(x=>x.id===xferUi.medId); if(!m) return 0;
  const ppb = Number(m.pillsPerBox)||0;
  if(xferUi.manual) return q6(fefoOrder(m).reduce((a,b)=>a+xferBatchQty(b,ppb),0));
  const bx = Number(String(xferUi.boxes).replace(",","."))||0, pl = Number(String(xferUi.pills).replace(",","."))||0;
  return q6((ppb>1 ? bx*ppb : bx) + pl);
}
// Which batches an AUTOMATIC transfer takes from, in this order:
//  • batches WITH an expiry date: the one expiring LAST goes first (older stock stays here and keeps selling first);
//  • batches with NO expiry date come after the dated ones — and if NO batch has an expiry date at all, the batch with the
//    HIGHEST MRP goes first (a batch with no MRP of its own counts at the medicine's current MRP), newest added breaking ties.
function xferAutoOrder(m){
  const t = b => b.expiryDate ? new Date(b.expiryDate).getTime() : NaN;
  const eff = b => (Number(b.mrpPerBox)>0 ? Number(b.mrpPerBox) : (Number(m.mrpPerBox)||0));
  const bs = activeBatches(m).slice();
  const dated = bs.filter(b=>!isNaN(t(b))).sort((a,b)=>(t(b)-t(a)) || ((b.addedAt||0)-(a.addedAt||0)));
  const undated = bs.filter(b=>isNaN(t(b))).sort((a,b)=>(eff(b)-eff(a)) || ((b.addedAt||0)-(a.addedAt||0)));
  return dated.concat(undated);
}
// Plan (nothing is changed) of how many pills come out of which batch for an automatic transfer of `total` pills.
function xferAutoPlan(m, total){
  let rem = total; const plan = [];
  for(const b of xferAutoOrder(m)){ if(rem<=0) break; const take = Math.min(Number(b.pillsRemaining)||0, rem); if(take<=0) continue; plan.push({ b, pills:q6(take) }); rem = q6(rem-take); }
  return { plan, rem };
}
function xferBatchLabel(b, m){

// ======================= Copy ALL medicine cards to another branch (Settings → Stock & data) =======================
// Sends only the cards (name, strength, category, pack size, low-stock level…), with stock 0 and NO price (MRP 0), to the other branch.
// A medicine the other branch already has (same name + strength + category) is skipped. Nothing is removed here.
// The other branch starts with NO stock, so every card arrives with its low-stock warning ON - the "we'll buy it later"
// (warnings off) choice belongs to the branch it was made in and is deliberately NOT carried over.
// It travels the same safe way as a stock transfer (outbox -> cloud copy of the other branch, applied exactly once by fixed ids).
const XFER_CARD_FIELDS = ["name","category","specialCategory","formula","mg","pillsPerBox","lowStockAt","gtin","sTag"];
function xferCardsApply(inv, d){
  const preexisting = new Set(inv.filter(x=>!x.deleted).map(xferKey));   // snapshot BEFORE this transfer touches anything
  const have = new Set(preexisting); let changed = false;
  // Which cards were silently dropped, and why — so a sender who expected N cards to land but
  // later sees N-1 (or fewer) in the other branch's ovals can find out exactly what happened
  // instead of just a mismatched total with no explanation. Two different reasons look the same
  // from outside (both are "this exact medicine already exists over there") but have different
  // causes: "dup" = the destination branch already had this exact medicine (same name + strength
  // + category + formula + pack size) before this transfer even started; "dupInBatch" = two of the
  // cards picked for THIS send already had that same identity as each other, so only the first one
  // landed — meaning that duplicate already existed side-by-side in the SENDING branch's own
  // inventory, before anything was sent.
  const skipped = [];
  (d.cards||[]).forEach((c,i)=>{
    const k = xferKey(c);
    if(have.has(k)){ skipped.push({ name:c.name||"Medicine", mg:c.mg||"", reason: preexisting.has(k) ? "dup" : "dupInBatch" }); return; }
    const id = "xm_"+d.id+"_"+i; if(inv.some(x=>x.id===id)) return;           // already added by this transfer (even if deleted since)
    have.add(k);
    inv.push({ id, name:c.name||"Medicine", category:c.category||"", specialCategory:c.specialCategory||"", formula:c.formula||"", mg:c.mg||"",
      mrpPerBox:0, pillsPerBox:c.pillsPerBox, stockPills:0, lowStockAt:(c.lowStockAt??0), batches:[], sTag:!!c.sTag, noWarn:false,   // always warn: new branch has 0 stock (ignores noWarn even from older queued transfers)

      gtin:c.gtin||"", createdAt:d.createdAt||Date.now(), updatedAt:Date.now(), deleted:false });
    changed = true;
  });
  d._cardsSkipped = skipped;   // read back by flushTransferOutbox() once this has actually reached the cloud copy of the other branch
  return changed;
}

function cardsCopyGo(){

// ---- long-press + drag a medicine card onto the branch oval ----
function xferOvalAt(x, y){
  const ovals = document.querySelectorAll("[data-branchoval]");
  for(const o of ovals){ const r = o.getBoundingClientRect(); if(x>=r.left-14 && x<=r.right+14 && y>=r.top-14 && y<=r.bottom+14) return o; }
  return null;
}
function xferBeginDrag(card, id, x, y){
  const m = inventory.find(z=>z.id===id); if(!m || m.deleted) return;
  if(!xferTargets().length){ showToast("Add another branch first"); return; }
  try{ window.getSelection().removeAllRanges(); }catch(e){}
  const g = card.cloneNode(true); g.removeAttribute("id"); g.querySelectorAll("[id]").forEach(n=>n.removeAttribute("id"));
  const w = Math.min(card.offsetWidth*0.92, window.innerWidth-24);
  g.className += " xfer-ghost"; g.style.width = w+"px"; g.style.left = (x-w/2)+"px"; g.style.top = (y-34)+"px";
  document.body.appendChild(g); card.classList.add("xfer-src"); document.body.classList.add("xfer-dragging");
  let hint = document.getElementById("xferHint");
  if(!hint){ hint = document.createElement("div"); hint.id = "xferHint"; document.body.appendChild(hint); }
  hint.textContent = "Drop on the 🏢 branch name at the top to transfer"; hint.style.display = "block";
  try{ if(navigator.vibrate) navigator.vibrate(25); }catch(e){}
  _xferDrag = { id, card, ghost:g, w };
}
function xferMoveDrag(e){
  const d = _xferDrag; if(!d) return;
  d.ghost.style.left = (e.clientX-d.w/2)+"px"; d.ghost.style.top = (e.clientY-34)+"px";
  const over = xferOvalAt(e.clientX, e.clientY);
  document.querySelectorAll("[data-branchoval]").forEach(o=>o.classList.toggle("xfer-hot", o===over));
}
function xferFinishDrag(e, cancelled){
  const d = _xferDrag; if(!d) return; _xferDrag = null;
  const over = (!cancelled && e) ? xferOvalAt(e.clientX, e.clientY) : null;
  d.ghost.remove(); d.card.classList.remove("xfer-src"); document.body.classList.remove("xfer-dragging");
  document.querySelectorAll("[data-branchoval]").forEach(o=>o.classList.remove("xfer-hot"));
  const hint = document.getElementById("xferHint"); if(hint) hint.style.display = "none";
  _xferSuppressClickUntil = Date.now()+400;
  if(over) openTransfer(d.id);
}
(function(){
  let timer = null, start = null;
  const cardOf = el => (el && el.closest) ? el.closest('[id^="invCard-"]') : null;
  document.addEventListener("pointerdown", e=>{
    if(tab!=="inventory" || !canTransferStock() || (e.pointerType==="mouse" && e.button!==0)) return;
    const card = cardOf(e.target); if(!card) return;
    if(e.target.closest("button,input,textarea,select,a,label")) return;
    start = { x:e.clientX, y:e.clientY, id:card.id.replace("invCard-",""), card };
    clearTimeout(timer); timer = setTimeout(()=>{ if(start) xferBeginDrag(start.card, start.id, start.x, start.y); }, 450);
  }, true);
  document.addEventListener("pointermove", e=>{
    if(_xferDrag){ xferMoveDrag(e); return; }
    if(start && Math.hypot(e.clientX-start.x, e.clientY-start.y) > 10){ clearTimeout(timer); start = null; }
  }, true);
  const end = e=>{ clearTimeout(timer); start = null; if(_xferDrag) xferFinishDrag(e, e.type==="pointercancel"); };
  document.addEventListener("pointerup", end, true); document.addEventListener("pointercancel", end, true);
  document.addEventListener("touchmove", e=>{ if(_xferDrag && e.cancelable) e.preventDefault(); }, { passive:false, capture:true });
  document.addEventListener("contextmenu", e=>{ if(cardOf(e.target) && (start || _xferDrag)) e.preventDefault(); }, true);
  document.addEventListener("click", e=>{ if(Date.now() < _xferSuppressClickUntil && !(e.target.closest && e.target.closest("#toolsModalRoot"))){ e.stopPropagation(); e.preventDefault(); } }, true);
})();

// One list of lines {t:text, a:align, b:bold, z:size} is built here; the printer encoder and the
// on-screen preview both read it, so what you see in the preview is what gets printed.
function buildReceiptLines(tx, D){
  D = D || getReceiptDesign();
  const W = D.paper===48 ? 48 : 32, L=[];
  const shop = (rdUi.open && rdUi.shop) ? rdUi.shop : getReceiptSettings();
  const line = (t,o)=> L.push(Object.assign({t:t,a:"left",b:false,z:"normal"}, o||{}));
  const divider = ()=>{ if(D.divider==="none") line(""); else line(D.divider.repeat(W)); };
  const lr = (l,r,o)=> line(padLR(l,r,W), o);
  const money$ = v=> `${CURRENCY}${money(v)}`;
  const zw = z=> z==="large" ? Math.floor(W/2) : W;   // double-width text fits half as many characters

  if(D.showName && shop.shopName) line(shop.shopName.slice(0,zw(D.nameSize)), {a:D.headAlign, b:true, z:D.nameSize});
  if(D.tagline) line(D.tagline, {a:D.headAlign});
  if(D.showAddress && shop.address) line(shop.address, {a:D.headAlign});
  if(D.showPhone && shop.phone) line(shop.phone, {a:D.headAlign});
  divider();
  const invoiceNo = (tx.id||"").slice(-6).toUpperCase();
  if(D.showInvoice && D.showDate) lr(`Invoice #${invoiceNo}`, fmtDateTime(tx.timestamp));
  else if(D.showInvoice) line(`Invoice #${invoiceNo}`);
  else if(D.showDate) line(fmtDateTime(tx.timestamp));
  if(D.showPatient) line(`Patient: ${tx.patientName}`);
  if(D.showPayment) line(`Mode of Payment: ${tx.paymentMode||"Cash"}`);
  if(D.showRemarks && tx.remarks) line(`Remarks: ${tx.remarks}`);
  divider();

  let totalQty = 0;
  const shown = (tx.items||[]).filter(it=> it.special ? D.showSpecial : D.showMeds);
  (tx.items||[]).forEach(it=>{ totalQty += it.pills; });
  if(shown.length){
    shown.forEach(it=>{
      const nm = `${it.name}${it.note?` (${it.note})`:""}`, amt = money$(it.subtotal!=null ? it.subtotal : it.pricePerPill*it.pills);
      if(D.itemStyle==="one") lr(`${fmtInt(it.pills)} x ${nm}`.slice(0,W-amt.length-1), amt, {b:D.boldItems});
      else{
        line(nm, {b:D.boldItems});
        lr(`  ${it.pills} x ${money$(it.pricePerPill)}`, amt);
      }
    });
    if(D.showDiscounts && tx.medsDiscount) lr("Medicines discount", `-${money$(tx.medsDiscount)}`);
    divider();
  }
  if(D.showTests && tx.tests && tx.tests.length){
    tx.tests.forEach(t=> lr(t.name, money$(t.amount)));
    if(D.showDiscounts && tx.testsDiscount) lr("Tests discount", `-${money$(tx.testsDiscount)}`);
    divider();
  }
  if(D.showExtras && tx.extras && tx.extras.length){
    tx.extras.forEach((ex,i)=> lr(ex.label || `Other charge ${i+1}`, money$(ex.amount)));
    divider();
  }
  if(D.showMedTotal) lr("Medicine total", money$((tx.medTotal||0)-(tx.medsDiscount||0)));
  if(D.showTestsTotal && tx.tests && tx.tests.length) lr("Tests total", money$((tx.testsTotal||0)-(tx.testsDiscount||0)));
  if(D.showFee){
    lr("Doctor fee", money$((tx.doctorFee||0)-(tx.feeDiscount||0)));
    if(D.showDiscounts && tx.feeDiscount) lr("Doctor fee discount", `-${money$(tx.feeDiscount)}`);
  }
  divider();
  if(D.showQty && totalQty) lr("Total Qty", String(totalQty));
  const tz = D.totalSize==="tall" ? "tall" : "normal";
  lr("PAYABLE", money$(tx.grandTotal), {b:D.boldTotal, z:tz});
  divider();
  if(D.thanks) line(D.thanks, {a:D.footAlign});
  if(D.footer) line(D.footer, {a:D.footAlign});
  return L;
}
function buildEscPosReceipt(tx){
  const ESC = "\x1B", GS = "\x1D", D = getReceiptDesign();
  const sizeCode = {normal:"\x00", tall:"\x01", large:"\x11"};
  const alignCode = {left:"\x00", center:"\x01", right:"\x02"};
  let r = ESC + "@";
  buildReceiptLines(tx, D).forEach(l=>{
    r += ESC+"a"+alignCode[l.a] + (l.b?ESC+"E\x01":"") + GS+"!"+sizeCode[l.z] + l.t + "\n" + GS+"!\x00" + ESC+"E\x00";
  });
  r += ESC+"a\x00" + "\n".repeat(Math.max(0,Math.min(8,D.feedLines|0)));
  if(D.cut) r += GS + "V" + "\x00";
  return r;
}

// Hands the raw ESC/POS bytes to the native app over the bridge, prefixed "PRINT:" so
// App Inventor's WebViewStringChange handler can route it to whichever printer transport
// is configured (Bluetooth first; WiFi/USB/BLE can be added later using this same message).
// Called right after a bill is completed. The native side shows "Not connected to a Bluetooth
// device." whenever it is sent a print job with no printer connected, and the page can't see the
// connection state — so the automatic print only fires if a printer has been chosen in Printer
// Settings and "Print automatically" hasn't been switched off. The 🖨 Print button on a saved
// bill always tries to print, whatever these settings say.
function autoPrintEnabled(){
  const transport = localStorage.getItem("clinic_printer_transport") || "";
  if(!transport) return false;                        // no printer ever set up
  return localStorage.getItem("clinic_auto_print") !== "off";
}
function autoPrintAfterBill(tx){
  if(autoPrintEnabled()) printReceipt(tx);
}
function toggleAutoPrint(on){
  localStorage.setItem("clinic_auto_print", on ? "on" : "off");
  showToast(on ? "Receipts will print automatically" : "Automatic printing is off — use 🖨 Print on a saved bill");
}
function printReceipt(tx){
  const escpos = buildEscPosReceipt(tx);
  if(!window.AppInventor || typeof window.AppInventor.setWebViewString !== "function"){
    showToast("Printing isn't available outside the app");
    return;
  }
  const transport = localStorage.getItem("clinic_printer_transport") || "";
  if(transport === "wifi"){
    window.AppInventor.setWebViewString("PRINT_WIFI:" + escpos);
  } else if(transport === "ble"){
    window.AppInventor.setWebViewString("PRINT_BLE:" + escpos);
  } else if(transport === "usb"){
    window.AppInventor.setWebViewString("PRINT_USB:" + escpos);
  } else if(transport === "cloud"){
    window.AppInventor.setWebViewString("PRINT_CLOUD:" + escpos);
  } else {
    // Default / unset falls back to Bluetooth — matches the original Phase 1 behavior.
    window.AppInventor.setWebViewString("PRINT:" + escpos);
  }
}

// Stored formulas use inconsistent separators between components (e.g. "valsartan+Amlodipine",
// "Budesonide+formoterol Fumrate Dihydrate") - typing the exact separator (or lacking one) used
// in a particular entry shouldn't be required to find it. Both sides are normalized to single
// spaces between words before matching, so "valsartan amlodipine" (space, no +) still matches
// a formula stored with "+", and vice versa.
// Extracts numeric tokens (e.g. "160/5 mg" -> ["160","5"], "400/12 mcg" -> ["400","12"]) so a
// strength search works purely off the numbers, ignoring unit (mg vs mcg) and formatting
// differences between entries.
function extractNumbers(s){
  return (s||"").match(/\d+(\.\d+)?/g) || [];
}
function strengthMatchesQuery(strength, rawQuery){
  const qNums = extractNumbers(rawQuery);
  if(!qNums.length) return false;
  const sNums = extractNumbers(strength);
  return qNums.some(qn=>sNums.includes(qn));
}
// A plain category query ("tablet") matches medicines of that category whether or not they
// carry the S. tag (m.sTag) shown in the UI (e.g. "S.Tablet") - that tag is a display prefix,
// not a separate category value. An explicit S.-prefixed query ("s.tablet" or "s tablet")
// is treated as more specific and only matches medicines that actually carry that tag,
// excluding otherwise-identical untagged ones of the same category.
// Lets a search combine name, formula, strength, and category terms freely, in any order
// (e.g. "Tarclya 5 tablet", "tablet 5 mirogabalin", "5 tarclya tablet" all work the same way).
// Each whitespace-separated word in the query just has to be found SOMEWHERE among the
// medicine's name / formula / strength-number / category - it doesn't matter which field, and
// different words can each match a different field. All words must be satisfied (AND across
// words), but each individual word can match any field (OR across fields).
function tokenMatchesMedicine(m, tok){
  if((m.name||"").toLowerCase().includes(tok)) return true;
  const normFormula = normalizeFormulaText(m.formula);
  const normTok = normalizeFormulaText(tok);
  if(normTok && normFormula.includes(normTok)) return true;
  if(/^\d+(\.\d+)?$/.test(tok) && extractNumbers(m.mg).includes(tok)) return true;
  if(categoryMatchesQuery(m, tok)) return true;
  return false;
}
function medicineMatchesQuery(m, rawQuery){
  const tokens = (rawQuery||"").toLowerCase().trim().split(/\s+/).filter(Boolean);
  if(!tokens.length) return false;
  return tokens.every(tok=>tokenMatchesMedicine(m,tok));
}
function categoryMatchesQuery(m, rawQuery){
  const q = (rawQuery||"").toLowerCase().trim();
  if(!q) return false;
  const cat = (m.category||m.specialCategory||"").toLowerCase();
  if(!cat) return false;
  const sMatch = q.match(/^s[.\s]+(.+)$/); // requires "s." or "s " + something, not a bare "s..." category name like "Syrup"
  if(sMatch){
    const rest = sMatch[1].trim();
    return (cat.startsWith(rest) || cat.includes(rest)) && !!m.sTag;
  }
  return cat.startsWith(q) || cat.includes(q);
}
function normalizeFormulaText(s){
  return (s||"").toLowerCase().replace(/[+/,&\-()]/g," ").replace(/\s+/g," ").trim();
}
function formulaMatchesQuery(formula, rawQuery){
  return normalizeFormulaText(formula).includes(normalizeFormulaText(rawQuery));
}
// Ranks a formula match by how many of the QUERY's words, taken from the start, form a
// matching prefix of the formula's own words - e.g. searching "gh hh jj kk" ranks a formula
// of exactly "gh hh jj kk" (or one that starts with all 4 of those words) highest, then a
// formula starting with just "gh hh jj", then "gh hh", then "gh" alone; formulas where the
// query only appears as a substring somewhere in the middle (not as this leading prefix)
// still show up (existing broad match), just ranked below all of the above tiers.
function formulaRankScore(formula, rawQuery){
  const fWords = normalizeFormulaText(formula).split(" ").filter(Boolean);
  const qWords = normalizeFormulaText(rawQuery).split(" ").filter(Boolean);
  if(!qWords.length) return 0;
  let matchLen = 0;
  for(let i=0;i<qWords.length;i++){
    if(fWords[i] === qWords[i]) matchLen = i+1; else break;
  }
  if(matchLen === qWords.length) return fWords.length===qWords.length ? 10000 : 9000; // full query matched as a leading prefix
  if(matchLen > 0) return 1000 + matchLen; // partial leading-word match, longer prefix ranks higher
  return formulaMatchesQuery(formula, rawQuery) ? 100 : 0; // query found only as a substring, not a leading prefix
}
// Combines name, formula, strength, and category relevance for sorting search results, highest first.
function searchRankScore(m, rawQuery){
  const q = normalizeFormulaText(rawQuery);
  const nameL = (m.name||"").toLowerCase();
  if(nameL === q) return 20000;
  if(nameL.startsWith(q)) return 15000;
  const fScore = formulaRankScore(m.formula, rawQuery);
  if(nameL.includes(q)) return Math.max(fScore, 12000);
  if(fScore > 0) return fScore;
  if(categoryMatchesQuery(m, rawQuery)) return 200;
  return strengthMatchesQuery(m.mg, rawQuery) ? 50 : 0;
}

/* ===================== BARCODE SCANNING (GS1 DataMatrix / GS1-128) ===================== */
/* Medicine boxes in India print a small GS1 DataMatrix (sometimes a GS1-128 linear barcode)
   next to the human-readable batch/mfg/expiry/MRP text — see the "what's in that square
   barcode" conversation earlier. Decoding it is a purely local, offline operation (the bytes
   are all sitting right there in the barcode); no internet or server lookup is needed to pull
   out the GTIN/batch/expiry fields extracted below.
   Two ways to feed a scan into this app, both wired to the same parser/handler:
   1) A text box the scan lands in — this is the PRIMARY, always-reliable path. Almost every
      handheld pharmacy barcode scanner (USB or Bluetooth) is a plain "HID" keyboard device:
      point it at a code, it "types" the decoded text into whatever input is focused, then
      sends Enter — no app-side camera code needed at all, and it works fully offline with
      zero changes to the App Inventor project.
   2) An optional phone-camera scanner (openCameraScan below) using getUserMedia, and a
      photo-capture scanner (scanFromPhoto below) using the phone's native camera app, both
      decoded with zxing-wasm — a WebAssembly build of the real ZXing-C++ engine (not the older,
      noticeably weaker pure-JavaScript @zxing/library port this used to run on; that port's
      Data Matrix decoder in particular struggled with anything less than a near-perfectly
      flat, head-on shot). IMPORTANT CAVEAT: the stock App Inventor WebViewer component does NOT
      grant camera permission to web content by default (same class of limitation as it not
      handling file downloads — see checkForAppUpdate's comment above). The live-camera button
      will likely fail silently inside the packaged APK unless the WebViewer is swapped for a
      camera-capable variant/extension (the photo-capture button uses the file chooser instead,
      which is a separate, generally better-supported path). Treat option 1 above as the
      dependable one regardless. */
function gs1SetField(out, ai, value){
  if(ai==="01") out.gtin = value;
  else if(ai==="10") out.batch = value;
  else if(ai==="21") out.serial = value;
  else if(ai==="240") out.productText = value;
  else if(ai==="11") out.mfgDate = gs1DateToIso(value);
  else if(ai==="17") out.expiryDate = gs1DateToIso(value);
}
// GS1 dates are 6-digit YYMMDD. A day of "00" is valid per the GS1 spec and means "the last
// day of that month" (common when a manufacturer only tracks month/year) — handled by
// rolling to the 1st of the NEXT month and stepping back one day.
function gs1DateToIso(yymmdd){
  if(!/^\d{6}$/.test(yymmdd)) return null;
  const yy = Number(yymmdd.slice(0,2)), mm = Number(yymmdd.slice(2,4)), dd = Number(yymmdd.slice(4,6));
  const year = 2000 + yy; // every medicine box scanned today safely falls in the 2000s
  if(mm<1||mm>12) return null;
  if(dd===0){
    const d = new Date(year, mm, 1); // JS months are 0-indexed, so "mm" here already means "1st of next month"
    d.setDate(d.getDate()-1);
    return ymd(d.getFullYear(), d.getMonth(), d.getDate());
  }
  if(dd<1||dd>31) return null;
  return ymd(year, mm-1, Math.min(dd, new Date(year, mm, 0).getDate()));
}
// Longest value allowed for the variable-length AIs we might meet. Only used when separators
// are missing and we have to guess where one field ends and the next begins.
function gs1MaxLen(ai){ return (ai==="10"||ai==="21"||ai==="22") ? 20 : (ai==="30"||ai==="37") ? 8 : 30; }
// Describes the GS1 Application Identifier at the start of `s`: its text, and whether its value
// is a fixed number of characters (fixed>0) or runs until the next GS separator / end (fixed=0).
// Only needs to be right about LENGTHS so that fields Counter Book doesn't use (weights, prices,
// party codes...) can be skipped correctly instead of derailing the whole parse. null = unknown AI.
function gs1AiInfo(s){
  const d2 = s.slice(0,2), n2 = Number(d2);
  const FIXED2 = {"00":18,"01":14,"02":14,"11":6,"12":6,"13":6,"14":6,"15":6,"16":6,"17":6,"18":6,"19":6,"20":2};
  if(FIXED2[d2]!=null) return { ai:d2, fixed:FIXED2[d2] };
  if(d2==="10"||d2==="21"||d2==="22"||d2==="30"||d2==="37"||(n2>=90&&n2<=99)) return { ai:d2, fixed:0 };
  if(n2>=31 && n2<=36 && s.length>=4) return { ai:s.slice(0,4), fixed:6 };        // measures, e.g. 310n weight
  if(n2===41 && s.length>=3) return { ai:s.slice(0,3), fixed:13 };                 // party GLNs 410-417
  if((n2===24||n2===25||n2===40||n2===42||n2===43) && s.length>=3) return { ai:s.slice(0,3), fixed:0 }; // incl. 240 = manufacturer's extra product info
  if((n2===39||(n2>=70&&n2<=82)) && s.length>=4) return { ai:s.slice(0,4), fixed:0 }; // price, 7xxx, 8xxx
  return null;
}
// Strict parse of the WHOLE string into [ai, value] pairs, or null if it can't be read end to end.
// Normal case: each variable-length value ends at a GS separator (or the end of the string) and
// this just reads straight through. If a decoder dropped the separators, a field is instead
// allowed to end early, right before another valid AI starts — with backtracking to find the one
// reading that consumes everything, and each AI allowed only once (which rules out bogus splits).
let _gs1Budget = 0;
function gs1Parse(s, i, seen){
  if(--_gs1Budget < 0) return null;
  const GS = "\x1D";
  while(i<s.length && s[i]===GS) i++;
  if(i>=s.length) return [];
  const info = gs1AiInfo(s.slice(i, i+4));
  if(!info || !/^\d+$/.test(info.ai) || seen[info.ai]) return null; // real AIs are always digits
  const start = i + info.ai.length;
  const seen2 = Object.assign({}, seen); seen2[info.ai] = true;
  if(info.fixed){
    const val = s.substr(start, info.fixed);

      </div>
    </div>`;

// Shared entry point for BOTH the scan-and-paste box and the camera callback.
// Makes invisible characters visible so a scanned string can actually be read/diagnosed:
// GS (0x1D) -> <GS>, other control characters -> <0xNN>.
function visibleScanText(s){
  return String(s).replace(/[\x00-\x1f\x7f]/g, c => c==="\x1D" ? "<GS>" : "<0x"+c.charCodeAt(0).toString(16).padStart(2,"0")+">");
}
function parseDigitalLink(text){
  const g = String(text).match(/\/01\/(\d{8,14})(?=[\/?#]|$)/);
  if(!g) return null;
  const out = parseGS1Barcode("");
  gs1SetField(out, "01", g[1].padStart(14,"0"));
  const pick = (ai)=>{ const a = String(text).match(new RegExp("\\/"+ai+"\\/([^\\/?#]+)")) || String(text).match(new RegExp("[?&]"+ai+"=([^&#]+)")); return a ? decodeURIComponent(a[1]) : ""; };
  const b = pick("10"), x = pick("17"), m = pick("11"), sr = pick("21");
  if(b) gs1SetField(out, "10", b);
  if(/^\d{6}$/.test(x)) gs1SetField(out, "17", x);
  if(/^\d{6}$/.test(m)) gs1SetField(out, "11", m);
  if(sr) gs1SetField(out, "21", sr);
  gs1DeriveProduct(out);
  return out;
}
// Not every manufacturer uses GS1 — some QR codes are just plain "Label: value" lines, e.g.
// Venus Pharma's "Product Name: Dexamethasone Injection\r\nProduct Strength: 4mg/1ml\r\n
// GTIN:8964001832331\r\nDML No.000300\r\nReg, No. 012089\r\nwww.venuspharma.com.pk" — a real
// GTIN and product name are sitting right there, just not in a shape the GS1 parser reads.
// Only the handful of labels this app actually has a box for are pulled out; things like a DML
// or Registration number (no colon after them here anyway) or a website are left alone.
function parseKeyValueCode(text){
  const out = { gtin:null, batch:null, mfgDate:null, expiryDate:null, serial:null, productText:null, productName:null, price:null, strength:null };
  String(text).split(/[\r\n]+/).forEach(line=>{
    const m = line.match(/^\s*([A-Za-z][A-Za-z .]{1,30}?)\s*:\s*(.+?)\s*$/);
    if(!m) return;
    const key = m[1].toLowerCase().replace(/\s+/g," ").trim(), val = m[2].trim();
    if(!val) return;
    if(/^product\s*name$/.test(key)) out.productName = val;
    else if(/^(product\s*)?strength$/.test(key)) out.strength = val;
    else if(key==="gtin"){ const digits = val.replace(/\s+/g,""); if(/^\d{8,14}$/.test(digits)) out.gtin = digits; }
    else if(/^batch(\s*no\.?)?$/.test(key) && !out.batch) out.batch = val;
  });
  return (out.productName || out.gtin) ? out : null;
}
function handleScanText(raw){
  const target = scanUi.pending;
  scanUi.pending = null;
  const text = (raw||"").trim();
  if(!text) return;
  let parsed = parseGS1Barcode(text);
  if(!parsed.gtin && !parsed.batch && !parsed.expiryDate){
    // Not a GS1 medicine code. Two more kinds are accepted: a GS1 QR "Digital Link" (a web address that
    // carries the GTIN/batch/expiry) and any ordinary barcode or QR (Code 128, plain number or text),
    // which is stored as the medicine's linked barcode so the same code is recognised next time.
    const dl = parseDigitalLink(text);
    if(dl) parsed = dl;
    else {
      const kv = parseKeyValueCode(text);
      if(kv) parsed = kv;
      else {
        const plain = text.replace(/[\x00-\x1f\x7f]/g,"").trim();
        if(plain && plain.length<=128) parsed = Object.assign(parseGS1Barcode(""), { gtin: plain });
      }
    }
  }
  if(!parsed.gtin && !parsed.batch && !parsed.expiryDate && !parsed.productName){
    // The barcode WAS read successfully — it just isn't in a shape the GS1 parser recognises.
    // Show exactly what it contained (rather than a toast that vanishes) so it can be copied/shared.
    const hex = Array.from(text.slice(0,24)).map(c=>c.charCodeAt(0).toString(16).padStart(2,"0")).join(" ");
    openShare("The barcode was read, but not recognised as a medicine (GS1) code.\n\nScanned text (" + text.length + " characters):\n" + visibleScanText(text) + "\n\nFirst bytes (hex): " + hex);
    return;
  }
  window.__lastScan = { text, parsed };
  if(target==="newmed") applyScanToNewMedForm(parsed);
  else if(target && target.kind==="restock") applyScanToRestock(target.medId, parsed);
  else if(target && target.kind==="edit") applyScanToEditForm(target.medId, parsed);
}

/* Barcodes often carry the full product title in one string, e.g. "Terbisil 10 lotion 20 mL".
   Split it into the pieces the New medicine form actually has boxes for:
   - dosage form word (lotion/tablet/syrup/...) -> Category
   - quantities with a unit (20 mL, 500 mg, 5 %) -> Strength, volumes first
   - a bare number sitting right before the dosage form word (the "10" above) -> mg
   - whatever is left is the medicine's name ("Terbisil").
   Deliberately conservative: only known dosage-form words are recognised, and if stripping
   would leave the name empty, nothing is split at all. */
const DOSAGE_FORM_WORDS = {
  tablet:"Tablet", tablets:"Tablet", tab:"Tablet", tabs:"Tablet",
  capsule:"Capsule", capsules:"Capsule", cap:"Capsule", caps:"Capsule",
  injection:"Injection", inj:"Injection", syrup:"Syrup", suspension:"Suspension", lotion:"Lotion",
  cream:"Cream", ointment:"Ointment", gel:"Gel", drops:"Drops", drop:"Drops", sachet:"Sachet",
  drip:"Drip", powder:"Powder", spray:"Spray", shampoo:"Shampoo", solution:"Solution",
  // Common abbreviations printed on Indian medicine boxes
  tabs:"Tablet", caps:"Capsule", oint:"Ointment", ointments:"Ointment", crm:"Cream", susp:"Suspension", syp:"Syrup", soln:"Solution"
};
function splitScannedProductName(raw){
  const original = String(raw||"").replace(/\s+/g," ").trim();
  const UNIT = "ml|l|mg|mcg|gm|g|iu|%";
  // A quantity may be a plain number ("15") or a ratio/combination ("0.5/30", "500/125").
  const NUM = "\\d+(?:\\.\\d+)?(?:\\/\\d+(?:\\.\\d+)?)*";
  const glued = new RegExp("^("+NUM+")("+UNIT+")$","i");
  const unitOnly = new RegExp("^("+UNIT+")$","i");
  const isNum = t=>new RegExp("^"+NUM+"$").test(t);
  // "g"/"gm" are written out as "gram" in the Strength box; other units stay as scanned.
  const niceUnit = u=>/^(g|gm)$/i.test(u) ? "gram" : /^mg$/i.test(u) ? "mg" : /^mcg$/i.test(u) ? "mcg" : /^ml$/i.test(u) ? "mL" : /^iu$/i.test(u) ? "IU" : u;
  // Pack size units (volume/weight of the whole tube/bottle) are listed first in Strength.
  const isPackUnit = u=>/^(ml|l|g|gm)$/i.test(u);
  const measures = [];
  let tokens = original.split(" ").filter(Boolean);
  // "20 mgtab", "50 MGTAB", "500mgtab": unit and dosage-form word stuck together -> split them apart
  const FORMW = "tabs?|tablets?|caps?|capsules?|syp|syrup|inj|injection|drops?|cream|oint|ointment|gel|lotion|susp|suspension|sachet|powder";
  tokens = tokens.flatMap(t=>{
    const g3 = t.match(new RegExp("^("+NUM+")(mg|mcg|gm|g|ml|iu)("+FORMW+")$","i"));
    if(g3) return [g3[1]+g3[2], g3[3]];
    const g2 = t.match(new RegExp("^(mg|mcg|gm|g|ml|iu)("+FORMW+")$","i"));
    return g2 ? [g2[1], g2[2]] : [t];
  });
  // pack counts such as "10's", "10s", "10 s": units per box, not part of the name
  let perBox = 0;
  { const t2=[]; for(let i=0;i<tokens.length;i++){
      const t=tokens[i], m=t.match(/^(\d+)['\u2019]?s$/i);
      if(m){ perBox=Number(m[1]); continue; }
      if(/^\d+$/.test(t) && i+1<tokens.length && /^['\u2019]?s$/i.test(tokens[i+1])){ perBox=Number(t); i++; continue; }
      t2.push(t);
    } tokens=t2; }
  // 1) quantities that already carry a unit ("20 mL", "20mL", "15 g")
  const rest = [];
  for(let i=0;i<tokens.length;i++){
    const t = tokens[i];
    const g = t.match(glued);
    if(g){ measures.push({text:g[1]+" "+niceUnit(g[2]), vol:isPackUnit(g[2])}); continue; }
    if(isNum(t) && i+1<tokens.length && unitOnly.test(tokens[i+1])){
      measures.push({text:t+" "+niceUnit(tokens[i+1]), vol:isPackUnit(tokens[i+1])}); i++; continue;
    }
    rest.push(t);
  }
  // 2) dosage form word, plus a bare number/ratio directly before it (= mg)
  let category = "";
  const fi = rest.findIndex(t=>DOSAGE_FORM_WORDS[t.toLowerCase().replace(/[^a-z]/g,"")]);
  if(fi>0){ // fi===0 would leave the name empty — leave such names alone
    category = DOSAGE_FORM_WORDS[rest[fi].toLowerCase().replace(/[^a-z]/g,"")];
    rest.splice(fi,1);
    if(fi-1>=0 && isNum(rest[fi-1])){ measures.push({text:rest[fi-1]+" mg", vol:false}); rest.splice(fi-1,1); }
  }
  let name = rest.join(" ").trim();
  if(!name && (measures.length || perBox)){
    // Only a quantity was left ("15 gm", "10's" — a box code often carries just the pack size and price). That is not a name,
    // so the Name box stays empty for the person to type, and the quantity goes where it belongs (Strength / pack count).
    const ordered0 = measures.filter(m=>m.vol).concat(measures.filter(m=>!m.vol));
    return { name:"", category:"", strength: ordered0.map(m=>m.text).join(" "), perBox };
  }
  if(!name || (!category && !measures.length && !perBox)) return { name: original, category:"", strength:"", perBox:0 };
  if(name===name.toUpperCase() && /[A-Z]{3}/.test(name)) name = name.toLowerCase().replace(/\b[a-z]/g,c=>c.toUpperCase()); // DYNETIC -> Dynetic
  const ordered = measures.filter(m=>m.vol).concat(measures.filter(m=>!m.vol));
  return { name, category, strength: ordered.map(m=>m.text).join(" "), perBox };
}
// ---- Inventory: fill the New medicine form from a photo of the box (offline OCR) ----
// Pulls the printed GTIN / M.R.P. and the product-name line out of the text, then hands it to
// the same filler the barcode scan uses, so only EMPTY boxes are filled (name, category,
// strength, MRP). Works for normal and special medicines alike (the form's S switch decides).
function parseBoxText(text){
  const t = String(text||"");
  const out = {};
  const g = t.match(/GTIN\D{0,4}(\d{12,14})/i); if(g) out.gtin = g[1];
  // MRP / Retail Price / Price Rs. 450 / Rs.450/-  (a bare "Rs 450" is accepted only with the Rs/PKR sign)
  const priceRes = [
    /M\.?\s*R\.?\s*P\.?\s*[:.\-]?\s*(?:Rs\.?|₹|PKR|INR)?\s*(\d+(?:\.\d{1,2})?)/i,
    /(?:max(?:imum)?\.?\s*)?retail\s*price\s*[:.\-]?\s*(?:Rs\.?|₹|PKR|INR)?\s*(\d+(?:\.\d{1,2})?)/i,
    /\bprice\s*[:.\-]?\s*(?:Rs\.?|₹|PKR|INR)\s*(\d+(?:\.\d{1,2})?)/i,
    /(?:\bRs\.?|₹|\bPKR)\s*(\d{2,6}(?:\.\d{1,2})?)\s*(?:\/-)?/
  ];
  // a reading slip such as "M.R.P. Rs.\n7" must not become a price of Rs 7: a whole number needs 2+ digits
  const priceOk = v => v!=null && Number(v)>0 && (String(v).indexOf(".")>=0 ? Number(v)>=1 : Number(v)>=10);
  let m = null;
  for(const re of priceRes){ const mm=t.match(re); if(mm && priceOk(mm[1])){ m=mm; break; } }
  if(m) out.price = String(Number(m[1]));
  if(!out.price && /m\.?\s*r\.?\s*p/i.test(t)){
    // "M.R.P. Rs.:" with the amount printed on a line of its own (often one row off): take the single price-looking
    // number such as 365.00. Dates like 02.26 (month.year) and long codes are not prices.
    const cands = (t.match(/(?<![\d.\/\-])\d{2,5}\.\d{2}(?![\d.\/\-])/g)||[]).filter(x=>!/^(0[1-9]|1[0-2])\.\d{2}$/.test(x));
    const uniq = [...new Set(cands)];
    if(uniq.length===1 && Number(uniq[0])>=5) out.price = String(Number(uniq[0]));
  }
  const skip = /gtin|mfg|mfd|exp|b\.?\s*no|sr\.?\s*no|m\.?\s*r\.?\s*p|batch|\brs\b|licen|\d{9,}/i;
  const line = t.split("\n").map(l=>l.replace(/\s+/g," ").trim()).find(l=>l.length>=3 && /[A-Za-z]{3}/.test(l) && !skip.test(l));
  if(line) out.productName = line;
  return out;
}
// Best-effort, offline-only extras the box-text scan previously never attempted at all: the
// dosage form (category), the composition block (formula + strength) and the pack size
// ("2x10 Tablets" -> 20/box). Nowhere near as reliable as the online reader's structured
// reading of the whole box, but far better than leaving these boxes blank every time.
function parseBoxTextDetails(text){
  const t = String(text||"");
  const out = {};
  const formMatch = t.match(/\b(tablets?|capsules?|syrups?|suspensions?|injections?|ointments?|creams?|lotions?|drops?|gels?|powders?|sachets?|sprays?)\b/i);
  if(formMatch) out.form = formMatch[1].toLowerCase().replace(/s$/,"").replace(/^[a-z]/,c=>c.toUpperCase());
  const pk0 = boxFindPack(t); if(pk0) out.perBox = pk0;   // one set of pack-size rules for every reader path
  const compStart = t.search(/composition/i);
  if(compStart>=0){
    // Pharma labels commonly print COMPOSITION and DOSAGE/INDICATION as side-by-side boxes, not
    // stacked — OCR reading left-to-right across the whole width then sees "dosage" almost right
    // after "composition" on the very same line it scans. Cutting on ANY occurrence of a stop
    // word anywhere in the text threw the whole ingredient list away before it was ever read.
    // Requiring the stop word to actually START a line only matches a genuine new section.
    const restLines = t.slice(compStart).split("\n").filter(x=>x.trim());   // blank lines (common in sparse-text reads) must not use up the line cap
    let compEndIdx = restLines.length;
    for(let i=1;i<restLines.length;i++){
      if(/^\s*(indication|dosage|direction|storage|contra|side\s*effect|precaution|warning)\b/i.test(restLines[i])){ compEndIdx=i; break; }
    }
    const block = restLines.slice(0, Math.min(compEndIdx, 12)).join("\n"); // hard cap either way, just in case
    const names=[], strengths=[];
    // A dose's digits must not be glued to a letter (so "Vitamin D3" isn't mistaken for a dose
    // starting at its "3"), and the LAST dose-looking number on the line wins — composition
    // lines often have an aside like "(Eq. To 400mg Elemental Calcium)" before the real final
    // dose, and taking the first match would grab the aside's number instead.
    const doseRe = /(?<![A-Za-z])(\d[\d,]*(?:\.\d+)?)\s*(mg|mcg|µg|gm|g|ml|[il1|]\.?u\.?|%)(?![A-Za-z])/gi;   // the text reader often turns "I.U" into "1.U", "|.U" or "lU"
    block.split("\n").forEach(raw=>{
      // Dot leaders ("....") are plain punctuation here, not part of any number — strip them
      // before matching so they can't get swallowed into a dose figure.
      let l = raw.replace(/\s+/g," ").replace(/\.{2,}/g," ").trim();
      // DOSAGE / INDICATION / STORAGE boxes sit beside COMPOSITION, so their words share this text line
      l = l.replace(/\b(take|dosage?|dosag|indication|indicat|storage|stor|adults?|children)\b.*$/i,"").trim();
      // leading border/icon junk such as "/ > >"
      l = l.replace(/^[^A-Za-z0-9(]+/,"").trim();
      // "Each Tablet Contains:" (also cut off, e.g. "Each Tablet Cor") is a heading, not an ingredient;
      // if ingredients follow on the same line ("Each tablet contains Paracetamol 500mg") keep them.
      l = l.replace(/^each\s+(?:film[- ]?coated\s+|enteric[- ]?coated\s+)?(?:tablet|capsule|caplet|sachet|vial|ampoule|ml|5\s*ml)s?\b\s*(?:contains?:?|con\w*:?)?/i,"").trim();
      if(!l || /composition/i.test(l)) return;
      // "(Eq. To 400mg Elemental Calcium)" describes the ingredient, it is not the tablet's strength:
      // leave such asides out when looking for the dose (a missing dose is better than a wrong one).
      l = l.replace(/\(\s*(?:eq|equiv|elemental|as\b|i\.?e)[^)]*\)/gi," ").replace(/\s+/g," ").trim();
      const all = [...l.matchAll(doseRe)];
      const dose = all[all.length-1];
      let name = dose ? l.slice(0, dose.index) : l;
      name = name.replace(/\([^)]*\)/g,"").replace(/\(\s*$/,"").replace(/[:.\s]+$/,"").trim();
      const niceDose = d=> /^[il1|]\.?u\.?$/i.test(d[2]) ? (d[1]+" IU") : d[0].replace(/\s+/g," ").trim().toUpperCase();
      name = name.replace(/\bvitamin\s*d\s*[s5]\b/i,"Vitamin D3");
      const junk = name.length>45 || /(.)\1{2,}/i.test(name) || (name.length>18 && name.indexOf(" ")<0)
                 || ((name.match(/[A-Za-z]/g)||[]).length / Math.max(1,name.replace(/\s/g,"").length)) < 0.8;
      if(name && !junk && /[A-Za-z]{3}/.test(name)){
        if(names.length<3){ names.push(name); strengths[names.length-1] = dose ? niceDose(dose) : undefined; }
      } else if(dose && names.length && strengths[names.length-1]===undefined){
        // A continuation line that's only a parenthetical aside + the real dose, with no
        // ingredient name of its own — attach it to the name from the line just above.
        strengths[names.length-1] = niceDose(dose);
      }
    });
    if(names.length) out.formula = names.join(" + ");
    const strOut = strengths.filter(Boolean);
    if(strOut.length) out.strength = strOut.join(" + ");
  }
  return out;
}

      else { const plain = text.replace(/[\x00-\x1f\x7f]/g,"").trim(); if(plain && plain.length<=128) parsed = Object.assign(parseGS1Barcode(""), { gtin: plain }); }
    }

    if(parsed.productName || parsed.price || parsed.gtin || parsed.formula || parsed.form || parsed.perBox){
      if(codeText) window.__lastScan = { text:codeText, parsed };

  };

  const lanes = Math.min(3, files.length);

  const enginesP = (async()=>{ await aiLoadTesseract(); return Promise.all(Array.from({length:lanes}, mkWorker)); })();

  const stopEngines = ws=>ws.forEach(w=>{ if(w){ try{ Promise.race([ w.terminate(), new Promise(r=>setTimeout(r,1500)) ]).catch(()=>{}); }catch(e){} } });

  msg("Checking for barcodes…");

  const lists = await Promise.all(files.map(f=>readCodesFromPhoto(f, codeDeadline).catch(()=>[])));
  lists.forEach(list=>list.forEach(txt=>{ const p = parseScannedCodeText(txt); if(!p) return; if(!firstCodeText) firstCodeText = txt; boxMergeInto(code, p); }));
  if(boxIsComplete(code)){ enginesP.then(stopEngines).catch(()=>{}); finish(code, firstCodeText); return; }   // the codes alone filled every field — engines shut down unused

      const w1 = workers.find(Boolean);

// three text engines start loading. Every photo is handed over the instant it is captured: its barcodes are read and its
// text is read on a free engine, silently. By the time "Done" is tapped most or all of the work is finished, so the
// result usually appears at once; only if work is still running does the usual "Reading…" box show.

  // camera screen the instant its picture is live (and, as a safety net, by the first photo / Done).

    try{ loadZXingWasm().catch(()=>{}); }catch(e){}            // and the backup scanner library
    S.enginesP = (async()=>{
      await aiLoadTesseract();
      const ws = (await Promise.all(Array.from({length:lanes}, mkWorker))).filter(Boolean);
      if(!ws.length) throw new Error("no engine");
      if(S.closed){ ws.forEach(w=>{ try{ w.terminate(); }catch(e){} }); return; }

// Same idea as the medicine reader above: the camera opens first, the reader starts the instant the camera picture is live,
// and every photo is read in the background the moment it is captured — so the lines are usually ready when "Done" is tapped.
//   mode "print": the on-phone text reader (works offline), up to 3 engines, one photo each.
//   mode "hand" : handwriting via Gemini (needs internet + key); each photo is sent as soon as it is captured.
//                 A photo taken without internet is saved in the waiting queue exactly as before.
function createBillSession(mode){

  const lanes = Math.max(1, Math.min(3, cores-1, mem<2 ? 1 : 3));

  function wake(){ if(settled()){ const ws=S.waiters.splice(0); ws.forEach(f=>f()); } }

    const image = await aiResizeImage(S.files[k], 1600);

    try{ S.texts[k] = await aiReadImage(image); }
    catch(e){ if(e instanceof TypeError){ aiQueuePhoto(image); S.queued++; } else S.errors.push(e); }   // a real network failure -> keep the photo for later
  }

    const r = await aiOcrRotated(S.files[k], w, null, S.shared);
    S.texts[k] = String((r&&r.data&&r.data.text)||"").split("\n").map(l=>l.trim()).filter(l=>l.length>2).join("\n");

        S.running--; if(w && !S.closed) S.idle.push(w); pump(); wake();

    }

  }

    if(S.started || S.closed) return; S.started = true;
    if(mode!=="print") return;
    (async()=>{
      await aiLoadTesseract();
      const ws = (await Promise.all(Array.from({length:lanes}, async()=>{ try{ return await window.Tesseract.createWorker("eng"); }catch(e){ return null; } }))).filter(Boolean);
      if(!ws.length) throw new Error("no engine");
      if(S.closed){ ws.forEach(w=>{ try{ w.terminate(); }catch(e){} }); return; }

    })().catch(e=>{ S.failed = true; S.startError = e; wake(); });
  };

    S.start(); S.files.push(file); S.texts.length = S.files.length; S.queue.push(S.files.length-1); pump();
  };

    if(S.closed) return; S.closed = true; S.queue.length = 0;
    S.workers.forEach(w=>{ try{ Promise.race([ w.terminate(), new Promise(r=>setTimeout(r,1500)) ]).catch(()=>{}); }catch(e){} });
    S.workers = []; S.idle = [];
    const ws=S.waiters.splice(0); ws.forEach(f=>f());
  };

    S.start();

}

    let count=e.ids.length;
    if(excludeId){ count=0; for(const id of e.ids) if(id!==excludeId) count++; if(!count) continue; }
    const k=e.k, ct=e.words;
    let sc=0;
    if(k===qn) sc=100;
    else if(k.startsWith(qn)) sc=80;
    else {
      let wp=false; for(let i=0;i<ct.length;i++){ if(ct[i].startsWith(qn)){ wp=true; break; } }
      if(wp) sc=70;
      else if(qn.length>=3 && k.includes(qn)) sc=60;
      else if(qn.length>=3 && qt.length>1 && qt.every(w=>ct.some(c=>c.startsWith(w)||c.includes(w)))) sc=45;
      else if(qBi){ const d=_fsDiceBi(qBi,e.bi); if(d>=0.55) sc=20+d*20; }
    }
    if(sc>0) scored.push({text:e.text,count,sc});
  }
  scored.sort((a,b)=>b.sc-a.sc || b.count-a.count || a.text.localeCompare(b.text));
  const top=scored.slice(0,6);
  if(top.length===1 && _fsNorm(top[0].text)===qn) return [];
  return top;
}
function _fsBox(kind,id){ return document.getElementById(kind==='new' ? 'formulaSug-new' : 'formulaSug-'+id); }

function saveEdit(id){

  if(!(Number(f.mrp)>0)){ showToast("Not saved — enter the price per box (MRP)"); return false; }
  if(!(Number(f.pillsPerBox)>0)){ showToast("Not saved — enter how many pills are in a box"); return false; }
  if(f.stockPills===""){ showToast("Not saved — enter the stock (0 if none)"); return false; }
  const dup = findExactDuplicateMedicine(f, id);
  if(dup){
    showToast(`Not saved — "${dup.name}" with exactly these details is already in inventory. Change a box if it's a different medicine.`);

  }

    m.name=f.name.trim(); m.category=f.category||""; m.specialCategory=f.specialCategory||""; m.formula=f.formula.trim(); m.mg=f.mg.trim();
    m.mrpPerBox=Number(f.mrp); m.pillsPerBox=Number(f.pillsPerBox);

/* ===================== S.COPY: save-and-start-a-variant ===================== */
/* "S.Copy" saves whichever medicine is currently being added/edited exactly as filled in, then
   immediately reopens the New medicine form pre-filled with those same details — except for
   whichever one field the person picks to leave blank (plus MRP, always left blank too, since a
   different formula or strength almost always means a different price). Meant for the common
   case of a medicine that comes in a plain form and a combination form (D.Formula — leaves
   Formula + MRP empty, keeps Strength), or in more than one strength (D.Strength — leaves
   Strength + MRP empty, keeps Formula), so the next entry only needs that one field plus MRP
   typed in instead of the whole form redone from scratch. */
// The S.Copy popup: a small separate menu (D.Formula / D.Strength) shown over the form instead of
// expanding it. Opened by either S.Copy button (New medicine form or an inline Edit form).
function renderCopyMenu(){
  const root = document.getElementById("copyMenuRoot");
  if(!root) return;
  const isEdit = !!(inv.editCopyMenuOpen && inv.editId);
  const isNew = !!inv.copyMenuOpen && !isEdit;
  if(!isEdit && !isNew){ root.innerHTML=""; return; }
  const f1 = isEdit ? `copyEditVariant('${inv.editId}','formula')` : `copyNewMedicineVariant('formula')`;
  const f2 = isEdit ? `copyEditVariant('${inv.editId}','strength')` : `copyNewMedicineVariant('strength')`;
  const fn = v => isEdit ? `copyEditVariant('${inv.editId}','${v}')` : `copyNewMedicineVariant('${v}')`;
  root.innerHTML = `
    <div class="modal-overlay" onclick="if(event.target===this) closeCopyMenu()">
      <div class="copy-pop">
        <div style="font-weight:700;margin-bottom:10px;">S.Copy</div>
        <div class="flex gap2 mb2">
          <button type="button" class="btn btn-primary flex1" onclick="${fn('formula')}">D.Formula</button>
          <button type="button" class="btn btn-primary flex1" onclick="${fn('strength')}">D.Strength</button>
        </div>
        <div class="flex gap2 mb2">
          <button type="button" class="btn btn-primary flex1" onclick="${fn('name')}">D.Name</button>
          <button type="button" class="btn btn-primary flex1" onclick="${fn('full')}">F.Copy</button>
        </div>
        <button type="button" class="btn" style="width:100%;background:var(--danger);color:#fff;" onclick="closeCopyMenu()">Cancel</button>
      </div>
    </div>`;
}
function closeCopyMenu(){ inv.copyMenuOpen=false; inv.editCopyMenuOpen=false; renderCopyMenu(); }
function toggleInvCopyMenu(){ inv.copyMenuOpen = !inv.copyMenuOpen; renderCopyMenu(); }
function toggleEditCopyMenu(){ inv.editCopyMenuOpen = !inv.editCopyMenuOpen; renderCopyMenu(); }
// Shared by both entry points below: opens the New medicine form pre-filled from `f` (either an
// inv.form or inv.editForm snapshot — both carry the same field names this reads), with
// `variant` deciding which one field is left blank alongside MRP.
function openCopyVariantForm(f, variant){
  inv.editId = null;
  inv.editCopyMenuOpen = false;
  inv.restockId = null;
  inv.copyMenuOpen = false;
  inv.scanText = "";
  inv.form = {
    name: variant==='name' ? "" : f.name.trim(),
    category: f.category||"",
    specialCategory: f.specialCategory||"",
    formula: variant==='formula' ? "" : (f.formula||"").trim(),
    mg: variant==='strength' ? "" : (f.mg||"").trim(),
    mrp: variant==='full' ? String(f.mrp||"") : "", // a different formula/strength/name is almost always a different price — left blank, except F.Copy which keeps everything
    pillsPerBox: f.pillsPerBox||"",
    lowStockAt: f.lowStockAt||"10",
    sTag: !!f.sTag,
    gtin: "" // deliberately NOT carried over — a different formula/strength product has its own barcode
  };
  inv.showForm = true;
  render();
  showToast(variant==='formula' ? "✓ Saved — enter the different formula & MRP"
    : variant==='strength' ? "✓ Saved — enter the different strength & MRP"
    : variant==='name' ? "✓ Saved — enter the different name & MRP"
    : "✓ Saved — a full copy is ready (change whatever differs)");
}
// Called from the New medicine form's own S.Copy menu: saves the medicine currently being typed
// in (same validation addMedicine() itself uses), then reopens the form for the variant.
function copyNewMedicineVariant(variant){
  const f = inv.form;
  if(!f.name.trim()||!(Number(f.mrp)>0)||!(Number(f.pillsPerBox)>0)) return;
  const snapshot = {...f};
  // Close the popup straight away so the tap feels instant, then do the save. addMedicine(true)
  // skips its own full re-render because openCopyVariantForm() re-renders once right after.
  inv.copyMenuOpen = false; renderCopyMenu();
  setTimeout(()=>{
    if(!addMedicine(true)) return; // blocked as an exact duplicate — stay on the form
    openCopyVariantForm(snapshot, variant);
  }, 0);
}
// Called from an existing medicine's inline Edit form's S.Copy menu: saves the edits to THAT
// medicine (same validation saveEdit() itself uses), then opens the New medicine form for the
// variant — as a separate, new entry, not a further edit of the one just saved.
function copyEditVariant(id, variant){
  const f = inv.editForm;
  if(!f.name.trim()||!(Number(f.mrp)>0)||!(Number(f.pillsPerBox)>0)||f.stockPills==="") return;
  const snapshot = {...f};
  inv.editCopyMenuOpen = false; renderCopyMenu();
  setTimeout(()=>{
    if(!saveEdit(id)) return; // blocked as an exact duplicate — stay on the edit form
    openCopyVariantForm(snapshot, variant);
  }, 0);
}

// Bumped on every renderInventory() call so a background chunk-loading job from a previous

// Fills #invListContainer (the "no matches" message + card list) from the current inv.query,

// ======================= Inventory: ⇅ Arrange (sort) =======================
// An Android-style "Sort by" list under the search bar. The choice is remembered on this phone.
const INV_SORTS = [
  { k:"default", label:"Default (best match)", short:"" },
  { g:"Name",  k:"az", label:"Name A → Z", short:"A–Z" }, { k:"za", label:"Name Z → A", short:"Z–A" },
  { g:"Date",  k:"newest", label:"Newest added first", short:"Newest" }, { k:"oldest", label:"Oldest added first", short:"Oldest" }, { k:"changed", label:"Recently changed", short:"Changed" },
  { g:"Sales", k:"most", label:"Most sold", short:"Most sold", period:true }, { k:"least", label:"Least sold (unsold first)", short:"Least sold", period:true },
  { g:"Stock, price & size", k:"stockHi", label:"Stock: most first", short:"Stock ↓" }, { k:"stockLo", label:"Stock: least first", short:"Stock ↑" },
  { k:"mrpHi", label:"Price (MRP): high → low", short:"MRP ↓" }, { k:"mrpLo", label:"Price (MRP): low → high", short:"MRP ↑" },
  { k:"sizeHi", label:"Pack size: biggest first", short:"Size ↓" }, { k:"sizeLo", label:"Pack size: smallest first", short:"Size ↑" },
  { g:"Expiry", k:"expiry", label:"Nearest expiry first", short:"Expiry" }
];
const INV_SORT_PERIODS = [ {d:7,label:"7 days"}, {d:30,label:"30 days"}, {d:90,label:"90 days"}, {d:0,label:"All time"} ];
let _invSort = null;
function invSortState(){
  if(!_invSort){
    try{ _invSort = JSON.parse(localStorage.getItem(bk("clinic_inv_sort"))||"null"); }catch(e){ _invSort = null; }
    if(!_invSort || !INV_SORTS.some(x=>x.k===_invSort.key)) _invSort = { key:"default", days:30 };
    if(!INV_SORT_PERIODS.some(x=>x.d===_invSort.days)) _invSort.days = 30;

}
function invSortSave(){ try{ localStorage.setItem(bk("clinic_inv_sort"), JSON.stringify(invSortState())); }catch(e){} }
function invSortSig(){ const st = invSortState(); return st.key + ((st.key==="most"||st.key==="least") ? ":"+st.days : ""); }
// when was this medicine added? (new ones store it; older ones carry it inside their id, else the oldest batch / last change)
function invMedCreated(m){
  if(m.createdAt) return m.createdAt;
  const ts = parseInt(String(m.id||"").slice(0,-5), 36);
  if(ts>1.3e12 && ts<Date.now()+864e5) return ts;
  const bt = (m.batches||[]).map(b=>b.addedAt||0).filter(Boolean);
  return bt.length ? Math.min(...bt) : (m.updatedAt||0);
}
function invMedNextExpiry(m){
  let best = Infinity;
  activeBatches(m).forEach(b=>{ if(b.expiryDate){ const t = new Date(b.expiryDate).getTime(); if(!isNaN(t) && t<best) best = t; } });
  return best;
}
// pills sold per medicine in the chosen period (returns count as negative, so this is the NET sold)
function invSoldMap(days){
  const cutoff = days>0 ? Date.now()-days*86400000 : 0, map = {};
  visibleTransactions().forEach(t=>{
    if(t.timestamp<cutoff) return;
    (t.items||[]).forEach(it=>{ if(it.medId) map[it.medId] = (map[it.medId]||0) + (Number(it.pills)||0); });
  });
  return map;
}
// returns a comparator for the chosen arrangement, or null for "Default" (= the normal best-match order)
function invSortComparator(q){
  const st = invSortState(); if(st.key==="default") return null;
  const nameCmp = (a,b)=>String(a.name||"").localeCompare(String(b.name||""), undefined, {sensitivity:"base"});
  const sold = (st.key==="most"||st.key==="least") ? invSoldMap(st.days) : null;
  const by = (val, dir)=>(a,b)=>{ const x=val(a), y=val(b); if(x===y) return nameCmp(a,b); return dir*(x<y?-1:1); };
  switch(st.key){
    case "az": return nameCmp;
    case "za": return (a,b)=>nameCmp(b,a);
    case "newest": return by(invMedCreated,-1);
    case "oldest": return by(invMedCreated,1);
    case "changed": return by(m=>m.updatedAt||0,-1);
    case "most": return by(m=>sold[m.id]||0,-1);
    case "least": return by(m=>sold[m.id]||0,1);
    case "stockHi": return by(m=>Number(m.stockPills)||0,-1);
    case "stockLo": return by(m=>Number(m.stockPills)||0,1);
    case "mrpHi": return by(m=>Number(m.mrpPerBox)||0,-1);
    case "mrpLo": return by(m=>Number(m.mrpPerBox)||0,1);
    case "sizeHi": return by(m=>Number(m.pillsPerBox)||0,-1);
    case "sizeLo": return by(m=>Number(m.pillsPerBox)||0,1);
    case "expiry": return by(invMedNextExpiry,1);
  }
  return null;
}
function invArrangeBtnHtml(){

// Sits the menu directly under the Arrange button (or above it when there's more room there),
// kept inside the screen, with its own scroll only if it still wouldn't fit.
function positionInvSortMenu(){
  const o = document.getElementById("invSortSheet"); const m = o && o.firstElementChild; if(!m) return;
  const btn = document.getElementById("invArrangeBtn");
  const vw = window.innerWidth, vh = window.innerHeight, gap = 6, edge = 8;
  const w = Math.min(310, vw - edge*2);
  m.style.width = w + "px"; m.style.maxHeight = "none";
  const r = btn ? btn.getBoundingClientRect() : { left:vw/2, top:vh/2, bottom:vh/2, width:0 };
  const left = Math.max(edge, Math.min(r.left + r.width/2 - w/2, vw - w - edge));
  const natural = m.scrollHeight;
  const below = vh - r.bottom - gap - edge, above = r.top - gap - edge;
  const placeBelow = natural <= below || below >= above;
  const maxH = Math.max(120, placeBelow ? below : above);
  const h = Math.min(natural, maxH);
  m.style.left = left + "px";
  m.style.top = (placeBelow ? r.bottom + gap : Math.max(edge, r.top - gap - h)) + "px";
  m.style.maxHeight = maxH + "px";
}

      <button type="button" onclick="setInvSort('default')" style="display:flex;justify-content:space-between;align-items:center;width:100%;text-align:left;background:${defOn?"var(--primarySoft)":"none"};border:none;padding:9px 14px;font-size:13px;font-weight:600;color:var(--text);cursor:pointer;font-family:inherit;"><span>Default (best match)</span>${defOn?'<span style="color:var(--primary);">✓</span>':""}</button>
      ${group("Name",  [["az","A → Z"],["za","Z → A"]])}
      ${group("Date",  [["newest","Newest"],["oldest","Oldest"],["changed","Changed"]])}
      ${group("Sales", [["most","Most sold"],["least","Least sold"]])}
      ${row("Period", periodChips, false)}
      <p style="margin:-2px 12px 7px;font-size:10px;color:var(--faint);">Least sold lists unsold medicines first.</p>
      ${group("Stock", [["stockHi","Most"],["stockLo","Least"]])}

function renderInvList(){
  const myToken = ++_invRenderToken;
  const q = inv.query.toLowerCase();

    if(m.deleted) return false;
    if(inv.statFilter==='special' && !m.specialCategory) return false;
    if(inv.statFilter==='sTag' && !m.sTag) return false;
    if(inv.statFilter==='nonSpecial' && m.specialCategory) return false;
    return !q || medicineMatchesQuery(m,q);
  }).sort((()=>{ const c = invSortComparator(q); return c ? ((a,b)=>c(a,b) || (searchRankScore(b,q)-searchRankScore(a,q))) : ((a,b)=>searchRankScore(b,q)-searchRankScore(a,q)); })());

  const filterLabels = {special:"Special category", sTag:"S. tagged", nonSpecial:"Non-special"};
  const filterHtml = inv.statFilter ? `
    <p class="small faint mb2">Filtered: ${filterLabels[inv.statFilter]} · <button type="button" onclick="toggleInvStatFilter('all')" style="background:none;border:none;color:var(--primary);font-weight:700;cursor:pointer;padding:0;font-size:inherit;">Show all</button></p>` : "";

  if(!container) return;
  const _app = document.getElementById("app"), _keepTop = _app ? _app.scrollTop : 0;
  // Same results as what's already on screen (even if its background loading hadn't finished or was
  // superseded) = a refresh, not a new search: rebuild everything in one go so the page never shrinks.
  const sameAsShown = (_invShownKey === filterKey) && !!document.getElementById("invCardsList");
  _invShownKey = filterKey;

  // If this exact result set (same search text + same header-pill filter) was already fully
  // loaded onto the page before, this call is refreshing that SAME view with fresh data —
  // typically an incoming cloud-sync update landing while the person is just scrolled through
  // browsing, not a search/filter they just changed. Rebuilding the whole list in one
  // synchronous pass here (rather than resetting to a first batch of 15 and re-chunking the
  // rest in over several animation frames) means the page's height never briefly collapses
  // and grows back — which is what could clamp the scroll position mid-scroll and land a tap
  // meant for, say, the 50th medicine's Edit button onto a completely different card that had
  // snapped into that same screen position for an instant.
  if(_invListLoadedFor === filterKey || sameAsShown){
    container.innerHTML = `
      ${filterHtml}
      ${filtered.length===0?`<p class="small faint" style="text-align:center;padding:32px 0;">${inventory.length===0?"No medicines added yet. Tap + to add one.":"No matches."}</p>`:""}
      <div id="invCardsList">${filtered.map(buildInvCard).join("")}</div>
    `;
    _invListLoadedFor = filterKey;
    if(_app && _app.scrollTop !== _keepTop) _app.scrollTop = _keepTop;
    return;
  }

  // A genuinely new search/filter/tab-open — chunk it the usual way so THIS first paint of
  // this particular result set still feels instant even with a large medicine list.
  const FIRST_BATCH = 15;
  const CHUNK_SIZE = 30;
  const firstCards = filtered.slice(0, FIRST_BATCH).map(buildInvCard).join("");
  container.innerHTML = `
    ${filterHtml}
    ${filtered.length===0?`<p class="small faint" style="text-align:center;padding:32px 0;">${inventory.length===0?"No medicines added yet. Tap + to add one.":"No matches."}</p>`:""}
    <div id="invCardsList">${firstCards}</div>
  `;

  if(filtered.length <= FIRST_BATCH){ _invListLoadedFor = filterKey; return; }
  let idx = FIRST_BATCH;

    // Bail out quietly if a newer renderInvList() call has happened since (search edited,
    // tab changed, a medicine saved/restocked/deleted) or the list container is simply no
    // longer on screen — either way, this job's work is stale and should not touch the page.
    if(myToken !== _invRenderToken) return;
    const listEl = document.getElementById("invCardsList");
    if(!listEl) return;
    const chunk = filtered.slice(idx, idx+CHUNK_SIZE);
    listEl.insertAdjacentHTML("beforeend", chunk.map(buildInvCard).join(""));

/* ===================== RECORDS TAB ===================== */
// visibleTransactions() used to be a plain `transactions.filter(...)` recomputed on every
// single call — and renderRecords() alone calls it roughly 2 + (days already billed this
// month) times per render (once per day-in-month card, on top of the search/month-total
// calls), each one re-scanning the ENTIRE lifetime transaction history from scratch. That's
// fine with a handful of bills, but as the clinic's history grows into the hundreds/thousands
// of bills over months and years, that repeated full-history rescan is what made tab-switching
// (especially into Records) get slower and slower over time. Caching the filtered result and
// only invalidating it when `transactions` actually changes (see saveTransactions() below)
// turns that into one O(n) scan per render instead of dozens.
let _visibleTxCache = null;
function visibleTransactions(){
  if(_visibleTxCache === null) _visibleTxCache = transactions.filter(t=>!t.deleted);
  return _visibleTxCache;
}
function dayOptions(){
  const map = new Map();
  map.set(new Date().toDateString(), Date.now());
  const curMK = monthKeyOf(Date.now());
  visibleTransactions().forEach(t=>{
    if(monthKeyOf(t.timestamp)!==curMK) return; // older months are shown in the month/year folders below instead
    const k=new Date(t.timestamp).toDateString(); if(!map.has(k)) map.set(k,t.timestamp);
  });
  return Array.from(map.entries()).sort((a,b)=>b[1]-a[1]).map(([key,ts])=>({
    key, label: sameDay(ts,Date.now())?"Today":new Date(ts).toLocaleDateString(undefined,{day:"2-digit",month:"short",year:"numeric"})
  }));
}
function currentMonthTx(){ const curMK = monthKeyOf(Date.now()); return visibleTransactions().filter(t=>monthKeyOf(t.timestamp)===curMK); }
/* Manual correction: a number added on top of what's calculated from bills for a given
   month, kept separate from any single bill so it can never distort stock or a patient's
   record. Positive adds, negative subtracts. Defaults to 0 (no correction). */
function getMonthAdjustment(mk){
  const a = monthAdjustments[mk];
  return { doctorFee:(a&&a.doctorFee)||0, medTotal:(a&&a.medTotal)||0, testsTotal:(a&&a.testsTotal)||0, othersTotal:(a&&a.othersTotal)||0, updatedAt:(a&&a.updatedAt)||0 };
}
// "12 bills · 2 returns" — a return entry is not a bill/patient, so it is counted separately.
function billCountText(list){ const n=list.filter(t=>!isReturnTx(t)).length, r=list.length-n; return `${n} bill${n===1?"":"s"}${r?` · ${r} return${r===1?"":"s"}`:""}`; }
function monthAdjustedTotals(mk, tx){
  const computed = {
    medTotal: r2(tx.reduce((s,t)=>s+((t.medTotal||0)-(t.medsDiscount||0)),0)),
    feeTotal: r2(tx.reduce((s,t)=>s+((t.doctorFee||0)-(t.feeDiscount||0)),0)),
    testsTotal: r2(tx.reduce((s,t)=>s+((t.testsTotal||0)-(t.testsDiscount||0)),0)),
    extrasTotal: r2(tx.reduce((s,t)=>s+(t.extrasTotal||0),0))
  };
  const adj = getMonthAdjustment(mk);
  const medTotal = r2(computed.medTotal + adj.medTotal);
  const feeTotal = r2(computed.feeTotal + adj.doctorFee);
  const testsTotal = r2(computed.testsTotal + adj.testsTotal);
  const extrasTotal = r2(computed.extrasTotal + adj.othersTotal);
  return { medTotal, feeTotal, testsTotal, extrasTotal, grandTotal: r2(medTotal+feeTotal+testsTotal+extrasTotal), adj };
}
/* Same medicine/fee/tests/others split as monthAdjustedTotals(), but for a single day's
   transactions and with no manual correction applied — corrections are month-level only. */
function dayTotals(tx){
  const medTotal = r2(tx.reduce((s,t)=>s+((t.medTotal||0)-(t.medsDiscount||0)),0));
  const feeTotal = r2(tx.reduce((s,t)=>s+((t.doctorFee||0)-(t.feeDiscount||0)),0));
  const testsTotal = r2(tx.reduce((s,t)=>s+((t.testsTotal||0)-(t.testsDiscount||0)),0));
  const extrasTotal = r2(tx.reduce((s,t)=>s+(t.extrasTotal||0),0));
  return { medTotal, feeTotal, testsTotal, extrasTotal, grandTotal: r2(medTotal+feeTotal+testsTotal+extrasTotal) };
}

// Spreads a bill-level discount across its lines in proportion to their amounts, working in whole
// paise so the net line amounts add up EXACTLY to (gross - discount). Used so the monthly breakdown
// rows match the headline totals, which are already net of discounts.
function netLineAmounts(grossList, discount){
  const gc = grossList.map(x=>Math.round((Number(x)||0)*100)), G = gc.reduce((a,b)=>a+b,0);
  // A return entry has negative amounts and a negative "discount" (the % deducted from the refund): split it the same way, mirrored.
  if(G<0) return netLineAmounts(grossList.map(x=>-(Number(x)||0)), -(Number(discount)||0)).map(x=>-x);
  const dc = Math.min(Math.max(Math.round((Number(discount)||0)*100),0), G);
  if(!(dc>0) || !(G>0)) return gc.map(x=>x/100);
  const share = gc.map(x=>Math.floor(dc*x/G));
  let left = dc - share.reduce((a,b)=>a+b,0);
  for(let i=0; left>0 && i<gc.length; i++){ if(gc[i]-share[i]>0){ share[i]++; left--; } }
  return gc.map((x,i)=>(x-share[i])/100);
}
function monthMedicineDetail(mTx){
  const map = {};
  mTx.forEach(t=>{
    const items = t.items||[], net = netLineAmounts(items.map(it=>it.subtotal), t.medsDiscount);
    items.forEach((it,i)=>{
      const k = it.name;
      if(!map[k]) map[k] = { name: it.name, medId: it.medId, qty:0, worth:0 };
      map[k].qty += Number(it.pills)||0;
      map[k].worth = r2(map[k].worth + net[i]);
    });
  });
  return Object.values(map).filter(r=>r.qty!==0 || r.worth!==0).sort((a,b)=>b.worth-a.worth);   // a medicine fully returned in the same month nets to nothing
}
/* Once the pills sold cross a full box's worth for that medicine, show it as boxes +
   leftover loose medicine instead of a raw pill count — e.g. "2 boxes and 5 medicine"
   instead of "×25". Falls back to the plain "×N" form if the medicine can't be found
   (deleted with no id kept, or its box size was never set). */
function formatMedQtySold(qty, medId){
  const med = medId ? inventory.find(m=>m.id===medId) : null;
  const ppb = med ? Number(med.pillsPerBox)||0 : 0;
  if(ppb>0 && qty>=ppb){
    const boxes = Math.floor(qty/ppb);
    const rem = qty % ppb;
    const parts = [];
    if(boxes>0) parts.push(`${boxes} box${boxes===1?"":"es"}`);
    if(rem>0) parts.push(`${rem} medicine`);
    return parts.join(" and ");
  }
  return `×${qty}`;
}
function monthFeeDetail(mTx){
  const map = {};
  mTx.forEach(t=>{
    if(!t.doctorFee) return;
    const k = new Date(t.timestamp).toDateString();
    if(!map[k]) map[k] = { ts:t.timestamp, amount:0, count:0 };
    map[k].amount += (Number(t.doctorFee)||0) - (Number(t.feeDiscount)||0);
    map[k].count++;
  });
  return Object.values(map).sort((a,b)=>b.ts-a.ts);
}
function monthTestsDetail(mTx){
  const map = {};
  mTx.forEach(t=>{
    const tests = t.tests||[], net = netLineAmounts(tests.map(te=>te.amount), t.testsDiscount);
    tests.forEach((te,i)=>{
      const k = te.name;
      if(!map[k]) map[k] = { name: te.name, qty:0, worth:0, dates:[] };
      map[k].qty += 1;
      map[k].worth = r2(map[k].worth + net[i]);
      map[k].dates.push({ ts:t.timestamp, amount:net[i] });
    });
  });
  return Object.values(map).sort((a,b)=>b.worth-a.worth);
}
function monthOthersDetail(mTx){
  const map = {};
  mTx.forEach(t=>{
    (t.extras||[]).forEach(ex=>{
      const k = new Date(t.timestamp).toDateString();
      if(!map[k]) map[k] = { ts:t.timestamp, amount:0, count:0 };
      map[k].amount += Number(ex.amount)||0;
      map[k].count++;
    });
  });
  return Object.values(map).sort((a,b)=>b.ts-a.ts);
}

  });
  const pastYears = Array.from(pastYearsMap.entries()).sort((a,b)=>b[0]-a[0]);

  const curYearHtml = curYearMonths.map(([mk,g])=>monthFolder(mk,g)).join("");

  const pastYearsHtml = pastYears.map(([year,months])=>{
    const openY = rec.expandedYear===String(year);
    const yTotal = months.reduce((s,[mk,g])=>s+g.tx.reduce((s2,t)=>s2+t.grandTotal,0),0);
    const yCount = months.reduce((s,[mk,g])=>s+g.tx.length,0);

            ${can("monthlyTotal")?`<span style="font-weight:700;font-size:14px;">${CURRENCY}${money(yTotal)}</span>`:""}
            <span class="chev" style="${openY?"transform:rotate(180deg);":""}"></span>

        </button>
        ${openY?`<div style="padding:0 14px 14px;">${months.map(([mk,g])=>monthFolder(mk,g)).join("")}</div>`:""}
      </div>`;
  }).join("");

  return `
    <p class="small faint" style="font-weight:700;margin:18px 0 8px;">Earlier records</p>
    ${curYearHtml}
    ${pastYearsHtml}

}

// On the original bill: "↩ 2 returns · -Rs 55 · net Rs 45". On the return: "↩ From the bill of 3 Oct · Rs 100". Tapping either opens

function shareDay(dayKey){

  lines.push(``, `Total (${dayTx.filter(t=>!isReturnTx(t)).length} patients): ${CURRENCY}${money(dayTotal)}`);

function deleteTx(id){
  const t = transactions.find(x=>x.id===id); if(!t) return;
  if(isReturnTx(t)){ deleteReturnTx(t); return; }
  // What is STILL out of stock for each line: what left stock when the bill was made, minus whatever
  // returns already put back. (So a bill that was partly returned never gives the same medicine back twice.)
  const back = [];
  (t.items||[]).forEach((it,i)=>{
    const med = inventory.find(m=>m.id===it.medId); if(!med || med.deleted) return;
    const already = retDoneQty(t.id,i,it.lid);
    const out = q6(Math.max(0, stockBack(it) - already));
    if(out>0) back.push({ med, out, dedBatches:it.dedBatches, already });
  });
  const nRet = visibleTransactions().filter(r=>isReturnTx(r) && r.refOf===t.id).length;
  const doDelete = (returnIt)=>{
    // Soft-delete (tombstone) rather than removing it outright, so the deletion itself can
    // sync to other devices via updatedAt instead of the record quietly reappearing.
    if(returnIt){ back.forEach(b=>returnStockToBatches(b.med, b.dedBatches, b.out, b.already)); saveInventory(); }
    t.deleted = true; t.updatedAt = Date.now();
    t.delStock = (returnIt || !back.length) ? "back" : "kept";   // remembered, so deleting one of its returns later keeps the stock right
    logActivity("bill_del", (t.patientName||"Bill") + (back.length ? (returnIt ? " (stock returned)" : " (stock kept deducted)") : ""));
    saveTransactions(); render();
    if(returnIt && back.length) showToast("✓ Bill deleted — stock returned");
  };
  const retNote = nRet ? `It already has ${nRet} return${nRet===1?"":"s"} (they stay in Records as separate entries). ` : "";
  if(!back.length){ askConfirm(`Delete this bill record? ${nRet ? retNote+"Nothing is left to put back in stock." : ""}`.trim(), ()=>doDelete(false)); return; }
  askConfirm(`Delete this bill? ${retNote}Return the ${back.length} medicine line${back.length===1?"":"s"} still out to stock now${nRet?" (only what was not already returned)":""}, or keep the stock deducted?`,
    ()=>doDelete(true), "Return stock", "Keep stock deducted", ()=>doDelete(false));
}
// Deleting a RETURN puts everything back the way it was before the return: the refund leaves the totals,
// the medicines can be returned again from the bill, and the medicines it had put back on the shelf are taken out again.
function deleteReturnTx(t){
  const orig = transactions.find(x=>x.id===t.refOf);
  // If the original bill was already deleted and its stock handed back, that deletion already counted this
  // return's medicines — taking them out again would make the stock too low.
  const settled = !!(orig && orig.deleted && orig.delStock==="back");
  const lines = settled ? [] : (t.items||[]).filter(it=>{ const med=inventory.find(m=>m.id===it.medId); return med && !med.deleted && Math.abs(Number(it.pills)||0)>0; });
  const refund = -(t.grandTotal||0);
  askConfirm(`Delete this return? Everything goes back to how it was before it: the ${CURRENCY}${money(refund)} refund is removed from your totals, the medicines can be returned again from the bill`
      + (lines.length ? `, and ${lines.length} medicine line${lines.length===1?"":"s"} ${lines.length===1?"is":"are"} taken back out of stock.` : (settled ? ". Stock stays as it is (the original bill was already deleted and its stock returned)." : ".")),
    ()=>{
      lines.forEach(it=>{ const med=inventory.find(m=>m.id===it.medId); if(med) takeBackFromBatches(med, it.retBatches, Math.abs(Number(it.pills)||0)); });
      if(lines.length) saveInventory();
      t.deleted = true; t.updatedAt = Date.now();
      logActivity("bill_del", (t.patientName||"Return") + " (return deleted" + (lines.length ? ", stock taken back out" : "") + ")");
      saveTransactions(); render();
      showToast("✓ Return deleted — back to how it was");
    }, "Delete return");
}

function addEditTxItem(){

  const skipNew = recEdit.items.filter(x=>x._new && x.medId===med.id).reduce((a,x)=>a+(Number(x.pills)||0),0);
  const lc = lineCalc(med, pills, skipNew);
  recEdit.items.push({medId:med.id, name:med.name, pills, pricePerPill:lc.pricePerPill, subtotal:lc.subtotal, _new:true});
