        <button class="btn btn-outline" style="padding:10px 12px;color:var(--danger);" onclick="deleteProfile('${currentProfileId}')" title="Remove this person">🗑</button>
      </div>
      ${notesUi.addingProfile ? `
        <div class="flex gap2 mt2">
          <input ${NOAC} id="newProfileNameInput" value="${esc(notesUi.newProfileName)}" oninput="onNewProfileName(this.value)" placeholder="New person's name" class="flex1">
          <button class="btn btn-primary" onclick="addProfile()">Add</button>
        </div>` : ""}
    </div>`;

  if(notesUi.openId!==null){
    const isNew = notesUi.openId==="new";
    document.getElementById("main").innerHTML = profileSwitcher + `
      <button onclick="backFromNote()" style="background:none;border:none;color:var(--primary);font-weight:600;font-size:14px;cursor:pointer;padding:0;margin-bottom:12px;">← Back</button>
      <input ${NOAC} id="noteTitleInput" value="${esc(notesUi.draftTitle)}" oninput="onNoteTitle(this.value)" placeholder="Note title" style="font-weight:700;" class="mb2">
      <textarea ${NOAC} id="noteBodyInput" oninput="onNoteBody(this.value)" placeholder="Write here — supplier calls, reminders, things to order, notes for the next shift…" style="min-height:40vh;">${esc(notesUi.draftBody)}</textarea>
      <div class="flex gap2 mt3">
        <button class="btn btn-primary flex1" onclick="saveDraftNote()">Save note</button>
        ${!isNew?`<button class="btn btn-success" onclick="shareNote('${notesUi.openId}')">📤 Share</button>`:""}
      </div>
      ${!isNew?`<button class="btn" style="width:100%;background:none;color:var(--danger);margin-top:8px;" onclick="deleteNote('${notesUi.openId}')">🗑 Delete note</button>`:""}
    `;
    return;
  }

  const sorted = notes
    .filter(n=>{
      if(n.deleted) return false;
      const q = notesUi.searchQuery.trim().toLowerCase();
      if(!q) return true;
      return n.title.toLowerCase().includes(q) || n.body.toLowerCase().includes(q);
    })
    .sort((a,b)=>b.updatedAt-a.updatedAt);
  document.getElementById("main").innerHTML = profileSwitcher + `
    <button class="btn-dashed mb2" onclick="openNewNote()">+ New note</button>
    <div class="search-wrap mb2">
      <span class="search-icon">🔍</span>
      <input ${NOAC} id="notesSearchInput" value="${esc(notesUi.searchQuery)}" oninput="onNotesSearch(this.value)" placeholder="Search notes by topic or text…">
    </div>

    ${sorted.length===0?`<p class="small faint" style="text-align:center;padding:24px 0;">${notesUi.searchQuery.trim()?`No notes match "${esc(notesUi.searchQuery)}".`:"No notes yet — jot down reminders, supplier calls, or things to order."}</p>`:""}
    ${sorted.map(n=>`
      <div class="card">
        <button onclick="openExistingNote('${n.id}')" style="width:100%;text-align:left;background:none;border:none;padding:0;cursor:pointer;">
          <p class="item-title">${esc(n.title)}</p>
          ${n.body?`<p class="small" style="color:var(--muted);margin:4px 0 0;">${esc(n.body.slice(0,120))}${n.body.length>120?"…":""}</p>`:""}
          <p style="font-size:11px;color:var(--faint);margin:6px 0 0;">${fmtDateTime(n.updatedAt)}</p>
        </button>
        <div class="flex gap2 mt2">
          <button class="btn btn-success flex1" style="padding:6px;font-size:12px;" onclick="shareNote('${n.id}')">📤 Share</button>
          <button class="btn btn-outline" style="padding:6px 12px;" onclick="deleteNote('${n.id}')">🗑</button>
        </div>
      </div>`).join("")}
    <p class="small faint" style="text-align:center;">Only ${esc(profiles.find(p=>p.id===currentProfileId)?.name||"you")} can see these notes. Medicines, bills, and records are shared with everyone on this device.</p>
  `;
}

/* ===================== BACKUP & RESTORE ===================== */
/* Everything in this app already lives in the phone's storage (localStorage), which
   survives closing the app/browser and restarting the phone. The real risk is someone
   clearing browser/site data, or reinstalling the browser — that does wipe it. Export
   makes a real file in your phone's Downloads/Files app, completely outside the
   browser, so you always have a copy to restore from no matter what happens to it. */
function mergeById(localArr, incomingArr){
  const map = new Map();
  (localArr||[]).forEach(x=>map.set(x.id,x));
  (incomingArr||[]).forEach(x=>{ if(!map.has(x.id)) map.set(x.id,x); });
  return Array.from(map.values());
}
function mergeInventory(localInv, incomingInv){
  const result = (localInv||[]).map(m=>({...m, batches:(m.batches||[]).slice()}));
  (incomingInv||[]).forEach(im=>{
    let match = result.find(m=>m.id===im.id);
    if(!match) match = result.find(m=>m.name.trim().toLowerCase()===im.name.trim().toLowerCase());
    if(match){
      match.batches = mergeById(match.batches, im.batches);
      match.category = match.category || im.category || "";
      match.specialCategory = match.specialCategory || im.specialCategory || "";
      match.formula = match.formula || im.formula || "";
      match.mg = match.mg || im.mg || "";
      match.deleted = match.deleted || im.deleted;
      recomputeStock(match);
    } else {
      const copy = {...im, batches:(im.batches||[]).slice()};
      recomputeStock(copy);
      result.push(copy);
    }
  });
  return result;
}
/* ---- LIVE-SYNC-ONLY reconciliation ----
   mergeInventory (above) is deliberately additive/never-overwrite: it's built for the offline
   backup file, which combines two phones that may have been apart for weeks, so it must never
   let one side's file silently clobber real edits the other side made. Live cloud sync is a
   different problem — it's the same shared dataset, seconds apart, and a sale/restock/edit on
   one phone MUST overwrite the stale copy on the other. So for the cloud path we reconcile by
   "whoever touched it most recently wins", using the updatedAt timestamps stamped on every
   medicine-level edit and every batch-level stock change. */
function reconcileBatchesForSync(localBatches, remoteBatches){
  const remoteMap = new Map((remoteBatches||[]).map(b=>[b.id,b]));
  const seen = new Set();
  const result = (localBatches||[]).map(lb=>{
    seen.add(lb.id);
    const rb = remoteMap.get(lb.id);
    if(!rb) return lb; // batch only exists locally (e.g. restocked here) — keep it
    const lt = lb.updatedAt||lb.addedAt||0, rt = rb.updatedAt||rb.addedAt||0;
    return rt>lt ? {...rb} : lb; // newer side's version of THIS batch wins
  });
  (remoteBatches||[]).forEach(rb=>{
    if(!seen.has(rb.id)) result.push({...rb}); // batch only exists remotely — add it
  });
  return result;
}
function pickNewerMedicine(a,b){
  // Scalar fields (name/price/etc.) come from whichever side edited most recently.
  // Batches (actual stock) are reconciled independently and separately above, so a restock
  // never gets lost just because the OTHER device happens to "win" on the scalar fields.
  const aT = a.updatedAt||0, bT = b.updatedAt||0;
  const base = aT>=bT ? a : b;
  return {
    id: a.id, name: base.name, category: base.category||"", specialCategory: base.specialCategory||"", formula: base.formula||"", mg: base.mg||"",
    mrpPerBox: base.mrpPerBox, pillsPerBox: base.pillsPerBox,
    lowStockAt: base.lowStockAt, noWarn: !!base.noWarn, deleted: !!base.deleted,
    updatedAt: Math.max(aT,bT),
    batches: reconcileBatchesForSync(a.batches, b.batches)
  };
}
function reconcileInventoryForSync(localInv, remoteInv){
  const remoteMap = new Map((remoteInv||[]).map(m=>[m.id,m]));
  const seen = new Set();
  const result = (localInv||[]).map(lm=>{
    seen.add(lm.id);
    const rm = remoteMap.get(lm.id);
    return rm ? pickNewerMedicine(lm, rm) : lm;
  });
  (remoteInv||[]).forEach(rm=>{
    if(!seen.has(rm.id)) result.push({...rm, batches:(rm.batches||[]).slice()});
  });
  result.forEach(recomputeStock);
  return result;
}
// Last-write-wins merge by id, for the LIVE cloud path only (bills, notes, profiles). Unlike
// mergeById (additive-only — used by the offline backup file, see below), this actually lets a
// newer edit or a soft-delete tombstone on one device overwrite the stale copy on another,
// instead of the always-newer local/remote scan just re-adding whatever the other side still has.
function mergeByIdForSync(localArr, incomingArr){
  const incomingMap = new Map((incomingArr||[]).map(x=>[x.id,x]));
  const seen = new Set();
  const result = (localArr||[]).map(l=>{
    seen.add(l.id);
    const r = incomingMap.get(l.id);
    if(!r) return l;
    const lt = l.updatedAt||l.timestamp||0, rt = r.updatedAt||r.timestamp||0;
    return rt>lt ? r : l;
  });
  (incomingArr||[]).forEach(r=>{ if(!seen.has(r.id)) result.push(r); });
  return result;
}
// Monthly correction totals are a plain {month: {...}} object, not an id-keyed array, so they
// get their own merge: per month key, keep whichever side's correction was saved most recently.
// Simple scalar setting, same last-write-wins shape as everything else here: whichever side
// touched it more recently wins outright — no need for per-field merging like the test
// catalog has, since it's a single number, not a list of independent items.
function mergeDefaultDoctorFee(data){
  const incomingTs = data.defaultDoctorFeeUpdatedAt || 0;
  if(incomingTs > defaultDoctorFeeUpdatedAt){
    defaultDoctorFee = data.defaultDoctorFee || 0;
    defaultDoctorFeeUpdatedAt = incomingTs;
    saveDefaultDoctorFeeStorage();
    saveDefaultDoctorFeeUpdatedAt();
    // bill.fee is copied from defaultDoctorFee only once, at the moment a New Bill screen is
    // created (see newBillState()) — usually before sync has even had a chance to run, since
    // that happens at app startup. So defaultDoctorFee itself merging correctly isn't enough:
    // the already-displayed fee field has no way to react to a value that arrives later and
    // would otherwise keep showing a stale number forever, until the user happened to start a
    // brand new bill or edit the fee by hand. Refresh it now — but ONLY when the current bill
    // is still completely untouched (no patient, no items/tests/extras, not mid-edit), so a
    // bill the user has actually started is never silently changed under them.
    if(typeof bill!=="undefined" && bill && !bill.patient.trim() && bill.items.length===0 && bill.extras.length===0 && bill.tests.length===0 && !bill.feeEditing){
      bill.fee = defaultDoctorFee ? String(defaultDoctorFee) : "";
    }
  }
}
function mergeMonthAdjustments(localAdj, incomingAdj){
  const result = {...(localAdj||{})};
  Object.entries(incomingAdj||{}).forEach(([mk,ia])=>{
    const la = result[mk];
    if(!la || (ia.updatedAt||0) > (la.updatedAt||0)) result[mk] = ia;
  });
  return result;
}
// Test catalog & pricing (custom tests, renamed/hidden built-ins, and prices) is synced, one
// test at a time, by that test's own testItemUpdatedAt entry — NOT as one all-or-nothing
// bundle. The old version compared a single shared timestamp for the whole catalog, so if
// Phone A added "Uric Acid" (bumping the shared time) while Phone B had, at any point, made
// its OWN unrelated test edit with a later timestamp, B's next sync would completely
// overwrite the catalog with its own version — silently discarding Uric Acid and anything
// else A had added or priced, and vice-versa. Comparing per test id instead means each
// test's own history decides its own outcome, so two devices' different additions/prices
// combine instead of one wiping out the other.
function mergeTestSettings(data){
  const incomingItemTs = data.testItemUpdatedAt || {};
  // Old backup files / not-yet-updated devices have no per-id times at all — for those,
  // fall back to their whole-bundle time as a stand-in per-id time for every id they have
  // data for, so merging against them still behaves sensibly.
  const incomingBundleTs = data.testSettingsUpdatedAt || 0;
  const incomingCustomById = {}; (data.customTests||[]).forEach(t=>{ incomingCustomById[t.id]=t; });
  const localCustomById = {}; customTests.forEach(t=>{ localCustomById[t.id]=t; });
  const incomingNameOverrides = data.testNameOverrides || {};
  const incomingHiddenSet = new Set(data.hiddenBuiltInTestIds || []);
  const localHiddenSet = new Set(hiddenBuiltInTestIds);
  const incomingPrices = data.testPrices || {};

  const ids = new Set([
    ...TEST_CATALOG.map(t=>t.id),
    ...customTests.map(t=>t.id),
    ...(data.customTests||[]).map(t=>t.id)
  ]);

  const mergedCustomById = {};
  const mergedNameOverrides = {};
  const mergedHidden = [];
  const mergedPrices = {};
  const mergedItemTs = {...testItemUpdatedAt};

  ids.forEach(id=>{
    const localTs = testItemUpdatedAt[id] || 0;
    const hasIncomingData = incomingCustomById[id]!=null || incomingNameOverrides[id]!=null || incomingHiddenSet.has(id) || incomingPrices[id]!=null;
    const inTs = incomingItemTs[id] || (hasIncomingData ? incomingBundleTs : 0);
    const incomingWins = inTs > localTs;
    mergedItemTs[id] = incomingWins ? inTs : localTs;

    const winningCustom = incomingWins ? incomingCustomById[id] : localCustomById[id];
    if(winningCustom) mergedCustomById[id] = winningCustom;

    const winningOverride = incomingWins ? incomingNameOverrides[id] : testNameOverrides[id];
    if(winningOverride!=null) mergedNameOverrides[id] = winningOverride;

    const winningHidden = incomingWins ? incomingHiddenSet.has(id) : localHiddenSet.has(id);
    if(winningHidden) mergedHidden.push(id);

    const winningPrice = incomingWins ? incomingPrices[id] : testPrices[id];
    if(winningPrice!=null) mergedPrices[id] = winningPrice;
  });

  customTests = Object.values(mergedCustomById);
  testNameOverrides = mergedNameOverrides;
  hiddenBuiltInTestIds = mergedHidden;
  testPrices = mergedPrices;
  testItemUpdatedAt = mergedItemTs;
  testSettingsUpdatedAt = Math.max(testSettingsUpdatedAt, incomingBundleTs); // legacy marker only

  saveCustomTests(); saveTestNameOverrides(); saveHiddenBuiltInTests(); saveTestPrices(); saveTestSettingsUpdatedAt(); saveTestItemUpdatedAt();
}

function mergeDataInto(data, inventoryMergeFn, live){
  inventory = inventoryMergeFn(inventory, data.inventory);

  if(live){
    transactions = mergeByIdForSync(transactions, data.transactions);
  } else {
    transactions = mergeById(transactions, data.transactions);
  }
  transactions.sort((a,b)=>b.timestamp-a.timestamp);

  if(live){
    profiles = mergeByIdForSync(profiles, data.profiles);
  } else {
    const profResult = (profiles||[]).slice();
    (data.profiles||[]).forEach(ip=>{
      let match = profResult.find(p=>p.id===ip.id);
      if(!match) match = profResult.find(p=>p.name.trim().toLowerCase()===ip.name.trim().toLowerCase());
      if(!match) profResult.push(ip);
    });
    profiles = profResult;
  }

  const incomingNotes = data.notesByProfile || {};
  profiles.forEach(p=>{
    let localNotes;
    try{ localNotes = JSON.parse(localStorage.getItem("clinic_notes_"+p.id)||"[]"); }catch(e){ localNotes=[]; }
    const merged = live ? mergeByIdForSync(localNotes, incomingNotes[p.id]) : mergeById(localNotes, incomingNotes[p.id]);
    merged.sort((a,b)=>(b.updatedAt||0)-(a.updatedAt||0));
    try{ localStorage.setItem("clinic_notes_"+p.id, JSON.stringify(merged)); }catch(e){}
  });

  // Monthly corrections: keyed by month, not an array of records — for each month, whichever
  // side touched it most recently wins. Safe either way since it's just an override number,
  // never a quantity that could be double-counted or lost.
  monthAdjustments = mergeMonthAdjustments(monthAdjustments, data.monthAdjustments);
  mergeTestSettings(data);
  mergeDefaultDoctorFee(data);

  saveInventory(); saveTransactions(); saveProfiles(); saveMonthAdjustments();
  if(currentProfileId && !visibleProfiles().some(p=>p.id===currentProfileId)){
    currentProfileId = null;
  }
  if(!currentProfileId && visibleProfiles()[0]){
    currentProfileId = visibleProfiles()[0].id;
    localStorage.setItem("clinic_current_profile", currentProfileId);
  }
  loadNotesForCurrentProfile();
}
// Offline backup file import — unchanged, additive/never-overwrite merge. Two phones may have
// been apart for weeks, so this must never let one side's file silently delete or clobber
// something real the other side entered independently.
function mergeBackupInto(data){ mergeDataInto(data, mergeInventory, false); }
// Live Firestore sync — last-write-wins for inventory, bills, notes, and profiles, so an edit,
// restock, sale, warning toggle, or DELETE made on one phone correctly propagates to the other
// instead of being silently ignored (or the deleted item quietly reappearing a second later).
function mergeCloudSnapshotInto(data){ mergeDataInto(data, reconcileInventoryForSync, true); }
function toggleBackupModal(){ backupUi.open = !backupUi.open; render(); }

let fbDb = null, syncStatus = "offline", suppressPush = false, syncDebounceTimer = null;
// pushInFlight: true only while OUR OWN pushToCloud() call is actively running. The listener
// below checks this before touching the badge, so the two never fight over the same status —
// that fight was what made the badge flash "Offline" right after completing a bill, and could
// also leave it stuck since whichever one wrote last "won" unpredictably.
let pushInFlight = false;
// snapshotUnsubscribe: handle for the current onSnapshot listener. startCloudSync() can be
// called again later (see the reconnect path below) — without closing the previous listener
// first, each retry left an extra listener running forever, all reacting to every future
// change. That's a likely cause of unreliable cross-device sync, not just a badge glitch.
let snapshotUnsubscribe = null;

// can be diagnosed on a phone with no access to browser dev tools.
let lastSyncError = null;
try{
  const fbApp = firebase.initializeApp(firebaseConfig);
  fbDb = firebase.firestore();
}catch(e){ console.error("Firebase init failed", e); }

function cloudDocRef(){ return fbDb.collection("sync").doc("state"); }
function buildFullStatePayload(){
  return {
    syncCode: SYNC_CODE,
    inventory, transactions, profiles, monthAdjustments,
    notesByProfile: collectAllNotes(),
    customTests, testNameOverrides, hiddenBuiltInTestIds, testPrices, testSettingsUpdatedAt, testItemUpdatedAt,

}

}
function setSyncError(e){

}
function clearSyncError(){

function applyRemoteSnapshot(data){
  if(!data) return;
  suppressPush = true;

function schedulePushToCloud(){
  if(!fbDb || suppressPush) return;

// Wraps a Firestore promise so a genuinely dead connection resolves to "Offline" within 10s
// instead of hanging forever — Firestore's own promises don't reject when offline, they just
// never resolve, which is exactly what forced a manual refresh to recover before.
function withTimeout(promise, ms){
  return Promise.race([
    promise,
    new Promise((_,reject)=>setTimeout(()=>reject(new Error("timed out")), ms))
  ]);
}
// Firestore rejects any field whose value is literally `undefined` (unlike `null`, which is
// fine) and rejects the ENTIRE write the moment it finds one, however deeply buried. The bugs
// above (missing category/formula/mg on older medicine records) were one way that could sneak
// in — this is a safety net so no other undiscovered case can silently break every sync again.
// A JSON round-trip is a simple, thorough way to strip these out anywhere in the structure:
// it drops undefined object properties and turns undefined array entries into null, both of
// which Firestore accepts fine.
function sanitizeForFirestore(obj){ return JSON.parse(JSON.stringify(obj)); }
async function pushToCloud(){
  if(!fbDb) return;
  pushInFlight = true;
  // If we were already showing "Synced" before this push (e.g. right after completing a
  // bill), keep showing "Synced" through the push instead of flashing "Syncing…" — the
  // badge should only visibly change if something actually goes wrong (see catch below).
  // A push starting from any other state (offline/cached/error/initial) still shows the
  // normal "Syncing…" transition, since that's a real state change worth surfacing.
  const wasSynced = (syncStatus === "synced");
  if(!wasSynced){ syncStatus = "syncing"; renderSyncBadge(); }
  try{
    const snap = await withTimeout(cloudDocRef().get(), 10000);
    if(snap.exists) { suppressPush=true; mergeCloudSnapshotInto(snap.data()); suppressPush=false; }
    await withTimeout(cloudDocRef().set(sanitizeForFirestore(buildFullStatePayload())), 10000);
    syncStatus = "synced";
    clearSyncError();
  }catch(e){ syncStatus = "offline"; setSyncError(e); }
  pushInFlight = false;
  renderSyncBadge();
}
// The realtime onSnapshot listener needs a persistent connection, which some mobile browser
// contexts (especially a file opened directly rather than through an app with an already-warm
// connection) are slow to establish or don't establish at all — leaving the screen showing
// blank/default data indefinitely even though the real data is sitting right there in the
// cloud. A plain one-off request doesn't need that persistent connection and gets through in
// those same conditions (this is exactly why adding a test — which triggers pushToCloud()'s own
// one-off get() — immediately "fixed" the display: the listener was still stuck, but a plain
// fetch wasn't). Doing the same one-off fetch proactively at startup means real data shows up
// right away without needing any interaction to force it.
async function initialCloudFetch(){
  if(!fbDb) return;
  try{
    const snap = await withTimeout(cloudDocRef().get(), 10000);
    if(snap.exists) applyRemoteSnapshot(snap.data());
  }catch(e){
    // No special handling needed — the realtime listener below keeps retrying regardless,
    // and this was only ever a best-effort head start.
  }
}
function startCloudSync(){
  if(!fbDb) { syncStatus="offline"; renderSyncBadge(); return; }
  if(snapshotUnsubscribe){ snapshotUnsubscribe(); snapshotUnsubscribe = null; }
  syncStatus="syncing"; renderSyncBadge();
  initialCloudFetch();
  snapshotUnsubscribe = cloudDocRef().onSnapshot(
    snap=>{
      if(snap.exists) applyRemoteSnapshot(snap.data());
      // Firestore fires this listener once immediately from local cache (even with zero
      // internet) and again later once it actually reaches the server. Without checking
      // fromCache, the badge would say "Synced" on that first cache-only firing even while
      // fully offline. Only the non-cache firing means data has actually been confirmed
      // against the server.
      //
      // While pushToCloud() is actively driving the badge for a write we just made, this
      // listener stands down completely and lets pushToCloud() set the definitive final
      // status itself. Otherwise this listener is the source of truth — e.g. a change
      // arriving live from another device, or a genuine, ongoing offline state.
      if(!pushInFlight){
        syncStatus = snap.metadata.fromCache ? "cached" : "synced";
        renderSyncBadge();
        if(!snap.metadata.fromCache) clearSyncError();
      }
    },
    async err=>{
      // This is the FIRST real error Firestore reported for the listener itself — surface it
      // immediately, since it's often more informative than whatever the retry below hits.
      setSyncError(err);
      // A single failed listener attempt does NOT tell us the document is missing — it could
      // just as easily be a transient network blip, which happens especially often right when
      // the app first loads (e.g. opened directly as a local file, before the browser's network
      // stack is fully ready — much more likely than when opened via an app that already has a
      // warm connection). The old code here treated ANY error as "doc doesn't exist yet" and
      // immediately WROTE this device's current state over the shared cloud document — on a
      // fresh load that state is still the empty defaults (0 custom tests, all prices 0), so a
      // single mistimed hiccup could silently wipe every other device's real data. This is
      // exactly the bug reported: tests/prices sometimes showing blank depending on how/when
      // the file was opened, with nothing actually wrong with the file itself.
      // Fix: do one plain read first, and only create the document if that read positively
      // confirms nothing exists yet. If the read also fails, we still don't know either way —
      // so do nothing and stay offline rather than guess and risk overwriting real data.
      try{
        const snap = await withTimeout(cloudDocRef().get(), 10000);
        if(snap.exists){
          // Document is there — the listener itself just hiccuped, not a missing-doc case.
          // Restart listening; never touch the data.
          startCloudSync();
        } else {
          // Confirmed: genuinely no shared document exists anywhere yet. Safe to create it
          // from this device's current state since there is nothing real to lose.
          await cloudDocRef().set(sanitizeForFirestore(buildFullStatePayload()));
          startCloudSync();
        }
      }catch(e){ syncStatus="offline"; setSyncError(e); renderSyncBadge(); }
    }
  );
}

function onBackupFileSelected(evt){
  const file = evt.target.files && evt.target.files[0];
  if(!file) return;

  reader.onload = ()=>{
    let data;
    try{ data = JSON.parse(reader.result); }catch(e){ showToast("⚠ That file isn't a valid backup"); evt.target.value=""; return; }
    if(!data || !Array.isArray(data.inventory) || !Array.isArray(data.transactions)){
      showToast("⚠ That file isn't a valid backup"); evt.target.value=""; return;
    }
    askConfirm("Combine this backup with what's already on this device? Bills, medicines, stock and notes from both will be kept — nothing on this device will be lost.", ()=>{

      showToast("✓ Merged — downloading the combined file to send back to the other phone");
      setTimeout(exportBackup, 600);
    });
  };
  reader.readAsText(file);
}
function formatBytes(n){
  if(n < 1024) return n + " B";
  if(n < 1024*1024) return (n/1024).toFixed(1) + " KB";
  return (n/(1024*1024)).toFixed(2) + " MB";
}
// estimatedCloudDataSize() JSON-stringifies the whole app state, and render() calls it on
// EVERY render — including every single keystroke. Recomputing that on every keystroke is
// wasted work for a number that only needs to be "close enough" (it's already labelled an
// estimate, not a live reading). Cache it for a second so typing stays snappy; the badge is
// still fresh within ~1s of any real change.
let _cloudSizeCache = { bytes: null, at: 0 };
function estimatedCloudDataSize(){
  const now = Date.now();
  if(now - _cloudSizeCache.at < 1000) return _cloudSizeCache.bytes;
  // This mirrors buildFullStatePayload() — the exact object pushed to Firestore — so
  // measuring its JSON size gives a close real-world estimate of what's stored in the cloud,
  // even though Firestore itself doesn't expose a "how big is my data" API to client apps.
  try{
    const payload = buildFullStatePayload();
    const bytes = new Blob([JSON.stringify(payload)]).size;
    _cloudSizeCache = { bytes, at: now };
    return bytes;
  }catch(e){ _cloudSizeCache = { bytes: null, at: now }; return null; }
}
function renderBackupModal(){
  const root = document.getElementById("backupModalRoot");
  if(!root) return;
  if(!backupUi.open){ root.innerHTML=""; return; }
  const sizeBytes = estimatedCloudDataSize();
  const sizePct = sizeBytes!=null ? (sizeBytes / (1024*1024*1024) * 100) : null;
  root.innerHTML = `
    <div class="modal-overlay" onclick="if(event.target===this) toggleBackupModal()">
      <div class="modal">
        <div class="modal-head">
          <strong>Backup &amp; Restore</strong>
          <button class="modal-x" onclick="toggleBackupModal()">✕</button>
        </div>
        <div style="padding:14px 16px;">
          ${sizeBytes!=null ? `
          <div class="card" style="background:var(--primarySoft);border:none;margin-bottom:12px;">
            <div class="row">
              <span class="small" style="font-weight:700;color:var(--primary);">Estimated cloud data used</span>
              <span style="font-weight:700;font-size:15px;color:var(--primary);">${formatBytes(sizeBytes)}</span>
            </div>
            <p class="small faint" style="margin:4px 0 0;">≈ ${sizePct.toFixed(4)}% of the 1 GB free storage limit — an estimate based on your data, not a live reading from Google's servers.</p>
          </div>` : ""}
          <p class="small" style="margin:0 0 12px;">Your data is already saved on this phone and survives closing the app or restarting your phone. The only real risk is clearing browser/site data — download a backup now and then and keep it somewhere safe.</p>
          <p class="small" style="margin:0 0 12px;color:var(--primary);">To sync two phones with no internet: export on Phone A → send the file over Bluetooth/Nearby Share → import on Phone B. It merges automatically — bills, stock and notes from both phones are combined, nothing is lost or double-counted — and B will then download a combined file for you to send back to A the same way.</p>
          <button class="btn btn-primary" style="width:100%;margin-bottom:10px;" onclick="exportBackup()">⬇ Download backup file</button>
          <button class="btn btn-outline" style="width:100%;" onclick="triggerImportPicker()">⬆ Import &amp; merge backup file</button>
        </div>
      </div>
    </div>`;
}

/* ===================== FULLSCREEN ===================== */
function toggleFullscreen(){
  if(!document.fullscreenElement){
    document.documentElement.requestFullscreen?.().catch(()=>{});
  } else {
    document.exitFullscreen?.();
  }
}

/* ===================== INIT ===================== */
loadAll();
bill = newBillState();
render();
startCloudSync();
</script>
<script>
// Registers the service worker (sw.js, same folder) so the app is cached on first load and
// works fully offline afterward — needed once the app is loaded from a real URL (GitHub Pages)
// instead of a local file, since that's what fixed localStorage but on its own would otherwise
// require internet on every open.
if("serviceWorker" in navigator){
  window.addEventListener("load", ()=>{
    navigator.serviceWorker.register("sw.js").catch(()=>{});
  });
}
</script>
