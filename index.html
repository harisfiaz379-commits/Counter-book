<!DOCTYPE html>
<html lang="en">
<head>
<script>
// This WebView (confirmed via on-device testing) leaves window.localStorage present but set
// to null, while sessionStorage/indexedDB both work fine — so every localStorage.getItem/
// setItem call in the app below would throw. Replacing window.localStorage with a shim backed
// by IndexedDB fixes this WITHOUT touching any of the app's own code (which just keeps calling
// localStorage.getItem/setItem exactly as before). IndexedDB itself is async, so on startup we
// hydrate an in-memory copy first — window.__localStorageReady resolves once that's done, and
// the app's own boot sequence (bottom of the file) waits on it before calling loadAll().
(function(){
  // Only step in if real localStorage is actually broken here — everywhere else (a normal
  // browser, a different device where it works fine) must keep using the real thing untouched,
  // so existing data already saved there is never hidden behind an empty shim.
  var realLocalStorageWorks = false;
  try{
    localStorage.setItem("__ls_probe__", "1");
    realLocalStorageWorks = (localStorage.getItem("__ls_probe__") === "1");
    localStorage.removeItem("__ls_probe__");
  }catch(e){ realLocalStorageWorks = false; }
  if(realLocalStorageWorks){ window.__localStorageReady = Promise.resolve(); return; }

  var DB_NAME = "localStorageShim", STORE = "kv";
  var memory = {};
  var dbPromise = null;
  function openDb(){
    if(dbPromise) return dbPromise;
    dbPromise = new Promise(function(resolve, reject){
      var req = indexedDB.open(DB_NAME, 1);
      req.onupgradeneeded = function(){ req.result.createObjectStore(STORE); };
      req.onsuccess = function(){ resolve(req.result); };
      req.onerror = function(){ reject(req.error); };
    });
    return dbPromise;
  }
  function hydrate(){
    return openDb().then(function(db){
      return new Promise(function(resolve, reject){
        var tx = db.transaction(STORE, "readonly");
        var req = tx.objectStore(STORE).openCursor();
        req.onsuccess = function(e){
          var cursor = e.target.result;
          if(cursor){ memory[cursor.key] = cursor.value; cursor.continue(); }
          else resolve();
        };
        req.onerror = function(){ reject(req.error); };
      });
    });
  }
  function persist(key, value){
    openDb().then(function(db){
      var store = db.transaction(STORE, "readwrite").objectStore(STORE);
      if(value === null) store.delete(key); else store.put(value, key);
    }).catch(function(){});
  }
  var shim = {
    getItem: function(key){ return Object.prototype.hasOwnProperty.call(memory, key) ? memory[key] : null; },
    setItem: function(key, value){ value = String(value); memory[key] = value; persist(key, value); },
    removeItem: function(key){ delete memory[key]; persist(key, null); },
    key: function(i){ return Object.keys(memory)[i] || null; },
    clear: function(){ memory = {}; openDb().then(function(db){ db.transaction(STORE,"readwrite").objectStore(STORE).clear(); }).catch(function(){}); }
  };
  Object.defineProperty(shim, "length", { get: function(){ return Object.keys(memory).length; } });
  function install(){
    try{ Object.defineProperty(window, "localStorage", { value: shim, configurable: true }); }
    catch(e){ window.localStorage = shim; }
  }
  window.__localStorageReady = hydrate().then(install).catch(install);
})();
</script>

<style>
  :root{
    --page:#F3F6F7; --header:#0F5C57; --headerSub:#CFE9E5;
    --primary:#0F5C57; --primarySoft:#E4F1EF;
    --text:#1B2430; --muted:#7C8A99; --faint:#A9B4BE;
    --border:#E2E8F0; --card:#FFFFFF;
    --success:#0E9F6E; --successSoft:#E5F8F1;
    --danger:#DC3B2C; --dangerSoft:#FCEAE8;
    --warning:#B4650A; --warningSoft:#FDF3E3;
  }
  *{box-sizing:border-box;}
  /* Text-selection highlight + caret, tinted to the app's green theme instead of the
     device/WebView's default accent (which shows up pink on some devices). Modern Chromium/
     WebView also tints the drag-selection handles to match ::selection in most versions, though
     that part is ultimately up to the WebView and can't be fully guaranteed from CSS alone. */
  ::selection{ background:var(--primary); color:#fff; }
  input, textarea{ caret-color:var(--primary); accent-color:var(--primary); }
  html,body{margin:0;padding:0;height:100%;background:var(--page);color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;overflow-x:hidden;}
  #app{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;overflow-x:hidden;}
  header{background:var(--header);color:#fff;padding:18px 16px 14px;position:fixed;top:0;left:0;right:0;width:100%;z-index:30;
    box-shadow:0 1px 3px rgba(0,0,0,.15);display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:8px;}
  header h1{margin:0;font-size:18px;font-weight:700;}
  header p{margin:2px 0 0;font-size:12px;color:var(--headerSub);}
  @keyframes uploadSlide{0%{left:-30%;}100%{left:100%;}}
  #banner{font-size:12px;padding:8px 16px;background:var(--warningSoft);color:var(--warning);
    border-bottom:1px solid #F0DCB0;display:none;align-items:center;gap:6px;}
  main{flex:1;padding:14px 12px 100px;max-width:560px;margin:0 auto;width:100%;}
  nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--border);
    display:flex;justify-content:space-around;padding:6px 4px calc(6px + env(safe-area-inset-bottom));z-index:30;}
  nav button{background:none;border:none;display:flex;flex-direction:column;align-items:center;gap:2px;
    padding:6px 10px;border-radius:8px;color:var(--faint);font-size:10px;font-weight:500;cursor:pointer;position:relative;}
  nav button.active{color:var(--primary);font-weight:700;}
  nav button .icon{font-size:20px;line-height:1;}
  nav button .badge{position:absolute;top:0;right:2px;background:var(--danger);color:#fff;font-size:9px;
    font-weight:700;border-radius:999px;min-width:14px;height:14px;display:flex;align-items:center;justify-content:center;padding:0 3px;}
  .card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:14px;
    box-shadow:0 1px 2px rgba(0,0,0,.04);margin-bottom:12px;}
  .card.primary{background:var(--primary);color:#fff;border:none;}
  label.field-label{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.02em;color:var(--muted);display:block;margin-bottom:4px;}
  input,textarea,select{width:100%;border:1px solid var(--border);border-radius:8px;padding:10px 12px;
    font-size:16px;font-family:inherit;color:var(--text);background:#fff;}
  input:focus,textarea:focus,select:focus{outline:2px solid var(--primary);outline-offset:-1px;}
  /* Every <select> in the app gets the SAME chevron, drawn ourselves instead of relying on the
     WebView's native dropdown arrow (which rendered inconsistently/looked out of place — see
     dropdown-styling fix). -webkit-appearance/appearance:none strips the native arrow everywhere
     (including inside .cat-picker's borderless variant below); the arrow itself is an inline SVG
     so it needs no network request and can't fail to load offline. */
  select{
    -webkit-appearance:none; -moz-appearance:none; appearance:none;
    background-image:url("data:image/svg+xml;charset=UTF-8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%237C8A99' stroke-width='2.5' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpolyline points='6 9 12 15 18 9'%3E%3C/polyline%3E%3C/svg%3E");
    background-repeat:no-repeat; background-position:right 10px center; background-size:18px;
    padding-right:34px;
  }
  textarea{resize:none;}
  /* Same chevron glyph as the select rule above, for non-<select> "looks like a dropdown"
     controls (the date-picker trigger buttons) so every dropdown-like control in the app is
     visually identical instead of mixing this SVG chevron with a plain "▾" text character,
     which rendered chunkier/misaligned compared to the select's arrow. */
  .chev{display:inline-block;width:16px;height:16px;flex-shrink:0;
    background-image:url("data:image/svg+xml;charset=UTF-8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%237C8A99' stroke-width='2.5' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpolyline points='6 9 12 15 18 9'%3E%3C/polyline%3E%3C/svg%3E");
    background-repeat:no-repeat;background-position:center;background-size:contain;}
  .row{display:flex;justify-content:space-between;align-items:center;}
  .row .val{font-weight:600;}
  .row.big .lab{font-size:14px;}
  .row.big .val{font-size:20px;font-weight:700;}
  .btn{border:none;border-radius:10px;padding:11px 16px;font-size:14px;font-weight:600;cursor:pointer;}
  .btn-primary{background:var(--primary);color:#fff;}
  .btn-success{background:var(--success);color:#fff;}
  .btn-danger{background:var(--danger);color:#fff;}
  .btn-outline{background:none;border:1px solid var(--border);color:var(--muted);}
  .btn-dashed{background:none;border:2px dashed var(--primary);color:var(--primary);width:100%;padding:12px;
    border-radius:12px;display:flex;align-items:center;justify-content:center;gap:6px;font-weight:700;}
  .btn:disabled{opacity:.4;cursor:default;}
  .pill-badge{font-size:11px;font-weight:700;padding:4px 8px;border-radius:999px;}
  .small{font-size:12px;color:var(--muted);}
  .faint{color:var(--faint);}
  .mt2{margin-top:8px;}.mt3{margin-top:12px;}.mb2{margin-bottom:8px;}
  .flex{display:flex;}.gap2{gap:8px;}.gap1{gap:4px;}.flex1{flex:1;}
  .search-wrap{position:relative;}
  .search-icon{position:absolute;left:10px;top:12px;color:var(--faint);pointer-events:none;}
  .search-wrap input{padding-left:32px;}
  .dropdown{position:absolute;z-index:20;margin-top:4px;width:100%;background:#fff;border:1px solid var(--border);
    border-radius:8px;max-height:220px;overflow-y:auto;box-shadow:0 6px 20px rgba(0,0,0,.12);}
  .dropdown button{width:100%;text-align:left;padding:10px 12px;border:none;background:none;border-bottom:1px solid var(--border);
    display:flex;justify-content:space-between;align-items:center;cursor:pointer;}
  .dropdown button:last-child{border-bottom:none;}
  .item-row{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--border);}
  .item-row:last-child{border-bottom:none;}
  .modal-overlay{position:fixed;inset:0;background:rgba(15,23,30,.45);z-index:50;display:flex;
    align-items:flex-end;justify-content:center;}
  /* The confirm dialog can be triggered from inside another already-open modal (category
     editor, inventory form, backup panel, etc.). All modal overlays share the same z-index
     and stack by DOM order, and #confirmModalRoot happens to sit earlier in the markup than
     those — so without this, the confirm dialog rendered BEHIND the still-open modal and was
     invisible and unclickable. Confirm dialogs are always meant to be the topmost thing on
     screen, so they get a dedicated higher z-index instead of relying on DOM order. */
  #confirmModalRoot .modal-overlay{z-index:60;}
  .modal{background:#fff;border-radius:16px 16px 0 0;width:100%;max-width:480px;max-height:85vh;
    display:flex;flex-direction:column;box-shadow:0 8px 30px rgba(0,0,0,.2);}
  .modal-head{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border-bottom:1px solid var(--border);}
  .modal-body{margin:12px 16px;padding:12px;background:var(--page);border:1px solid var(--border);border-radius:8px;
    font-size:12px;font-family:ui-monospace,monospace;white-space:pre-wrap;overflow-y:auto;color:var(--text);}
  .modal-actions{display:flex;gap:8px;padding:14px 16px;}
  .hidden{display:none !important;}
  #toast{position:fixed;bottom:78px;left:50%;transform:translateX(-50%);background:#1B2430;color:#fff;
    padding:10px 18px;border-radius:999px;font-size:13px;font-weight:600;z-index:60;box-shadow:0 4px 16px rgba(0,0,0,.25);}
  a.silent{color:inherit;text-decoration:none;}
  ::placeholder{color:var(--faint);}
  #invFab{position:fixed;right:16px;bottom:calc(70px + env(safe-area-inset-bottom));width:54px;height:54px;border-radius:50%;
    background:var(--primary);color:#fff;border:none;font-size:26px;line-height:1;cursor:pointer;
    box-shadow:0 4px 14px rgba(0,0,0,.25);z-index:35;display:flex;align-items:center;justify-content:center;}
  .expiry-tag{font-size:11px;font-weight:700;padding:3px 7px;border-radius:6px;display:inline-block;}
  .icon-del-btn{background:none;border:none;color:var(--faint);cursor:pointer;font-size:16px;}
  .modal-x{border:none;font-size:18px;padding:4px 8px;}
  .item-title{font-weight:700;font-size:14px;margin:0;}
  .divider-top{border-top:1px solid var(--border);padding-top:10px;}
  .divider-top8{border-top:1px solid var(--border);padding-top:8px;}
  /* Category dropdown + "Edit" button, merged into one visual box (New medicine form and the
     inline per-medicine Edit form). Plain <input>/<select> elements get a full outline all the
     way around themselves on focus (see the shared input:focus rule above); a bare <select>
     inside this merged box would only outline itself, leaving the "Edit" button half of the
     box looking untouched and the whole thing visually inconsistent with every other field.
     Using :focus-within on the wrapping box instead makes the WHOLE pill glow together,
     matching how every other field responds when focused. */
  .cat-picker{display:flex;align-items:stretch;border:1px solid var(--border);border-radius:8px;overflow:hidden;}
  .cat-picker:focus-within{outline:2px solid var(--primary);outline-offset:-1px;}
  .cat-picker select{flex:1;min-width:0;border:none;border-radius:0;outline:none;padding:10px 34px 10px 12px;font-size:16px;font-family:inherit;color:var(--text);background-color:#fff;}
  .cat-picker button{flex:0 0 auto;border:none;border-left:1px solid var(--border);background:var(--page);
    color:var(--muted);font-size:12px;font-weight:600;padding:0 14px;cursor:pointer;}
  /* Forced portrait via CSS rotation-compensation, not a warning: the app's layout isn't built
     for landscape, so instead of telling the person to rotate back, this counter-rotates the
     ENTIRE page (html itself, so every descendant — including position:fixed modals/badges —
     rotates together and stays visually consistent) by -90deg the instant the device reports a
     landscape viewport, and resizes it to swap width/height so it still fills the screen. Net
     effect: the app keeps rendering upright and fully usable in portrait no matter which way the
     phone is physically held — this is a plain CSS media query, so it works identically on every
     device/browser/WebView with zero API permissions, fullscreen requests, or JS involved, unlike
     the (removed) screen.orientation.lock() attempt whose success depended on host/OS support.
     Touch/click coordinates are remapped automatically by the browser through this same
     transform, so tapping still lands correctly on whatever's visually under the finger. */
  @media screen and (orientation:landscape){
    html{
      transform:rotate(-90deg);
      transform-origin:left top;
      width:100vh;
      height:100vw;
      overflow-x:hidden;
      position:absolute;
      top:100%;
      left:0;
    }
  }
</style>

<div id="app">

        <button id="cloudSizeBadge" onclick="toggleBackupModal()" class="small" style="color:#fff;opacity:.7;background:none;border:none;padding:0;cursor:pointer;font:inherit;"></button>
      </div>

      <div style="position:relative;">

        <div id="headerMenuDropdown" class="hidden" style="position:absolute;top:calc(100% + 6px);right:0;background:#fff;border-radius:10px;box-shadow:0 6px 20px rgba(0,0,0,.25);overflow:hidden;min-width:160px;z-index:40;"></div>

<script>
/* ===================== STATE ===================== */
const CURRENCY = "Rs ";
// Repeated on nearly every text input below to stop mobile keyboards/password managers
// from auto-capitalizing, autocorrecting, or offering to save clinic/patient data.
const NOAC = 'autocomplete="off" autocorrect="off" spellcheck="false" data-lpignore="true"';
let inventory = [];
let transactions = [];
let monthAdjustments = {}; // { "YYYY-MM": {doctorFee, medTotal, testsTotal, othersTotal, updatedAt} } — manual corrections, not tied to any bill
let notes = [];
let profiles = [];
let currentProfileId = null;
let tab = "bill";
let saveError = "";
let shareText = null;
let testPrices = {}; // { testId: permanentAmount } — set via the "Edit" panel, synced across devices
let defaultDoctorFee = 0; // permanent default for the doctor visit fee — synced across devices (see defaultDoctorFeeUpdatedAt/mergeDefaultDoctorFee)
let defaultDoctorFeeUpdatedAt = 0; // timestamp of the last real edit, used for last-write-wins merging across devices
let defaultDoctorName = ""; // permanent default doctor name — auto-fills Remarks on each new bill; synced across devices (see defaultDoctorNameUpdatedAt/mergeDefaultDoctorName)
let defaultDoctorNameUpdatedAt = 0; // timestamp of the last real edit, used for last-write-wins merging across devices
// Remembers whichever combination of qty/days-mode toggles ("Total medicine" vs "Per day ×
// days", and "Set days per medicine" vs "Same days for whole bill") was used last on THIS
// device, so a new bill starts on the same combination instead of resetting to the defaults —
// persisted to plain localStorage (device-local, like MED_CATEGORIES) since it's a UI habit,
// not clinic data; not part of cloud sync or the backup file.
let billModePrefs = { qtyMode:"total", daysMode:"perMed" };
function saveBillModePrefs(){
  try{ localStorage.setItem("clinic_bill_mode_prefs", JSON.stringify(billModePrefs)); }catch(e){}
}
let remarksUi = { editing:false, draft:"" }; // controls the small inline "edit default doctor name" panel under Remarks
let customTests = []; // [{id,name}] — tests added by the user beyond the built-in TEST_CATALOG, synced across devices
let testNameOverrides = {}; // { testId: renamedName } — user-renamed built-in TEST_CATALOG entries, synced across devices
let hiddenBuiltInTestIds = []; // ids of built-in TEST_CATALOG entries the user removed from their list — kept out of allTests(), synced across devices
// Per-test-id edit timestamp: { testId: ms }. Each test's own name/price/hidden-state/
// existence is merged individually against this per-id time (see mergeTestSettings) —
// so editing/adding ONE test on this device can never silently overwrite a DIFFERENT
// test another device added or priced. testSettingsUpdatedAt below is kept only as a
// legacy "something in the catalog changed" marker for older backup files.
let testItemUpdatedAt = {};
let testSettingsUpdatedAt = 0;
let testPriceEditorOpen = false; // transient: is the "Edit" panel open in the Tests card
let testPriceDraft = {}; // transient: in-progress edits while that panel is open
let testNameDraft = {}; // transient: in-progress name edits while that panel is open
let newTestNameDraft = ""; // transient: name input for adding a new test in the Edit panel
let newTestPriceDraft = ""; // transient: price input for adding a new test in the Edit panel

/* transient (not persisted) UI state */
function newBillState(){
  return { patient:"", fee: defaultDoctorFee?String(defaultDoctorFee):"", items:[], query:"", pills:"", medsDiscount:"", selectedMedId:null, qtyMode:billModePrefs.qtyMode, daysMode:billModePrefs.daysMode, perDay:"", days:"", globalDays:"", extras:[], extraAmount:"",
    tests:[], selectedTestIds:[], testsDiscount:"", feeDiscount:"", feeEditing:false, feeDiscountEditing:false, medsDiscountEditing:false, testsMenuOpen:false, feeIncluded:false,
    paymentMode:"Cash", remarks: defaultDoctorName || "",
    // Special-category medicines: a second, separate search/add flow (see specialMatches()
    // in renderBill) for medicines flagged with a specialCategory, which are deliberately
    // excluded from the normal medicine search above. applyingFeeMode is per-bill: "perItem"
    // charges an optional fee on each special medicine as it's added; "whole" charges one
    // fee for the whole bill, folded onto the last special medicine added (see
    // addSpecialBillItem/recomputeWholeApplyingFee). Neither fee is ever typed as a saved
    // default — always typed fresh — and neither shows as its own line in the bill; both are
    // baked directly into the relevant item's subtotal.
    specialQuery:"", selectedSpecialMedId:null, specialPills:"", applyingFeeMode:"perItem", applyingFeeDraft:"", wholeApplyingFee:"" };
}
let bill = newBillState();
let inv = { query:"", showForm:false, form:{name:"",category:"",formula:"",mg:"",mrp:"",pillsPerBox:"",lowStockAt:"10",sTag:false},
            restockId:null, restockBoxes:"", restockExpiry:"", restockMrp:"", editId:null,
            editForm:{name:"",formula:"",mg:"",mrp:"",pillsPerBox:"",lowStockAt:"",stockPills:""} };
let backupUi = { open:false };
// Custom in-theme calendar (replaces native <input type="date">, whose picker/handles are
// styled by the OS/WebView host, not our CSS — see date-picker fix). targetKind is "restock"
// or "batch"; targetArgs carries whatever identifiers confirmDatePicker/clearDatePicker need
// to write the result back to the right place.
let datePickerUi = { open:false, viewYear:0, viewMonth:0, selected:"", targetKind:null, targetArgs:null };
let printerUi = { open:false, transport:null, wifiIp:"", wifiPort:"9100" };

function normalizeAnswer(s){ return String(s||"").trim().toLowerCase(); }
function normalizeCode(s){ return String(s||"").replace(/[^A-Za-z0-9]/g,"").toLowerCase(); }
async function hashSecret(s){
  try{
    const enc = new TextEncoder().encode(String(s));
    const buf = await crypto.subtle.digest("SHA-256", enc);
    return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,"0")).join("");
  }catch(e){
    // Very old/broken WebViews without SubtleCrypto: fall back to a simple non-cryptographic
    // hash so recovery still works, just with weaker guessing-resistance.
    let h = 0; const str = String(s);
    for(let i=0;i<str.length;i++){ h = (h*31 + str.charCodeAt(i))|0; }
    return "fb:"+h;
  }
}
function genRecoveryCode(){
  const chars = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789"; // no ambiguous 0/O, 1/I/L
  const getRand = (typeof crypto!=="undefined" && crypto.getRandomValues) ? ()=>{ const a=new Uint32Array(1); crypto.getRandomValues(a); return a[0]; } : ()=>Math.floor(Math.random()*4294967296);
  let out = "";
  for(let i=0;i<10;i++){
    out += chars[getRand()%chars.length];
    if(i===3||i===7) out += "-";
  }
  return out; // e.g. "7F3K-9QX2-RT"
}

/* Inventory and transactions are shared — every person using this device sees the same data.
   Notes are kept separate per profile, so each person's notepad stays private to them. */
function loadAll(){
  try{ inventory = JSON.parse(localStorage.getItem("clinic_inventory")||"[]"); }catch(e){ inventory=[]; }
  // Migrate medicines saved before batch/expiry tracking existed: fold their existing
  // stock into one "no expiry recorded" batch so nothing is lost.
  inventory.forEach(m=>{
    if(!Array.isArray(m.batches)){
      m.batches = (m.stockPills>0) ? [{ id:uid(), boxes:null, pillsRemaining:m.stockPills, expiryDate:null, addedAt:Date.now(), disposed:false }] : [];
    }
    recomputeStock(m);
  });
  try{ transactions = JSON.parse(localStorage.getItem("clinic_transactions")||"[]"); }catch(e){ transactions=[]; }
  try{ monthAdjustments = JSON.parse(localStorage.getItem("clinic_month_adjustments")||"{}"); }catch(e){ monthAdjustments={}; }
  try{ profiles = JSON.parse(localStorage.getItem("clinic_profiles")||"[]"); }catch(e){ profiles=[]; }
  try{ testPrices = JSON.parse(localStorage.getItem("clinic_test_prices")||"{}"); }catch(e){ testPrices={}; }
  try{ defaultDoctorFee = Number(localStorage.getItem("clinic_default_doctor_fee"))||0; }catch(e){ defaultDoctorFee=0; }
  try{ defaultDoctorFeeUpdatedAt = Number(localStorage.getItem("clinic_default_doctor_fee_updated_at"))||0; }catch(e){ defaultDoctorFeeUpdatedAt=0; }
  try{ defaultDoctorName = localStorage.getItem("clinic_default_doctor_name") || ""; }catch(e){ defaultDoctorName=""; }
  try{ defaultDoctorNameUpdatedAt = Number(localStorage.getItem("clinic_default_doctor_name_updated_at"))||0; }catch(e){ defaultDoctorNameUpdatedAt=0; }
  try{
    const savedMode = JSON.parse(localStorage.getItem("clinic_bill_mode_prefs")||"null");
    if(savedMode && (savedMode.qtyMode==="total"||savedMode.qtyMode==="dose")) billModePrefs.qtyMode = savedMode.qtyMode;
    if(savedMode && (savedMode.daysMode==="perMed"||savedMode.daysMode==="same")) billModePrefs.daysMode = savedMode.daysMode;
  }catch(e){}
  try{ customTests = JSON.parse(localStorage.getItem("clinic_custom_tests")||"[]"); }catch(e){ customTests=[]; }
  try{ testNameOverrides = JSON.parse(localStorage.getItem("clinic_test_name_overrides")||"{}"); }catch(e){ testNameOverrides={}; }
  try{ hiddenBuiltInTestIds = JSON.parse(localStorage.getItem("clinic_hidden_tests")||"[]"); }catch(e){ hiddenBuiltInTestIds=[]; }
  try{ testSettingsUpdatedAt = Number(localStorage.getItem("clinic_test_settings_updated_at"))||0; }catch(e){ testSettingsUpdatedAt=0; }
  try{ testItemUpdatedAt = JSON.parse(localStorage.getItem("clinic_test_item_updated_at")||"{}"); }catch(e){ testItemUpdatedAt={}; }
  // One-time backfill: devices that used the Tests feature before per-test-id timestamps
  // existed have real test data but no per-id time to merge it by, which would make it
  // always lose to another device's newer per-id edits even if it was set up first. Seed
  // every id this device currently has non-default data for with the old bundle time, so
  // it competes fairly from here on.
  if(Object.keys(testItemUpdatedAt).length===0 && testSettingsUpdatedAt>0){
    customTests.forEach(t=>{ testItemUpdatedAt[t.id]=testSettingsUpdatedAt; });
    hiddenBuiltInTestIds.forEach(id=>{ testItemUpdatedAt[id]=testSettingsUpdatedAt; });
    Object.keys(testNameOverrides).forEach(id=>{ testItemUpdatedAt[id]=testSettingsUpdatedAt; });
    Object.keys(testPrices).forEach(id=>{ testItemUpdatedAt[id]=testSettingsUpdatedAt; });
    try{ localStorage.setItem("clinic_test_item_updated_at", JSON.stringify(testItemUpdatedAt)); }catch(e){}
  }
  try{
    const savedCats = JSON.parse(localStorage.getItem("clinic_med_categories")||"null");
    if(Array.isArray(savedCats) && savedCats.length) MED_CATEGORIES = savedCats;
  }catch(e){}
  try{
    const savedSpecialCats = JSON.parse(localStorage.getItem("clinic_special_categories")||"null");
    if(Array.isArray(savedSpecialCats) && savedSpecialCats.length) SPECIAL_CATEGORIES = savedSpecialCats;
  }catch(e){}

  // Migrate an old single shared notepad (from before profiles existed) into its own profile,
  // so nobody's existing notes get lost.
  if(profiles.length===0){
    let legacy = null;
    try{ legacy = JSON.parse(localStorage.getItem("clinic_notes")||"null"); }catch(e){ legacy=null; }
    if(legacy && Array.isArray(legacy) && legacy.length){
      profiles = [{ id:"legacy", name:"Notes" }];
      localStorage.setItem("clinic_profiles", JSON.stringify(profiles));
      localStorage.setItem("clinic_notes_legacy", JSON.stringify(legacy));
    }
  }

  currentProfileId = localStorage.getItem("clinic_current_profile") || null;
  if(currentProfileId && !visibleProfiles().some(p=>p.id===currentProfileId)){
    currentProfileId = null;
  }
  // Login state persists across app restarts until "Switch User" is tapped — but only counts
  // if currentProfileId is actually still valid (e.g. not true right after that profile was deleted).
  try{ sessionAuthed = localStorage.getItem("clinic_session_authed")==="1" && !!currentProfileId; }catch(e){ sessionAuthed=false; }
  loadNotesForCurrentProfile();
}

/* Single merged <select> for both the regular category list and the special-category list,
   so a medicine picks ONE of either (not both independently as before). Special categories are
   grouped under their own <optgroup> heading, which every mobile OS renders as a section
   header inside the native picker — this is what puts "Special medicine category" as a
   sub-heading under the plain category list instead of needing its own separate field/button. */
function mergedCategoryOptionsHtml(current){
  const regularList = MED_CATEGORIES.slice();
  const specialList = SPECIAL_CATEGORIES.slice();
  // preserve an old/removed value picked before it was renamed/deleted, so it never just vanishes
  if(current && !regularList.includes(current) && !specialList.includes(current)) regularList.push(current);
  const regularHtml = regularList.map(c=>`<option value="${esc(c)}" ${current===c?"selected":""}>${esc(c)}</option>`).join("");
  const specialHtml = specialList.length ? `<optgroup label="Special medicine category">${specialList.map(c=>`<option value="${esc(c)}" ${current===c?"selected":""}>${esc(c)}</option>`).join("")}</optgroup>` : "";
  return regularHtml + specialHtml;
}

function saveAllCategoryChanges(){
  // Applying a rename updates the list entry AND cascades to every medicine currently set
  // to the old name, so existing medicines' category tags stay correct instead of pointing
  // at a name that no longer exists in the list. Runs for both the regular list and the
  // special list, since one shared Edit button/editor now manages both together.
  let invChanged = false;

  const renamePairs = [];
  MED_CATEGORIES = MED_CATEGORIES.map(oldName=>{
    const draft = (catUi.renameDrafts[oldName]||"").trim();
    if(!draft || draft===oldName) return oldName;
    renamePairs.push([oldName, draft]);
    return draft;
  });
  if(renamePairs.length){
    inventory.forEach(m=>{
      const hit = renamePairs.find(([oldName])=>m.category===oldName);
      if(hit){ m.category = hit[1]; m.updatedAt = Date.now(); invChanged=true; }
    });
  }
  saveMedCategoriesStorage();

  const specialRenamePairs = [];
  SPECIAL_CATEGORIES = SPECIAL_CATEGORIES.map(oldName=>{
    const draft = (specialCatUi.renameDrafts[oldName]||"").trim();
    if(!draft || draft===oldName) return oldName;
    specialRenamePairs.push([oldName, draft]);
    return draft;
  });
  if(specialRenamePairs.length){
    inventory.forEach(m=>{
      const hit = specialRenamePairs.find(([oldName])=>m.specialCategory===oldName);
      if(hit){ m.specialCategory = hit[1]; m.updatedAt = Date.now(); invChanged=true; }
    });
  }
  saveSpecialCategoriesStorage();

  if(invChanged) saveInventory();
  catUi.open = false;
  render();
  showToast("✓ Categories saved");
}

/* ===================== BATCHES / EXPIRY (FEFO) ===================== */
/* Every restock creates its own "batch" with its own expiry date. When medicine is
   sold, pills are drawn from the batch with the nearest expiry date first (FEFO —
   first-expiry-first-out). m.stockPills is always kept as the sum of active batches. */
function activeBatches(m){ return (m.batches||[]).filter(b=>!b.disposed && b.pillsRemaining>0); }
function recomputeStock(m){ m.stockPills = activeBatches(m).reduce((s,b)=>s+b.pillsRemaining,0); }function fefoOrder(m){
  return activeBatches(m).slice().sort((a,b)=>{
    const ea = a.expiryDate ? new Date(a.expiryDate).getTime() : Infinity;
    const eb = b.expiryDate ? new Date(b.expiryDate).getTime() : Infinity;
    if(ea!==eb) return ea-eb;
    return (a.addedAt||0)-(b.addedAt||0);
  });
}
/* ---- Batch-level pricing (MRP can change per restock, FEFO-style) ----
   Each batch may carry its own mrpPerBox (set at restock time). If a batch has no
   mrpPerBox recorded (left blank at restock, or an old batch from before this existed),
   it falls back to the medicine's current mrpPerBox — i.e. "use the older/current price". */
function batchPricePerPill(m, b){
  const mrp = (b && b.mrpPerBox!=null && b.mrpPerBox>0) ? b.mrpPerBox : m.mrpPerBox;
  return (Number(mrp)||0) / (Number(m.pillsPerBox)||1);
}
function nextBatchUnitPrice(m){
  // The price that will actually be charged for the next pill sold, following the same
  // FEFO order stock is drawn from — so billing price always matches the batch being dispensed.
  const order = fefoOrder(m);
  if(order.length) return batchPricePerPill(m, order[0]);
  return (Number(m.mrpPerBox)||0) / (Number(m.pillsPerBox)||1);
}
function deductStock(m, pills){
  let remaining = pills;
  for(const b of fefoOrder(m)){
    if(remaining<=0) break;
    const take = Math.min(b.pillsRemaining, remaining);
    b.pillsRemaining -= take;
    remaining -= take;
    b.updatedAt = Date.now();
  }
  recomputeStock(m);
}
function returnStock(m, pills){
  // Used when an old bill is edited/undone — put pills back into the batch nearest
  // to expiry (the one most likely to have been sold from), or a fresh undated batch.
  const batches = fefoOrder(m);
  if(batches.length){ batches[0].pillsRemaining += pills; batches[0].updatedAt = Date.now(); }
  else {
    m.batches = m.batches||[];
    m.batches.push({ id:uid(), boxes:null, pillsRemaining:pills, originalPills:pills, expiryDate:null, addedAt:Date.now(), updatedAt:Date.now(), disposed:false });
  }
  recomputeStock(m);
}
function adjustStockTo(m, newTotal){
  // Used for manual stock correction in Edit (e.g. accounting for loss/damage).
  const current = activeBatches(m).reduce((s,b)=>s+b.pillsRemaining,0);
  const diff = newTotal - current;
  if(diff<0) deductStock(m, -diff);
  else if(diff>0){
    m.batches = m.batches||[];
    m.batches.push({ id:uid(), boxes:null, pillsRemaining:diff, originalPills:diff, expiryDate:null, addedAt:Date.now(), updatedAt:Date.now(), disposed:false });
    recomputeStock(m);
  }
}
function daysUntil(dateStr){
  if(!dateStr) return null;
  const today = new Date(); today.setHours(0,0,0,0);
  const exp = new Date(dateStr+"T00:00:00");
  return Math.round((exp-today)/86400000);
}
/* Displays a stored "YYYY-MM-DD" expiry date as the shorter "DD-MM-YY". Used only for display —
   the underlying stored value stays full "YYYY-MM-DD" for date-picker/date-math purposes. The
   batch row is narrow (min-width:0 button squeezed between the pill count, price, expiry-tag
   badge, and dispose icon), so the full date used to get ellipsis-truncated down to just "20…"
   (the first two digits of the year, not useful). DD-MM-YY is short enough to usually fit whole,
   and even when it still truncates, what's cut off is the least useful end (the year's first two
   digits) rather than the day/month/last-two-digits that actually distinguish one expiry from another.*/
function fmtExpiryShort(dateStr){
  if(!dateStr) return "";
  const parts = dateStr.split("-");
  if(parts.length!==3) return dateStr;
  const [y,m,d] = parts;
  return `${d}-${m}-${y.slice(-2)}`;
}
function expiringBatches(){
  const out = [];
  inventory.forEach(m=>{
    if(m.deleted) return;
    activeBatches(m).forEach(b=>{
      if(b.expiryDate){
        const d = daysUntil(b.expiryDate);
        if(d!==null && d<=10) out.push({ med:m, batch:b, daysLeft:d });
      }
    });
  });
  return out.sort((a,b)=>a.daysLeft-b.daysLeft);
}
function onBatchExpiryChange(medId, batchId, val){
  const m = inventory.find(x=>x.id===medId);
  if(m){ const b=(m.batches||[]).find(x=>x.id===batchId); if(b){ b.expiryDate = val || null; b.updatedAt = Date.now(); } }
  saveInventory();
  render();
}
function disposeBatch(medId, batchId){
  askConfirm("Mark this batch as disposed? It'll be removed from stock and cleared from expiry alerts.", ()=>{
    const m = inventory.find(x=>x.id===medId);
    if(m){
      const b = (m.batches||[]).find(x=>x.id===batchId);
      if(b){ b.disposed=true; b.pillsRemaining=0; b.updatedAt=Date.now(); recomputeStock(m); }
    }
    saveInventory();
    render();
  });
}
function batchExpiryLabel(daysLeft){
  if(daysLeft<0) return `Expired ${Math.abs(daysLeft)}d ago`;
  if(daysLeft===0) return "Expires today";
  return `${daysLeft}d left`;
}

/* ---- Custom date picker (in-theme replacement for native <input type="date">) ---- */
function ymd(y, m, d){ return y+"-"+String(m+1).padStart(2,"0")+"-"+String(d).padStart(2,"0"); }
// Opening/navigating/picking a day only ever changes what's inside #datePickerModalRoot —
// nothing else on screen depends on datePickerUi. Calling the full render() (which rebuilds
// the entire active tab — bill/inventory/records/etc — from scratch) for every month-flip or
// day-tap was the actual cause of the picker feeling far slower than the native one; calling
// renderDatePickerModal() directly instead keeps every interaction to a single small
// innerHTML write, same as before v-date-picker.
function openDatePicker(currentValue, kind, args){
  const base = currentValue ? new Date(currentValue+"T00:00:00") : new Date();
  datePickerUi = { open:true, viewYear: base.getFullYear(), viewMonth: base.getMonth(), selected: currentValue||"", targetKind: kind, targetArgs: args||null };
  renderDatePickerModal();
  syncMenuHistory(); // cheap (no DOM rebuild) — keeps the back button aware this opened, without the full render() this function deliberately skips
}
function closeDatePicker(){ datePickerUi.open=false; renderDatePickerModal(); syncMenuHistory(); }
function datePickerPrevMonth(){
  datePickerUi.viewMonth--;
  if(datePickerUi.viewMonth<0){ datePickerUi.viewMonth=11; datePickerUi.viewYear--; }
  renderDatePickerModal();
}
function datePickerNextMonth(){
  datePickerUi.viewMonth++;
  if(datePickerUi.viewMonth>11){ datePickerUi.viewMonth=0; datePickerUi.viewYear++; }
  renderDatePickerModal();
}
function pickDatePickerDay(d){
  datePickerUi.selected = ymd(datePickerUi.viewYear, datePickerUi.viewMonth, d);
  renderDatePickerModal();
}
// Confirm/Clear are the only two actions whose result is visible OUTSIDE the modal (the
// "Select expiry date"/"Set expiry date" button text on the page behind it), so — and only
// these two — still need the real full render() once the modal itself is closed.
function applyDatePickerResult(value){
  const kind = datePickerUi.targetKind, args = datePickerUi.targetArgs;
  datePickerUi.open = false;
  if(kind==="restock"){ inv.restockExpiry = value; render(); }
  else if(kind==="batch" && args){ onBatchExpiryChange(args.medId, args.batchId, value); }
  else { render(); }
}
function confirmDatePicker(){ applyDatePickerResult(datePickerUi.selected); }
function clearDatePicker(){ applyDatePickerResult(""); }
function renderDatePickerModal(){
  const root = document.getElementById("datePickerModalRoot");
  if(!root) return;
  if(!datePickerUi.open){ root.innerHTML=""; return; }
  const MONTH_NAMES = ["January","February","March","April","May","June","July","August","September","October","November","December"];
  const { viewYear, viewMonth, selected } = datePickerUi;
  const first = new Date(viewYear, viewMonth, 1);
  const startDow = first.getDay();
  const numDays = new Date(viewYear, viewMonth+1, 0).getDate();
  const todayStr = ymd(new Date().getFullYear(), new Date().getMonth(), new Date().getDate());
  let cells = "";
  for(let i=0;i<startDow;i++) cells += `<div></div>`;
  for(let d=1; d<=numDays; d++){
    const dateStr = ymd(viewYear, viewMonth, d);
    const isSel = dateStr===selected;
    const isToday = dateStr===todayStr;
    const style = isSel
      ? "background:var(--primary);color:#fff;font-weight:700;"
      : isToday
        ? "background:var(--primarySoft);color:var(--primary);font-weight:700;"
        : "background:none;color:var(--text);";
    cells += `<button type="button" onclick="pickDatePickerDay(${d})" style="${style}border:none;border-radius:999px;width:34px;height:34px;font-size:13px;cursor:pointer;">${d}</button>`;
  }
  // Always pad to a fixed 6 rows (42 cells) regardless of how many weeks this particular month
  // actually spans — without this, months with only 4-5 visible rows made the whole modal
  // visibly shrink/grow as you flipped between months, which read as janky/broken.
  const totalCellsSoFar = startDow + numDays;
  const trailing = 42 - totalCellsSoFar;
  for(let i=0;i<trailing;i++) cells += `<div></div>`;
  const headerLabel = selected ? new Date(selected+"T00:00:00").toLocaleDateString(undefined,{weekday:"short", month:"short", day:"numeric"}) : "No date set";
  root.innerHTML = `
    <div class="modal-overlay" style="align-items:center;padding:16px 0;" onclick="if(event.target===this) closeDatePicker()">
      <div class="modal" style="border-radius:16px;max-width:340px;max-height:90vh;">
        <div style="background:var(--primary);color:#fff;padding:16px 18px;border-radius:16px 16px 0 0;flex:0 0 auto;">
          <div class="small" style="color:var(--headerSub);">${viewYear}</div>
          <div style="font-size:20px;font-weight:700;">${esc(headerLabel)}</div>
        </div>
        <div style="padding:12px 16px;overflow-y:auto;">
          <div class="row mb2">
            <button type="button" onclick="datePickerPrevMonth()" style="background:none;border:none;font-size:20px;color:var(--primary);cursor:pointer;padding:4px 10px;">‹</button>
            <strong>${MONTH_NAMES[viewMonth]} ${viewYear}</strong>
            <button type="button" onclick="datePickerNextMonth()" style="background:none;border:none;font-size:20px;color:var(--primary);cursor:pointer;padding:4px 10px;">›</button>
          </div>
          <div style="display:grid;grid-template-columns:repeat(7,1fr);gap:2px;text-align:center;font-size:11px;color:var(--muted);font-weight:600;margin-bottom:4px;">
            <div>S</div><div>M</div><div>T</div><div>W</div><div>T</div><div>F</div><div>S</div>
          </div>
          <div style="display:grid;grid-template-columns:repeat(7,1fr);grid-auto-rows:34px;gap:2px;justify-items:center;align-items:center;">
            ${cells}
          </div>
        </div>
        <div class="modal-actions" style="justify-content:space-between;flex:0 0 auto;">
          <button class="btn btn-outline" onclick="clearDatePicker()">Clear</button>
          <div class="flex gap2">
            <button class="btn btn-outline" onclick="closeDatePicker()">Cancel</button>
            <button class="btn btn-primary" onclick="confirmDatePicker()">Set</button>
          </div>
        </div>
      </div>
    </div>`;
}

/* Coalesces render() calls into once-per-frame. Several input handlers below
   call this instead of render() directly: calling render() synchronously on
   every keystroke destroys and recreates the focused <input> element (since
   render rebuilds innerHTML from scratch), which resets the DOM node's
   identity mid-keystroke. On mobile that interrupts the OS keyboard's native
   "hold backspace to repeat-delete" gesture, making a held backspace remove
   only one character instead of continuously deleting. Batching multiple
   rapid keystrokes (as happens during a held key) into a single render per
   animation frame keeps the input's identity stable long enough for that
   native repeat behavior to keep working, while still updating on-screen
   totals/dropdowns live as the person types. */
let renderScheduled = false;
function scheduleRender(){
  if(renderScheduled) return;
  renderScheduled = true;
  requestAnimationFrame(()=>{ renderScheduled = false; render(); });
}
/* The Records/Inventory search boxes, and the New Bill medicine + special-medicine search
   boxes, all re-filter a whole list on every keystroke, making their render heavier than a
   typical input's — heavy enough that even the once-per-frame scheduleRender() above can still
   land a render mid-hold and interrupt the OS's native "hold backspace to repeat-delete" gesture
   (same underlying issue as scheduleRender, just not fully solved by it for these). These use a
   trailing debounce instead: no render happens until typing/deleting actually pauses, so the
   input's DOM node is never touched while a key is held down, letting the native repeat-delete
   run uninterrupted; releasing the key (or a single tap) still updates the results shortly
   after, same as before. */
let searchRenderTimer = null;
function scheduleSearchRender(){
  if(searchRenderTimer) clearTimeout(searchRenderTimer);
  searchRenderTimer = setTimeout(()=>{ searchRenderTimer = null; render(); }, 220);
}
/* ===================== RENDER (with focus preservation) ===================== */
function syncHeaderOffset(){
  // header is position:fixed (see CSS) so it's out of normal document flow; without this,
  // page content would render underneath it. Measures the actual rendered height (which varies
  // since the button row can wrap to 2 lines on narrow screens) and pushes #app down to match.
  const h = document.querySelector("header");
  const app = document.getElementById("app");
  if(h && app){ app.style.paddingTop = h.offsetHeight + "px"; }
}
window.addEventListener("resize", syncHeaderOffset);

/* ===================== BACK BUTTON → CLOSE MENUS, THEN STEP BACK THROUGH TABS =====================
   Pressing the hardware back button:
   1) while any menu, dropdown, or edit/restock panel is open (adding/editing/restocking a
      medicine, editing a bill or doctor fee, a discount box, the test-price editor, receipt
      settings, category editor, the date picker, editing a user, the header settings dropdown,
      Printer Settings, Manage Users, Backup & Restore, the Share popup, an expanded record/day
      breakdown, etc.) — closes just that one layer, leaving everything else as it was;
   2) once nothing like that is open — steps back to whichever tab (New Bill/Inventory/Records/
      Warnings/Notepad) was open right before the current one, same as a browser's own back
      button would for pages you'd visited, one tab-switch at a time.
   This relies on the WebView host relaying the hardware back button as a normal browser "back"
   navigation (the standard way an App Inventor WebViewer app exposes it to the page); if it
   instead always exits the app directly, this can't intercept it and nothing changes on our end.
   How it works: navStack holds one "resolver" function per outstanding history entry, in the
   exact order things happened — switching tabs and opening a menu each push their own resolver
   (a tab switch's resolver flips back to the tab it came from; a menu's closes the top-most open
   one). A real back press pops the most recent resolver and runs it, so layers unwind in reverse
   chronological order regardless of whether they're menus or tab switches. If closing a menu
   reveals another one still open underneath (e.g. the date picker sitting on top of the restock
   form), the next render notices and pushes a fresh entry for it, so a second back press closes
   that one too, same as before.
   Deliberately NOT done: calling history.back() ourselves to "clean up" a pushed entry when a
   menu instead closes normally (Save/Cancel/X/tapping its own toggle) or a tab is switched via
   the nav bar. That was tried first and caused exactly the failure mode of "back stops
   responding to everything" — history.back() is asynchronous, and pairing it with a same-tick
   pushState can leave the browser's real back-stack and this script's idea of it out of sync in
   a way that then swallows a real, later back press. Instead, a leftover entry (e.g. from
   tapping a tab directly instead of using back to get there) is simply consumed harmlessly by
   the next real back press — closeTopMenu() is a safe no-op when nothing is open, and stepping
   to "the previous tab" one extra time is harmless — so at worst one extra back press is needed
   here and there, never a stuck or broken back button. */
let navStack = []; // one resolver per outstanding pushed history entry, oldest first
let wasMenuOpen = false; // menu-open state as of the last render(), for edge-detecting new opens
function pushNav(resolver){
  navStack.push(resolver);
  history.pushState({ appNav:true }, "", location.href);
}
window.addEventListener("popstate", function(){
  if(navStack.length){
    const resolver = navStack.pop();
    wasMenuOpen = false; // let the resolver's render() re-detect and re-push if a menu layer is still open underneath (e.g. closing a nested one)
    resolver();
  }
});
let headerMenuOpen = false; // mirrors the header "☰ Settings" dropdown's hidden/shown class
function anyMenuOpen(){
  return !!(headerMenuOpen || shareText!==null || datePickerUi.open || catUi.open || manageUi.editingId || manageUi.open ||
    printerUi.open || backupUi.open ||
    rec.editingMonthBreakdown || rec.expandedBreakdownSection || rec.breakdownMonthKey ||
    rec.editingId || rec.expandedTxSection || rec.expandedId || rec.expandedMonth || rec.expandedYear || rec.expandedDayBreakdown ||
    bill.medsDiscountEditing || bill.feeDiscountEditing || bill.feeEditing || testPriceEditorOpen || bill.testsMenuOpen ||
    remarksUi.editing || receiptUi.open || inv.editId || inv.restockId || inv.showForm || notesUi.openId!==null);
}
function closeTopMenu(){
  // Ordered so whatever can appear layered on top of another open menu/dropdown is checked
  // first — a single back press should only ever close one layer. Safe to call with nothing
  // open at all (e.g. a leftover history entry from a menu closed via its own button) — every
  // check below just falls through and nothing happens.
  if(headerMenuOpen){ closeHeaderMenu(); render(); return; }
  if(shareText!==null){ closeShare(); return; }
  if(datePickerUi.open){ closeDatePicker(); return; }
  if(catUi.open){ closeCategoryEditor(); return; }
  if(manageUi.editingId){ cancelEditUser(); return; }
  if(manageUi.open){ manageUi.open=false; render(); return; }
  if(printerUi.open){ printerUi.open=false; render(); return; }
  if(backupUi.open){ backupUi.open=false; render(); return; }
  if(rec.editingMonthBreakdown){ cancelMonthBreakdownEdit(); return; }
  if(rec.expandedBreakdownSection){ rec.expandedBreakdownSection=null; render(); return; }
  if(rec.breakdownMonthKey){ closeMonthBreakdown(); return; }
  if(rec.editingId){ cancelEditTx(); return; }
  if(rec.expandedTxSection){ rec.expandedTxSection=null; render(); return; }
  if(rec.expandedId){ rec.expandedId=null; rec.expandedTxSection=null; render(); return; }
  if(rec.expandedDayBreakdown){ rec.expandedDayBreakdown=null; render(); return; }
  if(rec.expandedMonth){ rec.expandedMonth=null; render(); return; }
  if(rec.expandedYear){ rec.expandedYear=null; rec.expandedMonth=null; render(); return; }
  if(bill.medsDiscountEditing){ bill.medsDiscountEditing=false; render(); return; }
  if(bill.feeDiscountEditing){ bill.feeDiscountEditing=false; render(); return; }
  if(bill.feeEditing){ bill.feeEditing=false; render(); return; }
  if(testPriceEditorOpen){ testPriceEditorOpen=false; render(); return; }
  if(bill.testsMenuOpen){ bill.testsMenuOpen=false; testPriceEditorOpen=false; render(); return; }
  if(remarksUi.editing){ remarksUi.editing=false; render(); return; }
  if(receiptUi.open){ closeReceiptModal(); return; }
  if(inv.editId){ inv.editId=null; render(); return; }
  if(inv.restockId){ inv.restockId=null; render(); return; }
  if(inv.showForm){ inv.showForm=false; render(); return; }
  // The notepad editor's own "← Back" button auto-saves the draft (see backFromNote()) rather
  // than discarding it — a note left half-typed shouldn't vanish — so back-button behaves the
  // same way here for consistency, instead of silently dropping what was written.
  if(notesUi.openId!==null){ backFromNote(); return; }
}
function syncMenuHistory(){
  const open = anyMenuOpen();
  if(open && !wasMenuOpen){
    pushNav(closeTopMenu);
  }
  wasMenuOpen = open;
}


function render(){
  const active = document.activeElement;
  const id = active && active.id;
  const selStart = active && typeof active.selectionStart==="number" ? active.selectionStart : null;
  const selEnd = active && typeof active.selectionEnd==="number" ? active.selectionEnd : null;

  renderBanner();
  renderHeaderMenu();
  renderUserBadge();

  // Gate everything behind login: first-run shows "set up Admin"; otherwise shows the PIN
  // login screen until sessionAuthed. Both skip tabs/nav entirely — nothing else renders.
  if(visibleProfiles().length===0){
    document.getElementById("nav").innerHTML = "";
    const fab0 = document.getElementById("invFab"); if(fab0) fab0.className="hidden";
    renderSetupAdmin();
    syncHeaderOffset();
    return;
  }
  if(!sessionAuthed){
    document.getElementById("nav").innerHTML = "";
    const fab0 = document.getElementById("invFab"); if(fab0) fab0.className="hidden";
    renderLogin();
    renderForgotPinModal();
    renderAddUserLoginModal();
    syncHeaderOffset();
    return;
  }

  renderNav();
  renderCloudSizeBadge();
  if(tab==="bill") renderBill();
  else if(tab==="inventory") renderInventory();
  else if(tab==="records") renderRecords();
  else if(tab==="stock") renderStock();
  else if(tab==="notes") renderNotes();
  renderShareModal();
  renderConfirmModal();
  renderInvFormModal();
  renderBackupModal();
  renderPrinterModal();
  renderMonthBreakdownModal();
  renderCategoryModal();
  renderManageUsersModal();
  renderAdminTransferModal();
  renderPostTransferChoiceModal();
  renderPrivilegeConfirmModal();
  renderReceiptModal();
  renderRecoveryModal();
  renderDatePickerModal();

  const fab = document.getElementById("invFab");
  if(fab){ fab.className = (tab==="inventory" && !inv.showForm) ? "" : "hidden"; }

  if(id){
    const el = document.getElementById(id);
    if(el){
      el.focus();
      if(selStart!=null && el.setSelectionRange){ try{ el.setSelectionRange(selStart, selEnd); }catch(e){} }
    }
  }
  syncMenuHistory();
  syncHeaderOffset();
}

function renderBanner(){
  const b = document.getElementById("banner");
  if(saveError){ b.style.display="flex"; b.textContent="⚠ "+saveError; }
  else { b.style.display="none"; b.textContent=""; }
}

function lowStockList(){ return inventory.filter(m=>!m.deleted && !m.noWarn && m.stockPills <= (m.lowStockAt ?? 0)); }

function renderNav(){
  const tabs = [
    {id:"bill",label:"New Bill",icon:"📄"},
    {id:"inventory",label:"Inventory",icon:"💊"},
    {id:"records",label:"Records",icon:"🕒"},
    {id:"stock",label:"Warnings",icon:"⚠️",badge:lowStockList().length+expiringBatches().length},
    {id:"notes",label:"Notepad",icon:"📝"},
  ];
  document.getElementById("nav").innerHTML = tabs.map(t=>`
    <button class="${tab===t.id?'active':''}" onclick="setTab('${t.id}')">
      <span class="icon">${t.icon}</span>
      <span>${t.label}</span>
      ${t.badge?`<span class="badge">${t.badge}</span>`:""}
    </button>`).join("");
}

function setTab(t){
  if(t===tab){ render(); return; }
  const prevTab = tab;
  pushNav(()=>{ tab=prevTab; render(); });
  tab=t;
  render();
}

/* ===================== SHARE MODAL ===================== */
function openShare(text){ shareText=text; render(); }
function closeShare(){ shareText=null; render(); }
function shareWhatsApp(){ window.open("https://wa.me/?text="+encodeURIComponent(shareText),"_blank"); }
// Lets the user pick ANY installed app (not just WhatsApp) via the native Android share
// sheet. Inside the App Inventor app, that's done through Sharing1.ShareMessage on the
// native side (Blocks picks this up on WebViewStringChange, prefix "SHARE_TEXT:"). In a
// normal browser, the Web Share API (navigator.share) gives the same native picker; if
// neither is available, fall back to the old WhatsApp-only link so nothing breaks.
function shareToAnyApp(){
  if(window.AppInventor && typeof window.AppInventor.setWebViewString === "function"){
    window.AppInventor.setWebViewString("SHARE_TEXT:" + shareText);
    return;
  }
  if(navigator.share){
    navigator.share({text: shareText}).catch(()=>{});
    return;
  }
  shareWhatsApp();
}
function copyShare(){
  navigator.clipboard.writeText(shareText).then(()=>{
    const btn = document.getElementById("copyBtnLabel");
    if(btn){ btn.textContent="Copied ✓"; setTimeout(()=>{ if(document.getElementById("copyBtnLabel")) document.getElementById("copyBtnLabel").textContent="Copy text"; },1500); }
  }).catch(()=>{});
}
function renderShareModal(){
  const root = document.getElementById("shareModalRoot");
  if(shareText===null){ root.innerHTML=""; return; }
  root.innerHTML = `
    <div class="modal-overlay" onclick="if(event.target===this) closeShare()">
      <div class="modal">
        <div class="modal-head">
          <strong>Share</strong>
          <button class="modal-x" onclick="closeShare()">✕</button>
        </div>
        <div class="modal-body">${esc(shareText)}</div>
        <div class="modal-actions">
          <button class="btn btn-outline flex1" onclick="copyShare()"><span id="copyBtnLabel">Copy text</span></button>
          <button class="btn btn-success flex1" onclick="shareToAnyApp()">📤 Share…</button>
        </div>
      </div>
    </div>`;
}

/* ===================== CONFIRM MODAL ===================== */
/* Some in-app browsers / WebViews silently block window.confirm() (it returns
   false with no dialog shown), which made delete buttons look broken.
   This custom modal replaces confirm() everywhere so it always works. */
let confirmState = null; // { message, onYes }
function askConfirm(message, onYes){ confirmState = { message, onYes }; renderConfirmModal(); }
function cancelConfirm(){ confirmState = null; renderConfirmModal(); }
function proceedConfirm(){
  const fn = confirmState && confirmState.onYes;
  confirmState = null;
  renderConfirmModal();
  if(fn) fn();
}
function renderConfirmModal(){
  const root = document.getElementById("confirmModalRoot");
  if(!root) return;
  if(!confirmState){ root.innerHTML=""; return; }
  root.innerHTML = `
    <div class="modal-overlay" onclick="if(event.target===this) cancelConfirm()">
      <div class="modal">
        <div class="modal-head"><strong>Please confirm</strong></div>
        <div class="modal-body">${esc(confirmState.message)}</div>
        <div class="modal-actions">
          <button class="btn btn-outline flex1" onclick="cancelConfirm()">Cancel</button>
          <button class="btn flex1" style="background:var(--danger);color:#fff;" onclick="proceedConfirm()">Delete</button>
        </div>
      </div>
    </div>`;
}

    : "Remove this test from your list? It will no longer be available to add to bills.", ()=>{

      saveHiddenBuiltInTests();

    }
    delete testPrices[id];

function saveAllTestPrices(){
  const builtIn = {}; TEST_CATALOG.forEach(t=>builtIn[t.id]=t.name);
  const touchedIds = [];
  allTests().forEach(t=>{
    const val = Number(testPriceDraft[t.id])||0;
    const prevPrice = testPrices[t.id];
    const newPrice = val>0 ? val : undefined;
    if(newPrice!==prevPrice){
      if(val>0) testPrices[t.id]=val; else delete testPrices[t.id];
      touchedIds.push(t.id);
    }
    const nameVal = (testNameDraft[t.id]||"").trim();
    if(!nameVal) return; // never allow a blank name to wipe a test's name
    const custom = customTests.find(ct=>ct.id===t.id);
    if(custom){
      if(custom.name!==nameVal){ custom.name = nameVal; touchedIds.push(t.id); }
    } else if(builtIn[t.id] !== undefined){
      const prevOverride = testNameOverrides[t.id];
      const newOverride = (nameVal !== builtIn[t.id]) ? nameVal : undefined;
      if(newOverride!==prevOverride){
        if(newOverride!=null) testNameOverrides[t.id] = newOverride; else delete testNameOverrides[t.id];
        touchedIds.push(t.id);
      }
    }
  });
  saveTestPrices();
  saveCustomTests();
  saveTestNameOverrides();
  // Only bump the ids that actually changed — so tests nobody touched in this edit keep
  // their existing (possibly newer) per-id time from wherever they were last really edited.
  new Set(touchedIds).forEach(id=>touchTestItem(id));
  testPriceEditorOpen = false;
  render();
  showToast("✓ Tests saved");
}

function billComputedPills(){
  if(bill.qtyMode==="dose"){
    const perDay = Number(bill.perDay);
    if(!perDay || perDay<=0) return 0;
    const days = bill.daysMode==="same" ? (Number(bill.globalDays)||0) : Number(bill.days);
    if(!days || days<=0) return 0;
    return perDay*days;
  }
  return Number(bill.pills) || 0;
}

  const perDay = Number(bill.perDay);
  if(!perDay || perDay<=0) return false;
  if(bill.daysMode==="same") return true; // days can be set later, applies to whole list
  const days = Number(bill.days);
  return !!(days && days>0);
}

  const med = inventory.find(m=>m.id===bill.selectedMedId);
  if(!med || !canAddBillItem()) return;
  const pricePerPill = nextBatchUnitPrice(med);
  if(bill.qtyMode==="total"){
    const pills = Number(bill.pills)||0;
    bill.items.push({medId:med.id, name:med.name, pills, pricePerPill, subtotal:pricePerPill*pills, note:"", perDay:null, linkedToGlobalDays:false});
  } else if(bill.daysMode==="same"){
    const perDay = Number(bill.perDay)||0;
    const days = Number(bill.globalDays)||0;
    const pills = perDay*days;
    const note = days>0 ? `${perDay}/day × ${days}d` : `${perDay}/day × (set days below)`;
    bill.items.push({medId:med.id, name:med.name, pills, pricePerPill, subtotal:pricePerPill*pills, note, perDay, linkedToGlobalDays:true});
  } else {
    const perDay = Number(bill.perDay)||0;
    const days = Number(bill.days)||0;
    const pills = perDay*days;
    const note = `${perDay}/day × ${days}d`;
    bill.items.push({medId:med.id, name:med.name, pills, pricePerPill, subtotal:pricePerPill*pills, note, perDay, linkedToGlobalDays:false});

function setApplyingFeeMode(mode){
  bill.applyingFeeMode = mode;
  bill.applyingFeeDraft = "";
  bill.wholeApplyingFee = "";

  render();

function onApplyingFeeDraft(v){ bill.applyingFeeDraft=v; scheduleRender(); }
function onWholeApplyingFee(v){ bill.wholeApplyingFee=v; recomputeWholeApplyingFee(); scheduleRender(); }
// The single whole-bill applying fee always lives on whichever special item was added most
// recently — never as its own line. Re-run this after any add/remove of a special item, or
// whenever the whole-bill fee amount itself changes, so it always tracks the current "last"
// special item instead of staying stuck on one that may have since been removed.
function recomputeWholeApplyingFee(){
  const specials = bill.items.filter(it=>it.special);
  specials.forEach(it=>{
    if(it.feeMode==='whole'){
      it.appliedFee = 0;
      it.subtotal = it.baseSubtotal;
      it.note = it.baseNote||"";
      it.feeMode = null;
    }
  });
  if(bill.applyingFeeMode==='whole' && specials.length){
    const fee = Number(bill.wholeApplyingFee)||0;
    const last = specials[specials.length-1];
    last.feeMode = 'whole';
    last.appliedFee = fee;
    last.subtotal = last.baseSubtotal + fee;
    last.note = fee>0 ? `${last.baseNote?last.baseNote+" · ":""}+applying fee ${CURRENCY}${money(fee)}` : (last.baseNote||"");
  }
}
function addSpecialBillItem(){
  const med = inventory.find(m=>m.id===bill.selectedSpecialMedId);
  if(!med || !canAddSpecialBillItem()) return;
  const pills = billComputedSpecialPills();
  const pricePerPill = nextBatchUnitPrice(med);
  const baseSubtotal = pricePerPill*pills;
  const item = { medId:med.id, name:med.name, pills, pricePerPill, subtotal:baseSubtotal, note:"", perDay:null, linkedToGlobalDays:false,
    special:true, specialCategory:med.specialCategory||"", baseSubtotal, baseNote:"", appliedFee:0, feeMode:null };
  if(bill.applyingFeeMode==='perItem'){
    const fee = Number(bill.applyingFeeDraft)||0;
    item.feeMode = 'perItem';
    item.appliedFee = fee;
    item.subtotal = baseSubtotal + fee;
    item.note = fee>0 ? `+applying fee ${CURRENCY}${money(fee)}` : "";
  }
  bill.items.push(item);
  bill.selectedSpecialMedId=null; bill.specialQuery=""; bill.specialPills=""; bill.applyingFeeDraft="";
  if(bill.applyingFeeMode==='whole') recomputeWholeApplyingFee();
  render();
}

function buildBillText(tx){
  const lines = [`🏥 Patient Bill`, `Patient: ${tx.patientName}`, `Date: ${fmtDateTime(tx.timestamp)}`, `Mode of Payment: ${tx.paymentMode||"Cash"}`];
  if(tx.remarks) lines.push(`Remarks: ${tx.remarks}`);
  lines.push(``);
  if(tx.items.length){
    lines.push(`Medicines:`);
    tx.items.forEach((it,i)=> lines.push(`${i+1}. ${it.name} — ${it.pills} medicine${it.note?` (${it.note})`:""} — ${CURRENCY}${money(it.pricePerPill*it.pills)}`));
    if(tx.medsDiscount) lines.push(`Medicines discount: -${CURRENCY}${money(tx.medsDiscount)}`);
    lines.push(``);
  }
  if(tx.tests && tx.tests.length){
    lines.push(`Tests:`);
    tx.tests.forEach((t,i)=> lines.push(`${i+1}. ${t.name} — ${CURRENCY}${money(t.amount)}`));
    if(tx.testsDiscount) lines.push(`Tests discount: -${CURRENCY}${money(tx.testsDiscount)}`);
    lines.push(``);
  }
  if(tx.extras && tx.extras.length){
    lines.push(`Other charges:`);
    tx.extras.forEach((ex,i)=> lines.push(`${i+1}. Other charge — ${CURRENCY}${money(ex.amount)}`));
    lines.push(``);
  }
  lines.push(`Medicine total: ${CURRENCY}${money((tx.medTotal||0)-(tx.medsDiscount||0))}`);
  if(tx.tests && tx.tests.length) lines.push(`Tests total: ${CURRENCY}${money((tx.testsTotal||0)-(tx.testsDiscount||0))}`);
  lines.push(`Doctor fee: ${CURRENCY}${money((tx.doctorFee||0)-(tx.feeDiscount||0))}`);
  if(tx.feeDiscount) lines.push(`Doctor fee discount: -${CURRENCY}${money(tx.feeDiscount)}`);
  lines.push(`--------------------------`);
  lines.push(`Grand total: ${CURRENCY}${money(tx.grandTotal)}`);
  return lines.join("\n");
}

// --- Thermal receipt printing (ESC/POS) -------------------------------------------------
// Almost every cheap thermal receipt printer — Bluetooth, WiFi, or USB alike — understands
// the same ESC/POS command language, so we build ONE byte sequence here and every transport
// (Bluetooth first, others later) just has the job of delivering these exact bytes.
// Bytes are represented as a JS string where each character's code IS the byte value
// (0–255) — this is the simplest way to smuggle raw binary through the WebViewString bridge,
// which only carries text. On the App Inventor side, BluetoothClient1.CharacterEncoding must
// be set to "ISO-8859-1" so each character is sent as exactly one byte, unchanged.
const PRINTER_PAPER_CHARS = 32; // 32 chars/line ≈ 58mm paper. Change to 48 for 80mm paper.

function padLR(left, right, width){
  left = String(left); right = String(right);
  const space = Math.max(1, width - left.length - right.length);
  if(space < 1) return (left + " " + right).slice(0, width);
  return left + " ".repeat(space) + right;
}

function buildEscPosReceipt(tx){
  const ESC = "\x1B", GS = "\x1D", W = PRINTER_PAPER_CHARS;
  const init = ESC + "@";                 // reset printer to defaults
  const center = ESC + "a" + "\x01";
  const left = ESC + "a" + "\x00";
  const boldOn = ESC + "E" + "\x01";
  const boldOff = ESC + "E" + "\x00";
  const doubleOn = GS + "!" + "\x11";      // double width+height, for the shop name
  const doubleOff = GS + "!" + "\x00";
  const divider = "-".repeat(W) + "\n";
  const feedAndCut = "\n\n\n" + GS + "V" + "\x00"; // feed 3 lines then full cut
  const shop = getReceiptSettings();
  const invoiceNo = (tx.id||"").slice(-6).toUpperCase();

  let r = init + center;
  r += doubleOn + boldOn + shop.shopName + "\n" + boldOff + doubleOff;
  if(shop.address) r += shop.address + "\n";
  if(shop.phone) r += shop.phone + "\n";
  r += left + divider;
  r += padLR(`Invoice #${invoiceNo}`, fmtDateTime(tx.timestamp), W) + "\n";
  r += `Patient: ${tx.patientName}\n`;
  r += `Mode of Payment: ${tx.paymentMode||"Cash"}\n`;
  if(tx.remarks) r += `Remarks: ${tx.remarks}\n`;
  r += divider;

  let totalQty = 0;
  if(tx.items.length){
    tx.items.forEach(it=>{
      totalQty += it.pills;
      r += `${it.name}${it.note?` (${it.note})`:""}\n`;
      r += padLR(`  ${it.pills} x ${CURRENCY}${money(it.pricePerPill)}`, `${CURRENCY}${money(it.pricePerPill*it.pills)}`, W) + "\n";
    });
    if(tx.medsDiscount) r += padLR("Medicines discount", `-${CURRENCY}${money(tx.medsDiscount)}`, W) + "\n";
    r += divider;
  }
  if(tx.tests && tx.tests.length){
    tx.tests.forEach(t=> r += padLR(t.name, `${CURRENCY}${money(t.amount)}`, W) + "\n");
    if(tx.testsDiscount) r += padLR("Tests discount", `-${CURRENCY}${money(tx.testsDiscount)}`, W) + "\n";
    r += divider;
  }
  if(tx.extras && tx.extras.length){
    tx.extras.forEach((ex,i)=> r += padLR(ex.label || `Other charge ${i+1}`, `${CURRENCY}${money(ex.amount)}`, W) + "\n");
    r += divider;
  }

  r += padLR("Medicine total", `${CURRENCY}${money((tx.medTotal||0)-(tx.medsDiscount||0))}`, W) + "\n";
  if(tx.tests && tx.tests.length) r += padLR("Tests total", `${CURRENCY}${money((tx.testsTotal||0)-(tx.testsDiscount||0))}`, W) + "\n";
  r += padLR("Doctor fee", `${CURRENCY}${money((tx.doctorFee||0)-(tx.feeDiscount||0))}`, W) + "\n";
  if(tx.feeDiscount) r += padLR("Doctor fee discount", `-${CURRENCY}${money(tx.feeDiscount)}`, W) + "\n";
  r += divider;
  if(totalQty) r += padLR("Total Qty", String(totalQty), W) + "\n";
  r += boldOn + padLR("PAYABLE", `${CURRENCY}${money(tx.grandTotal)}`, W) + boldOff + "\n";
  r += divider + center + "Thank you!\n" + left;
  r += feedAndCut;
  return r;
}

// Hands the raw ESC/POS bytes to the native app over the bridge, prefixed "PRINT:" so
// App Inventor's WebViewStringChange handler can route it to whichever printer transport
// is configured (Bluetooth first; WiFi/USB/BLE can be added later using this same message).
function printReceipt(tx){
  const escpos = buildEscPosReceipt(tx);
  if(!window.AppInventor || typeof window.AppInventor.setWebViewString !== "function"){
    showToast("Printing isn't available outside the app");
    return;
  }
  const transport = localStorage.getItem("clinic_printer_transport") || "";
  if(transport === "wifi"){
    window.AppInventor.setWebViewString("PRINT_WIFI:" + escpos);
  } else if(transport === "ble"){
    window.AppInventor.setWebViewString("PRINT_BLE:" + escpos);
  } else if(transport === "usb"){
    window.AppInventor.setWebViewString("PRINT_USB:" + escpos);
  } else if(transport === "cloud"){
    window.AppInventor.setWebViewString("PRINT_CLOUD:" + escpos);
  } else {
    // Default / unset falls back to Bluetooth — matches the original Phase 1 behavior.
    window.AppInventor.setWebViewString("PRINT:" + escpos);
  }
}
// Opens the in-page "Printer Settings" modal (Bluetooth device picker or WiFi IP/port entry).
function selectPrinter(){
  if(!can("printer")){ showToast("Only Admin can change printer settings"); return; }
  printerUi.open = !printerUi.open; render();
}
function choosePrinterTransport(t){

function pickBluetoothPrinter(){
  localStorage.setItem("clinic_printer_transport", "bluetooth");

    window.AppInventor.setWebViewString("SELECT_PRINTER");
  }
  printerUi.open = false;
  render();
}
function pickBlePrinter(){
  // Sends a bridge message so the App Inventor side can eventually trigger a BLE scan/pick UI
  // and reply with the chosen device's address once that block wiring exists (deferred until
  // a real BLE printer is on hand to read its service/characteristic UUIDs from).
  localStorage.setItem("clinic_printer_transport", "ble");
  if(window.AppInventor && typeof window.AppInventor.setWebViewString === "function"){
    window.AppInventor.setWebViewString("SELECT_BLE_PRINTER");
  }
  printerUi.open = false;
  showToast("✓ BLE printer selected");
  render();
}
function pickUsbPrinter(){
  // Sends a bridge message so the App Inventor side can attempt a USB/OTG connection via the
  // SerialOTG extension (Phase 4). Since USB devices are physically plugged in rather than
  // scanned/paired, this just tells the native side to try opening whatever serial device is
  // currently connected via the OTG adapter — actual wiring deferred until a real USB printer
  // is on hand to confirm its chip type (CDC/FTDI/CP210x/etc) and correct baud rate.
  localStorage.setItem("clinic_printer_transport", "usb");
  if(window.AppInventor && typeof window.AppInventor.setWebViewString === "function"){
    window.AppInventor.setWebViewString("SELECT_USB_PRINTER");
  }
  printerUi.open = false;
  showToast("✓ USB printer selected");
  render();
}
function saveWifiPrinter(){

  if(window.AppInventor && typeof window.AppInventor.setWebViewString === "function"){

  }
  printerUi.open = false;
  showToast("✓ WiFi printer saved");
  render();
}
function saveCloudPrinter(){
  const url = (printerUi.cloudUrl||"").trim();

        <label class="field-label">Days (applies to every linked medicine)</label>
        <input ${NOAC} id="billGlobalDaysInput2" type="text" inputmode="numeric" value="${esc(bill.globalDays)}" oninput="onGlobalDays(this.value)" placeholder="e.g. 5">
      </div>

    ${testsHtml}

    <div class="card">
      <h3 class="mb2" style="font-size:14px;font-weight:700;">Others (dressing, transport, etc.)</h3>

      </div>
      ${bill.extras.length ? bill.extras.map((ex,idx)=>`
        <div class="item-row">
          <div style="font-size:14px;font-weight:600;">Other charge ${idx+1}</div>
