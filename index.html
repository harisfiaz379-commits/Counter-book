// Shared by the low-stock / hidden-warning / expiring lists below — same instant-first-batch,
// background-chunk-the-rest approach used for Inventory, so Warnings stays fast if the number
// of flagged medicines ever grows large too (currently each of these three lists is normally
// a small subset of the full medicine count, but nothing stops that from changing over time).
function fillListProgressively(containerId, items, buildRow, myToken){
  const el = document.getElementById(containerId);
  if(!el) return;
  const FIRST_BATCH = 15, CHUNK_SIZE = 30;
  el.innerHTML = items.slice(0, FIRST_BATCH).map(buildRow).join("");
  if(items.length <= FIRST_BATCH) return;
  let idx = FIRST_BATCH;
  const appendNextChunk = ()=>{
    if(myToken !== _warnRenderToken) return; // superseded — tab changed or data edited since
    const listEl = document.getElementById(containerId);
    if(!listEl) return;
    const chunk = items.slice(idx, idx+CHUNK_SIZE);
    listEl.insertAdjacentHTML("beforeend", chunk.map(buildRow).join(""));
    idx += CHUNK_SIZE;
    if(idx < items.length) requestAnimationFrame(appendNextChunk);
  };
  requestAnimationFrame(appendNextChunk);
}
// Tapping a summary pill narrows the page below to just that one group; tapping the same pill
// again clears the filter back to showing everything. A discrete click, not continuous typing,
// so redoing the whole tab via renderStock() (rather than only a results container) is fine —
// the pills themselves need their active/inactive styling refreshed too.
function toggleWarnFilter(kind){
  warnUi.filter = (warnUi.filter===kind) ? null : kind;
  renderStock();
}
function renderStock(){
  const myToken = ++_warnRenderToken;
  const filter = warnUi.filter; // null|'expired'|'expiringSoon'|'lowStock'
  const list = lowStockList();
  const hidden = inventory.filter(m=>!m.deleted && m.noWarn && m.stockPills <= (m.lowStockAt ?? 0));
  const expiringAll = expiringBatches();
  // expiringBatches() covers both "already past its date" (daysLeft<0) and "expiring soon"
  // (0-10 days left) in one list — split those apart here so the summary counts (and the
  // expired/expiringSoon filter pills) match what the individual cards below actually say
  // (batchExpiryLabel does this same day<0 check).
  const expiredItems = expiringAll.filter(e=>e.daysLeft<0);
  const expiringSoonItems = expiringAll.filter(e=>e.daysLeft>=0);

  // Nothing-to-show and the pill counts themselves always reflect the TRUE totals, regardless
  // of any active filter — a filter should never make its own pill (or the others) disappear
  // or relabel, only narrow what's listed underneath.
  if(list.length===0 && hidden.length===0 && expiringAll.length===0){
    document.getElementById("main").innerHTML = `<p class="small faint" style="text-align:center;padding:40px 0;">All medicines are sufficiently stocked and nothing is expiring soon. 👍</p>`;
    return;
  }

  const pillBtn = (active, softVar, solidVar, label, kind)=>
    `<button type="button" class="pill-badge" style="border:none;-webkit-appearance:none;appearance:none;margin:0;font-family:inherit;font-weight:700;cursor:pointer;background:${active?`var(${solidVar})`:`var(${softVar})`};color:${active?'#fff':`var(${solidVar})`};" onclick="toggleWarnFilter('${kind}')">${label}</button>`;
  const summaryHtml = `
    <div class="row" style="gap:8px;flex-wrap:wrap;margin-bottom:8px;">
      ${expiredItems.length ? pillBtn(filter==='expired', '--dangerSoft', '--danger', `⏳ ${expiredItems.length} expired`, 'expired') : ""}
      ${expiringSoonItems.length ? pillBtn(filter==='expiringSoon', '--warningSoft', '--warning', `⏳ ${expiringSoonItems.length} expiring soon`, 'expiringSoon') : ""}
      ${list.length ? pillBtn(filter==='lowStock', '--dangerSoft', '--danger', `📦 ${list.length} low stock`, 'lowStock') : ""}
    </div>
    <div class="flex gap2 mb2"><button type="button" class="btn btn-outline flex1" style="font-size:12px;padding:8px;" onclick="shareReorderList()">📤 Reorder list</button><button type="button" class="btn btn-outline flex1" style="font-size:12px;padding:8px;" onclick="openTools('expiry')">⏳ Expiry outlook</button></div>
    ${filter ? `<p class="small faint mb2">Filtered · <button type="button" onclick="toggleWarnFilter('${filter}')" style="background:none;border:none;color:var(--primary);font-weight:700;cursor:pointer;padding:0;font-size:inherit;">Show all</button></p>` : ""}
  `;

  // Which section(s) the current pill (if any) leaves visible — hidden (suppressed-warning)
  // items are grouped with low stock since that's what they are underneath, just muted.
  const showLowStock = !filter || filter==='lowStock';
  const showHidden = !filter || filter==='lowStock';
  const expiringToShow = filter==='expired' ? expiredItems : filter==='expiringSoon' ? expiringSoonItems : (filter==='lowStock' ? [] : expiringAll);
  const expiringHeadingText = filter==='expired' ? "⏳ Expired" : filter==='expiringSoon' ? "⏳ Expiring soon (within 10 days)" : "⏳ Expiring within 10 days";

  const listToShow = showLowStock ? list : [];
  const hiddenToShow = showHidden ? hidden : [];

  if(listToShow.length===0 && hiddenToShow.length===0 && expiringToShow.length===0){
    // The filtered-down group happens to be empty right now (e.g. the last expired batch was
    // just disposed of while this pill was active) even though the tab as a whole isn't.
    document.getElementById("main").innerHTML = `
      ${summaryHtml}
      <p class="small faint" style="text-align:center;padding:32px 0;">Nothing in this group right now. 👍</p>
    `;
    return;
  }

  const hiddenHeadingHtml = hiddenToShow.length ? `
    <p class="small" style="font-weight:700;color:var(--warning);margin:${listToShow.length?"18px":"0"} 0 8px;">
      ⚠ These are actually low too, but their warning is turned off
    </p>
    <div id="warnHiddenList"></div>` : "";

  const expiringHeadingHtml = expiringToShow.length ? `
    <p class="small" style="font-weight:700;color:var(--danger);margin:${listToShow.length||hiddenToShow.length?"18px":"0"} 0 8px;">
      ${expiringHeadingText}
    </p>
    <div id="warnExpiringList"></div>` : "";

  document.getElementById("main").innerHTML = `
    ${summaryHtml}
    ${listToShow.length ? `<button class="btn btn-danger" style="width:100%;padding:12px;margin-bottom:12px;" onclick="shareLowStock()">📤 Share low-stock list</button>` : ""}
    <div id="warnLowStockList"></div>
    ${hiddenHeadingHtml}
    ${expiringHeadingHtml}
  `;
  fillListProgressively("warnLowStockList", listToShow, buildLowStockRow, myToken);
  if(hiddenToShow.length) fillListProgressively("warnHiddenList", hiddenToShow, buildHiddenLowStockRow, myToken);
  if(expiringToShow.length) fillListProgressively("warnExpiringList", expiringToShow, buildExpiringRow, myToken);
}

function visibleProfiles(){ return profiles.filter(p=>!p.deleted); }
function currentRole(){
  const p = profiles.find(x=>x.id===currentProfileId);
  return p ? p.role : null;
}
/* Small badge in the fixed header showing whoever is currently logged in on this device
   and their role, so on a shared device it's obvious who's signed in and what they can see
   (e.g. why the monthly-total breakdown might be missing for a receptionist). Cleared
   during the setup/login screens since nobody is authed yet at that point. */
function roleLabel(role){
  if(role==="admin") return "Admin";
  if(role==="semiadmin") return "Semi-Admin";
  if(role==="doctor") return "Doctor";
  if(role==="receptionist") return "Receptionist";
  return role ? esc(role) : "";
}
function renderUserBadge(){
  const el = document.getElementById("currentUserBadge");
  if(!el) return;
  if(!sessionAuthed || !currentProfileId){ el.innerHTML=""; return; }
  const p = profiles.find(x=>x.id===currentProfileId);
  if(!p){ el.innerHTML=""; return; }
  // Plain inline flow (not flex) so a long name that wraps to a second line just carries the
  // "· ROLE" bit along with its last word, instead of a flex row centering the pill vertically
  // across the whole wrapped block (which floats it oddly between the two lines).
  // A flex row (not the old plain-inline flow) so the name can be constrained and truncated
  // with an ellipsis instead of wrapping to a second line — a long name used to grow the
  // whole header taller. min-width:0 on the name span is what lets a flex child actually
  // shrink below its content's natural width so text-overflow:ellipsis can kick in; the "·"
  // and role pill get flex-shrink:0 so they never get squeezed and always stay fully visible.
  el.innerHTML = `<div style="display:flex;align-items:center;gap:6px;min-width:0;">
    <span style="font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;">${esc(p.name)}</span>
    <span style="opacity:.6;flex-shrink:0;">·</span>
    <span style="display:inline-block;flex-shrink:0;background:rgba(255,255,255,.22);padding:2px 8px;border-radius:999px;font-size:11px;font-weight:700;letter-spacing:.02em;text-transform:uppercase;white-space:nowrap;">${roleLabel(p.role)}</span>
  </div>`;
}
// The 3 gated actions: Printer Settings + Receipt setup are Admin-only by default; the Monthly
// Total Sales summary is hidden from Receptionist by default. Semi-Admin gets none of these
// unless the Admin explicitly ticks them on for that person (stored per-profile in
// `privileges`); Manage Users is never available to Semi-Admin no matter what's ticked — that's
// checked first, before any role branching, so it can never be granted. Everything else (New
// Bill, Records view/edit, daily/individual sales, Inventory view+edit, Backup, Notepad) stays
// open to every role.
function can(action){
  const role = currentRole();
  // Manage Users is Admin-only outright — Semi-Admins never get it, whatever is ticked.
  if(action==="manageUsers") return role==="admin";
  if(role==="admin") return true;
  if(role==="semiadmin"){
    const p = profiles.find(x=>x.id===currentProfileId);
    const priv = (p && p.privileges) || {};
    // Categories are Admin by default; a Semi-Admin only gets them if that privilege was ticked.
    if(action==="manageCategories") return !!priv.editCategories;
    if(action==="printer") return !!priv.printer;
    if(action==="receiptSetup") return !!priv.receiptSetup;
    if(action==="monthlyTotal") return !!priv.monthlyTotal;
    if(action==="diagnostics") return !!priv.diagnostics;
    return true;
  }
  if(action==="manageCategories") return false;
  if(action==="printer") return false;
  if(action==="receiptSetup") return false;
  if(action==="monthlyTotal") return role==="doctor";
  if(action==="diagnostics") return false;
  return true;
}
function activateProfile(id){
  currentProfileId = id;
  sessionAuthed = true;
  try{
    localStorage.setItem("clinic_current_profile", id);
    localStorage.setItem("clinic_session_authed", "1");
  }catch(e){}
  loadNotesForCurrentProfile();
}

async function submitSetupAdmin(){
  const name = setupUi.name.trim();
  const pin = setupUi.pin.trim();
  const question = (setupUi.question==="custom" ? setupUi.customQuestion.trim() : setupUi.question);
  const answer = setupUi.answer.trim();
  if(!name){ showToast("Enter your name first"); return; }
  if(pin.length<4){ showToast("Choose a PIN with at least 4 digits"); return; }
  if(!question){ showToast("Choose or type a security question"); return; }
  if(!answer){ showToast("Enter an answer to your security question"); return; }
  if(visibleProfiles().length>0){
    // Existing accounts arrived from the cloud while this form was open — don't create a second Admin.
    showToast("Accounts already exist on this clinic — please log in instead");
    setupHold = false; setupWantLogin = true; render(); return;
  }
  const code = genRecoveryCode();
  const [answerHash, codeHash] = await Promise.all([
    hashSecret(normalizeAnswer(answer)),
    hashSecret(normalizeCode(code))
  ]);
  const p = { id:uid(), name, role:"admin", pin, securityQuestion:question, securityAnswerHash:answerHash, recoveryCodeHash:codeHash, updatedAt:Date.now() };
  profiles.push(p);
  saveProfiles();
  setupUi.step = "code";
  setupUi.generatedCode = code;
  setupUi.pendingProfileId = p.id;
  render();
}

  const id = setupUi.pendingProfileId;
  setupUi = { name:"", pin:"", question:"", customQuestion:"", answer:"", step:"form", generatedCode:"", pendingProfileId:"" };

  render();
}

/* ---- Optional Gmail login (PIN login still works exactly as before) ----
   Native side (App Inventor Blocks) contract:
     page -> native : setWebViewString("GOOGLE_SIGNIN")
     native -> page : WebViewString = "GOOGLE_EMAIL:someone@gmail.com"  (or "GOOGLE_CANCELLED"),
                      then evaluatejavascript("onNativeBridgeMessage()")
   The email is stored on the person's profile (p.email). It is a convenience login, like the PIN. */
// Gmail login is PAUSED: the native Google sign-in isn't set up in the app yet. Set to true to show the buttons again.
const GMAIL_LOGIN_ENABLED = false;
let googleMode = "", _googleTimer = null;
function requestGoogleSignIn(mode){
  if(!window.AppInventor || typeof window.AppInventor.setWebViewString!=="function"){ showToast("Google sign-in only works inside the app"); return; }
  googleMode = mode;
  window.AppInventor.setWebViewString("GOOGLE_SIGNIN");
  clearTimeout(_googleTimer);
  _googleTimer = setTimeout(()=>{ if(googleMode){ googleMode=""; showToast("⚠ No answer from the app — Google sign-in isn't set up in the app yet"); } }, 20000);
}
function startGoogleLogin(){ requestGoogleSignIn("login"); }
function startLinkGmail(){ if(!sessionAuthed || !currentProfileId) return; requestGoogleSignIn("link"); }
function handleGoogleEmail(raw){
  clearTimeout(_googleTimer);
  const mode = googleMode; googleMode = "";
  const email = String(raw||"").trim().toLowerCase();
  if(!mode || !email) return;
  if(mode==="login"){
    const p = visibleProfiles().find(x=>(x.email||"").toLowerCase()===email);
    if(!p){ loginUi.error="No one is linked to "+email+". Log in with your PIN, then link it from the menu."; render(); return; }
    activateProfile(p.id); loginUi = { pickedId:"", pin:"", error:"" }; render();
  } else {
    const me = profiles.find(x=>x.id===currentProfileId);
    if(!me) return;
    if(profiles.some(x=>x.id!==me.id && !x.deleted && (x.email||"").toLowerCase()===email)){ showToast("⚠ That Gmail is already linked to someone else"); return; }
    me.email = email; me.updatedAt = Date.now(); saveProfiles(); renderNav();
    showToast("✓ "+email+" linked — you can now sign in with Google");
  }
}

function openForgotPin(profileId){

async function verifyForgotAnswer(){
  const p = profiles.find(x=>x.id===forgotUi.profileId);
  if(!p){ forgotUi.error="Something went wrong — try again."; render(); return; }
  const hash = await hashSecret(normalizeAnswer(forgotUi.answer));
  if(!forgotUi.answer.trim() || hash!==p.securityAnswerHash){
    forgotUi.error = "That doesn't match. Try again, or use your recovery code instead.";
    render();
    return;
  }
  forgotUi.step = "newpin";
  forgotUi.error = "";
  render();
}
async function verifyForgotCode(){
  const p = profiles.find(x=>x.id===forgotUi.profileId);
  if(!p){ forgotUi.error="Something went wrong — try again."; render(); return; }
  const hash = await hashSecret(normalizeCode(forgotUi.code));
  if(!forgotUi.code.trim() || hash!==p.recoveryCodeHash){
    forgotUi.error = "That code doesn't match. Double-check it, or try your security question instead.";
    render();
    return;
  }
  forgotUi.step = "newpin";
  forgotUi.error = "";

  if(!admins.length){ showToast("No Admin account exists yet"); return; }
  addUserLoginUi = { open:true, adminId:admins[0].id, adminPin:"", step:"verify", error:"", newName:"", newRole:"receptionist", newPin:"", newPrivileges:{printer:false,receiptSetup:false,monthlyTotal:false, editCategories:false, diagnostics:false} };
  render();
}
function closeAddUserFromLogin(){ addUserLoginUi.open=false; render(); }
function onVerifyAdminPick(v){ addUserLoginUi.adminId=v; addUserLoginUi.error=""; render(); }
function onVerifyAdminPin(v){ addUserLoginUi.adminPin=v.replace(/[^0-9]/g,"").slice(0,6); }
function verifyAdminForAddUser(){
  const admin = profiles.find(x=>x.id===addUserLoginUi.adminId);
  if(!admin || (admin.pin||"")!==addUserLoginUi.adminPin){
    addUserLoginUi.error = "Incorrect PIN";
    render();
    return;
  }
  addUserLoginUi.step = "form";
  addUserLoginUi.error = "";
  render();
}
function onAddUserLoginName(v){ addUserLoginUi.newName=v; }
function onAddUserLoginRole(v){ addUserLoginUi.newRole=v; render(); }
function onAddUserLoginPin(v){ addUserLoginUi.newPin=v.replace(/[^0-9]/g,"").slice(0,6); }
function onAddUserLoginPrivilegeToggle(key){ addUserLoginUi.newPrivileges[key] = !addUserLoginUi.newPrivileges[key]; render(); }
function submitAddUserFromLogin(){
  const name = addUserLoginUi.newName.trim();
  const pin = addUserLoginUi.newPin.trim();
  if(!name){ showToast("Enter a name first"); return; }
  if(pin.length<4){ showToast("Choose a PIN with at least 4 digits"); return; }
  const role = addUserLoginUi.newRole==="admin" ? "receptionist" : addUserLoginUi.newRole;
  const p = { id:uid(), name, role, pin, updatedAt:Date.now() };
  // The Admin PIN check in the "verify" step above already stands in for the privilege
  // confirmation Manage Users requires separately, so Semi-Admin privileges save directly here.
  if(role==="semiadmin") p.privileges = { ...addUserLoginUi.newPrivileges };
  profiles.push(p);
  saveProfiles();
  showToast(`✓ ${name} added — they can log in now`);
  addUserLoginUi = { open:false, adminId:"", adminPin:"", step:"verify", error:"", newName:"", newRole:"receptionist", newPin:"", newPrivileges:{printer:false,receiptSetup:false,monthlyTotal:false, editCategories:false, diagnostics:false} };
  render();
}
function renderAddUserLoginModal(){
  const root = document.getElementById("addUserLoginModalRoot");
  if(!root) return;
  if(!addUserLoginUi.open){ root.innerHTML=""; return; }
  const admins = visibleProfiles().filter(p=>p.role==="admin");
  // Only one Admin can exist at a time, so a brand-new account can never be created as Admin —
  // Admin status only ever moves to an existing account via the "make Admin" transfer flow
  // (Manage Users > Edit), which requires the current Admin's own PIN.
  const roleOpt = (selected) => ["semiadmin","doctor","receptionist"].map(r=>
    `<option value="${r}" ${selected===r?"selected":""}>${roleLabel(r)}</option>`).join("");
  const PRIVILEGE_ITEMS = [
    {key:"printer", label:"Printer settings"},
    {key:"receiptSetup", label:"Receipt setup"},
    {key:"monthlyTotal", label:"Monthly Total Sales"},
    {key:"editCategories", label:"Edit medicine categories"},
    {key:"diagnostics", label:"Diagnostics"}
  ];
  let body = "";
  if(addUserLoginUi.step==="verify"){
    body = `
      <p class="small faint" style="margin:0 0 12px;">Adding a user needs an Admin to confirm it. Enter an Admin's PIN to continue.</p>
      ${admins.length>1?`
        <label class="field-label" style="text-align:left;">Which Admin?</label>
        <select onchange="onVerifyAdminPick(this.value)" class="mb2">${admins.map(a=>`<option value="${a.id}" ${addUserLoginUi.adminId===a.id?"selected":""}>${esc(a.name)}</option>`).join("")}</select>
      `:`<label class="field-label" style="text-align:left;">${esc(admins[0]?admins[0].name:"")}'s PIN</label>`}
      <input ${NOAC} type="password" inputmode="numeric" value="${esc(addUserLoginUi.adminPin)}" oninput="onVerifyAdminPin(this.value)" placeholder="••••" class="mb2">
      ${addUserLoginUi.error?`<p class="small" style="color:var(--danger);margin:0 0 10px;">${esc(addUserLoginUi.error)}</p>`:""}
      <button class="btn btn-primary" style="width:100%;" onclick="verifyAdminForAddUser()">Verify</button>
    `;
  } else if(addUserLoginUi.step==="form"){
    body = `
      <label class="field-label" style="text-align:left;">Name</label>
      <input ${NOAC} value="${esc(addUserLoginUi.newName)}" oninput="onAddUserLoginName(this.value)" placeholder="e.g. Sana" class="mb2">
      <label class="field-label" style="text-align:left;">Role</label>
      <select onchange="onAddUserLoginRole(this.value)" class="mb2">${roleOpt(addUserLoginUi.newRole)}</select>
      ${addUserLoginUi.newRole==="semiadmin"?`
        <label class="field-label" style="text-align:left;">Privileges (Manage Users is never included)</label>
        <div class="priv-list mb2">
          ${PRIVILEGE_ITEMS.map(it=>`
            <label class="priv-row">
              <input type="checkbox" ${addUserLoginUi.newPrivileges[it.key]?"checked":""} onchange="onAddUserLoginPrivilegeToggle('${it.key}')">
              <span>${it.label}</span>
            </label>`).join("")}
        </div>
      `:""}
      <label class="field-label" style="text-align:left;">PIN (4-6 digits)</label>
      <input ${NOAC} type="password" inputmode="numeric" value="${esc(addUserLoginUi.newPin)}" oninput="onAddUserLoginPin(this.value)" placeholder="••••" class="mb2">
      <button class="btn btn-primary" style="width:100%;" onclick="submitAddUserFromLogin()">Add user</button>
    `;
  }
  root.innerHTML = `
    <div class="modal-overlay" onclick="if(event.target===this) closeAddUserFromLogin()">
      <div class="modal">
        <div class="modal-head">
          <strong>Add new user</strong>
          <button class="modal-x" onclick="closeAddUserFromLogin()">✕</button>
        </div>
        <div style="padding:14px 16px;">${body}</div>
      </div>
    </div>`;
}

/* ---- Admin-only: Manage Users screen (add/edit role+PIN/remove) ---- */
function toggleAddUser(){
  manageUi.addingUser = !manageUi.addingUser;
  manageUi.newName=""; manageUi.newRole="receptionist"; manageUi.newPin="";
  manageUi.newPrivileges = {printer:false, receiptSetup:false, monthlyTotal:false, editCategories:false, diagnostics:false};
  render();
}
function onNewUserName(v){ manageUi.newName=v; }
function onNewUserRole(v){ manageUi.newRole=v; render(); }
function onNewUserPin(v){ manageUi.newPin=v.replace(/[^0-9]/g,"").slice(0,6); }
function onNewUserPrivilegeToggle(key){ manageUi.newPrivileges[key] = !manageUi.newPrivileges[key]; render(); }
function addUserProfile(){
  if(!can("manageUsers")) return;
  const name = manageUi.newName.trim();
  const pin = manageUi.newPin.trim();
  if(!name){ showToast("Enter a name first"); return; }
  if(pin.length<4){ showToast("Choose a PIN with at least 4 digits"); return; }
  // New accounts can never be created as Admin (only one Admin can exist, transferred via
  // the "make Admin" flow on an existing account) — defensive fallback if role is ever admin.
  const role = manageUi.newRole==="admin" ? "receptionist" : manageUi.newRole;
  if(role==="semiadmin"){
    // Granting Semi-Admin (and whichever privileges are ticked) needs the Admin's own PIN to
    // confirm, same as any other sensitive permission change — the account isn't created yet.
    openPrivilegeConfirm("add", { name, role, pin, privileges: { ...manageUi.newPrivileges } });
    return;
  }
  const p = { id:uid(), name, role, pin, updatedAt:Date.now() };
  profiles.push(p);
  saveProfiles();
  manageUi.addingUser=false;
  showToast(`✓ ${name} added`);
  render();
}
function startEditUser(id){
  const p = profiles.find(x=>x.id===id);
  if(!p) return;
  manageUi.editingId = id;
  manageUi.editRole = p.role;
  manageUi.editPin = p.pin || "";
  manageUi.editPrivileges = Object.assign({printer:false, receiptSetup:false, monthlyTotal:false, editCategories:false, diagnostics:false}, p.privileges||{});
  render();
}
function cancelEditUser(){ manageUi.editingId=null; render(); }
function onEditUserRole(v){ manageUi.editRole=v; render(); }
function onEditUserPin(v){ manageUi.editPin=v.replace(/[^0-9]/g,"").slice(0,6); }
function onEditUserPrivilegeToggle(key){ manageUi.editPrivileges[key] = !manageUi.editPrivileges[key]; render(); }
function saveEditUser(){
  if(!can("manageUsers")) return;
  const p = profiles.find(x=>x.id===manageUi.editingId);
  if(!p) return;
  if(manageUi.editPin.trim().length<4){ showToast("PIN must be at least 4 digits"); return; }
  if(p.role==="admin" && manageUi.editRole!=="admin" && visibleProfiles().filter(x=>x.role==="admin").length<=1){
    showToast("Can't demote the only Admin account");
    return;
  }
  if(p.role!=="admin" && manageUi.editRole==="admin"){
    // Making someone else Admin is a transfer, not a simple edit: only one Admin can exist at a
    // time, so this hands off Admin status rather than adding a second one — and it can only be
    // done using the current Admin's own PIN, confirmed in a separate step below.
    openAdminTransferConfirm(p.id, manageUi.editPin.trim());
    return;
  }
  if(manageUi.editRole==="semiadmin"){
    // Setting or updating Semi-Admin privileges always needs the Admin's own PIN to confirm.
    openPrivilegeConfirm("edit", { id:p.id, role:"semiadmin", pin:manageUi.editPin.trim(), privileges: { ...manageUi.editPrivileges } });
    return;
  }
  p.role = manageUi.editRole;
  p.pin = manageUi.editPin.trim();
  if(p.privileges) delete p.privileges; // no longer Semi-Admin, drop stale privilege flags
  p.updatedAt = Date.now();
  saveProfiles();
  manageUi.editingId=null;
  showToast("✓ Updated");
  render();
}

/* ---- Semi-Admin privilege grants: creating a Semi-Admin, or changing an existing one's ticked
   privileges, always needs the Admin's own PIN re-entered here before it's actually saved.
   Manage Users is deliberately never one of the toggleable privileges — can() hard-codes it to
   Admin-only regardless of what's stored, so it can never leak to a Semi-Admin account. ---- */
let privilegeConfirmUi = { open:false, mode:"", pending:null, actorPin:"", error:"" };
function openPrivilegeConfirm(mode, pending){
  manageUi.editingId = null;
  privilegeConfirmUi = { open:true, mode, pending, actorPin:"", error:"" };
  render();
}
function closePrivilegeConfirm(){ privilegeConfirmUi.open=false; render(); }
function onPrivilegeConfirmPin(v){ privilegeConfirmUi.actorPin = v.replace(/[^0-9]/g,"").slice(0,6); privilegeConfirmUi.error=""; }
function confirmPrivilegeSave(){
  const actor = profiles.find(x=>x.id===currentProfileId);
  if(!actor || (actor.pin||"")!==privilegeConfirmUi.actorPin){
    privilegeConfirmUi.error = "Incorrect PIN";
    render();
    return;
  }
  const d = privilegeConfirmUi.pending;
  if(privilegeConfirmUi.mode==="add"){
    const p = { id:uid(), name:d.name, role:d.role, pin:d.pin, privileges:d.privileges, updatedAt:Date.now() };
    profiles.push(p);
    saveProfiles();
    manageUi.addingUser=false;
    showToast(`✓ ${d.name} added`);
  } else if(privilegeConfirmUi.mode==="edit"){
    const p = profiles.find(x=>x.id===d.id);
    if(p){
      p.role = d.role;
      p.pin = d.pin;
      p.privileges = d.privileges;
      p.updatedAt = Date.now();
      saveProfiles();
    }
    showToast("✓ Updated");
  }
  privilegeConfirmUi = { open:false, mode:"", pending:null, actorPin:"", error:"" };
  render();
}

/* ---- Admin transfer: making someone else Admin requires the CURRENT Admin's own PIN, and
   immediately strips Admin status from whoever approves it (only one Admin can exist at a time).
   The ex-Admin is then forced (via postTransferChoiceUi, a non-dismissible modal) to pick
   Doctor/Receptionist or delete their own account before they can do anything else. ---- */
let adminTransferUi = { open:false, targetId:"", targetNewPin:"", actorPin:"", error:"" };
function openAdminTransferConfirm(targetId, targetNewPin){
  manageUi.editingId = null;
  adminTransferUi = { open:true, targetId, targetNewPin, actorPin:"", error:"" };
  render();
}
function closeAdminTransferConfirm(){ adminTransferUi.open=false; render(); }
function onAdminTransferPin(v){ adminTransferUi.actorPin = v.replace(/[^0-9]/g,"").slice(0,6); adminTransferUi.error=""; }
function confirmAdminTransfer(){
  const actor = profiles.find(x=>x.id===currentProfileId);
  const target = profiles.find(x=>x.id===adminTransferUi.targetId);
  if(!actor || !target){ closeAdminTransferConfirm(); return; }
  if((actor.pin||"") !== adminTransferUi.actorPin){
    adminTransferUi.error = "Incorrect PIN";
    render();
    return;
  }
  if(adminTransferUi.targetNewPin && adminTransferUi.targetNewPin.length>=4){
    target.pin = adminTransferUi.targetNewPin;
  }
  target.role = "admin";
  target.updatedAt = Date.now();
  saveProfiles();
  adminTransferUi.open = false;
  postTransferChoiceUi = { open:true, actorId:actor.id };
  showToast(`✓ ${target.name} is now Admin`);
  render();
}
function renderAdminTransferModal(){
  const root = document.getElementById("adminTransferModalRoot");
  if(!root) return;
  if(!adminTransferUi.open){ root.innerHTML=""; return; }
  const target = profiles.find(x=>x.id===adminTransferUi.targetId);
  root.innerHTML = `
    <div class="modal-overlay" onclick="if(event.target===this) closeAdminTransferConfirm()">
      <div class="modal">
        <div class="modal-head">
          <strong>Make ${esc(target?target.name:"")} Admin?</strong>
          <button class="modal-x" onclick="closeAdminTransferConfirm()">✕</button>
        </div>
        <div style="padding:14px 16px;">
          <p class="small faint" style="margin:0 0 12px;">Only one Admin can exist at a time. Confirm with your own PIN to hand over Admin status — you'll then need to choose a new role for yourself.</p>
          <label class="field-label" style="text-align:left;">Your PIN</label>
          <input ${NOAC} type="password" inputmode="numeric" value="${esc(adminTransferUi.actorPin)}" oninput="onAdminTransferPin(this.value)" placeholder="••••" class="mb2">
          ${adminTransferUi.error?`<p class="small" style="color:var(--danger);margin:0 0 10px;">${esc(adminTransferUi.error)}</p>`:""}
          <button class="btn btn-primary" style="width:100%;" onclick="confirmAdminTransfer()">Confirm & make Admin</button>
        </div>
      </div>
    </div>`;
}

let postTransferChoiceUi = { open:false, actorId:"" };
function choosePostTransferRole(role){
  const p = profiles.find(x=>x.id===postTransferChoiceUi.actorId);
  if(!p) return;
  p.role = role;
  p.updatedAt = Date.now();
  saveProfiles();
  postTransferChoiceUi.open = false;

}
function deleteOwnAccountAfterTransfer(){
  const p = profiles.find(x=>x.id===postTransferChoiceUi.actorId);
  if(!p) return;
  askConfirm(`Delete your account "${p.name}"? You will be logged out and this cannot be undone.`, ()=>{
    p.deleted = true; p.updatedAt = Date.now();
    saveProfiles();
    try{ localStorage.removeItem("clinic_notes_"+p.id); }catch(e){}
    currentProfileId = null;
    sessionAuthed = false;
    try{
      localStorage.removeItem("clinic_current_profile");
      localStorage.setItem("clinic_session_authed", "0");
    }catch(e){}
    loadNotesForCurrentProfile();
    postTransferChoiceUi.open = false;
    manageUi.open = false;
    manageUi.editingId = null;
    render();
  });
}
function renderPostTransferChoiceModal(){
  const root = document.getElementById("postTransferChoiceModalRoot");
  if(!root) return;
  if(!postTransferChoiceUi.open){ root.innerHTML=""; return; }
  // Deliberately no ✕ / overlay-dismiss here — after giving up Admin, choosing a new role
  // (or deleting the account) isn't optional, since an account can't be left as Admin-less "admin".
  root.innerHTML = `

            <button class="btn btn-outline flex1" onclick="choosePostTransferRole('doctor')">Doctor</button>
            <button class="btn btn-outline flex1" onclick="choosePostTransferRole('receptionist')">Receptionist</button>
          </div>
          <button class="btn btn-outline" style="width:100%;color:var(--danger);" onclick="deleteOwnAccountAfterTransfer()">Delete my account instead</button>
        </div>
      </div>

function deleteProfile(id){
  if(!can("manageUsers")) return;
  const p = profiles.find(x=>x.id===id);
  if(!p) return;
  if(p.role==="admin" && visibleProfiles().filter(x=>x.role==="admin").length<=1){
    showToast("Can't remove the only Admin account");
    return;
  }
  askConfirm(`Remove "${p.name}"? They will no longer be able to log in, and their private notes will be deleted. This cannot be undone.`, ()=>{
    // Soft-delete (tombstone) so the removal itself can sync to other devices, same as
    // medicines/bills/notes — otherwise it just reappears once another device's data syncs back.
    p.deleted = true; p.updatedAt = Date.now();
    saveProfiles();
    try{ localStorage.removeItem("clinic_notes_"+id); }catch(e){}
    if(currentProfileId===id){
      // They just removed their own currently-logged-in account — force a fresh login rather
      // than leaving a dangling identity or silently switching to someone else's account.
      currentProfileId = null;
      sessionAuthed = false;
      try{
        localStorage.removeItem("clinic_current_profile");
        localStorage.setItem("clinic_session_authed", "0");
      }catch(e){}
      loadNotesForCurrentProfile();
    }
    manageUi.editingId=null;
    render();
  });
}
let recoveryUi = { open:false, profileId:"", step:"form", question:"", customQuestion:"", answer:"", generatedCode:"" }; // custom in-app modal for manageRecoveryInfo — replaces the old native window.prompt()/alert() dialogs, same reasoning as receiptUi above
function manageRecoveryInfo(id){
  if(!can("manageUsers")) return;
  const p = profiles.find(x=>x.id===id);
  if(!p || p.role!=="admin") return;
  const presetMatch = SECURITY_QUESTIONS.includes(p.securityQuestion);
  recoveryUi = {
    open:true, profileId:id, step:"form",
    question: p.securityQuestion ? (presetMatch?p.securityQuestion:"custom") : SECURITY_QUESTIONS[0],
    customQuestion: (p.securityQuestion && !presetMatch) ? p.securityQuestion : "",
    answer:"", generatedCode:""
  };
  render();
}
function closeRecoveryModal(){ recoveryUi.open=false; render(); }
function onRecoveryQuestion(v){ recoveryUi.question=v; render(); }
function onRecoveryCustomQuestion(v){ recoveryUi.customQuestion=v; }
function onRecoveryAnswer(v){ recoveryUi.answer=v; }
async function submitRecoveryInfo(){
  const p = profiles.find(x=>x.id===recoveryUi.profileId);
  if(!p){ closeRecoveryModal(); return; }
  const question = (recoveryUi.question==="custom" ? recoveryUi.customQuestion.trim() : recoveryUi.question);
  const answer = recoveryUi.answer.trim();
  if(!question){ showToast("Choose or type a security question"); return; }
  if(!answer){ showToast("Enter an answer to your security question"); return; }
  const code = genRecoveryCode();
  const [answerHash, codeHash] = await Promise.all([
    hashSecret(normalizeAnswer(answer)),
    hashSecret(normalizeCode(code))
  ]);
  p.securityQuestion = question;
  p.securityAnswerHash = answerHash;
  p.recoveryCodeHash = codeHash;
  p.updatedAt = Date.now();
  saveProfiles();
  recoveryUi.step = "code";
  recoveryUi.generatedCode = code;
  render();
}
function finishRecoveryInfo(){
  const name = (profiles.find(x=>x.id===recoveryUi.profileId)||{}).name || "";
  recoveryUi = { open:false, profileId:"", step:"form", question:"", customQuestion:"", answer:"", generatedCode:"" };
  showToast(`✓ Recovery info updated for ${name}`);
  render();
}
function renderRecoveryModal(){
  const root = document.getElementById("recoveryModalRoot");

  if(!recoveryUi.open){ root.innerHTML=""; return; }
  let body = "";

        <option value="custom" ${questionIsCustom?"selected":""}>Write my own question…</option>
      </select>
      ${questionIsCustom?`<input ${NOAC} value="${esc(recoveryUi.customQuestion)}" oninput="onRecoveryCustomQuestion(this.value)" placeholder="Type your own question" class="mb2">`:""}
      <label class="field-label" style="text-align:left;">Answer</label>
      <input ${NOAC} value="${esc(recoveryUi.answer)}" oninput="onRecoveryAnswer(this.value)" placeholder="Answer only they'd know" class="mb2">
      <button class="btn btn-primary" style="width:100%;" onclick="submitRecoveryInfo()">Save &amp; generate new recovery code</button>
    `;
  }
  root.innerHTML = `
    <div class="modal-overlay" onclick="if(event.target===this) closeRecoveryModal()">
      <div class="modal">
        <div class="modal-head">
          <strong>Recovery info</strong>
          <button class="modal-x" onclick="closeRecoveryModal()">✕</button>
        </div>
        <div style="padding:14px 16px;">${body}</div>
      </div>
    </div>`;
}

function openExistingNote(id){

}
function onNoteTitle(v){ notesUi.draftTitle=v; }
function onNoteBody(v){ notesUi.draftBody=v; }

function saveDraftNote(){
  if(!notesUi.draftTitle.trim() && !notesUi.draftBody.trim()){ notesUi.openId=null; render(); return; }
  const title = notesUi.draftTitle.trim() || "Untitled note";
  if(notesUi.openId==="new"){
    notes.unshift({ id:uid(), title, body:notesUi.draftBody, updatedAt:Date.now() });
    logActivity("note_add", title);
  } else {
    const n = notes.find(x=>x.id===notesUi.openId);
    if(n){ n.title=title; n.body=notesUi.draftBody; n.updatedAt=Date.now(); }

  else { const n=notes.find(x=>x.id===id); title=n.title; body=n.body; }

let _notesRenderToken = 0;
function buildNoteCard(n){
  return `
      <div class="card">
        <button onclick="openExistingNote('${n.id}')" style="width:100%;text-align:left;background:none;border:none;padding:0;cursor:pointer;">

        </button>

          <button class="btn btn-outline" style="padding:6px 12px;" onclick="deleteNote('${n.id}')">🗑</button>
        </div>
      </div>`;
}
// Fills #notesEmptyMsg + #notesList from the current notesUi.searchQuery, without ever
// touching #notesSearchInput itself. Called once by renderNotes() on a full render, and
// directly by onNotesSearch() on every keystroke — since it never rebuilds the input node,
// it's safe to call on every keystroke with no debounce, at any typing speed.
function renderNotesListBody(){
  const myToken = ++_notesRenderToken;
  const sorted = notes
    .filter(n=>{
      if(n.deleted) return false;
      const q = notesUi.searchQuery.trim().toLowerCase();
      if(!q) return true;
      return n.title.toLowerCase().includes(q) || n.body.toLowerCase().includes(q);
    })
    .sort((a,b)=>b.updatedAt-a.updatedAt);

  const emptyEl = document.getElementById("notesEmptyMsg");
  if(emptyEl) emptyEl.innerHTML = sorted.length===0?`<p class="small faint" style="text-align:center;padding:24px 0;">${notesUi.searchQuery.trim()?`No notes match "${esc(notesUi.searchQuery)}".`:"No notes yet — jot down reminders, supplier calls, or things to order."}</p>`:"";

  // Same instant-first-batch, background-chunk-the-rest approach as Inventory/Warnings —
  // future-proofing against notes piling up over years the same way bills and medicines can.
  const FIRST_BATCH = 15, CHUNK_SIZE = 30;
  const listEl = document.getElementById("notesList");
  if(listEl) listEl.innerHTML = sorted.slice(0, FIRST_BATCH).map(buildNoteCard).join("");
  if(sorted.length > FIRST_BATCH){
    let idx = FIRST_BATCH;
    const appendNextChunk = ()=>{
      if(myToken !== _notesRenderToken) return;
      const el = document.getElementById("notesList");
      if(!el) return;
      const chunk = sorted.slice(idx, idx+CHUNK_SIZE);
      el.insertAdjacentHTML("beforeend", chunk.map(buildNoteCard).join(""));
      idx += CHUNK_SIZE;
      if(idx < sorted.length) requestAnimationFrame(appendNextChunk);
    };
    requestAnimationFrame(appendNextChunk);
  }
}
function renderNotes(){
  // Invalidates any still-in-flight background chunk job from a previous list-view render
  // before doing anything else — including here in the "opened a note" branch below, which
  // has no list of its own to hand a fresh token to.
  ++_notesRenderToken;
  const meLabel = `
    <div class="card" style="padding:10px 14px;">
      <p class="small faint" style="margin:0;">Notepad for <strong style="color:var(--text);">${esc(profiles.find(p=>p.id===currentProfileId)?.name||"you")}</strong> — private to you, not visible to other logged-in users on this device.</p>
    </div>`;

        <button class="btn btn-primary flex1" onclick="saveDraftNote()">Save note</button>
        ${!isNew?`<button class="btn btn-success" onclick="shareNote('${notesUi.openId}')">📤 Share</button>`:""}
      </div>
      ${!isNew?`<button class="btn" style="width:100%;background:none;color:var(--danger);margin-top:8px;" onclick="deleteNote('${notesUi.openId}')">🗑 Delete note</button>`:""}
    `;
    return;
  }

  document.getElementById("main").innerHTML = meLabel + `
    <button class="btn-dashed mb2" onclick="openNewNote()">+ New note</button>
    <div class="search-wrap mb2">
      <span class="search-icon">🔍</span>
      <input ${NOAC} id="notesSearchInput" value="${esc(notesUi.searchQuery)}" oninput="onNotesSearch(this.value)" placeholder="Search notes by topic or text…">

    <div id="notesList"></div>
    <p class="small faint" style="text-align:center;">Only ${esc(profiles.find(p=>p.id===currentProfileId)?.name||"you")} can see these notes. Medicines, bills, and records are shared with everyone on this device.</p>
  `;
  renderNotesListBody();

/* ===================== BACKUP & RESTORE ===================== */
/* Everything in this app already lives in the phone's storage (localStorage), which
   survives closing the app/browser and restarting the phone. The real risk is someone
   clearing browser/site data, or reinstalling the browser — that does wipe it. Export
   makes a real file in your phone's Downloads/Files app, completely outside the
   browser, so you always have a copy to restore from no matter what happens to it. */
function mergeById(localArr, incomingArr){
  const map = new Map();
  (localArr||[]).forEach(x=>map.set(x.id,x));
  (incomingArr||[]).forEach(x=>{ if(!map.has(x.id)) map.set(x.id,x); });
  return Array.from(map.values());
}
function mergeInventory(localInv, incomingInv){
  const result = (localInv||[]).map(m=>({...m, batches:(m.batches||[]).slice()}));
  (incomingInv||[]).forEach(im=>{
    let match = result.find(m=>m.id===im.id);
    if(!match) match = result.find(m=>m.name.trim().toLowerCase()===im.name.trim().toLowerCase());
    if(match){
      match.batches = mergeById(match.batches, im.batches);
      match.category = match.category || im.category || "";
      match.specialCategory = match.specialCategory || im.specialCategory || "";
      match.formula = match.formula || im.formula || "";
      match.mg = match.mg || im.mg || "";
      match.gtin = match.gtin || im.gtin || "";
      match.deleted = match.deleted || im.deleted;
      recomputeStock(match);
    } else {
      const copy = {...im, batches:(im.batches||[]).slice()};
      recomputeStock(copy);
      result.push(copy);
    }
  });
  return result;
}
/* ---- LIVE-SYNC-ONLY reconciliation ----
   mergeInventory (above) is deliberately additive/never-overwrite: it's built for the offline
   backup file, which combines two phones that may have been apart for weeks, so it must never
   let one side's file silently clobber real edits the other side made. Live cloud sync is a
   different problem — it's the same shared dataset, seconds apart, and a sale/restock/edit on
   one phone MUST overwrite the stale copy on the other. So for the cloud path we reconcile by
   "whoever touched it most recently wins", using the updatedAt timestamps stamped on every
   medicine-level edit and every batch-level stock change. */
function reconcileBatchesForSync(localBatches, remoteBatches){
  const remoteMap = new Map((remoteBatches||[]).map(b=>[b.id,b]));
  const seen = new Set();
  const result = (localBatches||[]).map(lb=>{
    seen.add(lb.id);
    const rb = remoteMap.get(lb.id);
    if(!rb) return lb; // batch only exists locally (e.g. restocked here) — keep it
    const lt = lb.updatedAt||lb.addedAt||0, rt = rb.updatedAt||rb.addedAt||0;
    return rt>lt ? {...rb} : lb; // newer side's version of THIS batch wins
  });
  (remoteBatches||[]).forEach(rb=>{
    if(!seen.has(rb.id)) result.push({...rb}); // batch only exists remotely — add it
  });
  return result;
}
function pickNewerMedicine(a,b){
  // Scalar fields (name/price/etc.) come from whichever side edited most recently.
  // Batches (actual stock) are reconciled independently and separately above, so a restock
  // never gets lost just because the OTHER device happens to "win" on the scalar fields.
  const aT = a.updatedAt||0, bT = b.updatedAt||0;
  const base = aT>=bT ? a : b;
  return {
    id: a.id, name: base.name, category: base.category||"", specialCategory: base.specialCategory||"", formula: base.formula||"", mg: base.mg||"",
    mrpPerBox: base.mrpPerBox, pillsPerBox: base.pillsPerBox, gtin: base.gtin||"",
    lowStockAt: base.lowStockAt, noWarn: !!base.noWarn, sTag: !!base.sTag, deleted: !!base.deleted,
    updatedAt: Math.max(aT,bT),
    batches: reconcileBatchesForSync(a.batches, b.batches)
  };
}
function reconcileInventoryForSync(localInv, remoteInv){
  const remoteMap = new Map((remoteInv||[]).map(m=>[m.id,m]));
  const seen = new Set();
  const result = (localInv||[]).map(lm=>{
    seen.add(lm.id);
    const rm = remoteMap.get(lm.id);
    return rm ? pickNewerMedicine(lm, rm) : lm;
  });
  (remoteInv||[]).forEach(rm=>{
    if(!seen.has(rm.id)) result.push({...rm, batches:(rm.batches||[]).slice()});
  });
  result.forEach(recomputeStock);
  return result;
}
// Last-write-wins merge by id, for the LIVE cloud path only (bills, notes, profiles). Unlike
// mergeById (additive-only — used by the offline backup file, see below), this actually lets a
// newer edit or a soft-delete tombstone on one device overwrite the stale copy on another,
// instead of the always-newer local/remote scan just re-adding whatever the other side still has.
function mergeByIdForSync(localArr, incomingArr){
  const incomingMap = new Map((incomingArr||[]).map(x=>[x.id,x]));
  const seen = new Set();
  const result = (localArr||[]).map(l=>{
    seen.add(l.id);
    const r = incomingMap.get(l.id);
    if(!r) return l;
    const lt = l.updatedAt||l.timestamp||0, rt = r.updatedAt||r.timestamp||0;
    return rt>lt ? r : l;
  });
  (incomingArr||[]).forEach(r=>{ if(!seen.has(r.id)) result.push(r); });
  return result;
}
// Monthly correction totals are a plain {month: {...}} object, not an id-keyed array, so they
// get their own merge: per month key, keep whichever side's correction was saved most recently.
// Simple scalar setting, same last-write-wins shape as everything else here: whichever side
// touched it more recently wins outright — no need for per-field merging like the test
// catalog has, since it's a single number, not a list of independent items.
function mergeDefaultDoctorFee(data){
  const incomingTs = data.defaultDoctorFeeUpdatedAt || 0;
  if(incomingTs > defaultDoctorFeeUpdatedAt){
    defaultDoctorFee = data.defaultDoctorFee || 0;
    defaultDoctorFeeUpdatedAt = incomingTs;
    saveDefaultDoctorFeeStorage();
    saveDefaultDoctorFeeUpdatedAt();
    // bill.fee is copied from defaultDoctorFee only once, at the moment a New Bill screen is
    // created (see newBillState()) — usually before sync has even had a chance to run, since
    // that happens at app startup. So defaultDoctorFee itself merging correctly isn't enough:
    // the already-displayed fee field has no way to react to a value that arrives later and
    // would otherwise keep showing a stale number forever, until the user happened to start a
    // brand new bill or edit the fee by hand. Refresh it now — but ONLY when the current bill
    // is still completely untouched (no patient, no items/tests/extras, not mid-edit), so a
    // bill the user has actually started is never silently changed under them.
    if(typeof bill!=="undefined" && bill && !bill.patient.trim() && bill.items.length===0 && bill.extras.length===0 && bill.tests.length===0 && !bill.feeEditing){
      bill.fee = defaultDoctorFee ? String(defaultDoctorFee) : "";
    }
  }
}
// Both category lists travel together as one unit: whichever device edited them most recently
// wins outright. (Whole-list rather than per-item merging is what lets a DELETE propagate —
// a union merge would just bring a deleted category back from the other device.)
function mergeCategories(data){
  const incomingTs = data.categoriesUpdatedAt || 0;
  if(incomingTs > categoriesUpdatedAt && Array.isArray(data.medCategories) && Array.isArray(data.specialCategories)){
    MED_CATEGORIES = data.medCategories.slice();
    SPECIAL_CATEGORIES = data.specialCategories.slice();
    categoriesUpdatedAt = incomingTs;
    saveMedCategoriesStorage();
    saveSpecialCategoriesStorage();
    try{ localStorage.setItem("clinic_categories_updated_at", String(categoriesUpdatedAt)); }catch(e){}
  }
}
// The admin-request/answer handshake for per-user history: tiny, so merged per-id, last-write-
// wins, exactly like mergeMonthAdjustments — never the bulk activityLog, only this metadata.
function mergeHistorySync(data){
  const mergedReq = {...historyRequests};
  Object.entries(data.historyRequests||{}).forEach(([id,r])=>{
    const cur = mergedReq[id];
    if(!cur || (r.requestedAt||0) > (cur.requestedAt||0)) mergedReq[id] = r;
  });
  historyRequests = mergedReq;

  const mergedResp = {...historyResponses};
  Object.entries(data.historyResponses||{}).forEach(([id,r])=>{
    const cur = mergedResp[id];
    if(!cur || (r.respondedAt||0) > (cur.respondedAt||0)) mergedResp[id] = r;
  });
  historyResponses = mergedResp;

  saveHistoryRequests(); saveHistoryResponses();
}
function mergeDefaultDoctorName(data){
  const incomingTs = data.defaultDoctorNameUpdatedAt || 0;
  if(incomingTs > defaultDoctorNameUpdatedAt){
    const oldDefault = defaultDoctorName;
    defaultDoctorName = data.defaultDoctorName || "";
    defaultDoctorNameUpdatedAt = incomingTs;
    saveDefaultDoctorNameStorage();
    saveDefaultDoctorNameUpdatedAt();
    // Same reasoning as mergeDefaultDoctorFee, but comparing against the OLD default rather than
    // requiring an exact "" — a bill created before this sync arrived is already pre-filled with
    // whatever the default WAS at that moment, not blank, so requiring "" here meant a bill
    // already open when a newer default name arrived from another device just kept showing the
    // stale name until a brand new bill was started. Comparing against oldDefault instead means
    // "still exactly what the (old) default put there, never touched by the user" refreshes too.
    if(typeof bill!=="undefined" && bill && !bill.patient.trim() && bill.items.length===0 && bill.extras.length===0 && bill.tests.length===0 && bill.remarks===oldDefault){
      bill.remarks = defaultDoctorName || "";
    }
  }
}
function mergeMonthAdjustments(localAdj, incomingAdj){
  const result = {...(localAdj||{})};
  Object.entries(incomingAdj||{}).forEach(([mk,ia])=>{
    const la = result[mk];
    if(!la || (ia.updatedAt||0) > (la.updatedAt||0)) result[mk] = ia;
  });
  return result;
}
// Test catalog & pricing (custom tests, renamed/hidden built-ins, and prices) is synced, one
// test at a time, by that test's own testItemUpdatedAt entry — NOT as one all-or-nothing
// bundle. The old version compared a single shared timestamp for the whole catalog, so if
// Phone A added "Uric Acid" (bumping the shared time) while Phone B had, at any point, made
// its OWN unrelated test edit with a later timestamp, B's next sync would completely
// overwrite the catalog with its own version — silently discarding Uric Acid and anything
// else A had added or priced, and vice-versa. Comparing per test id instead means each
// test's own history decides its own outcome, so two devices' different additions/prices
// combine instead of one wiping out the other.
function mergeTestSettings(data){
  const incomingItemTs = data.testItemUpdatedAt || {};
  // Old backup files / not-yet-updated devices have no per-id times at all — for those,
  // fall back to their whole-bundle time as a stand-in per-id time for every id they have
  // data for, so merging against them still behaves sensibly.
  const incomingBundleTs = data.testSettingsUpdatedAt || 0;
  const incomingCustomById = {}; (data.customTests||[]).forEach(t=>{ incomingCustomById[t.id]=t; });
  const localCustomById = {}; customTests.forEach(t=>{ localCustomById[t.id]=t; });
  const incomingNameOverrides = data.testNameOverrides || {};
  const incomingHiddenSet = new Set(data.hiddenBuiltInTestIds || []);
  const localHiddenSet = new Set(hiddenBuiltInTestIds);
  const incomingPrices = data.testPrices || {};

  const ids = new Set([
    ...TEST_CATALOG.map(t=>t.id),
    ...customTests.map(t=>t.id),
    ...(data.customTests||[]).map(t=>t.id)
  ]);

  const mergedCustomById = {};
  const mergedNameOverrides = {};
  const mergedHidden = [];
  const mergedPrices = {};
  const mergedItemTs = {...testItemUpdatedAt};

  ids.forEach(id=>{
    const localTs = testItemUpdatedAt[id] || 0;
    const hasIncomingData = incomingCustomById[id]!=null || incomingNameOverrides[id]!=null || incomingHiddenSet.has(id) || incomingPrices[id]!=null;
    const inTs = incomingItemTs[id] || (hasIncomingData ? incomingBundleTs : 0);
    const incomingWins = inTs > localTs;
    mergedItemTs[id] = incomingWins ? inTs : localTs;

    const winningCustom = incomingWins ? incomingCustomById[id] : localCustomById[id];
    if(winningCustom) mergedCustomById[id] = winningCustom;

    const winningOverride = incomingWins ? incomingNameOverrides[id] : testNameOverrides[id];
    if(winningOverride!=null) mergedNameOverrides[id] = winningOverride;

    const winningHidden = incomingWins ? incomingHiddenSet.has(id) : localHiddenSet.has(id);
    if(winningHidden) mergedHidden.push(id);

    const winningPrice = incomingWins ? incomingPrices[id] : testPrices[id];
    if(winningPrice!=null) mergedPrices[id] = winningPrice;
  });

  customTests = Object.values(mergedCustomById);
  testNameOverrides = mergedNameOverrides;
  hiddenBuiltInTestIds = mergedHidden;
  testPrices = mergedPrices;
  testItemUpdatedAt = mergedItemTs;
  testSettingsUpdatedAt = Math.max(testSettingsUpdatedAt, incomingBundleTs); // legacy marker only

  saveCustomTests(); saveTestNameOverrides(); saveHiddenBuiltInTests(); saveTestPrices(); saveTestSettingsUpdatedAt(); saveTestItemUpdatedAt();
}

function mergeDataInto(data, inventoryMergeFn, live){
  inventory = inventoryMergeFn(inventory, data.inventory);

  if(live){

function formatBytes(n){

// EVERY render — including every single keystroke. Recomputing that on every keystroke is
// wasted work for a number that only needs to be "close enough" (it's already labelled an
// estimate, not a live reading). Cache it for a second so typing stays snappy; the badge is
// still fresh within ~1s of any real change.
let _cloudSizeCache = { bytes: null, at: 0 };
function estimatedCloudDataSize(){
  const now = Date.now();
  if(now - _cloudSizeCache.at < 1000) return _cloudSizeCache.bytes;
  // This mirrors buildFullStatePayload() — the exact object pushed to Firestore — so
  // measuring its JSON size gives a close real-world estimate of what's stored in the cloud,
  // even though Firestore itself doesn't expose a "how big is my data" API to client apps.
  try{
    const payload = buildCloudPayload();
    const bytes = new Blob([JSON.stringify(payload)]).size;
    _cloudSizeCache = { bytes, at: now };
    return bytes;
  }catch(e){ _cloudSizeCache = { bytes: null, at: now }; return null; }
}

function aiParseLine(line){

  else if((m=s.match(/(?:\bfor\s+)?(\d+)\s*(?:weeks?|wks?)\b/))){ days=+m[1]*7; s=s.replace(m[0]," "); }
  else if((m=s.match(/(?:\bfor\s+)?(\d+)\s*months?\b/))){ days=+m[1]*30; s=s.replace(m[0]," "); }

  }

const aiNz = x=>String(x||"").toLowerCase().replace(/[^a-z0-9]/g,"");

function aiResizeImage(file, maxSide){
  return new Promise((resolve,reject)=>{
    const img=new Image(), u=URL.createObjectURL(file);
    img.onload=()=>{
      URL.revokeObjectURL(u);
      const k=Math.min(1, maxSide/Math.max(img.width,img.height)), c=document.createElement("canvas");
      c.width=Math.round(img.width*k); c.height=Math.round(img.height*k);
      c.getContext("2d").drawImage(img,0,0,c.width,c.height);
      resolve(c.toDataURL("image/jpeg",0.85).split(",")[1]);
    };
    img.onerror=()=>{ URL.revokeObjectURL(u); reject(new Error("Couldn't read that photo")); };
    img.src=u;
  });
}

const AI_QUEUE_KEY="clinic_ai_queue", AI_READY_KEY="clinic_ai_ready";

async function aiReadImage(image, customPrompt){
  const imgs=Array.isArray(image)?image:[image];
  // Google retires Gemini models often (gemini-2.5-flash now answers 404), so try a short list of
  // current Flash models in turn and remember the one that works. A model typed in the setup box goes first.
  const remembered=(localStorage.getItem("clinic_gemini_ok_model")||"").trim();
  const custom=(localStorage.getItem(AI_MODEL_KEY)||"").trim();
  const candidates=[custom,remembered,AI_DEFAULT_MODEL,"gemini-flash-latest","gemini-3-flash-preview","gemini-3.1-flash-lite-preview"]
    .filter((m,i,arr)=>m && arr.indexOf(m)===i);
  const prompt=customPrompt||"You are reading a handwritten medical prescription photo (it may mix English and Urdu). Output plain text only, in this exact layout:\nPATIENT: <patient name if written, else leave this line out>\nDAYS: <total number of days if a duration is written anywhere on the page, usually in the left margin and often circled; a digit next to دن means that many days (e.g. 7دن = 7); weeks: ایک ہفتہ=7, دو ہفتے=14; only use 30 if a month is clearly written; leave this line out if unsure>\nDAYS_TEXT: <copy exactly what the duration note looks like, e.g. 7دن>\nthen ONE line per medicine: the name exactly as written, strength if written, then the dose pattern as digits like 1-0-1 (morning-noon-night). Convert Urdu/Arabic digits ۰۱۲۳۴۵۶۷۸۹ to 0-9, and write patterns written with + , or . as 1-0-1. If a medicine has its own number of days, add it as 5 days after the pattern. Do not include timing words (before/after meals), headings, doctor details or commentary. If a word is unclear, give your best guess."+aiPromptExtras();
  const statuses=[];
  const wait=ms=>new Promise(r=>setTimeout(r,ms));
  let tries=0;
  for(const model of candidates){
    for(let attempt=0; attempt<2; attempt++){
      if(++tries>6) break;
      const ctl=new AbortController(), timer=setTimeout(()=>ctl.abort(),45000);
      let res=null;
      try{
        res=await fetch("https://generativelanguage.googleapis.com/v1beta/models/"+encodeURIComponent(model)+":generateContent?key="+encodeURIComponent(aiGeminiKey()),
          {method:"POST",headers:{"Content-Type":"application/json"},signal:ctl.signal,
           body:JSON.stringify({contents:[{parts:[{text:prompt}].concat(imgs.map(d=>({inline_data:{mime_type:"image/jpeg",data:d}})))}]})});
      }catch(e){
        if(e && e.name==="AbortError"){ statuses.push("slow"); continue; }   // too slow: try again / next model
        throw e;                                                             // real network failure -> photo gets queued
      } finally{ clearTimeout(timer); }
      if(res.ok){
        const data=await res.json();
        const parts=(data&&data.candidates&&data.candidates[0]&&data.candidates[0].content&&data.candidates[0].content.parts)||[];
        const text=parts.map(x=>x.text||"").join("\n").trim();
        if(!text) throw new Error("Nothing readable came back — try a clearer, closer photo");
        try{ localStorage.setItem("clinic_gemini_ok_model",model); }catch(e){}
        return text;
      }
      statuses.push(res.status);
      if([500,502,503,504].includes(res.status)){ await wait(1500*(attempt+1)); continue; } // Google busy: retry, then next model
      if(![400,403,404,429].includes(res.status)) throw new Error("The reader answered with an error ("+res.status+")");
      break; // this model isn't usable for the key — next model
    }
  }
  if(statuses.some(x=>[500,502,503,504].includes(x)||x==="slow")) throw new Error("Google's reader is busy or slow right now — wait a minute and try again (the app already retried)");
  if(statuses.includes(429)) throw new Error("Free limit reached for now — try again a little later");
  if(statuses.every(x=>x===400)) throw new Error("Google didn't accept the key — check “Handwriting setup”");
  throw new Error("None of the Gemini models I tried is available to your free key right now ("+statuses.join(", ")+")");
}

/* ===================== STORAGE & HEALTH (read-only) =====================
   Measures how full the cloud document and the phone's storage are, how fast saving is on this phone,
   and checks the data for inconsistencies. It only READS — nothing is changed or deleted by it. */
const CLOUD_DOC_LIMIT = 1048576; // Firestore's hard limit per document (1 MiB)
function _hBytes(v){ try{ const t=JSON.stringify(v); return (typeof TextEncoder!=="undefined") ? new TextEncoder().encode(t).length : t.length; }catch(e){ return 0; } }
function _hKB(b){ return (b/1024).toLocaleString("en-US",{minimumFractionDigits:1,maximumFractionDigits:1})+" KB"; }
function _hTime(fn){ const t0=performance.now(); try{ fn(); }catch(e){} return Math.max(0.1, performance.now()-t0).toFixed(1)+" ms"; }
function cloudPayloadStats(){
  const payload = sanitizeForFirestore(buildCloudPayload());
  const trimmedCount = trimInventoryForCloud.lastRemoved||0;
  const fullBytes = _hBytes(sanitizeForFirestore(buildFullStatePayload()));
  const total = _hBytes(payload), parts = [];
  Object.keys(payload).forEach(k=>parts.push([k,_hBytes(payload[k])]));
  parts.sort((a,b)=>b[1]-a[1]);
  const nTx = (transactions||[]).length, txBytes = _hBytes(transactions);
  const since = Date.now()-30*86400000, recent = (transactions||[]).filter(t=>(t.timestamp||0)>=since).length;
  const perDay = recent/30, perBill = nTx ? txBytes/nTx : 0;
  const room = Math.max(0, CLOUD_DOC_LIMIT-total);
  const daysLeft = (perDay>0 && perBill>0) ? Math.floor(room/(perDay*perBill)) : null;
  return { total, saved: Math.max(0, fullBytes-total), trimmedCount, pct: total/CLOUD_DOC_LIMIT*100, parts, nTx, perDay, perBill, daysLeft };
}
function dataIntegrityIssues(){
  const out = [], meds = (inventory||[]).filter(m=>!m.deleted);
  const gt = {};
  meds.forEach(m=>{
    const label = m.name+(m.mg?" "+m.mg:"");
    const sum = (m.batches||[]).filter(b=>!b.disposed && b.pillsRemaining>0).reduce((s,b)=>s+b.pillsRemaining,0);
    if(Number(m.stockPills)!==sum) out.push(`Stock mismatch — ${label}: shows ${m.stockPills}, batches add up to ${sum}`);
    if(!(Number(m.stockPills)>=0)) out.push(`Invalid stock — ${label}: ${m.stockPills}`);
    if(!(Number(m.mrpPerBox)>0)) out.push(`No valid price — ${label}`);
    if(!(Number(m.pillsPerBox)>0)) out.push(`No valid medicine-per-box — ${label}`);
    (m.batches||[]).forEach(b=>{ if(!b.disposed && b.pillsRemaining<0) out.push(`Negative batch quantity — ${label}`); });
    if(m.gtin){ (gt[m.gtin]=gt[m.gtin]||[]).push(label); }
  });
  Object.keys(gt).forEach(g=>{ if(gt[g].length>1) out.push(`Same barcode on ${gt[g].length} medicines: ${gt[g].join(" / ")}`); });
  const seen = {};
  meds.forEach(m=>{
    const k=[m.name,m.category||m.specialCategory,m.formula,m.mg,m.mrpPerBox,m.pillsPerBox].map(x=>String(x==null?"":x).trim().toLowerCase()).join("|");
    (seen[k]=seen[k]||[]).push(m);
  });
  Object.keys(seen).forEach(k=>{ if(seen[k].length>1) out.push(`Exact duplicate medicine: ${seen[k][0].name} (${seen[k].length} copies)`); });
  const now=Date.now();
  let badTx=0, future=0;
  (transactions||[]).forEach(t=>{ if(!t || !(t.timestamp>0) || !isFinite(Number(t.grandTotal))) badTx++; else if(t.timestamp>now+86400000) future++; });
  if(badTx) out.push(`${badTx} bill(s) with a missing date or total`);
  if(future) out.push(`${future} bill(s) dated in the future (check the phone's clock)`);
  return out;
}

// Camera capture inside the page (same getUserMedia route as the barcode scanner). The app's
// WebView doesn't open the phone's file chooser, so <input type="file"> buttons did nothing.
async function takePhoto(cb, max){
  max = max||1;
  let stream;
  showToast("📷 Opening camera…"); // if you never see this, the old index.html is still live on GitHub
  try{
    if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) throw Object.assign(new Error("This app's web view has no camera support"),{name:"NoCameraApi"});
    stream = await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:"environment"},width:{ideal:1920},height:{ideal:1080}}});
  }catch(e){
    if(window.AppInventor && typeof window.AppInventor.setWebViewString==="function") window.AppInventor.setWebViewString("REQUEST_CAMERA_PERMISSION");
    showToast("📷 Camera error ("+(e&&e.name?e.name:"unknown")+") — allow the camera, then tap again"); return;
  }
  const multi = max>1, shots=[];
  const ov=document.createElement("div");
  ov.style.cssText="position:fixed;inset:0;z-index:99999;background:#000;display:flex;flex-direction:column;";
  ov.innerHTML='<video id="tpVideo" autoplay playsinline muted style="flex:1;min-height:0;width:100%;object-fit:contain;"></video>'
    +(multi?'<div id="tpThumbs" style="display:flex;gap:8px;align-items:center;padding:8px 14px;background:#111;min-height:60px;color:#9ca3af;font-size:12px;">Take up to '+max+' photos — e.g. front, back, price side</div>':'')
    +'<div style="display:flex;gap:10px;padding:14px;background:#111;"><button id="tpCancel" style="flex:1;padding:14px;border:none;border-radius:10px;background:#333;color:#fff;font-size:15px;">Cancel</button>'
    +'<button id="tpShot" style="flex:2;padding:14px;border:none;border-radius:10px;background:var(--primary);color:#fff;font-size:15px;font-weight:700;">📸 Capture'+(multi?' (0/'+max+')':'')+'</button>'
    +(multi?'<button id="tpDone" disabled style="flex:1.2;padding:14px;border:none;border-radius:10px;background:#16a34a;color:#fff;font-size:15px;font-weight:700;opacity:.4;">✓ Done</button>':'')+'</div>';
  document.body.appendChild(ov);
  const v=ov.querySelector("#tpVideo"); v.srcObject=stream; v.play().catch(()=>{}); setTimeout(()=>v.play().catch(()=>{}),300);
  const close=()=>{ stream.getTracks().forEach(t=>t.stop()); ov.remove(); };
  const pending=[]; let taken=0, finishing=false;
  const finish=async ()=>{
    if(finishing) return; finishing=true;
    const d=ov.querySelector("#tpDone"); if(d){ d.disabled=true; d.textContent="Saving…"; }
    await Promise.all(pending);
    close(); cb(shots);
  };
  ov.querySelector("#tpCancel").onclick=()=>{ finishing=true; close(); };
  if(multi) ov.querySelector("#tpDone").onclick=()=>{ if(taken) finish(); };
  ov.querySelector("#tpShot").onclick=()=>{
    if(finishing) return;
    if(!v.videoWidth){ showToast("Camera not ready yet — wait a second"); return; }
    const c=document.createElement("canvas"); c.width=v.videoWidth; c.height=v.videoHeight;
    c.getContext("2d").drawImage(v,0,0);
    if(!multi){
      finishing=true;
      c.toBlob(b=>{ close(); if(b) cb(new File([b],"photo.jpg",{type:"image/jpeg"})); },"image/jpeg",0.9);
      return;
    }
    taken++;
    // thumbnail + counter appear instantly (tiny canvas); the big JPEG is encoded in the background
    const tc=document.createElement("canvas"); tc.width=88; tc.height=Math.max(1,Math.round(88*c.height/c.width));
    tc.getContext("2d").drawImage(v,0,0,tc.width,tc.height);
    const th=ov.querySelector("#tpThumbs"); if(taken===1) th.innerHTML="";
    th.insertAdjacentHTML("beforeend",'<img src="'+tc.toDataURL("image/jpeg",0.6)+'" style="height:44px;width:auto;border-radius:8px;border:2px solid var(--primary);">');
    ov.querySelector("#tpShot").textContent="📸 Capture ("+taken+"/"+max+")";
    const d=ov.querySelector("#tpDone"); d.disabled=false; d.style.opacity="1";
    pending.push(new Promise(res=>c.toBlob(b=>{ if(b) shots.push(new File([b],"photo.jpg",{type:"image/jpeg"})); res(); },"image/jpeg",0.85)));
    if(taken>=max) finish();
  };
}
async function aiHandleFile(file){
  if(!file) return;
  aiUi.busy=true; aiUi.error=""; aiUi.busyMsg = (aiUi.mode==="print"||aiUi.mode==="box") ? "Reading printed text…" : ""; renderOverlays();
  try{
    let text;
    if(aiUi.mode==="print"||aiUi.mode==="box"){
      const r=await aiOcrRotated(file);
      let lines=String((r&&r.data&&r.data.text)||"").split("\n").map(l=>l.trim()).filter(l=>l.length>2);
      // Medicine boxes also carry batch/date/price/barcode lines — those are never part of the name.
      if(aiUi.mode==="box") lines=lines.filter(l=>!/gtin|mfg|mfd|exp|b\.?\s*no|sr\.?\s*no|m\.?\s*r\.?\s*p|batch|\brs\b|licen|\bmrp\b|\d{9,}/i.test(l)).slice(0,6);
      text=lines.join("\n");
      if(!text) throw new Error("No printed text found — try a clearer, closer photo");
    } else {
      const image=await aiResizeImage(file,1600);
      if(!navigator.onLine){ aiQueuePhoto(image); aiUi.busy=false; renderOverlays(); return; }
      try{ text=await aiReadImage(image); }
      catch(e){ if(e instanceof TypeError){ aiQueuePhoto(image); aiUi.busy=false; renderOverlays(); return; } throw e; }
    }
    aiUi.text=text; aiUi.busy=false;
    aiUi.rows=aiParseText(text); if(!aiUi.rows.length) aiUi.rows=null;
    // A scanned box carries no dose or days: default to 1 unit — the person can change it in the preview.
    if(aiUi.mode==="box" && aiUi.rows) aiUi.rows.forEach(r=>{ if(!aiRowPills(r)) r.qty=1; });
    renderOverlays();
  }catch(e){
    aiUi.busy=false;
    aiUi.error=(e&&e.name==="AbortError") ? "That took too long — check your internet and try again." : ("⚠ "+(e&&e.message?e.message:"Couldn't read the photo"));
    renderOverlays();
  }
}

/* ===================== DIAGNOSTICS (Admin only) ===================== */
// One master switch (Settings > Diagnostics). OFF = nothing is recorded and nothing runs in the
// background. ON = errors, sync events, network calls (no keys/addresses with secrets), slow screens
// and app-bridge commands are kept in a log, and the panel can run live health checks.
const DIAG_KEY="clinic_diag_on", DIAG_LOG_KEY="clinic_diag_log";
let diagUi={open:false,snap:null,checks:null,busy:false};
let diagLogBuf=[], diagLastRender=0;
const diagOn=()=>localStorage.getItem(DIAG_KEY)==="1";
function diagLog(type,msg){
  if(!diagOn()) return;
  diagLogBuf.push({t:Date.now(),type,msg:String(msg).slice(0,300)});
  if(diagLogBuf.length>150) diagLogBuf.shift();
  clearTimeout(diagLog._t);
  diagLog._t=setTimeout(()=>{ try{ localStorage.setItem(DIAG_LOG_KEY,JSON.stringify(diagLogBuf.slice(-100))); }catch(e){} },1500);
}
(function(){
  try{ const v=JSON.parse(localStorage.getItem(DIAG_LOG_KEY)||"[]"); diagLogBuf=Array.isArray(v)?v:[]; }catch(e){}
  window.addEventListener("error",e=>diagLog("error",(e.message||"error")+" @"+String(e.filename||"").split("/").pop()+":"+e.lineno));
  window.addEventListener("unhandledrejection",e=>diagLog("error","promise: "+((e.reason&&e.reason.message)||e.reason)));
  window.addEventListener("online",()=>diagLog("net","back online"));
  window.addEventListener("offline",()=>diagLog("net","went offline"));
  const _render=window.render;
  if(typeof _render==="function") window.render=function(){ const t0=performance.now(); const r=_render.apply(this,arguments); const dt=performance.now()-t0; diagLastRender=Math.round(dt); if(dt>200) diagLog("slow","render() took "+Math.round(dt)+" ms on "+tab); return r; };
  const _fetch=window.fetch.bind(window);
  window.fetch=function(u,o){
    if(!diagOn()) return _fetch(u,o);
    const t0=performance.now(), name=String((u&&u.url)||u).replace(/[?#].*$/,"").replace(/^https?:\/\//,"").slice(0,60); // query (keys) is never logged
    return _fetch(u,o).then(r=>{ diagLog(r.ok?"net":"error","fetch "+name+" -> "+r.status+" ("+Math.round(performance.now()-t0)+" ms)"); return r; },
                            e=>{ diagLog("error","fetch "+name+" failed: "+(e&&e.message)); throw e; });
  };
})();

async function diagSnapshot(){

  s["Data"]=inventory.filter(m=>!m.deleted).length+" medicines · "+transactions.filter(t=>!t.deleted).length+" bills · "+profiles.filter(p=>!p.deleted).length+" users";

  s["Last screen draw"]=diagLastRender+" ms";

async function diagRunChecks(){
  const out=[], add=(n,ok,d)=>out.push({n,ok,d:d||""});

  try{ await fetch("https://www.gstatic.com/generate_204",{mode:"no-cors",cache:"no-store"}); add("Internet",true,Math.round(performance.now()-t)+" ms"); }catch(e){ add("Internet",false,"not reachable"); }
  if(fbDb){ t=performance.now(); try{ await withTimeout(cloudDocRef().get({source:"server"}),8000); add("Cloud database",true,Math.round(performance.now()-t)+" ms"); }catch(e){ add("Cloud database",false,formatSyncError(e)); } }
  else add("Cloud database",false,"Firebase not started");
  try{ localStorage.setItem("__diag","1"); localStorage.removeItem("__diag"); add("Saving on the phone",true); }catch(e){ add("Saving on the phone",false,e.message); }
  add("Camera",!!(navigator.mediaDevices&&navigator.mediaDevices.getUserMedia),"");
  add("Offline mode",!!(navigator.serviceWorker&&navigator.serviceWorker.controller),"");
  const pct=(estimatedCloudDataSize()||0)/1048576*100; add("Cloud document size",pct<70,pct.toFixed(0)+"% of the 1 MB limit");

function diagReport(){
  const L=[]; L.push("Counter Book diagnostics "+new Date().toLocaleString());

  return L.join("\n");
}

// No JS/CSS orientation workaround here anymore — both were tried (a bare screen.orientation.lock()
// call, a fullscreen+lock combo triggered on first tap, and a CSS rotation-compensation trick) and
// none rendered reliably inside the actual App-Inventor-wrapped WebView this build runs in (the
// rotation trick specifically came out visibly broken/skewed there). A plain web page cannot force
// portrait across every WebView implementation with certainty — the fix that's actually guaranteed
// for this build is native: Screen1 › ScreenOrientation › "Portrait" in the App Inventor project
// itself. That's enforced by Android at the Activity level regardless of the device's own
// auto-rotate toggle, and it requires rebuilding and reinstalling the app to take effect.
// Waits for the localStorage shim's IndexedDB hydration (see <head>) before booting, so loadAll()
// always sees the real saved data. On a normal browser where the shim never installed itself
// (real localStorage worked fine), __localStorageReady still resolves immediately either way.
Promise.resolve(window.__localStorageReady).then(function(){
  applyTheme(getThemeId());
  loadAll();
  bill = newBillState();
  render();
  startCloudSync();
  setTimeout(trySyncNow, 2500); // upload anything left unsynced from a previous session
