function billComputedSpecialPills(){ return Number(bill.specialPills)||0; }
function canAddSpecialBillItem(){ return !!bill.selectedSpecialMedId && billComputedSpecialPills()>0; }
function setApplyingFeeMode(mode){
  bill.applyingFeeMode = mode;
  bill.applyingFeeDraft = "";
  bill.wholeApplyingFee = "";
  recomputeWholeApplyingFee(); // strips any previously-applied whole fee when switching away from "whole"
  render();
}
function onApplyingFeeDraft(v){ bill.applyingFeeDraft=v; scheduleRender(); }
function onWholeApplyingFee(v){ bill.wholeApplyingFee=v; recomputeWholeApplyingFee(); scheduleRender(); }
// The single whole-bill applying fee always lives on whichever special item was added most
// recently — never as its own line. Re-run this after any add/remove of a special item, or
// whenever the whole-bill fee amount itself changes, so it always tracks the current "last"
// special item instead of staying stuck on one that may have since been removed.
function recomputeWholeApplyingFee(){
  const specials = bill.items.filter(it=>it.special);
  specials.forEach(it=>{
    if(it.feeMode==='whole'){
      it.appliedFee = 0;
      it.subtotal = it.baseSubtotal;
      it.note = it.baseNote||"";
      it.feeMode = null;
    }
  });
  if(bill.applyingFeeMode==='whole' && specials.length){
    const fee = Number(bill.wholeApplyingFee)||0;
    const last = specials[specials.length-1];
    last.feeMode = 'whole';
    last.appliedFee = fee;
    last.subtotal = r2(last.baseSubtotal + fee);
    last.note = fee>0 ? `${last.baseNote?last.baseNote+" · ":""}+applying fee ${CURRENCY}${money(fee)}` : (last.baseNote||"");
  }
}
function addSpecialBillItem(){
  const med = inventory.find(m=>m.id===bill.selectedSpecialMedId);
  if(!med || !canAddSpecialBillItem()) return;
  const pills = billComputedSpecialPills();
  const lc = lineCalc(med, pills, billPendingSkip(med.id));
  const pricePerPill = lc.pricePerPill;
  const baseSubtotal = lc.subtotal;
  const item = { medId:med.id, name:med.name, pills, pricePerPill, subtotal:baseSubtotal, note:"", perDay:null, linkedToGlobalDays:false,
    special:true, specialCategory:med.specialCategory||"", baseSubtotal, baseNote:"", appliedFee:0, feeMode:null };
  if(bill.applyingFeeMode==='perItem'){
    const fee = Number(bill.applyingFeeDraft)||0;
    item.feeMode = 'perItem';
    item.appliedFee = fee;
    item.subtotal = r2(baseSubtotal + fee);
    item.note = fee>0 ? `+applying fee ${CURRENCY}${money(fee)}` : "";
  }
  bill.items.push(item);
  bill.selectedSpecialMedId=null; bill.specialQuery=""; bill.specialPills=""; bill.applyingFeeDraft="";
  if(bill.applyingFeeMode==='whole') recomputeWholeApplyingFee();
  render();
}

let toastTimer = null;
// onTap (optional): makes the toast itself tappable — underlined, and left up longer (a plain
// toast reads in under 1.8s; one worth tapping needs more time than that to actually be tapped).
// Tapping it calls onTap and dismisses the toast; it also still auto-hides either way.
function showToast(msg, onTap){
  const el = document.getElementById("toast");
  el.textContent = msg;
  el.classList.remove("hidden");
  el.classList.toggle("tappable", !!onTap);
  el.onclick = onTap ? ()=>{ el.classList.add("hidden"); clearTimeout(toastTimer); onTap(); } : null;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>{ el.classList.add("hidden"); }, onTap ? 5000 : 1800);
}
// Shows exactly what the last scanned barcode/QR code contained, even when nothing in it could

function buildBillText(tx){
  const lines = [`🏥 Patient Bill`, `Patient: ${tx.patientName}`, `Date: ${fmtDateTime(tx.timestamp)}`, `Mode of Payment: ${tx.paymentMode||"Cash"}`];
  if(tx.remarks) lines.push(`Remarks: ${tx.remarks}`);
  lines.push(``);
  if(tx.items.length){
    lines.push(`Medicines:`);
    tx.items.forEach((it,i)=> lines.push(`${i+1}. ${it.name} — ${fmtInt(it.pills)} medicine${it.note?` (${it.note})`:""} — ${CURRENCY}${money(it.subtotal!=null ? it.subtotal : it.pricePerPill*it.pills)}`));
    if(tx.medsDiscount) lines.push(`Medicines discount: -${CURRENCY}${money(tx.medsDiscount)}`);
    lines.push(``);
  }
  if(tx.tests && tx.tests.length){

    if(tx.testsDiscount) lines.push(`Tests discount: -${CURRENCY}${money(tx.testsDiscount)}`);
    lines.push(``);
  }
  if(tx.extras && tx.extras.length){
    lines.push(`Other charges:`);
    tx.extras.forEach((ex,i)=> lines.push(`${i+1}. Other charge — ${CURRENCY}${money(ex.amount)}`));
    lines.push(``);
  }
  lines.push(`Medicine total: ${CURRENCY}${money((tx.medTotal||0)-(tx.medsDiscount||0))}`);
  if(tx.tests && tx.tests.length) lines.push(`Tests total: ${CURRENCY}${money((tx.testsTotal||0)-(tx.testsDiscount||0))}`);
  lines.push(`Doctor fee: ${CURRENCY}${money((tx.doctorFee||0)-(tx.feeDiscount||0))}`);

  lines.push(`--------------------------`);
  lines.push(`Grand total: ${CURRENCY}${money(tx.grandTotal)}`);
  return lines.join("\n");
}

// --- Thermal receipt printing (ESC/POS) -------------------------------------------------
// Almost every cheap thermal receipt printer — Bluetooth, WiFi, or USB alike — understands
// the same ESC/POS command language, so we build ONE byte sequence here and every transport
// (Bluetooth first, others later) just has the job of delivering these exact bytes.
// Bytes are represented as a JS string where each character's code IS the byte value
// (0–255) — this is the simplest way to smuggle raw binary through the WebViewString bridge,
// which only carries text. On the App Inventor side, BluetoothClient1.CharacterEncoding must
// be set to "ISO-8859-1" so each character is sent as exactly one byte, unchanged.
const PRINTER_PAPER_CHARS = 32; // 32 chars/line ≈ 58mm paper. Change to 48 for 80mm paper.

function padLR(left, right, width){
  left = String(left); right = String(right);
  const space = Math.max(1, width - left.length - right.length);
  if(space < 1) return (left + " " + right).slice(0, width);
  return left + " ".repeat(space) + right;
}

function repeatBillFromTx(id){
  const t = transactions.find(x=>x.id===id); if(!t) return;
  const go = ()=>{
    const nb = newBillState(); nb.patient = t.patientName||"";
    let skipped=0, capped=0;
    (t.items||[]).forEach(it=>{
      const med = inventory.find(m=>m.id===it.medId);
      if(!med || med.deleted || it.special){ skipped++; return; }
      const pills = it.pills;
      const lc = lineCalc(med, pills, nb.items.filter(x=>x.medId===med.id).reduce((a,x)=>a+(Number(x.pills)||0),0));
      nb.items.push({ medId:med.id, name:med.name, pills, pricePerPill:lc.pricePerPill, subtotal:lc.subtotal, note:it.note||"", perDay:it.perDay==null?null:it.perDay, linkedToGlobalDays:false });
    });
    bill = nb; toolsUi.open=false;
    if(tab!=="bill") setTab("bill"); else render();
    renderOverlays();
    showToast(skipped||capped ? `Bill copied — ${skipped?skipped+" item(s) skipped (special/removed). ":""}${capped?capped+" quantity adjusted to stock.":""}` : "✓ Previous bill copied — check and complete");
  };
  if(bill.items.length) askConfirm("Replace the bill you're working on with this one?", go, "Replace"); else go();
}

function rpSet(k,v){ toolsUi[k]=v; renderOverlays(); }
function closingData(dateStr){
  const a = new Date(dateStr+"T00:00:00").getTime(), b = a+86400000, list = txBetween(a,b);
  const r = { n:list.length, meds:0, tests:0, extras:0, fee:0, disc:0, total:0, modes:{} };
  list.forEach(t=>{ const p=netParts(t); r.meds+=p.meds; r.tests+=p.tests; r.extras+=p.extras; r.fee+=p.fee; r.disc+=p.disc; r.total+=p.total;
    const m=t.paymentMode||"Cash"; r.modes[m]=r.modes[m]||{n:0,amt:0}; r.modes[m].n++; r.modes[m].amt+=p.total; });
  return r;
}
function closingText(dateStr){
  const r = closingData(dateStr), d = new Date(dateStr+"T00:00:00");
  const L = [`📊 Daily closing — ${d.toLocaleDateString(undefined,{day:"2-digit",month:"short",year:"numeric"})}`, `Bills: ${r.n}`, "",
    `Medicines: ${fmtMoney(r.meds)}`, `Tests: ${fmtMoney(r.tests)}`, `Other charges: ${fmtMoney(r.extras)}`, `Doctor fees: ${fmtMoney(r.fee)}`, `Discounts given: ${fmtMoney(r.disc)}`, "--------------------------"];
  Object.keys(r.modes).forEach(k=> L.push(`${k}: ${fmtMoney(r.modes[k].amt)} (${r.modes[k].n} bill${r.modes[k].n===1?"":"s"})`));
  L.push("--------------------------", `TOTAL: ${fmtMoney(r.total)}`); return L.join("\n");
}
function shareClosing(){ const t=closingText(toolsUi.date||localDateStr()); closeTools(); openShare(t); }
function weekData(){
  const out=[], today=dayStartTs(Date.now());
  for(let i=6;i>=0;i--){ const a=today-i*86400000, b=a+86400000; const list=txBetween(a,b); out.push({ label:new Date(a).toLocaleDateString(undefined,{weekday:"short"}), total:list.reduce((s,t)=>s+(t.grandTotal||0),0), n:list.length }); }
  return out;
}
function weekChartHtml(){
  const d=weekData(), max=Math.max(1,...d.map(x=>x.total)), tot=d.reduce((s,x)=>s+x.total,0);
  const bars=d.map((x,i)=>{ const h=Math.round(x.total/max*110), bx=12+i*47; return `<rect x="${bx}" y="${140-h}" width="32" height="${Math.max(h,2)}" rx="6" fill="var(--primary)" opacity="${x.total?1:.25}"/>
    <text x="${bx+16}" y="${134-h}" text-anchor="middle" font-size="9" fill="var(--muted)">${x.total?commaInt(Math.round(x.total)):""}</text>
    <text x="${bx+16}" y="156" text-anchor="middle" font-size="10" fill="var(--muted)">${x.label}</text>`; }).join("");
  return `<svg viewBox="0 0 340 164" style="width:100%;height:auto;display:block;"><line x1="6" y1="140" x2="334" y2="140" stroke="var(--border)"/>${bars}</svg>
    <div class="row" style="margin-top:10px;"><span class="small">Last 7 days</span><strong>${fmtMoney(tot)}</strong></div><div class="row"><span class="small">Daily average</span><strong>${fmtMoney(tot/7)}</strong></div>`;
}
function topSellersHtml(){

  visibleTransactions().forEach(t=>{ if(t.timestamp<cutoff) return; const its=t.items||[], net=netLineAmounts(its.map(it=>it.subtotal!=null?it.subtotal:(it.pricePerPill||0)*(it.pills||0)), t.medsDiscount); its.forEach((it,i)=>{ const k=it.medId||it.name; const e=map[k]=map[k]||{name:it.name,qty:0,rev:0}; e.qty+=it.pills||0; e.rev+=net[i]; }); });
  const list=Object.values(map).sort((a,b)=>b.qty-a.qty).slice(0,10); if(!list.length) return `<p class="small faint">No sales in the last 30 days.</p>`;

    <div style="height:6px;border-radius:99px;background:var(--primarySoft);margin-top:4px;"><div style="height:100%;width:${Math.round(e.qty/max*100)}%;border-radius:99px;background:var(--primary);"></div></div></div>`).join("");
}
function costPct(){ let v=NaN; try{ v=Number(localStorage.getItem("clinic_cost_pct")); }catch(e){} return isFinite(v)&&v>0&&v<=100 ? v : 80; }
// Two ways to count purchase cost: an average % of the selling price (estimate), or the real TOTAL
// purchase cost you type in for the chosen period (Today / 7 days / 30 days — each remembered).
function costMode(){ try{ return localStorage.getItem("clinic_cost_mode")==="total" ? "total" : "pct"; }catch(e){ return "pct"; } }
function costTotalFor(range){ let v=NaN; try{ v=Number(localStorage.getItem("clinic_cost_total_"+range)); }catch(e){} return isFinite(v)&&v>=0 ? v : 0; }
function profitCalc(){
  const days=Number(toolsUi.range)||7, today=dayStartTs(Date.now()), a=today-(days-1)*86400000, list=txBetween(a, today+86400000);
  const rev=list.reduce((s,t)=>s+netParts(t).meds,0), total=costMode()==="total";
  const cost = total ? costTotalFor(String(days)) : rev*costPct()/100;
  return { n:list.length, rev, cost, profit:rev-cost, total };
}
function profitOutHtml(){ const p=profitCalc(); return `<div class="row"><span class="small">Medicine sales (after discounts)</span><strong>${fmtMoney(p.rev)}</strong></div>
  <div class="row"><span class="small">${p.total?"Purchase cost (your total)":"Estimated purchase cost"}</span><strong>${fmtMoney(p.cost)}</strong></div><div class="row" style="margin-top:6px;"><span style="font-weight:700;">${p.total?"Profit":"Estimated profit"}</span><strong style="color:var(--success);font-size:18px;">${fmtMoney(p.profit)}</strong></div>`; }

let _undoInfo = null, _undoTimer = null;
function captureUndoSnap(){
  const snap = {}; bill.items.forEach(it=>{ const m=inventory.find(x=>x.id===it.medId); if(m && !snap[m.id]) snap[m.id]=JSON.parse(JSON.stringify(m.batches||[])); }); return snap;

function showBillSavedUi(tx, savedBill, snap){
  try{ if(navigator.vibrate) navigator.vibrate(35); }catch(e){}
  const fx=document.createElement("div"); fx.className="cb-fx"; fx.innerHTML='<div><svg viewBox="0 0 24 24" width="52" height="52" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></div>';
  document.body.appendChild(fx); setTimeout(()=>fx.remove(), 1000);

  let bar=document.getElementById("undoBar");
  if(!bar){ bar=document.createElement("div"); bar.id="undoBar"; bar.className="cb-undo"; document.body.appendChild(bar); }
  bar.innerHTML='<span>✓ Bill saved</span><button type="button" onclick="undoLastBill()">Undo</button>';

function undoLastBill(){
  const u=_undoInfo; if(!u) return; hideUndoBar();
  const t=transactions.find(x=>x.id===u.txId); if(!t || t.deleted){ return; }
  Object.keys(u.snap).forEach(id=>{ const m=inventory.find(x=>x.id===id); if(!m) return; m.batches=JSON.parse(JSON.stringify(u.snap[id])); m.batches.forEach(b=>{ b.updatedAt=Date.now(); }); m.updatedAt=Date.now(); recomputeStock(m); });
  t.deleted=true; t.updatedAt=Date.now(); logActivity("bill_del", (t.patientName||"Bill")+" (undone)");
  saveInventory(); saveTransactions();
  bill=u.savedBill; if(tab!=="bill") setTab("bill"); else render();

}

// One list of lines {t:text, a:align, b:bold, z:size} is built here; the printer encoder and the
// on-screen preview both read it, so what you see in the preview is what gets printed.
function buildReceiptLines(tx, D){
  D = D || getReceiptDesign();
  const W = D.paper===48 ? 48 : 32, L=[];
  const shop = (rdUi.open && rdUi.shop) ? rdUi.shop : getReceiptSettings();
  const line = (t,o)=> L.push(Object.assign({t:t,a:"left",b:false,z:"normal"}, o||{}));
  const divider = ()=>{ if(D.divider==="none") line(""); else line(D.divider.repeat(W)); };
  const lr = (l,r,o)=> line(padLR(l,r,W), o);
  const money$ = v=> `${CURRENCY}${money(v)}`;
  const zw = z=> z==="large" ? Math.floor(W/2) : W;   // double-width text fits half as many characters

  if(D.showName && shop.shopName) line(shop.shopName.slice(0,zw(D.nameSize)), {a:D.headAlign, b:true, z:D.nameSize});
  if(D.tagline) line(D.tagline, {a:D.headAlign});
  if(D.showAddress && shop.address) line(shop.address, {a:D.headAlign});
  if(D.showPhone && shop.phone) line(shop.phone, {a:D.headAlign});
  divider();
  const invoiceNo = (tx.id||"").slice(-6).toUpperCase();
  if(D.showInvoice && D.showDate) lr(`Invoice #${invoiceNo}`, fmtDateTime(tx.timestamp));
  else if(D.showInvoice) line(`Invoice #${invoiceNo}`);
  else if(D.showDate) line(fmtDateTime(tx.timestamp));
  if(D.showPatient) line(`Patient: ${tx.patientName}`);
  if(D.showPayment) line(`Mode of Payment: ${tx.paymentMode||"Cash"}`);
  if(D.showRemarks && tx.remarks) line(`Remarks: ${tx.remarks}`);
  divider();

  let totalQty = 0;
  const shown = (tx.items||[]).filter(it=> it.special ? D.showSpecial : D.showMeds);
  (tx.items||[]).forEach(it=>{ totalQty += it.pills; });
  if(shown.length){
    shown.forEach(it=>{
      const nm = `${it.name}${it.note?` (${it.note})`:""}`, amt = money$(it.subtotal!=null ? it.subtotal : it.pricePerPill*it.pills);
      if(D.itemStyle==="one") lr(`${fmtInt(it.pills)} x ${nm}`.slice(0,W-amt.length-1), amt, {b:D.boldItems});
      else{
        line(nm, {b:D.boldItems});
        lr(`  ${it.pills} x ${money$(it.pricePerPill)}`, amt);
      }
    });
    if(D.showDiscounts && tx.medsDiscount) lr("Medicines discount", `-${money$(tx.medsDiscount)}`);
    divider();
  }
  if(D.showTests && tx.tests && tx.tests.length){
    tx.tests.forEach(t=> lr(t.name, money$(t.amount)));
    if(D.showDiscounts && tx.testsDiscount) lr("Tests discount", `-${money$(tx.testsDiscount)}`);
    divider();
  }
  if(D.showExtras && tx.extras && tx.extras.length){
    tx.extras.forEach((ex,i)=> lr(ex.label || `Other charge ${i+1}`, money$(ex.amount)));
    divider();
  }
  if(D.showMedTotal) lr("Medicine total", money$((tx.medTotal||0)-(tx.medsDiscount||0)));
  if(D.showTestsTotal && tx.tests && tx.tests.length) lr("Tests total", money$((tx.testsTotal||0)-(tx.testsDiscount||0)));
  if(D.showFee){
    lr("Doctor fee", money$((tx.doctorFee||0)-(tx.feeDiscount||0)));
    if(D.showDiscounts && tx.feeDiscount) lr("Doctor fee discount", `-${money$(tx.feeDiscount)}`);
  }
  divider();
  if(D.showQty && totalQty) lr("Total Qty", String(totalQty));
  const tz = D.totalSize==="tall" ? "tall" : "normal";
  lr("PAYABLE", money$(tx.grandTotal), {b:D.boldTotal, z:tz});
  divider();
  if(D.thanks) line(D.thanks, {a:D.footAlign});
  if(D.footer) line(D.footer, {a:D.footAlign});
  return L;
}
function buildEscPosReceipt(tx){
  const ESC = "\x1B", GS = "\x1D", D = getReceiptDesign();
  const sizeCode = {normal:"\x00", tall:"\x01", large:"\x11"};
  const alignCode = {left:"\x00", center:"\x01", right:"\x02"};
  let r = ESC + "@";
  buildReceiptLines(tx, D).forEach(l=>{
    r += ESC+"a"+alignCode[l.a] + (l.b?ESC+"E\x01":"") + GS+"!"+sizeCode[l.z] + l.t + "\n" + GS+"!\x00" + ESC+"E\x00";
  });
  r += ESC+"a\x00" + "\n".repeat(Math.max(0,Math.min(8,D.feedLines|0)));
  if(D.cut) r += GS + "V" + "\x00";
  return r;
}

// Hands the raw ESC/POS bytes to the native app over the bridge, prefixed "PRINT:" so
// App Inventor's WebViewStringChange handler can route it to whichever printer transport
// is configured (Bluetooth first; WiFi/USB/BLE can be added later using this same message).
// Called right after a bill is completed. The native side shows "Not connected to a Bluetooth
// device." whenever it is sent a print job with no printer connected, and the page can't see the
// connection state — so the automatic print only fires if a printer has been chosen in Printer
// Settings and "Print automatically" hasn't been switched off. The 🖨 Print button on a saved
// bill always tries to print, whatever these settings say.
function autoPrintEnabled(){
  const transport = localStorage.getItem("clinic_printer_transport") || "";
  if(!transport) return false;                        // no printer ever set up
  return localStorage.getItem("clinic_auto_print") !== "off";
}
function autoPrintAfterBill(tx){
  if(autoPrintEnabled()) printReceipt(tx);
}
function toggleAutoPrint(on){
  localStorage.setItem("clinic_auto_print", on ? "on" : "off");
  showToast(on ? "Receipts will print automatically" : "Automatic printing is off — use 🖨 Print on a saved bill");
}
function printReceipt(tx){
  const escpos = buildEscPosReceipt(tx);
  if(!window.AppInventor || typeof window.AppInventor.setWebViewString !== "function"){
    showToast("Printing isn't available outside the app");
    return;
  }
  const transport = localStorage.getItem("clinic_printer_transport") || "";
  if(transport === "wifi"){
    window.AppInventor.setWebViewString("PRINT_WIFI:" + escpos);
  } else if(transport === "ble"){
    window.AppInventor.setWebViewString("PRINT_BLE:" + escpos);
  } else if(transport === "usb"){
    window.AppInventor.setWebViewString("PRINT_USB:" + escpos);
  } else if(transport === "cloud"){
    window.AppInventor.setWebViewString("PRINT_CLOUD:" + escpos);
  } else {
    // Default / unset falls back to Bluetooth — matches the original Phase 1 behavior.
    window.AppInventor.setWebViewString("PRINT:" + escpos);
  }
}

// Stored formulas use inconsistent separators between components (e.g. "valsartan+Amlodipine",
// "Budesonide+formoterol Fumrate Dihydrate") - typing the exact separator (or lacking one) used
// in a particular entry shouldn't be required to find it. Both sides are normalized to single
// spaces between words before matching, so "valsartan amlodipine" (space, no +) still matches
// a formula stored with "+", and vice versa.
// Extracts numeric tokens (e.g. "160/5 mg" -> ["160","5"], "400/12 mcg" -> ["400","12"]) so a
// strength search works purely off the numbers, ignoring unit (mg vs mcg) and formatting
// differences between entries.
function extractNumbers(s){
  return (s||"").match(/\d+(\.\d+)?/g) || [];
}
function strengthMatchesQuery(strength, rawQuery){
  const qNums = extractNumbers(rawQuery);
  if(!qNums.length) return false;
  const sNums = extractNumbers(strength);
  return qNums.some(qn=>sNums.includes(qn));
}
// A plain category query ("tablet") matches medicines of that category whether or not they
// carry the S. tag (m.sTag) shown in the UI (e.g. "S.Tablet") - that tag is a display prefix,
// not a separate category value. An explicit S.-prefixed query ("s.tablet" or "s tablet")
// is treated as more specific and only matches medicines that actually carry that tag,
// excluding otherwise-identical untagged ones of the same category.
// Lets a search combine name, formula, strength, and category terms freely, in any order
// (e.g. "Tarclya 5 tablet", "tablet 5 mirogabalin", "5 tarclya tablet" all work the same way).
// Each whitespace-separated word in the query just has to be found SOMEWHERE among the
// medicine's name / formula / strength-number / category - it doesn't matter which field, and
// different words can each match a different field. All words must be satisfied (AND across
// words), but each individual word can match any field (OR across fields).
function tokenMatchesMedicine(m, tok){
  if((m.name||"").toLowerCase().includes(tok)) return true;
  const normFormula = normalizeFormulaText(m.formula);
  const normTok = normalizeFormulaText(tok);
  if(normTok && normFormula.includes(normTok)) return true;
  if(/^\d+(\.\d+)?$/.test(tok) && extractNumbers(m.mg).includes(tok)) return true;
  if(categoryMatchesQuery(m, tok)) return true;
  return false;
}
function medicineMatchesQuery(m, rawQuery){
  const tokens = (rawQuery||"").toLowerCase().trim().split(/\s+/).filter(Boolean);
  if(!tokens.length) return false;
  return tokens.every(tok=>tokenMatchesMedicine(m,tok));
}
function categoryMatchesQuery(m, rawQuery){
  const q = (rawQuery||"").toLowerCase().trim();
  if(!q) return false;
  const cat = (m.category||m.specialCategory||"").toLowerCase();
  if(!cat) return false;
  const sMatch = q.match(/^s[.\s]+(.+)$/); // requires "s." or "s " + something, not a bare "s..." category name like "Syrup"
  if(sMatch){
    const rest = sMatch[1].trim();
    return (cat.startsWith(rest) || cat.includes(rest)) && !!m.sTag;
  }
  return cat.startsWith(q) || cat.includes(q);
}
function normalizeFormulaText(s){
  return (s||"").toLowerCase().replace(/[+/,&\-()]/g," ").replace(/\s+/g," ").trim();
}
function formulaMatchesQuery(formula, rawQuery){
  return normalizeFormulaText(formula).includes(normalizeFormulaText(rawQuery));
}
// Ranks a formula match by how many of the QUERY's words, taken from the start, form a
// matching prefix of the formula's own words - e.g. searching "gh hh jj kk" ranks a formula
// of exactly "gh hh jj kk" (or one that starts with all 4 of those words) highest, then a
// formula starting with just "gh hh jj", then "gh hh", then "gh" alone; formulas where the
// query only appears as a substring somewhere in the middle (not as this leading prefix)
// still show up (existing broad match), just ranked below all of the above tiers.
function formulaRankScore(formula, rawQuery){
  const fWords = normalizeFormulaText(formula).split(" ").filter(Boolean);
  const qWords = normalizeFormulaText(rawQuery).split(" ").filter(Boolean);
  if(!qWords.length) return 0;
  let matchLen = 0;
  for(let i=0;i<qWords.length;i++){
    if(fWords[i] === qWords[i]) matchLen = i+1; else break;
  }
  if(matchLen === qWords.length) return fWords.length===qWords.length ? 10000 : 9000; // full query matched as a leading prefix
  if(matchLen > 0) return 1000 + matchLen; // partial leading-word match, longer prefix ranks higher
  return formulaMatchesQuery(formula, rawQuery) ? 100 : 0; // query found only as a substring, not a leading prefix
}
// Combines name, formula, strength, and category relevance for sorting search results, highest first.
function searchRankScore(m, rawQuery){
  const q = normalizeFormulaText(rawQuery);
  const nameL = (m.name||"").toLowerCase();
  if(nameL === q) return 20000;
  if(nameL.startsWith(q)) return 15000;
  const fScore = formulaRankScore(m.formula, rawQuery);
  if(nameL.includes(q)) return Math.max(fScore, 12000);
  if(fScore > 0) return fScore;
  if(categoryMatchesQuery(m, rawQuery)) return 200;
  return strengthMatchesQuery(m.mg, rawQuery) ? 50 : 0;
}

// for the "Add medicine" search box. Called both by the initial full renderBill() and by
// refreshBillQueryDropdown() below on every keystroke, so the two can never drift apart.
function billQueryDropdownHtml(){
  const q = bill.query.trim().toLowerCase();
  const matches = q ? inventory.filter(m=>!m.deleted && !m.specialCategory && medicineMatchesQuery(m,q)).sort((a,b)=>searchRankScore(b,q)-searchRankScore(a,q)).slice(0,6) : [];
  const selMed = inventory.find(m=>m.id===bill.selectedMedId);
  return (matches.length && !selMed ? `<div class="dropdown">${matches.map(m=>`
      <div class="flex" style="align-items:stretch;border-bottom:1px solid var(--border);">
        <button style="width:auto;flex:1;min-width:0;text-align:left;padding:10px 12px;border:none;background:none;cursor:pointer;display:block;" onclick="pickBillMed('${m.id}')">
          <span style="font-size:14px;font-weight:600;display:block;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${esc(m.name)}${m.category?` <span class="pill-badge" style="background:var(--primarySoft);color:var(--primary);font-size:9px;padding:2px 6px;vertical-align:middle;">${esc(m.category)}</span>`:""}</span>
          ${(m.formula||m.mg)?`<span style="font-size:11px;color:var(--primary);display:block;white-space:normal;word-break:break-word;margin-top:1px;">${esc(m.formula)}${m.formula&&m.mg?' · ':''}${esc(fmtBig(m.mg))}</span>`:""}
          <span style="font-size:11px;display:block;margin-top:2px;${m.stockPills<=(m.lowStockAt??0)?'color:var(--danger);font-weight:700;':'color:var(--faint);'}">${fmtInt(m.stockPills)} medicine left</span>
        </button>
        ${stockLostBtnHtml(m)}
        ${m.formula?`<button title="Find other medicines with this formula" onclick='searchBillByFormula(${JSON.stringify(m.formula)})' style="width:auto;flex-shrink:0;border:none;border-left:1px solid var(--border);background:none;padding:8px 14px;cursor:pointer;color:var(--primary);font-size:15px;display:flex;align-items:center;justify-content:center;">🔎</button>`:""}
      </div>`).join("")}</div>` : "") +
    (bill.query && !matches.length && !selMed ? `<p class="small faint" style="margin-top:6px;">No match. Add it in Inventory tab first.</p>` : "");
}
function refreshBillQueryDropdown(){
  const el = document.getElementById("billQueryDropdown");
  if(el) el.innerHTML = billQueryDropdownHtml();
}
// Same pattern as billQueryDropdownHtml() above, for the special-category search box.

          <span style="font-size:11px;display:block;margin-top:2px;${m.stockPills<=(m.lowStockAt??0)?'color:var(--danger);font-weight:700;':'color:var(--faint);'}">${fmtInt(m.stockPills)} medicine left</span>
        </div>

  const matches = q ? inventory.filter(m=>!m.deleted && !m.specialCategory && medicineMatchesQuery(m,q)).sort((a,b)=>searchRankScore(b,q)-searchRankScore(a,q)).slice(0,6) : [];
  const selMed = inventory.find(m=>m.id===bill.selectedMedId);

  const sq = bill.specialQuery.trim().toLowerCase();

/* ===================== BARCODE SCANNING (GS1 DataMatrix / GS1-128) ===================== */
/* Medicine boxes in India print a small GS1 DataMatrix (sometimes a GS1-128 linear barcode)
   next to the human-readable batch/mfg/expiry/MRP text — see the "what's in that square
   barcode" conversation earlier. Decoding it is a purely local, offline operation (the bytes
   are all sitting right there in the barcode); no internet or server lookup is needed to pull
   out the GTIN/batch/expiry fields extracted below.
   Two ways to feed a scan into this app, both wired to the same parser/handler:
   1) A text box the scan lands in — this is the PRIMARY, always-reliable path. Almost every
      handheld pharmacy barcode scanner (USB or Bluetooth) is a plain "HID" keyboard device:
      point it at a code, it "types" the decoded text into whatever input is focused, then
      sends Enter — no app-side camera code needed at all, and it works fully offline with
      zero changes to the App Inventor project.
   2) An optional phone-camera scanner (openCameraScan below) using getUserMedia, and a
      photo-capture scanner (scanFromPhoto below) using the phone's native camera app, both
      decoded with zxing-wasm — a WebAssembly build of the real ZXing-C++ engine (not the older,
      noticeably weaker pure-JavaScript @zxing/library port this used to run on; that port's
      Data Matrix decoder in particular struggled with anything less than a near-perfectly
      flat, head-on shot). IMPORTANT CAVEAT: the stock App Inventor WebViewer component does NOT
      grant camera permission to web content by default (same class of limitation as it not
      handling file downloads — see checkForAppUpdate's comment above). The live-camera button
      will likely fail silently inside the packaged APK unless the WebViewer is swapped for a
      camera-capable variant/extension (the photo-capture button uses the file chooser instead,
      which is a separate, generally better-supported path). Treat option 1 above as the
      dependable one regardless. */
function gs1SetField(out, ai, value){
  if(ai==="01") out.gtin = value;
  else if(ai==="10") out.batch = value;
  else if(ai==="21") out.serial = value;
  else if(ai==="240") out.productText = value;
  else if(ai==="11") out.mfgDate = gs1DateToIso(value);
  else if(ai==="17") out.expiryDate = gs1DateToIso(value);
}
// GS1 dates are 6-digit YYMMDD. A day of "00" is valid per the GS1 spec and means "the last
// day of that month" (common when a manufacturer only tracks month/year) — handled by
// rolling to the 1st of the NEXT month and stepping back one day.
function gs1DateToIso(yymmdd){
  if(!/^\d{6}$/.test(yymmdd)) return null;
  const yy = Number(yymmdd.slice(0,2)), mm = Number(yymmdd.slice(2,4)), dd = Number(yymmdd.slice(4,6));
  const year = 2000 + yy; // every medicine box scanned today safely falls in the 2000s
  if(mm<1||mm>12) return null;
  if(dd===0){
    const d = new Date(year, mm, 1); // JS months are 0-indexed, so "mm" here already means "1st of next month"
    d.setDate(d.getDate()-1);
    return ymd(d.getFullYear(), d.getMonth(), d.getDate());
  }
  if(dd<1||dd>31) return null;
  return ymd(year, mm-1, Math.min(dd, new Date(year, mm, 0).getDate()));
}
// Longest value allowed for the variable-length AIs we might meet. Only used when separators
// are missing and we have to guess where one field ends and the next begins.
function gs1MaxLen(ai){ return (ai==="10"||ai==="21"||ai==="22") ? 20 : (ai==="30"||ai==="37") ? 8 : 30; }
// Describes the GS1 Application Identifier at the start of `s`: its text, and whether its value
// is a fixed number of characters (fixed>0) or runs until the next GS separator / end (fixed=0).
// Only needs to be right about LENGTHS so that fields Counter Book doesn't use (weights, prices,
// party codes...) can be skipped correctly instead of derailing the whole parse. null = unknown AI.
function gs1AiInfo(s){
  const d2 = s.slice(0,2), n2 = Number(d2);
  const FIXED2 = {"00":18,"01":14,"02":14,"11":6,"12":6,"13":6,"14":6,"15":6,"16":6,"17":6,"18":6,"19":6,"20":2};
  if(FIXED2[d2]!=null) return { ai:d2, fixed:FIXED2[d2] };
  if(d2==="10"||d2==="21"||d2==="22"||d2==="30"||d2==="37"||(n2>=90&&n2<=99)) return { ai:d2, fixed:0 };
  if(n2>=31 && n2<=36 && s.length>=4) return { ai:s.slice(0,4), fixed:6 };        // measures, e.g. 310n weight
  if(n2===41 && s.length>=3) return { ai:s.slice(0,3), fixed:13 };                 // party GLNs 410-417
  if((n2===24||n2===25||n2===40||n2===42||n2===43) && s.length>=3) return { ai:s.slice(0,3), fixed:0 }; // incl. 240 = manufacturer's extra product info
  if((n2===39||(n2>=70&&n2<=82)) && s.length>=4) return { ai:s.slice(0,4), fixed:0 }; // price, 7xxx, 8xxx
  return null;
}
// Strict parse of the WHOLE string into [ai, value] pairs, or null if it can't be read end to end.
// Normal case: each variable-length value ends at a GS separator (or the end of the string) and
// this just reads straight through. If a decoder dropped the separators, a field is instead
// allowed to end early, right before another valid AI starts — with backtracking to find the one
// reading that consumes everything, and each AI allowed only once (which rules out bogus splits).
let _gs1Budget = 0;
function gs1Parse(s, i, seen){
  if(--_gs1Budget < 0) return null;
  const GS = "\x1D";
  while(i<s.length && s[i]===GS) i++;
  if(i>=s.length) return [];
  const info = gs1AiInfo(s.slice(i, i+4));
  if(!info || !/^\d+$/.test(info.ai) || seen[info.ai]) return null; // real AIs are always digits
  const start = i + info.ai.length;
  const seen2 = Object.assign({}, seen); seen2[info.ai] = true;
  if(info.fixed){
    const val = s.substr(start, info.fixed);
    if(val.length<info.fixed || !/^\d+$/.test(val)) return null;
    const rest = gs1Parse(s, start+info.fixed, seen2);
    return rest && [[info.ai, val]].concat(rest);
  }
  const g = s.indexOf(GS, start);
  const hardEnd = g===-1 ? s.length : g;
  const max = gs1MaxLen(info.ai);
  const ends = [];
  if(hardEnd-start>=1 && hardEnd-start<=max) ends.push(hardEnd);                  // the conformant reading first
  for(let e=start+1; e<=Math.min(hardEnd-1, start+max); e++) ends.push(e);        // then: next AI follows immediately
  for(const e of ends){
    const rest = gs1Parse(s, e, seen2);
    if(rest) return [[info.ai, s.slice(start, e)]].concat(rest);
  }
  return null;
}
function gs1ParseAll(s){ _gs1Budget = 20000; return gs1Parse(s, 0, {}); }
// Lenient fallback: reads as far as it can and quietly stops at anything it can't place.
function gs1Walk(s, out){
  const GS = "\x1D";
  while(s.length>=2){
    const info = gs1AiInfo(s);
    if(!info || !/^\d+$/.test(info.ai)) break;
    s = s.slice(info.ai.length);
    let val;
    if(info.fixed){
      if(s.length<info.fixed) break;
      val = s.slice(0,info.fixed); s = s.slice(info.fixed);
    } else {
      const g = s.indexOf(GS);
      val = g===-1 ? s : s.slice(0,g);
      s = g===-1 ? "" : s.slice(g+1);
    }
    gs1SetField(out, info.ai, val);
    s = s.replace(/^\x1D+/, ""); // tolerate a separator after a fixed-length field too
  }
}
// AI 240 ("additional product identification assigned by the manufacturer") is free text, and
// some manufacturers put the product name and the MRP in it, e.g. "Terbisil 10 lotion 20mL Rs.380.00".
// Splits that into a name and a price when it looks like that, so they can pre-fill the form.
function gs1DeriveProduct(out){
  const t = out.productText;
  if(!t) return;
  let name = String(t).trim(), price = null;
  const NUMRE = "(\\d+(?:[.,]\\d+)?)";
  // Case 1: the field is ONLY a price, e.g. "420.00", "420", "Rs 420.00", "MRP:420.00/-".
  // (Many boxes put just the MRP here — it must never be mistaken for the medicine's name.)
  let m = name.match(new RegExp("^(?:(?:MRP|M\\.R\\.P\\.?|Price|Rs\\.?|INR|\u20b9)\\s*[:.\\-]?\\s*)*"+NUMRE+"\\s*(?:\\/-|-|only)?$","i"));
  if(m){
    price = Number(m[1].replace(",","."));
    name = "";
  } else {
    // Case 2: name followed by (or containing) a labelled price, e.g. "Terbisil 10 lotion 20mL Rs.380.00"
    const lab = name.match(new RegExp("(?:MRP|M\\.R\\.P\\.?|Rs\\.?|INR|\u20b9)\\s*[:.\\-]?\\s*"+NUMRE+"(?:\\s*(?:\\/-|-))?","i"));
    if(lab){
      price = Number(lab[1].replace(",","."));
      name = (name.slice(0,lab.index)+" "+name.slice(lab.index+lab[0].length)).replace(/[\s,;:\-]+$/,"").replace(/^[\s,;:\-]+/,"").replace(/\s+/g," ").trim();
      name = name.replace(/(?:^|\s)(?:MRP|M\.R\.P\.?|Price|Rs\.?|INR|\u20b9)\s*[:.\-]*\s*$/i,"").trim();   // a leftover "MRP" label is not a name
      if(/^(?:MRP|M\.R\.P\.?|Price|Rs\.?|INR|\u20b9)$/i.test(name)) name = "";
    }
  }
  // Some codes run words and numbers together ("Terbisil10lotion20mL"): if there are no spaces at
  // all, put one at every letter/number boundary so it reads "Terbisil 10 lotion 20 mL".
  if(name && !/\s/.test(name)) name = name.replace(/([A-Za-z])(\d)/g,"$1 $2").replace(/(\d)([A-Za-z])/g,"$1 $2");
  // A "name" with no letters at all is not a name (never put numbers in the Name box).
  if(name && !/[A-Za-z]/.test(name)) name = "";
  out.productName = name || null;
  out.price = (price>0) ? price : null;
}
// Parses a scanned/typed GS1 element string into just the fields Counter Book uses. Copes with:
//  - a symbology identifier some scanners prepend (e.g. "]d2" for GS1 Data Matrix)
//  - leading separator/control characters (the GS1 "FNC1" start marker often shows up as one)
//  - raw form: AIs back-to-back, ASCII GS (0x1D) ending any variable-length field that isn't last
//  - the same but with the separators missing (see gs1Parse)
//  - "human-readable" form: "(01)08901234567890(17)280430(10)ABC123"
//  - junk in front of the data: re-syncs on the first "01"+14 digits it can find
function parseGS1Barcode(raw){
  const out = { gtin:null, batch:null, mfgDate:null, expiryDate:null, serial:null, productText:null, productName:null, price:null };
  if(!raw) return out;
  let s = String(raw);
  s = s.replace(/^\][A-Za-z][0-9A-Za-z]/, "");   // symbology identifier
  s = s.replace(/^[\x00-\x20\x7f]+/, "");        // leading control chars / whitespace / FNC1
  const found = ()=> out.gtin || out.batch || out.mfgDate || out.expiryDate;
  if(s.indexOf("(")!==-1){
    const re = /\((\d{2,4})\)([^(]*)/g;
    let m;
    while((m = re.exec(s))) gs1SetField(out, m[1], m[2].trim());
    if(found()){ gs1DeriveProduct(out); return out; }
  }
  let pairs = gs1ParseAll(s);
  if(!pairs){ const idx = s.search(/01\d{14}/); if(idx>0) pairs = gs1ParseAll(s.slice(idx)); }
  if(pairs){ pairs.forEach(pr => gs1SetField(out, pr[0], pr[1])); }
  else {
    gs1Walk(s, out);
    if(!found()){ const idx = s.search(/01\d{14}/); if(idx>0) gs1Walk(s.slice(idx), out); }
  }
  // Camera decoders often drop the invisible GS separator, so a short field like the batch can
  // swallow the "240" + price that follows it (e.g. batch "ABC123240420.00"). A real batch never
  // ends in "240" + a decimal number, so split that tail back off as the product text/price.
  ["batch","serial"].forEach(k=>{
    const mm = out[k] && !out.productText && String(out[k]).match(/^(.+?)240(\d{1,6}[.,]\d{1,2})$/);
    if(mm){ out[k] = mm[1]; out.productText = mm[2]; }
  });
  gs1DeriveProduct(out);
  return out;
}

// zxing-wasm's reader options, shared by both the photo path and the live-camera path below.
// tryHarder trades a bit of decode speed for accuracy — worth it here since a GS1 DataMatrix is
// small and dense; maxNumberOfSymbols:1 stops it looking for more than one code per image/frame,
// which is both faster and avoids ever ambiguously returning the wrong one of two codes in frame.
// Medicine boxes use far more than just DataMatrix/QRCode/Code128 — Code39, EAN-13/8, UPC,
// ITF, Codabar, MicroQRCode, rMQRCode and MaxiCode all show up in the wild too, and leaving
// them out meant those boxes simply couldn't be scanned at all, not even badly.
const ZXING_READ_OPTIONS = { formats: ["DataMatrix","QRCode","MicroQRCode","rMQRCode","Code128","Code39","Code93","Codabar","EAN-13","EAN-8","UPC-A","UPC-E","ITF","PDF417","Aztec","DataBar","DataBarExpanded","DataBarLimited","MaxiCode"], tryHarder: true, maxNumberOfSymbols: 1 };
// A dotty inkjet-printed Data Matrix (very common on medicine boxes) can defeat the library's
// default settings even when it looks perfectly sharp to a person — the printed dots bleed into
// each other or leave gaps, so the "black/white" decision the decoder makes per module comes out
// wrong. Different settings win on different prints, so instead of betting on one, the live
// scanner cycles through several ("profiles"), one per camera frame, and the photo scanner tries
// them all in turn. tryDenoise = a morphological closing filter for 2D codes (fills small gaps in
// dotted modules); the binarizer picks how the image is turned into black/white.
const ZXING_PROFILES = [
  { name:"default",         opts:{} },
  { name:"denoise",         opts:{ tryDenoise:true } },
  { name:"global-threshold",opts:{ binarizer:"GlobalHistogram" } },
  { name:"denoise+global",  opts:{ tryDenoise:true, binarizer:"GlobalHistogram" } },
  { name:"fixed-threshold", opts:{ binarizer:"FixedThreshold" } },
  { name:"no-downscale",    opts:{ tryDownscale:false } }
];
function zxingOptionsFor(i){ return Object.assign({}, ZXING_READ_OPTIONS, ZXING_PROFILES[i % ZXING_PROFILES.length].opts); }
// Chrome on Android exposes Google's own barcode engine as the standard BarcodeDetector API in
// some setups. If this WebView has it AND it supports Data Matrix, it's tried first each frame
// (it's fast, and it's the same family of engine other phone scanner apps use); zxing-wasm above
// is the fallback. Returns null when it isn't available, which is common inside a WebView.
let _nativeDetector = null, _nativeDetectorChecked = false;
async function getNativeBarcodeDetector(){
  if(_nativeDetectorChecked) return _nativeDetector;
  _nativeDetectorChecked = true;
  try{
    if(typeof BarcodeDetector === "undefined") return null;
    const fmts = await BarcodeDetector.getSupportedFormats();
    if(!fmts || fmts.indexOf("data_matrix") === -1) return null;
    _nativeDetector = new BarcodeDetector({ formats: ["data_matrix","qr_code","code_128","code_39","code_93","codabar","ean_13","ean_8","upc_a","upc_e","itf","pdf417","aztec"] });
  }catch(e){ _nativeDetector = null; }
  return _nativeDetector;
}
let _zxingWasmLoadPromise = null;
function loadZXingWasm(){
  if(window.ZXingWASM) return Promise.resolve();
  if(_zxingWasmLoadPromise) return _zxingWasmLoadPromise;
  _zxingWasmLoadPromise = new Promise((resolve, reject)=>{
    const s = document.createElement("script");
    s.src = "https://cdn.jsdelivr.net/npm/zxing-wasm@2.2.1/dist/iife/reader/index.js";
    s.onload = ()=>resolve();
    s.onerror = ()=>reject(new Error("Couldn't load the scanner library — needs internet the first time it's used."));
    document.head.appendChild(s);
  });
  return _zxingWasmLoadPromise;
}

let scanUi = { open:false, pending:null, error:"" }; // pending: "newmed", or {kind:"restock", medId}
let _pendingCameraTarget = null; // holds the scan target while we wait on the native side's permission round-trip
// Entry point for the "📷 use phone camera" buttons. Inside the packaged app, camera access needs
// an OS-level runtime permission that only Android's own Screen1.AskForPermission can trigger —
// CustomWebView's own permission grant (see OnPermissionRequest below) can't grant something the
// app itself doesn't already hold. Rather than only asking once at app launch (easy to miss, or to
// deny before understanding why), this asks fresh every time the button is tapped: if permission
// is already granted, Android's AskForPermission returns instantly with no dialog shown, so this
// costs nothing on repeat use and naturally re-prompts if it was denied (or never granted) before.
function requestCameraThenScan(target){
  if(window.AppInventor && typeof window.AppInventor.setWebViewString === "function"){
    _pendingCameraTarget = target;
    window.AppInventor.setWebViewString("REQUEST_CAMERA_PERMISSION");
    return;
  }
  // No native bridge (testing this page directly in a normal browser) — the browser handles its
  // own getUserMedia permission prompt directly, no extra round-trip needed.
  openCameraScan(target);
}

let _pendingPhotoScanTarget = null;
// Alternative to the live-video scanner above: instead of a continuous getUserMedia feed (limited
// resolution, iffy autofocus inside a WebView), this opens the phone's own native camera APP via
// a plain <input type="file" capture> file chooser — full resolution, real hardware autofocus/HDR,
// the same camera pipeline every other app on the phone uses — then decodes that single still
// photo. Often far more reliable for a small, dense code than the live-feed approach.
let _scanPhotoOpenTimer = null;
function scanFromPhoto(target){
  // The phone's file chooser doesn't open in this app's web view, so the still photo is taken with
  // the same in-page camera used by 🖼 Add M.Picture, then decoded exactly as before.
  takePhoto(file=>{
    _pendingPhotoScanTarget = target;
    handleScanPhotoFile({ files:[file], value:"" });
  });
}
async function handleScanPhotoFile(input){
  clearTimeout(_scanPhotoOpenTimer);
  const file = input.files && input.files[0];
  const target = _pendingPhotoScanTarget;
  _pendingPhotoScanTarget = null;
  input.value = ""; // reset so picking the exact same photo again still fires onchange next time
  if(!file || !target) return;
  showToast("Reading barcode from photo…");
  try{
    await loadZXingWasm();
    // Full native-resolution photo goes straight in — zxing-wasm's C++ decoder handles large,
    // real-world images (skew, uneven lighting, a bit of blur) far more capably than the old
    // pure-JS port did, so unlike before, this no longer needs a manual downscale/retry loop.
    const results = await (async ()=>{
      for(let i=0;i<ZXING_PROFILES.length;i++){
        try{
          const r = await ZXingWASM.readBarcodes(file, zxingOptionsFor(i));
          if(r && r.length && r[0].text) return r;
        }catch(e){ /* this profile failed — try the next one */ }
      }

      if(/^\s*(indication|dosage|direction|storage|contra|side\s*effect|precaution|warning)\b/i.test(restLines[i])){ compEndIdx=i; break; }
    }
    const block = restLines.slice(0, Math.min(compEndIdx, 12)).join("\n"); // hard cap either way, just in case
    const names=[], strengths=[];
    // A dose's digits must not be glued to a letter (so "Vitamin D3" isn't mistaken for a dose
    // starting at its "3"), and the LAST dose-looking number on the line wins — composition
    // lines often have an aside like "(Eq. To 400mg Elemental Calcium)" before the real final
    // dose, and taking the first match would grab the aside's number instead.
    const doseRe = /(?<![A-Za-z])(\d[\d,]*(?:\.\d+)?)\s*(mg|mcg|µg|gm|g|ml|iu|i\.u\.?|%)\b/gi;
    block.split("\n").forEach(raw=>{
      // Dot leaders ("....") are plain punctuation here, not part of any number — strip them
      // before matching so they can't get swallowed into a dose figure.
      let l = raw.replace(/\s+/g," ").replace(/\.{2,}/g," ").trim();
      if(!l || /composition|^each\b.*contains?:?$/i.test(l)) return;
      const all = [...l.matchAll(doseRe)];
      const dose = all[all.length-1];
      let name = dose ? l.slice(0, dose.index) : l;
      name = name.replace(/\([^)]*\)/g,"").replace(/[:.\s]+$/,"").trim();
      if(name && /[A-Za-z]{3}/.test(name)){
        if(names.length<3){ names.push(name); strengths[names.length-1] = dose ? dose[0].replace(/\s+/g," ").trim().toUpperCase() : undefined; }
      } else if(dose && names.length && strengths[names.length-1]===undefined){
        // A continuation line that's only a parenthetical aside + the real dose, with no
        // ingredient name of its own — attach it to the name from the line just above.
        strengths[names.length-1] = dose[0].replace(/\s+/g," ").trim().toUpperCase();
      }
    });
    if(names.length) out.formula = names.join(" + ");
    const strOut = strengths.filter(Boolean);
    if(strOut.length) out.strength = strOut.join(" + ");
  }
  return out;
}

async function aiOcrCanvas(file, deg){ // bigger + grayscale + more contrast helps Tesseract on phone photos; deg turns a sideways photo upright
  deg = deg||0;
  const bmp=await createImageBitmap(file), sc=Math.min(2200/bmp.width,2);
  const w=Math.round(bmp.width*sc), h=Math.round(bmp.height*sc), swap=(deg===90||deg===270);
  const c=document.createElement("canvas"); c.width=swap?h:w; c.height=swap?w:h;
  const x=c.getContext("2d"); x.translate(c.width/2,c.height/2); x.rotate(deg*Math.PI/180); x.drawImage(bmp,-w/2,-h/2,w,h); x.setTransform(1,0,0,1,0,0);
  const d=x.getImageData(0,0,c.width,c.height), a=d.data;
  for(let i=0;i<a.length;i+=4){ let v=0.3*a[i]+0.59*a[i+1]+0.11*a[i+2]; v=Math.max(0,Math.min(255,(v-128)*1.5+128)); a[i]=a[i+1]=a[i+2]=v; }
  x.putImageData(d,0,0); return c;
}
// Photos are often taken with the box turned sideways or upside-down, and the offline reader then returns
// garbage. Try the 4 orientations on a small copy (cheap), keep the one that reads the most real words,
// then do the full-quality read in that orientation.
// worker: a single Tesseract worker shared across the whole batch of photos — spinning one up
// is one of the most expensive parts of this, so processBoxPhotosInner now creates exactly one
// for all 3 photos instead of one each (was 3x the engine-startup cost for nothing, since the
// same photo of the same box is always read with the same language).
// knownDeg: once the first photo's orientation has been found, every later photo in the same
// batch is assumed to have been held the same way and skips the 4-way probe entirely — that
// probe was the single biggest cost here (up to 4 extra OCR passes per photo).
async function aiOcrRotated(file, worker, knownDeg){
  const run=async img=> worker ? worker.recognize(img) : window.Tesseract.recognize(img,"eng");
  const bmp=await createImageBitmap(file);
  let best = knownDeg;
  if(best==null){
    // Small and rough is fine here — this pass only needs to compare 4 orientations against
    // each other, not actually transcribe anything, so it runs well under full resolution.
    const sc=Math.min(1,500/Math.max(bmp.width,bmp.height));
    const w=Math.round(bmp.width*sc), h=Math.round(bmp.height*sc);
    let bestScore=-1; best=0;
    for(const deg of [0,90,180,270]){
      const swap=(deg===90||deg===270), c=document.createElement("canvas"); c.width=swap?h:w; c.height=swap?w:h;
      const x=c.getContext("2d"); x.translate(c.width/2,c.height/2); x.rotate(deg*Math.PI/180); x.drawImage(bmp,-w/2,-h/2,w,h);
      const r=await run(c); let sco=0;
      ((r&&r.data&&r.data.words)||[]).forEach(wd=>{ const t=String(wd.text||"").trim(); if(/^[A-Za-z]{3,}$/.test(t) && wd.confidence>60) sco+=t.length; });
      if(sco>bestScore){ bestScore=sco; best=deg; }
      if(deg===0 && sco>=40) break; // already upright and clearly readable — skip the other turns
    }
  }
  const result = await run(await aiOcrCanvas(file,best));
  result.__deg = best; // handed back so the caller can reuse it for the next photo in this batch
  return result;
}

async function processBoxPhotosInner(files, forceOffline){
  {
    showToast("🖼 Reading "+files.length+" photo"+(files.length>1?"s":"")+"…");
    try{
      if(!forceOffline && aiGeminiKey() && navigator.onLine){
        try{
          const imgs=await Promise.all(files.map(f=>aiResizeImage(f,1400)));
          const txt=await aiReadImage(imgs, AI_BOX_PROMPT);
          const m=txt.match(/\{[\s\S]*\}/); if(!m) throw new Error("no json");
          aiApplyBoxInfo(JSON.parse(m[0])); return;
        }catch(e){ showToast("Online reader failed — using the offline reader"); }
      }
      await aiLoadTesseract();
      // One worker and one orientation guess for the whole batch (see aiOcrRotated) — this used
      // to spin up a fresh engine and re-probe all 4 rotations for every single photo, which was
      // most of what made this slow with 3 photos per scan.
      let worker=null; try{ worker=await window.Tesseract.createWorker("eng"); }catch(e){ worker=null; }
      let sharedDeg=null;
      try{
        for(const file of files){   // offline: read each photo; every one only fills the boxes still empty
          const r=await aiOcrRotated(file, worker, sharedDeg);
          if(sharedDeg==null) sharedDeg=r.__deg;
          const parsed=Object.assign(parseBoxText(r&&r.data&&r.data.text), parseBoxTextDetails(r&&r.data&&r.data.text));
          // Only trust a name line that is mostly real letters (rejects scribbles like "< BEL =").
          const real=l=>{ const letters=(l.text.match(/[A-Za-z]/g)||[]).length, all=l.text.replace(/\s/g,"").length; return letters>=3 && all>0 && letters/all>=0.75; };
          // Brand names on a box front are 1-3 words ("ORSUP D", "Panadol Extra") — a big bold
          // banner line like "HELP TO PREVENT OSTEOPOROSIS" is taller than the actual name here
          // but is a full sentence, so it's excluded from the race even though it's the tallest.
          // The dosage form word on its own ("Tablet", "2x10 Tablets") is excluded too — that's
          // what Category is for, and a small "Tablets" in a pack-size line can otherwise end up
          // measured as "taller" than a brand name mangled by a logo/icon glyph next to it.
          const formWordOnly = /^(\d+\s*[x×]\s*\d+\s*)?(tablets?|capsules?|syrups?|suspensions?|injections?|ointments?|creams?|lotions?|drops?|gels?|powders?|sachets?|sprays?)$/i;
          const candidates=((r&&r.data&&r.data.lines)||[]).filter(l=>l.confidence>60 && real(l) && !/gtin|mfg|exp|b\.?\s*no|m\.?\s*r\.?\s*p|\d{9,}/i.test(l.text) && l.text.trim().split(/\s+/).length<=3 && !formWordOnly.test(l.text.trim()));
          // The brand name is always near the top of the box front — prefer whichever of the
          // surviving candidates sits in the upper half of the readable text, tallest first,
          // rather than letting something from the bottom corner (pack size, barcode caption)
          // win just because the logo mangled the real name's line height.
          let big=null;
          if(candidates.length){
            const maxY=Math.max(...candidates.map(l=>l.bbox.y1));
            const topHalf=candidates.filter(l=>l.bbox.y0 < maxY*0.5);
            big=(topHalf.length?topHalf:candidates).sort((a,b)=>(b.bbox.y1-b.bbox.y0)-(a.bbox.y1-a.bbox.y0))[0];
          }
          parsed.productName = big ? big.text.replace(/\s+/g," ").trim() : null; // never keep an unchecked guess
          if(parsed.productName || parsed.price || parsed.gtin || parsed.formula || parsed.form || parsed.perBox) applyScanToNewMedForm(parsed);
          else showToast("⚠ Couldn't read this photo — try again with the box upright and well lit");
        }
      } finally { if(worker){ try{ await worker.terminate(); }catch(e){} } }
    }catch(e){ showToast("⚠ "+(e&&e.message?e.message:"Couldn't read the box")); }
  }
}

function applyScanToNewMedForm(parsed){

    }

  }

  // fields that are still empty, so anything already typed is never overwritten.

    const split = splitScannedProductName(parsed.productName);
    inv.form.name = split.name; filled.push("name");

    if(split.perBox && !String(inv.form.pillsPerBox||"").trim()){ inv.form.pillsPerBox = String(split.perBox); filled.push("per box"); }

      // the shared list so it's selectable here and synced to the other devices.

      // gets an existing category assigned, or none.

      if(cat){ inv.form.category = cat; filled.push("category"); }
    }
  }
  if(parsed.price && !String(inv.form.mrp||"").trim()){ inv.form.mrp = String(parsed.price); filled.push("MRP"); }
  if(parsed.formula && !String(inv.form.formula||"").trim()){ inv.form.formula = parsed.formula; filled.push("formula"); }
  if(parsed.strength && !String(inv.form.mg||"").trim()){ inv.form.mg = parsed.strength; filled.push("strength"); }
  if(parsed.perBox && !String(inv.form.pillsPerBox||"").trim()){ inv.form.pillsPerBox = String(parsed.perBox); filled.push("per box"); }
  if(parsed.form && !inv.form.category && !inv.form.specialCategory){

/* ---- Formula suggestions: while typing in a Formula box (New medicine or inline Edit), list similar or
   exact formulas already used by medicines in inventory, so spellings stay consistent. ---- */
let _formulaSugCtx = null, _formulaSugList = [];
function _fsNorm(v){ return String(v||"").toLowerCase().replace(/\s+/g," ").trim(); }
function _fsTokens(v){ return _fsNorm(v).split(/[^a-z0-9]+/).filter(Boolean); }
function _fsBigrams(v){ const t=_fsNorm(v).replace(/[^a-z0-9]/g,""); const out=[]; for(let i=0;i<t.length-1;i++) out.push(t.slice(i,i+2)); return out; }
function _fsDice(a,b){
  const A=_fsBigrams(a), B=_fsBigrams(b); if(!A.length||!B.length) return 0;
  const cnt={}; A.forEach(x=>cnt[x]=(cnt[x]||0)+1);
  let hit=0; B.forEach(x=>{ if(cnt[x]>0){ hit++; cnt[x]--; } });
  return 2*hit/(A.length+B.length);
}
// The list of distinct formulas (with pre-computed words/bigrams) is built once and reused for
// every keystroke; it's rebuilt only when inventory actually changes (saveInventory() clears it).
let _fsIndex = null;
function _fsEnsureIndex(){
  if(_fsIndex && _fsIndex.ref===inventory && _fsIndex.len===inventory.length) return _fsIndex;
  const map=new Map();
  for(const m of inventory){
    if(m.deleted) continue;
    const t=String(m.formula||"").trim(); if(!t) continue;
    const k=_fsNorm(t);
    let e=map.get(k);
    if(!e){ e={text:t,k,words:_fsTokens(k),bi:_fsBigrams(k),ids:[]}; map.set(k,e); }
    e.ids.push(m.id);
  }
  _fsIndex={ref:inventory,len:inventory.length,entries:Array.from(map.values())};
  return _fsIndex;
}
function _fsDiceBi(A,B){
  if(!A.length||!B.length) return 0;
  const cnt={}; for(let i=0;i<A.length;i++) cnt[A[i]]=(cnt[A[i]]||0)+1;
  let hit=0; for(let i=0;i<B.length;i++){ const x=B[i]; if(cnt[x]>0){ hit++; cnt[x]--; } }
  return 2*hit/(A.length+B.length);
}
function formulaSuggestions(q, excludeId){
  const qn=_fsNorm(q); if(!qn) return [];
  const qt=_fsTokens(q);
  const qBi = qn.length>=4 ? _fsBigrams(qn) : null; // typo-tolerant matching only once enough is typed
  const scored=[];
  for(const e of _fsEnsureIndex().entries){
    let count=e.ids.length;
    if(excludeId){ count=0; for(const id of e.ids) if(id!==excludeId) count++; if(!count) continue; }
    const k=e.k, ct=e.words;
    let sc=0;
    if(k===qn) sc=100;
    else if(k.startsWith(qn)) sc=80;
    else {
      let wp=false; for(let i=0;i<ct.length;i++){ if(ct[i].startsWith(qn)){ wp=true; break; } }
      if(wp) sc=70;
      else if(qn.length>=3 && k.includes(qn)) sc=60;
      else if(qn.length>=3 && qt.length>1 && qt.every(w=>ct.some(c=>c.startsWith(w)||c.includes(w)))) sc=45;
      else if(qBi){ const d=_fsDiceBi(qBi,e.bi); if(d>=0.55) sc=20+d*20; }
    }
    if(sc>0) scored.push({text:e.text,count,sc});
  }
  scored.sort((a,b)=>b.sc-a.sc || b.count-a.count || a.text.localeCompare(b.text));
  const top=scored.slice(0,6);
  if(top.length===1 && _fsNorm(top[0].text)===qn) return [];
  return top;
}
function _fsBox(kind,id){ return document.getElementById(kind==='new' ? 'formulaSug-new' : 'formulaSug-'+id); }
function onFormulaTyped(kind,id,v){
  if(kind==='new') inv.form.formula=v; else inv.editForm.formula=v;
  const box=_fsBox(kind,id); if(!box) return;

  _formulaSugCtx={kind,id}; _formulaSugList=list.map(x=>x.text);
  if(!list.length){ box.innerHTML=""; return; }
  box.innerHTML = `<div class="formula-sug" onmousedown="event.preventDefault()">`
    + list.map((x,i)=>`<button type="button" class="formula-sug-item" onclick="pickFormulaSug(${i})"><span>${esc(x.text)}</span><span class="faint small">${x.count} medicine${x.count===1?"":"s"}</span></button>`).join("")
    + `</div>`;
}

function copyNewMedicineVariant(variant){

// Fills #invListContainer (the "no matches" message + card list) from the current inv.query,
// without ever touching #invQueryInput itself. Called once by renderInventory() on a full
// render, and directly by onInvQuery() on every keystroke — since it never rebuilds the input
// node, it's safe to call on every single keystroke with no debounce, at any typing speed.
function renderInvList(){
  const myToken = ++_invRenderToken;
  const q = inv.query.toLowerCase();
  const filtered = inventory.filter(m=>{
    if(m.deleted) return false;
    if(inv.statFilter==='special' && !m.specialCategory) return false;
    if(inv.statFilter==='sTag' && !m.sTag) return false;
    if(inv.statFilter==='nonSpecial' && m.specialCategory) return false;
    return !q || medicineMatchesQuery(m,q);
  }).sort((a,b)=>searchRankScore(b,q)-searchRankScore(a,q));
  const filterKey = q+"|"+(inv.statFilter||"");

  const filterLabels = {special:"Special category", sTag:"S. tagged", nonSpecial:"Non-special"};
  const filterHtml = inv.statFilter ? `
    <p class="small faint mb2">Filtered: ${filterLabels[inv.statFilter]} · <button type="button" onclick="toggleInvStatFilter('all')" style="background:none;border:none;color:var(--primary);font-weight:700;cursor:pointer;padding:0;font-size:inherit;">Show all</button></p>` : "";

  const container = document.getElementById("invListContainer");
  if(!container) return;

  // If this exact result set (same search text + same header-pill filter) was already fully
  // loaded onto the page before, this call is refreshing that SAME view with fresh data —
  // typically an incoming cloud-sync update landing while the person is just scrolled through
  // browsing, not a search/filter they just changed. Rebuilding the whole list in one
  // synchronous pass here (rather than resetting to a first batch of 15 and re-chunking the
  // rest in over several animation frames) means the page's height never briefly collapses
  // and grows back — which is what could clamp the scroll position mid-scroll and land a tap
  // meant for, say, the 50th medicine's Edit button onto a completely different card that had
  // snapped into that same screen position for an instant.
  if(_invListLoadedFor === filterKey){
    container.innerHTML = `
      ${filterHtml}
      ${filtered.length===0?`<p class="small faint" style="text-align:center;padding:32px 0;">${inventory.length===0?"No medicines added yet. Tap + to add one.":"No matches."}</p>`:""}
      <div id="invCardsList">${filtered.map(buildInvCard).join("")}</div>
    `;
    return;
  }

  // A genuinely new search/filter/tab-open — chunk it the usual way so THIS first paint of
  // this particular result set still feels instant even with a large medicine list.
  const FIRST_BATCH = 15;
  const CHUNK_SIZE = 30;
  const firstCards = filtered.slice(0, FIRST_BATCH).map(buildInvCard).join("");
  container.innerHTML = `
    ${filterHtml}
    ${filtered.length===0?`<p class="small faint" style="text-align:center;padding:32px 0;">${inventory.length===0?"No medicines added yet. Tap + to add one.":"No matches."}</p>`:""}
    <div id="invCardsList">${firstCards}</div>
  `;

  if(filtered.length <= FIRST_BATCH){ _invListLoadedFor = filterKey; return; }
  let idx = FIRST_BATCH;
  const appendNextChunk = ()=>{
    // Bail out quietly if a newer renderInvList() call has happened since (search edited,
    // tab changed, a medicine saved/restocked/deleted) or the list container is simply no
    // longer on screen — either way, this job's work is stale and should not touch the page.
    if(myToken !== _invRenderToken) return;
    const listEl = document.getElementById("invCardsList");
    if(!listEl) return;
    const chunk = filtered.slice(idx, idx+CHUNK_SIZE);
    listEl.insertAdjacentHTML("beforeend", chunk.map(buildInvCard).join(""));
    idx += CHUNK_SIZE;
    if(idx < filtered.length) requestAnimationFrame(appendNextChunk);
    else _invListLoadedFor = filterKey;
  };
  requestAnimationFrame(appendNextChunk);
}
// Tapping one of the 4 header pills narrows the list below to just that group; tapping the

/* ===================== RECORDS TAB ===================== */
// visibleTransactions() used to be a plain `transactions.filter(...)` recomputed on every
// single call — and renderRecords() alone calls it roughly 2 + (days already billed this
// month) times per render (once per day-in-month card, on top of the search/month-total
// calls), each one re-scanning the ENTIRE lifetime transaction history from scratch. That's
// fine with a handful of bills, but as the clinic's history grows into the hundreds/thousands
// of bills over months and years, that repeated full-history rescan is what made tab-switching
// (especially into Records) get slower and slower over time. Caching the filtered result and
// only invalidating it when `transactions` actually changes (see saveTransactions() below)
// turns that into one O(n) scan per render instead of dozens.
let _visibleTxCache = null;
function visibleTransactions(){
  if(_visibleTxCache === null) _visibleTxCache = transactions.filter(t=>!t.deleted);
  return _visibleTxCache;
}
function dayOptions(){
  const map = new Map();
  map.set(new Date().toDateString(), Date.now());
  const curMK = monthKeyOf(Date.now());
  visibleTransactions().forEach(t=>{
    if(monthKeyOf(t.timestamp)!==curMK) return; // older months are shown in the month/year folders below instead
    const k=new Date(t.timestamp).toDateString(); if(!map.has(k)) map.set(k,t.timestamp);
  });
  return Array.from(map.entries()).sort((a,b)=>b[1]-a[1]).map(([key,ts])=>({
    key, label: sameDay(ts,Date.now())?"Today":new Date(ts).toLocaleDateString(undefined,{day:"2-digit",month:"short",year:"numeric"})
  }));
}
function currentMonthTx(){ const curMK = monthKeyOf(Date.now()); return visibleTransactions().filter(t=>monthKeyOf(t.timestamp)===curMK); }
/* Manual correction: a number added on top of what's calculated from bills for a given
   month, kept separate from any single bill so it can never distort stock or a patient's
   record. Positive adds, negative subtracts. Defaults to 0 (no correction). */
function getMonthAdjustment(mk){
  const a = monthAdjustments[mk];
  return { doctorFee:(a&&a.doctorFee)||0, medTotal:(a&&a.medTotal)||0, testsTotal:(a&&a.testsTotal)||0, othersTotal:(a&&a.othersTotal)||0, updatedAt:(a&&a.updatedAt)||0 };
}
function monthAdjustedTotals(mk, tx){
  const computed = {
    medTotal: r2(tx.reduce((s,t)=>s+((t.medTotal||0)-(t.medsDiscount||0)),0)),
    feeTotal: r2(tx.reduce((s,t)=>s+((t.doctorFee||0)-(t.feeDiscount||0)),0)),
    testsTotal: r2(tx.reduce((s,t)=>s+((t.testsTotal||0)-(t.testsDiscount||0)),0)),
    extrasTotal: r2(tx.reduce((s,t)=>s+(t.extrasTotal||0),0))
  };
  const adj = getMonthAdjustment(mk);
  const medTotal = r2(computed.medTotal + adj.medTotal);
  const feeTotal = r2(computed.feeTotal + adj.doctorFee);
  const testsTotal = r2(computed.testsTotal + adj.testsTotal);
  const extrasTotal = r2(computed.extrasTotal + adj.othersTotal);
  return { medTotal, feeTotal, testsTotal, extrasTotal, grandTotal: r2(medTotal+feeTotal+testsTotal+extrasTotal), adj };
}
/* Same medicine/fee/tests/others split as monthAdjustedTotals(), but for a single day's
   transactions and with no manual correction applied — corrections are month-level only. */
function dayTotals(tx){
  const medTotal = r2(tx.reduce((s,t)=>s+((t.medTotal||0)-(t.medsDiscount||0)),0));
  const feeTotal = r2(tx.reduce((s,t)=>s+((t.doctorFee||0)-(t.feeDiscount||0)),0));
  const testsTotal = r2(tx.reduce((s,t)=>s+((t.testsTotal||0)-(t.testsDiscount||0)),0));
  const extrasTotal = r2(tx.reduce((s,t)=>s+(t.extrasTotal||0),0));
  return { medTotal, feeTotal, testsTotal, extrasTotal, grandTotal: r2(medTotal+feeTotal+testsTotal+extrasTotal) };
}
function toggleDayBreakdown(key){
  rec.expandedDayBreakdown = rec.expandedDayBreakdown===key ? null : key;
  render();
}
/* ===== Monthly breakdown drill-down (admin/doctor only, gated by can("monthlyTotal")) =====
   Each of the 4 categories in the "Payments received" modal can be tapped to reveal a
   further split: medicines by name (qty + worth sold this month), doctor fee by day,
   tests by name (qty + worth, with the dates it was billed on), and others by day. */
function toggleBreakdownSection(section){
  rec.expandedBreakdownSection = rec.expandedBreakdownSection===section ? null : section;
  render();
}
// Spreads a bill-level discount across its lines in proportion to their amounts, working in whole
// paise so the net line amounts add up EXACTLY to (gross - discount). Used so the monthly breakdown
// rows match the headline totals, which are already net of discounts.
function netLineAmounts(grossList, discount){
  const gc = grossList.map(x=>Math.round((Number(x)||0)*100)), G = gc.reduce((a,b)=>a+b,0);
  const dc = Math.min(Math.max(Math.round((Number(discount)||0)*100),0), G);
  if(!(dc>0) || !(G>0)) return gc.map(x=>x/100);
  const share = gc.map(x=>Math.floor(dc*x/G));
  let left = dc - share.reduce((a,b)=>a+b,0);
  for(let i=0; left>0 && i<gc.length; i++){ if(gc[i]-share[i]>0){ share[i]++; left--; } }
  return gc.map((x,i)=>(x-share[i])/100);
}
function monthMedicineDetail(mTx){
  const map = {};
  mTx.forEach(t=>{
    const items = t.items||[], net = netLineAmounts(items.map(it=>it.subtotal), t.medsDiscount);
    items.forEach((it,i)=>{
      const k = it.name;
      if(!map[k]) map[k] = { name: it.name, medId: it.medId, qty:0, worth:0 };
      map[k].qty += Number(it.pills)||0;
      map[k].worth = r2(map[k].worth + net[i]);
    });
  });
  return Object.values(map).sort((a,b)=>b.worth-a.worth);
}
/* Once the pills sold cross a full box's worth for that medicine, show it as boxes +
   leftover loose medicine instead of a raw pill count — e.g. "2 boxes and 5 medicine"
   instead of "×25". Falls back to the plain "×N" form if the medicine can't be found
   (deleted with no id kept, or its box size was never set). */
function formatMedQtySold(qty, medId){
  const med = medId ? inventory.find(m=>m.id===medId) : null;
  const ppb = med ? Number(med.pillsPerBox)||0 : 0;
  if(ppb>0 && qty>=ppb){
    const boxes = Math.floor(qty/ppb);
    const rem = qty % ppb;
    const parts = [];
    if(boxes>0) parts.push(`${boxes} box${boxes===1?"":"es"}`);

}
function monthFeeDetail(mTx){
  const map = {};
  mTx.forEach(t=>{
    if(!t.doctorFee) return;
    const k = new Date(t.timestamp).toDateString();
    if(!map[k]) map[k] = { ts:t.timestamp, amount:0, count:0 };
    map[k].amount += (Number(t.doctorFee)||0) - (Number(t.feeDiscount)||0);
    map[k].count++;
  });
  return Object.values(map).sort((a,b)=>b.ts-a.ts);
}
function monthTestsDetail(mTx){
  const map = {};
  mTx.forEach(t=>{
    const tests = t.tests||[], net = netLineAmounts(tests.map(te=>te.amount), t.testsDiscount);
    tests.forEach((te,i)=>{
      const k = te.name;
      if(!map[k]) map[k] = { name: te.name, qty:0, worth:0, dates:[] };
      map[k].qty += 1;
      map[k].worth = r2(map[k].worth + net[i]);
      map[k].dates.push({ ts:t.timestamp, amount:net[i] });
    });
  });
  return Object.values(map).sort((a,b)=>b.worth-a.worth);
}
function monthOthersDetail(mTx){
  const map = {};
  mTx.forEach(t=>{
    (t.extras||[]).forEach(ex=>{
      const k = new Date(t.timestamp).toDateString();
      if(!map[k]) map[k] = { ts:t.timestamp, amount:0, count:0 };
      map[k].amount += Number(ex.amount)||0;
      map[k].count++;
    });
  });

}

function deleteTx(id){
  const t = transactions.find(x=>x.id===id); if(!t) return;
  // lines whose medicine still exists and had stock taken out when the bill was made
  const back = (t.items||[]).filter(it=>{ const med=inventory.find(m=>m.id===it.medId); return med && !med.deleted && stockBack(it)>0; });
  const doDelete = (returnIt)=>{
    // Soft-delete (tombstone) rather than removing it outright, so the deletion itself can
    // sync to other devices via updatedAt instead of the record quietly reappearing.
    if(returnIt){
      back.forEach(it=>{ const med=inventory.find(m=>m.id===it.medId); if(med) returnStock(med, stockBack(it)); });
      saveInventory();
    }
    t.deleted = true; t.updatedAt = Date.now();
    logActivity("bill_del", (t.patientName||"Bill") + (back.length ? (returnIt ? " (stock returned)" : " (stock kept deducted)") : ""));
    saveTransactions(); render();
    if(returnIt && back.length) showToast("✓ Bill deleted — stock returned");
  };
  if(!back.length){ askConfirm("Delete this bill record?", ()=>doDelete(false)); return; }
  askConfirm(`Delete this bill? It has ${back.length} medicine line${back.length===1?"":"s"}. Return them to stock now, or keep the stock deducted?`,
    ()=>doDelete(true), "Return stock", "Keep stock deducted", ()=>doDelete(false));
}

  });
  recEdit.items.forEach(newIt=>{
    const med = inventory.find(m=>m.id===newIt.medId);
    if(med) newIt.ded = deductStock(med, newIt.pills);
  });
  saveInventory();
  t.patientName = recEdit.patient.trim();
  clampEditDiscounts();
  t.doctorFee = r2(Math.max(Number(recEdit.fee)||0,0));
  t.items = recEdit.items.map(it=>{ const c={...it}; delete c._new; return c; });
  t.medTotal = editTxMedTotal();
  t.medsDiscount = recEdit.medsDiscount||0;
  t.extras = recEdit.extras||[];
  t.extrasTotal = recEdit.extrasTotal||0;
  t.tests = recEdit.tests||[];
  t.testsTotal = recEdit.testsTotal||0;
  t.testsDiscount = recEdit.testsDiscount||0;
  t.feeDiscount = recEdit.feeDiscount||0;
  t.grandTotal = editTxGrandTotal();
  t.updatedAt = Date.now();
  logActivity("bill_edit", t.patientName||"Bill");
  saveTransactions();
  rec.editingId = null;
  render();
  showToast("✓ Bill updated");
}
