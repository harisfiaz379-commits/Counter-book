    </div>

    <div class="card primary">
      <div class="row"><span class="lab">Medicine total</span><span class="val">${CURRENCY}${money(billMedTotal()+pendingBillSubtotal()+pendingSpecialBillSubtotal())}</span></div>
      ${billMedDiscount()>0?`<div class="row mt2"><span class="lab">Medicines discount</span><span class="val">-${CURRENCY}${money(billMedDiscount())}</span></div>`:""}
      ${billExtrasTotal()>0?`<div class="row mt2"><span class="lab">Others</span><span class="val">${CURRENCY}${money(billExtrasTotal())}</span></div>`:""}
      ${bill.tests.length?`<div class="row mt2"><span class="lab">Tests</span><span class="val">${CURRENCY}${money(billTestsGross())}</span></div>`:""}
      ${billTestsDiscount()>0?`<div class="row mt2"><span class="lab">Tests discount</span><span class="val">-${CURRENCY}${money(billTestsDiscount())}</span></div>`:""}
      <div class="row mt2"><span class="lab">Doctor fee</span><span class="val">${CURRENCY}${money(bill.feeIncluded?billFeeGross():0)}</span></div>
      ${bill.feeIncluded && billFeeDiscount()>0?`<div class="row mt2"><span class="lab">Doctor fee discount</span><span class="val">-${CURRENCY}${money(billFeeDiscount())}</span></div>`:""}
      <div class="mt2" style="border-top:1px solid rgba(255,255,255,.25);padding-top:8px;">
        <div class="row big"><span class="lab">Grand total</span><span class="val">${CURRENCY}${money(billGrandTotal()+pendingBillSubtotal()+pendingSpecialBillSubtotal())}</span></div>
      </div>
      ${pendingBillSubtotal()>0?`<p class="small mt2" style="color:var(--headerSub);">Includes ${esc(selMed?selMed.name:"")} — not added yet, tap + Add below</p>`:""}
      ${pendingSpecialBillSubtotal()>0?`<p class="small mt2" style="color:var(--headerSub);">Includes ${esc(selSpecialMed?selSpecialMed.name:"")} — not added yet, tap + Add special medicine below</p>`:""}
    </div>

    <div class="card">
      <h3 class="mb2" style="font-size:14px;font-weight:700;">Mode of Payment</h3>
      <div class="flex gap2">
        ${["Cash","JazzCash","Other"].map(mode=>`<button class="btn ${bill.paymentMode===mode?'btn-primary':'btn-outline'}" style="flex:1;padding:8px;font-size:12px;" onclick="onBillPaymentMode('${mode}')">${mode}</button>`).join("")}
      </div>
      <div class="flex mt3" style="justify-content:space-between;align-items:center;">
        <label class="field-label" style="margin:0;">Remarks (optional, printed on receipt)</label>
        <button class="btn btn-outline" style="padding:4px 12px;font-size:11px;border-radius:999px;flex-shrink:0;" onclick="toggleRemarksEdit()">${remarksUi.editing?"Done":"Edit default"}</button>
      </div>
      ${remarksUi.editing ? `
        <div class="mt2 divider-top">
          <label class="field-label" style="margin-bottom:4px;">Default doctor name (auto-fills Remarks on every new bill)</label>
          <input ${NOAC} id="defaultDoctorNameInput" type="text" value="${esc(remarksUi.draft)}" oninput="onDefaultDoctorNameDraft(this.value)" placeholder="e.g. Dr. Salman">
          <button class="btn btn-primary mt2" style="width:100%;" onclick="saveDefaultDoctorName()">Save</button>
        </div>
      ` : ""}
      <input ${NOAC} id="billRemarksInput" type="text" value="${esc(bill.remarks)}" oninput="onBillRemarks(this.value)" placeholder="e.g. Dr. Salman" class="${remarksUi.editing?'mt2':''}" style="${bill.remarks && bill.remarks===defaultDoctorName ? 'color:var(--muted);' : ''}">
      <p id="billRemarksHint" class="small faint" style="margin:4px 0 0;${(bill.remarks && bill.remarks===defaultDoctorName)?'':'display:none;'}">This is the default — tap in and type to change it just for this bill.</p>
    </div>

    <button class="btn btn-success" style="width:100%;padding:14px;font-size:15px;" ${!canCompleteBill()?"disabled":""} onclick="completeBill()">
      Complete bill &amp; get receipt
    </button>
  `;
}

/* ===================== INVENTORY TAB ===================== */
function onInvQuery(v){ inv.query=v; scheduleSearchRender(); }
function searchInvByFormula(formula){
  inv.query = formula || "";
  render();
  const el = document.getElementById("invQueryInput");
  if(el){ el.focus(); }
}
function searchBillByFormula(formula){
  bill.query = formula || "";
  bill.selectedMedId = null;
  render();
  const el = document.getElementById("billQueryInput");
  if(el){ el.focus(); }
}
function onInvForm(field,v){ inv.form[field]=v; }
// The merged picker is one <select> covering both lists (see mergedCategoryOptionsHtml), so
// picking a value has to decide which of the two underlying fields it belongs to — a medicine
// can only be in ONE of the two right now, so the other is always cleared alongside it.
function onInvCategoryPicked(v){
  if(SPECIAL_CATEGORIES.includes(v)){ inv.form.category=""; inv.form.specialCategory=v; }
  else { inv.form.category=v; inv.form.specialCategory=""; }
  render(); // keep the "S.<Category>" toggle label in sync with whatever category is picked
}
function toggleInvForm(){ inv.showForm=!inv.showForm; if(inv.showForm){ inv.form={name:"",category:"",specialCategory:"",formula:"",mg:"",mrp:"",pillsPerBox:"",lowStockAt:"10",sTag:false}; } render(); }
function toggleInvSTag(){ inv.form.sTag = !inv.form.sTag; render(); }
function addMedicine(){
  const f = inv.form;
  if(!f.name.trim()||!f.mrp||!f.pillsPerBox) return;
  inventory.push({ id:uid(), name:f.name.trim(), category:f.category||"", specialCategory:f.specialCategory||"", formula:f.formula.trim(), mg:f.mg.trim(),
    mrpPerBox:Number(f.mrp), pillsPerBox:Number(f.pillsPerBox), stockPills:0, lowStockAt:Number(f.lowStockAt)||0, batches:[], sTag:!!f.sTag,
    updatedAt:Date.now(), deleted:false });
  saveInventory();
  inv.showForm=false;
  render();
}
function deleteMedicine(id){
  askConfirm("Delete this medicine from inventory?", ()=>{
    // Soft-delete (keep the record, flag it) rather than removing it outright: this lets the
    // deletion itself sync to other devices via updatedAt like any other edit. Removing it
    // outright would just cause it to reappear once another device's data came back in.
    const m = inventory.find(x=>x.id===id);
    if(m){ m.deleted = true; m.updatedAt = Date.now(); }
    saveInventory(); render();
  });
}
function toggleRestock(id){ inv.editId=null; inv.restockId = inv.restockId===id?null:id; inv.restockBoxes=""; inv.restockExpiry=""; inv.restockMrp=""; render(); }
function onRestockBoxes(v){ inv.restockBoxes=v; }
function onRestockExpiry(v){ inv.restockExpiry=v; }
function onRestockMrp(v){ inv.restockMrp=v; }
function doRestock(id){
  const boxes = Number(inv.restockBoxes);
  if(!boxes||boxes<=0) return;
  const m = inventory.find(x=>x.id===id);
  if(m){
    const mrpVal = (inv.restockMrp!=="" && Number(inv.restockMrp)>0) ? Number(inv.restockMrp) : null;
    m.batches = m.batches||[];
    m.batches.push({ id:uid(), boxes, pillsRemaining: boxes*m.pillsPerBox, mrpPerBox: mrpVal, expiryDate: inv.restockExpiry||null, addedAt:Date.now(), updatedAt:Date.now(), disposed:false });
    if(mrpVal!=null){ m.mrpPerBox = mrpVal; m.updatedAt = Date.now(); } // new MRP becomes the current default going forward
    recomputeStock(m);
    // A restock resolves whatever low-stock situation led to "we'll buy it later" being tapped
    // earlier — clear that suppression now so future low-stock warnings for this medicine work
    // again, instead of staying silently switched off forever.
    if(m.noWarn && m.stockPills > (m.lowStockAt??0)){ m.noWarn = false; m.updatedAt = Date.now(); }
  }
  saveInventory();
  inv.restockId=null; inv.restockBoxes=""; inv.restockExpiry=""; inv.restockMrp="";
  render();
}
function openEdit(id){
  inv.restockId=null;
  inv.editId = inv.editId===id?null:id;
  const m = inventory.find(x=>x.id===id);
  if(m){ inv.editForm = { name:m.name, category:m.category||"", specialCategory:m.specialCategory||"", formula:m.formula||"", mg:m.mg||"", mrp:String(m.mrpPerBox),
    pillsPerBox:String(m.pillsPerBox), lowStockAt:String(m.lowStockAt??0), stockPills:String(m.stockPills), noWarn:!!m.noWarn, sTag:!!m.sTag }; }
  render();
}
function onEditForm(field,v){ inv.editForm[field]=v; }
function toggleEditSTag(){ inv.editForm.sTag = !inv.editForm.sTag; render(); }
function onEditCategoryPicked(v){
  if(SPECIAL_CATEGORIES.includes(v)){ inv.editForm.category=""; inv.editForm.specialCategory=v; }
  else { inv.editForm.category=v; inv.editForm.specialCategory=""; }
  render(); // keep the "S.<Category>" toggle label in sync with whatever category is picked
}
function saveEdit(id){
  const f = inv.editForm;
  if(!f.name.trim()||!f.mrp||!f.pillsPerBox||f.stockPills==="") return;
  const m = inventory.find(x=>x.id===id);
  if(m){
    m.name=f.name.trim(); m.category=f.category||""; m.specialCategory=f.specialCategory||""; m.formula=f.formula.trim(); m.mg=f.mg.trim();
    m.mrpPerBox=Number(f.mrp); m.pillsPerBox=Number(f.pillsPerBox);
    m.lowStockAt=Number(f.lowStockAt)||0;
    m.sTag=!!f.sTag;
    m.updatedAt=Date.now();
    adjustStockTo(m, Math.max(0,Number(f.stockPills)));
  }
  saveInventory();
  inv.editId=null;
  render();
}

function renderInventory(){
  const q = inv.query.toLowerCase();
  const filtered = inventory.filter(m=>!m.deleted && (m.name.toLowerCase().includes(q)||(m.formula||"").toLowerCase().includes(q)));

  const cards = filtered.map(m=>{
    const pricePerPill = nextBatchUnitPrice(m);
    const low = !m.noWarn && m.stockPills <= (m.lowStockAt??0);
    const isExpired = activeBatches(m).some(b=>b.expiryDate && daysUntil(b.expiryDate)!==null && daysUntil(b.expiryDate)<0);
    let extra = "";
    if(inv.restockId===m.id){
      extra = `
        <div class="mt2 divider-top8">
          <div class="flex gap2" style="align-items:flex-end;">
            <div class="flex1">
              <label class="small">Boxes/strips received</label>
              <input ${NOAC} id="restockInput-${m.id}" type="text" inputmode="numeric" value="${esc(inv.restockBoxes)}" oninput="onRestockBoxes(this.value)" placeholder="e.g. 5">
            </div>
            <button class="btn btn-primary" onclick="doRestock('${m.id}')">Add</button>
          </div>
          <label class="small mt2" style="display:block;">Expiry date for this batch (optional)</label>
          <button type="button" style="width:100%;display:flex;align-items:center;justify-content:space-between;gap:8px;border:1px solid var(--border);border-radius:8px;padding:10px 12px;font-size:14px;font-family:inherit;background:#fff;cursor:pointer;color:var(--text);" onclick="openDatePicker(inv.restockExpiry,'restock',null)"><span style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${inv.restockExpiry ? esc(fmtExpiryShort(inv.restockExpiry)) : ""}</span><span style="flex-shrink:0;" class="chev"></span></button>
          <label class="small mt2" style="display:block;">New MRP per box for this batch (optional — leave blank to keep using ${CURRENCY}${money(m.mrpPerBox)})</label>
          <input ${NOAC} id="restockMrp-${m.id}" type="text" inputmode="decimal" value="${esc(inv.restockMrp)}" oninput="onRestockMrp(this.value)" placeholder="e.g. ${m.mrpPerBox}">
        </div>`;
    }
    if(inv.editId===m.id){
      const f = inv.editForm;
      extra = `
        <div class="mt2 divider-top8">
          <div class="flex gap2 mb2">
            <input ${NOAC} id="editName-${m.id}" value="${esc(f.name)}" oninput="onEditForm('name',this.value)" placeholder="Medicine name" class="flex1">
            <button type="button" onclick="toggleEditSTag()" title="Mark as S.${esc(f.category||f.specialCategory||'Category')}" style="flex:0 0 36px;display:flex;align-items:center;justify-content:center;border:1px solid ${f.sTag?'var(--primary)':'var(--border)'};border-radius:8px;background:${f.sTag?'var(--primary)':'var(--page)'};color:${f.sTag?'#fff':'var(--muted)'};font-size:13px;font-weight:700;cursor:pointer;">S</button>
          </div>
          <div class="cat-picker mb2">
            <select id="editCategory-${m.id}" onchange="onEditCategoryPicked(this.value)">
              <option value="" ${!f.category && !f.specialCategory?"selected":""}>Category</option>
              ${mergedCategoryOptionsHtml(f.specialCategory||f.category)}
            </select>
            <button type="button" title="Add, rename, or delete categories" onclick="openCategoryEditor()">Edit</button>
          </div>
          <div class="flex gap2 mb2">
            <input ${NOAC} id="editFormula-${m.id}" value="${esc(f.formula)}" oninput="onEditForm('formula',this.value)" placeholder="Formula / composition">
            <input ${NOAC} id="editMg-${m.id}" value="${esc(f.mg)}" oninput="onEditForm('mg',this.value)" placeholder="Strength (mg)">
          </div>
          <div class="flex gap2 mb2">
            <input ${NOAC} id="editMrp-${m.id}" type="text" inputmode="decimal" value="${esc(f.mrp)}" oninput="onEditForm('mrp',this.value)" placeholder="MRP per box">
            <input ${NOAC} id="editPpb-${m.id}" type="text" inputmode="numeric" value="${esc(f.pillsPerBox)}" oninput="onEditForm('pillsPerBox',this.value)" placeholder="Medicine per box">
          </div>
          <label class="small" style="color:var(--danger);">Current stock (medicine) — correct for expired, damaged, or missing medicine</label>
          <input ${NOAC} id="editStock-${m.id}" type="text" inputmode="numeric" value="${esc(f.stockPills)}" oninput="onEditForm('stockPills',this.value)" style="border-color:var(--danger);" class="mb2">
          <label class="small">Warn me when stock falls to (medicine)</label>
          <input ${NOAC} id="editLow-${m.id}" type="text" inputmode="numeric" value="${esc(f.lowStockAt)}" oninput="onEditForm('lowStockAt',this.value)" class="mb2">
          <div class="flex gap2 mt2">
            <button class="btn btn-outline flex1" onclick="openEdit('${m.id}')">Cancel</button>
            <button class="btn btn-primary flex1" onclick="saveEdit('${m.id}')">Save changes</button>
          </div>
        </div>`;
    }
    return `
      <div class="card">
        <div class="flex" style="justify-content:space-between;align-items:flex-start;">
          <div>
            <p class="item-title">${esc(m.name)}${m.category?` <span class="pill-badge" style="background:var(--primarySoft);color:var(--primary);font-size:10px;vertical-align:middle;">${m.sTag?'<span style="color:var(--danger);font-weight:700;">S.</span>':""}${esc(m.category)}</span>`:""}${m.specialCategory?` <span class="pill-badge" style="background:var(--warningSoft);color:var(--warning);font-size:10px;vertical-align:middle;">${m.sTag?'<span style="color:var(--danger);font-weight:700;">S.</span>':""}${esc(m.specialCategory)}</span>`:""}</p>
            ${(m.formula||m.mg)?`<p class="small" style="color:var(--primary);margin:2px 0 0;">${esc(m.formula)}${m.formula&&m.mg?' · ':''}${esc(m.mg)}</p>`:""}
            <p class="small faint" style="margin:2px 0 0;">${CURRENCY}${money(m.mrpPerBox)} / box · ${m.pillsPerBox} medicine · ${CURRENCY}${money(pricePerPill)}/medicine</p>
            <p class="small faint" style="margin:2px 0 0;">Warns at ${m.lowStockAt ?? 0} medicine${m.noWarn?" (warnings off)":""}</p>
          </div>
          <div class="flex gap1" style="align-items:center;flex-shrink:0;">
            ${m.formula?`<button onclick='searchInvByFormula(${JSON.stringify(m.formula)})' title="Find other medicines with this formula" style="background:var(--primarySoft);color:var(--primary);border:none;border-radius:999px;padding:5px 8px;font-size:10px;font-weight:700;cursor:pointer;white-space:nowrap;">🔎 S.formula</button>`:""}
            <button onclick="deleteMedicine('${m.id}')" class="icon-del-btn">🗑</button>
          </div>
        </div>
        <div class="flex mt2" style="justify-content:space-between;align-items:center;">
          <span class="pill-badge" style="background:${isExpired?'var(--dangerSoft)':(low?'var(--dangerSoft)':'var(--successSoft)')};color:${isExpired?'var(--danger)':(low?'var(--danger)':'var(--success)')};">${m.stockPills} medicine in stock${isExpired?" · expired":""}</span>
          <div class="flex gap2">
            <button class="btn btn-outline" style="padding:6px 12px;font-size:12px;color:var(--primary);border-color:var(--primarySoft);" onclick="toggleRestock('${m.id}')">Restock</button>
            <button class="btn btn-outline" style="padding:6px 12px;font-size:12px;border-radius:999px;" onclick="openEdit('${m.id}')">Edit</button>
          </div>
        </div>
        ${extra}
        ${activeBatches(m).length ? `
          <div class="mt2 divider-top8">
            <p class="small faint" style="margin:0 0 6px;">Batches (sold nearest-expiry first)</p>
            ${fefoOrder(m).map(b=>{

function visibleTransactions(){ return transactions.filter(t=>!t.deleted); }
function dayOptions(){
  const map = new Map();
  map.set(new Date().toDateString(), Date.now());
  const curMK = monthKeyOf(Date.now());
  visibleTransactions().forEach(t=>{
    if(monthKeyOf(t.timestamp)!==curMK) return; // older months are shown in the month/year folders below instead
    const k=new Date(t.timestamp).toDateString(); if(!map.has(k)) map.set(k,t.timestamp);
  });
  return Array.from(map.entries()).sort((a,b)=>b[1]-a[1]).map(([key,ts])=>({
    key, label: sameDay(ts,Date.now())?"Today":new Date(ts).toLocaleDateString(undefined,{day:"2-digit",month:"short",year:"numeric"})
  }));
}
function currentMonthTx(){ const curMK = monthKeyOf(Date.now()); return visibleTransactions().filter(t=>monthKeyOf(t.timestamp)===curMK); }
/* Manual correction: a number added on top of what's calculated from bills for a given
   month, kept separate from any single bill so it can never distort stock or a patient's
   record. Positive adds, negative subtracts. Defaults to 0 (no correction). */
function getMonthAdjustment(mk){
  const a = monthAdjustments[mk];
  return { doctorFee:(a&&a.doctorFee)||0, medTotal:(a&&a.medTotal)||0, testsTotal:(a&&a.testsTotal)||0, othersTotal:(a&&a.othersTotal)||0, updatedAt:(a&&a.updatedAt)||0 };
}
function monthAdjustedTotals(mk, tx){
  const computed = {
    medTotal: tx.reduce((s,t)=>s+((t.medTotal||0)-(t.medsDiscount||0)),0),
    feeTotal: tx.reduce((s,t)=>s+(t.doctorFee||0),0),
    testsTotal: tx.reduce((s,t)=>s+((t.testsTotal||0)-(t.testsDiscount||0)),0),
    extrasTotal: tx.reduce((s,t)=>s+(t.extrasTotal||0),0)
  };
  const adj = getMonthAdjustment(mk);
  const medTotal = computed.medTotal + adj.medTotal;
  const feeTotal = computed.feeTotal + adj.doctorFee;
  const testsTotal = computed.testsTotal + adj.testsTotal;
  const extrasTotal = computed.extrasTotal + adj.othersTotal;
  return { medTotal, feeTotal, testsTotal, extrasTotal, grandTotal: medTotal+feeTotal+testsTotal+extrasTotal, adj };
}
/* Same medicine/fee/tests/others split as monthAdjustedTotals(), but for a single day's
   transactions and with no manual correction applied — corrections are month-level only. */
function dayTotals(tx){
  const medTotal = tx.reduce((s,t)=>s+((t.medTotal||0)-(t.medsDiscount||0)),0);
  const feeTotal = tx.reduce((s,t)=>s+(t.doctorFee||0),0);
  const testsTotal = tx.reduce((s,t)=>s+((t.testsTotal||0)-(t.testsDiscount||0)),0);
  const extrasTotal = tx.reduce((s,t)=>s+(t.extrasTotal||0),0);
  return { medTotal, feeTotal, testsTotal, extrasTotal, grandTotal: medTotal+feeTotal+testsTotal+extrasTotal };
}

   Each of the 4 categories in the "Payments received" modal can be tapped to reveal a
   further split: medicines by name (qty + worth sold this month), doctor fee by day,
   tests by name (qty + worth, with the dates it was billed on), and others by day. */
function toggleBreakdownSection(section){

function monthMedicineDetail(mTx){
  const map = {};
  mTx.forEach(t=>{
    (t.items||[]).forEach(it=>{
      const k = it.name;
      if(!map[k]) map[k] = { name: it.name, medId: it.medId, qty:0, worth:0 };
      map[k].qty += Number(it.pills)||0;
      map[k].worth += Number(it.subtotal)||0;
    });
  });
  return Object.values(map).sort((a,b)=>b.worth-a.worth);
}
/* Once the pills sold cross a full box's worth for that medicine, show it as boxes +
   leftover loose medicine instead of a raw pill count — e.g. "2 boxes and 5 medicine"
   instead of "×25". Falls back to the plain "×N" form if the medicine can't be found
   (deleted with no id kept, or its box size was never set). */
function formatMedQtySold(qty, medId){
  const med = medId ? inventory.find(m=>m.id===medId) : null;
  const ppb = med ? Number(med.pillsPerBox)||0 : 0;
  if(ppb>0 && qty>=ppb){
    const boxes = Math.floor(qty/ppb);
    const rem = qty % ppb;
    const parts = [];
    if(boxes>0) parts.push(`${boxes} box${boxes===1?"":"es"}`);
    if(rem>0) parts.push(`${rem} medicine`);
    return parts.join(" and ");
  }
  return `×${qty}`;
}
function monthFeeDetail(mTx){
  const map = {};
  mTx.forEach(t=>{
    if(!t.doctorFee) return;
    const k = new Date(t.timestamp).toDateString();
    if(!map[k]) map[k] = { ts:t.timestamp, amount:0, count:0 };
    map[k].amount += Number(t.doctorFee)||0;
    map[k].count++;
  });
  return Object.values(map).sort((a,b)=>b.ts-a.ts);
}
function monthTestsDetail(mTx){
  const map = {};
  mTx.forEach(t=>{
    (t.tests||[]).forEach(te=>{
      const k = te.name;
      if(!map[k]) map[k] = { name: te.name, qty:0, worth:0, dates:[] };
      map[k].qty += 1;
      map[k].worth += Number(te.amount)||0;
      map[k].dates.push({ ts:t.timestamp, amount:Number(te.amount)||0 });
    });
  });
  return Object.values(map).sort((a,b)=>b.worth-a.worth);
}
function monthOthersDetail(mTx){
  const map = {};
  mTx.forEach(t=>{
    (t.extras||[]).forEach(ex=>{
      const k = new Date(t.timestamp).toDateString();
      if(!map[k]) map[k] = { ts:t.timestamp, amount:0, count:0 };
      map[k].amount += Number(ex.amount)||0;
      map[k].count++;
    });
  });
  return Object.values(map).sort((a,b)=>b.ts-a.ts);
}

        </button>
        ${can("monthlyTotal")?`<div style="padding:0 14px 10px;">
          <button class="btn btn-outline" style="width:100%;padding:8px;font-size:12px;" onclick="event.stopPropagation();openMonthBreakdown('${mk}')">📊 View breakdown</button>
        </div>`:""}
        ${open?`<div style="padding:0 14px 14px;">${sorted.map(renderTxCard).join("")}</div>`:""}
      </div>`;
  }

  const curYearMonths = monthEntries.filter(([mk,g])=>g.year===curYear);
  const pastYearsMap = new Map();
  monthEntries.filter(([mk,g])=>g.year!==curYear).forEach(([mk,g])=>{
    if(!pastYearsMap.has(g.year)) pastYearsMap.set(g.year, []);
    pastYearsMap.get(g.year).push([mk,g]);
  });
  const pastYears = Array.from(pastYearsMap.entries()).sort((a,b)=>b[0]-a[0]);

  const curYearHtml = curYearMonths.map(([mk,g])=>monthFolder(mk,g)).join("");

  const pastYearsHtml = pastYears.map(([year,months])=>{
    const openY = rec.expandedYear===String(year);
    const yTotal = months.reduce((s,[mk,g])=>s+g.tx.reduce((s2,t)=>s2+t.grandTotal,0),0);
    const yCount = months.reduce((s,[mk,g])=>s+g.tx.length,0);
    return `
      <div class="card" style="padding:0;overflow:hidden;background:var(--primarySoft);">
        <button onclick="toggleYearFolder('${year}')" style="width:100%;background:none;border:none;padding:14px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;">
          <div style="text-align:left;">
            <p class="item-title">🗂 ${year}</p>
            <p class="small faint" style="margin:2px 0 0;">${yCount} bill${yCount===1?"":"s"}</p>
          </div>
          <div class="flex gap2" style="align-items:center;">
            ${can("monthlyTotal")?`<span style="font-weight:700;font-size:14px;">${CURRENCY}${money(yTotal)}</span>`:""}
            <span class="chev" style="${openY?"transform:rotate(180deg);":""}"></span>
          </div>
        </button>
        ${openY?`<div style="padding:0 14px 14px;">${months.map(([mk,g])=>monthFolder(mk,g)).join("")}</div>`:""}
      </div>`;
  }).join("");

  return `
    <p class="small faint" style="font-weight:700;margin:18px 0 8px;">Earlier records</p>
    ${curYearHtml}
    ${pastYearsHtml}
  `;
}
function toggleExpand(id){ rec.expandedId = rec.expandedId===id?null:id; rec.editingId=null; rec.expandedTxSection=null; render(); }
function toggleTxSection(section){ rec.expandedTxSection = rec.expandedTxSection===section ? null : section; render(); }
function onRecordsSearch(v){ rec.searchQuery=v; rec.expandedId=null; rec.editingId=null; scheduleSearchRender(); }
function txDateSearchString(ts){
  const d = new Date(ts);
  return (d.toDateString()+" "+d.toLocaleDateString(undefined,{day:"2-digit",month:"short",year:"numeric"})+" "+d.toLocaleDateString()).toLowerCase();
}
function txMatchesQuery(t,q){
  if(!q) return true;
  return t.patientName.toLowerCase().includes(q) || txDateSearchString(t.timestamp).includes(q);
}
function shareDay(dayKey){
  const opts = dayOptions();
  const dayLabel = opts.find(d=>d.key===dayKey)?.label||"";
  const dayTx = visibleTransactions().filter(t=>new Date(t.timestamp).toDateString()===dayKey);
  const dayTotal = dayTx.reduce((s,t)=>s+t.grandTotal,0);
  const lines = [`📋 Patients attended — ${dayLabel}`, ``];
  dayTx.slice().reverse().forEach((t,i)=> lines.push(`${i+1}. ${t.patientName} — ${CURRENCY}${money(t.grandTotal)}`));
  lines.push(``, `Total (${dayTx.length} patients): ${CURRENCY}${money(dayTotal)}`);
  openShare(lines.join("\n"));
}
function deleteTx(id){
  askConfirm("Delete this bill record?", ()=>{
    // Soft-delete (tombstone) rather than removing it outright, so the deletion itself can
    // sync to other devices via updatedAt instead of the record quietly reappearing once
    // another device's data comes back in.
    const t = transactions.find(x=>x.id===id);
    if(t){ t.deleted = true; t.updatedAt = Date.now(); }
    saveTransactions(); render();
  });
}

/* ---- editing an existing bill ---- */
function openEditTx(id){
  const t = transactions.find(x=>x.id===id);
  if(!t) return;
  recEdit = { txId:id, patient:t.patientName, fee:String(t.doctorFee), items:t.items.map(it=>({...it})), query:"", pills:"", selectedMedId:null,
    extras:t.extras?t.extras.map(ex=>({...ex})):[], extrasTotal:t.extrasTotal||0,
    tests:t.tests?t.tests.map(x=>({...x})):[], testsTotal:t.testsTotal||0, testsDiscount:t.testsDiscount||0, feeDiscount:t.feeDiscount||0, medsDiscount:t.medsDiscount||0 };
  rec.editingId = id;
  rec.expandedId = null;
  render();
}
function cancelEditTx(){ rec.editingId=null; render(); }
function onEditTxPatient(v){ recEdit.patient=v; }
function onEditTxFee(v){ recEdit.fee=v; scheduleRender(); }
function onEditTxQuery(v){ recEdit.query=v; recEdit.selectedMedId=null; scheduleRender(); }
function onEditTxPills(v){ recEdit.pills=v; scheduleRender(); }
function pickEditTxMed(id){ recEdit.selectedMedId=id; const m=inventory.find(x=>x.id===id); recEdit.query=m?m.name:""; render(); }
function addEditTxItem(){
  const med = inventory.find(m=>m.id===recEdit.selectedMedId);
  const pills = Number(recEdit.pills);
  if(!med || !pills || pills<=0) return;
  const pricePerPill = nextBatchUnitPrice(med);
  recEdit.items.push({medId:med.id, name:med.name, pills, pricePerPill, subtotal:pricePerPill*pills});
  recEdit.selectedMedId=null; recEdit.query=""; recEdit.pills="";
  render();
}
function removeEditTxItem(idx){ recEdit.items.splice(idx,1); render(); }
function editTxMedTotal(){ return recEdit.items.reduce((s,it)=>s+it.subtotal,0); }
function editTxGrandTotal(){ return editTxMedTotal() - (recEdit.medsDiscount||0) + (Number(recEdit.fee)||0) - (recEdit.feeDiscount||0) + (recEdit.extrasTotal||0) + (recEdit.testsTotal||0) - (recEdit.testsDiscount||0); }
function saveEditTx(){
  const t = transactions.find(x=>x.id===recEdit.txId);
  if(!t || !recEdit.patient.trim()) return;
  // give back stock for the old items, then deduct stock for the new items
  t.items.forEach(oldIt=>{
    const med = inventory.find(m=>m.id===oldIt.medId);
    if(med) returnStock(med, oldIt.pills);
  });
  recEdit.items.forEach(newIt=>{
    const med = inventory.find(m=>m.id===newIt.medId);
    if(med) deductStock(med, newIt.pills);
  });
  saveInventory();
  t.patientName = recEdit.patient.trim();
  t.doctorFee = Number(recEdit.fee)||0;
  t.items = recEdit.items;
  t.medTotal = editTxMedTotal();
  t.medsDiscount = recEdit.medsDiscount||0;
  t.extras = recEdit.extras||[];
  t.extrasTotal = recEdit.extrasTotal||0;
  t.tests = recEdit.tests||[];
  t.testsTotal = recEdit.testsTotal||0;
  t.testsDiscount = recEdit.testsDiscount||0;
  t.feeDiscount = recEdit.feeDiscount||0;
  t.grandTotal = editTxGrandTotal();
  t.updatedAt = Date.now();
  saveTransactions();
  rec.editingId = null;
  render();
  showToast("✓ Bill updated");
}

function renderRecords(){
  if(visibleTransactions().length===0){
    document.getElementById("main").innerHTML = `<p class="small faint" style="text-align:center;padding:40px 0;">No bills recorded yet.</p>`;
    return;
  }

  const searchBar = `
    <div class="search-wrap mb2">
      <span class="search-icon">🔍</span>
      <input ${NOAC} id="recordsSearchInput" value="${esc(rec.searchQuery)}" oninput="onRecordsSearch(this.value)" placeholder="Search by patient name or date…">
    </div>`;

  const q = rec.searchQuery.trim().toLowerCase();
  if(q){
    const matched = visibleTransactions().filter(t=>txMatchesQuery(t,q)).sort((a,b)=>b.timestamp-a.timestamp);
    document.getElementById("main").innerHTML = searchBar +
      (matched.length===0
        ? `<p class="small faint" style="text-align:center;padding:32px 0;">No bills match "${esc(rec.searchQuery)}".</p>`
        : `<p class="small faint mb2">${matched.length} result${matched.length===1?"":"s"}</p>` + matched.map(renderTxCard).join(""));
    return;
  }

  const opts = dayOptions();

  const mTx = currentMonthTx();
  const mTotal = monthAdjustedTotals(monthKeyOf(Date.now()), mTx).grandTotal;
  const monthStat = can("monthlyTotal") ? `
    <button onclick="toggleMonthBreakdown()" class="card" style="background:var(--primarySoft);border:none;width:100%;text-align:left;cursor:pointer;padding:14px;">
      <div class="row">
        <span class="small" style="font-weight:700;color:var(--primary);">Total sales this month</span>
        <span style="font-weight:700;font-size:16px;color:var(--primary);">${CURRENCY}${money(mTotal)}</span>
      </div>
      <p class="small faint" style="margin:2px 0 0;">${mTx.length} bill${mTx.length===1?"":"s"} this month · tap for breakdown</p>
    </button>` : "";

  // Every day in the current month that has bills (plus today, even if empty) is shown
  // stacked here in one continuous list — most recent first — instead of behind a picker,
  // so previous days' records are visible without needing to select them from a dropdown.
  const daysHtml = opts.map(d=>{
    const dayTx = visibleTransactions().filter(t=>new Date(t.timestamp).toDateString()===d.key);
    const dayTotal = dayTx.reduce((s,t)=>s+t.grandTotal,0);
    const divideOpen = rec.expandedDayBreakdown===d.key;
    const dt = divideOpen ? dayTotals(dayTx) : null;
    return `
      <div class="card primary">
        <p style="font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.03em;color:var(--headerSub);margin:0 0 8px;">Single record — ${d.label}</p>
        ${dayTx.length===0 ? `<p style="color:var(--headerSub);font-size:14px;">No patients recorded for this day.</p>` :
          dayTx.slice().reverse().map((t,i)=>`
            <div class="row" style="margin-bottom:6px;font-size:14px;">
              <span>${i+1}. ${esc(t.patientName)}</span><span style="font-weight:700;">${CURRENCY}${money(t.grandTotal)}</span>
            </div>`).join("")
        }
        <div class="mt2" style="border-top:1px solid rgba(255,255,255,.3);padding-top:8px;">
          <div class="row big"><span>Total · ${dayTx.length} patients</span><span>${CURRENCY}${money(dayTotal)}</span></div>
        </div>
        ${dayTx.length>0?`
        <button onclick="toggleDayBreakdown('${d.key}')" class="flex gap1" style="width:100%;background:none;border:none;color:#fff;opacity:.9;padding:8px 0 0;margin:0;cursor:pointer;font-size:12px;font-weight:600;align-items:center;justify-content:center;">
          Sales divide
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="transform:rotate(${divideOpen?180:0}deg);transition:transform .15s;"><polyline points="6 9 12 15 18 9"></polyline></svg>
        </button>` : ""}
        ${divideOpen ? `
        <div class="mt2" style="border-top:1px solid rgba(255,255,255,.3);padding-top:8px;">
          <div class="row" style="font-size:13px;padding:4px 0;"><span>💊 Medicine</span><span style="font-weight:700;">${CURRENCY}${money(dt.medTotal)}</span></div>
          <div class="row" style="font-size:13px;padding:4px 0;"><span>🧪 Tests</span><span style="font-weight:700;">${CURRENCY}${money(dt.testsTotal)}</span></div>
          <div class="row" style="font-size:13px;padding:4px 0;"><span>🩺 Doctor fee</span><span style="font-weight:700;">${CURRENCY}${money(dt.feeTotal)}</span></div>
          <div class="row" style="font-size:13px;padding:4px 0;"><span>📋 Others</span><span style="font-weight:700;">${CURRENCY}${money(dt.extrasTotal)}</span></div>
        </div>` : ""}
        ${dayTx.length>0?`<button class="btn mt3" style="width:100%;background:rgba(255,255,255,.18);color:#fff;" onclick="shareDay('${d.key}')">📤 Share this day's record</button>`:""}
      </div>
      ${dayTx.map(renderTxCard).join("")}
    `;
  }).join("");

  document.getElementById("main").innerHTML = searchBar + monthStat + daysHtml + renderRecordArchive();
}

/* ===================== USERS / ROLES / LOGIN ===================== */
function visibleProfiles(){ return profiles.filter(p=>!p.deleted); }
function currentRole(){
  const p = profiles.find(x=>x.id===currentProfileId);
  return p ? p.role : null;
}
/* Small badge in the fixed header showing whoever is currently logged in on this device
   and their role, so on a shared device it's obvious who's signed in and what they can see
   (e.g. why the monthly-total breakdown might be missing for a receptionist). Cleared
   during the setup/login screens since nobody is authed yet at that point. */
function roleLabel(role){
  if(role==="admin") return "Admin";
  if(role==="semiadmin") return "Semi-Admin";
  if(role==="doctor") return "Doctor";
  if(role==="receptionist") return "Receptionist";
  return role ? esc(role) : "";
}
function renderUserBadge(){
  const el = document.getElementById("currentUserBadge");
  if(!el) return;
  if(!sessionAuthed || !currentProfileId){ el.innerHTML=""; return; }
  const p = profiles.find(x=>x.id===currentProfileId);
  if(!p){ el.innerHTML=""; return; }
  // Plain inline flow (not flex) so a long name that wraps to a second line just carries the
  // "· ROLE" bit along with its last word, instead of a flex row centering the pill vertically
  // across the whole wrapped block (which floats it oddly between the two lines).
  el.innerHTML = `<span style="font-weight:700;">${esc(p.name)}</span> <span style="opacity:.6;">·</span> <span style="display:inline-block;background:rgba(255,255,255,.22);padding:2px 8px;border-radius:999px;font-size:11px;font-weight:700;letter-spacing:.02em;text-transform:uppercase;white-space:nowrap;">${roleLabel(p.role)}</span>`;
}
// The 3 gated actions: Printer Settings + Receipt setup are Admin-only by default; the Monthly
// Total Sales summary is hidden from Receptionist by default. Semi-Admin gets none of these
// unless the Admin explicitly ticks them on for that person (stored per-profile in
// `privileges`); Manage Users is never available to Semi-Admin no matter what's ticked — that's
// checked first, before any role branching, so it can never be granted. Everything else (New
// Bill, Records view/edit, daily/individual sales, Inventory view+edit, Backup, Notepad) stays
// open to every role.
function can(action){
  const role = currentRole();
  if(action==="manageUsers") return role==="admin";
  if(role==="admin") return true;
  if(role==="semiadmin"){
    const p = profiles.find(x=>x.id===currentProfileId);
    const priv = (p && p.privileges) || {};
    if(action==="printer") return !!priv.printer;
    if(action==="receiptSetup") return !!priv.receiptSetup;
    if(action==="monthlyTotal") return !!priv.monthlyTotal;
    return true;
  }
  if(action==="printer") return false;
  if(action==="receiptSetup") return false;
  if(action==="monthlyTotal") return role==="doctor";
  return true;
}
function activateProfile(id){
  currentProfileId = id;
  sessionAuthed = true;
  try{
    localStorage.setItem("clinic_current_profile", id);
    localStorage.setItem("clinic_session_authed", "1");
  }catch(e){}
  loadNotesForCurrentProfile();
}

async function submitSetupAdmin(){
  const name = setupUi.name.trim();

  const answer = setupUi.answer.trim();

  if(!question){ showToast("Choose or type a security question"); return; }

  const code = genRecoveryCode();
  const [answerHash, codeHash] = await Promise.all([
    hashSecret(normalizeAnswer(answer)),

  ]);
  const p = { id:uid(), name, role:"admin", pin, securityQuestion:question, securityAnswerHash:answerHash, recoveryCodeHash:codeHash, updatedAt:Date.now() };

  setupUi.step = "code";

function addUserProfile(){
  if(!can("manageUsers")) return;
  const name = manageUi.newName.trim();
  const pin = manageUi.newPin.trim();
  if(!name){ showToast("Enter a name first"); return; }
  if(pin.length<4){ showToast("Choose a PIN with at least 4 digits"); return; }
  // New accounts can never be created as Admin (only one Admin can exist, transferred via
  // the "make Admin" flow on an existing account) — defensive fallback if role is ever admin.
  const role = manageUi.newRole==="admin" ? "receptionist" : manageUi.newRole;
  if(role==="semiadmin"){
    // Granting Semi-Admin (and whichever privileges are ticked) needs the Admin's own PIN to
    // confirm, same as any other sensitive permission change — the account isn't created yet.
    openPrivilegeConfirm("add", { name, role, pin, privileges: { ...manageUi.newPrivileges } });
    return;
  }
  const p = { id:uid(), name, role, pin, updatedAt:Date.now() };
  profiles.push(p);
  saveProfiles();
  manageUi.addingUser=false;
  showToast(`✓ ${name} added`);

function startEditUser(id){
  const p = profiles.find(x=>x.id===id);
  if(!p) return;
  manageUi.editingId = id;
  manageUi.editRole = p.role;
  manageUi.editPin = p.pin || "";
  manageUi.editPrivileges = Object.assign({printer:false, receiptSetup:false, monthlyTotal:false}, p.privileges||{});
  render();

function onEditUserRole(v){ manageUi.editRole=v; render(); }

function onEditUserPrivilegeToggle(key){ manageUi.editPrivileges[key] = !manageUi.editPrivileges[key]; render(); }
function saveEditUser(){
  if(!can("manageUsers")) return;
  const p = profiles.find(x=>x.id===manageUi.editingId);
  if(!p) return;
  if(manageUi.editPin.trim().length<4){ showToast("PIN must be at least 4 digits"); return; }
  if(p.role==="admin" && manageUi.editRole!=="admin" && visibleProfiles().filter(x=>x.role==="admin").length<=1){
    showToast("Can't demote the only Admin account");
    return;
  }
  if(p.role!=="admin" && manageUi.editRole==="admin"){
    // Making someone else Admin is a transfer, not a simple edit: only one Admin can exist at a
    // time, so this hands off Admin status rather than adding a second one — and it can only be
    // done using the current Admin's own PIN, confirmed in a separate step below.
    openAdminTransferConfirm(p.id, manageUi.editPin.trim());
    return;
  }
  if(manageUi.editRole==="semiadmin"){
    // Setting or updating Semi-Admin privileges always needs the Admin's own PIN to confirm.
    openPrivilegeConfirm("edit", { id:p.id, role:"semiadmin", pin:manageUi.editPin.trim(), privileges: { ...manageUi.editPrivileges } });
    return;
  }
  p.role = manageUi.editRole;
  p.pin = manageUi.editPin.trim();
  if(p.privileges) delete p.privileges; // no longer Semi-Admin, drop stale privilege flags
  p.updatedAt = Date.now();
  saveProfiles();
  manageUi.editingId=null;
  showToast("✓ Updated");
  render();
}

let adminTransferUi = { open:false, targetId:"", targetNewPin:"", actorPin:"", error:"" };

  const actor = profiles.find(x=>x.id===currentProfileId);

  if((actor.pin||"") !== adminTransferUi.actorPin){

  showToast(`✓ ${target.name} is now Admin`);

function deleteProfile(id){
  if(!can("manageUsers")) return;
  const p = profiles.find(x=>x.id===id);
  if(!p) return;
  if(p.role==="admin" && visibleProfiles().filter(x=>x.role==="admin").length<=1){
    showToast("Can't remove the only Admin account");
    return;
  }
  askConfirm(`Remove "${p.name}"? They will no longer be able to log in, and their private notes will be deleted. This cannot be undone.`, ()=>{
    // Soft-delete (tombstone) so the removal itself can sync to other devices, same as
    // medicines/bills/notes — otherwise it just reappears once another device's data syncs back.
    p.deleted = true; p.updatedAt = Date.now();
    saveProfiles();
    try{ localStorage.removeItem("clinic_notes_"+id); }catch(e){}
    if(currentProfileId===id){
      // They just removed their own currently-logged-in account — force a fresh login rather
      // than leaving a dangling identity or silently switching to someone else's account.
      currentProfileId = null;
      sessionAuthed = false;
      try{
        localStorage.removeItem("clinic_current_profile");
        localStorage.setItem("clinic_session_authed", "0");
      }catch(e){}
      loadNotesForCurrentProfile();
    }
    manageUi.editingId=null;
    render();
  });
}

function manageRecoveryInfo(id){
  if(!can("manageUsers")) return;
  const p = profiles.find(x=>x.id===id);
  if(!p || p.role!=="admin") return;
  const presetMatch = SECURITY_QUESTIONS.includes(p.securityQuestion);
  recoveryUi = {
    open:true, profileId:id, step:"form",
    question: p.securityQuestion ? (presetMatch?p.securityQuestion:"custom") : SECURITY_QUESTIONS[0],
    customQuestion: (p.securityQuestion && !presetMatch) ? p.securityQuestion : "",
    answer:"", generatedCode:""
  };
  render();
}

async function submitRecoveryInfo(){
  const p = profiles.find(x=>x.id===recoveryUi.profileId);
  if(!p){ closeRecoveryModal(); return; }
  const question = (recoveryUi.question==="custom" ? recoveryUi.customQuestion.trim() : recoveryUi.question);
  const answer = recoveryUi.answer.trim();
  if(!question){ showToast("Choose or type a security question"); return; }
  if(!answer){ showToast("Enter an answer to your security question"); return; }
  const code = genRecoveryCode();
  const [answerHash, codeHash] = await Promise.all([
    hashSecret(normalizeAnswer(answer)),
    hashSecret(normalizeCode(code))
  ]);
  p.securityQuestion = question;
  p.securityAnswerHash = answerHash;
  p.recoveryCodeHash = codeHash;
  p.updatedAt = Date.now();
  saveProfiles();
  recoveryUi.step = "code";
  recoveryUi.generatedCode = code;
  render();
}

  const name = (profiles.find(x=>x.id===recoveryUi.profileId)||{}).name || "";

/* ===================== BACKUP & RESTORE ===================== */
/* Everything in this app already lives in the phone's storage (localStorage), which
   survives closing the app/browser and restarting the phone. The real risk is someone
   clearing browser/site data, or reinstalling the browser — that does wipe it. Export
   makes a real file in your phone's Downloads/Files app, completely outside the
   browser, so you always have a copy to restore from no matter what happens to it. */
function mergeById(localArr, incomingArr){
  const map = new Map();
  (localArr||[]).forEach(x=>map.set(x.id,x));
  (incomingArr||[]).forEach(x=>{ if(!map.has(x.id)) map.set(x.id,x); });
  return Array.from(map.values());
}
function mergeInventory(localInv, incomingInv){
  const result = (localInv||[]).map(m=>({...m, batches:(m.batches||[]).slice()}));
  (incomingInv||[]).forEach(im=>{
    let match = result.find(m=>m.id===im.id);
    if(!match) match = result.find(m=>m.name.trim().toLowerCase()===im.name.trim().toLowerCase());
    if(match){
      match.batches = mergeById(match.batches, im.batches);
      match.category = match.category || im.category || "";
      match.specialCategory = match.specialCategory || im.specialCategory || "";
      match.formula = match.formula || im.formula || "";
      match.mg = match.mg || im.mg || "";
      match.deleted = match.deleted || im.deleted;
      recomputeStock(match);
    } else {
      const copy = {...im, batches:(im.batches||[]).slice()};
      recomputeStock(copy);
      result.push(copy);
    }
  });
  return result;
}
/* ---- LIVE-SYNC-ONLY reconciliation ----
   mergeInventory (above) is deliberately additive/never-overwrite: it's built for the offline
   backup file, which combines two phones that may have been apart for weeks, so it must never
   let one side's file silently clobber real edits the other side made. Live cloud sync is a
   different problem — it's the same shared dataset, seconds apart, and a sale/restock/edit on
   one phone MUST overwrite the stale copy on the other. So for the cloud path we reconcile by
   "whoever touched it most recently wins", using the updatedAt timestamps stamped on every
   medicine-level edit and every batch-level stock change. */
function reconcileBatchesForSync(localBatches, remoteBatches){
  const remoteMap = new Map((remoteBatches||[]).map(b=>[b.id,b]));
  const seen = new Set();
  const result = (localBatches||[]).map(lb=>{
    seen.add(lb.id);
    const rb = remoteMap.get(lb.id);
    if(!rb) return lb; // batch only exists locally (e.g. restocked here) — keep it
    const lt = lb.updatedAt||lb.addedAt||0, rt = rb.updatedAt||rb.addedAt||0;
    return rt>lt ? {...rb} : lb; // newer side's version of THIS batch wins
  });
  (remoteBatches||[]).forEach(rb=>{
    if(!seen.has(rb.id)) result.push({...rb}); // batch only exists remotely — add it
  });
  return result;
}
function pickNewerMedicine(a,b){
  // Scalar fields (name/price/etc.) come from whichever side edited most recently.
  // Batches (actual stock) are reconciled independently and separately above, so a restock
  // never gets lost just because the OTHER device happens to "win" on the scalar fields.
  const aT = a.updatedAt||0, bT = b.updatedAt||0;
  const base = aT>=bT ? a : b;
  return {
    id: a.id, name: base.name, category: base.category||"", specialCategory: base.specialCategory||"", formula: base.formula||"", mg: base.mg||"",
    mrpPerBox: base.mrpPerBox, pillsPerBox: base.pillsPerBox,
    lowStockAt: base.lowStockAt, noWarn: !!base.noWarn, sTag: !!base.sTag, deleted: !!base.deleted,
    updatedAt: Math.max(aT,bT),
    batches: reconcileBatchesForSync(a.batches, b.batches)
  };
}
function reconcileInventoryForSync(localInv, remoteInv){
  const remoteMap = new Map((remoteInv||[]).map(m=>[m.id,m]));
  const seen = new Set();
  const result = (localInv||[]).map(lm=>{
    seen.add(lm.id);
    const rm = remoteMap.get(lm.id);
    return rm ? pickNewerMedicine(lm, rm) : lm;
  });
  (remoteInv||[]).forEach(rm=>{
    if(!seen.has(rm.id)) result.push({...rm, batches:(rm.batches||[]).slice()});
  });
  result.forEach(recomputeStock);
  return result;
}
// Last-write-wins merge by id, for the LIVE cloud path only (bills, notes, profiles). Unlike
// mergeById (additive-only — used by the offline backup file, see below), this actually lets a
// newer edit or a soft-delete tombstone on one device overwrite the stale copy on another,
// instead of the always-newer local/remote scan just re-adding whatever the other side still has.
function mergeByIdForSync(localArr, incomingArr){
  const incomingMap = new Map((incomingArr||[]).map(x=>[x.id,x]));
  const seen = new Set();
  const result = (localArr||[]).map(l=>{
    seen.add(l.id);
    const r = incomingMap.get(l.id);
    if(!r) return l;
    const lt = l.updatedAt||l.timestamp||0, rt = r.updatedAt||r.timestamp||0;
    return rt>lt ? r : l;
  });
  (incomingArr||[]).forEach(r=>{ if(!seen.has(r.id)) result.push(r); });
  return result;
}
// Monthly correction totals are a plain {month: {...}} object, not an id-keyed array, so they
// get their own merge: per month key, keep whichever side's correction was saved most recently.
// Simple scalar setting, same last-write-wins shape as everything else here: whichever side
// touched it more recently wins outright — no need for per-field merging like the test
// catalog has, since it's a single number, not a list of independent items.
function mergeDefaultDoctorFee(data){
  const incomingTs = data.defaultDoctorFeeUpdatedAt || 0;
  if(incomingTs > defaultDoctorFeeUpdatedAt){
    defaultDoctorFee = data.defaultDoctorFee || 0;
    defaultDoctorFeeUpdatedAt = incomingTs;
    saveDefaultDoctorFeeStorage();
    saveDefaultDoctorFeeUpdatedAt();
    // bill.fee is copied from defaultDoctorFee only once, at the moment a New Bill screen is
    // created (see newBillState()) — usually before sync has even had a chance to run, since
    // that happens at app startup. So defaultDoctorFee itself merging correctly isn't enough:
    // the already-displayed fee field has no way to react to a value that arrives later and
    // would otherwise keep showing a stale number forever, until the user happened to start a
    // brand new bill or edit the fee by hand. Refresh it now — but ONLY when the current bill
    // is still completely untouched (no patient, no items/tests/extras, not mid-edit), so a
    // bill the user has actually started is never silently changed under them.
    if(typeof bill!=="undefined" && bill && !bill.patient.trim() && bill.items.length===0 && bill.extras.length===0 && bill.tests.length===0 && !bill.feeEditing){
      bill.fee = defaultDoctorFee ? String(defaultDoctorFee) : "";
    }
  }
}
function mergeDefaultDoctorName(data){
  const incomingTs = data.defaultDoctorNameUpdatedAt || 0;
  if(incomingTs > defaultDoctorNameUpdatedAt){
    const oldDefault = defaultDoctorName;
    defaultDoctorName = data.defaultDoctorName || "";
    defaultDoctorNameUpdatedAt = incomingTs;
    saveDefaultDoctorNameStorage();
    saveDefaultDoctorNameUpdatedAt();
    // Same reasoning as mergeDefaultDoctorFee, but comparing against the OLD default rather than
    // requiring an exact "" — a bill created before this sync arrived is already pre-filled with
    // whatever the default WAS at that moment, not blank, so requiring "" here meant a bill
    // already open when a newer default name arrived from another device just kept showing the
    // stale name until a brand new bill was started. Comparing against oldDefault instead means
    // "still exactly what the (old) default put there, never touched by the user" refreshes too.
    if(typeof bill!=="undefined" && bill && !bill.patient.trim() && bill.items.length===0 && bill.extras.length===0 && bill.tests.length===0 && bill.remarks===oldDefault){
      bill.remarks = defaultDoctorName || "";
    }
  }
}
function mergeMonthAdjustments(localAdj, incomingAdj){
  const result = {...(localAdj||{})};
  Object.entries(incomingAdj||{}).forEach(([mk,ia])=>{
    const la = result[mk];
    if(!la || (ia.updatedAt||0) > (la.updatedAt||0)) result[mk] = ia;
  });
  return result;
}
// Test catalog & pricing (custom tests, renamed/hidden built-ins, and prices) is synced, one
// test at a time, by that test's own testItemUpdatedAt entry — NOT as one all-or-nothing
// bundle. The old version compared a single shared timestamp for the whole catalog, so if
// Phone A added "Uric Acid" (bumping the shared time) while Phone B had, at any point, made
// its OWN unrelated test edit with a later timestamp, B's next sync would completely
// overwrite the catalog with its own version — silently discarding Uric Acid and anything
// else A had added or priced, and vice-versa. Comparing per test id instead means each
// test's own history decides its own outcome, so two devices' different additions/prices
// combine instead of one wiping out the other.
function mergeTestSettings(data){
  const incomingItemTs = data.testItemUpdatedAt || {};
  // Old backup files / not-yet-updated devices have no per-id times at all — for those,
  // fall back to their whole-bundle time as a stand-in per-id time for every id they have
  // data for, so merging against them still behaves sensibly.
  const incomingBundleTs = data.testSettingsUpdatedAt || 0;
  const incomingCustomById = {}; (data.customTests||[]).forEach(t=>{ incomingCustomById[t.id]=t; });
  const localCustomById = {}; customTests.forEach(t=>{ localCustomById[t.id]=t; });
  const incomingNameOverrides = data.testNameOverrides || {};
  const incomingHiddenSet = new Set(data.hiddenBuiltInTestIds || []);
  const localHiddenSet = new Set(hiddenBuiltInTestIds);
  const incomingPrices = data.testPrices || {};

  const ids = new Set([
    ...TEST_CATALOG.map(t=>t.id),
    ...customTests.map(t=>t.id),
    ...(data.customTests||[]).map(t=>t.id)
  ]);

  const mergedCustomById = {};
  const mergedNameOverrides = {};
  const mergedHidden = [];
  const mergedPrices = {};
  const mergedItemTs = {...testItemUpdatedAt};

  ids.forEach(id=>{
    const localTs = testItemUpdatedAt[id] || 0;
    const hasIncomingData = incomingCustomById[id]!=null || incomingNameOverrides[id]!=null || incomingHiddenSet.has(id) || incomingPrices[id]!=null;
    const inTs = incomingItemTs[id] || (hasIncomingData ? incomingBundleTs : 0);
    const incomingWins = inTs > localTs;
    mergedItemTs[id] = incomingWins ? inTs : localTs;

    const winningCustom = incomingWins ? incomingCustomById[id] : localCustomById[id];
    if(winningCustom) mergedCustomById[id] = winningCustom;

    const winningOverride = incomingWins ? incomingNameOverrides[id] : testNameOverrides[id];
    if(winningOverride!=null) mergedNameOverrides[id] = winningOverride;

    const winningHidden = incomingWins ? incomingHiddenSet.has(id) : localHiddenSet.has(id);
    if(winningHidden) mergedHidden.push(id);

    const winningPrice = incomingWins ? incomingPrices[id] : testPrices[id];
    if(winningPrice!=null) mergedPrices[id] = winningPrice;
  });

  customTests = Object.values(mergedCustomById);
  testNameOverrides = mergedNameOverrides;
  hiddenBuiltInTestIds = mergedHidden;
  testPrices = mergedPrices;
  testItemUpdatedAt = mergedItemTs;
  testSettingsUpdatedAt = Math.max(testSettingsUpdatedAt, incomingBundleTs); // legacy marker only

  saveCustomTests(); saveTestNameOverrides(); saveHiddenBuiltInTests(); saveTestPrices(); saveTestSettingsUpdatedAt(); saveTestItemUpdatedAt();
}

function mergeDataInto(data, inventoryMergeFn, live){
  inventory = inventoryMergeFn(inventory, data.inventory);

  if(live){
    transactions = mergeByIdForSync(transactions, data.transactions);
  } else {
    transactions = mergeById(transactions, data.transactions);
  }
  transactions.sort((a,b)=>b.timestamp-a.timestamp);

  if(live){
    profiles = mergeByIdForSync(profiles, data.profiles);
  } else {
    const profResult = (profiles||[]).slice();
    (data.profiles||[]).forEach(ip=>{
      let match = profResult.find(p=>p.id===ip.id);
      if(!match) match = profResult.find(p=>p.name.trim().toLowerCase()===ip.name.trim().toLowerCase());
      if(!match) profResult.push(ip);
    });
    profiles = profResult;
  }

  const incomingNotes = data.notesByProfile || {};
  profiles.forEach(p=>{
    let localNotes;
    try{ localNotes = JSON.parse(localStorage.getItem("clinic_notes_"+p.id)||"[]"); }catch(e){ localNotes=[]; }
    const merged = live ? mergeByIdForSync(localNotes, incomingNotes[p.id]) : mergeById(localNotes, incomingNotes[p.id]);
    merged.sort((a,b)=>(b.updatedAt||0)-(a.updatedAt||0));
    try{ localStorage.setItem("clinic_notes_"+p.id, JSON.stringify(merged)); }catch(e){}
  });

  // Monthly corrections: keyed by month, not an array of records — for each month, whichever
  // side touched it most recently wins. Safe either way since it's just an override number,
  // never a quantity that could be double-counted or lost.
  monthAdjustments = mergeMonthAdjustments(monthAdjustments, data.monthAdjustments);
  mergeTestSettings(data);
  mergeDefaultDoctorFee(data);
  mergeDefaultDoctorName(data);

  saveInventory(); saveTransactions(); saveProfiles(); saveMonthAdjustments();
  if(currentProfileId && !visibleProfiles().some(p=>p.id===currentProfileId)){
    // The logged-in profile was deleted (e.g. by an admin on another device) — force a re-login
    // rather than silently auto-picking a different profile, since that would bypass the PIN gate.
    currentProfileId = null;
    sessionAuthed = false;
    try{ localStorage.setItem("clinic_session_authed", "0"); }catch(e){}
  }
  loadNotesForCurrentProfile();
}
// Offline backup file import — unchanged, additive/never-overwrite merge. Two phones may have
// been apart for weeks, so this must never let one side's file silently delete or clobber
// something real the other side entered independently.
function mergeBackupInto(data){ mergeDataInto(data, mergeInventory, false); }
// Live Firestore sync — last-write-wins for inventory, bills, notes, and profiles, so an edit,
// restock, sale, warning toggle, or DELETE made on one phone correctly propagates to the other
// instead of being silently ignored (or the deleted item quietly reappearing a second later).
function mergeCloudSnapshotInto(data){ mergeDataInto(data, reconcileInventoryForSync, true); }

  el.textContent = (bytes!=null && fbDb) ? `(${formatBytes(bytes)})` : "";
}
function formatSyncError(e){
  if(!e) return "Unknown error";
  const code = e.code ? `[${e.code}] ` : "";
  const msg = e.message || String(e);
  return code + msg;
}
function setSyncError(e){
  lastSyncError = formatSyncError(e);
  renderSyncBanner();
}
function clearSyncError(){
  if(!lastSyncError) return;
  lastSyncError = null;
  renderSyncBanner();
}
function dismissSyncError(){ lastSyncError = null; renderSyncBanner(); }
function copySyncError(){
  if(!lastSyncError) return;
  const text = lastSyncError;
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(()=>showToast("✓ Error copied")).catch(()=>showToast(text));
  } else { showToast(text); }
}
function renderSyncBanner(){
  const el = document.getElementById("banner");
  if(!el) return;
  if(!lastSyncError){ el.style.display="none"; el.innerHTML=""; return; }
  el.style.display="flex";
  el.innerHTML = `
    <span style="flex:1;word-break:break-word;">⚠ Cloud sync problem: ${esc(lastSyncError)}</span>
    <button onclick="copySyncError()" style="background:none;border:1px solid currentColor;border-radius:6px;padding:2px 8px;font-size:11px;font-weight:700;color:inherit;cursor:pointer;">Copy</button>
    <button onclick="dismissSyncError()" style="background:none;border:none;color:inherit;font-weight:700;cursor:pointer;font-size:14px;">✕</button>`;
}
function applyRemoteSnapshot(data){
  if(!data) return;
  suppressPush = true;
  mergeCloudSnapshotInto(data);
  suppressPush = false;
  render();
}
function schedulePushToCloud(){
  if(!fbDb || suppressPush) return;
  clearTimeout(syncDebounceTimer);
  syncDebounceTimer = setTimeout(pushToCloud, 1200);
}
// Wraps a Firestore promise so a genuinely dead connection resolves to "Offline" within 10s
// instead of hanging forever — Firestore's own promises don't reject when offline, they just
// never resolve, which is exactly what forced a manual refresh to recover before.
function withTimeout(promise, ms){
  return Promise.race([
    promise,
    new Promise((_,reject)=>setTimeout(()=>reject(new Error("timed out")), ms))
  ]);
}
// Firestore rejects any field whose value is literally `undefined` (unlike `null`, which is
// fine) and rejects the ENTIRE write the moment it finds one, however deeply buried. The bugs
// above (missing category/formula/mg on older medicine records) were one way that could sneak
// in — this is a safety net so no other undiscovered case can silently break every sync again.
// A JSON round-trip is a simple, thorough way to strip these out anywhere in the structure:
// it drops undefined object properties and turns undefined array entries into null, both of
// which Firestore accepts fine.
function sanitizeForFirestore(obj){ return JSON.parse(JSON.stringify(obj)); }
// Manual "Upload offline data" menu action — forces an immediate push right now instead of
// waiting for the normal 1.2s debounce or the next edit, for someone who was working offline
// and wants to confirm everything (bills, inventory, warnings, etc.) has reached the server.
function showUploadProgress(){
  const el = document.getElementById("uploadProgressBar");
  if(el) el.classList.remove("hidden");
  syncHeaderOffset();
}
function hideUploadProgress(){
  const el = document.getElementById("uploadProgressBar");
  if(el) el.classList.add("hidden");
  syncHeaderOffset();
}
async function manualPushToCloud(){
  if(!fbDb){ showToast("Cloud sync isn't set up on this device"); return; }
  clearTimeout(syncDebounceTimer);
  showToast("⬆ Uploading…");
  showUploadProgress();
  try{
    await pushToCloud();
    // If a push was already running when this was tapped, pushToCloud() above just queued a
    // follow-up and returned immediately rather than actually finishing — wait for that queued
    // one too, so the toast reflects the real end result instead of firing too early.
    while(pushQueuedAgain || pushInFlight){ await new Promise(r=>setTimeout(r,200)); }
    showToast(syncStatus==="synced" ? "✓ Uploaded — everything is synced" : "⚠ Still couldn't reach the server — check your connection and try again");
  } finally {
    hideUploadProgress();
  }
}
async function pushToCloud(){
  if(!fbDb) return;
  if(pushInFlight){
    // Another push is already running (e.g. the reconnect-listener and the manual "Upload
    // offline data" button both fired around the same time). Don't run a second overlapping
    // read-then-write cycle — just remember to run one more push right after this one finishes,
    // so whatever changed most recently still gets sent, without two pushes racing each other.
    pushQueuedAgain = true;
    return;
  }
  pushInFlight = true;
  // If we were already showing "Synced" before this push (e.g. right after completing a
  // bill), keep showing "Synced" through the push instead of flashing "Syncing…" — the
  // badge should only visibly change if something actually goes wrong (see catch below).
  // A push starting from any other state (offline/cached/error/initial) still shows the
  // normal "Syncing…" transition, since that's a real state change worth surfacing.
  const wasSynced = (syncStatus === "synced");
  if(!wasSynced){ syncStatus = "syncing"; renderSyncBadge(); }
  try{
    const snap = await withTimeout(cloudDocRef().get(), 10000);
    if(snap.exists) { suppressPush=true; mergeCloudSnapshotInto(snap.data()); suppressPush=false; }
    await withTimeout(cloudDocRef().set(sanitizeForFirestore(buildFullStatePayload())), 10000);
    syncStatus = "synced";
    clearSyncError();
  }catch(e){ syncStatus = "offline"; setSyncError(e); }
  pushInFlight = false;
  renderSyncBadge();
  if(pushQueuedAgain){ pushQueuedAgain = false; pushToCloud(); }
}
// The realtime onSnapshot listener needs a persistent connection, which some mobile browser
// contexts (especially a file opened directly rather than through an app with an already-warm
// connection) are slow to establish or don't establish at all — leaving the screen showing
// blank/default data indefinitely even though the real data is sitting right there in the
// cloud. A plain one-off request doesn't need that persistent connection and gets through in
// those same conditions (this is exactly why adding a test — which triggers pushToCloud()'s own
// one-off get() — immediately "fixed" the display: the listener was still stuck, but a plain
// fetch wasn't). Doing the same one-off fetch proactively at startup means real data shows up
// right away without needing any interaction to force it.
async function initialCloudFetch(){
  if(!fbDb) return;
  try{
    const snap = await withTimeout(cloudDocRef().get(), 10000);
    if(snap.exists) applyRemoteSnapshot(snap.data());
  }catch(e){
    // No special handling needed — the realtime listener below keeps retrying regardless,
    // and this was only ever a best-effort head start.
  }
}
function startCloudSync(){
  if(!fbDb) { syncStatus="offline"; renderSyncBadge(); return; }
  if(snapshotUnsubscribe){ snapshotUnsubscribe(); snapshotUnsubscribe = null; }
  syncStatus="syncing"; renderSyncBadge();
  initialCloudFetch();  snapshotUnsubscribe = cloudDocRef().onSnapshot(
    snap=>{
      if(snap.exists) applyRemoteSnapshot(snap.data());
      // Firestore fires this listener once immediately from local cache (even with zero
      // internet) and again later once it actually reaches the server. Without checking
      // fromCache, the badge would say "Synced" on that first cache-only firing even while
      // fully offline. Only the non-cache firing means data has actually been confirmed
      // against the server.
      //
      // While pushToCloud() is actively driving the badge for a write we just made, this
      // listener stands down completely and lets pushToCloud() set the definitive final
      // status itself. Otherwise this listener is the source of truth — e.g. a change
      // arriving live from another device, or a genuine, ongoing offline state.
      if(!pushInFlight){
        syncStatus = snap.metadata.fromCache ? "cached" : "synced";
        renderSyncBadge();
        if(!snap.metadata.fromCache) clearSyncError();
      }
    },
    async err=>{
      // This is the FIRST real error Firestore reported for the listener itself — surface it
      // immediately, since it's often more informative than whatever the retry below hits.
      setSyncError(err);
      // A single failed listener attempt does NOT tell us the document is missing — it could
      // just as easily be a transient network blip, which happens especially often right when
      // the app first loads (e.g. opened directly as a local file, before the browser's network
      // stack is fully ready — much more likely than when opened via an app that already has a
      // warm connection). The old code here treated ANY error as "doc doesn't exist yet" and
      // immediately WROTE this device's current state over the shared cloud document — on a
      // fresh load that state is still the empty defaults (0 custom tests, all prices 0), so a
      // single mistimed hiccup could silently wipe every other device's real data. This is
      // exactly the bug reported: tests/prices sometimes showing blank depending on how/when
      // the file was opened, with nothing actually wrong with the file itself.
      // Fix: do one plain read first, and only create the document if that read positively
      // confirms nothing exists yet. If the read also fails, we still don't know either way —
      // so do nothing and stay offline rather than guess and risk overwriting real data.
      try{
        const snap = await withTimeout(cloudDocRef().get(), 10000);
        if(snap.exists){
          // Document is there — the listener itself just hiccuped, not a missing-doc case.
          // Restart listening; never touch the data.
          startCloudSync();
        } else {
          // Confirmed: genuinely no shared document exists anywhere yet. Safe to create it
          // from this device's current state since there is nothing real to lose.
          await cloudDocRef().set(sanitizeForFirestore(buildFullStatePayload()));
          startCloudSync();
        }
      }catch(e){ syncStatus="offline"; setSyncError(e); renderSyncBadge(); }
    }
  );
}
// Automatic sync-on-reconnect: as soon as the browser/WebView reports connectivity again, push
// right away rather than waiting for the user's next edit or the periodic listener retry. Any
// changes made while offline are already sitting in memory/localStorage (every save function
// writes locally first, sync is best-effort on top), so this just gets them to the server
// sooner — nothing is lost either way, this only closes the "offline changes sit unsynced until
// something else happens to trigger a push" gap.
window.addEventListener("online", function(){
  if(fbDb) pushToCloud();
});
function collectAllNotes(){
  const out = {};
  profiles.forEach(p=>{
    try{ out[p.id] = JSON.parse(localStorage.getItem("clinic_notes_"+p.id)||"[]"); }catch(e){ out[p.id]=[]; }
  });
  return out;
}
function exportBackup(){
  const payload = {
    version: 1,
    exportedAt: Date.now(),
    inventory, transactions, profiles, monthAdjustments,
    notesByProfile: collectAllNotes(),
    customTests, testNameOverrides, hiddenBuiltInTestIds, testPrices, testSettingsUpdatedAt, testItemUpdatedAt,
    defaultDoctorFee, defaultDoctorFeeUpdatedAt,
    defaultDoctorName, defaultDoctorNameUpdatedAt
  };
  // Inside the App Inventor app, a normal blob/<a download> click has nowhere to land (no
  // native download handler registered), so hand the data to the native side instead via
  // App Inventor's JS bridge — Blocks picks this up on WebViewStringChange and saves it with
  // the File component.
  if(window.AppInventor && typeof window.AppInventor.setWebViewString === "function"){
    window.AppInventor.setWebViewString("EXPORT:" + JSON.stringify(payload));
    showToast("✓ Saving backup file…");
    return;
  }
  const blob = new Blob([JSON.stringify(payload,null,2)], {type:"application/json"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  const stamp = new Date().toISOString().slice(0,10);
  a.href = url; a.download = `counter-book-backup-${stamp}.json`;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(url), 2000);
  showToast("✓ Backup file downloaded");
}
function triggerImportPicker(){
  // Same reasoning as exportBackup(): a plain <input type=file> click has no native file
  // picker wired up inside the App Inventor app, so ask the native side (via FilePicker) to
  // handle it instead when the bridge is present.
  if(window.AppInventor && typeof window.AppInventor.setWebViewString === "function"){
    window.AppInventor.setWebViewString("REQUEST_IMPORT");
    return;
  }
  document.getElementById("backupFileInput").click();
}
function onBackupFileSelected(evt){
  const file = evt.target.files && evt.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = ()=>{
    handleImportedBackupText(reader.result);
    evt.target.value = "";
  };
  reader.readAsText(file);
}
function handleImportedBackupText(text){
  let data;
  try{ data = JSON.parse(text); }catch(e){ showToast("⚠ That file isn't a valid backup"); return; }
  if(!data || !Array.isArray(data.inventory) || !Array.isArray(data.transactions)){
    showToast("⚠ That file isn't a valid backup"); return;
  }
  askConfirm("Combine this backup with what's already on this device? Bills, medicines, stock and notes from both will be kept — nothing on this device will be lost.", ()=>{
    mergeBackupInto(data);
    render();
    showToast("✓ Merged — downloading the combined file to send back to the other phone");
    setTimeout(exportBackup, 600);
  });
}
// Native (App Inventor) → page delivery channel: Blocks sets WebViewer1.WebViewString to the
// picked file's text (prefixed "IMPORT:") then calls evaluatejavascript("onNativeBridgeMessage()")
// with no embedded data — the page then reads the string itself via AppInventor.getWebViewString(),
// which avoids ever having to escape arbitrary JSON inside a Blocks-built JS string literal.
window.onNativeBridgeMessage = function(){
  if(!window.AppInventor || typeof window.AppInventor.getWebViewString !== "function") return;
  const msg = window.AppInventor.getWebViewString();
  if(typeof msg !== "string") return;
  if(msg.indexOf("IMPORT:") === 0) handleImportedBackupText(msg.slice(7));
};
function formatBytes(n){
  if(n < 1024) return n + " B";
  if(n < 1024*1024) return (n/1024).toFixed(1) + " KB";
  return (n/(1024*1024)).toFixed(2) + " MB";
}
// estimatedCloudDataSize() JSON-stringifies the whole app state, and render() calls it on
// EVERY render — including every single keystroke. Recomputing that on every keystroke is
// wasted work for a number that only needs to be "close enough" (it's already labelled an
// estimate, not a live reading). Cache it for a second so typing stays snappy; the badge is
// still fresh within ~1s of any real change.
let _cloudSizeCache = { bytes: null, at: 0 };
function estimatedCloudDataSize(){
  const now = Date.now();
  if(now - _cloudSizeCache.at < 1000) return _cloudSizeCache.bytes;
  // This mirrors buildFullStatePayload() — the exact object pushed to Firestore — so
  // measuring its JSON size gives a close real-world estimate of what's stored in the cloud,
  // even though Firestore itself doesn't expose a "how big is my data" API to client apps.
  try{
    const payload = buildFullStatePayload();
    const bytes = new Blob([JSON.stringify(payload)]).size;
    _cloudSizeCache = { bytes, at: now };
    return bytes;
  }catch(e){ _cloudSizeCache = { bytes: null, at: now }; return null; }
}

/* ===================== INIT ===================== */
// Real (not cosmetic) portrait lock attempt: the Screen Orientation API's lock() call is spec'd
// to require the page to actually be in fullscreen first — that's almost certainly why a bare
// screen.orientation.lock() (tried and removed earlier) never took effect. This requests
// fullscreen on the very first tap/touch anywhere on the page (a user gesture is mandatory for
// both the Fullscreen API and, in most browsers, the orientation lock that follows it), then
// locks to portrait once fullscreen is actually granted. {once:true} so it only ever tries once.
// Best-effort on top of, not instead of, the CSS rotation-compensation rule above: some WebViews
// reject fullscreen/orientation-lock outright (a host/OS decision, not something a web page can
// override), and if either step fails here it fails silently — but the CSS fix above keeps the
// app fully usable in portrait regardless, so this is just a bonus if the host happens to allow
// it (e.g. it could mean the phone's own rotation indicator/animation never even plays).
function tryLockPortrait(){
  try{
    const el = document.documentElement;
    const reqFS = el.requestFullscreen || el.webkitRequestFullscreen || el.mozRequestFullScreen || el.msRequestFullscreen;
    const doLock = ()=>{ try{ if(screen.orientation && screen.orientation.lock) screen.orientation.lock("portrait").catch(()=>{}); }catch(e){} };
    if(document.fullscreenElement || document.webkitFullscreenElement){ doLock(); return; }
    if(reqFS){ Promise.resolve(reqFS.call(el)).then(doLock).catch(()=>{}); }
    else { doLock(); } // no Fullscreen API at all — try the bare lock anyway, some hosts allow it without fullscreen
  }catch(e){}
}
document.addEventListener("touchend", tryLockPortrait, { once:true, passive:true });
document.addEventListener("click", tryLockPortrait, { once:true });
// Waits for the localStorage shim's IndexedDB hydration (see <head>) before booting, so loadAll()
// always sees the real saved data. On a normal browser where the shim never installed itself
// (real localStorage worked fine), __localStorageReady still resolves immediately either way.
Promise.resolve(window.__localStorageReady).then(function(){
  loadAll();
  bill = newBillState();
  render();
  startCloudSync();
});
</script>
<script>
// Registers the service worker (sw.js, same folder) so the app is cached on first load and
// works fully offline afterward — needed once the app is loaded from a real URL (GitHub Pages)
// instead of a local file, since that's what fixed localStorage but on its own would otherwise
// require internet on every open.
if("serviceWorker" in navigator){
  window.addEventListener("load", ()=>{
    navigator.serviceWorker.register("sw.js").catch(()=>{});
  });
}
</script>
