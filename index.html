<!DOCTYPE html>
<html lang="en">
<head>
<script>
// This WebView (confirmed via on-device testing) leaves window.localStorage present but set
// to null, while sessionStorage/indexedDB both work fine — so every localStorage.getItem/
// setItem call in the app below would throw. Replacing window.localStorage with a shim backed
// by IndexedDB fixes this WITHOUT touching any of the app's own code (which just keeps calling
// localStorage.getItem/setItem exactly as before). IndexedDB itself is async, so on startup we
// hydrate an in-memory copy first — window.__localStorageReady resolves once that's done, and
// the app's own boot sequence (bottom of the file) waits on it before calling loadAll().
(function(){
  // Only step in if real localStorage is actually broken here — everywhere else (a normal
  // browser, a different device where it works fine) must keep using the real thing untouched,
  // so existing data already saved there is never hidden behind an empty shim.
  var realLocalStorageWorks = false;
  try{
    localStorage.setItem("__ls_probe__", "1");
    realLocalStorageWorks = (localStorage.getItem("__ls_probe__") === "1");
    localStorage.removeItem("__ls_probe__");
  }catch(e){ realLocalStorageWorks = false; }
  if(realLocalStorageWorks){ window.__localStorageReady = Promise.resolve(); return; }

  var DB_NAME = "localStorageShim", STORE = "kv";
  var memory = {};
  var dbPromise = null;
  var pending = 0, waiters = [], failCount = 0, lastWarn = 0;
  window.__lsHydrationFailed = false;
  function openDb(){
    if(dbPromise) return dbPromise;
    dbPromise = new Promise(function(resolve, reject){
      var req = indexedDB.open(DB_NAME, 1);
      req.onupgradeneeded = function(){ req.result.createObjectStore(STORE); };
      req.onsuccess = function(){ resolve(req.result); };
      req.onerror = function(){ dbPromise = null; reject(req.error); };
    });
    return dbPromise;
  }
  // Reads everything into a scratch copy first and only uses it when the read finished completely, so a read that
  // dies half-way can never leave the app running on a partial copy of the saved data.
  function hydrateOnce(){
    return openDb().then(function(db){
      return new Promise(function(resolve, reject){
        var tmp = {};
        var tx = db.transaction(STORE, "readonly");
        var req = tx.objectStore(STORE).openCursor();
        req.onsuccess = function(e){
          var cursor = e.target.result;
          if(cursor){ tmp[cursor.key] = cursor.value; cursor.continue(); }
          else resolve(tmp);
        };
        req.onerror = function(){ reject(req.error); };
      });
    });
  }
  function hydrate(tries){
    return hydrateOnce().then(function(tmp){ memory = tmp; }, function(){
      if(tries > 1) return new Promise(function(r){ setTimeout(r, 700); }).then(function(){ return hydrate(tries-1); });
      // Still unreadable after several tries: from now on NOTHING is written to the phone's saved copy, so a blank or
      // partial copy can never replace the real saved data. The app shows a stop screen (see the boot code).
      window.__lsHydrationFailed = true;
    });
  }
  // If the phone refuses to store something (e.g. storage full) the user is told — every time, at most once per 15 s.
  function persistFailed(){
    failCount++; window.__lsPersistFailed = true;
    var now = Date.now();
    if(now - lastWarn > 15000 && typeof window.showToast === "function"){ lastWarn = now; try{ window.showToast("⚠ Phone storage problem — recent changes may not be saved on this phone"); }catch(e){} }
  }
  function settle(){ pending--; if(pending <= 0){ pending = 0; var w = waiters; waiters = []; w.forEach(function(f){ f(); }); } }
  // One write = one transaction; it counts as saved only when the phone confirms the commit (tx.oncomplete).
  function persist(key, value){
    if(window.__lsHydrationFailed){ persistFailed(); return; }
    pending++;
    openDb().then(function(db){
      return new Promise(function(resolve, reject){
        var tx = db.transaction(STORE, "readwrite");
        tx.oncomplete = function(){ resolve(); };
        tx.onerror = tx.onabort = function(){ reject(tx.error); };
        var store = tx.objectStore(STORE);
        if(value === null) store.delete(key); else store.put(value, key);
      });
    }).then(settle, function(){ persistFailed(); settle(); });   // count the failure BEFORE waking anyone waiting on a flush
  }
  // Resolves true when every write started so far has been confirmed by the phone (false on a failure or after ms).
  window.__lsFlush = function(ms){
    var before = failCount;
    return new Promise(function(resolve){
      if(window.__lsHydrationFailed) return resolve(false);
      if(pending === 0) return resolve(failCount === before);
      var done = false;
      var t = setTimeout(function(){ if(!done){ done = true; resolve(false); } }, ms || 5000);
      waiters.push(function(){ if(!done){ done = true; clearTimeout(t); resolve(failCount === before); } });
    });
  };
  var shim = {
    getItem: function(key){ return Object.prototype.hasOwnProperty.call(memory, key) ? memory[key] : null; },
    setItem: function(key, value){ value = String(value); memory[key] = value; persist(key, value); },
    removeItem: function(key){ delete memory[key]; persist(key, null); },
    key: function(i){ return Object.keys(memory)[i] || null; },
    clear: function(){ memory = {}; if(window.__lsHydrationFailed) return; openDb().then(function(db){ db.transaction(STORE,"readwrite").objectStore(STORE).clear(); }).catch(function(){}); }
  };
  Object.defineProperty(shim, "length", { get: function(){ return Object.keys(memory).length; } });
  function install(){
    try{ Object.defineProperty(window, "localStorage", { value: shim, configurable: true }); }
    catch(e){ window.localStorage = shim; }
  }
  window.__localStorageReady = hydrate(3).then(install, install);
})();
</script>
<script>
// Paint the last-used theme colours from the very first frame. The saved theme is only read after the phone-storage
// workaround has loaded (a fraction of a second), and until then the page's built-in green showed through. applyTheme()
// leaves the colours it applied in a cookie, which can be read straight away; replaying them here removes the green flash.
(function(){
  try{
    var m = document.cookie.match(/(?:^|;\s*)cb_theme=([^;]*)/); if(!m) return;
    var d = JSON.parse(decodeURIComponent(m[1])), r = document.documentElement;
    if(d.m) r.setAttribute("data-mode", d.m);
    for(var k in d.v) r.style.setProperty(k, d.v[k]);
  }catch(e){}
})();
</script>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">

<title>Saad Clinic</title>
<style>
  html, body { touch-action: pan-x pan-y; }   /* scrolling only: no pinch-zoom and no double-tap zoom anywhere in the app */
  :root{
    --page:#F3F6F7; --header:#0F5C57; --headerSub:#CFE9E5;
    --primary:#0F5C57; --primarySoft:#E4F1EF;
    --text:#1B2430; --muted:#7C8A99; --faint:#A9B4BE;
    --border:#E2E8F0; --card:#FFFFFF;
    --success:#0E9F6E; --successSoft:#E5F8F1;
    --danger:#DC3B2C; --dangerSoft:#FCEAE8;
    --warning:#B4650A; --warningSoft:#FDF3E3;
    /* Special-category medicines get their own violet so they never blend with the orange/other themes */
    --special:#6D28D9; --specialSoft:#EDE4FD;
    --header-h:90px; /* fallback before JS measures the real header height (syncHeaderOffset) */
  }
  *{box-sizing:border-box;
    /* Android WebViews (and mobile browsers generally) paint a translucent highlight over
       whatever was just tapped, as default visual feedback — with no styling for it here it
       falls back to a solid blue-ish box that can visibly linger/overlap when tapping several
       nav buttons in quick succession. Turning it off here doesn't remove tap feedback
       entirely: buttons still get their own :active/.active styling elsewhere in this file.
       rgba(0,0,0,0) rather than the `transparent` keyword — some Chromium/WebView versions
       have a known quirk where `transparent` doesn't fully suppress this specific property. */
    -webkit-tap-highlight-color:rgba(0,0,0,0);-webkit-touch-callout:none;}
  /* Text-selection highlight + caret, tinted to the app's green theme instead of the
     device/WebView's default accent (which shows up pink on some devices). Modern Chromium/
     WebView also tints the drag-selection handles to match ::selection in most versions, though
     that part is ultimately up to the WebView and can't be fully guaranteed from CSS alone. */
  ::selection{ background:var(--primary); color:#fff; }
  input, textarea{ caret-color:var(--primary); accent-color:var(--primary); }
  html,body{margin:0;padding:0;height:100%;background:var(--page);color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;overflow:hidden;}
  /* #app is pinned to exactly one viewport height and scrolls INTERNALLY (overflow-y:auto)
     instead of letting the outer document grow to the full height of the tallest tab's
     content (Records archive, a long Stock list, etc). Some Android WebViews — including the
     one this app runs in via App Inventor's WebViewer — have a hard limit on how tall a single
     composited/rendered surface can be; once the document's total height exceeds it, everything
     past that point renders blank white while scrolling back up (already-painted content) looks
     fine. Capping the scroll container to one viewport height keeps the painted surface a fixed,
     safe size no matter how long any tab's content gets. */
  #app{height:100vh;height:100dvh;display:flex;flex-direction:column;overflow-x:hidden;
    overflow-y:auto;-webkit-overflow-scrolling:touch;}
  .header-actions{top:28px;}   /* kept below the phone's status bar (wifi / battery icons) so the buttons never merge with it */
  header{background:var(--header);color:#fff;padding:18px 16px 14px;position:fixed;top:0;left:0;right:0;width:100%;z-index:30;
    box-shadow:0 1px 3px rgba(0,0,0,.15);display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:8px;
    transform:translateZ(0);-webkit-transform:translateZ(0);backface-visibility:hidden;-webkit-backface-visibility:hidden;}
  header h1{margin:0;font-size:18px;font-weight:700;}
  header p{margin:2px 0 0;font-size:12px;color:var(--headerSub);}
  @keyframes uploadSlide{0%{left:-30%;}100%{left:100%;}}
  #banner{font-size:12px;padding:8px 16px;background:var(--warningSoft);color:var(--warning);
    border-bottom:1px solid #F0DCB0;display:none;align-items:center;gap:6px;}
  main{flex:1;padding:14px 12px 100px;max-width:560px;margin:0 auto;width:100%;}
  nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--border);
    display:flex;justify-content:space-around;padding:6px 4px;z-index:30;
    transform:translateZ(0);-webkit-transform:translateZ(0);backface-visibility:hidden;-webkit-backface-visibility:hidden;}
  /* Paints the system nav bar's safe-area strip white in portrait, independent of whether the
     native HideBars extension's SetNavBarColour call actually takes effect - on Android 15+
     that native API is a documented no-op once the app is forced into edge-to-edge, and that
     switch doesn't reverse after the first rotation. env(safe-area-inset-bottom) reflects the
     real reserved height regardless, so the page paints it directly instead of depending on
     the OS honoring a color the app asked for. Hidden entirely in landscape per the "nothing
     at the bottom in landscape" requirement. Matches nav's own background above. */
  #navSafeBar{position:fixed;left:0;right:0;bottom:0;height:env(safe-area-inset-bottom);
    background:var(--card);z-index:29;}
  @media (orientation:landscape){ #navSafeBar{display:none;} }
  nav button{background:none;border:none;display:flex;flex-direction:column;align-items:center;gap:2px;
    padding:6px 10px;border-radius:8px;color:var(--muted);font-size:10px;font-weight:500;cursor:pointer;position:relative;
    -webkit-tap-highlight-color:rgba(0,0,0,0);}
  nav button.active{color:var(--primary);font-weight:700;}
  nav button .icon{font-size:20px;line-height:1;}
  nav button .badge{position:absolute;top:0;right:2px;background:var(--danger);color:#fff;font-size:9px;
    font-weight:700;border-radius:999px;min-width:14px;height:14px;display:flex;align-items:center;justify-content:center;padding:0 3px;}
  .card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:14px;
    box-shadow:0 1px 2px rgba(0,0,0,.04);margin-bottom:12px;}
  .card.primary{background:var(--primary);color:#fff;border:none;}
  label.field-label{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.02em;color:var(--muted);display:block;margin-bottom:4px;}
  input,textarea,select{width:100%;border:1px solid var(--border);border-radius:8px;padding:10px 12px;
    font-size:16px;font-family:inherit;color:var(--text);background:#fff;}
  input:focus,textarea:focus,select:focus{outline:2px solid var(--primary);outline-offset:-1px;}
  /* Every <select> in the app gets the SAME chevron, drawn ourselves instead of relying on the
     WebView's native dropdown arrow (which rendered inconsistently/looked out of place — see
     dropdown-styling fix). -webkit-appearance/appearance:none strips the native arrow everywhere
     (including inside .cat-picker's borderless variant below); the arrow itself is an inline SVG
     so it needs no network request and can't fail to load offline. */
  select{
    -webkit-appearance:none; -moz-appearance:none; appearance:none;
    background-image:url("data:image/svg+xml;charset=UTF-8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%237C8A99' stroke-width='2.5' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpolyline points='6 9 12 15 18 9'%3E%3C/polyline%3E%3C/svg%3E");
    background-repeat:no-repeat; background-position:right 10px center; background-size:18px;
    padding-right:34px;
  }
  textarea{resize:none;}
  /* Same chevron glyph as the select rule above, for non-<select> "looks like a dropdown"
     controls (the date-picker trigger buttons) so every dropdown-like control in the app is
     visually identical instead of mixing this SVG chevron with a plain "▾" text character,
     which rendered chunkier/misaligned compared to the select's arrow. */
  .chev{display:inline-block;width:16px;height:16px;flex-shrink:0;
    background-image:url("data:image/svg+xml;charset=UTF-8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%237C8A99' stroke-width='2.5' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpolyline points='6 9 12 15 18 9'%3E%3C/polyline%3E%3C/svg%3E");
    background-repeat:no-repeat;background-position:center;background-size:contain;}
  .row{display:flex;justify-content:space-between;align-items:center;}
  .row .val{font-weight:600;}
  .row.big .lab{font-size:14px;}
  .row.big .val{font-size:20px;font-weight:700;}
  .btn{border:none;border-radius:10px;padding:11px 16px;font-size:14px;font-weight:600;cursor:pointer;}
  .btn-primary{background:var(--primary);color:#fff;}
  /* Action buttons (Complete bill, Share bill, etc.) follow the chosen theme colour instead of a fixed green;
     the old class name is kept so no button markup had to change. */
  .btn-success{background:var(--primary);color:#fff;}
  .btn-danger{background:var(--danger);color:#fff;}
  .btn-outline{background:none;border:1px solid var(--border);color:var(--muted);}
  .btn-dashed{background:none;border:2px dashed var(--primary);color:var(--primary);width:100%;padding:12px;
    border-radius:12px;display:flex;align-items:center;justify-content:center;gap:6px;font-weight:700;}
  .btn:disabled{opacity:.4;cursor:default;}
  .pill-badge{font-size:11px;font-weight:700;padding:4px 8px;border-radius:999px;}
  .small{font-size:12px;color:var(--muted);}
  .faint{color:var(--faint);}
  .mt2{margin-top:8px;}.mt3{margin-top:12px;}.mb2{margin-bottom:8px;}
  .flex{display:flex;}.gap2{gap:8px;}.gap1{gap:4px;}.flex1{flex:1;}
  .search-wrap{position:relative;}
  .search-icon{position:absolute;left:10px;top:12px;color:var(--faint);pointer-events:none;}
  .search-wrap input{padding-left:32px;}
  .dropdown{position:absolute;z-index:20;margin-top:4px;width:100%;background:#fff;border:1px solid var(--border);
    border-radius:8px;max-height:220px;overflow-y:auto;box-shadow:0 6px 20px rgba(0,0,0,.12);}
  .dropdown button{width:100%;text-align:left;padding:10px 12px;border:none;background:none;border-bottom:1px solid var(--border);
    display:flex;justify-content:space-between;align-items:center;cursor:pointer;}
  .dropdown button:last-child{border-bottom:none;}
  .item-row{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--border);}
  .item-row:last-child{border-bottom:none;}
  .modal-overlay{position:fixed;inset:0;background:rgba(15,23,30,.45);z-index:50;display:flex;
    align-items:flex-end;justify-content:center;}
  /* The confirm dialog can be triggered from inside another already-open modal (category
     editor, inventory form, backup panel, etc.). All modal overlays share the same z-index
     and stack by DOM order, and #confirmModalRoot happens to sit earlier in the markup than
     those — so without this, the confirm dialog rendered BEHIND the still-open modal and was
     invisible and unclickable. Confirm dialogs are always meant to be the topmost thing on
     screen, so they get a dedicated higher z-index instead of relying on DOM order. */
  #confirmModalRoot .modal-overlay{z-index:60;}
  .priv-list{border:1px solid var(--border);border-radius:12px;overflow:hidden;background:#fff;}
  .priv-row{display:flex;align-items:center;gap:12px;padding:12px 14px;font-size:14px;font-weight:600;border-bottom:1px solid var(--border);cursor:pointer;margin:0;text-align:left;}
  .priv-row:last-child{border-bottom:none;}
  .priv-row input[type=checkbox]{width:22px;height:22px;min-width:22px;flex:none;margin:0;padding:0;accent-color:var(--primary);}
  .priv-row span{flex:1;text-align:left;}
  .formula-sug{border:1px solid var(--border);border-radius:10px;background:#fff;margin:-2px 0 8px;overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,.08);}
  .formula-sug-item{display:flex;justify-content:space-between;align-items:center;gap:8px;width:100%;text-align:left;background:#fff;border:none;border-bottom:1px solid var(--border);padding:10px 12px;font-size:14px;color:var(--text,#1B2430);cursor:pointer;}
  .formula-sug-item:last-child{border-bottom:none;}
  .formula-sug-item:active{background:var(--page);}
  #copyMenuRoot .modal-overlay{z-index:55;align-items:center;padding:16px;}
  #copyMenuRoot .copy-pop{background:#fff;border-radius:16px;width:100%;max-width:320px;padding:16px;box-shadow:0 8px 30px rgba(0,0,0,.25);}
  .modal{background:#fff;border-radius:16px 16px 0 0;width:100%;max-width:480px;max-height:85vh;
    display:flex;flex-direction:column;box-shadow:0 8px 30px rgba(0,0,0,.2);}
  /* Typing inside a pop-up menu: lift the menu above the on-screen keyboard (see "keep typing boxes visible" in the script) */
  body.kb-lift .modal-overlay{padding-bottom:var(--kb,0px);box-sizing:border-box;}
  body.kb-lift .modal-overlay .modal{max-height:calc(100vh - var(--kb,0px) - 14px) !important;}
  /* The phone reports where the keyboard is: the pop-up is pinned to exactly the visible area above it (--vvTop / --vvH follow the
     visible area even while the browser pans it), so it always sits right on top of the keyboard and never moves between boxes. */
  body.kb-vv .modal-overlay{top:var(--vvTop,0px);bottom:auto;height:var(--vvH,100%);padding-bottom:0;box-sizing:border-box;}
  body.kb-vv .modal-overlay .modal{max-height:calc(var(--vvH,100vh) - 10px) !important;}
  .modal-head{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border-bottom:1px solid var(--border);}
  .modal-body{margin:12px 16px;padding:12px;background:var(--page);border:1px solid var(--border);border-radius:8px;
    font-size:12px;font-family:ui-monospace,monospace;white-space:pre-wrap;overflow-y:auto;color:var(--text);}
  .modal-actions{display:flex;gap:8px;padding:14px 16px;}
  .hidden{display:none !important;}
  #toast{position:fixed;bottom:78px;left:50%;transform:translateX(-50%);background:#1B2430;color:#fff;
    padding:10px 18px;border-radius:999px;font-size:13px;font-weight:600;z-index:60;box-shadow:0 4px 16px rgba(0,0,0,.25);}
  #toast.tappable{cursor:pointer;text-decoration:underline;text-underline-offset:3px;}
  a.silent{color:inherit;text-decoration:none;}
  ::placeholder{color:var(--faint);}
  #invFab{position:fixed;right:16px;bottom:calc(70px + env(safe-area-inset-bottom));width:54px;height:54px;border-radius:50%;
    transform:translateZ(0);-webkit-transform:translateZ(0);backface-visibility:hidden;-webkit-backface-visibility:hidden;
    background:var(--primary);color:#fff;border:none;font-size:26px;line-height:1;cursor:pointer;
    box-shadow:0 4px 14px rgba(0,0,0,.25);z-index:35;display:flex;align-items:center;justify-content:center;}
  /* Landscape: nav becomes a left sidebar (icon+label stacked, top-to-bottom) running from
     the bottom of the header down to the bottom of the screen — like a desktop app's side
     nav — instead of staying a bottom bar stretched edge-to-edge, which wastes a lot of the
     screen's limited landscape height and puts the tabs far from the thumb on a wide phone.
     Only the layout/position changes here; every button's markup, icon, active/badge styling
     stays exactly the same as the portrait bottom-bar version. */
  @media (orientation:landscape){
    nav{
      top:var(--header-h); bottom:0; left:0; right:auto;
      width:68px; flex-direction:column; justify-content:flex-start; align-items:stretch;
      gap:2px; overflow-y:auto;
      border-top:none; border-right:1px solid var(--border);
      padding:10px calc(4px + env(safe-area-inset-left)) calc(10px + env(safe-area-inset-bottom));
    }
    nav button{ padding:10px 4px; }
    main{ padding-left:calc(68px + 12px + env(safe-area-inset-left)); padding-bottom:14px; }
    #invFab{ bottom:calc(16px + env(safe-area-inset-bottom)); right:calc(16px + env(safe-area-inset-right)); }
    /* The stacked title/subtitle/sync-row/user-badge layout (4 full-width lines) was designed
       for a tall portrait screen and ate up nearly a third of a landscape phone's much
       shorter height. In landscape: drop the subtitle entirely (least essential line), shrink
       the title, and lay everything else out as one wrapping inline row instead of stacked
       block lines, so the header collapses down to roughly its title's own height. */
    header{padding:8px 16px 6px;}
    header h1{font-size:15px;}
    header .header-sub{display:none;}
    header .header-info{display:flex;flex-wrap:wrap;align-items:center;column-gap:12px;row-gap:2px;padding-right:calc(126px + env(safe-area-inset-right));}
    header .header-sync-row{margin-top:0;}
    #currentUserBadge{margin-top:0;}
    header .header-actions{top:50%;transform:translateY(-50%);right:calc(16px + env(safe-area-inset-right));}
  }
  /* the three buttons in the top-right of the header: Refresh, Settings, AI reading */
  @keyframes settingsIn{from{transform:translateX(28px);opacity:0}to{transform:none;opacity:1}}
  .dm-scroll{max-height:62vh;overflow-y:auto;}
  body.settings-open #delMedModalRoot .dm-scroll{max-height:none;overflow:visible;}   /* as a full-screen Settings page the whole page scrolls */
  body.settings-open #delMedModalRoot .dm-search{position:sticky;top:0;z-index:2;background:var(--page);padding-bottom:6px;}
  /* ===== Storage & health page ===== */
  .hbanner{display:flex;gap:12px;align-items:center;border-radius:16px;padding:14px 16px;margin:6px 0 4px;}
  .hbanner .hico{font-size:28px;line-height:1;}
  .hbanner b{display:block;font-size:16px;}

  /* Category dropdown + "Edit" button, merged into one visual box (New medicine form and the
     inline per-medicine Edit form). Plain <input>/<select> elements get a full outline all the
     way around themselves on focus (see the shared input:focus rule above); a bare <select>
     inside this merged box would only outline itself, leaving the "Edit" button half of the
     box looking untouched and the whole thing visually inconsistent with every other field.
     Using :focus-within on the wrapping box instead makes the WHOLE pill glow together,
     matching how every other field responds when focused. */
  .cat-picker{display:flex;align-items:stretch;border:1px solid var(--border);border-radius:8px;overflow:hidden;}
  .cat-picker:focus-within{outline:2px solid var(--primary);outline-offset:-1px;}

  /* No CSS-based portrait fix here anymore. A rotation-compensation trick (counter-rotating
     <html> -90deg on landscape) was tried and removed — it rendered broken/skewed in the actual
     App-Inventor-wrapped WebView this build targets (the WebView's own viewport handling doesn't
     agree with what the trick assumes), which is arguably worse than doing nothing. A plain web
     page fundamentally cannot force this reliably across every WebView implementation — the only
     fix that's actually guaranteed for this build is native: Screen1 › ScreenOrientation ›
     "Portrait" in the App Inventor project itself (Android then refuses to rotate the Activity
     at all, unconditionally, regardless of the device's own auto-rotate toggle). That requires
     rebuilding and reinstalling the app — a Designer change alone doesn't retroactively fix an
     already-installed APK. */
  @keyframes aispin{to{transform:rotate(360deg);}}

// ===================== Medicine safety net =====================
// Independent of the normal phone storage and of the cloud, on purpose: if one of them ever loses a medicine, this still
// has it. It keeps (1) a register of every medicine this phone has ever held in each branch, and (2) rolling snapshots of
// the whole medicine list. A medicine that is in the register as live but is missing from the list — not deleted, simply
// gone — is put back automatically from the newest snapshot that has it. A medicine somebody deleted on purpose is NOT
// brought back automatically; it waits in Settings > Deleted medicines.
const VAULT_DB = "counterBookVault", VAULT_KEEP_RECENT = 15, VAULT_KEEP_DAYS = 14;
const vaultIO = {
  _db:null,
  open(){
    if(this._db) return this._db;
    this._db = new Promise((res,rej)=>{
      try{
        const r = indexedDB.open(VAULT_DB, 1);
        r.onupgradeneeded = ()=>{ const d=r.result; d.createObjectStore("snaps"); d.createObjectStore("reg"); };
        r.onsuccess = ()=>res(r.result);
        r.onerror = ()=>{ this._db=null; rej(r.error); };
      }catch(e){ this._db=null; rej(e); }
    });
    return this._db;
  },
  _run(store, mode, fn){
    return this.open().then(db=>new Promise((res,rej)=>{
      const tx = db.transaction(store, mode); let r;
      tx.oncomplete = ()=>res(r ? r.result : undefined);
      tx.onerror = tx.onabort = ()=>rej(tx.error || new Error("vault"));
      r = fn(tx.objectStore(store));
    }));
  },
  put(s,k,v){ return this._run(s,"readwrite",os=>os.put(v,k)); },
  get(s,k){ return this._run(s,"readonly",os=>os.get(k)); },
  keys(s){ return this._run(s,"readonly",os=>os.getAllKeys()); },
  del(s,k){ return this._run(s,"readwrite",os=>os.delete(k)); }
};
let _vaultTimer = null, _vaultRetry = null, _vaultSnapT = {}, _invDirty = false, _snapPending = false;
let _vaultInfo = { snaps:0, lastT:0, ok:true, recovered:0 };
function vaultNote(){ _invDirty = true; clearTimeout(_vaultTimer); _vaultTimer = setTimeout(()=>{ vaultWrite(); }, 400); }
function _vaultSnapKeyT(k){ return parseInt(String(k).split("|")[1],10) || 0; }
// Newest 15 snapshots, plus the last snapshot of each of the last 14 days, so a loss noticed a week later is still recoverable.
function _vaultPrune(mine, now){
  const keep = new Set(mine.slice(-VAULT_KEEP_RECENT));
  const perDay = {};
  mine.forEach(k=>{ const t=_vaultSnapKeyT(k), day=Math.floor(t/86400000); if(now-t <= VAULT_KEEP_DAYS*86400000) perDay[day]=k; });
  Object.keys(perDay).forEach(d=>keep.add(perDay[d]));
  return mine.filter(k=>!keep.has(k));
}
async function vaultWrite(){
  clearTimeout(_vaultTimer);
  try{
    const br = activeBranchId, now = Date.now();
    const reg = (await vaultIO.get("reg", br)) || { ids:{} }; if(!reg.ids) reg.ids = {};
    let changed = false;
    for(const m of inventory){
      if(!m || !m.id) continue;
      const d = m.deleted ? 1 : 0, n = String(m.name||"").slice(0,60), cur = reg.ids[m.id];
      if(!cur || cur.d!==d || cur.n!==n){ reg.ids[m.id] = { n, d }; changed = true; }
    }
    if(changed){ reg.t = now; await vaultIO.put("reg", br, reg); }
    let mine = (await vaultIO.keys("snaps")).filter(k=>String(k).indexOf(br+"|")===0).sort();
    const last = mine.length ? _vaultSnapKeyT(mine[mine.length-1]) : 0;
    _vaultSnapT[br] = last; _vaultInfo.snaps = mine.length; _vaultInfo.lastT = last;
    const gap = now - last;
    const due = !last || ((changed || _snapPending) && gap>=5000) || (_invDirty && gap>=900000);
    if(due){
      const key = br+"|"+String(now).padStart(15,"0");
      await vaultIO.put("snaps", key, { branch:br, t:now, inv:inventory });
      _invDirty = false; _snapPending = false; _vaultSnapT[br] = now;
      mine.push(key);
      for(const k of _vaultPrune(mine, now)) await vaultIO.del("snaps", k);
      mine = mine.filter(k=>true);
      _vaultInfo.snaps = Math.min(mine.length, VAULT_KEEP_RECENT+VAULT_KEEP_DAYS); _vaultInfo.lastT = now;
    } else if(changed || _snapPending){
      // Changed again within 5 s of the last snapshot: take one right after, so the newest change is never only in the register.
      _snapPending = true;
      clearTimeout(_vaultRetry); _vaultRetry = setTimeout(()=>{ vaultWrite(); }, Math.max(300, 5300-gap));
    }
    _vaultInfo.ok = true; return true;
  }catch(e){ _vaultInfo.ok = false; return false; }
}
function vaultFlush(ms){ return Promise.race([ vaultWrite(), new Promise(r=>setTimeout(()=>r(false), ms||4000)) ]); }
// true only when BOTH the phone storage and the safety net have confirmed the latest save
function whenStored(ms){
  ms = ms||5000;
  return Promise.all([ window.__lsFlush ? window.__lsFlush(ms) : true, vaultFlush(ms) ]).then(r=>r.every(Boolean)).catch(()=>false);
}
function vaultReportGet(){ try{ return JSON.parse(localStorage.getItem(bk("clinic_vault_report"))||"[]"); }catch(e){ return []; } }
function vaultReportPush(entry){ try{ const a=vaultReportGet(); a.unshift(entry); localStorage.setItem(bk("clinic_vault_report"), JSON.stringify(a.slice(0,20))); }catch(e){} }
let _lastAudit = 0, _auditRunning = false;
// Finds medicines the register says are live but that are gone from the list, and puts them back.
async function vaultAudit(){
  if(_auditRunning) return { missing:[], recovered:[], lost:[] };
  _auditRunning = true; _lastAudit = Date.now();
  try{
    const br = activeBranchId;
    const reg = await vaultIO.get("reg", br);
    if(!reg || !reg.ids) return { missing:[], recovered:[], lost:[] };
    const have = new Set(inventory.map(m=>m && m.id));
    const missingIds = Object.keys(reg.ids).filter(id=>reg.ids[id].d===0 && !have.has(id));
    if(!missingIds.length) return { missing:[], recovered:[], lost:[] };
    const keys = (await vaultIO.keys("snaps")).filter(k=>String(k).indexOf(br+"|")===0).sort().reverse();
    const need = new Set(missingIds), recovered = [];
    for(const k of keys){
      if(!need.size) break;
      const snap = await vaultIO.get("snaps", k);
      if(!snap || !Array.isArray(snap.inv)) continue;
      snap.inv.forEach(m=>{
        if(m && need.has(m.id) && !m.deleted && !inventory.some(x=>x.id===m.id)){
          const copy = JSON.parse(JSON.stringify(m));
          recomputeStock(copy);
          inventory.push(copy); recovered.push(copy.name); need.delete(m.id);
        }
      });
    }
    const lost = [...need].map(id=>reg.ids[id].n);
    if(recovered.length){
      _vaultInfo.recovered += recovered.length;
      _liveN = null;
      try{ logActivity("med_recovered", recovered.join(", ")); }catch(e){}
      saveInventory();
      try{ if(typeof render==="function") render(); }catch(e){}
    }
    if(recovered.length || lost.length) vaultReportPush({ t:Date.now(), recovered, lost });
    if(recovered.length) showToast(`♻ ${recovered.length} medicine${recovered.length===1?" had":"s had"} gone missing and ${recovered.length===1?"was":"were"} put back automatically: ${recovered.slice(0,5).join(", ")}${recovered.length>5?" …":""}`);
    if(lost.length) showToast(`⚠ ${lost.length} medicine${lost.length===1?"":"s"} went missing and could not be recovered: ${lost.slice(0,5).join(", ")}${lost.length>5?" …":""}. Please add ${lost.length===1?"it":"them"} again.`);
    return { missing:missingIds, recovered, lost };
  }catch(e){ return { missing:[], recovered:[], lost:[], error:true }; }
  finally{ _auditRunning = false; }
}
/*VAULT-END*/

// One call per real add/edit/delete a non-admin user makes. Grouped by that user's profile id
// and by calendar day (cheap to store, cheap to purge a whole day at once once it's stale).
// Device-local only — this data never enters buildFullStatePayload, so it never rides the

function logActivity(action, summary){

  if(!activityLog[currentProfileId]) activityLog[currentProfileId] = {};
  if(!activityLog[currentProfileId][day]) activityLog[currentProfileId][day] = [];
  activityLog[currentProfileId][day].push({ t:Date.now(), a:String(action), s:String(summary||"").slice(0,100) });

  const cutoffDay = localDateStr(Date.now() - 60*24*60*60*1000);
  let changed = false;
  Object.keys(activityLog).forEach(pid=>{
    Object.keys(activityLog[pid]).forEach(day=>{
      if(day < cutoffDay){ delete activityLog[pid][day]; changed = true; }
    });
    if(Object.keys(activityLog[pid]).length===0) delete activityLog[pid];
  });
  if(changed) saveActivityLog();
}
// Admin-side: ask whichever device holds a given user's activity log to send a copy for a
// date range (leave from/to blank for "everything currently kept"). This only ever writes a
// few bytes of metadata to the cloud — never the log itself.
function requestUserHistory(profileId, fromDate, toDate){
  if(!fbDb){ showToast("Cloud sync isn't set up on this device"); return; }
  const id = uid();
  historyRequests[id] = { profileId, from: fromDate||null, to: toDate||null, requestedAt: Date.now(), requestedBy: currentProfileId };
  saveHistoryRequests();
  schedulePushToCloud();
  showToast("Requested — will appear here once that device is online");
  render();
}
// Runs after every cloud merge. Two small, independent jobs — cheap since historyRequests/
// historyResponses only ever hold a handful of entries at a time, and neither one ever reads
// or writes any other field (inventory, bills, notes, profiles, settings are untouched here):
// 1) If THIS device happens to hold the activity log for a profile someone is asking about,
//    answer once (guarded by historyProcessedRequestIds so our own echoed-back write can't
//    make us answer the same request forever).
// 2) If THIS device is the admin who made a request and the answer has now arrived, copy it
//    into this admin's own local-only store. The request/response pair is deliberately left on
//    the shared cloud document at this point — the only thing this feature ever deletes from
//    the cloud is that same pair, and only once a full 24h has passed since it was made or
//    answered (further below), whether or not the admin has already collected it. Nothing else
//    this app stores in the cloud is ever removed by this feature.
function processHistorySync(){
  let cloudChanged = false;
  const now = Date.now();

  Object.entries(historyRequests).forEach(([id, req])=>{
    if(!req || !req.profileId) return;
    if(historyResponses[id] || historyProcessedRequestIds[id]) return;
    const myLog = activityLog[req.profileId];
    if(!myLog) return; // this device has never held that profile's activity log
    const entries = [];
    Object.keys(myLog).forEach(day=>{
      if((!req.from || day>=req.from) && (!req.to || day<=req.to)){
        myLog[day].forEach(e=>entries.push({ d:day, t:e.t, a:e.a, s:e.s }));
      }
    });
    historyResponses[id] = { profileId:req.profileId, entries, respondedAt:now };
    historyProcessedRequestIds[id] = true;
    saveHistoryResponses(); saveHistoryProcessedIds();
    cloudChanged = true;
  });

  if(currentProfileId && currentRole()==="admin"){
    Object.entries(historyResponses).forEach(([id, resp])=>{
      const req = historyRequests[id];
      if(!req || req.requestedBy !== currentProfileId) return;
      if(!adminReceivedHistory[resp.profileId]) adminReceivedHistory[resp.profileId] = { entries:[], receivedAt:0 };
      const bucket = adminReceivedHistory[resp.profileId];
      const seen = new Set(bucket.entries.map(e=>e.d+"|"+e.t+"|"+e.a+"|"+e.s));
      (resp.entries||[]).forEach(e=>{
        const key = e.d+"|"+e.t+"|"+e.a+"|"+e.s;
        if(!seen.has(key)){ bucket.entries.push(e); seen.add(key); }
      });
      bucket.receivedAt = now;
      saveAdminReceivedHistory();
      // Deliberately NOT deleted here. The admin has their copy now, but the shared cloud
      // document isn't touched yet — the only thing ever removed from it is this same
      // request/response pair, and only once a full day has actually passed (below). Nothing
      // else this app stores in the cloud is ever deleted by this feature.
    });
  }

  // The ONLY deletions this feature ever performs against the shared cloud document: a
  // request/response pair, and only once a full 24h has passed since it was made/answered.
  // Nothing else — inventory, bills, notes, profiles, settings — is ever touched here.
  Object.entries(historyRequests).forEach(([id, req])=>{
    if(now - (req.requestedAt||0) > 24*60*60*1000){ delete historyRequests[id]; delete historyResponses[id]; cloudChanged = true; }
  });
  Object.entries(historyResponses).forEach(([id, resp])=>{
    if(now - (resp.respondedAt||0) > 24*60*60*1000){ delete historyResponses[id]; delete historyRequests[id]; cloudChanged = true; }
  });

  if(cloudChanged){ saveHistoryRequests(); saveHistoryResponses(); schedulePushToCloud(); }
}

   so a medicine picks ONE of either (not both independently as before). Special categories are
   grouped under their own <optgroup> heading, which every mobile OS renders as a section
   header inside the native picker — this is what puts "Special medicine category" as a
   sub-heading under the plain category list instead of needing its own separate field/button. */

  const regularList = MED_CATEGORIES.slice();

  const regularHtml = regularList.map(c=>`<option value="${esc(c)}" ${current===c?"selected":""}>${esc(c)}</option>`).join("");
  const specialHtml = specialList.length ? `<optgroup label="Special medicine category">${specialList.map(c=>`<option value="${esc(c)}" ${current===c?"selected":""}>${esc(c)}</option>`).join("")}</optgroup>` : "";
  return regularHtml + specialHtml;

/* ===================== BATCHES / EXPIRY (FEFO) ===================== */
/* Every restock creates its own "batch" with its own expiry date. When medicine is
   sold, pills are drawn from the batch with the nearest expiry date first (FEFO —
   first-expiry-first-out). m.stockPills is always kept as the sum of active batches. */
function activeBatches(m){ return (m.batches||[]).filter(b=>!b.disposed && b.pillsRemaining>0); }
// q6: rounds away tiny floating-point leftovers (e.g. 0.30000000000000004) from half-tablet doses
function q6(n){ return Math.round((Number(n)||0)*1e6)/1e6; }
function recomputeStock(m){ m.stockPills = q6(activeBatches(m).reduce((s,b)=>s+b.pillsRemaining,0)); }

/* ===== Stock quantities that survive TWO phones changing the same batch =====
   Before: a batch stored one number (pillsRemaining) and when two phones changed it, the newer copy simply replaced the
   other, so one phone's sale could vanish and stock looked too high. Now every phone keeps its OWN running totals per batch
   (led = { phoneId: [totalAdded, totalRemoved] }, only ever growing) and the batch quantity is
       originalPills + all added - all removed,
   merged by taking the biggest total per phone. Both phones' sales therefore always count, in any order, with no
   dependence on the phones' clocks. "legacy" holds changes made by older versions of the app / before this update. */
let _devId = null;
// This phone's ID in every batch's ledger. Two phones sharing an ID would have their stock movements mixed up, so it must be unique:
// "d" + 12 characters from the phone's secure random generator (about 60 bits; the old one was 5 characters from Math.random, about 26 bits).
// The leading "d" also guarantees it can never clash with the reserved ledger entry "legacy".
const DEVICE_ID_RE = /^d[0-9a-z]{12}$/;
function newDeviceId(){
  let s = "";
  try{
    const a = new Uint32Array(3); (window.crypto || window.msCrypto).getRandomValues(a);
    s = Array.from(a).map(n=>n.toString(36).padStart(7,"0")).join("");
  }catch(e){}
  if(s.length<12) s = Date.now().toString(36) + Math.random().toString(36).slice(2) + Math.random().toString(36).slice(2);   // very old web view without a secure generator
  return "d" + s.slice(0,12);
}
function deviceId(){
  if(_devId) return _devId;
  let stored = null;
  try{ stored = localStorage.getItem("clinic_device_id"); }catch(e){}
  if(stored && DEVICE_ID_RE.test(stored)){ _devId = stored; return _devId; }
  // First start, or an old short ID: give this phone a long one. An old ID stays in the batches' history (those totals only ever
  // grow), so no stock movement is lost; new movements are simply recorded under the new ID.
  _devId = newDeviceId();
  try{ if(stored) localStorage.setItem("clinic_device_id_old", stored); localStorage.setItem("clinic_device_id", _devId); }catch(e){}
  return _devId;
}
// A read-only picture of a batch: its starting quantity and its ledger, with any change that was made WITHOUT the ledger
// (older app version, very old data) folded into "legacy" so it is not lost.
function ledView(b){
  const cur = Number(b.pillsRemaining)||0;
  let orig = (b.originalPills==null) ? cur : Number(b.originalPills);
  if(!isFinite(orig)) orig = cur;
  const led = {};
  if(b.led && typeof b.led==="object") for(const k in b.led){ const e = b.led[k]; if(Array.isArray(e)) led[k] = [Number(e[0])||0, Number(e[1])||0]; }
  let q = orig; for(const k in led) q += led[k][0]-led[k][1];
  const d = q6(cur - Math.max(0, q6(q)));
  if(d!==0){ const lg = led.legacy || [0,0]; const net = q6(lg[0]-lg[1]+d); led.legacy = [net>0?net:0, net<0?-net:0]; }
  return { orig, led };
}
function ledViewQty(v){ let q = v.orig; for(const k in v.led) q += v.led[k][0]-v.led[k][1]; return Math.max(0, q6(q)); }

function batchChange(b, delta){

  if(delta>0) e[0] = q6(e[0]+delta); else e[1] = q6(e[1]-delta);

  if(Object.keys(led).length){ out.led = led; out.pillsRemaining = ledViewQty({orig:A.orig, led}); }

function fefoOrder(m, precomputedBatches){
  return (precomputedBatches || activeBatches(m)).slice().sort((a,b)=>{
    const ea = a.expiryDate ? new Date(a.expiryDate).getTime() : Infinity;
    const eb = b.expiryDate ? new Date(b.expiryDate).getTime() : Infinity;

   it falls back to the medicine's current mrpPerBox — i.e. "use the older/current price". */
// SWITCH: false = every medicine is sold at its latest price (the medicine's own MRP / pills per box),
// whatever batch the tablets come from. Set to true to bring back per-batch prices (the batch MRPs
// entered at restock are still stored, so nothing is lost by leaving this off).
const USE_BATCH_PRICES = false;
function batchPricePerPill(m, b){
  const mrp = (USE_BATCH_PRICES && b && b.mrpPerBox!=null && b.mrpPerBox>0) ? b.mrpPerBox : m.mrpPerBox;
  return (Number(mrp)||0) / (Number(m.pillsPerBox)||1);

// Price for `pills` taken in the same order stock is deducted (nearest expiry first), each batch at its own
// price. `skip` = pills of this medicine already on the bill, so a second line continues after the first.
function priceForPills(m, pills, skip){
  pills = Number(pills)||0; if(pills<=0) return 0;
  const ppb = Number(m.pillsPerBox)||1;
  const segs = [];                                    // [pills taken from this batch, that batch's MRP per box]
  let toSkip = Number(skip)||0, remaining = pills;
  for(const b of fefoOrder(m)){

    if(avail<=0) continue;
    if(remaining<=0) break;
    const take = Math.min(avail, remaining);
    const mrp = (USE_BATCH_PRICES && b && b.mrpPerBox!=null && b.mrpPerBox>0) ? b.mrpPerBox : m.mrpPerBox;
    segs.push([take, Number(mrp)||0]); remaining -= take;

}
// Adds up (pills x box price / pills-per-box) without floating-point drift. When pill counts are whole
// numbers and prices have at most 2 decimals (the normal case) the maths is done in whole paisas and
// rounded half-up once, so a total like 16.885 can never turn into 16.88 by accident.
function exactLineTotal(segs, ppb){
  const exactOk = Number.isInteger(ppb) && ppb>0 && segs.every(([t,mrp])=> Number.isInteger(t) && Math.abs(mrp*100-Math.round(mrp*100))<1e-6);
  if(exactOk){
    let num = 0; segs.forEach(([t,mrp])=>{ num += t*Math.round(mrp*100); });   // = total paisas x pills-per-box
    if(Number.isSafeInteger(2*num+ppb)) return Math.floor((2*num+ppb)/(2*ppb))/100;
  }
  let total = 0; segs.forEach(([t,mrp])=>{ total += t*(mrp/ppb); });

}
function lineCalc(m, pills, skip){
  const subtotal = priceForPills(m, pills, skip);

}
// Re-prices every line of the current bill from scratch, in order, following exactly the same
// batch order stock will be deducted in. Run after any line is removed/edited or days change, so a
// line can never keep a price that assumed another line (now gone) was taken first.
function repriceBillItems(){
  const taken = {};
  bill.items.forEach(it=>{
    const med = inventory.find(m=>m.id===it.medId);
    const skip = taken[it.medId]||0;
    taken[it.medId] = skip + (Number(it.pills)||0);
    if(!med) return;                                   // medicine was deleted: keep the saved price
    const lc = lineCalc(med, it.pills, skip);
    it.pricePerPill = lc.pricePerPill;
    if(it.special){ it.baseSubtotal = lc.subtotal; it.subtotal = r2(lc.subtotal + (Number(it.appliedFee)||0)); }

function billPendingSkip(medId){ return bill.items.filter(x=>x.medId===medId).reduce((s,x)=>s+(Number(x.pills)||0),0); }

  const order = fefoOrder(m);

let lastDeductExpiry = null;   // earliest expiry date among the batches the LAST deductStock() took from (null if none had a date)
let lastDeductBatches = null;  // exactly which batch(es) + how many pills the LAST deductStock() took from, in the order taken — lets a later return/undo put pills back into the SAME batches instead of an arbitrary one (see returnStockToBatches())
function deductStock(m, pills){

function returnStock(m, pills){

// from (dedBatches, recorded by deductStock() above), undoing the most-recently-drawn-from batch
// first — the same order a partial undo of the original deduction would follow. This keeps FEFO
// and expiry tracking accurate instead of returnStock()'s old behavior of always dropping
// everything into whichever batch currently sorts first, which could be a completely different
// batch than the one actually sold from. If a recorded batch no longer exists (deleted or
// disposed since the sale) or the line predates this tracking (dedBatches missing), whatever
// can't be matched falls back to the old nearest-batch behavior via returnStock() so nothing is
// ever left unreturned.
// `alreadyReturned` is how much of this SAME line has already been given back by an earlier,
// separate return on this bill — it skips that much off the end of dedBatches first, so a second
// partial return continues the reversal from where the first one left off instead of re-crediting
// the same batch slot twice.
function returnStockToBatches(m, dedBatches, qty, alreadyReturned){
  let remaining = q6(Math.max(0, Number(qty)||0));
  const placed = [];                                     // [{id, qty}] where the returned pills really went
  if(remaining<=0) return placed;
  let skip = q6(Math.max(0, Number(alreadyReturned)||0));

    if(remaining<=0) break;
    let dQty = q6(Number(d.qty)||0);
    if(skip>0){
      const used = Math.min(skip, dQty);

      dQty = q6(dQty - used);

    }

    const give = Math.min(remaining, dQty);

    placed.push({ id:b.id, qty:give });
    remaining = q6(remaining - give);

// batch(es) the return put them into (most recent first), not whichever batch happens to sort first. Whatever can't
// be matched (batch gone/disposed/already sold on, or a return saved before this was recorded) is taken the normal way.
function takeBackFromBatches(m, placed, qty){

  for(const d of list){
    if(remaining<=0) break;
    const b = (m.batches||[]).find(x=>x.id===d.id && !x.disposed); if(!b) continue;
    const take = Math.min(remaining, q6(Number(d.qty)||0), Number(b.pillsRemaining)||0);

    m.batches.push({ id:uid(), boxes:null, pillsRemaining:diff, originalPills:diff, expiryDate:null, addedAt:Date.now(), updatedAt:Date.now(), disposed:false });

   badge, and dispose icon), so the full date used to get ellipsis-truncated down to just "20…"

function expiringBatches(){

      const b = (m.batches||[]).find(x=>x.id===batchId);

/* ---- Custom date picker (in-theme replacement for native <input type="date">) ---- */

// Opening/navigating/picking a day only ever changes what's inside #datePickerModalRoot —

// day-tap was the actual cause of the picker feeling far slower than the native one; calling
// renderDatePickerModal() directly instead keeps every interaction to a single small

function openDatePicker(currentValue, kind, args){
  const base = currentValue ? new Date(currentValue+"T00:00:00") : new Date();
  try{ window.getSelection().removeAllRanges(); }catch(_){}
  document.body.classList.add("dp-open");
  datePickerUi = { open:true, viewYear: base.getFullYear(), viewMonth: base.getMonth(), selected: currentValue||"", targetKind: kind, targetArgs: args||null };
  renderDatePickerModal();

}

  datePickerUi.viewMonth--;

}

  datePickerUi.viewMonth++;

  refreshDatePickerBody();
}

  else if(kind==="restock"){ inv.restockExpiry = value; render(); }

function datePickerView(){

  const { viewYear, viewMonth, selected } = datePickerUi;

  const numDays = new Date(viewYear, viewMonth+1, 0).getDate();
  const todayStr = ymd(new Date().getFullYear(), new Date().getMonth(), new Date().getDate());
  let cells = "";
  for(let i=0;i<startDow;i++) cells += `<div></div>`;
  for(let d=1; d<=numDays; d++){
    const dateStr = ymd(viewYear, viewMonth, d);
    const isSel = dateStr===selected;
    const isToday = dateStr===todayStr;
    const style = isSel
      ? "background:var(--primary);color:#fff;font-weight:700;"
      : isToday
        ? "background:var(--primarySoft);color:var(--primary);font-weight:700;"
        : "background:none;color:var(--text);";
    cells += `<button type="button" onclick="pickDatePickerDay(${d})" style="${style}border:none;border-radius:999px;width:34px;height:34px;font-size:13px;cursor:pointer;">${d}</button>`;
  }

  // actually spans — without this, months with only 4-5 visible rows made the whole modal
  // visibly shrink/grow as you flipped between months, which read as janky/broken.
  const totalCellsSoFar = startDow + numDays;

  for(let i=0;i<trailing;i++) cells += `<div></div>`;
  const headerLabel = selected ? new Date(selected+"T00:00:00").toLocaleDateString(undefined,{weekday:"short", month:"short", day:"numeric"}) : "No date set";
  return { cells, headerLabel, viewYear, monthLabel: MONTH_NAMES[viewMonth]+" "+viewYear };
}

(function(){

// current tab (e.g. all 300+ medicines on Inventory), which made every menu take about a second to open.
function renderOverlays(){
  renderShareModal(); renderConfirmModal(); renderNumberPromptModal(); renderPinRevealGate(); renderInvFormModal(); renderBackupModal(); renderDiagModal(); renderRetModal(); renderPrinterModal();
  renderAiModal(); renderMonthBreakdownModal(); renderCategoryModal(); renderManageUsersModal(); renderDelMedModal(); renderHealthModal(); renderBranchesModal(); renderMoveStaffModal(); renderHistoryModal();
  renderAdminTransferModal(); renderPostTransferChoiceModal(); renderPrivilegeConfirmModal(); renderReceiptModal();
  renderScanMethodModal(); renderThemeModal(); renderKbTestModal(); renderReceiptDesignModal(); renderToolsModal(); renderRecoveryModal(); renderDatePickerModal(); renderScanModal();
  syncMenuHistory(); syncHeaderOffset();
}
function render(){
  const active = document.activeElement;
  const id = active && active.id;
  const isTextField = active && (active.tagName==="INPUT" || active.tagName==="TEXTAREA");
  const selStart = active && typeof active.selectionStart==="number" ? active.selectionStart : null;
  const selEnd = active && typeof active.selectionEnd==="number" ? active.selectionEnd : null;
  // #app is the single scrolling container for the whole page (see its own comment above).
  // Re-rendering only ever replaces its CHILDREN, never #app itself, so its scrollTop is
  // normally left alone by the browser automatically — except when a re-render's new content
  // is temporarily SHORTER than what's on screen right now (e.g. a long list that repopulates
  // itself starting from a small first batch — see renderInvList()'s _invListLoadedFor for the
  // specific fix for that), which clamps scrollTop down, and the browser does not restore it
  // once the content grows back. Capturing/restoring it here is a cheap safety net against
  // that class of bug wherever it crops up, on any tab, without needing every render path to
  // handle it individually.
  const appEl = document.getElementById("app");
  const prevScrollTop = appEl ? appEl.scrollTop : 0;

  renderBanner();
  renderCopyMenu();
  renderHeaderMenu();
  renderUserBadge();

  // AI reading and Settings act on data/a logged-in profile that doesn't exist yet during
  // first-run setup or the PIN login screen, so they're hidden there — just Refresh stays.
  {
    const showHeaderExtras = visibleProfiles().length>0 && !setupHold && sessionAuthed;
    const aiBtn = document.getElementById("aiReadingBtn");
    const menuBtn = document.getElementById("headerMenuBtn");
    if(aiBtn) aiBtn.style.display = showHeaderExtras ? "" : "none";
    if(menuBtn) menuBtn.style.display = showHeaderExtras ? "" : "none";
  }

  // Gate everything behind login: first-run shows "set up Admin"; otherwise shows the PIN
  // login screen until sessionAuthed. Both skip tabs/nav entirely — nothing else renders.
  if(visibleProfiles().length===0 || setupHold){
    document.getElementById("nav").innerHTML = "";
    const fab0 = document.getElementById("invFab"); if(fab0) fab0.className="hidden";
    if(visibleProfiles().length===0 && setupWantLogin) renderSetupWaiting();
    else { setupHold = true; renderSetupAdmin(); }
    syncHeaderOffset();
    return;
  }
  if(!sessionAuthed){
    document.getElementById("nav").innerHTML = "";
    const fab0 = document.getElementById("invFab"); if(fab0) fab0.className="hidden";
    renderLogin();
    renderForgotPinModal();
    renderAddUserLoginModal();
    syncHeaderOffset();
    syncMenuHistory();
    return;
  }

  renderNav();
  renderCloudSizeBadge();
  if(tab==="bill") renderBill();
  else if(tab==="inventory"){
    // If the Inventory shell (search box + header pills) is already on screen, this render()
    // call is a refresh of an already-open tab — most commonly an incoming cloud-sync update —
    // not the person switching into it. Only touch the results list in that case, both so the
    // search input is never rebuilt out from under someone typing (see the note further up on
    // scheduleQueryRender) and so renderInvList() takes its "already fully loaded" fast path
    // (a single synchronous rebuild) instead of collapsing back to a first batch of 15 and
    // re-chunking the rest — which is what used to make a button tap land on the wrong
    // medicine after scrolling past the first ~50 while a sync happened to land at that
    // exact moment.
    if(document.getElementById("invQueryInput")){ refreshInvHeader(); renderInvList(); }
    else renderInventory();
  }
  else if(tab==="records") renderRecords();
  else if(tab==="stock") renderStock();
  else if(tab==="notes") renderNotes();
  renderShareModal();
  renderConfirmModal();
  try{ notifyPendingRequests(); }catch(e){}
  renderInvFormModal();
  renderBackupModal(); renderDiagModal(); renderRetModal();
  renderPrinterModal();
  renderAiModal();
  renderMonthBreakdownModal();
  renderCategoryModal();
  renderManageUsersModal(); renderDelMedModal(); renderHealthModal();
  renderHistoryModal();
  renderAdminTransferModal();
  renderPostTransferChoiceModal();
  renderPrivilegeConfirmModal();
  renderReceiptModal();
  renderScanMethodModal();
  renderRecoveryModal();
  renderDatePickerModal();
  renderScanModal();

  const fab = document.getElementById("invFab");
  if(fab){ fab.className = (tab==="inventory" && !inv.showForm) ? "" : "hidden"; }

  if(id){
    const el = document.getElementById(id);
    if(el && isTextField && el !== active && el.parentNode && el.tagName===active.tagName){
      // The real fix for dropped characters while typing fast: a full-section rebuild
      // recreates this exact input as a brand-new DOM node even when nothing about its own
      // value actually needed to change (it was already kept in sync via oninput before this
      // render ever ran). Swapping the ORIGINAL node back into the new one's place — rather
      // than just focusing the new node — means the input the user is actively typing into is
      // never destroyed in the first place, so an Android keyboard's in-progress composition
      // (how fast/batched typing is often delivered) can't get silently interrupted mid-word.
      // Its oninput/attributes never differ between renders for the same id, so the original
      // node's own handler stays correctly wired with nothing to re-attach.
      el.parentNode.replaceChild(active, el);
      if(selStart!=null && active.setSelectionRange){ try{ active.setSelectionRange(selStart, selEnd); }catch(e){} }
      active.focus();
    } else if(el){
      el.focus();
      if(selStart!=null && el.setSelectionRange){ try{ el.setSelectionRange(selStart, selEnd); }catch(e){} }
    }
  }
  syncMenuHistory();
  syncHeaderOffset();
  if(appEl && appEl.scrollTop !== prevScrollTop) appEl.scrollTop = prevScrollTop;
}

function billMedTotal(){ return r2(bill.items.reduce((s,it)=>s+(Number(it.subtotal)||0),0)); }
function billManualMedDisc(){ return r2(Math.min(Math.max(Number(bill.medsDiscount)||0,0), billMedTotal())); }
// "Total discount" (Rs or %) is split across medicines / tests / doctor fee in proportion to what each costs,
// and the result flows through the existing per-section discounts — so records, receipts, reports and edits
// all keep working without knowing about it. Others (dressing, transport…) are never discounted, so a % discount
// is worked out only on what can actually be discounted (medicines + tests + doctor fee), not on the whole bill.
function billTotDiscShares(){
  const zero={med:0,tests:0,fee:0,total:0}, v=Number(bill.totDisc)||0;
  if(!(v>0)) return zero;
  const m=r2(billMedTotal()-billManualMedDisc()), t=r2(billTestsGross()-billManualTestsDisc()), f=bill.feeIncluded ? r2(billFeeGross()-billManualFeeDisc()) : 0;
  const cap=r2(m+t+f); if(cap<=0) return zero;
  let D = (bill.totDiscMode==='pct') ? r2(cap*Math.min(v,100)/100) : r2(v);
  D = Math.min(D, cap);
  let sm=Math.min(m,r2(D*m/cap)), st=Math.min(t,r2(D*t/cap)), sf=Math.min(f,r2(D*f/cap));
  const rem=r2(D-sm-st-sf);
  if(rem!==0){
    if(m>=t && m>=f) sm=Math.min(m,r2(sm+rem)); else if(t>=f) st=Math.min(t,r2(st+rem)); else sf=Math.min(f,r2(sf+rem));
  }
  return {med:sm,tests:st,fee:sf,total:r2(sm+st+sf)};
}
function billMedDiscount(){ return r2(billManualMedDisc()+billTotDiscShares().med); }
function onBillTotDisc(v){ bill.totDisc=v; scheduleRender(); }
function setBillTotDiscMode(m){ bill.totDiscMode=m; render(); }
function billMedNet(){ return r2(billMedTotal() - billMedDiscount()); }
function billExtrasTotal(){ return r2(bill.extras.reduce((s,it)=>s+(Number(it.amount)||0),0)); }
function billTestsGross(){ return r2(bill.tests.reduce((s,t)=>s+(Number(t.amount)||0),0)); }
function billManualTestsDisc(){ return r2(Math.min(Math.max(Number(bill.testsDiscount)||0,0), billTestsGross())); }
function billTestsDiscount(){ return r2(billManualTestsDisc()+billTotDiscShares().tests); }
function billTestsTotal(){ return r2(billTestsGross() - billTestsDiscount()); }
function billFeeGross(){ return r2(Math.max(Number(bill.fee)||0,0)); }
function billManualFeeDisc(){ return r2(Math.min(Math.max(Number(bill.feeDiscount)||0,0), billFeeGross())); }
function billFeeDiscount(){ return r2(billManualFeeDisc()+billTotDiscShares().fee); }
function billFeeNet(){ return r2(billFeeGross() - billFeeDiscount()); }
function billFeeContribution(){ return bill.feeIncluded ? billFeeNet() : 0; }
function billGrandTotal(){ return r2(billMedNet() + billExtrasTotal() + billTestsTotal() + billFeeContribution()); }

function saveAllTestPrices(){
  const builtIn = {}; TEST_CATALOG.forEach(t=>builtIn[t.id]=t.name);
  const touchedIds = [];
  allTests().forEach(t=>{
    const val = Number(testPriceDraft[t.id])||0;
    const prevPrice = testPrices[t.id];
    const newPrice = val>0 ? val : undefined;
    if(newPrice!==prevPrice){
      if(val>0) testPrices[t.id]=val; else delete testPrices[t.id];
      touchedIds.push(t.id);
    }
    const nameVal = (testNameDraft[t.id]||"").trim();
    if(!nameVal) return; // never allow a blank name to wipe a test's name
    const custom = customTests.find(ct=>ct.id===t.id);
    if(custom){
      if(custom.name!==nameVal){ custom.name = nameVal; touchedIds.push(t.id); }
    } else if(builtIn[t.id] !== undefined){
      const prevOverride = testNameOverrides[t.id];
      const newOverride = (nameVal !== builtIn[t.id]) ? nameVal : undefined;
      if(newOverride!==prevOverride){
        if(newOverride!=null) testNameOverrides[t.id] = newOverride; else delete testNameOverrides[t.id];
        touchedIds.push(t.id);
      }
    }
  });
  saveTestPrices();
  saveCustomTests();
  saveTestNameOverrides();
  // Only bump the ids that actually changed — so tests nobody touched in this edit keep

// whenever the whole-bill fee amount itself changes, so it always tracks the current "last"
// special item instead of staying stuck on one that may have since been removed.
function recomputeWholeApplyingFee(){
  const specials = bill.items.filter(it=>it.special);
  specials.forEach(it=>{
    if(it.feeMode==='whole'){
      it.appliedFee = 0;
      it.subtotal = it.baseSubtotal;
      it.note = it.baseNote||"";
      it.feeMode = null;
    }

  if(bill.applyingFeeMode==='whole' && specials.length){
    const fee = Number(bill.wholeApplyingFee)||0;
    const last = specials[specials.length-1];
    last.feeMode = 'whole';
    last.appliedFee = fee;
    last.subtotal = r2(last.baseSubtotal + fee);
    last.note = fee>0 ? `${last.baseNote?last.baseNote+" · ":""}+applying fee ${CURRENCY}${money(fee)}` : (last.baseNote||"");

let toastTimer = null;
// onTap (optional): makes the toast itself tappable — underlined, and left up longer (a plain
// toast reads in under 1.8s; one worth tapping needs more time than that to actually be tapped).
// Tapping it calls onTap and dismisses the toast; it also still auto-hides either way.
function showToast(msg, onTap){
  const el = document.getElementById("toast");
  el.textContent = msg;
  el.classList.remove("hidden");
  el.classList.toggle("tappable", !!onTap);
  el.onclick = onTap ? ()=>{ el.classList.add("hidden"); clearTimeout(toastTimer); onTap(); } : null;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>{ el.classList.add("hidden"); }, onTap ? 5000 : 1800);
}
// Shows exactly what the last scanned barcode/QR code contained, even when nothing in it could
// be used to fill the form — so a scan that "did nothing" is never just a dead end. Reuses the
// same raw-text + hex display already used for a code that doesn't parse as GS1 at all.
function revealLastScan(){
  const s = window.__lastScan;
  if(!s || !s.text) return;
  const hex = Array.from(s.text.slice(0,24)).map(c=>c.charCodeAt(0).toString(16).padStart(2,"0")).join(" ");
  openShare("Scanned text (" + s.text.length + " characters):\n" + visibleScanText(s.text) + "\n\nFirst bytes (hex): " + hex);
}

function completeBill(){
  if(!canCompleteBill()) return;
  const _undoSnap = captureUndoSnap();
  const _retDraft = retPending() ? JSON.parse(JSON.stringify(retUi)) : null;
  const retTx = retPending() ? retCommit() : null;      // returned medicine goes back into stock first, so it can be sold again in this same bill
  const hasSale = bill.items.length>0 || (bill.feeIncluded && Number(bill.fee)>0) || bill.extras.length>0 || bill.tests.length>0;
  if(!hasSale){                                          // return only: nothing new was sold
    // Save the transaction record before the stock change it describes (see the matching note
    // below) — if the app is interrupted between the two saves, the result is a return record
    // whose stock hasn't been put back yet (noticeable and fixable), not stock silently moving
    // with no record of why.
    saveTransactions(); saveInventory();
    const refund = retTx ? -retTx.grandTotal : 0;
    const _savedBill = bill; bill = newBillState(); retReset(); render();
    if(retTx){
      // same green tick + Undo bar as a normal bill; Undo puts the stock back and brings the return screen back as it was
      showBillSavedUi(retTx, _savedBill, _undoSnap);
      if(_undoInfo){ _undoInfo.retTxId = retTx.id; _undoInfo.retDraft = _retDraft; }
    } else showToast(`✓ Return saved — give ${CURRENCY}${money(refund)} back`);
    return;
  }
  // Give every line a stable id of its own, separate from its position in the array. Returns record
  // which line they came from using this id (srcLid, below) instead of a raw array index, so that if
  // the bill is later edited and its lines get reordered/added/removed, existing returns still point
  // at the exact same line rather than silently landing on whatever now happens to sit at that index.
  bill.items.forEach(it=>{ if(it.lid==null) it.lid = uid(); });
  bill.items.forEach(it=>{
    const med = inventory.find(m=>m.id===it.medId);
    if(med){ it.ded = deductStock(med, it.pills); if(lastDeductExpiry) it.exp = lastDeductExpiry; else delete it.exp; it.dedBatches = lastDeductBatches; }   // remember what really left stock (overselling allowed), its expiry, and exactly which batch(es) it came from
  });
  const tx = { id:uid(), timestamp:Date.now(), updatedAt:Date.now(), patientName:bill.patient.trim() || (_retDraft && _retDraft.name) || "",
    doctorFee: bill.feeIncluded?billFeeGross():0, feeDiscount: bill.feeIncluded?billFeeDiscount():0, items:bill.items, medTotal:billMedTotal(), medsDiscount:billMedDiscount(),
    extras:bill.extras, extrasTotal:billExtrasTotal(),
    tests:bill.tests, testsTotal:billTestsGross(), testsDiscount:billTestsDiscount(),
    paymentMode: bill.paymentMode||"Cash", remarks: (bill.remarks||"").trim(),
    grandTotal:billGrandTotal() };
  transactions.unshift(tx);
  logActivity("bill_add", `${tx.patientName||"Bill"} · ${money(tx.grandTotal)}`);
  // Save the bill record BEFORE the stock deduction it describes. Stock was already deducted
  // in memory above (so the receipt/printout below is correct either way) — this only changes
  // which of the two localStorage/cloud writes lands first. If the app gets killed between them,
  // you're left with a bill that exists but whose stock hasn't been written down yet, which is
  // visible and recoverable (re-open the app, the deduction simply hasn't persisted) — instead
  // of the old order, where stock could vanish from inventory with no bill on record to explain
  // where it went.
  saveTransactions();
  saveInventory();
  autoPrintAfterBill(tx);
  const _savedBill = bill; bill = newBillState(); retReset();
  render();
  showBillSavedUi(tx, _savedBill, _undoSnap);
  if(_undoInfo){ _undoInfo.retTxId = retTx ? retTx.id : null; _undoInfo.retDraft = _retDraft; }
}

function buildBillText(tx){
  if(isReturnTx(tx)) return buildReturnText(tx);
  const lines = [`🏥 Patient Bill`, `Patient: ${tx.patientName}`, `Date: ${fmtDateTime(tx.timestamp)}`, `Mode of Payment: ${tx.paymentMode||"Cash"}`];
  if(tx.remarks) lines.push(`Remarks: ${tx.remarks}`);
  lines.push(``);
  if(tx.items.length){
    lines.push(`Medicines:`);
    tx.items.forEach((it,i)=> lines.push(`${i+1}. ${it.name} — ${fmtInt(it.pills)} medicine${it.note?` (${it.note})`:""} — ${CURRENCY}${money(it.subtotal!=null ? it.subtotal : it.pricePerPill*it.pills)}`));
    if(tx.medsDiscount) lines.push(`Medicines discount: -${CURRENCY}${money(tx.medsDiscount)}`);
    lines.push(``);
  }
  if(tx.tests && tx.tests.length){
    lines.push(`Tests:`);
    tx.tests.forEach((t,i)=> lines.push(`${i+1}. ${t.name} — ${CURRENCY}${money(t.amount)}`));
    if(tx.testsDiscount) lines.push(`Tests discount: -${CURRENCY}${money(tx.testsDiscount)}`);
    lines.push(``);
  }
  if(tx.extras && tx.extras.length){
    lines.push(`Other charges:`);
    tx.extras.forEach((ex,i)=> lines.push(`${i+1}. ${ex.label || "Other charge"} - ${CURRENCY}${money(ex.amount)}`));
    lines.push(``);
  }
  lines.push(`Medicine total: ${CURRENCY}${money((tx.medTotal||0)-(tx.medsDiscount||0))}`);
  if(tx.tests && tx.tests.length) lines.push(`Tests total: ${CURRENCY}${money((tx.testsTotal||0)-(tx.testsDiscount||0))}`);
  lines.push(`Doctor fee: ${CURRENCY}${money((tx.doctorFee||0)-(tx.feeDiscount||0))}`);
  if(tx.feeDiscount) lines.push(`Doctor fee discount: -${CURRENCY}${money(tx.feeDiscount)}`);
  lines.push(`--------------------------`);
  lines.push(`Grand total: ${CURRENCY}${money(tx.grandTotal)}`);
  return lines.join("\n");
}

// --- Thermal receipt printing (ESC/POS) -------------------------------------------------
// Almost every cheap thermal receipt printer — Bluetooth, WiFi, or USB alike — understands
// the same ESC/POS command language, so we build ONE byte sequence here and every transport
// (Bluetooth first, others later) just has the job of delivering these exact bytes.
// Bytes are represented as a JS string where each character's code IS the byte value
// (0–255) — this is the simplest way to smuggle raw binary through the WebViewString bridge,
// which only carries text. On the App Inventor side, BluetoothClient1.CharacterEncoding must
// be set to "ISO-8859-1" so each character is sent as exactly one byte, unchanged.
const PRINTER_PAPER_CHARS = 32; // 32 chars/line ≈ 58mm paper. Change to 48 for 80mm paper.

function padLR(left, right, width){
  left = String(left); right = String(right);
  const space = Math.max(1, width - left.length - right.length);
  if(space < 1) return (left + " " + right).slice(0, width);
  return left + " ".repeat(space) + right;
}

function hexMix(a,b,r){ const pa=[1,3,5].map(i=>parseInt(a.substr(i,2),16)), pb=[1,3,5].map(i=>parseInt(b.substr(i,2),16)); return "#"+pa.map((v,i)=>Math.round(v*r+pb[i]*(1-r)).toString(16).padStart(2,"0")).join(""); }
const DARK_VARS = {"--page":"#0E1417","--card":"#192127","--text":"#E8EEF2","--muted":"#9AA9B6","--faint":"#6F7F8C","--border":"#2B3640","--successSoft":"#12342A","--dangerSoft":"#3A1C19","--warningSoft":"#3A2B12","--special":"#C4B5FD","--specialSoft":"#2E2447"};
// The default violet used for special-category pills (see --special/--specialSoft in :root) sits right next to
// the Purple theme's own header/primary violet, so a special-category pill and a plain category pill became
// almost the same colour once Purple was picked — the one theme where the two are supposed to look different
// stopped showing a difference. Purple swaps --special/--specialSoft for a teal instead, and Green (the default
// theme) swaps them for orange; every other theme keeps the normal violet, which was already picked to stay clear
// of their colours.
const SPECIAL_OVERRIDE = {
  purple: { light:{"--special":"#0E7490","--specialSoft":"#E0F2FE"}, dark:{"--special":"#67E8F9","--specialSoft":"#143442"} },
  green:  { light:{"--special":"#B45309","--specialSoft":"#FFEDD5"}, dark:{"--special":"#FDBA74","--specialSoft":"#3B2410"} }
};
function applyTheme(id){
  const t = THEMES.find(x=>x.id===id) || THEMES[0], root = document.documentElement, st = root.style, dark = isDarkMode();
  root.setAttribute("data-mode", dark ? "dark" : "light");
  Object.keys(DARK_VARS).forEach(k=>{ if(dark) st.setProperty(k, DARK_VARS[k]); else st.removeProperty(k); });
  st.setProperty("--header", t.header);
  st.setProperty("--primary", dark ? hexMix(t.header,"#ffffff",.8) : t.header);
  st.setProperty("--headerSub", t.sub);
  st.setProperty("--primarySoft", dark ? hexMix(t.header,"#192127",.35) : t.soft);
  if(!dark) st.setProperty("--page", t.page);
  const ov = SPECIAL_OVERRIDE[t.id] && SPECIAL_OVERRIDE[t.id][dark?"dark":"light"];
  if(ov) Object.keys(ov).forEach(k=>st.setProperty(k, ov[k]));
  const m=document.querySelector('meta[name="theme-color"]'); if(m) m.setAttribute("content", t.header);
  // Remember exactly what was just applied, so the very next start can paint the right colours from the first frame
  // (see the small script right after the storage workaround at the top of the file). Best effort: if cookies are
  // unavailable nothing changes, the colours are simply applied a moment later as before.
  try{
    const vars = {};
    // Reads back whatever is actually sitting on the root right now — the chosen theme's colours, the dark-mode
    // overrides, and (when Purple or Green) the special-category override above — rather than re-deriving each one,
    // so the saved snapshot can never drift from what was really applied.
    ["--header","--primary","--headerSub","--primarySoft","--page", ...Object.keys(DARK_VARS)].forEach(k=>{ const v=st.getPropertyValue(k); if(v) vars[k]=v.trim(); });
    document.cookie = "cb_theme="+encodeURIComponent(JSON.stringify({ m:dark?"dark":"light", v:vars }))+"; max-age=31536000; path="+location.pathname.replace(/[^\/]*$/,"")+"; SameSite=Lax";
  }catch(e){}
}

function repeatBillFromTx(id){
  const t = transactions.find(x=>x.id===id); if(!t) return;
  const go = ()=>{
    const nb = newBillState(); nb.patient = t.patientName||"";
    let skipped=0, capped=0;
    (t.items||[]).forEach(it=>{
      const med = inventory.find(m=>m.id===it.medId);
      if(!med || med.deleted || it.special){ skipped++; return; }
      const pills = it.pills;
      const lc = lineCalc(med, pills, nb.items.filter(x=>x.medId===med.id).reduce((a,x)=>a+(Number(x.pills)||0),0));
      nb.items.push({ medId:med.id, name:med.name, pills, pricePerPill:lc.pricePerPill, subtotal:lc.subtotal, note:it.note||"", perDay:it.perDay==null?null:it.perDay, linkedToGlobalDays:false });
    });
    bill = nb; toolsUi.open=false;
    if(tab!=="bill") setTab("bill"); else render();
    renderOverlays();
    showToast(skipped||capped ? `Bill copied — ${skipped?skipped+" item(s) skipped (special/removed). ":""}${capped?capped+" quantity adjusted to stock.":""}` : "✓ Previous bill copied — check and complete");
  };
  if(bill.items.length) askConfirm("Replace the bill you're working on with this one?", go, "Replace"); else go();
}

function topSoldMeds(n){
  const cutoff = Date.now()-60*86400000, cnt = {};
  visibleTransactions().forEach(t=>{ if(t.timestamp<cutoff || isReturnTx(t)) return; (t.items||[]).forEach(it=>{ if(!it.special) cnt[it.medId]=(cnt[it.medId]||0)+1; }); });
  return Object.keys(cnt).sort((a,b)=>cnt[b]-cnt[a]).map(id=>inventory.find(m=>m.id===id)).filter(m=>m && !m.deleted && !m.specialCategory).slice(0,n);
}
// Small grey tag after a Frequently-sold name: first letter of the category (S. prefix if tagged) + strength, e.g. "T · 60 mg".
function quickPickTag(m){
  const cat=String(m.category||m.specialCategory||"").trim();
  let letter="";
  if(cat){
    const col = m.specialCategory ? "color:var(--special);opacity:1;" : "";   // special category = yellow letter
    letter = (m.sTag?`<span style="color:var(--danger);opacity:1;">S.</span>`:"")+`<span style="${col}">${esc(cat.charAt(0).toUpperCase())}</span>`;

}

function hideUndoBar(){ const bar=document.getElementById("undoBar"); if(bar) bar.style.display="none"; _undoInfo=null; }
// Reverses exactly what a SALE transaction took out of stock, through the same per-device ledger
// deductStock() used (via returnStockToBatches(), built for fix #4) — not by overwriting the
// medicine's batch list wholesale. This is what makes undo safe across devices: a ledger-based
// reversal merges correctly with whatever another phone did to the same batch in the few seconds
// the Undo button is up, where a raw snapshot restore (the old approach) would silently throw
// that other change away.
function undoReverseSale(t){
  (t.items||[]).forEach(it=>{
    const med = inventory.find(m=>m.id===it.medId); if(!med) return;
    const amt = stockBack(it); if(amt<=0) return;
    returnStockToBatches(med, it.dedBatches, amt, 0);
    med.updatedAt = Date.now();
  });
}
// Reverses a RETURN transaction (medicine that was put back into stock) by taking it back out
// again — the same plain FEFO deduction deleteReturnTx() already uses for exactly this, kept
// consistent with it rather than inventing a second way to undo a return.
function undoReverseReturn(rt){
  (rt.items||[]).forEach(it=>{
    const med = inventory.find(m=>m.id===it.medId); if(!med) return;
    const amt = Math.abs(Number(it.pills)||0); if(amt<=0) return;
    takeBackFromBatches(med, it.retBatches, amt);   // same as deleteReturnTx(): the exact batches, FEFO only for what can't be matched
    med.updatedAt = Date.now();
  });
}
function undoLastBill(){
  const u=_undoInfo; if(!u) return; hideUndoBar();
  const t=transactions.find(x=>x.id===u.txId); if(!t || t.deleted){ return; }
  if(isReturnTx(t)) undoReverseReturn(t); else undoReverseSale(t);
  t.deleted=true; t.updatedAt=Date.now(); logActivity("bill_del", (t.patientName||"Bill")+" (undone)");
  const _rt = u.retTxId ? transactions.find(x=>x.id===u.retTxId) : null;
  if(_rt && !_rt.deleted){ undoReverseReturn(_rt); _rt.deleted=true; _rt.updatedAt=Date.now(); }
  saveInventory(); saveTransactions();
  bill=u.savedBill; if(u.retDraft) retUi=u.retDraft; if(tab!=="bill") setTab("bill"); else render();
  showToast(t.kind==="return" ? "↩ Return undone — stock and totals are back as they were." : "↩ Bill undone — stock restored. A receipt that already printed can't be recalled.");
}

// app, not to this page, so the page can only TELL the Blocks which colour to use: "THEME_COLOR:r,g,b" (three plain numbers, e.g.
// THEME_COLOR:15,92,87 — easy for Blocks: split at "," and feed the list straight into "make color") through WebViewString,
// the same outbound pattern as EXPORT: and SELECT_PRINTER. Sent when the theme or appearance is changed, and once shortly after
// the app opens (after the installed-APK number has been read, because it travels through the same string). Phones that
// have no matching Blocks simply ignore it.
let _lastThemeColourSent = "";

  try{

      const rgb = [1,3,5].map(i=>parseInt(c.substr(i,2),16)).join(",");

}
